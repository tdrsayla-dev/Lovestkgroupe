  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { LayoutDashboard, ShoppingCart, Users, Contact, Headset, BarChart3, Plus, Edit, Trash2, UserCircle, Menu, X, Save, Info, PackageIcon, Package, Target, Trophy, Activity, Eye, Tags, GitBranch, Archive, ChevronDown, FileText, SettingsIcon, Coins, ShieldCheck, AlertTriangle, AlertCircle, LoginModal, Toast, Sidebar, Header, ConfirmModal, EditModal, DonutChart, AutoSuggestInput } = window;
    
    

    const IconProps = { fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" };
    const SearchIcon = ({ size = 18 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
    const FilterIcon = ({ size = 18 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>;
    const CalendarIcon = ({ size = 18 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
    const PillIcon = ({ size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/></svg>;
    const CheckCircle = ({ size = 18 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const RefreshCw = ({ size = 18 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>;
    const InboxIcon = ({ size = 48 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>;

    // ฟังก์ชันช่วยแปลงชื่อประเภทราคา (เช่น ราคาส่ง/สมาชิก, ราคาโปร, ราคาปกติ, แถมฟรี)
    function getItemTypeLabel(item) {
      const typeVal = item.type || item.priceType || item.tier || '';
      const nameVal = item.name || '';

      if (typeVal === 'high' || typeVal === 'ส่ง/สมาชิก' || typeVal === 'ราคาส่ง/สมาชิก' || nameVal.includes('(ส่ง/สมาชิก)')) {
        return 'ราคาส่ง/สมาชิก';
      }
      if (typeVal === 'promo' || typeVal === 'โปร' || typeVal === 'ราคาโปร' || nameVal.includes('(โปร)')) {
        return 'ราคาโปร';
      }
      if (typeVal === 'free' || typeVal === 'แถมฟรี' || nameVal.includes('(แถมฟรี)')) {
        return 'แถมฟรี';
      }
      if (typeVal && typeVal !== 'ONE' && typeVal !== 'ปกติ' && typeVal !== 'normal') {
        return typeVal;
      }
      return 'ราคาปกติ';
    }

    // ฟังก์ชันช่วยสกัด ID / Visit ID ทุกรูปแบบที่เป็นไปได้เพื่อใช้เทียบและลบข้อมูลถาวร
    function getNormalizedIds(val) {
      if (!val) return [];
      const str = String(val).trim();
      if (!str || str === '-') return [];
      const set = new Set();
      set.add(str);
      set.add(str.toLowerCase());

      // สกัดตัวเลขล้วน (เช่น 137364 จาก VIS-137364)
      const digits = str.replace(/[^0-9]/g, '');
      if (digits.length >= 3) {
        set.add(digits);
        set.add(`VIS-${digits}`);
        set.add(`VISIT: ${digits}`);
        set.add(`VISIT:${digits}`);
        set.add(`ORD-CLINIC-${digits}`);
        set.add(`ORD-CLINIC-VIS-${digits}`);
      }

      // สกัด prefix คำว่า VIS- หรือ ORD-CLINIC- ออก
      const stripped = str.replace(/^(ORD-CLINIC-|VISIT:\s*|VIS-?)/gi, '').trim();
      if (stripped) {
        set.add(stripped);
        set.add(`VIS-${stripped}`);
        set.add(`ORD-CLINIC-${stripped}`);
        set.add(`ORD-CLINIC-VIS-${stripped}`);
      }

      return Array.from(set);
    }

    function isOrderDeleted(item, deletedSet) {
      if (!item || !deletedSet || deletedSet.size === 0) return false;
      const candidates = [
        item.id,
        item.order_id,
        item.sale_id,
        item.visit_id,
        item.rxVisitId,
        item.payment_note
      ];
      for (const cand of candidates) {
        if (!cand) continue;
        const normList = getNormalizedIds(cand);
        for (const norm of normList) {
          if (deletedSet.has(norm) || deletedSet.has(norm.toLowerCase())) return true;
        }
      }
      return false;
    }

    function NutrientsView() {
      const [orders, setOrders] = useState([]);
      const [searchTerm, setSearchTerm] = useState('');
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');
      const [quickFilter, setQuickFilter] = useState('all'); // 'today', 'month', 'all', 'custom'
      const [loading, setLoading] = useState(true);

      const setFilterPeriod = (period) => {
        setQuickFilter(period);
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const todayStr = `${year}-${month}-${day}`;

        if (period === 'today') {
          setStartDate(todayStr);
          setEndDate(todayStr);
        } else if (period === 'month') {
          const lastDay = new Date(year, now.getMonth() + 1, 0).getDate();
          const lastDayStr = String(lastDay).padStart(2, '0');
          setStartDate(`${year}-${month}-01`);
          setEndDate(`${year}-${month}-${lastDayStr}`);
        } else if (period === 'all') {
          setStartDate('');
          setEndDate('');
        }
      };

      // โหลดข้อมูลจาก Supabase เป็นหลัก + sync LocalStorage → Supabase อัตโนมัติ
      const fetchOrders = async (showLoading = true) => {
        if (showLoading) setLoading(true);
        let dbList = [];
        let localList = [];

        // ─── โหลด Blacklist รายการที่ถูกลบไปแล้ว และแปลงทุกรูปแบบ ID ────────────────
        const deletedIdsList = JSON.parse(localStorage.getItem('stk_deleted_nutrient_orders') || '[]');
        const deletedIdsSet = new Set();
        deletedIdsList.forEach(id => {
          getNormalizedIds(id).forEach(v => {
            deletedIdsSet.add(v);
            deletedIdsSet.add(v.toLowerCase());
          });
        });

        // ─── 1. ดึงจาก Supabase (ข้อมูลถาวร) ────────────────────────────────
        try {
          if (typeof window.supabaseSelect === 'function') {
            const data = await window.supabaseSelect('stk_nutrient_orders', 'order=created_at.desc&limit=200&nocache=true');
            if (Array.isArray(data)) {
          dbList = data.map(item => {
            // หากบิลถูกยกเลิก หรืออยู่ในประวัติการลบ ให้ปรับสถานะเป็นบิลถูกยกเลิกเพื่อนำไปโชว์ในแท็บแทน
            const finalStatus = (item.status === 'บิลถูกยกเลิก' || isOrderDeleted(item, deletedIdsSet)) ? 'บิลถูกยกเลิก' : (item.status || 'รอดำเนินการ');
            
            return {
              id: item.order_id || String(item.id),
              visit_id: item.visit_id || '-',
              hn: item.hn || '-',
              customer_name: item.customer_name || '-',
              phone: item.phone || item.customer_phone || item.tel || '-',
              disease: item.disease || item.disease_name || item.symptom || item.symptoms || '-',
              recorded_by: item.recorded_by || '-',
              closer_dr: item.closer_dr || '-',
              date: item.date || item.created_at || new Date().toISOString(),
              status: finalStatus,
              items: (() => {
                try {
                  let parsed = item.items_json || item.items || item.products;
                  if (typeof parsed === "string") parsed = JSON.parse(parsed);
                  return Array.isArray(parsed) ? parsed : [];
                } catch(e) { return []; }
              })()
            };
          });
        }
          }
        } catch (err) {
          console.warn('Supabase fetch nutrient_orders error:', err);
        }

        // ─── 2. ดึงจาก LocalStorage และ sync ที่ยังไม่มีใน DB ───────────────
        try {
          const localNutrient = JSON.parse(localStorage.getItem('stk_nutrient_orders') || '[]');
          const localClinicMlm = JSON.parse(localStorage.getItem('clinic_mlm_orders') || '[]');
          const rawCombined = [...localNutrient, ...localClinicMlm];

          const dbIdSet = new Set(dbList.map(o => o.id));

          for (const item of rawCombined) {
            let parsedItems = [];
            try {
              parsedItems = typeof item.items === 'string' ? JSON.parse(item.items) : (item.items || item.products || item.items_json || []);
              if (typeof parsedItems === 'string') parsedItems = JSON.parse(parsedItems);
            } catch(e) { parsedItems = []; }

            const vId = item.visit_id || (item.payment_note && item.payment_note.match(/VISIT:\s*([^\)\s]+)/) ? item.payment_note.match(/VISIT:\s*([^\)\s]+)/)[1] : null) || item.rxVisitId || `VIS-${item.id}`;
            const orderId = item.id || item.sale_id || item.order_id || `ORD-CLINIC-${vId}`;

            // ข้ามหากอยู่ในรายการที่ถูกลบไปแล้ว
            // ข้ามหากอยู่ในรายการที่ถูกลบไปแล้ว
            

            // เปลี่ยนจาก continue ทิ้ง เป็นการอัปเดตสถานะให้อยู่ในแท็บยกเลิกแทน
            let finalLocalStatus = item.status || 'รอดำเนินการ';
            if (finalLocalStatus === 'บิลถูกยกเลิก' || isOrderDeleted(item, deletedIdsSet) || isOrderDeleted({ id: orderId, visit_id: vId }, deletedIdsSet)) {
                finalLocalStatus = 'บิลถูกยกเลิก';
            }

            const normalizedItems = Array.isArray(parsedItems) ? parsedItems.map(it => ({
              id: it.id,
              name: it.name || it.product_name || it.title || 'สารอาหาร',
              source: it.source || it.sourceLabel || 'คลังยา',
              type: it.type || it.priceType || it.tier || 'ราคาปกติ',
              priceType: it.priceType || it.type || it.tier || 'ราคาปกติ',
              tier: it.tier || 'normal',
              qty: Number(it.qty || it.quantity || 1),
              price: Number(it.price || it.unit_price || 0),
              total: Number(it.total || (it.price * it.qty) || 0)
            })) : [];

            const localEntry = {
              id: orderId,
              visit_id: vId,
              hn: item.hn || item.customer_id || '-',
              customer_name: item.customer_name || item.patientName || item.patient_name || '-',
              phone: item.phone || item.customer_phone || item.tel || item.patientPhone || '-',
              disease: item.disease || item.disease_name || item.symptom || item.symptoms || item.chief_complaint || '-',
              recorded_by: item.recorded_by || item.seller_id || '-',
              closer_dr: item.closer_dr || '-',
              date: item.created_at || item.date || new Date().toISOString(),
              status: finalLocalStatus,
              items: normalizedItems
            };

            

            // ─── Sync ขึ้น Supabase ถ้ายังไม่มี ───────────────────────────
            if (!dbIdSet.has(orderId) && orderId && vId && vId !== '-') {
              try {
                const upsertPayload = {
                  order_id: orderId,
                  visit_id: vId,
                  hn: localEntry.hn,
                  customer_name: localEntry.customer_name,
                  recorded_by: localEntry.recorded_by,
                  date: localEntry.date ? localEntry.date.split('T')[0] : new Date().toISOString().split('T')[0],
                  status: localEntry.status,
                  items_json: JSON.stringify(normalizedItems)
                };
                if (typeof window.supabaseInsert === 'function') {
                  await window.supabaseInsert('stk_nutrient_orders', upsertPayload);
                }
                dbIdSet.add(orderId);
              } catch(syncErr) {
                console.warn('Sync to Supabase failed:', syncErr);
              }
              localList.push(localEntry);
            } else if (!dbIdSet.has(orderId)) {
              localList.push(localEntry);
            }
          }
        } catch (ex) {
          console.warn('LocalStorage parse error:', ex);
        }

        // ─── 3. รวมและ deduplicate ────────────────
        const idMap = new Map();
        [...dbList, ...localList].forEach(o => {
          if (o.visit_id && o.visit_id !== '-' && !idMap.has(o.id) && !isOrderDeleted(o, deletedIdsSet)) {
            idMap.set(o.id, o);
          }
        });

        setOrders(Array.from(idMap.values()));
        setLoading(false);
      };

      useEffect(() => {
        fetchOrders(true);
        const handleStorageChange = (e) => {
          if (!e || !e.key || e.key === 'stk_nutrient_orders' || e.key === 'clinic_mlm_orders' || e.key === 'stk_refresh_trigger') {
            fetchOrders(false);
          }
        };
        window.addEventListener('storage', handleStorageChange);

        let bc = null;
        if (typeof BroadcastChannel !== 'undefined') {
          try {
            bc = new BroadcastChannel('stk_mlm_channel');
            bc.onmessage = (msg) => {
              if (msg && msg.data) fetchOrders(false);
            };
          } catch(ex) {}
        }

        const intervalId = setInterval(() => {
          fetchOrders(false);
        }, 5000);

        return () => {
          window.removeEventListener('storage', handleStorageChange);
          if (bc) bc.close();
          clearInterval(intervalId);
        };
      }, []);

      // กรองรายการตามคำค้นหา และ ช่วงเวลา
      const filteredOrders = useMemo(() => {
        return orders.filter(ord => {
          const search = searchTerm.trim().toLowerCase();
          const matchSearch = !search || 
            (ord.visit_id && ord.visit_id.toLowerCase().includes(search)) ||
            (ord.hn && ord.hn.toLowerCase().includes(search)) ||
            (ord.customer_name && ord.customer_name.toLowerCase().includes(search)) ||
            (ord.items && ord.items.some(i => (i.name || '').toLowerCase().includes(search)));

          const ordDate = ord.date ? ord.date.split('T')[0] : '';
          const matchStart = !startDate || ordDate >= startDate;
          const matchEnd = !endDate || ordDate <= endDate;

          return matchSearch && matchStart && matchEnd;
        });
      }, [orders, searchTerm, startDate, endDate]);

      // เพิ่ม State ควบคุมแท็บ
const [activeTab, setActiveTab] = useState('pending'); // 'pending', 'completed', 'canceled'

const pendingOrders = useMemo(() => {
  return filteredOrders.filter(ord => ord.status !== 'ขายสำเร็จแล้ว' && ord.status !== 'บิลถูกยกเลิก');
}, [filteredOrders]);

const completedOrders = useMemo(() => {
  return filteredOrders.filter(ord => ord.status === 'ขายสำเร็จแล้ว');
}, [filteredOrders]);

const canceledOrders = useMemo(() => {
  return filteredOrders.filter(ord => ord.status === 'บิลถูกยกเลิก');
}, [filteredOrders]);

      // ฟังก์ชันดำเนินการสร้าง "ร่างใบสั่งซื้อ" / "จ่ายยาเสร็จสิ้น"
      const handleCreateDraftOrder = async (order) => {
        // --- ⚡ เพิ่มการตรวจสอบสต็อกแบบ Real-time ก่อนร่างใบสั่งซื้อ ---
        try {
          if (typeof window.supabaseSelect === 'function') {
            const outOfStockItems = [];
            
            // แสดง Loading ขณะเช็คสต็อก
            Swal.fire({
              title: 'กำลังตรวจสอบสต็อก...',
              allowOutsideClick: false,
              didOpen: () => { Swal.showLoading(); }
            });

            for (const item of order.items) {
              const pName = (item.name || '').trim();
              let currentStock = null;
              
              // 1. ลองค้นหาใน stk_products (แก้ไขคอลัมน์จาก product_name เป็น name และดักจับ Error)
              let pData = null;
              try {
                pData = await window.supabaseSelect('stk_products', `name=eq.${encodeURIComponent(pName)}&select=current_stock`);
              } catch (e) { /* ปล่อยผ่านถ้าไม่มีตารางนี้ */ }

              if (pData && pData.length > 0) {
                currentStock = parseInt(pData[0].current_stock) || 0;
              } else {
                // 2. ถ้าไม่พบ ลองหาใน products (เผื่อเป็นตารางเก่า)
                let pData2 = null;
                try {
                  pData2 = await window.supabaseSelect('products', `name=eq.${encodeURIComponent(pName)}&select=stock`);
                } catch (e) { /* ปล่อยผ่านถ้าไม่มีตารางนี้ */ }
                
                if (pData2 && pData2.length > 0) {
                  currentStock = parseInt(pData2[0].stock) || 0;
                }
              }

              const qtyNeeded = parseInt(item.qty) || 1;
              if (currentStock !== null && currentStock < qtyNeeded) {
                outOfStockItems.push(`${pName} (มี ${currentStock} ชิ้น, ต้องการ ${qtyNeeded} ชิ้น)`);
              }
            }

            if (outOfStockItems.length > 0) {
              Swal.fire({
                icon: 'error',
                title: 'สินค้าหมดสต็อก!',
                html: `ไม่สามารถร่างใบสั่งซื้อได้เนื่องจากสินค้าดังต่อไปนี้มีสต็อกไม่เพียงพอ:<br/><br/><ul class="text-left text-sm text-rose-600 list-disc pl-6">${outOfStockItems.map(i => `<li>${i}</li>`).join('')}</ul>`,
                confirmButtonColor: '#047857',
                confirmButtonText: 'ตกลง'
              });
              return; // หยุดการทำงาน ไม่ให้ร่างบิล
            } else {
              Swal.close(); // ปิด loading ถ้าสต็อกพอ
            }
          }
        } catch (e) {
          console.warn('Stock check error:', e);
          Swal.close();
        }
        // -------------------------------------------
        
        Swal.hideLoading();

        Swal.fire({
          title: 'ยืนยันสร้างร่างใบสั่งซื้อ',
          html: `
            <div class="text-left text-sm space-y-2 p-2">
              <p><strong>รหัส VISIT:</strong> <span class="text-blue-600 font-bold">${order.visit_id}</span></p>
              <p><strong>HN:</strong> ${order.hn}</p>
              <p><strong>ชื่อคนไข้:</strong> ${order.customer_name}</p>
              <p><strong>เบอร์โทร:</strong> ${order.phone || '-'}</p>
              <p><strong>โรค/อาการ:</strong> ${order.disease || '-'}</p>
              <p><strong>ผู้แนะนำ:</strong> ${order.recorded_by}</p>
              <p><strong>หมอผู้สั่งจ่ายยา:</strong> ${order.closer_dr || '-'}</p>
              <hr/>
              <p class="font-bold text-slate-700">รายการยา:</p>
              <ul class="list-disc pl-5 text-[11px] text-slate-600 space-y-1">
  ${order.items.map(i => {
      const price = (i.price !== undefined && i.price !== null && i.price !== '') ? Number(i.price) : 1300;
      const qty = Number(i.qty || 1);
      return `<li>${i.name} (${getItemTypeLabel(i)}) x ${qty} = ${(price * qty).toLocaleString()} ฿</li>`;
  }).join('')}
</ul>
<div class="mt-3 p-2 bg-emerald-50 rounded-lg border border-emerald-200 flex justify-between items-center font-bold text-emerald-800">
  <span>ราคารวมทั้งหมด:</span>
  <span>${order.items.reduce((s, i) => {
      const price = (i.price !== undefined && i.price !== null && i.price !== '') ? Number(i.price) : 1300;
      const qty = Number(i.qty || 1);
      return s + (price * qty);
  }, 0).toLocaleString()} ฿</span>
</div>
          `,
          icon: 'question',
          showCancelButton: true,
          confirmButtonColor: '#047857',
          cancelButtonColor: '#64748b',
          confirmButtonText: 'ร่างใบสั่งซื้อใน M&M',
          cancelButtonText: 'ยกเลิก'
        }).then((result) => {
          if (result.isConfirmed) {
            try {
              const pendingSale = {
                visit_id: order.visit_id,
                hn: order.hn,
                customer_name: order.customer_name,
                phone: order.phone,
                disease: order.disease,
                recorded_by: order.recorded_by,
                closer_dr: order.closer_dr || '',
                items: (order.items || []).map(i => {
                  const typeLabel = typeof getItemTypeLabel === 'function' ? getItemTypeLabel(i) : (i.type || i.priceType || '');
                  return {
                    ...i,
                    type: typeLabel,
                    priceType: typeLabel
                  };
                })
              };
              localStorage.setItem('stk_pending_sale', JSON.stringify(pendingSale));
            } catch (ex) {}

            Swal.fire({
              icon: 'success',
              title: 'ส่งข้อมูลเข้าสู่หน้าขายเรียบร้อย!',
              text: `กำลังนำข้อมูลสำหรับ ${order.customer_name} (VISIT: ${order.visit_id}) ไปเปิดบิลที่หน้าป้อนข้อมูลขาย (Sales)...`,
              confirmButtonColor: '#047857',
              timer: 1200,
              showConfirmButton: false
            }).then(() => {
              const targetUrl = window.resolvePageUrl ? window.resolvePageUrl('Sales.html') : 'Sales.html';
              window.location.href = targetUrl;
            });
          }
        });
      };

      // 🗑️ ฟังก์ชันลบ / ยกเลิกรายการสั่งจ่ายยา (ตอบสนองเร็ว 0ms + ลบแบบขนานหลังบ้าน)
      const handleDeleteOrder = (order) => {
        if (typeof Swal === 'undefined') return;
        
        Swal.fire({
          title: 'ยืนยันการลบรายการสั่งจ่ายยา',
          html: `
            <div class="text-left text-sm space-y-2 p-2">
              <p class="text-slate-600 font-medium">คุณต้องการลบรายการสั่งจ่ายยานี้ใช่หรือไม่?</p>
              <div class="p-3 bg-red-50 text-red-900 rounded-xl border border-red-200 mt-2 space-y-1">
                <p><strong>รหัส VISIT:</strong> <span class="text-red-700 font-bold">${order.visit_id}</span></p>
                <p><strong>HN:</strong> ${order.hn}</p>
                <p><strong>ชื่อคนไข้:</strong> ${order.customer_name}</p>
                <p><strong>โรค/อาการ:</strong> ${order.disease || '-'}</p>
              </div>
              <p class="text-xs text-rose-600 font-bold mt-2">⚠️ เมื่อลบแล้ว รายการนี้จะถูกลบออกจากรายการรอดำเนินการ</p>
            </div>
          `,
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#dc2626',
          cancelButtonColor: '#64748b',
          confirmButtonText: 'ยืนยันลบรายการ',
          cancelButtonText: 'ยกเลิก'
        }).then((result) => {
          if (result.isConfirmed) {
            // ⚡ 1. อัปเดต Blacklist และ LocalStorage ทันที (0ms Response)
            try {
              const deletedList = JSON.parse(localStorage.getItem('stk_deleted_nutrient_orders') || '[]');
              const idsToAdd = [
                ...getNormalizedIds(order.id),
                ...getNormalizedIds(order.visit_id),
                ...getNormalizedIds(order.hn)
              ];
              idsToAdd.forEach(id => {
                if (id && !deletedList.includes(id)) deletedList.push(id);
              });
              localStorage.setItem('stk_deleted_nutrient_orders', JSON.stringify(deletedList));
            } catch (e) {}

            const newDeletedList = JSON.parse(localStorage.getItem('stk_deleted_nutrient_orders') || '[]');
            const newDeletedSet = new Set();
            newDeletedList.forEach(id => {
              getNormalizedIds(id).forEach(v => {
                newDeletedSet.add(v);
                newDeletedSet.add(v.toLowerCase());
              });
            });

            // ⚡ 2. อัปเดต React State ให้สถานะเปลี่ยนเป็นบิลยกเลิกทันที (0ms) เพื่อเด้งเข้าแท็บยกเลิก
            setOrders(prev => prev.map(o => {
                if (isOrderDeleted(o, newDeletedSet)) {
                    return { ...o, status: 'บิลถูกยกเลิก' };
                }
                return o;
            }));

            // ⚡ 3. กวาดล้างแคช LocalStorage & SessionStorage ทันที
            try {
              sessionStorage.removeItem('stk_db_cache');
              if (typeof window.top !== 'undefined') window.top.stkDbCache = {};

              const keysToClean = ['stk_nutrient_orders', 'clinic_mlm_orders', 'clinic_orders', 'rx_orders'];
              keysToClean.forEach(key => {
                const str = localStorage.getItem(key);
                if (str) {
                  try {
                    const list = JSON.parse(str);
                    if (Array.isArray(list)) {
                      const updated = list.filter(o => !isOrderDeleted(o, newDeletedSet));
                      localStorage.setItem(key, JSON.stringify(updated));
                    }
                  } catch(e) {}
                }
              });

              const pendingSaleStr = localStorage.getItem('stk_pending_sale');
              if (pendingSaleStr) {
                try {
                  const pendingSale = JSON.parse(pendingSaleStr);
                  if (isOrderDeleted(pendingSale, newDeletedSet)) {
                    localStorage.removeItem('stk_pending_sale');
                  }
                } catch(e) {}
              }

              localStorage.setItem('stk_refresh_trigger', Date.now().toString());
            } catch (ex) {}

            // Broadcast refresh
            if (typeof BroadcastChannel !== 'undefined') {
              try {
                const bc = new BroadcastChannel('stk_mlm_channel');
                bc.postMessage({ action: 'delete_order', visit_id: order.visit_id, order_id: order.id });
                bc.close();
              } catch(e) {}
            }

            // แสดงแจ้งเตือนลบสำเร็จทันที
            Swal.fire({
              icon: 'success',
              title: 'ลบรายการสำเร็จแล้ว',
              timer: 800,
              showConfirmButton: false
            });

            // ⚡ 4. ส่งคำสั่งลบไปยัง Supabase แบบขนานใน Background (ไม่บล็อก UI)
            (async () => {
              try {
                const targets = [
                  { val: order.id, defaultPk: 'order_id' },
                  { val: order.visit_id, defaultPk: 'visit_id' }
                ];

                const promises = [];

                for (const item of targets) {
                  if (!item.val || item.val === '-') continue;
                  const str = String(item.val).trim();
                  const digits = str.replace(/[^0-9]/g, '');

                  const requests = [];

                  if (str.startsWith('ORD-')) {
                    requests.push({ val: str, pk: 'order_id' });
                  } else if (str.startsWith('VIS-')) {
                    requests.push({ val: str, pk: 'visit_id' });
                    requests.push({ val: `ORD-CLINIC-${str}`, pk: 'order_id' });
                    if (digits) requests.push({ val: `ORD-CLINIC-VIS-${digits}`, pk: 'order_id' });
                  }

                  if (digits) {
                    requests.push({ val: digits, pk: 'visit_id' });
                    requests.push({ val: `VIS-${digits}`, pk: 'visit_id' });
                    requests.push({ val: `ORD-CLINIC-${digits}`, pk: 'order_id' });
                    requests.push({ val: `ORD-CLINIC-VIS-${digits}`, pk: 'order_id' });
                    requests.push({ val: digits, pk: 'id' });
                  }

                  const executedSet = new Set();
                  for (const req of requests) {
                    const key = `${req.pk}:${req.val}`;
                    if (executedSet.has(key)) continue;
                    executedSet.add(key);

                    if (typeof window.supabaseDelete === 'function') {
                      promises.push(window.supabaseDelete('stk_nutrient_orders', req.val, req.pk).catch(() => {}));
                    }
                    if (typeof window.supabaseUpdate === 'function') {
                      promises.push(window.supabaseUpdate('stk_nutrient_orders', req.val, { status: 'บิลถูกยกเลิก' }, req.pk).catch(() => {}));
                    }
                  }
                }

                await Promise.allSettled(promises);
              } catch (e) {
                console.warn('Background DB delete error:', e);
              }
            })();
          }
        });
      };

      return (
      <div className="w-full flex-1 flex flex-col">
        {/* Header Bar */}
        <div className="bg-white border-b border-slate-200 px-6 py-5 shadow-xs">
          <div className="flex flex-col xl:flex-row xl:items-center justify-between gap-4 w-full">
            <div className="flex flex-wrap items-center gap-4">
              <div>
                <h1 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2.5">
                  <span className="p-2 bg-emerald-100 text-emerald-700 rounded-xl">
                    <PillIcon size={26} />
                  </span>
                  สั่งจ่ายยา
                </h1>
                <p className="text-[11px] font-semibold text-slate-500 mt-1">
                  รายการคำสั่งจ่ายยาเสริมจากระบบคลินิก (Clinic System Integration)
                </p>
              </div>

              {/* Search Box */}
              <div className="relative min-w-[220px] self-center">
                <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                  <SearchIcon size={18} />
                </span>
                <input
                  type="text"
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  placeholder="ค้นหารายการ..."
                  className="pl-9 pr-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent w-full shadow-xs"
                />
              </div>
            </div>

            {/* Filtering Controls */}
            <div className="flex flex-wrap items-center gap-3">
              <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 shadow-2xs gap-1">
                <button onClick={() => setFilterPeriod('today')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${quickFilter === 'today' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/60'}`}>วันนี้</button>
                <button onClick={() => setFilterPeriod('month')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${quickFilter === 'month' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/60'}`}>เดือนนี้</button>
                <button onClick={() => setFilterPeriod('all')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${quickFilter === 'all' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/60'}`}>ทั้งหมด</button>
              </div>

              <div className="flex items-center bg-white border border-slate-200 rounded-xl px-2 py-1.5 shadow-xs gap-2">
                <span className="text-[11px] font-bold text-slate-500 whitespace-nowrap">ช่วงเวลาตามสาย:</span>
                <input type="date" value={startDate} onChange={(e) => { setStartDate(e.target.value); setQuickFilter('custom'); }} className="text-[11px] font-semibold text-slate-700 border-none bg-transparent focus:outline-none" />
                <span className="text-slate-400 text-[11px]">-</span>
                <input type="date" value={endDate} onChange={(e) => { setEndDate(e.target.value); setQuickFilter('custom'); }} className="text-[11px] font-semibold text-slate-700 border-none bg-transparent focus:outline-none" />
              </div>

              <button onClick={fetchOrders} className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-[11px] font-bold transition-colors border border-slate-200 shadow-xs cursor-pointer" title="รีเฟรชข้อมูล">
                <RefreshCw size={16} />
                <span>รีเฟรช</span>
              </button>
            </div>
          </div>

          {/* Main Table Content - TABS */}
          <div className="flex-1 w-full p-4 sm:p-6">
            <div className="flex border-b border-slate-200 mb-6 gap-2 sm:gap-6 overflow-x-auto custom-scrollbar">
              <button onClick={() => setActiveTab('pending')} className={`pb-3 text-sm font-black transition-colors border-b-2 whitespace-nowrap flex items-center gap-2 ${activeTab === 'pending' ? 'text-amber-600 border-amber-500' : 'text-slate-500 border-transparent hover:text-slate-700'}`}>
                <span className="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>รอดำเนินการ <span className={`py-0.5 px-2 rounded-full text-[10px] ${activeTab === 'pending' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-500'}`}>{pendingOrders.length}</span>
              </button>
              <button onClick={() => setActiveTab('completed')} className={`pb-3 text-sm font-black transition-colors border-b-2 whitespace-nowrap flex items-center gap-2 ${activeTab === 'completed' ? 'text-emerald-600 border-emerald-500' : 'text-slate-500 border-transparent hover:text-slate-700'}`}>
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>สำเร็จแล้ว <span className={`py-0.5 px-2 rounded-full text-[10px] ${activeTab === 'completed' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}`}>{completedOrders.length}</span>
              </button>
              <button onClick={() => setActiveTab('canceled')} className={`pb-3 text-sm font-black transition-colors border-b-2 whitespace-nowrap flex items-center gap-2 ${activeTab === 'canceled' ? 'text-rose-600 border-rose-500' : 'text-slate-500 border-transparent hover:text-slate-700'}`}>
                <span className="w-2.5 h-2.5 rounded-full bg-rose-500"></span>บิลถูกยกเลิก <span className={`py-0.5 px-2 rounded-full text-[10px] ${activeTab === 'canceled' ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-500'}`}>{canceledOrders.length}</span>
              </button>
            </div>

            {/* Table Area */}
            <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
              <div className="overflow-x-auto custom-scrollbar">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-50/90 border-b border-slate-200 text-[11px] font-bold text-slate-700">
                      <th className="py-3 px-3 border-r border-slate-200/60">รหัส VISIT</th>
                      <th className="py-3 px-3 border-r border-slate-200/60">HN</th>
                      <th className="py-3 px-3 border-r border-slate-200/60">ชื่อ-นามสกุล</th>
                      <th className="py-3 px-3 border-r border-slate-200/60">โรค/อาการ</th>
                      <th className="py-3 px-3 border-r border-slate-200/60">ผู้แนะนำ</th>
                      <th className="py-3 px-3 border-r border-slate-200/60">หมอผู้สั่งจ่ายยา</th>
                      <th className="py-3 px-3 border-r border-slate-200/60 w-[35%]">รายการจัดสั่งจ่ายยา / จำนวน</th>
                      <th className="py-3 px-3 text-center">{activeTab === 'pending' ? 'ดำเนินการ' : 'สถานะการขาย'}</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-200 text-[11px] font-medium text-slate-800">
                    {loading ? (
                      <tr>
                        <td colSpan="8" className="py-12 text-center text-slate-400 font-semibold">
                          <div className="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent mb-2"></div>
                          <p>กำลังดึงข้อมูลจากระบบ...</p>
                        </td>
                      </tr>
                    ) : (() => {
                      const displayData = activeTab === 'pending' ? pendingOrders : activeTab === 'completed' ? completedOrders : canceledOrders;
                      if (displayData.length === 0) {
                        return (
                          <tr>
                            <td colSpan="8" className="py-16 text-center text-slate-400 font-semibold">
                              <div className="flex flex-col items-center justify-center gap-2">
                                <div className="p-3 bg-slate-100 text-slate-400 rounded-full mb-1"><InboxIcon size={36} /></div>
                                <p className="text-sm font-bold text-slate-600">{activeTab === 'pending' ? 'ไม่มีรายการรอดำเนินการ' : activeTab === 'completed' ? 'ยังไม่มีประวัติการทำรายการสำเร็จ' : 'ไม่มีประวัติบิลถูกยกเลิก'}</p>
                              </div>
                            </td>
                          </tr>
                        );
                      }
                      return displayData.map((ord, index) => (
                        <tr key={ord.id || index} className="hover:bg-slate-50/60 transition-colors">
                          <td className="py-2 px-3 font-bold text-slate-900 align-middle whitespace-nowrap border-r border-slate-100">{ord.visit_id}</td>
                          <td className="py-2 px-3 text-slate-700 font-semibold align-middle whitespace-nowrap border-r border-slate-100">{ord.hn}</td>
                          <td className="py-2 px-3 font-bold text-slate-900 align-middle border-r border-slate-100 ">{ord.customer_name}</td>
                          <td className="py-2 px-3 text-slate-600 align-middle border-r border-slate-100 ">{ord.disease || '-'}</td>
                          <td className="py-2 px-3 font-bold text-slate-700 align-middle border-r border-slate-100 ">{ord.recorded_by || '-'}</td>
                          <td className="py-2 px-3 font-bold text-emerald-700 align-middle border-r border-slate-100 ">{ord.closer_dr || '-'}</td>
                          <td className="p-3 align-middle border-r border-slate-100">
                            <div className="rounded-xl border border-slate-200/80 overflow-hidden bg-white shadow-xs">
                              <table className="w-full text-left border-collapse">
                                <thead>
                                  <tr className="bg-slate-50 border-b border-slate-200 text-[10px] font-bold text-slate-700">
                                    <th className="py-1.5 px-2 border-r border-slate-200/60">ชื่อยา/อาหารเสริม</th>
                                    <th className="py-1.5 px-2 text-center border-r border-slate-200/60">ประเภท</th>
                                    <th className="py-1.5 px-2 text-center border-r border-slate-200/60">จำนวน</th>
                                    <th className="py-1.5 px-2 text-right border-r border-slate-200/60">ราคา</th>
                                    <th className="py-1.5 px-2 text-right">รวมราคา</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 text-[11px] font-semibold text-slate-700">
                                  {ord.items && ord.items.map((item, idx) => {
                                    const unitPrice = (item.price !== undefined && item.price !== null && item.price !== '') ? Number(item.price) : 1300;
                                    const qty = Number(item.qty || 1);
                                    const subtotal = (item.total !== undefined && item.total !== null && item.total !== '') ? Number(item.total) : (unitPrice * qty);
                                    const itemSource = item.source || 'คลังยา';
                                    const priceTypeBadge = getItemTypeLabel(item);
                                    return (
                                      <tr key={idx} className="hover:bg-slate-50/80 transition-colors">
                                        <td className="py-1.5 px-2 border-r border-slate-100 align-middle">
                                          <div className="flex items-center gap-2">
                                            <span className="font-bold text-slate-800">{item.name}</span>
                                            <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-cyan-100 text-cyan-700 border border-cyan-200">{itemSource}</span>
                                          </div>
                                        </td>
                                        <td className="py-1.5 px-2 text-center border-r border-slate-100 align-middle">
                                          <span className={`inline-block px-2.5 py-0.5 rounded-md text-[10px] font-bold shadow-2xs ${priceTypeBadge === 'ราคาส่ง/สมาชิก' ? 'bg-amber-100 text-amber-800 border border-amber-200' : priceTypeBadge === 'ราคาโปร' ? 'bg-purple-100 text-purple-800 border border-purple-200' : priceTypeBadge === 'แถมฟรี' ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-slate-100 text-slate-700 border border-slate-200'}`}>{priceTypeBadge}</span>
                                        </td>
                                        <td className="py-1.5 px-2 text-center font-bold text-slate-800 border-r border-slate-100 align-middle">{qty}</td>
                                        <td className="py-1.5 px-2 text-right text-slate-600 border-r border-slate-100 align-middle">{unitPrice.toLocaleString()}</td>
                                        <td className="py-1.5 px-2 text-right font-bold text-slate-900 align-middle">{subtotal.toLocaleString()}</td>
                                      </tr>
                                    );
                                  })}
                                </tbody>
                              </table>
                            </div>
                          </td>
                          <td className="py-3 px-3 text-center align-middle whitespace-nowrap">
                            {activeTab === 'pending' ? (
                              <div className="flex items-center justify-center gap-1.5">
                                <button onClick={() => handleCreateDraftOrder(ord)} className="inline-flex items-center justify-center gap-1 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-[11px] shadow-xs shadow-emerald-200 transition-all transform active:scale-95 cursor-pointer" title="สร้างร่างใบสั่งซื้อ"><CheckCircle size={14} />ร่างใบสั่งซื้อ</button>
                                <button onClick={() => handleDeleteOrder(ord)} className="inline-flex items-center justify-center gap-1 px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 hover:border-rose-300 font-bold rounded-xl text-[11px] shadow-2xs transition-all transform active:scale-95 cursor-pointer" title="ลบรายการนี้"><Trash2 size={14} />ลบ</button>
                              </div>
                            ) : (
                              <span className="inline-flex flex-col items-center gap-1.5">
                                {ord.status === 'บิลถูกยกเลิก' ? <span className="px-2.5 py-1 bg-rose-100 text-rose-800 font-bold rounded-xl text-[11px] border border-rose-200 shadow-xs">บิลถูกยกเลิก</span> : <span className="px-2.5 py-1 bg-emerald-100 text-emerald-800 font-bold rounded-xl text-[11px] border border-emerald-200 shadow-xs">ขายสำเร็จแล้ว</span>}
                                {ord.sale_order_id && <a href={window.resolvePageUrl ? window.resolvePageUrl(`Sales.html?editId=${encodeURIComponent(ord.sale_order_id)}`) : `Sales.html?editId=${encodeURIComponent(ord.sale_order_id)}`} className="text-[10px] text-blue-600 font-bold hover:underline" title="กดเพื่อดูประวัติการขายบิลนี้">บิลเลขที่: {ord.sale_order_id}</a>}
                              </span>
                            )}
                          </td>
                        </tr>
                      ));
                    })()}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
        </div>
    );
}

    // Root App Wrapper Component with Sidebar & Navigation
    function App() {
      const SidebarComp = window.Sidebar || (window.CommonComponents ? window.CommonComponents.Sidebar : null);
      const LoginModalComp = window.LoginModal || (window.CommonComponents ? window.CommonComponents.LoginModal : null);

      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const userStr = localStorage.getItem('stk_current_user') || localStorage.getItem('stk_user');
          if (userStr) return JSON.parse(userStr);
        } catch(e) {}
        return { name: 'Administrator', role: 'ผู้ดูแลระบบ' };
      });
      const [isLoggedIn, setIsLoggedIn] = useState(true);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch(e) { return false; }
      });

      const SCRIPT_URL = (() => {
        try { if (window.top && window.top.location && window.top.location.href.startsWith('http')) return window.top.location.href.split('?')[0]; } catch(e){}
        return "";
      })();

      useEffect(() => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 300);
        }
      }, []);

      const handleLoginSuccess = (user) => {
        localStorage.setItem('stk_current_user', JSON.stringify(user));
        setCurrentUser(user);
        setIsLoggedIn(true);
        setShowLoginModal(false);
      };

      const handleLogout = () => {
        localStorage.removeItem('stk_current_user');
        localStorage.removeItem('stk_user');
        setCurrentUser(null);
        setIsLoggedIn(false);
        if (window.resolvePageUrl) window.location.href = window.resolvePageUrl('?page=dashboard');
      };

      return (
        <div class="min-h-screen bg-slate-50 flex flex-col">
          {/* Sidebar Navigation */}
          {SidebarComp ? (
            <SidebarComp
              activePage="nutrients"
              isLoggedIn={isLoggedIn}
              currentUser={currentUser}
              isAdmin={true}
              onLogout={handleLogout}
              showLoginModal={showLoginModal}
              setShowLoginModal={setShowLoginModal}
              SCRIPT_URL={SCRIPT_URL}
              isSidebarCollapsed={isSidebarCollapsed}
              setIsSidebarCollapsed={setIsSidebarCollapsed}
            />
          ) : null}

          {/* Main View */}
          <main class={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>
            <NutrientsView />
          </main>

          {LoginModalComp ? (
            <LoginModalComp
              isOpen={showLoginModal}
              onClose={() => setShowLoginModal(false)}
              onLoginSuccess={handleLoginSuccess}
            />
          ) : null}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
