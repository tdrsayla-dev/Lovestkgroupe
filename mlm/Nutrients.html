  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    const { LayoutDashboard, ShoppingCart, Users, Contact, Headset, BarChart3, Plus, Edit, Trash2, UserCircle, Menu, X, Save, Info, PackageIcon, Package, Target, Trophy, Activity, Eye, Tags, GitBranch, Archive, ChevronDown, FileText, SettingsIcon, Coins, ShieldCheck, AlertTriangle, AlertCircle, LoginModal, Toast, Sidebar, Header, ConfirmModal, EditModal, DonutChart, AutoSuggestInput } = window;
    
    

    const IconProps = { fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" };
    const SearchIcon = ({ size = 18 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;

    const RefreshCw = ({ size = 18 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>;
    const InboxIcon = ({ size = 48 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>;
    const PhoneIcon = ({ size = 12 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>;
    const ClockIcon = ({ size = 12 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;

    // ฟังก์ชันจัดรูปแบบ วันที่ และ เวลา
    function formatOrderDateTime(rawDate) {
      if (!rawDate) return '-';
      try {
        const d = new Date(rawDate);
        if (isNaN(d.getTime())) {
          return String(rawDate).replace('T', ' ').substring(0, 16);
        }
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        const hours = String(d.getHours()).padStart(2, '0');
        const minutes = String(d.getMinutes()).padStart(2, '0');
        return `${day}/${month}/${year} ${hours}:${minutes}`;
      } catch (e) {
        return String(rawDate);
      }
    }

    // ฟังก์ชันช่วยแปลงชื่อประเภทราคา (เช่น ราคาส่ง/สมาชิก, ราคาโปร, ราคาปกติ, แถมฟรี)
    // รองรับการตรวจสอบทั้งจากราคาจริง (Numeric price), สตริงภาษาไทย และภาษาลาว
    function getItemTypeLabel(item) {
      const typeVal = String(item.type || item.priceType || item.tier || '').trim().toLowerCase();
      const nameVal = String(item.name || '').toLowerCase();
      const hasPrice = (item.price !== undefined && item.price !== null && String(item.price).trim() !== '' && !isNaN(Number(item.price)));
      const rawPrice = hasPrice ? Number(item.price) : null;

      // 1. ตรวจสอบ "แถมฟรี" / 0 บาท
      if (rawPrice === 0 || typeVal === 'free' || typeVal.includes('แถม') || typeVal.includes('ฟรี') || typeVal.includes('ຟຣີ') || nameVal.includes('(แถมฟรี)') || nameVal.includes('(ຟຣີ)')) {
        return 'แถมฟรี';
      }

      // 2. ตรวจสอบ "ราคาส่ง/สมาชิก" (รวมภาษาลาว: ສະມາຊິກ, ສົ່ງ)
      if (typeVal === 'high' || typeVal === 'member' || typeVal.includes('สมาชิก') || typeVal.includes('ส่ง') || typeVal.includes('ສະມາຊິກ') || typeVal.includes('ສົ່ງ') || nameVal.includes('(ส่ง/สมาชิก)') || nameVal.includes('(ສະມາຊິກ)')) {
        return 'ราคาส่ง/สมาชิก';
      }

      // 3. ตรวจสอบ "ราคาโปร" (รวมภาษาลาว: ໂປຣ)
      if (typeVal === 'promo' || typeVal.includes('โปร') || typeVal.includes('พิเศษ') || typeVal.includes('ໂປຣ') || nameVal.includes('(โปร)') || nameVal.includes('(ໂປຣ)')) {
        return 'ราคาโปร';
      }

      // 4. ตรวจสอบ "ราคาปกติ / ราคาเต็ม" จากข้อความระบุชัดเจน (รวมภาษาลาว: ປົກກະຕິ)
      if (typeVal === 'normal' || typeVal === 'full' || typeVal === 'one' || typeVal.includes('ปกติ') || typeVal.includes('เต็ม') || typeVal.includes('ปรกติ') || typeVal.includes('ປົກກະຕິ') || nameVal.includes('(ปกติ)') || nameVal.includes('(เต็ม)') || nameVal.includes('(ປົກກະຕິ)')) {
        return 'ราคาปกติ';
      }

      // 5. ดักจับจากราคาจริง (Numeric Price Mapping) เมื่อไม่มีประเภทยืนยัน
      if (rawPrice !== null && rawPrice > 0) {
        if (rawPrice === 1800 || rawPrice === 890 || rawPrice === 590 || rawPrice === 790 || rawPrice === 2500) {
          return 'ราคาปกติ';
        }
        if (rawPrice === 1500) {
          return 'ราคาส่ง/สมาชิก';
        }
        if (rawPrice === 1000 || rawPrice === 800 || rawPrice === 600 || rawPrice === 400 || rawPrice === 300) {
          return 'ราคาโปร';
        }
        if (rawPrice === 200) {
          if (typeVal.includes('โปร') || typeVal.includes('promo') || typeVal.includes('ໂປຣ')) return 'ราคาโปร';
          return 'ราคาส่ง/สมาชิก';
        }
      }

      if (typeVal && typeVal !== 'one' && typeVal !== 'ปกติ' && typeVal !== 'normal' && typeVal !== 'ປົກກະຕິ') {
        return item.type || item.priceType || typeVal;
      }
      return 'ราคาปกติ';
    }

    // 🏷️ ฟังก์ชันช่วยวิเคราะห์และตัดสินว่าออเดอร์นี้เป็น "หมอสั่งจ่าย (Center)" หรือ "สั่งจ่ายยาเอง (Marketing)"
    function resolveOrderCloserInfo(ord) {
      if (typeof window.resolveOrderCloser === 'function') {
        return window.resolveOrderCloser(ord);
      }
      if (!ord) return { orderByType: 'หมอสั่งจ่าย', closerTeam: 'Center', closerName: 'หมอผู้เชี่ยวชาญ (Center)', isSelf: false, badgeText: '🩺 หมอปิด (Center)', badgeClass: 'bg-indigo-50 text-indigo-700 border border-indigo-200' };
      
      const typeStr = String(ord.order_by_type || ord.prescribe_type || ord.closer_type || ord.closer_team || '').trim().toLowerCase();
      const closerDrStr = String(ord.closer_dr || '').trim();
      const recordedByStr = String(ord.recorded_by || '').trim();

      const isSelf = closerDrStr.includes('ປິດເອງ') || closerDrStr.includes('ປີດເອງ') || closerDrStr.includes('ปิดเอง') || closerDrStr.includes('เอง') || typeStr.includes('เอง') || typeStr.includes('ตลาด') || typeStr.includes('self') || typeStr.includes('marketing') || (recordedByStr && closerDrStr && recordedByStr.toLowerCase() === closerDrStr.toLowerCase());

      if (isSelf) {
        return {
          orderByType: 'สั่งจ่ายยาเอง',
          closerTeam: 'Marketing',
          closerName: (closerDrStr && !closerDrStr.includes('ເອງ') && !closerDrStr.includes('เอง') && closerDrStr !== '-') ? closerDrStr : (recordedByStr || 'พนักงานการตลาด'),
          isSelf: true,
          badgeText: '👤 สั่งเอง (Marketing)',
          badgeClass: 'bg-emerald-50 text-emerald-700 border border-emerald-200'
        };
      }

      return {
        orderByType: 'หมอสั่งจ่าย',
        closerTeam: 'Center',
        closerName: closerDrStr && closerDrStr !== '-' ? closerDrStr : 'หมอผู้เชี่ยวชาญ (Center)',
        isSelf: false,
        badgeText: '🩺 หมอปิด (Center)',
        badgeClass: 'bg-indigo-50 text-indigo-700 border border-indigo-200'
      };
    }
    // 🛡️ ฟังก์ชันช่วยวิเคราะห์และป้องกันการดีดกลับของประเภทลูกค้า (VIS-ORD vs VIS-ตัวเลข)
    function getAccurateCustomerTypeLocally(visitId, explicitType, isExisting) {
        const vUp = String(visitId || '').toUpperCase();
        let baseType = String(explicitType || '').trim();

        // 📌 กำหนดลิสต์ที่ถือว่าเป็น "ลูกค้าเก่า" ที่ยอมรับได้จากระบบคลินิกต้นทาง
        const validOldTypes = [
            'โทรปิดการขายลูกค้าเก่า', 
            'ลูกค้าเก่ากลับมาต่อยา', 
            'ลูกค้าเก่านำผลตรวจมาปรึกษา', 
            'ลูกค้านำผลตรวจมาปรึกษา',
            'ส่วนกลางใหม่' // ถ้าอนุโลมให้เป็นลูกค้าเก่าได้
        ];

        // กฎเหล็ก 1: ถ้าเป็น VIS-ORD หรือ ORD- (ออเดอร์ที่ไม่ได้มาตรวจจริงที่คลินิก)
        if (vUp.includes('VIS-ORD') || vUp.includes('VISIT-ORD') || vUp.startsWith('ORD-')) {
            if (isExisting) {
                // ถ้าเป็นลูกค้าเก่า และต้นทางเลือก "หมวดลูกค้าเก่า" มาให้แล้ว => ใช้ตามต้นทาง
                if (baseType && validOldTypes.includes(baseType)) {
                    return baseType;
                }
                // ถ้าว่าง หรือส่งมาผิดหมวด (เช่น ส่ง 'ลูกค้าใหม่มาตรวจ') => บังคับตีกลับ
                return 'โทรปิดการขายลูกค้าเก่า';
            } else {
                // ถ้าเป็นลูกค้าใหม่
                if (baseType === 'โทรปิดการขายลูกค้าใหม่' || baseType === 'ลูกค้าใหม่นำผลตรวจมาปรึกษา') {
                    return baseType; 
                }
                return 'โทรปิดการขายลูกค้าใหม่';
            }
        }

        // กฎเหล็ก 2: ถ้าเป็น VIS-ตัวเลข แสดงว่าเป็นคนไข้คลินิกจริง
        if (/VIS(?:IT)?[:\s\-]+(?:VIS[-:\s]*)?\d+/i.test(vUp) || /VIS-\d+/i.test(vUp)) {
            if (isExisting) {
                if (baseType && validOldTypes.includes(baseType)) return baseType;
                return 'ลูกค้าเก่านำผลตรวจมาปรึกษา'; 
            } else {
                if (baseType && (baseType === 'ลูกค้าใหม่มาตรวจ' || baseType === 'ลูกค้าใหม่นำผลตรวจมาปรึกษา')) return baseType;
                return 'ลูกค้าใหม่มาตรวจ';
            }
        }

        // Fallback
        if (!baseType) {
            return isExisting ? 'ลูกค้าเก่ากลับมาต่อยา' : 'ลูกค้าใหม่มาตรวจ';
        }
        return baseType;
    }
    // ฟังก์ชันช่วยสกัด ID / Visit ID ทุกรูปแบบที่เป็นไปได้เพื่อใช้เทียบและลบข้อมูลถาวร
    function getNormalizedIds(val) {
      if (!val) return [];
      const str = String(val).trim();
      if (!str || str === '-') return [];
      const set = new Set();
      set.add(str);
      set.add(str.toLowerCase());

      // สกัดตัวเลขล้วน (เช่น 137364 จาก VIS-137364)
      const digits = str.replace(/[^0-9]/g, '');
      if (digits.length >= 3) {
        set.add(digits);
        set.add(`VIS-${digits}`);
        set.add(`VISIT: ${digits}`);
        set.add(`VISIT:${digits}`);
        set.add(`ORD-CLINIC-${digits}`);
        set.add(`ORD-CLINIC-VIS-${digits}`);
      }

      // สกัด prefix คำว่า VIS- หรือ ORD-CLINIC- ออก
      const stripped = str.replace(/^(ORD-CLINIC-|VISIT:\s*|VIS-?)/gi, '').trim();
      if (stripped) {
        set.add(stripped);
        set.add(`VIS-${stripped}`);
        set.add(`ORD-CLINIC-${stripped}`);
        set.add(`ORD-CLINIC-VIS-${stripped}`);
      }

      return Array.from(set);
    }

    function isOrderDeleted(item, deletedSet) {
      if (!item || !deletedSet || deletedSet.size === 0) return false;
      const candidates = [
        item.id,
        item.order_id,
        item.sale_id,
        item.visit_id,
        item.rxVisitId,
        item.payment_note
      ];
      for (const cand of candidates) {
        if (!cand) continue;
        const normList = getNormalizedIds(cand);
        for (const norm of normList) {
          if (deletedSet.has(norm) || deletedSet.has(norm.toLowerCase())) return true;
        }
      }
      return false;
    }

    function NutrientsView() {
      const [orders, setOrders] = useState([]);
      const [searchTerm, setSearchTerm] = useState('');
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');
      const [quickFilter, setQuickFilter] = useState('all'); // 'today', 'month', 'all', 'custom'
      const [loading, setLoading] = useState(true);
      const [currentLang, setCurrentLang] = useState(window.getCurrentLang ? window.getCurrentLang() : 'th');
      const [customTypeOverrides, setCustomTypeOverrides] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('stk_nutrient_custom_types') || '{}');
        } catch(e) { return {}; }
      });
      const [existingCustomersData, setExistingCustomersData] = useState({
        hns: new Set(),
        phones: new Set(),
        names: new Set()
      });
      const [membersList, setMembersList] = useState([]);

      useEffect(() => {
        const handleLangChange = (e) => {
          if (e && e.detail && e.detail.lang) setCurrentLang(e.detail.lang);
        };
        window.addEventListener('stk_lang_change', handleLangChange);
        return () => window.removeEventListener('stk_lang_change', handleLangChange);
      }, []);

      const setFilterPeriod = (period) => {
        setQuickFilter(period);
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const todayStr = `${year}-${month}-${day}`;

        if (period === 'today') {
          setStartDate(todayStr);
          setEndDate(todayStr);
        } else if (period === 'month') {
          const lastDay = new Date(year, now.getMonth() + 1, 0).getDate();
          const lastDayStr = String(lastDay).padStart(2, '0');
          setStartDate(`${year}-${month}-01`);
          setEndDate(`${year}-${month}-${lastDayStr}`);
        } else if (period === 'all') {
          setStartDate('');
          setEndDate('');
        }
      };

      // โหลดข้อมูลจาก Supabase เป็นหลัก + sync LocalStorage → Supabase อัตโนมัติ
      const fetchOrders = async (showLoading = true, forceRefresh = false) => {
        if (showLoading && typeof showLoading !== 'object') setLoading(true);
        let dbList = [];
        let localList = [];

        // ─── โหลด Blacklist รายการที่ถูกลบไปแล้ว และแปลงทุกรูปแบบ ID ────────────────
        const deletedIdsList = JSON.parse(localStorage.getItem('stk_deleted_nutrient_orders') || '[]');
        const deletedIdsSet = new Set();
        deletedIdsList.forEach(id => {
          getNormalizedIds(id).forEach(v => {
            deletedIdsSet.add(v);
            deletedIdsSet.add(v.toLowerCase());
          });
        });

        // ─── 1. ดึงจาก Supabase (ข้อมูลถาวร) ────────────────────────────────
        try {
          if (typeof window.supabaseSelect === 'function') {
            const isForce = forceRefresh === true || (showLoading && typeof showLoading === 'object');
            const cacheParam = isForce ? '&nocache=true' : '';

            // ⚡ ดึงข้อมูลคู่ขนาน: ใบสั่งยา + บิลขายล่าสุด + ลูกค้าเดิมพร้อมผู้ดูแล + สมาชิกการตลาด + ฐานข้อมูลคลินิก
            const [data, salesRes, custRes, membersRes, clinicPatientsRes] = await Promise.all([
              window.supabaseSelect('stk_nutrient_orders', 'order=created_at.desc&limit=200' + cacheParam).catch(() => []),
              window.supabaseSelect('stk_sales', 'select=order_id,payment_note,customer_id&order=created_at.desc&limit=400' + cacheParam).catch(() => []),
              window.supabaseSelect('stk_customers', 'select=customer_id,phone,name,owner_member_id').catch(() => []),
              window.supabaseSelect('stk_members', 'select=user_id,name,business_team,status').catch(() => []),
              (window.clinicSupabaseSelect ? window.clinicSupabaseSelect('patients', 'select=hn,referred_by,phone_number') : Promise.resolve([])).catch(() => [])
            ]);

            if (Array.isArray(membersRes) && membersRes.length > 0) {
              setMembersList(membersRes);
            }

            // สร้าง Map ของ visit_id ที่เปิดบิลขายสำเร็จแล้วใน stk_sales
            const salesVisitMap = new Map();
            if (Array.isArray(salesRes)) {
              salesRes.forEach(s => {
                const note = String(s.payment_note || s.paymentNote || '');
                const m = note.match(/VISIT:\s*([^\)\s]+)/);
                if (m && m[1]) {
                  salesVisitMap.set(m[1].trim().toUpperCase(), s.order_id);
                }
              });
            }

            // ⚡ สร้าง Set ของลูกค้าเดิมในระบบเพื่อตรวจสอบความมีอยู่จริง (รองรับ HN ทุกรูปแบบ)
            const hnSet = new Set();
            const phoneSet = new Set();
            const nameSet = new Set();

            const registerHnCandidates = (rawHn) => {
              if (!rawHn) return;
              const list = (typeof window.normalizeHnCandidates === 'function')
                ? window.normalizeHnCandidates(rawHn)
                : [String(rawHn).trim().toUpperCase()];
              list.forEach(item => {
                if (item && item !== '-' && item !== '--') hnSet.add(item);
              });
            };

            // 1. จากตาราง stk_customers
            if (Array.isArray(custRes)) {
              custRes.forEach(c => {
                if (c.customer_id) registerHnCandidates(c.customer_id);
                const clP = String(c.phone || '').replace(/[^0-9]/g, '');
                if (clP.length >= 7) phoneSet.add(clP);
                const clN = String(c.name || '').trim().toLowerCase();
                if (clN && clN !== '-' && clN !== '--') nameSet.add(clN);
              });
            }

            // 2. จากตาราง patients ของระบบคลินิก
            if (Array.isArray(clinicPatientsRes)) {
              clinicPatientsRes.forEach(p => {
                if (p && p.hn) registerHnCandidates(p.hn);
                const pPhone = String(p.phone_number || p.phone || '').replace(/[^0-9]/g, '');
                if (pPhone.length >= 7) phoneSet.add(pPhone);
              });
            }

            // 3. จากประวัติการขายเดิมใน stk_sales
            if (Array.isArray(salesRes)) {
              salesRes.forEach(s => {
                if (s && s.customer_id) registerHnCandidates(s.customer_id);
              });
            }

            setExistingCustomersData({ hns: hnSet, phones: phoneSet, names: nameSet });

            const checkCustomerExists = (hn, phone, name) => {
              const hCandidates = (typeof window.normalizeHnCandidates === 'function')
                ? window.normalizeHnCandidates(hn)
                : [String(hn || '').trim().toUpperCase()].filter(Boolean);
              const hasHn = hCandidates.some(c => c && c !== '-' && hnSet.has(c));
              const p = String(phone || '').replace(/[^0-9]/g, '');
              const n = String(name || '').trim().toLowerCase();
              return Boolean(
                hasHn ||
                (p && p.length >= 7 && phoneSet.has(p)) ||
                (n && n !== '-' && nameSet.has(n))
              );
            };

            if (Array.isArray(data)) {
              dbList = data.map(item => {
                const vUpper = String(item.visit_id || '').trim().toUpperCase();
                const matchingSaleId = item.sale_order_id || salesVisitMap.get(vUpper) || null;
                const isCompleted = item.status === 'ขายสำเร็จแล้ว' || Boolean(matchingSaleId);
                const finalStatus = (item.status === 'บิลถูกยกเลิก' || isOrderDeleted(item, deletedIdsSet))
                  ? 'บิลถูกยกเลิก'
                  : (isCompleted ? 'ขายสำเร็จแล้ว' : (item.status || 'รอดำเนินการ'));

                // ซิงค์สถานะบิลขายสำเร็จกลับ Supabase อัตโนมัติในพื้นหลังหากยังไม่ได้อัปเดต
                if (matchingSaleId && item.status !== 'ขายสำเร็จแล้ว' && typeof window.supabaseUpdate === 'function') {
                  window.supabaseUpdate('stk_nutrient_orders', item.visit_id, {
                    status: 'ขายสำเร็จแล้ว',
                    sale_order_id: matchingSaleId
                  }, 'visit_id').catch(() => {});
                }

                const isExisting = checkCustomerExists(item.hn || item.customer_id, item.phone || item.customer_phone, item.customer_name || item.customerName);
                const explicit = item.customer_type || item.customerType || item.cust_type || item.type || item.patient_type || item.customer_type_name || item.visit_type || item.order_type || '';
                const resolvedCustType = (typeof window.resolveVisitCustomerType === 'function')
                  ? window.resolveVisitCustomerType(item.visit_id, isExisting, explicit, 'th', {
                      disease: item.disease || item.disease_name || '',
                      symptom: item.symptom || item.symptoms || item.chief_complaint || item.diag || '',
                      customer_name: item.customer_name || item.customerName || '',
                      hn: item.hn || item.customer_id || ''
                    }).name
                  : (explicit || 'ลูกค้าใหม่มาตรวจ');

                const resolvedRecordedBy = item.recorded_by || item.seller_id || item.seller || item.salesperson || '-';
                return {
                  id: item.order_id || String(item.id),
                  visit_id: item.visit_id || '-',
                  hn: item.hn || item.customer_id || item.customerId || item.patient_hn || item.patientHn || '-',
                  customer_name: item.customer_name || item.customerName || item.patientName || item.patient_name || item.patient || item.name || item.customer || '-',
                  phone: item.phone || item.customer_phone || item.customerPhone || item.patientPhone || item.patient_phone || item.tel || item.mobile || '-',
                  disease: item.disease || item.disease_name || item.symptom || item.symptoms || item.chief_complaint || item.diag || '-',
                  customer_type: resolvedCustType,
                  order_by_type: item.order_by_type || item.prescribe_type || item.prescribed_by_type || item.closer_type || item.order_type || (item.closer_team === 'Marketing' ? 'สั่งจ่ายยาเอง' : 'หมอสั่งจ่าย'),
                  closer_team: item.closer_team || item.closerTeam || (item.order_by_type === 'สั่งจ่ายยาเอง' ? 'Marketing' : 'Center'),
                  recorded_by: resolvedRecordedBy,
                  closer_dr: item.closer_dr || '-',
                  date: item.created_at || item.date || new Date().toISOString(),
                  status: finalStatus,
                  sale_order_id: matchingSaleId || item.sale_order_id || null,
                  items: (() => {
                    try {
                      let parsed = item.items_json || item.items || item.products;
                      if (typeof parsed === "string") parsed = JSON.parse(parsed);
                      return Array.isArray(parsed) ? parsed : [];
                    } catch(e) { return []; }
                  })()
                };
              });
            }
          }
        } catch (err) {
          console.warn('Supabase fetch nutrient_orders error:', err);
        }

        // ─── 2. ดึงจาก LocalStorage และ sync ที่ยังไม่มีใน DB ───────────────
        try {
          const localNutrient = JSON.parse(localStorage.getItem('stk_nutrient_orders') || '[]');
          const localClinicMlm = JSON.parse(localStorage.getItem('clinic_mlm_orders') || '[]');
          const rawCombined = [...localNutrient, ...localClinicMlm];

          const dbVisitSet = new Set(dbList.map(o => String(o.visit_id || '').trim().toUpperCase()));

          for (const item of rawCombined) {
            let parsedItems = [];
            try {
              parsedItems = typeof item.items === 'string' ? JSON.parse(item.items) : (item.items || item.products || item.items_json || []);
              if (typeof parsedItems === 'string') parsedItems = JSON.parse(parsedItems);
            } catch(e) { parsedItems = []; }

            const vId = item.visit_id || (item.payment_note && item.payment_note.match(/VISIT:\s*([^\)\s]+)/) ? item.payment_note.match(/VISIT:\s*([^\)\s]+)/)[1] : null) || item.rxVisitId || `VIS-${item.id}`;
            const orderId = item.id || item.sale_id || item.order_id || `ORD-CLINIC-${vId}`;
            const vUpper = String(vId || '').trim().toUpperCase();

            // ตรวจสอบว่าออเดอร์นี้ขายสำเร็จไปแล้วหรือไม่
            const matchingSaleId = item.sale_order_id || (typeof salesVisitMap !== 'undefined' ? salesVisitMap.get(vUpper) : null) || null;
            const isCompleted = item.status === 'ขายสำเร็จแล้ว' || Boolean(matchingSaleId);

            let finalLocalStatus = item.status || 'รอดำเนินการ';
            if (finalLocalStatus === 'บิลถูกยกเลิก' || isOrderDeleted(item, deletedIdsSet) || isOrderDeleted({ id: orderId, visit_id: vId }, deletedIdsSet)) {
                finalLocalStatus = 'บิลถูกยกเลิก';
            } else if (isCompleted) {
                finalLocalStatus = 'ขายสำเร็จแล้ว';
            }

            const normalizedItems = Array.isArray(parsedItems) ? parsedItems.map(it => ({
              id: it.id,
              name: it.name || it.product_name || it.title || 'สารอาหาร',
              source: it.source || it.sourceLabel || 'คลังยา',
              type: it.type || it.priceType || it.tier || 'ราคาปกติ',
              priceType: it.priceType || it.type || it.tier || 'ราคาปกติ',
              tier: it.tier || 'normal',
              qty: Number(it.qty || it.quantity || 1),
              price: Number(it.price || it.unit_price || 0),
              total: Number(it.total || (it.price * it.qty) || 0)
            })) : [];

            const isExistingLocal = (() => {
              if (existingCustomersData && existingCustomersData.hns) {
                const candidates = (typeof window.normalizeHnCandidates === 'function')
                  ? window.normalizeHnCandidates(item.hn)
                  : [String(item.hn || '').trim().toUpperCase()];
                if (candidates.some(c => c && c !== '-' && existingCustomersData.hns.has(c))) return true;
                const p = String(item.phone || '').replace(/[^0-9]/g, '');
                if (p && p.length >= 7 && existingCustomersData.phones && existingCustomersData.phones.has(p)) return true;
                const n = String(item.customer_name || '').trim().toLowerCase();
                if (n && n !== '-' && existingCustomersData.names && existingCustomersData.names.has(n)) return true;
              }
              return false;
            })();

            const explicit = item.customer_type || item.customerType || item.cust_type || item.type || item.patient_type || item.customer_type_name || item.visit_type || item.order_type || '';
            const resolvedLocalCustType = (typeof window.resolveVisitCustomerType === 'function')
              ? window.resolveVisitCustomerType(vId, isExistingLocal, explicit, 'th', {
                  disease: item.disease || item.disease_name || '',
                  symptom: item.symptom || item.symptoms || item.chief_complaint || item.diag || '',
                  customer_name: item.customer_name || item.customerName || item.patientName || item.patient_name || item.patient || item.name || '',
                  hn: item.hn || item.customer_id || ''
                }).name
              : (explicit || 'ลูกค้าใหม่มาตรวจ');

            const localEntry = {
              id: orderId,
              visit_id: vId,
              hn: item.hn || item.customer_id || item.customerId || item.patient_hn || item.patientHn || '-',
              customer_name: item.customer_name || item.customerName || item.patientName || item.patient_name || item.patient || item.name || item.customer || '-',
              phone: item.phone || item.customer_phone || item.customerPhone || item.patientPhone || item.patient_phone || item.tel || item.mobile || '-',
              disease: item.disease || item.disease_name || item.symptom || item.symptoms || item.chief_complaint || item.diag || '-',
              customer_type: resolvedLocalCustType,
              order_by_type: item.order_by_type || item.prescribe_type || item.prescribed_by_type || item.closer_type || item.order_type || (item.closer_team === 'Marketing' ? 'สั่งจ่ายยาเอง' : 'หมอสั่งจ่าย'),
              closer_team: item.closer_team || item.closerTeam || (item.order_by_type === 'สั่งจ่ายยาเอง' ? 'Marketing' : 'Center'),
              recorded_by: item.recorded_by || item.seller_id || '-',
              closer_dr: item.closer_dr || '-',
              date: item.created_at || item.date || new Date().toISOString(),
              status: finalLocalStatus,
              sale_order_id: matchingSaleId || item.sale_order_id || null,
              items: normalizedItems
            };

            // ─── Sync ขึ้น Supabase ถ้ายังไม่มีใน DB ───────────────────────────
            if (!dbVisitSet.has(vUpper) && orderId && vId && vId !== '-') {
              try {
                const upsertPayload = {
                  order_id: orderId,
                  visit_id: vId,
                  hn: localEntry.hn,
                  customer_name: localEntry.customer_name,
                  customer_type: localEntry.customer_type,
                  order_by_type: localEntry.order_by_type,
                  closer_team: localEntry.closer_team,
                  recorded_by: localEntry.recorded_by,
                  closer_dr: localEntry.closer_dr,
                  date: localEntry.date ? localEntry.date.split('T')[0] : new Date().toISOString().split('T')[0],
                  items_json: JSON.stringify(normalizedItems)
                };
                if (typeof window.supabaseInsert === 'function') {
                  await window.supabaseInsert('stk_nutrient_orders', upsertPayload);
                }
                dbVisitSet.add(vUpper);
              } catch(syncErr) {
                console.warn('Sync to Supabase failed:', syncErr);
              }
              localList.push(localEntry);
            } else if (!dbVisitSet.has(vUpper)) {
              localList.push(localEntry);
            }
          }
        } catch (ex) {
          console.warn('LocalStorage parse error:', ex);
        }

        // ─── 3. รวมและ deduplicate ตาม visit_id อย่างแม่นยำ 100% ────────────────
        const visitMap = new Map();
        [...dbList, ...localList].forEach(o => {
          const vKey = String(o.visit_id || '').trim().toUpperCase();
          if (vKey && vKey !== '-' && !isOrderDeleted(o, deletedIdsSet)) {
            if (!visitMap.has(vKey)) {
              visitMap.set(vKey, o);
            } else {
              const existing = visitMap.get(vKey);
              // หากรายการใดมีสถานะ 'ขายสำเร็จแล้ว' หรือมี sale_order_id ให้ใช้สถานะสำเร็จทันที
              if (existing.status !== 'ขายสำเร็จแล้ว' && (o.status === 'ขายสำเร็จแล้ว' || o.sale_order_id)) {
                visitMap.set(vKey, { ...existing, ...o, status: 'ขายสำเร็จแล้ว', sale_order_id: o.sale_order_id || existing.sale_order_id });
              }
            }
          }
        });

        setOrders(Array.from(visitMap.values()));
        setLoading(false);
      };

      useEffect(() => {
        fetchOrders(true, true);
        const handleStorageChange = (e) => {
          if (!e || !e.key || e.key === 'stk_nutrient_orders' || e.key === 'clinic_mlm_orders' || e.key === 'stk_refresh_trigger') {
            fetchOrders(false, true);
          }
        };
        window.addEventListener('storage', handleStorageChange);

        let bc = null;
        if (typeof BroadcastChannel !== 'undefined') {
          try {
            bc = new BroadcastChannel('stk_mlm_channel');
            bc.onmessage = (msg) => {
              if (msg && msg.data) fetchOrders(false, true);
            };
          } catch(ex) {}
        }

        // ปรับการดึงซ้ำสำรองเป็น 60 วินาที และหยุดดึงเมื่อแท็บถูกซ่อน (document.hidden) หรือออกจากระบบ เพื่อประหยัด Egress
        const intervalId = setInterval(() => {
          if (!localStorage.getItem('stk_current_user')) return; // 🛡️ GUARD: หยุดดึงเมื่อออกจากระบบ
          if (typeof document !== 'undefined' && document.hidden) return; // 🛡️ GUARD: แท็บซ่อนอยู่ ไม่ดึงข้อมูลให้เปลือง Egress
          fetchOrders(false, false);
        }, 60000);

        const handleVisibilityChange = () => {
          if (!localStorage.getItem('stk_current_user')) return;
          if (typeof document !== 'undefined' && !document.hidden) {
            fetchOrders(false, true);
          }
        };
        document.addEventListener('visibilitychange', handleVisibilityChange);

        return () => {
          window.removeEventListener('storage', handleStorageChange);
          document.removeEventListener('visibilitychange', handleVisibilityChange);
          if (bc) bc.close();
          clearInterval(intervalId);
        };
      }, []);

      // กรองรายการตามคำค้นหา และ ช่วงเวลา
      const filteredOrders = useMemo(() => {
        return orders.filter(ord => {
          const search = searchTerm.trim().toLowerCase();
          const matchSearch = !search || 
            (ord.visit_id && ord.visit_id.toLowerCase().includes(search)) ||
            (ord.hn && ord.hn.toLowerCase().includes(search)) ||
            (ord.customer_name && ord.customer_name.toLowerCase().includes(search)) ||
            (ord.items && ord.items.some(i => (i.name || '').toLowerCase().includes(search)));

          const ordDate = ord.date ? ord.date.split('T')[0] : '';
          const matchStart = !startDate || ordDate >= startDate;
          const matchEnd = !endDate || ordDate <= endDate;

          return matchSearch && matchStart && matchEnd;
        });
      }, [orders, searchTerm, startDate, endDate]);

      // เพิ่ม State ควบคุมแท็บ
      const [activeTab, setActiveTab] = useState('pending'); // 'pending', 'completed', 'canceled'

      const pendingOrders = useMemo(() => {
        return filteredOrders.filter(ord => ord.status !== 'ขายสำเร็จแล้ว' && ord.status !== 'บิลถูกยกเลิก');
      }, [filteredOrders]);

      // ซิงค์จำนวนออเดอร์รอดำเนินการจริงไปยัง Sidebar Badge ด้านซ้ายแบบเรียลไทม์
      useEffect(() => {
        const count = orders.filter(ord => ord.status !== 'ขายสำเร็จแล้ว' && ord.status !== 'บิลถูกยกเลิก').length;
        try {
          localStorage.setItem('stk_pending_nutrient_count', String(count));
          window.dispatchEvent(new CustomEvent('stk_nutrient_count_update', { detail: { count } }));
        } catch(e) {}
      }, [orders]);

      const completedOrders = useMemo(() => {
        return filteredOrders.filter(ord => ord.status === 'ขายสำเร็จแล้ว');
      }, [filteredOrders]);

      const canceledOrders = useMemo(() => {
        return filteredOrders.filter(ord => ord.status === 'บิลถูกยกเลิก');
      }, [filteredOrders]);

      // ฟังก์ชันดำเนินการสร้าง "ร่างใบสั่งซื้อ" / "จ่ายยาเสร็จสิ้น"
      const handleCreateDraftOrder = async (order) => {
        if (!order) return;

        // --- ⚡ ตรวจสอบสต็อกแบบรวดเร็ว (ไม่ต้องเปิด Swal loading ซ้ำซ้อน เพื่อป้องกัน Modal ยืนยันค้างสถานะ spinner) ---
        try {
          if (typeof window.supabaseSelect === 'function' && Array.isArray(order.items) && order.items.length > 0) {
            const outOfStockItems = [];

            for (const item of order.items) {
              const pName = (item.name || '').trim();
              if (!pName) continue;
              let currentStock = null;
              
              // 1. ค้นหาใน stk_products
              let pData = null;
              try {
                pData = await window.supabaseSelect('stk_products', `name=eq.${encodeURIComponent(pName)}&select=current_stock`);
              } catch (e) {}

              if (pData && pData.length > 0) {
                currentStock = parseInt(pData[0].current_stock) || 0;
              }

              const qtyNeeded = parseInt(item.qty) || 1;
              if (currentStock !== null && currentStock < qtyNeeded) {
                outOfStockItems.push(`${pName} (มี ${currentStock} ชิ้น, ต้องการ ${qtyNeeded} ชิ้น)`);
              }
            }

            if (outOfStockItems.length > 0) {
              Swal.fire({
                icon: 'error',
                title: currentLang === 'lo' ? 'ສິນຄ້າໝົດສະຕັອກ!' : 'สินค้าหมดสต็อก!',
                html: `${currentLang === 'lo' ? 'ບໍ່ສາມາດຮ່າງໃບສັ່ງຊື້ໄດ້ ເນື່ອງຈາກສິນຄ້າຕໍ່ໄປນີ້ບໍ່ພໍ:' : 'ไม่สามารถร่างใบสั่งซื้อได้เนื่องจากสินค้าดังต่อไปนี้มีสต็อกไม่เพียงพอ:'}<br/><br/><ul class="text-left text-sm text-rose-600 list-disc pl-6">${outOfStockItems.map(i => `<li>${i}</li>`).join('')}</ul>`,
                confirmButtonColor: '#047857',
                confirmButtonText: currentLang === 'lo' ? 'ຕົກລົງ' : 'ตกลง'
              });
              return; // หยุดการทำงาน ไม่ให้ร่างบิล
            }
          }
        } catch (e) {
          console.warn('Stock check error:', e);
        }

        const hnCandidates = (typeof window.normalizeHnCandidates === 'function')
          ? window.normalizeHnCandidates(order.hn)
          : [String(order.hn || '').trim().toUpperCase()];
        const isHnExisting = hnCandidates.some(c => c && c !== '-' && existingCustomersData.hns && existingCustomersData.hns.has(c));
        const pClean = String(order.phone || '').replace(/[^0-9]/g, '');
        const nClean = String(order.customer_name || '').trim().toLowerCase();
        const isExistingCustomer = Boolean(
          isHnExisting ||
          (pClean && pClean.length >= 7 && existingCustomersData.phones && existingCustomersData.phones.has(pClean)) ||
          (nClean && nClean !== '-' && existingCustomersData.names && existingCustomersData.names.has(nClean))
        );

        const closerInfo = resolveOrderCloserInfo(order);
        const normCustType = (typeof window.resolveVisitCustomerType === 'function')
            ? window.resolveVisitCustomerType(order.visit_id, isExistingCustomer, order.customer_type, currentLang)
            : ((typeof window.normalizeCustomerType === 'function')
                ? window.normalizeCustomerType(order.customer_type)
                : { id: 'T001', name: order.customer_type || 'ลูกค้าใหม่มาตรวจ', display: order.customer_type || 'ลูกค้าใหม่มาตรวจ', isOld: isExistingCustomer, lo: 'ລູກຄ້າໃໝ່ມາກວດ', th: 'ลูกค้าใหม่มาตรวจ', en: 'New Customer - Clinic Visit' });
        const custTypeDisplay = normCustType.display;
        const isOldCustomer = normCustType.isOld;

        const allTypesList = window.STK_CUSTOMER_TYPES_MAP || [
          { id: 'T001', name: 'ลูกค้าใหม่มาตรวจ', th: 'ลูกค้าใหม่มาตรวจ', lo: 'ລູກຄ້າໃໝ່ມາກວດ', en: 'New Customer - Clinic Visit' },
          { id: 'T002', name: 'ลูกค้าเก่ากลับมาต่อยา', th: 'ลูกค้าเก่ากลับมาต่อยา', lo: 'ລູກຄ້າເກົ່າກັບມາຕໍ່ຢາ', en: 'Returning Customer - Medicine Refill' },
          { id: 'T003', name: 'ลูกค้าใหม่นำผลตรวจมาปรึกษา', th: 'ลูกค้าใหม่นำผลตรวจมาปรึกษา', lo: 'ລູກຄ້າໃໝ່ນຳຜົນກວດມາປຶກສາ', en: 'New Customer - Consult Lab Results' },
          { id: 'T004', name: 'โทรปิดการขายลูกค้าใหม่', th: 'โทรปิดการขายลูกค้าใหม่', lo: 'ໂທປິດການຂາຍລູກຄ້າໃໝ່', en: 'Telesales - New Customer' },
          { id: 'T005', name: 'ลูกค้าเก่านำผลตรวจมาปรึกษา', th: 'ลูกค้าเก่านำผลตรวจมาปรึกษา', lo: 'ລູກຄ້າເກົ່ານຳຜົນກວດມາປຶກສາ', en: 'Returning Customer - Consult Lab Results' },
          { id: 'T006', name: 'โทรปิดการขายลูกค้าเก่า', th: 'โทรปิดการขายลูกค้าเก่า', lo: 'ໂທປິດการຂາຍລູກຄ້າເກົ່າ', en: 'Telesales - Returning Customer' },
          { id: 'T007', name: 'ส่วนกลางใหม่', th: 'ส่วนกลางใหม่', lo: 'ສ່ວນກາງໃໝ່', en: 'Headquarters / Center - New' }
        ];

        const optionsHtml = allTypesList.map(t => {
          const isSelected = (t.id === normCustType.id || t.name === normCustType.name) ? 'selected' : '';
          const label = t[currentLang] || t.th;
          return `<option value="${t.name}" ${isSelected}>🏷️ ${label}</option>`;
        }).join('');

        const currentSellerStr = String(order.recorded_by || '').trim();
        let sellerFoundInList = false;
        const sellerOptionsHtml = (membersList || []).map(m => {
          const mId = m.user_id || m.id;
          const val = `${mId} - ${m.name}`;
          const isSelected = currentSellerStr && (currentSellerStr.toUpperCase() === val.toUpperCase() || currentSellerStr.toUpperCase() === String(mId).toUpperCase() || currentSellerStr.toUpperCase().startsWith(String(mId).toUpperCase()));
          if (isSelected) sellerFoundInList = true;
          return `<option value="${val}" ${isSelected ? 'selected' : ''}>👤 ${val}</option>`;
        }).join('');

        const fullSellerSelectHtml = sellerFoundInList || !currentSellerStr || currentSellerStr === '-'
          ? sellerOptionsHtml
          : `<option value="${currentSellerStr}" selected>👤 ${currentSellerStr} (จากใบสั่งยา)</option>` + sellerOptionsHtml;

        Swal.fire({
          title: currentLang === 'lo' ? 'ຢືນຢັນສ້າງຮ່າງໃບສັ່ງຊື້' : (currentLang === 'en' ? 'Confirm Draft Order' : 'ยืนยันสร้างร่างใบสั่งซื้อ'),
          html: `
            <div class="text-left text-sm space-y-2.5 p-2">
              <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                <span class="text-xs text-slate-500 font-bold">รหัส VISIT: <strong class="text-blue-600">${order.visit_id}</strong></span>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-black ${isOldCustomer ? 'bg-amber-100 text-amber-800 border border-amber-300' : 'bg-blue-100 text-blue-800 border border-blue-300'}">
                  🏷️ ${custTypeDisplay}
                </span>
              </div>
              <p><strong>HN:</strong> ${order.hn}</p>
              <p><strong>ชื่อคนไข้:</strong> <span class="font-bold text-slate-800">${order.customer_name}</span></p>
              <p><strong>เบอร์โทร:</strong> ${order.phone || '-'}</p>
              <p><strong>โรค/อาการ:</strong> ${order.disease || '-'}</p>

              <!-- Dropdown เลือกประเภทลูกค้าก่อนส่งเข้าหน้าขาย -->
              <div class="bg-blue-50/70 p-2.5 rounded-xl border border-blue-200 text-xs mt-2">
                <label class="block font-bold text-slate-700 mb-1">
                  🏷️ ประเภทลูกค้า (สามารถเลือกเปลี่ยนได้หากระบบคลินิกส่งมาไม่ตรง):
                </label>
                <select id="swal-select-customer-type" class="w-full bg-white border border-blue-300 rounded-lg p-2 font-bold text-slate-800 text-xs shadow-2xs focus:border-blue-500 focus:outline-none">
                  ${optionsHtml}
                </select>
              </div>

              <!-- Dropdown ตรวจสอบและเลือกผู้แนะนำ (การตลาด/ผู้ขาย) ก่อนส่งเข้าหน้าขาย -->
              <div class="bg-amber-50/70 p-2.5 rounded-xl border border-amber-200 text-xs mt-2">
                <label class="block font-bold text-slate-700 mb-1">
                  👤 ผู้แนะนำ / ผู้ขาย (การตลาด) ในบิล:
                </label>
                <select id="swal-select-seller" class="w-full bg-white border border-amber-300 rounded-lg p-2 font-bold text-slate-800 text-xs shadow-2xs focus:border-amber-500 focus:outline-none">
                  ${fullSellerSelectHtml}
                </select>
              </div>
              
              <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-xs space-y-1 mt-2">
                <p><strong>รูปแบบสั่งจ่าย:</strong> <span class="font-bold ${closerInfo.closerTeam === 'Center' ? 'text-indigo-600' : 'text-emerald-600'}">${closerInfo.badgeText || (closerInfo.orderByType === 'หมอสั่งจ่าย' ? '🩺 หมอปิดการขาย / สั่งจ่าย' : '👤 สั่งจ่ายยาเอง')} (ทีม: ${closerInfo.closerTeam})</span></p>
                <p><strong>ผู้ปิดการขายในบิล:</strong> <span class="font-black text-slate-900">${closerInfo.closerName}</span></p>
              </div>

              <hr class="my-2 border-slate-200"/>
              <p class="font-bold text-slate-700">รายการยา:</p>
              <ul class="list-disc pl-5 text-[11px] text-slate-600 space-y-1">
  ${(order.items || []).map(i => {
      const price = (i.price !== undefined && i.price !== null && i.price !== '') ? Number(i.price) : 1300;
      const qty = Number(i.qty || 1);
      return `<li>${i.name} (${getItemTypeLabel(i)}) x ${qty} = ${(price * qty).toLocaleString()} ฿</li>`;
  }).join('')}
</ul>
<div class="mt-3 p-2 bg-emerald-50 rounded-lg border border-emerald-200 flex justify-between items-center font-bold text-emerald-800">
  <span>ราคารวมทั้งหมด:</span>
  <span>${(order.items || []).reduce((s, i) => {
      const price = (i.price !== undefined && i.price !== null && i.price !== '') ? Number(i.price) : 1300;
      const qty = Number(i.qty || 1);
      return s + (price * qty);
  }, 0).toLocaleString()} ฿</span>
</div>
          `,
          icon: 'question',
          showCancelButton: true,
          showLoaderOnConfirm: false,
          confirmButtonColor: '#047857',
          cancelButtonColor: '#64748b',
          confirmButtonText: currentLang === 'lo' ? 'ຮ່າງໃບສັ່ງຊື້ໃນ M&M' : (currentLang === 'en' ? 'Create Draft in M&M' : 'ร่างใบสั่งซื้อใน M&M'),
          cancelButtonText: currentLang === 'lo' ? 'ຍົກເລີກ' : (currentLang === 'en' ? 'Cancel' : 'ยกเลิก'),
          didOpen: () => {
            try {
              Swal.hideLoading();
              const cBtn = Swal.getConfirmButton();
              if (cBtn) {
                cBtn.classList.remove('swal2-loading');
                cBtn.removeAttribute('disabled');
              }
            } catch (err) {}
          },
          preConfirm: () => {
            const selectType = document.getElementById('swal-select-customer-type');
            const selectSeller = document.getElementById('swal-select-seller');
            return {
              custTypeName: selectType ? selectType.value : normCustType.name,
              sellerName: selectSeller ? selectSeller.value : (order.recorded_by || '')
            };
          }
        }).then((result) => {
          if (result.isConfirmed) {
            const selectedCustTypeName = result.value?.custTypeName || normCustType.name;
            const selectedSeller = result.value?.sellerName || order.recorded_by;
            const finalCustTypeObj = (typeof window.normalizeCustomerType === 'function')
              ? window.normalizeCustomerType(selectedCustTypeName)
              : { id: normCustType.id, name: selectedCustTypeName, lo: selectedCustTypeName, th: selectedCustTypeName, en: selectedCustTypeName };

            // บันทึก override เก็บไว้ใน localStorage เพื่อไม่ให้เด้งกลับไปเป็นลูกค้าใหม่
            try {
              const currentOverrides = JSON.parse(localStorage.getItem('stk_nutrient_custom_types') || '{}');
              if (order.id) currentOverrides[order.id] = finalCustTypeObj.name;
              if (order.visit_id) currentOverrides[order.visit_id] = finalCustTypeObj.name;
              localStorage.setItem('stk_nutrient_custom_types', JSON.stringify(currentOverrides));
              setCustomTypeOverrides(currentOverrides);
            } catch(e) {}

            try {
              const pendingSale = {
                visit_id: order.visit_id,
                hn: (order.hn && order.hn !== '-') ? order.hn : '',
                customer_name: (order.customer_name && order.customer_name !== '-') ? order.customer_name : '',
                phone: (order.phone && order.phone !== '-' && order.phone !== '--') ? order.phone : '',
                disease: (order.disease && order.disease !== '-') ? order.disease : '',
                recorded_by: selectedSeller || order.recorded_by,
                closer_dr: closerInfo.closerName,
                closer: closerInfo.closerName,
                closer_team: closerInfo.closerTeam,
                closerTeam: closerInfo.closerTeam,
                order_by_type: closerInfo.orderByType,
                customer_type: finalCustTypeObj.name,
                customer_type_id: finalCustTypeObj.id,
                customer_type_name: finalCustTypeObj.name,
                customer_type_lo: finalCustTypeObj.lo,
                customer_type_th: finalCustTypeObj.th,
                customer_type_en: finalCustTypeObj.en,
                customer_type_manually_selected: true,
                isExisting: Boolean(finalCustTypeObj.isOld || isOldCustomer),
                isExistingCustomer: Boolean(finalCustTypeObj.isOld || isOldCustomer),
                isOld: Boolean(finalCustTypeObj.isOld || isOldCustomer),
                isOldCustomer: Boolean(finalCustTypeObj.isOld || isOldCustomer),
                type: finalCustTypeObj.name,
                items: (order.items || []).map(i => {
                  const typeLabel = typeof getItemTypeLabel === 'function' ? getItemTypeLabel(i) : (i.type || i.priceType || '');
                  return {
                    ...i,
                    type: typeLabel,
                    priceType: typeLabel
                  };
                })
              };
              localStorage.setItem('stk_pending_sale', JSON.stringify(pendingSale));
            } catch (ex) {
              console.warn('Pending sale save error:', ex);
            }

            const targetUrl = window.resolvePageUrl ? window.resolvePageUrl('Sales.html') : 'Sales.html';
            Swal.fire({
              icon: 'success',
              title: currentLang === 'lo' ? 'ສົ່ງຂໍ້ມູນສຳເລັດ!' : (currentLang === 'en' ? 'Draft Order Created!' : 'ส่งข้อมูลเข้าสู่หน้าขายเรียบร้อย!'),
              text: currentLang === 'lo' ? 'ກຳລັງພາໄປໜ້າຂາຍ...' : `กำลังนำข้อมูลสำหรับ ${order.customer_name || ''} (VISIT: ${order.visit_id || ''}) ไปเปิดบิลที่หน้าขาย (Sales)...`,
              confirmButtonColor: '#047857',
              timer: 800,
              showConfirmButton: false
            });

            // การันตีการเปลี่ยนหน้า 100% ไม่ติดค้าง
            setTimeout(() => {
              window.location.href = targetUrl;
            }, 600);
          }
        });
      };

      // 🗑️ ฟังก์ชันลบ / ยกเลิกรายการสั่งจ่ายยา (ตอบสนองเร็ว 0ms + ลบแบบขนานหลังบ้าน)
      const handleDeleteOrder = (order) => {
        if (typeof Swal === 'undefined') return;
        
        Swal.fire({
          title: 'ยืนยันการลบรายการสั่งจ่ายยา',
          html: `
            <div class="text-left text-sm space-y-2 p-2">
              <p class="text-slate-600 font-medium">คุณต้องการลบรายการสั่งจ่ายยานี้ใช่หรือไม่?</p>
              <div class="p-3 bg-red-50 text-red-900 rounded-xl border border-red-200 mt-2 space-y-1">
                <p><strong>รหัส VISIT:</strong> <span class="text-red-700 font-bold">${order.visit_id}</span></p>
                <p><strong>HN:</strong> ${order.hn}</p>
                <p><strong>ชื่อคนไข้:</strong> ${order.customer_name}</p>
                <p><strong>โรค/อาการ:</strong> ${order.disease || '-'}</p>
              </div>
              <p class="text-xs text-rose-600 font-bold mt-2">⚠️ เมื่อลบแล้ว รายการนี้จะถูกลบออกจากรายการรอดำเนินการ</p>
            </div>
          `,
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#dc2626',
          cancelButtonColor: '#64748b',
          confirmButtonText: 'ยืนยันลบรายการ',
          cancelButtonText: 'ยกเลิก'
        }).then((result) => {
          if (result.isConfirmed) {
            // ⚡ 1. อัปเดต Blacklist และ LocalStorage ทันที (0ms Response)
            try {
              const deletedList = JSON.parse(localStorage.getItem('stk_deleted_nutrient_orders') || '[]');
              const idsToAdd = [
                ...getNormalizedIds(order.id),
                ...getNormalizedIds(order.visit_id),
                ...getNormalizedIds(order.hn)
              ];
              idsToAdd.forEach(id => {
                if (id && !deletedList.includes(id)) deletedList.push(id);
              });
              localStorage.setItem('stk_deleted_nutrient_orders', JSON.stringify(deletedList));
            } catch (e) {}

            const newDeletedList = JSON.parse(localStorage.getItem('stk_deleted_nutrient_orders') || '[]');
            const newDeletedSet = new Set();
            newDeletedList.forEach(id => {
              getNormalizedIds(id).forEach(v => {
                newDeletedSet.add(v);
                newDeletedSet.add(v.toLowerCase());
              });
            });

            // ⚡ 2. อัปเดต React State ให้สถานะเปลี่ยนเป็นบิลยกเลิกทันที (0ms) เพื่อเด้งเข้าแท็บยกเลิก
            setOrders(prev => prev.map(o => {
                if (isOrderDeleted(o, newDeletedSet)) {
                    return { ...o, status: 'บิลถูกยกเลิก' };
                }
                return o;
            }));

            // ⚡ 3. กวาดล้างแคช LocalStorage & SessionStorage ทันที
            try {
              sessionStorage.removeItem('stk_db_cache');
              if (typeof window.top !== 'undefined') window.top.stkDbCache = {};

              const keysToClean = ['stk_nutrient_orders', 'clinic_mlm_orders', 'clinic_orders', 'rx_orders'];
              keysToClean.forEach(key => {
                const str = localStorage.getItem(key);
                if (str) {
                  try {
                    const list = JSON.parse(str);
                    if (Array.isArray(list)) {
                      const updated = list.filter(o => !isOrderDeleted(o, newDeletedSet));
                      localStorage.setItem(key, JSON.stringify(updated));
                    }
                  } catch(e) {}
                }
              });

              const pendingSaleStr = localStorage.getItem('stk_pending_sale');
              if (pendingSaleStr) {
                try {
                  const pendingSale = JSON.parse(pendingSaleStr);
                  if (isOrderDeleted(pendingSale, newDeletedSet)) {
                    localStorage.removeItem('stk_pending_sale');
                  }
                } catch(e) {}
              }

              localStorage.setItem('stk_refresh_trigger', Date.now().toString());
            } catch (ex) {}

            // Broadcast refresh
            if (typeof BroadcastChannel !== 'undefined') {
              try {
                const bc = new BroadcastChannel('stk_mlm_channel');
                bc.postMessage({ action: 'delete_order', visit_id: order.visit_id, order_id: order.id });
                bc.close();
              } catch(e) {}
            }

            // แสดงแจ้งเตือนลบสำเร็จทันที
            Swal.fire({
              icon: 'success',
              title: 'ลบรายการสำเร็จแล้ว',
              timer: 800,
              showConfirmButton: false
            });

            // ⚡ 4. ส่งคำสั่งลบไปยัง Supabase แบบขนานใน Background (ไม่บล็อก UI)
            (async () => {
              try {
                const targets = [
                  { val: order.id, defaultPk: 'order_id' },
                  { val: order.visit_id, defaultPk: 'visit_id' }
                ];

                const promises = [];

                for (const item of targets) {
                  if (!item.val || item.val === '-') continue;
                  const str = String(item.val).trim();
                  const digits = str.replace(/[^0-9]/g, '');

                  const requests = [];

                  if (str.startsWith('ORD-')) {
                    requests.push({ val: str, pk: 'order_id' });
                  } else if (str.startsWith('VIS-')) {
                    requests.push({ val: str, pk: 'visit_id' });
                    requests.push({ val: `ORD-CLINIC-${str}`, pk: 'order_id' });
                    if (digits) requests.push({ val: `ORD-CLINIC-VIS-${digits}`, pk: 'order_id' });
                  }

                  if (digits) {
                    requests.push({ val: digits, pk: 'visit_id' });
                    requests.push({ val: `VIS-${digits}`, pk: 'visit_id' });
                    requests.push({ val: `ORD-CLINIC-${digits}`, pk: 'order_id' });
                    requests.push({ val: `ORD-CLINIC-VIS-${digits}`, pk: 'order_id' });
                    requests.push({ val: digits, pk: 'id' });
                  }

                  const executedSet = new Set();
                  for (const req of requests) {
                    const key = `${req.pk}:${req.val}`;
                    if (executedSet.has(key)) continue;
                    executedSet.add(key);

                    if (typeof window.supabaseDelete === 'function') {
                      promises.push(window.supabaseDelete('stk_nutrient_orders', req.val, req.pk).catch(() => {}));
                    }
                    if (typeof window.supabaseUpdate === 'function') {
                      promises.push(window.supabaseUpdate('stk_nutrient_orders', req.val, { status: 'บิลถูกยกเลิก' }, req.pk).catch(() => {}));
                    }
                  }
                }

                await Promise.allSettled(promises);
              } catch (e) {
                console.warn('Background DB delete error:', e);
              }
            })();
          }
        });
      };

      return (
      <div className="w-full flex-1 flex flex-col">
        {/* Header Bar */}
        <div className="bg-white border-b border-slate-200 px-6 py-5 shadow-xs">
          <div className="flex flex-col xl:flex-row xl:items-center justify-between gap-4 w-full">
            <div className="flex flex-wrap items-center gap-4">
              <div>
                <h1 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2.5">
                  <span className="p-2 bg-emerald-100 text-emerald-700 rounded-xl">
                    <PillIcon size={26} />
                  </span>
                  สั่งจ่ายยา
                </h1>
                <p className="text-[11px] font-semibold text-slate-500 mt-1">
                  รายการคำสั่งจ่ายยาเสริมจากระบบคลินิก (Clinic System Integration)
                </p>
              </div>

              {/* Search Box */}
              <div className="relative min-w-[220px] self-center">
                <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                  <SearchIcon size={18} />
                </span>
                <input
                  type="text"
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  placeholder="ค้นหารายการ..."
                  className="pl-9 pr-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent w-full shadow-xs"
                />
              </div>
            </div>

            {/* Filtering Controls */}
            <div className="flex flex-wrap items-center gap-3">
              <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 shadow-2xs gap-1">
                <button onClick={() => setFilterPeriod('today')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${quickFilter === 'today' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/60'}`}>วันนี้</button>
                <button onClick={() => setFilterPeriod('month')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${quickFilter === 'month' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/60'}`}>เดือนนี้</button>
                <button onClick={() => setFilterPeriod('all')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all cursor-pointer ${quickFilter === 'all' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/60'}`}>ทั้งหมด</button>
              </div>

              <div className="flex items-center bg-white border border-slate-200 rounded-xl px-2 py-1.5 shadow-xs gap-2">
                <span className="text-[11px] font-bold text-slate-500 whitespace-nowrap">ช่วงเวลาตามสาย:</span>
                <input type="date" value={startDate} onChange={(e) => { setStartDate(e.target.value); setQuickFilter('custom'); }} className="text-[11px] font-semibold text-slate-700 border-none bg-transparent focus:outline-none" />
                <span className="text-slate-400 text-[11px]">-</span>
                <input type="date" value={endDate} onChange={(e) => { setEndDate(e.target.value); setQuickFilter('custom'); }} className="text-[11px] font-semibold text-slate-700 border-none bg-transparent focus:outline-none" />
              </div>

              <button onClick={fetchOrders} className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-[11px] font-bold transition-colors border border-slate-200 shadow-xs cursor-pointer" title="รีเฟรชข้อมูล">
                <RefreshCw size={16} />
                <span>รีเฟรช</span>
              </button>
            </div>
          </div>

          {/* Main Table Content - TABS */}
          <div className="flex-1 w-full p-4 sm:p-6">
            <div className="flex border-b border-slate-200 mb-6 gap-2 sm:gap-6 overflow-x-auto custom-scrollbar">
              <button onClick={() => setActiveTab('pending')} className={`pb-3 text-sm font-black transition-colors border-b-2 whitespace-nowrap flex items-center gap-2 ${activeTab === 'pending' ? 'text-amber-600 border-amber-500' : 'text-slate-500 border-transparent hover:text-slate-700'}`}>
                <span className="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>รอดำเนินการ <span className={`py-0.5 px-2 rounded-full text-[10px] ${activeTab === 'pending' ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-500'}`}>{pendingOrders.length}</span>
              </button>
              <button onClick={() => setActiveTab('completed')} className={`pb-3 text-sm font-black transition-colors border-b-2 whitespace-nowrap flex items-center gap-2 ${activeTab === 'completed' ? 'text-emerald-600 border-emerald-500' : 'text-slate-500 border-transparent hover:text-slate-700'}`}>
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>สำเร็จแล้ว <span className={`py-0.5 px-2 rounded-full text-[10px] ${activeTab === 'completed' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}`}>{completedOrders.length}</span>
              </button>
              <button onClick={() => setActiveTab('canceled')} className={`pb-3 text-sm font-black transition-colors border-b-2 whitespace-nowrap flex items-center gap-2 ${activeTab === 'canceled' ? 'text-rose-600 border-rose-500' : 'text-slate-500 border-transparent hover:text-slate-700'}`}>
                <span className="w-2.5 h-2.5 rounded-full bg-rose-500"></span>บิลถูกยกเลิก <span className={`py-0.5 px-2 rounded-full text-[10px] ${activeTab === 'canceled' ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-500'}`}>{canceledOrders.length}</span>
              </button>
            </div>

            {/* Table Area */}
            <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
              <div className="overflow-x-auto custom-scrollbar">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-50/90 border-b border-slate-200 text-[11px] font-bold text-slate-700">
                      <th className="py-3 px-3 border-r border-slate-200/60">รหัส VISIT</th>
                      <th className="py-3 px-3 border-r border-slate-200/60">HN</th>
                      <th className="py-3 px-3 border-r border-slate-200/60">ชื่อ-นามสกุล</th>
                      <th className="py-3 px-3 border-r border-slate-200/60">โรค/อาการ</th>
                      <th className="py-3 px-3 border-r border-slate-200/60">ผู้แนะนำ</th>
                      <th className="py-3 px-3 border-r border-slate-200/60">ผู้สั่งจ่าย / ผู้ปิดบิล</th>
                      <th className="py-3 px-3 border-r border-slate-200/60 w-[35%]">รายการจัดสั่งจ่ายยา / จำนวน</th>
                      <th className="py-3 px-3 text-center">{activeTab === 'pending' ? 'ดำเนินการ' : 'สถานะการขาย'}</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-200 text-[11px] font-medium text-slate-800">
                    {loading ? (
                      <tr>
                        <td colSpan="8" className="py-12 text-center text-slate-400 font-semibold">
                          <div className="inline-block animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent mb-2"></div>
                          <p>กำลังดึงข้อมูลจากระบบ...</p>
                        </td>
                      </tr>
                    ) : (() => {
                      const displayData = activeTab === 'pending' ? pendingOrders : activeTab === 'completed' ? completedOrders : canceledOrders;
                      if (displayData.length === 0) {
                        return (
                          <tr>
                            <td colSpan="8" className="py-16 text-center text-slate-400 font-semibold">
                              <div className="flex flex-col items-center justify-center gap-2">
                                <div className="p-3 bg-slate-100 text-slate-400 rounded-full mb-1"><InboxIcon size={36} /></div>
                                <p className="text-sm font-bold text-slate-600">{activeTab === 'pending' ? 'ไม่มีรายการรอดำเนินการ' : activeTab === 'completed' ? 'ยังไม่มีประวัติการทำรายการสำเร็จ' : 'ไม่มีประวัติบิลถูกยกเลิก'}</p>
                              </div>
                            </td>
                          </tr>
                        );
                      }
                      return displayData.map((ord, index) => (
                        <tr key={ord.id || index} className="hover:bg-slate-50/60 transition-colors">
                          <td className="py-2 px-3 font-bold text-slate-900 align-middle whitespace-nowrap border-r border-slate-100">
                            <div>{ord.visit_id}</div>
                            {ord.date && (
                              <div className="text-[10px] font-semibold text-slate-500 flex items-center gap-1 mt-0.5">
                                <ClockIcon size={11} />
                                <span>{formatOrderDateTime(ord.date)}</span>
                              </div>
                            )}
                          </td>
                          <td className="py-2 px-3 text-slate-700 font-semibold align-middle whitespace-nowrap border-r border-slate-100">{ord.hn}</td>
                          <td className="py-2 px-3 font-bold text-slate-900 align-middle border-r border-slate-100 ">
                            <div>{ord.customer_name}</div>
                            {ord.phone && ord.phone !== '-' && ord.phone !== '--' && (
                              <div className="text-[10px] font-semibold text-emerald-700 flex items-center gap-1 mt-0.5">
                                <PhoneIcon size={11} />
                                <span>{ord.phone}</span>
                              </div>
                            )}
                            <div className="flex items-center gap-1 mt-1 flex-wrap">
                              {(() => {
                                const currentEffectiveType = (customTypeOverrides && (customTypeOverrides[ord.id] || customTypeOverrides[ord.visit_id])) || ord.customer_type;
                                const hnCandidates = (typeof window.normalizeHnCandidates === 'function')
                                  ? window.normalizeHnCandidates(ord.hn)
                                  : [String(ord.hn || '').trim().toUpperCase()];
                                const isHnInDb = hnCandidates.some(c => c && c !== '-' && existingCustomersData.hns && existingCustomersData.hns.has(c));
                                const pClean = String(ord.phone || '').replace(/[^0-9]/g, '');
                                const nClean = String(ord.customer_name || '').trim().toLowerCase();
                                const isExisting = Boolean(
                                  isHnInDb ||
                                  (pClean && pClean.length >= 7 && existingCustomersData.phones && existingCustomersData.phones.has(pClean)) ||
                                  (nClean && nClean !== '-' && existingCustomersData.names && existingCustomersData.names.has(nClean))
                                );
                                const normType = (typeof window.resolveVisitCustomerType === 'function')
                                  ? window.resolveVisitCustomerType(ord.visit_id, isExisting, currentEffectiveType, currentLang, {
                                      disease: ord.disease,
                                      symptom: ord.disease,
                                      customer_name: ord.customer_name,
                                      hn: ord.hn
                                    })
                                  : { name: currentEffectiveType || 'ลูกค้าใหม่มาตรวจ', display: currentEffectiveType || 'ลูกค้าใหม่มาตรวจ', isOld: isExisting };
                                
                                return (
                                  <button
                                    type="button"
                                    onClick={(e) => {
                                      e.stopPropagation();
                                      handleCreateDraftOrder({ ...ord, customer_type: normType.name });
                                    }}
                                    className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-black cursor-pointer hover:opacity-80 transition-all ${normType.isOld ? 'bg-amber-100 text-amber-800 border border-amber-300 hover:bg-amber-200' : 'bg-blue-100 text-blue-800 border border-blue-300 hover:bg-blue-200'}`}
                                    title="คลิกเพื่อตรวจสอบหรือเปลี่ยนประเภทลูกค้า"
                                  >
                                    🏷️ {normType.display}
                                    <span className="text-[8px] opacity-60">✏️</span>
                                  </button>
                                );
                              })()}
                            </div>
                          </td>
                          <td className="py-2 px-3 text-slate-600 align-middle border-r border-slate-100 ">{ord.disease || '-'}</td>
                          <td className="py-2 px-3 font-bold text-slate-700 align-middle border-r border-slate-100 ">{ord.recorded_by || '-'}</td>
                          <td className="py-2 px-3 align-middle border-r border-slate-100 ">
                            {(() => {
                              const cInfo = resolveOrderCloserInfo(ord);
                              return (
                                <div className="space-y-1">
                                  <div className="font-bold text-slate-800 text-[11px]">{cInfo.closerName}</div>
                                  <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[9.5px] font-black ${cInfo.badgeClass || (cInfo.closerTeam === 'Center' ? 'bg-indigo-50 text-indigo-700 border border-indigo-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200')}`}>
                                    {cInfo.badgeText || (cInfo.orderByType === 'หมอสั่งจ่าย' ? '🩺 หมอปิด (Center)' : '👤 สั่งเอง (Marketing)')}
                                  </span>
                                </div>
                              );
                            })()}
                          </td>
                          <td className="p-3 align-middle border-r border-slate-100">
                            <div className="rounded-xl border border-slate-200/80 overflow-hidden bg-white shadow-xs">
                              <table className="w-full text-left border-collapse">
                                <thead>
                                  <tr className="bg-slate-50 border-b border-slate-200 text-[10px] font-bold text-slate-700">
                                    <th className="py-1.5 px-2 border-r border-slate-200/60">ชื่อยา/อาหารเสริม</th>
                                    <th className="py-1.5 px-2 text-center border-r border-slate-200/60">ประเภท</th>
                                    <th className="py-1.5 px-2 text-center border-r border-slate-200/60">จำนวน</th>
                                    <th className="py-1.5 px-2 text-right border-r border-slate-200/60">ราคา</th>
                                    <th className="py-1.5 px-2 text-right">รวมราคา</th>
                                  </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 text-[11px] font-semibold text-slate-700">
                                  {ord.items && ord.items.map((item, idx) => {
                                    const unitPrice = (item.price !== undefined && item.price !== null && item.price !== '') ? Number(item.price) : 1300;
                                    const qty = Number(item.qty || 1);
                                    const subtotal = (item.total !== undefined && item.total !== null && item.total !== '') ? Number(item.total) : (unitPrice * qty);
                                    const itemSource = item.source || 'คลังยา';
                                    const priceTypeBadge = getItemTypeLabel(item);
                                    return (
                                      <tr key={idx} className="hover:bg-slate-50/80 transition-colors">
                                        <td className="py-1.5 px-2 border-r border-slate-100 align-middle">
                                          <div className="flex items-center gap-2">
                                            <span className="font-bold text-slate-800">{item.name}</span>
                                            <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-cyan-100 text-cyan-700 border border-cyan-200">{itemSource}</span>
                                          </div>
                                        </td>
                                        <td className="py-1.5 px-2 text-center border-r border-slate-100 align-middle">
                                          <span className={`inline-block px-2.5 py-0.5 rounded-md text-[10px] font-bold shadow-2xs ${priceTypeBadge === 'ราคาส่ง/สมาชิก' ? 'bg-amber-100 text-amber-800 border border-amber-200' : priceTypeBadge === 'ราคาโปร' ? 'bg-purple-100 text-purple-800 border border-purple-200' : priceTypeBadge === 'แถมฟรี' ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-slate-100 text-slate-700 border border-slate-200'}`}>{priceTypeBadge}</span>
                                        </td>
                                        <td className="py-1.5 px-2 text-center font-bold text-slate-800 border-r border-slate-100 align-middle">{qty}</td>
                                        <td className="py-1.5 px-2 text-right text-slate-600 border-r border-slate-100 align-middle">{unitPrice.toLocaleString()}</td>
                                        <td className="py-1.5 px-2 text-right font-bold text-slate-900 align-middle">{subtotal.toLocaleString()}</td>
                                      </tr>
                                    );
                                  })}
                                </tbody>
                              </table>
                            </div>
                          </td>
                          <td className="py-3 px-3 text-center align-middle whitespace-nowrap">
                            {activeTab === 'pending' ? (
                              <div className="flex items-center justify-center gap-1.5">
                                <button onClick={() => handleCreateDraftOrder(ord)} className="inline-flex items-center justify-center gap-1 px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-[11px] shadow-xs shadow-emerald-200 transition-all transform active:scale-95 cursor-pointer" title="สร้างร่างใบสั่งซื้อ"><CheckCircle size={14} />ร่างใบสั่งซื้อ</button>
                                <button onClick={() => handleDeleteOrder(ord)} className="inline-flex items-center justify-center gap-1 px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 hover:border-rose-300 font-bold rounded-xl text-[11px] shadow-2xs transition-all transform active:scale-95 cursor-pointer" title="ลบรายการนี้"><Trash2 size={14} />ลบ</button>
                              </div>
                            ) : (
                              <span className="inline-flex flex-col items-center gap-1.5">
                                {ord.status === 'บิลถูกยกเลิก' ? <span className="px-2.5 py-1 bg-rose-100 text-rose-800 font-bold rounded-xl text-[11px] border border-rose-200 shadow-xs">บิลถูกยกเลิก</span> : <span className="px-2.5 py-1 bg-emerald-100 text-emerald-800 font-bold rounded-xl text-[11px] border border-emerald-200 shadow-xs">ขายสำเร็จแล้ว</span>}
                                {ord.sale_order_id && <a href={window.resolvePageUrl ? window.resolvePageUrl(`Sales.html?editId=${encodeURIComponent(ord.sale_order_id)}`) : `Sales.html?editId=${encodeURIComponent(ord.sale_order_id)}`} className="text-[10px] text-blue-600 font-bold hover:underline" title="กดเพื่อดูประวัติการขายบิลนี้">บิลเลขที่: {ord.sale_order_id}</a>}
                              </span>
                            )}
                          </td>
                        </tr>
                      ));
                    })()}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
        </div>
    );
}

    // Root App Wrapper Component with Sidebar & Navigation
    function App() {
      const SidebarComp = window.Sidebar || (window.CommonComponents ? window.CommonComponents.Sidebar : null);
      const LoginModalComp = window.LoginModal || (window.CommonComponents ? window.CommonComponents.LoginModal : null);

      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const userStr = localStorage.getItem('stk_current_user') || localStorage.getItem('stk_user');
          if (userStr) return JSON.parse(userStr);
        } catch(e) {}
        return { name: 'Administrator', role: 'ผู้ดูแลระบบ' };
      });
      const [isLoggedIn, setIsLoggedIn] = useState(true);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch(e) { return false; }
      });

      const SCRIPT_URL = (() => {
        try { if (window.top && window.top.location && window.top.location.href.startsWith('http')) return window.top.location.href.split('?')[0]; } catch(e){}
        return "";
      })();

      useEffect(() => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 300);
        }
      }, []);

      const handleLoginSuccess = (user) => {
        localStorage.setItem('stk_current_user', JSON.stringify(user));
        setCurrentUser(user);
        setIsLoggedIn(true);
        setShowLoginModal(false);
      };

      const handleLogout = () => {
        localStorage.removeItem('stk_current_user');
        localStorage.removeItem('stk_user');
        setCurrentUser(null);
        setIsLoggedIn(false);
        if (window.resolvePageUrl) window.location.href = window.resolvePageUrl('?page=dashboard');
      };

      return (
        <div class="min-h-screen bg-slate-50 flex flex-col">
          {/* Sidebar Navigation */}
          {SidebarComp ? (
            <SidebarComp
              activePage="nutrients"
              isLoggedIn={isLoggedIn}
              currentUser={currentUser}
              isAdmin={true}
              onLogout={handleLogout}
              showLoginModal={showLoginModal}
              setShowLoginModal={setShowLoginModal}
              SCRIPT_URL={SCRIPT_URL}
              isSidebarCollapsed={isSidebarCollapsed}
              setIsSidebarCollapsed={setIsSidebarCollapsed}
            />
          ) : null}

          {/* Main View */}
          <main class={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>
            <NutrientsView />
          </main>

          {LoginModalComp ? (
            <LoginModalComp
              isOpen={showLoginModal}
              onClose={() => setShowLoginModal(false)}
              onLoginSuccess={handleLoginSuccess}
            />
          ) : null}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
