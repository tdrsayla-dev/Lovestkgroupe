                                                        <option value="กสิกรไทย">KBANK</option>
                                                        <option value="ไทยพาณิชย์">SCB</option>
                                                        <option value="กรุงเทพ">BBL</option>
                                                        <option value="กรุงไทย">KTB</option>
                                                        <option value="กรุงศรี">BAY</option>
                                                        <option value="PromptPay">Prompt</option>
                                                    </select>
                                                    <div className="flex-1 relative">
                                                        <span className="absolute left-2.5 top-1 text-[9px] text-slate-400 font-bold">฿</span>
                                                        <input type="text" inputMode="decimal" placeholder="บาท" className="w-full pl-6 pr-1 py-1 rounded-md border border-blue-300 bg-white text-slate-800 text-[11px] font-bold outline-none focus:border-blue-500 shadow-sm" value={formatDisplayNumber(payTransferThaiTHB)} onChange={handleNumberInput(setPayTransferThaiTHB)} />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {(() => {
                                        const cTHB = parseFloat(payCashTHB) || 0;
                                        const cLAK = parseFloat(payCashLAK) || 0;
                                        const tThaiTHB = parseFloat(payTransferThaiTHB) || 0;
                                        const tLaosTHB = parseFloat(payTransferLaosTHB) || 0;
                                        const tLaosLAK = parseFloat(payTransferLaosLAK) || 0;

                                        const showCash = payMode === 'สด' || payMode === 'สด+โอน';
                                        const showTransfer = payMode === 'โอน' || payMode === 'สด+โอน';

                                        const totalPaidTHB = (showCash ? cTHB + (cLAK / exchangeRate) : 0) + (showTransfer ? tThaiTHB + tLaosTHB + (tLaosLAK / exchangeRate) : 0);
                                        const remainingTHB = Math.round((cartTotals.amount - totalPaidTHB) * 100) / 100;
                                        const remainingLAK = remainingTHB * exchangeRate;

                                        return (
                                            <div className="flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-200 shadow-inner mb-1.5">
                                                {remainingTHB > 0 ? (
                                                    <React.Fragment>
                                                        <div className="text-[10px] font-black text-red-500">🔴 ค้างชำระ<br /><span className="text-[8px] font-bold text-slate-400">(ต้องเก็บเพิ่ม)</span></div>
                                                        <div className="text-right">
                                                            <div className="text-sm font-black text-red-600 leading-none">฿{remainingTHB.toLocaleString()}</div>
                                                            <div className="text-[9px] font-bold text-red-500/80">≈ {Math.round(remainingLAK).toLocaleString()} ₭</div>
                                                        </div>
                                                    </React.Fragment>
                                                ) : remainingTHB < 0 ? (
                                                    <React.Fragment>
                                                        <div className="text-[10px] font-black text-blue-500">🔵 เงินทอน<br /><span className="text-[8px] font-bold text-slate-400">(ต้องทอนลูกค้า)</span></div>
                                                        <div className="text-right">
                                                            <div className="text-sm font-black text-blue-600 leading-none">฿{Math.abs(remainingTHB).toLocaleString()}</div>
                                                            <div className="text-[9px] font-bold text-blue-500/80">≈ {Math.round(Math.abs(remainingLAK)).toLocaleString()} ₭</div>
                                                        </div>
                                                    </React.Fragment>
                                                ) : (
                                                    <React.Fragment>
                                                        <div className="text-[10px] font-black text-emerald-500">🟢 สถานะชำระ</div>
                                                        <div className="text-xs font-black text-emerald-600">ครบพอดี ✓</div>
                                                    </React.Fragment>
                                                )}
                                            </div>
                                        );
                                    })()}
                                </React.Fragment>
                            )}
                            <textarea
                                rows="3"
                                placeholder="หมายเหตุ / รายละเอียดจ่ายเงิน..."
                                className="w-full border border-slate-200 bg-slate-50 px-3 py-2 rounded-lg outline-none text-[12px] font-bold text-slate-800 focus:border-blue-500 focus:bg-white shadow-sm mb-0 flex-1 resize-none h-full"
                                value={paymentNote}
                                onChange={(e) => setPaymentNote(e.target.value)}
                            />
                        </div>
                    </div>

                    {/* RIGHT COLUMN (50%): Floating Search + Cart + ปุ่มบันทึกบิล */}
                    <div className="w-full xl:w-1/2 flex flex-col gap-4 xl:h-full relative">

                        <div className="bg-white border border-slate-200 rounded-xl p-3 shadow-sm shrink-0 relative z-50">
                            <div className="flex items-center gap-2">
                                <SearchIcon size={20} className="text-slate-400 ml-2" />
                                <input
                                    type="text"
                                    className="w-full bg-slate-50 border-none outline-none focus:ring-0 text-[15px] font-bold placeholder-slate-400 rounded-xl py-2.5 px-3"
                                    placeholder="ค้นหาสินค้า (พิมพ์ชื่อ หรือ ยิงบาร์โค้ด แล้วกด Enter)..."
                                    value={catalogSearch}
                                    onChange={(e) => setCatalogSearch(e.target.value)}
                                    onKeyDown={handleBarcodeScan}
                                />
                                {catalogSearch && <button onClick={() => setCatalogSearch('')} className="text-slate-400 hover:text-red-500 p-2"><X size={18} /></button>}
                            </div>

                            {/* Dropdown ผลลัพธ์การค้นหา */}
                            {catalogSearch.trim() !== '' && (
                                <div className="absolute top-[110%] left-0 w-full bg-white border border-slate-200 shadow-2xl rounded-2xl max-h-[400px] overflow-y-auto py-2 z-50 custom-scrollbar">
                                    <div className="px-4 py-2 border-b border-slate-100 bg-slate-50 sticky top-0 z-10 -mt-2 mb-2">
                                        <span className="text-xs font-black text-slate-600">👇 กรุณาคลิกเลือกราคาเพื่อเพิ่มลงตะกร้า</span>
                                    </div>
                                    {loading ? (
                                        <div className="flex flex-col items-center justify-center py-20 gap-4">
                                            <div className="w-10 h-10 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                                            <p className="text-slate-500 font-bold text-sm">กำลังโหลดสินค้า...</p>
                                        </div>
                                    ) : filteredProductsList.length > 0 ? filteredProductsList.map(prod => {
                                        const isOutOfStock = prod.stock <= 0;
                                        return (
                                            <div key={prod.id} className="flex flex-col sm:flex-row justify-between items-start sm:items-center p-3.5 border-b border-slate-100 hover:bg-slate-50 gap-4">
                                                <div className="flex items-center gap-3">
                                                    <div className="w-12 h-12 rounded-lg bg-slate-100 flex items-center justify-center shrink-0 border border-slate-200 overflow-hidden shadow-sm">
                                                        {prod.imageUrl ? <img src={prod.imageUrl} className="w-full h-full object-cover" /> : <PackageIcon size={20} className="text-slate-300" />}
                                                    </div>
                                                    <div>
                                                        <div className="font-black text-[15px] text-slate-800 flex items-center gap-2">
                                                            {prod.name}
                                                            <span className="text-[10px] font-bold text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded border border-slate-200">#{prod.id}</span>
                                                        </div>
                                                        <div className={`text-xs font-bold mt-1 ${isOutOfStock ? 'text-red-500' : 'text-emerald-600'}`}>คงเหลือ: {prod.stock} ชิ้น</div>
                                                    </div>
                                                </div>
                                                <div className="flex gap-2 w-full sm:w-auto mt-2 sm:mt-0">
                                                    <button disabled={isOutOfStock} onClick={() => { handleAddToCart(prod.name, 'ราคาเต็ม'); setCatalogSearch(''); }} className="flex-1 sm:flex-none px-4 py-2.5 bg-green-50 text-green-700 hover:bg-green-600 hover:text-white text-[13px] font-black rounded-xl border border-green-300 shadow-sm transition-all text-center">ราคาเต็ม ฿{(prod.priceFull || 0).toLocaleString()}</button>
                                                    <button disabled={isOutOfStock} onClick={() => { handleAddToCart(prod.name, 'ราคาสมาชิก'); setCatalogSearch(''); }} className="flex-1 sm:flex-none px-4 py-2.5 bg-purple-50 text-purple-700 hover:bg-purple-600 hover:text-white text-[13px] font-black rounded-xl border border-purple-300 shadow-sm transition-all text-center">ราคาสมาชิก ฿{(prod.priceMember || 0).toLocaleString()}</button>
                                                    <button disabled={isOutOfStock} onClick={() => { handleAddToCart(prod.name, 'ราคาโปร'); setCatalogSearch(''); }} className="flex-1 sm:flex-none px-4 py-2.5 bg-orange-50 text-orange-700 hover:bg-orange-500 hover:text-white text-[13px] font-black rounded-xl border border-orange-300 shadow-sm transition-all text-center">ราคาโปร ฿{(prod.pricePromo || 0).toLocaleString()}</button>
                                                    <button disabled={isOutOfStock} onClick={() => { handleAddToCart(prod.name, 'ราคาศูนย์'); setCatalogSearch(''); }} className="flex-1 sm:flex-none px-4 py-2.5 bg-slate-100 text-slate-600 hover:bg-slate-500 hover:text-white text-[13px] font-black rounded-xl border border-slate-300 shadow-sm transition-all text-center">ราคาศูนย์ ฿0</button>
                                                </div>
                                            </div>
                                        )
                                    }) : (
                                        <div className="p-6 text-center text-slate-500 text-[13px] font-bold">❌ ไม่พบสินค้าที่ค้นหา</div>
                                    )}
                                </div>
                            )}
                        </div>

                        <div className="h-[350px] sm:h-[400px] xl:h-auto xl:flex-1 flex flex-col bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden z-10">
                            <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 shrink-0">
                                <h4 className="font-extrabold text-[15px] text-slate-800 flex items-center gap-2">
                                    <ShoppingCart size={20} className="text-blue-600" /> ตะกร้าสินค้า ({cart.length})
                                </h4>
                                <button type="button" onClick={() => setCart([])} disabled={cart.length === 0} className="text-[12px] font-bold text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg transition-colors disabled:opacity-50 border border-red-100 shadow-sm">ล้างตะกร้า</button>
                            </div>

                            <div className="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-3 bg-slate-50/50">
                                {cart.map((item, idx) => {
                                    const prodObj = (products || []).find(p => p.name === item.productName) || {};
                                    const img = prodObj.imageUrl && prodObj.imageUrl.trim() !== '' ? prodObj.imageUrl : null;
                                    return (
                                        <div key={`${item.productName}-${item.priceType}`} className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 p-3 bg-white rounded-xl border border-slate-200 hover:border-blue-300 transition-all shadow-sm">

                                            <div className="flex items-center gap-3 flex-1 min-w-0 w-full">
                                                <div className="w-14 h-14 rounded-lg bg-slate-50 border border-slate-100 flex items-center justify-center shrink-0 overflow-hidden shadow-sm">
                                                    {img ? <img src={img} alt={item.productName} className="w-full h-full object-cover" /> : <PackageIcon size={24} className="text-slate-300" />}
                                                </div>
                                                <div className="flex flex-col min-w-0 flex-1">
                                                    <div className="font-black text-[15px] text-slate-800 truncate" title={item.productName}>{item.productName}</div>
                                                    <div className="flex items-center gap-2 mt-1">
                                                        <select
                                                            className="text-[12px] font-black border border-slate-200 bg-slate-50 text-slate-700 rounded-md px-2 py-1 outline-none focus:border-blue-500 cursor-pointer shadow-sm"
                                                            value={item.priceType} onChange={(e) => handleUpdateCartPriceType(item.productName, item.priceType, e.target.value)}
                                                        >
                                                            <option value="ราคาเต็ม">ราคาเต็ม</option>
                                                            <option value="ราคาสมาชิก">ราคาสมาชิก</option>
                                                            <option value="ราคาโปร">ราคาโปร</option>
                                                            <option value="ราคาศูนย์">ราคาศูนย์</option>
                                                        </select>
                                                        <span className="text-[13px] font-black text-blue-600">฿{(item.price || 0).toLocaleString()}</span>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="flex items-center justify-between pt-2 border-t border-slate-100 sm:border-0 sm:pt-0 shrink-0 gap-3 w-full sm:w-auto">
                                                <div className="flex items-center border border-slate-200 bg-slate-50 rounded-lg overflow-hidden shadow-sm h-10">
                                                    <button type="button" onClick={() => handleUpdateCartQty(item.productName, item.priceType, -1)} className="px-4 text-slate-500 hover:bg-white hover:text-red-500 font-bold transition-colors">-</button>
                                                    <input
                                                        type="text"
                                                        inputMode="numeric"
                                                        className="font-black text-[15px] text-blue-700 w-14 text-center bg-white h-full border-x border-slate-200 outline-none focus:bg-blue-50 focus:text-blue-800 transition-colors"
                                                        value={item.qty}
                                                        onChange={(e) => {
                                                            const val = e.target.value.replace(/[^0-9]/g, '');
                                                            handleSetCartQty(item.productName, item.priceType, val);
                                                        }}
                                                        onBlur={(e) => {
                                                            if (!e.target.value || parseInt(e.target.value) < 1) {
                                                                handleSetCartQty(item.productName, item.priceType, 1);
                                                            }
                                                        }}
                                                    />
                                                    <button type="button" onClick={() => handleUpdateCartQty(item.productName, item.priceType, 1)} className="px-4 text-slate-500 hover:bg-white hover:text-green-600 font-bold transition-colors">+</button>
                                                </div>
                                                <div className="text-[16px] font-black text-slate-800 w-20 text-right">฿{((item.price || 0) * item.qty).toLocaleString()}</div>
                                                <button type="button" onClick={() => handleRemoveFromCart(item.productName, item.priceType)} className="p-2.5 text-red-500 hover:bg-red-50 hover:text-red-700 rounded-lg transition-colors border border-transparent hover:border-red-200 shrink-0">
                                                    <Trash2 size={18} />
                                                </button>
                                            </div>
                                        </div>
                                    )
                                })}
                                {cart.length === 0 && (
                                    <div className="flex flex-col items-center justify-center py-32 text-slate-300 gap-4 h-full">
                                        <ShoppingCart size={64} className="stroke-1 text-slate-200" />
                                        <span className="text-[15px] font-bold text-slate-400">ยังไม่มีสินค้าในตะกร้า</span>
                                    </div>
                                )}
                            </div>
                        </div>

                        <button type="button" onClick={handleAdd} disabled={isSubmitting || cart.length === 0} className={`w-full py-4 rounded-2xl font-black text-[16px] shadow-lg transition-all shrink-0 mt-1 ${isSubmitting || cart.length === 0 ? 'bg-slate-200 text-slate-400 cursor-not-allowed border border-slate-300' : 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white hover:from-blue-500 hover:to-indigo-500 hover:-translate-y-0.5'}`}>
                            {isSubmitting ? 'กำลังบันทึก...' : editingSaleId ? '💾 บันทึกแก้ไขบิล' : '💳 บันทึกบิลชำระเงิน'}
                        </button>

                    </div>
                </div>
            );

            return (
                <div className="flex flex-col gap-5 h-full animation-fade-in relative z-10 w-full mx-auto pb-28 xl:pb-6">
                    <ConfirmModal isOpen={confirmDelete.show} onClose={() => setConfirmDelete({ show: false, id: null, title: '' })} onConfirm={executeDeleteSale} title="ยืนยันการลบประวัติการขาย" message={`คุณต้องการลบข้อมูลบิล "${confirmDelete.title}" ใช่หรือไม่? (ไม่สามารถกู้คืนได้)`} />

                    <EditModal isOpen={successModal.show} onClose={() => { setSuccessModal({ show: false, saleRecord: null }); handleCancelEdit(); }} title="สถานะการบันทึก" icon={CheckCircle} maxWidthClass="max-w-md">
                        <div className="flex flex-col items-center justify-center p-4 text-center gap-4">
                            <div className="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mb-2">
                                <CheckCircle size={48} />
                            </div>
                            <div>
                                <h3 className="text-2xl font-black text-slate-800">บันทึกบิลสำเร็จ!</h3>
                                <p className="text-slate-500 font-medium mt-1">รหัสบิล: <span className="text-blue-600 font-bold">{successModal.saleRecord?.id}</span></p>
                            </div>

                            <div className="flex flex-col w-full gap-3 mt-2">
                                <button
                                    type="button"
                                    onClick={() => {
                                        handlePrintReceiptPopup(successModal.saleRecord);
                                        setSuccessModal({ show: false, saleRecord: null });
                                        handleCancelEdit();
                                    }}
                                    className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition-colors flex items-center justify-center gap-2"
                                >
                                    <PrinterIcon size={18} /> พิมพ์ใบเสร็จ (Print Receipt)
                                </button>
                                <button
                                    type="button"
                                    onClick={() => { setSuccessModal({ show: false, saleRecord: null }); handleCancelEdit(); }}
                                    className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl border border-slate-200 transition-colors"
                                >
                                    เสร็จสิ้น (คีย์บิลใหม่)
                                </button>
                            </div>
                        </div>
                    </EditModal>

                    <EditModal isOpen={!!viewBillDetail} onClose={() => setViewBillDetail(null)} title={`รายละเอียดบิล (Bill Detail)`} icon={Eye} maxWidthClass="max-w-3xl">
                        {viewBillDetail && (
                            <div className="space-y-6">
                                <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 grid grid-cols-2 md:grid-cols-4 gap-4 text-sm relative overflow-hidden">
                                    <div className="col-span-full border-b border-slate-200 pb-3 mb-1 flex justify-between items-center">
                                        <h3 className="text-lg font-black text-slate-800">รหัสบิล: <span className="text-blue-600">{viewBillDetail.id}</span></h3>
                                        <span className="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-lg text-xs font-bold shadow-sm border border-emerald-200">✅ บันทึกสำเร็จ</span>
                                    </div>
                                    <div>
                                        <span className="block text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">วันที่บิล</span>
                                        <span className="block text-sm font-black text-slate-800">{formatDbDateForFilter(viewBillDetail.date)}</span>
                                    </div>
                                    <div>
                                        <span className="block text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">รหัสลูกค้า</span>
                                        <span className="block text-sm font-black text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded inline-block">{viewBillDetail.customerId}</span>
                                    </div>
                                    <div className="md:col-span-2">
                                        <span className="block text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">ผู้ขาย (เจ้าของเคส)</span>
                                        <span className="block text-sm font-black text-slate-800 truncate">{viewBillDetail.memberName || viewBillDetail.memberId}</span>
                                    </div>
                                    <div className="md:col-span-4 border-t border-slate-200 pt-3 mt-1">
                                        <span className="block text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-1">พนักงานผู้ทำรายการ</span>
                                        <span className="block text-sm font-bold text-slate-600">{viewBillDetail.recordedBy || '-'}</span>
                                    </div>
                                </div>

                                <div className="border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                                    <table className="w-full text-left text-sm">
                                        <thead className="bg-slate-100 border-b border-slate-200 text-slate-600 text-[11px] uppercase tracking-wider">
                                            <tr>
                                                <th className="p-3 font-black pl-4">รายการสินค้า</th>
                                                <th className="p-3 text-right font-black">ราคา/ชิ้น</th>
                                                <th className="p-3 text-center font-black w-24">จำนวน</th>
                                                <th className="p-3 text-right font-black pr-4">รวม (THB)</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {Object.keys(viewBillDetail).filter(k => k.includes('_ราคา') && !k.includes('รวมชิ้น') && viewBillDetail[k] > 0).map(key => {
                                                const qty = viewBillDetail[key];
                                                let productName = ''; let priceType = ''; let unitPrice = 0;

                                                if (key.endsWith('_ราคาเต็ม')) { productName = key.replace('_ราคาเต็ม', ''); priceType = 'ราคาเต็ม'; }
                                                else if (key.endsWith('_ราคาโปร')) { productName = key.replace('_ราคาโปร', ''); priceType = 'ราคาโปร'; }
                                                else if (key.endsWith('_ราคาสมาชิก')) { productName = key.replace('_ราคาสมาชิก', ''); priceType = 'ราคาสมาชิก'; }
                                                else if (key.endsWith('_ราคาศูนย์')) { productName = key.replace('_ราคาศูนย์', ''); priceType = 'ราคาศูนย์'; }

                                                const prodObj = (products || []).find(p => p.name === productName) || {};
                                                if (priceType === 'ราคาเต็ม') unitPrice = parseFloat(prodObj.priceFull || 0);
                                                else if (priceType === 'ราคาโปร') unitPrice = parseFloat(prodObj.pricePromo || 0);
                                                else if (priceType === 'ราคาสมาชิก') unitPrice = parseFloat(prodObj.priceMember || 0);
                                                else if (priceType === 'ราคาศูนย์') unitPrice = 0;

                                                const itemTotal = unitPrice * qty;

                                                return (
                                                    <tr key={key} className="bg-white hover:bg-slate-50 transition-colors">
                                                        <td className="p-3 pl-4">
                                                            <div className="font-black text-[13px] text-slate-800">{productName}</div>
                                                            <div className="text-[10px] text-slate-500 font-bold mt-0.5">{priceType}</div>
                                                        </td>
                                                        <td className="p-3 text-right font-bold text-slate-600">฿{unitPrice.toLocaleString()}</td>
                                                        <td className="p-3 text-center font-black text-lg text-blue-600 bg-blue-50/30 border-x border-slate-50">{qty}</td>
                                                        <td className="p-3 text-right font-black text-slate-800 pr-4">฿{itemTotal.toLocaleString()}</td>
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                        <tfoot className="bg-blue-50/50 border-t-2 border-blue-100">
                                            <tr>
                                                <td colSpan="2" className="p-4 text-right font-black text-slate-600 uppercase">รวมจำนวนชิ้นทั้งหมด:</td>
                                                <td className="p-4 text-center font-black text-2xl text-blue-700 bg-blue-100/50 rounded-b-xl border-x border-blue-100/50">
                                                    {Object.keys(viewBillDetail).filter(k => k.includes('_ราคา') && !k.includes('รวมชิ้น') && viewBillDetail[k] > 0).reduce((sum, key) => sum + parseInt(viewBillDetail[key]), 0)}
                                                </td>
                                                <td></td>
                                            </tr>
                                        </tfoot>
                                    </table>
                                    <div className="flex flex-col gap-1 w-full md:w-auto">
                                        <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">ช่องทางชำระเงิน</span>
                                        <span className="text-sm font-black text-slate-800 bg-white px-3 py-1.5 rounded-lg border border-blue-100 inline-block w-fit shadow-sm">{viewBillDetail.saleType}</span>
                                        {viewBillDetail.paymentNote && <span className="text-xs text-slate-500 italic mt-2 flex items-center gap-1"><Edit size={12} /> หมายเหตุ: {viewBillDetail.paymentNote}</span>}
                                    </div>
                                    <div className="flex flex-col items-end text-right w-full md:w-auto border-t md:border-t-0 md:border-l border-blue-200/50 pt-4 md:pt-0 md:pl-6">
                                        <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">ยอดสุทธิ (Net Total)</span>
                                        <span className="text-4xl font-black text-blue-700 leading-none drop-shadow-sm">฿{parseFloat(viewBillDetail.totalAmount || 0).toLocaleString(undefined, { minimumFractionDigits: 2 })}</span>
                                    </div>
                                </div>

                                <div className="flex justify-end gap-3 pt-4 border-t border-slate-100">
                                    <button onClick={() => setViewBillDetail(null)} className="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl border border-slate-200 transition-colors shadow-sm">ปิดหน้าต่าง</button>
                                    <button onClick={() => { handlePrintReceiptPopup(viewBillDetail); setViewBillDetail(null); }} className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-md transition-colors flex items-center gap-2"><PrinterIcon size={18} /> พิมพ์บิลนี้</button>
                                </div>
                            </div>
                        )}
                    </EditModal>

                    <EditModal isOpen={editingSaleId !== null} onClose={handleCancelEdit} title="แก้ไขประวัติการขาย (Edit Sale)" icon={Edit} maxWidthClass="max-w-6xl">
                        {renderSalesForm()}
                    </EditModal>

                    {!editingSaleId && (
                        <div className="w-full flex flex-col h-full min-h-0">
                            <div className="flex flex-col sm:flex-row items-start sm:items-end justify-between border-b border-slate-200 pb-0 mb-4 gap-3">
                                <h3 className="text-lg font-bold flex items-center gap-2 text-blue-700 px-2 pb-2 shrink-0"><Plus size={20} /> บันทึกรายการขายใหม่ (New Sale Entry)</h3>
                                <div className="flex gap-1.5 px-2 sm:px-0 pb-2">
                                    <button onClick={() => setSaleTab('B2M')} className={`px-5 py-2 text-[12px] font-black rounded-lg transition-all shadow-sm ${saleTab === 'B2M' ? 'bg-gradient-to-r from-blue-600 to-blue-500 text-white shadow-blue-500/30' : 'bg-white text-slate-500 hover:bg-blue-50 border border-slate-200'}`}>B2M (ปลีก)</button>
                                    <button onClick={() => setSaleTab('B2N')} className={`px-5 py-2 text-[12px] font-black rounded-lg transition-all shadow-sm ${saleTab === 'B2N' ? 'bg-gradient-to-r from-indigo-600 to-indigo-500 text-white shadow-indigo-500/30' : 'bg-white text-slate-500 hover:bg-indigo-50 border border-slate-200'}`}>B2N (ตัวแทน)</button>
                                    <button onClick={() => setSaleTab('B2B')} className={`px-5 py-2 text-[12px] font-black rounded-lg transition-all shadow-sm ${saleTab === 'B2B' ? 'bg-gradient-to-r from-emerald-600 to-emerald-500 text-white shadow-emerald-500/30' : 'bg-white text-slate-500 hover:bg-emerald-50 border border-slate-200'}`}>B2B (ส่ง)</button>
                                    {isAdmin && (
                                        <button onClick={() => setSaleTab('OLD_SYSTEM')} className={`px-5 py-2 text-[12px] font-black rounded-lg transition-all shadow-sm ${saleTab === 'OLD_SYSTEM' ? 'bg-gradient-to-r from-amber-600 to-amber-500 text-white shadow-amber-500/30' : 'bg-white text-slate-500 hover:bg-amber-50 border border-slate-200'}`}>ป้อนยอดระบบเก่า</button>
                                    )}
                                </div>
                            </div>

                            {saleTab === 'B2M' || (saleTab === 'OLD_SYSTEM' && isAdmin) ? renderSalesForm() : (
                                <div className="flex flex-col items-center justify-center bg-white border border-dashed border-slate-300 rounded-3xl py-24 px-6 gap-6 mb-6 shadow-sm">
                                    <span className="text-6xl drop-shadow-md">🚀</span>
                                    <div className="text-center">
                                        <h2 className="text-2xl font-black text-slate-800 mb-2">โหมดการขาย {saleTab}</h2>
                                        <p className="text-slate-500 font-bold text-[13px]">ระบบกำลังอยู่ในช่วงการพัฒนาและออกแบบ UI/UX สำหรับโหมดนี้</p>
                                    </div>
                                    <span className="bg-slate-100 text-slate-400 px-6 py-2 rounded-full font-bold border border-slate-200 text-[11px]">Coming Soon...</span>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        // ==========================================
        // 📌 React App (Main Component)
        // ==========================================
        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [showLoginModal, setShowLoginModal] = useState(false);

            // ⚡ INSTANT MOUNT CACHE INJECTION
            const initialCache = (() => {
                try { const data = localStorage.getItem('stk_app_cache_data'); return data ? JSON.parse(data) : null; }
                catch (e) { return null; }
            })();

            const [products, setProducts] = useState(() => initialCache && Array.isArray(initialCache.products) ? initialCache.products.map(p => ({ ...p, id: p.id || p.product_id, name: p.name || p.product_name })) : []);
            const [customerTypes, setCustomerTypes] = useState(() => initialCache && Array.isArray(initialCache.customerTypes) ? initialCache.customerTypes.map(c => ({ ...c, id: c.id || c.type_id, name: c.name || c.type_name })) : fallbackCustomerTypes);
            const [closers, setClosers] = useState(() => initialCache && Array.isArray(initialCache.closers) ? initialCache.closers.map(c => ({ ...c, id: c.id || c.closer_id, name: c.name || c.closer_name })) : []);
            const [businessTeams, setBusinessTeams] = useState(() => initialCache && Array.isArray(initialCache.businessTeams) ? initialCache.businessTeams.map(t => ({ ...t, id: t.id || t.team_id, name: t.name || t.team_name })) : []);
            const [members, setMembers] = useState(() => initialCache && Array.isArray(initialCache.members) ? initialCache.members.map(m => ({ ...m, id: m.id || m.user_id || m.member_id, name: m.name })) : []);
            const [customers, setCustomers] = useState(() => initialCache && Array.isArray(initialCache.customers) ? initialCache.customers.map(c => ({ ...c, id: c.id || c.customer_id, name: c.name || c.customer_name })) : []);
            const [sales, setSales] = useState(() => initialCache && Array.isArray(initialCache.sales) ? initialCache.sales.map(s => ({ ...s, id: s.id || s.sale_id || s.order_id, customerId: s.customerId || s.customer_id, memberId: s.memberId || s.sellerId || s.seller_id })) : []);
            const [systemUsers, setSystemUsers] = useState([]);
            const [systemSettings, setSystemSettings] = useState(() => initialCache && initialCache.systemSettings ? initialCache.systemSettings : { exchange_rate: 700 });
            const [isAppLoading, setIsAppLoading] = useState(() => !initialCache);
            const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
                try {
                    return localStorage.getItem('stk_sidebar_collapsed') === 'true';
                } catch (e) {
                    return false;
                }
            });

            const latestSaleIdRef = useRef(null);
            const latestCustIdRef = useRef(null);
            const hasLoadedEditIdRef = useRef(false);
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

            const showToast = (message, type = 'success') => {
                setToast({ show: true, message, type });
            };

            const SCRIPT_URL = '';

            const pagePerm = window.getUserPagePermission ? window.getUserPagePermission(currentUser, 'sales') : 'none';
            const isAdmin = currentUser && (
                String(currentUser.role).trim() === 'ผู้ดูแลระบบ' ||
                String(currentUser.role).trim().toLowerCase().includes('admin') || String(currentUser.role).trim().includes('แอดมิน') ||
                pagePerm === 'full'
            );
            const currentUserProfileUrl = currentUser?.profileUrl || '';

            const activeProductsList = useMemo(() => {
                if (!products || products.length === 0) return fallbackProductsList;
                return (products || []).filter(p => p && p.status !== 'เลิกขาย').map(p => p.name);
            }, [products]);

            const activeCustomerTypes = useMemo(() => {
                if (!customerTypes || customerTypes.length === 0) return fallbackCustomerTypes;
                const filtered = (customerTypes || []).filter(p => p && p.name && String(p.status || '').trim() !== 'ปิดใช้งาน');
                return filtered.length > 0 ? filtered : fallbackCustomerTypes;
            }, [customerTypes]);

            useEffect(() => {
                const savedUserStr = localStorage.getItem('stk_current_user');
                if (savedUserStr) {
                    const user = JSON.parse(savedUserStr);
                    setCurrentUser(user);
                    setIsLoggedIn(true);
                } else {
                    setShowLoginModal(true);
                }

                const initialLoader = document.getElementById('initial-loader');
                if (initialLoader) {
                    initialLoader.style.display = 'none';
                }

                // 💡 INSTANT UI + BACKGROUND REFRESH STRATEGY:
                // 1. ถ้ามี cache (ไม่ว่าจะเก่าแค่ไหน) → แสดงหน้าจอทันที แล้วดึงข้อมูลใหม่เงียบๆ เบื้องหลัง
                // 2. ถ้าไม่มี cache เลย → แสดง loading แค่ครั้งแรก ไม่เกิน 1 ครั้งต่อ session
                let hasCacheData = false;
                const CACHE_REFRESH_MS = 5 * 60 * 1000; // 5 นาที — ถ้า cache ยังใหม่กว่านี้ ไม่ต้องดึงใหม่เลย
                let cacheAge = Infinity;
                try {
                    const cachedData = localStorage.getItem('stk_app_cache_data');
                    const cacheTime = localStorage.getItem('stk_app_cache_time');
                    if (cachedData && cacheTime) {
                        const parsedData = JSON.parse(cachedData);
                        // โหลดข้อมูลทั้งหมดจาก cache ก่อน (รวม products)
                        applyDataToStates(parsedData);
                        hasCacheData = true;
                        cacheAge = Date.now() - Number(cacheTime);
                        // แสดงหน้าจอทันทีจาก cache ไม่ต้องรอ API
                        setIsAppLoading(false);
                    }
                } catch (e) { console.warn("Cache error", e); }

                // ⚡ REAL-TIME SYNC & QUICK MOUNT:
                // ดึงข้อมูลทั้งหมดในพร้อมกัน แต่แสดงหน้าจอจาก cache ก่อน (ถ้ามี) เพื่อแก้ปัญหาหมุนค้างและให้ข้อมูลเรียลไทม์
                const doFullRefresh = () => {
                    Promise.all([
                        supabaseSelect('stk_products').catch(() => supabaseSelect('products')),
                        supabaseSelect('stk_customer_types').catch(() => supabaseSelect('customer_types')),
                        supabaseSelect('stk_closers', 'nocache=true').catch(() => supabaseSelect('closers')),
                        supabaseSelect('stk_members', 'nocache=true').catch(() => supabaseSelect('members')),
                        supabaseSelect('stk_customers', 'order=customer_id.desc&limit=10000').catch(() => supabaseSelect('customers')),
                        supabaseSelect('stk_sales', 'order=order_id.desc&limit=10000').catch(() => supabaseSelect('sales')),
                        supabaseSelect('stk_business_teams').catch(() => supabaseSelect('business_teams'))
                    ]).then(([pRes, typeRes, cloRes, memRes, custRes, saleRes, teamRes]) => {
                        const resObj = {
                            products: pRes,
                            customerTypes: typeRes,
                            closers: cloRes,
                            members: memRes,
                            customers: custRes,
                            sales: saleRes,
                            businessTeams: teamRes
                        };
                        applyDataToStates(resObj);
                        try {
                            localStorage.setItem('stk_app_cache_data', JSON.stringify(resObj));
                            localStorage.setItem('stk_app_cache_time', String(Date.now()));
                        } catch (e) { }
                    }).catch(err => {
                        console.error("Supabase load error:", err);
                    }).finally(() => {
                        setIsAppLoading(false);
                    });
                };

                doFullRefresh();

                // ตั้ง EVENT LISTENERS ดึงข้อมูลเมื่อผู้ใช้สลับกลับมาที่หน้าป้อนข้อมูลขาย (Focus) หรือสลับแท็บกลับมา เพื่อความเรียลไทม์สูงสุด
                window.addEventListener('focus', doFullRefresh);
                window.addEventListener('pageshow', doFullRefresh);

                return () => {
                    window.removeEventListener('focus', doFullRefresh);
                    window.removeEventListener('pageshow', doFullRefresh);
                };
            }, []);

            const applyDataToStates = (response) => {
                if (Array.isArray(response.products)) setProducts(response.products.map(x => ({
                    ...x,
                    id: x.id || x.product_id,
                    stock: parseInt(x.current_stock ?? x.stock ?? 0) || 0,
                    imageUrl: x.image_url ?? x.imageUrl ?? "",
                    priceFull: Number(x.price_full ?? x.priceFull ?? 0) || 0,
                    priceMember: Number(x.price_member ?? x.priceMember ?? 0) || 0,
                    pricePromo: Number(x.price_promo ?? x.pricePromo ?? 0) || 0
                })));
                if (Array.isArray(response.customerTypes)) setCustomerTypes(response.customerTypes.map(x => ({ ...x, id: x.id || x.type_id })));
                if (Array.isArray(response.closers)) setClosers(response.closers.map(x => ({ ...x, id: x.id || x.closer_id })));
                if (Array.isArray(response.businessTeams)) setBusinessTeams(response.businessTeams.map(t => ({ id: t.id || t.team_id, name: t.name || t.team_name || t.Team_Name || t.TeamName, status: t.status || 'ใช้งาน' })));
                if (Array.isArray(response.members)) { setMembers(response.members.map(m => ({ ...m, id: m.id || m.user_id || m.member_id, name: m.name, lineUid: m.line_uid || '', profileUrl: m.id_card_url || m.profileImageUrl || m.profileUrl, idCardDocUrl: m.id_card_url || m.idCardDocUrl, businessTeam: m.business_team || m.businessTeam, team: m.business_team || m.team || m.businessTeam || 'T01', role: m.permission_role || m.role || m.permissionRole, status: m.status, sponsorId: m.sponsor_id || m.sponsorId, accumulatedPv: m.accumulated_pv || m.Accumulated_PV || m.accumulatedPv || m.pv || 0, phone: m.phone_number || m.phone || m.phoneNumber }))); }
                if (Array.isArray(response.customers)) setCustomers(response.customers.map(x => ({ ...x, id: x.id || x.customer_id, type: String(x.type || x.customer_type || x.customerType || '').trim(), lineId: x.lineId || x.line_id, closer: x.closer || x.closer_id || "", closerTeam: x.closerTeam || x.closer_team || x.extra_details_json?.closerTeam || "", memberId: x.memberId || x.member_id, memberName: x.memberName || x.member_name || x.extra_details_json?.memberName || "" })));
                if (Array.isArray(response.systemUsers)) setSystemUsers(response.systemUsers.map(x => ({ ...x, id: x.id || x.user_id || x.system_user_id })));

                if (Array.isArray(response.sales)) {
                    const processedSales = response.sales.map(s => {
                        let sumF = 0, sumM = 0, sumP = 0, sumZ = 0;
                        let itemsList = [];
                        if (s.items_json) {
                            try { itemsList = typeof s.items_json === 'string' ? JSON.parse(s.items_json) : s.items_json; } catch (e) { }
                        }

                        if (Array.isArray(itemsList) && itemsList.length > 0) {
                            itemsList.forEach(it => {
                                let typeStr = String(it.type || '').trim();
                                if (typeStr === 'ราคาพิเศษ' || typeStr === 'ราคาโปรโมชั่น') typeStr = 'ราคาโปร';
                                if (typeStr === 'ราคาแถม') typeStr = 'ราคาศูนย์';
                                const qtyNum = Number(it.qty || it.quantity || 1);
                                const pName = String(it.prod || it.productName || it.name || 'Unknown').trim();

                                s[`${pName}_${typeStr}`] = qtyNum;

                                if (typeStr === 'ราคาเต็ม') sumF += qtyNum;
                                else if (typeStr === 'ราคาสมาชิก') sumM += qtyNum;
                                else if (typeStr === 'ราคาโปร' || typeStr === 'โปรโมชั่น') sumP += qtyNum;
                                else if (typeStr === 'ราคาศูนย์') sumZ += qtyNum;
                                else sumM += qtyNum;
                            });
                        } else {
                            Object.keys(s).forEach(k => {
                                if (k !== 'รวมชิ้นราคาเต็ม' && k !== 'รวมชิ้นราคาสมาชิก' && k !== 'รวมชิ้นราคาโปร' && k !== 'รวมชิ้นราคาศูนย์' && k !== 'ยอดรวมชิ้นทั้งหมด') {
                                    if (k.endsWith('_ราคาเต็ม')) sumF += (parseInt(s[k]) || 0);
                                    else if (k.endsWith('_ราคาสมาชิก')) sumM += (parseInt(s[k]) || 0);
                                    else if (k.endsWith('_ราคาโปร') || k.endsWith('_โปรโมชั่น')) sumP += (parseInt(s[k]) || 0);
                                    else if (k.endsWith('_ราคาศูนย์')) sumZ += (parseInt(s[k]) || 0);
                                }
                            });
                        }

                        s['memberId'] = s.memberId || s.sellerId || s.seller_id || s.seller;
                        s['sellerId'] = s.sellerId || s.seller_id || s.seller || s.memberId;
                        s['รวมชิ้นราคาเต็ม'] = sumF;
                        s['รวมชิ้นราคาสมาชิก'] = sumM;
                        s['รวมชิ้นราคาโปร'] = sumP;
                        s['รวมชิ้นราคาศูนย์'] = sumZ;
                        s['ยอดรวมชิ้นทั้งหมด'] = Number(s.total_bottles || 0) || (sumF + sumM + sumP + sumZ);
                        s.customerId = s.customerId || s.customer_id;
                        s.totalAmount = s.totalAmount || s.total_amount;
                        s.saleType = s.saleType || s.sale_type;
                        s.date = s.date || s.created_at;
                        s.recordedBy = s.recordedBy || s.recorded_by;
                        s.paymentNote = s.paymentNote || s.payment_note || s.notes; s.customerType = s.customerType || s.customer_type || '';
                        s.id = s.id || s.sale_id || s.receipt_id || s.order_id;
                        return s;
                    });
                    setSales(processedSales);
                    if (processedSales.length > 0) latestSaleIdRef.current = processedSales[0].id;
                }
                if (response.systemSettings) setSystemSettings(response.systemSettings);
            };

            const handleLoginSuccess = (user) => {
                localStorage.setItem('stk_current_user', JSON.stringify(user));
                setCurrentUser(user);
                setIsLoggedIn(true);
                setShowLoginModal(false);
                showToast('เข้าสู่ระบบสำเร็จ!', 'success');
            };

            const handleLogout = () => {
                localStorage.removeItem('stk_current_user');
                setCurrentUser(null);
                setIsLoggedIn(false);
                if (typeof window !== 'undefined') window.location.href = 'Mlm.html';
            };

            return (
                <div className="min-h-screen flex flex-col lg:flex-row font-sans bg-slate-50">
                    <Sidebar
                        activePage="sales"
                        isLoggedIn={isLoggedIn}
                        currentUser={currentUser}
                        currentUserProfileUrl={currentUserProfileUrl}
                        isAdmin={isAdmin}
                        onLogout={handleLogout}
                        showLoginModal={showLoginModal}
                        setShowLoginModal={setShowLoginModal}
                        SCRIPT_URL={SCRIPT_URL}
                        setIsAppLoading={setIsAppLoading}
                        isSidebarCollapsed={isSidebarCollapsed}
                        setIsSidebarCollapsed={setIsSidebarCollapsed}
                    />

                    <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>

                        {toast.show && ReactDOM.createPortal(
                            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[999999] flex items-center justify-center p-4 animation-fade-in" style={{ animationDuration: '0.2s' }}>
                                <div className={`bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center animation-pop border-t-4 ${toast.type === 'error' ? 'border-red-500' : toast.type === 'info' ? 'border-blue-500' : 'border-emerald-500'}`}>
                                    <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${toast.type === 'error' ? 'bg-red-100 text-red-500' : toast.type === 'info' ? 'bg-blue-100 text-blue-500' : 'bg-emerald-100 text-emerald-500'}`}>
                                        {toast.type === 'error' ? <X size={32} /> : toast.type === 'info' ? <Trophy size={32} /> : <CheckCircle size={32} />}
                                    </div>
                                    <h3 className="text-xl font-bold text-slate-800 mb-2">{toast.type === 'error' ? 'เกิดข้อผิดพลาด' : toast.type === 'info' ? 'แจ้งเตือน' : 'สำเร็จ!'}</h3>
                                    <p className="text-slate-600 font-medium text-sm mb-6">{toast.message}</p>
                                    <button onClick={() => setToast({ ...toast, show: false })} className="w-full py-2.5 rounded-lg font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">ตกลง</button>
                                </div>
                            </div>
                            , document.body)}

                        <div className="p-3 sm:p-5 flex-1 w-full relative z-0 custom-scrollbar">
                            <div className="w-full relative z-10 xl:h-full flex flex-col min-h-0 pos-layout">
                                {isLoggedIn ? (
                                    <SalesEntryView
                                        members={members}
                                        customers={customers}
                                        closers={closers}
                                        businessTeams={businessTeams}
                                        sales={sales}
                                        setSales={setSales}
                                        setCustomers={setCustomers}
                                        activeProductsList={activeProductsList}
                                        activeCustomerTypes={activeCustomerTypes}
                                        isAdmin={isAdmin}
                                        showToast={showToast}
                                        currentUser={currentUser}
                                        products={products}
                                        setProducts={setProducts}
                                        systemSettings={systemSettings}
                                        loading={isAppLoading}
                                    />
                                ) : (
                                    <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in flex-1">
                                        <h2 className="text-xl font-black text-red-500">กรุณาเข้าสู่ระบบก่อนใช้งาน</h2>
                                        <button onClick={() => setShowLoginModal(true)} className={btnClassPrimary}>เข้าสู่ระบบ</button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </main>

                    <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={systemUsers} />

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
