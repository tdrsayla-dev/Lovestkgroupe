  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;

    const fallbackCustomerTypes = window.fallbackCustomerTypes || [
       { id: 'T001', name: 'ลูกค้าใหม่', status: 'ใช้งาน' },
       { id: 'T002', name: 'ลูกค้าเก่ากลับมาต่อยา', status: 'ใช้งาน' }
    ];
    const fallbackProductsList = window.fallbackProductsList || ['SESAMIN', 'APPLE', 'KING_GOLD'];

    /* <?!= include('CommonComponents'); ?> */

    const PrinterIcon = ({size=20, className=""}) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>

        <rect x="6" y="14" width="12" height="8"></rect>
      </svg>
    );

    const formatDbDateForFilter = (dateVal) => {
        if (!dateVal) return '';
        let str = String(dateVal).trim();
        if (str.includes('T')) str = str.split('T')[0]; 
        if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
        const parts = str.split(/[\/\-]/);
        if (parts.length === 3 && parts[2].length === 4) {
            return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
        }
        const d = new Date(dateVal);
        if (!isNaN(d.getTime())) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }
        return str;
    };

    // ==========================================
    // 📌 Sales Entry View Component
    // ==========================================
    const SalesEntryView = ({ members, customers, closers, sales, setSales, setCustomers, activeProductsList, activeCustomerTypes, isAdmin, showToast, currentUser, products, setProducts, systemSettings }) => {
        const [saleTab, setSaleTab] = useState('B2M');
        
        const [formData, setFormData] = useState({ date: getLocalISODate() });
        const [memberIdInput, setMemberIdInput] = useState(''); 
        
        const [custMode, setCustMode] = useState(''); 
        const isOldCustomerMode = (custMode || '').includes('เก่า');

        const [custData, setCustData] = useState({ id: '', name: '', phone: '', lineId: '', symptom: '', closer: '', closerTeam: '' });
        const [isSubmitting, setIsSubmitting] = useState(false);
        const [editingSaleId, setEditingSaleId] = useState(null); 
        
        const [confirmDelete, setConfirmDelete] = useState({ show: false, id: null, customerId: null, title: '' });
        const [successModal, setSuccessModal] = useState({ show: false, saleRecord: null });
        
        const calculateBillPV = (cartItems, prods) => {
            let totalPV = 0;
            cartItems.forEach(item => {
                const p = (prods || []).find(prod => prod.name === item.productName);
                if (p) {
                    const givePv = Number(p.givePv || 0);
                    const pvRate = givePv > 0 ? givePv : 1;
                    if (item.priceType === 'ราคาเต็ม' || item.priceType === 'ราคาสมาชิก') {
                        totalPV += (Number(item.qty) || 0) * pvRate;
                    }
                }
            });
            return totalPV;
        };

        const updateMemberPVInSupabase = async (memberId, pvChange) => {
            if (!memberId || pvChange === 0) return;
            try {
                let pk = 'id';
                let memRes;
                try { memRes = await supabaseSelect('stk_members', `id=eq.${encodeURIComponent(memberId)}`); }
                catch(err) {
                    try { memRes = await supabaseSelect('stk_members', `user_id=eq.${encodeURIComponent(memberId)}`); pk = 'user_id'; }
                    catch(err2) { memRes = await supabaseSelect('stk_members', `User_ID=eq.${encodeURIComponent(memberId)}`); pk = 'User_ID'; }
                }
                
                if (memRes && memRes.length > 0) {
                    const mem = memRes[0];
                    let currentPv = Number(mem.accumulated_pv || mem.Accumulated_PV || 0);
                    let newPv = currentPv + pvChange;
                    if (newPv < 0) newPv = 0;
                    const updatePayload = mem.Accumulated_PV !== undefined ? { Accumulated_PV: newPv } : { accumulated_pv: newPv };
                    await supabaseUpdate('stk_members', memberId, updatePayload, 'user_id');
                    console.log(`✅ Updated PV for ${memberId}: ${currentPv} -> ${newPv} (Change: ${pvChange})`);
                }
            } catch (err) {
                console.error('❌ Failed to update member PV in Supabase:', err);
            }
        };

        const [viewBillDetail, setViewBillDetail] = useState(null);

        const fallbackToday = new Date().toISOString().split('T')[0];
        const getLocalISO = (typeof window !== 'undefined' && window.getLocalISODate) ? window.getLocalISODate : () => fallbackToday;
        const getFirstDOM = (typeof window !== 'undefined' && window.getFirstDayOfMonth) ? window.getFirstDayOfMonth : () => `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}-01`;

        const [historyStartDate, setHistoryStartDate] = useState(getLocalISO());
        const [historyEndDate, setHistoryEndDate] = useState(getLocalISO());
        const [salesSearchTerm, setSalesSearchTerm] = useState('');

        const [salesPage, setSalesPage] = useState(1);
        const SALES_PER_PAGE = 20; 

        const findMemberRobustLocal = (inputStr) => { 
            if (!inputStr) return null; 
            const mId = inputStr.split(' ')[0].replace('-', '').trim(); 
            return (members || []).find(m => m && safeUpper(m.id) === safeUpper(mId)); 
        };
        const foundMember = findMemberRobustLocal(memberIdInput);

        const membersSuggestList = useMemo(() => (members || []).filter(m => m && m.id).map(m => ({ 
            label: `${m.id} - ${m.name}`, 
            value: `${m.id} - ${m.name}` 
        })), [members]);
        
        const customersSuggestList = useMemo(() => (customers || []).filter(c => c && c.id).map(c => ({ 
            label: `${c.id} - ${c.name} (${c.phone || 'ไม่มีเบอร์'})`, 
            value: c.id,
            searchText: `${c.id} ${c.name} ${c.phone}`
        })), [customers]);
        
        const closersSuggestList = useMemo(() => {
            return (closers || []).filter(c => {
                const mapTeam = (c.team === 'Team A' ? 'Marketing' : (c.team === 'Team B' ? 'Center' : c.team));
                return mapTeam === custData.closerTeam && c.status === 'ใช้งาน';
            }).map(c => c.name);
        }, [closers, custData.closerTeam]);

        const [cart, setCart] = useState([]);
        const [catalogSearch, setCatalogSearch] = useState('');

        const [payMode, setPayMode] = useState('สด');
        const [payCashTHB, setPayCashTHB] = useState('');
        const [payCashLAK, setPayCashLAK] = useState('');
        const [payTransferThaiTHB, setPayTransferThaiTHB] = useState('');
        const [payTransferThaiBank, setPayTransferThaiBank] = useState('กสิกรไทย');
        const [payTransferLaosTHB, setPayTransferLaosTHB] = useState('');
        const [payTransferLaosBankTHB, setPayTransferLaosBankTHB] = useState('BCEL');
        const [payTransferLaosLAK, setPayTransferLaosLAK] = useState('');
        const [payTransferLaosBankLAK, setPayTransferLaosBankLAK] = useState('BCEL');
        const [paymentNote, setPaymentNote] = useState('');
        const exchangeRate = parseFloat(systemSettings?.exchange_rate) || 700;

        const [isCustomerExpanded, setIsCustomerExpanded] = useState(true);

        const formatDisplayNumber = (val) => {
            if (val === '' || val === null || val === undefined) return '';
            const parts = val.toString().split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            return parts.join('.');
        };

        const handleNumberInput = (setter) => (e) => {
            let val = e.target.value.replace(/,/g, ''); 
            if (val === '') { setter(''); return; }
            if (/^\d*\.?\d*$/.test(val)) {
                setter(val); 
            }
        };

        const handleAddToCart = (productName, priceType = 'ราคาโปร', forceQty = null) => {
            const prodObj = (products || []).find(p => p.name === productName) || {};
            const currentQtyInCart = cart.filter(item => item.productName === productName).reduce((sum, item) => sum + (parseInt(item.qty)||0), 0);
            const addAmount = forceQty !== null ? forceQty : 1;

            if (prodObj.stock < currentQtyInCart + addAmount) {
                showToast(`ไม่สามารถเพิ่มได้ สต๊อก ${productName} มีไม่พอ (เหลือ ${prodObj.stock} ชิ้น)`, 'error');
                return;
            }

            let unitPrice = 0;
            if (priceType === 'ราคาเต็ม') unitPrice = parseFloat(prodObj.priceFull || 0);
            else if (priceType === 'ราคาโปร') unitPrice = parseFloat(prodObj.pricePromo || 0);
            else if (priceType === 'ราคาสมาชิก') unitPrice = parseFloat(prodObj.priceMember || 0);
            else if (priceType === 'ราคาศูนย์') unitPrice = 0;

            setCart(prev => {
                const existingIdx = prev.findIndex(item => item.productName === productName && item.priceType === priceType);
                if (existingIdx > -1) {
                    const nextCart = [...prev];
                    if (forceQty !== null) nextCart[existingIdx].qty = forceQty;
                    else nextCart[existingIdx].qty = (parseInt(nextCart[existingIdx].qty)||0) + 1;
                    return nextCart;
                } else {
                    return [...prev, { productName, priceType, price: unitPrice, qty: forceQty !== null ? forceQty : 1 }];
                }
            });
        };

        const handleRemoveFromCart = (productName, priceType) => {
            setCart(prev => prev.filter(item => !(item.productName === productName && item.priceType === priceType)));
        };

        const handleUpdateCartQty = (productName, priceType, delta) => {
            if (delta > 0) {
                const prodObj = (products || []).find(p => p.name === productName) || {};
                const currentQtyInCart = cart.filter(item => item.productName === productName).reduce((sum, item) => sum + (parseInt(item.qty)||0), 0);
                if (prodObj.stock <= currentQtyInCart) {
                    showToast(`สต๊อก ${productName} มีจำกัดแค่ ${prodObj.stock} ชิ้น`, 'error');
                    return;
                }
            }

            setCart(prev => prev.map(item => {
                if (item.productName === productName && item.priceType === priceType) {
                    return { ...item, qty: Math.max(1, (parseInt(item.qty)||0) + delta) };
                }
                return item;
            }));
        };

        const handleSetCartQty = (productName, priceType, newQtyVal) => {
            if (newQtyVal === '') {
                setCart(prev => prev.map(item => item.productName === productName && item.priceType === priceType ? { ...item, qty: '' } : item));
                return;
            }
            
            let parsedQty = parseInt(newQtyVal, 10);
            if (isNaN(parsedQty)) return;

            const prodObj = (products || []).find(p => p.name === productName) || {};
            const currentQtyInCartOtherTypes = cart.filter(item => item.productName === productName && item.priceType !== priceType).reduce((sum, item) => sum + (parseInt(item.qty)||0), 0);
            
            if (prodObj.stock < currentQtyInCartOtherTypes + parsedQty) {
                showToast(`สต๊อก ${productName} มีจำกัดแค่ ${prodObj.stock} ชิ้น`, 'error');
                parsedQty = Math.max(1, prodObj.stock - currentQtyInCartOtherTypes);
            }

            setCart(prev => prev.map(item => {
                if (item.productName === productName && item.priceType === priceType) {
                    return { ...item, qty: parsedQty };
                }
                return item;
            }));
        };

        const handleUpdateCartPriceType = (productName, oldPriceType, newPriceType) => {
            const prodObj = (products || []).find(p => p.name === productName) || {};
            let newPrice = 0;
            if (newPriceType === 'ราคาเต็ม') newPrice = parseFloat(prodObj.priceFull || 0);
            else if (newPriceType === 'ราคาโปร') newPrice = parseFloat(prodObj.pricePromo || 0);
            else if (newPriceType === 'ราคาสมาชิก') newPrice = parseFloat(prodObj.priceMember || 0);
            else if (newPriceType === 'ราคาศูนย์') newPrice = 0;

            setCart(prev => {
                const existingIdx = prev.findIndex(item => item.productName === productName && item.priceType === newPriceType);
                const oldIdx = prev.findIndex(item => item.productName === productName && item.priceType === oldPriceType);
                if (oldIdx === -1) return prev;
                
                const nextCart = [...prev];
                const oldQty = parseInt(nextCart[oldIdx].qty) || 0;
                
                if (existingIdx > -1 && existingIdx !== oldIdx) {
                    nextCart[existingIdx].qty = (parseInt(nextCart[existingIdx].qty)||0) + oldQty;
                    return nextCart.filter((_, idx) => idx !== oldIdx);
                } else {
                    nextCart[oldIdx].priceType = newPriceType;
                    nextCart[oldIdx].price = newPrice;
                    return nextCart;
                }
            });
        };

        const cartTotals = useMemo(() => {
            let qty = 0; let amount = 0; let baseAmount = 0;
            cart.forEach(item => { 
                const itemQty = parseInt(item.qty) || 0;
                qty += itemQty; 
                amount += item.price * itemQty; 
                const prodObj = (products || []).find(p => p.name === item.productName) || {};
                let fPrice = parseFloat(prodObj.priceFull || 0);
                if(fPrice < item.price) fPrice = item.price; 
                baseAmount += fPrice * itemQty;
            });
            return { qty, amount, baseAmount, discount: baseAmount - amount };
        }, [cart, products]);

        const filteredProductsList = useMemo(() => {
            const search = catalogSearch.trim().toLowerCase();
            return (products || [])
              .filter(p => p && p.status !== 'เลิกขาย')
              .filter(p => {
                  return String(p.name || '').toLowerCase().includes(search) || 
                         String(p.id || '').toLowerCase().includes(search) || 
                         String(p.barcode || '').toLowerCase().includes(search) ||
                         (p.category && String(p.category || '').toLowerCase().includes(search));
              });
        }, [products, catalogSearch]);

        const performSearch = () => {
            const search = catalogSearch.trim().toLowerCase();
            if (!search) return;
            
            let matchedProd = (products || []).find(p => p && p.status !== 'เลิกขาย' && (String(p.id || '').toLowerCase() === search || String(p.name || '').toLowerCase() === search || String(p.barcode || '').toLowerCase() === search));
            if (!matchedProd) {
                const matches = filteredProductsList;
                if (matches.length === 1) matchedProd = matches[0];
            }
            
            if (matchedProd) {
                handleAddToCart(matchedProd.name, 'ราคาโปร');
                setCatalogSearch('');
                showToast(`เพิ่ม ${matchedProd.name} ลงตะกร้าแล้ว`, 'success');
            } else {
                showToast(`ไม่พบสินค้า: "${search}"`, 'error');
            }
        };

        const handleBarcodeScan = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                performSearch();
            }
        };

        const handleOldCustomerChange = (searchId) => {
          const foundCust = (customers || []).find(c => c && safeUpper(c.id) === safeUpper(searchId));
          if (foundCust) {
              const cObj = (closers || []).find(c => c.name === foundCust.closer);
              let cTeam = cObj ? cObj.team : '';
              if (cTeam === 'Team A') cTeam = 'Marketing';
              if (cTeam === 'Team B') cTeam = 'Center';
              setCustData({ 
                  id: foundCust.id, 
                  name: foundCust.name || '', 
                  phone: foundCust.phone || '', 
                  lineId: foundCust.lineId || '', 
                  symptom: foundCust.symptom || '', 
                  closer: foundCust.closer || '',
                  closerTeam: cTeam 
              });
          } else { 
              setCustData({ id: searchId, name: '', phone: '', lineId: '', symptom: '', closer: '', closerTeam: '' }); 
          }
        };

        const handleCancelEdit = () => {
            setEditingSaleId(null); 
            setCart([]);
            setCustData({ id: '', name: '', phone: '', lineId: '', symptom: '', closer: '', closerTeam: '' });
            setMemberIdInput(''); 
            setFormData({ date: getLocalISODate() });
            
            setPayMode('สด');
            setPayCashTHB('');
            setPayCashLAK('');
            setPayTransferThaiTHB('');
            setPayTransferThaiBank('กสิกรไทย');
            setPayTransferLaosTHB('');
            setPayTransferLaosBankTHB('BCEL');
            setPayTransferLaosLAK('');
            setPayTransferLaosBankLAK('BCEL');
            setPaymentNote('');
        };

        const handlePrintReceiptPopup = (rs) => {
            const custObj = (customers || []).find(c => c && c.id === rs.customerId) || {};
            const custName = custObj.name || '';
            
            const saleTypeStr = rs.saleType || 'เงินสด';
            let cTHB = 0; let cLAK = 0;
            let tThaiTHB = 0; let bThaiTHB = '';
            let tLaosTHB = 0; let bLaosTHB = '';
            let tLaosLAK = 0; let bLaosLAK = '';
            let rate = parseFloat(systemSettings?.exchange_rate) || 700;
            
            if (saleTypeStr.includes(':') || saleTypeStr.includes('โอน') || saleTypeStr.includes('|')) {
                const parts = saleTypeStr.split('|').map(p => p.trim());
                parts.forEach(p => {
                    if (p.startsWith('สด:')) cTHB = parseFloat(p.replace('สด:', '').trim()) || 0;

                                const newStock = (pInfo.current_stock || pInfo.stock || 0) + addQty;

                            }

                    }
                    if (setProducts) {

                if (memberId && pvToSubtract > 0) updateMemberPVInSupabase(memberId, -pvToSubtract);
                showToast('ลบข้อมูลจากหน้าจอแล้ว', 'success');

        };

        const handleSuccessFinish = (recordToShow = null) => {
            if (recordToShow) {
                setSuccessModal({ show: true, saleRecord: recordToShow });
            } else {
                showToast('บันทึกการขายสำเร็จ!', 'success');
            }
            setIsSubmitting(false);
            setCart([]);
            setCustData({ id: '', name: '', phone: '', lineId: '', symptom: '', closerTeam: '', closer: '' });
            setCustMode('');
            setMemberIdInput('');
            setPayMode('สด');
            setPayCashTHB('');
            setPayCashLAK('');
            setPayTransferThaiTHB('');
            setPayTransferThaiBank('กสิกรไทย');
            setPayTransferLaosTHB('');
            setPayTransferLaosBankTHB('BCEL');
            setPayTransferLaosLAK('');
            setPayTransferLaosBankLAK('BCEL');
        };

        const handleAdd = async (e) => {
          e.preventDefault();
          if (!foundMember) { showToast('ระบุรหัสสมาชิกผู้ขายไม่ถูกต้อง', 'error'); return; }
          if (!custMode || String(custMode).trim() === '') { showToast('กรุณาระบุประเภทลูกค้า', 'error'); return; }
          
          let finalCustomerId = custData.id; let newCustomerObj = null;
          const isOldCustomerMode = custMode.includes('เก่า');

          if (!isOldCustomerMode) {
            if (!custData.name) { showToast('กรุณากรอกชื่อลูกค้า', 'error'); return; }
            if (!custData.closerTeam) { showToast('กรุณาเลือกทีมผู้ปิดการขาย', 'error'); return; }
            if (!custData.closer) { showToast('กรุณาระบุผู้ปิดการขาย', 'error'); return; }
            if (!finalCustomerId) {
                let nextIdNum = 1;
                const cIds = [
                    ...(customers || []).map(c => { const match = c && c.id && c.id.match(/^C(\d+)$/i); return match ? parseInt(match[1], 10) : 0; }),
                    ...(sales || []).map(s => { const match = s && s.customerId && s.customerId.match(/^C(\d+)$/i); return match ? parseInt(match[1], 10) : 0; })
                ];
                if (cIds.length > 0) nextIdNum = Math.max(0, ...cIds) + 1;
                finalCustomerId = "C" + nextIdNum.toString().padStart(3, '0'); 
            }
            newCustomerObj = { id: finalCustomerId, name: custData.name, phone: custData.phone, lineId: custData.lineId || '', type: custMode, symptom: custData.symptom, closerTeam: custData.closerTeam, closer: custData.closer, memberId: foundMember.id, memberName: foundMember.name };
          } else {
            const originalCust = (customers || []).find(c => c && safeUpper(c.id) === safeUpper(finalCustomerId));
            if (!originalCust) { showToast('ไม่พบข้อมูลลูกค้าเก่ารหัสนี้', 'error'); return; }
            if (!custData.closerTeam) { showToast('กรุณาเลือกทีมผู้ปิดการขาย', 'error'); return; }
            if (!custData.closer) { showToast('กรุณาระบุผู้ปิดการขาย', 'error'); return; }
            if (originalCust.memberId && safeUpper(originalCust.memberId) !== safeUpper(foundMember.id)) { showToast('ขออภัย! เจ้าของเคสเดิมไม่ใช่สมาชิกผู้ขายท่านนี้', 'error'); return; }
            
            if (originalCust.closer !== custData.closer || originalCust.type !== custMode || originalCust.phone !== custData.phone || originalCust.lineId !== custData.lineId || originalCust.symptom !== custData.symptom) {
               const updatedCust = { ...originalCust, closer: custData.closer, type: custMode, phone: custData.phone, lineId: custData.lineId, symptom: custData.symptom };
               newCustomerObj = updatedCust;
            }
          }

          const qtyMap = {};
          cart.forEach(item => {
              const p = (products || []).find(prod => prod.name === item.productName);
              if(p) qtyMap[p.id] = (qtyMap[p.id] || 0) + (parseInt(item.qty)||0);
          });

          for (const pid of Object.keys(qtyMap)) {
              const p = (products || []).find(prod => prod.id === pid);
              if (!editingSaleId && p && p.stock < qtyMap[pid]) {
                  showToast(`สินค้า ${p.name} มีสต๊อกไม่พอ (เหลือ ${p.stock} ชิ้น)`, 'error');
                  return;
              }
          }

          let nextSaleIdStr = "";
          if (!editingSaleId) {
             const dateParts = formData.date.split('-');
             const datePrefix = `${dateParts[0]}${dateParts[1]}${dateParts[2]}`; 
             const prefixSales = (sales || []).filter(s => String(s.id).startsWith(datePrefix));
             let maxRun = 0;
             prefixSales.forEach(s => {
                const parts = String(s.id).split('-');
                if (parts.length === 2) {
                   const runNum = parseInt(parts[1], 10);
                   if (!isNaN(runNum) && runNum > maxRun) maxRun = runNum;
                }
             });
             nextSaleIdStr = `${datePrefix}-${String(maxRun + 1).padStart(3, '0')}`;
          } else { 
             nextSaleIdStr = editingSaleId; 
          }

          const paymentSummaryParts = [];
          const cTHB = parseFloat(payCashTHB) || 0;
          const cLAK = parseFloat(payCashLAK) || 0;
          const tThaiTHB = parseFloat(payTransferThaiTHB) || 0;
          const tLaosTHB = parseFloat(payTransferLaosTHB) || 0;
          const tLaosLAK = parseFloat(payTransferLaosLAK) || 0;

          if (payMode === 'สด' || payMode === 'สด+โอน') {
              if (cTHB > 0) paymentSummaryParts.push(`สด:${cTHB}`);
              if (cLAK > 0) paymentSummaryParts.push(`สดกีบ:${cLAK}`);
          }
          if (payMode === 'โอน' || payMode === 'สด+โอน') {
              if (tThaiTHB > 0) paymentSummaryParts.push(`โอนไทย(${payTransferThaiBank}):${tThaiTHB}`);
              if (tLaosTHB > 0) paymentSummaryParts.push(`โอนลาวบาท(${payTransferLaosBankTHB}):${tLaosTHB}`);
              if (tLaosLAK > 0) paymentSummaryParts.push(`โอนลาวกีบ(${payTransferLaosBankLAK}):${tLaosLAK}`);
          }
          if (paymentSummaryParts.length > 0 && (cLAK > 0 || tLaosLAK > 0)) {
              paymentSummaryParts.push(`เรท:${exchangeRate}`);
          }
          const paymentSummaryStr = paymentSummaryParts.length > 0 ? paymentSummaryParts.join(' | ') : `${payMode}`;

          const newRecord = { 
              id: nextSaleIdStr, 
              date: formData.date, 
              memberId: foundMember.id, 
              memberName: foundMember.name, 
              customerId: finalCustomerId, 
              recordedBy: currentUser ? (currentUser.name || currentUser.username || 'Admin') : 'ไม่ระบุ',
              saleType: paymentSummaryStr,
              totalAmount: cartTotals.amount,
              paymentNote: paymentNote
          };
          
          let sumFull = 0, sumPro = 0, sumMember = 0, sumZero = 0;
          const allProductNamesToSave = [...new Set([
              ...activeProductsList,
              ...cart.map(item => item.productName)
          ])];

          if (editingSaleId) {
             const oldRecord = (sales || []).find(s => s.id === editingSaleId);
             if (oldRecord) {
                 Object.keys(oldRecord).forEach(k => {
                     if (k.endsWith('_ราคาเต็ม') || k.endsWith('_ราคาโปร') || k.endsWith('_ราคาสมาชิก') || k.endsWith('_ราคาศูนย์')) {
                         newRecord[k] = 0;
                     }
                 });
             }
          }

          allProductNamesToSave.forEach(product => {
            const fQty = cart.filter(item => item.productName === product && item.priceType === 'ราคาเต็ม').reduce((sum, item) => sum + (parseInt(item.qty)||0), 0);
            const pQty = cart.filter(item => item.productName === product && item.priceType === 'ราคาโปร').reduce((sum, item) => sum + (parseInt(item.qty)||0), 0);
            const mQty = cart.filter(item => item.productName === product && item.priceType === 'ราคาสมาชิก').reduce((sum, item) => sum + (parseInt(item.qty)||0), 0);
            const zQty = cart.filter(item => item.productName === product && item.priceType === 'ราคาศูนย์').reduce((sum, item) => sum + (parseInt(item.qty)||0), 0);
            
            if (fQty > 0 || newRecord[`${product}_ราคาเต็ม`] === 0) newRecord[`${product}_ราคาเต็ม`] = fQty;
            if (pQty > 0 || newRecord[`${product}_ราคาโปร`] === 0) newRecord[`${product}_ราคาโปร`] = pQty;
            if (mQty > 0 || newRecord[`${product}_ราคาสมาชิก`] === 0) newRecord[`${product}_ราคาสมาชิก`] = mQty;
            if (zQty > 0 || newRecord[`${product}_ราคาศูนย์`] === 0) newRecord[`${product}_ราคาศูนย์`] = zQty;
            
            sumFull += fQty; sumPro += pQty; sumMember += mQty; sumZero += zQty;
          });
          newRecord['รวมชิ้นราคาเต็ม'] = sumFull;
          newRecord['รวมชิ้นราคาโปร'] = sumPro;
          newRecord['รวมชิ้นราคาสมาชิก'] = sumMember;
          newRecord['รวมชิ้นราคาศูนย์'] = sumZero;
          newRecord['ยอดรวมชิ้นทั้งหมด'] = sumFull + sumPro + sumMember + sumZero;
          
          if (newRecord['ยอดรวมชิ้นทั้งหมด'] === 0) { showToast('กรุณาระบุจำนวนสินค้าที่จะเปิดบิลอย่างน้อย 1 ชิ้น', 'error'); return; }
          
          setIsSubmitting(true);
          try {

          let pvChange = 0;
          let oldPv = 0;
          let newPv = calculateBillPV(cart, products);

          if (editingSaleId) {
             const oldRecord = (sales || []).find(s => s.id === editingSaleId);
             if (oldRecord) {
                 const oldCart = [];
                 Object.keys(oldRecord).forEach(k => {
                     const qty = parseInt(oldRecord[k], 10) || 0;
                     if (qty > 0) {
                         if (k.endsWith('_ราคาเต็ม') && k !== 'รวมชิ้นราคาเต็ม') oldCart.push({ productName: k.replace('_ราคาเต็ม', ''), priceType: 'ราคาเต็ม', qty });
                         else if (k.endsWith('_ราคาสมาชิก') && k !== 'รวมชิ้นราคาสมาชิก') oldCart.push({ productName: k.replace('_ราคาสมาชิก', ''), priceType: 'ราคาสมาชิก', qty });
                     }
                 });
                 oldPv = calculateBillPV(oldCart, products);
             }
             pvChange = newPv - oldPv;
          } else {
             pvChange = newPv;
          }

          if (editingSaleId) {
             newRecord.id = editingSaleId;
           const supaSalesData = {
                     order_id: newRecord.id,
                     date: newRecord.date,
                     seller_id: newRecord.memberId,
                     customer_id: newRecord.customerId,
                     member_name: newRecord.memberName,
                     customer_name: (newCustomerObj ? newCustomerObj.name : (newRecord.customerName || '')),
                     sale_type: newRecord.saleType,
                     total_amount: newRecord.totalAmount,
                     total_bottles: cart.reduce((sum, item) => sum + (parseInt(item.qty)||0), 0),
                     status: 'Completed',
                     recorded_by: newRecord.recordedBy,
                     items_json: cart.map(item => ({qty: item.qty, prod: item.productName, type: item.priceType})),
                 payment_note: newRecord.paymentNote || newRecord.payment_note
                 };
                 if (typeof supabaseUpsert === 'function') await supabaseUpsert('stk_sales', supaSalesData);

                 if (newCustomerObj && typeof supabaseUpsert === 'function') {
                     await supabaseUpsert('stk_customers', { customer_id: newCustomerObj.id, name: newCustomerObj.name, phone: newCustomerObj.phone, line_id: newCustomerObj.lineId || '', customer_type: newCustomerObj.type, symptom_disease: newCustomerObj.symptom, owner_member_id: newCustomerObj.memberId, closer_id: newCustomerObj.closer, extra_details_json: { closerTeam: newCustomerObj.closerTeam, memberName: newCustomerObj.memberName }, status: 'Active' });
                 }

                 const oldQtyMap = {};
                 const oldRecord = (sales || []).find(s => s.id === editingSaleId);
                 if (oldRecord) {
                     Object.keys(oldRecord).forEach(k => {
                         if ((k.endsWith('_ราคาเต็ม') || k.endsWith('_ราคาโปร') || k.endsWith('_ราคาสมาชิก') || k.endsWith('_ราคาศูนย์')) && !k.startsWith('รวมชิ้น')) {
                             const pName = k.replace(/_ราคาเต็ม$|_ราคาโปร$|_ราคาสมาชิก$|_ราคาศูนย์$/, '');
                             const p = (products || []).find(prod => prod.name === pName);
                             if (p) oldQtyMap[p.id] = (oldQtyMap[p.id] || 0) + (parseInt(oldRecord[k], 10)||0);
                         }
                     });
                 }

                 if (typeof supabaseUpdate === 'function') {
                     for (const pid of [...new Set([...Object.keys(oldQtyMap), ...Object.keys(qtyMap)])]) {
                         const diff = (qtyMap[pid] || 0) - (oldQtyMap[pid] || 0);
                         const pInfo = (products || []).find(p => p.id === pid);
                         if (pInfo && diff !== 0) {
                             const newStock = (pInfo.current_stock || pInfo.stock || 0) - diff;
                             await supabaseUpdate('stk_products', pid, { current_stock: newStock }, 'product_id');
                         }
                     }
                 }

                 if (setProducts) {
                     setProducts(prev => prev.map(p => {
                         const diff = (qtyMap[p.id] || 0) - (oldQtyMap[p.id] || 0);
                         return diff !== 0 ? {...p, stock: p.stock - diff} : p;
                     }));
                 }
             
             setSales(prev => prev.map(s => s.id === editingSaleId ? newRecord : s)); 
             if(newCustomerObj) {
                 setCustomers(prev => {
                     const pr = prev || [];
                     const exists = pr.find(c => c.id === newCustomerObj.id);
                     if(exists) return pr.map(c => c.id === newCustomerObj.id ? newCustomerObj : c);
                     return [newCustomerObj, ...pr];
                 });
             }
             if (foundMember && foundMember.id && pvChange !== 0) await updateMemberPVInSupabase(foundMember.id, pvChange, 'user_id');
             handleCancelEdit();
             setSuccessModal({ show: true, saleRecord: newRecord });
             setIsSubmitting(false);
             return;
          }
           const supaSalesData = {
                 order_id: newRecord.id,
                 date: newRecord.date,
                 seller_id: newRecord.memberId,
                 customer_id: newRecord.customerId,
                 sale_type: newRecord.saleType,
                 total_amount: newRecord.totalAmount,
                 total_bottles: cart.reduce((sum, item) => sum + (parseInt(item.qty)||0), 0),
                 status: 'Completed',
                 recorded_by: newRecord.recordedBy,
                 items_json: cart.map(item => ({qty: item.qty, prod: item.productName, type: item.priceType})),
                 payment_note: newRecord.paymentNote || newRecord.payment_note
             };
             if (typeof supabaseUpsert === 'function') await supabaseUpsert('stk_sales', supaSalesData);

             if (newCustomerObj && typeof supabaseUpsert === 'function') {
                 await supabaseUpsert('stk_customers', { customer_id: newCustomerObj.id, name: newCustomerObj.name, phone: newCustomerObj.phone, line_id: newCustomerObj.lineId || '', customer_type: newCustomerObj.type, symptom_disease: newCustomerObj.symptom, owner_member_id: newCustomerObj.memberId, closer_id: newCustomerObj.closer, extra_details_json: { closerTeam: newCustomerObj.closerTeam, memberName: newCustomerObj.memberName }, status: 'Active' });
             }

             if (typeof supabaseUpdate === 'function') {
                 for (const pid of Object.keys(qtyMap)) {
                     const deductQty = qtyMap[pid];
                     const pInfo = (products || []).find(p => p.id === pid);
                     if (pInfo && deductQty > 0) {
                         const newStock = (pInfo.current_stock || pInfo.stock || 0) - deductQty;
                         await supabaseUpdate('stk_products', pid, { current_stock: newStock }, 'product_id');
                     }
                 }
             }
             if (foundMember && foundMember.id && pvChange !== 0) await updateMemberPVInSupabase(foundMember.id, pvChange, 'user_id');
             
             if (setProducts) {
                 setProducts(prev => prev.map(p => {
                     const deduct = qtyMap[p.id] || 0;
                     return deduct > 0 ? {...p, stock: p.stock - deduct} : p;
                 }));
             }
             setSales(prev => [newRecord, ...(prev || [])]); 
             if(newCustomerObj) setCustomers(prev => [newCustomerObj, ...(prev || [])]); 
             handleSuccessFinish(newRecord);
          } catch (err) {
              console.error("Save Error:", err);
              showToast('เกิดข้อผิดพลาดในการบันทึก: ' + (err.message || err), 'error');
              setIsSubmitting(false);
          }
        };


        const filteredSalesHistory = useMemo(() => {
           let result = (sales || []);
           
           result = result.sort((a, b) => {
               const idA = String(a.id || '');
               const idB = String(b.id || '');
               return idB.localeCompare(idA); 
           });

           if (historyStartDate) result = result.filter(s => formatDbDateForFilter(s.date) >= historyStartDate);
           if (historyEndDate) result = result.filter(s => formatDbDateForFilter(s.date) <= historyEndDate);

           if (salesSearchTerm.trim() !== '') {
               const st = salesSearchTerm.toLowerCase();
               result = result.filter(s => {
                  const sCustId = s.customerId ? s.customerId.toLowerCase() : '';
                  const sMemId = s.memberId ? s.memberId.toLowerCase() : '';
                  const sMemName = s.memberName ? s.memberName.toLowerCase() : '';
                  const sIdStr = s.id ? s.id.toString() : '';
                  return sCustId.includes(st) || sMemId.includes(st) || sMemName.includes(st) || sIdStr.includes(st);
               });
           }
           
           if (saleTab !== 'B2M') {
               result = []; 
           }

           return result;
        }, [sales, historyStartDate, historyEndDate, salesSearchTerm, saleTab]);

        const totalSalesPages = Math.max(1, Math.ceil(filteredSalesHistory.length / SALES_PER_PAGE));
        const paginatedSalesHistory = useMemo(() => {
            return filteredSalesHistory.slice((salesPage - 1) * SALES_PER_PAGE, salesPage * SALES_PER_PAGE);
        }, [filteredSalesHistory, salesPage]);

        useEffect(() => { setSalesPage(1); }, [historyStartDate, historyEndDate, salesSearchTerm, saleTab]);

        const tableTotals = useMemo(() => {
            let totalFull = 0, totalMember = 0, totalPro = 0, totalZero = 0, grandTotal = 0, totalAmountTHB = 0;
            filteredSalesHistory.forEach(s => {
               let rowF = 0, rowM = 0, rowP = 0, rowZ = 0;
               Object.keys(s).forEach(key => {
                   const qty = parseInt(s[key]) || 0;
                   if (qty > 0) {
                       if (key.endsWith('_ราคาเต็ม') && key !== 'รวมชิ้นราคาเต็ม') rowF += qty;
                       else if (key.endsWith('_ราคาสมาชิก') && key !== 'รวมชิ้นราคาสมาชิก') rowM += qty;
                       else if (key.endsWith('_ราคาโปร') && key !== 'รวมชิ้นราคาโปร') rowP += qty;
                       else if (key.endsWith('_ราคาศูนย์') && key !== 'รวมชิ้นราคาศูนย์') rowZ += qty;
                   }
               });

               totalFull += rowF;
               totalMember += rowM;
               totalPro += rowP;
               totalZero += rowZ;
               grandTotal += (rowF + rowM + rowP + rowZ);
               totalAmountTHB += parseFloat(s.totalAmount || 0);
            });
            return { totalFull, totalMember, totalPro, totalZero, grandTotal, totalAmountTHB, count: filteredSalesHistory.length };
        }, [filteredSalesHistory]);

       const renderRecordCells = (record) => {
            let fullItems = []; let memberItems = []; let proItems = []; let zeroItems = [];
            Object.keys(record).forEach(key => {
                const qty = parseInt(record[key]) || 0;
                if (qty > 0) {
                    const cleanProdName = (raw) => raw.replace(/\(.*?\)/g, '').trim();
                    if (key.endsWith('_ราคาเต็ม') && key !== 'รวมชิ้นราคาเต็ม') fullItems.push({name: cleanProdName(key.replace('_ราคาเต็ม', '')), qty});
                    else if (key.endsWith('_ราคาสมาชิก') && key !== 'รวมชิ้นราคาสมาชิก') memberItems.push({name: cleanProdName(key.replace('_ราคาสมาชิก', '')), qty});
                    else if (key.endsWith('_ราคาโปร') && key !== 'รวมชิ้นราคาโปร') proItems.push({name: cleanProdName(key.replace('_ราคาโปร', '')), qty});
                    else if (key.endsWith('_ราคาศูนย์') && key !== 'รวมชิ้นราคาศูนย์') zeroItems.push({name: cleanProdName(key.replace('_ราคาศูนย์', '')), qty});
                }
            });

            const totalQtyInRow = [...fullItems, ...memberItems, ...proItems, ...zeroItems].reduce((sum, item) => sum + item.qty, 0);

            const renderList = (items, textClass) => {
                if(items.length === 0) return <span className="text-slate-300 text-xs">-</span>;
                return (
                    <div className="flex flex-col gap-1 w-full">
                        {items.map((it, i) => (
                            <div key={i} className="flex justify-between items-center text-[11px] bg-white px-2 py-1 rounded shadow-sm border border-slate-100">
                                <span className="font-bold text-slate-700 truncate mr-2" title={it.name}>{it.name}</span>
                                <span className={`font-black ${textClass}`}>x{it.qty}</span>
                            </div>
                        ))}
                    </div>
                )
            }

            return (
              <React.Fragment>
                  <td className={`${tableCellClass} bg-green-50/30 border-l border-slate-100 align-top`}>{renderList(fullItems, 'text-green-600')}</td>

    // ==========================================
    // 📌 React App (Main Component)
    // ==========================================
    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      
      const [products, setProducts] = useState([]);
      const [customerTypes, setCustomerTypes] = useState(fallbackCustomerTypes);
      const [closers, setClosers] = useState([]);
      const [members, setMembers] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [sales, setSales] = useState([]);
      const [systemUsers, setSystemUsers] = useState([]);
      const [systemSettings, setSystemSettings] = useState({ exchange_rate: 700 }); 
      const [isAppLoading, setIsAppLoading] = useState(true);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try {
          return localStorage.getItem('stk_sidebar_collapsed') === 'true';
        } catch(e) {
          return false;
        }
      });
      
      const latestSaleIdRef = useRef(null);
      const latestCustIdRef = useRef(null);
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      
      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
      };

      const SCRIPT_URL = '';

      const isAdmin = currentUser && (
          String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || 
          String(currentUser.role).trim().toLowerCase() === 'admin'
      );
      const currentUserProfileUrl = currentUser?.profileUrl || '';

      const activeProductsList = useMemo(() => {
          if (!products || products.length === 0) return fallbackProductsList;
          return (products || []).filter(p => p && p.status !== 'เลิกขาย').map(p => p.name);
      }, [products]);

      const activeCustomerTypes = useMemo(() => {
          if (!customerTypes || customerTypes.length === 0) return fallbackCustomerTypes;
          return (customerTypes || []).filter(p => p && p.status === 'ใช้งาน');
      }, [customerTypes]);

      useEffect(() => {
        const savedUserStr = localStorage.getItem('stk_current_user');
        if (savedUserStr) {
          const user = JSON.parse(savedUserStr);
          setCurrentUser(user);
          setIsLoggedIn(true);
        } else {
          setShowLoginModal(true);
        }

        const initialLoader = document.getElementById('initial-loader');
        if (initialLoader) {
            initialLoader.style.display = 'none';
        }

        try {
            const cachedData = localStorage.getItem('stk_app_cache_data');
            if (cachedData) {
                const parsedData = JSON.parse(cachedData);
                applyDataToStates(parsedData);
                setIsAppLoading(false);
            }
        } catch (e) { console.warn("Cache error", e); }

        Promise.all([
          supabaseSelect('stk_products').catch(() => supabaseSelect('products')),
          supabaseSelect('stk_customer_types').catch(() => supabaseSelect('customer_types')),
          supabaseSelect('stk_closers').catch(() => supabaseSelect('closers')),
          supabaseSelect('stk_members').catch(() => supabaseSelect('members')),
          supabaseSelect('stk_customers').catch(() => supabaseSelect('customers')),
          supabaseSelect('stk_sales').catch(() => supabaseSelect('sales')),
          supabaseSelect('stk_business_teams').catch(() => supabaseSelect('business_teams'))
        ]).then(([pRes, typeRes, cloRes, memRes, custRes, saleRes, teamRes]) => {
          const resObj = {
            products: pRes,
            customerTypes: typeRes,
            closers: cloRes,
            members: memRes,
            customers: custRes,
            sales: saleRes,
            businessTeams: teamRes
          };
          applyDataToStates(resObj);
          try { localStorage.setItem('stk_app_cache_data', JSON.stringify(resObj)); } catch(e){}
        }).catch(err => {
          console.error("Supabase load error:", err);
        }).finally(() => {
          setIsAppLoading(false);
        });
      }, []);

      const applyDataToStates = (response) => {
           if (Array.isArray(response.products)) setProducts(response.products.map(x => ({
               ...x, 
               id: x.id || x.product_id,
               priceFull: Number(x.price_full ?? x.priceFull ?? 0) || 0,
               priceMember: Number(x.price_member ?? x.priceMember ?? 0) || 0,
               pricePromo: Number(x.price_promo ?? x.pricePromo ?? 0) || 0
           })));
           if (Array.isArray(response.customerTypes)) setCustomerTypes(response.customerTypes.map(x => ({...x, id: x.id || x.type_id})));
           if (Array.isArray(response.closers)) setClosers(response.closers.map(x => ({...x, id: x.id || x.closer_id})));
           if (Array.isArray(response.members)) { setMembers(response.members.map(m => ({ ...m, id: m.id || m.user_id || m.member_id, name: m.name, profileUrl: m.id_card_url || m.profileImageUrl || m.profileUrl, idCardDocUrl: m.id_card_url || m.idCardDocUrl, businessTeam: m.business_team || m.businessTeam, team: m.business_team || m.team || m.businessTeam || 'T01', role: m.permission_role || m.role || m.permissionRole, status: m.status, sponsorId: m.sponsor_id || m.sponsorId, accumulatedPv: m.accumulated_pv || m.Accumulated_PV || m.accumulatedPv || m.pv || 0, phone: m.phone_number || m.phone || m.phoneNumber }))); }
           if (Array.isArray(response.customers)) setCustomers(response.customers.map(x => ({...x, id: x.id || x.customer_id, lineId: x.lineId || x.line_id, closerTeam: x.closerTeam || x.closer_team, memberId: x.memberId || x.member_id, memberName: x.memberName || x.member_name})));
           if (Array.isArray(response.systemUsers)) setSystemUsers(response.systemUsers.map(x => ({...x, id: x.id || x.user_id || x.system_user_id})));
           
           if (Array.isArray(response.sales)) {
               const processedSales = response.sales.map(s => {
                   let sumF = 0, sumM = 0, sumP = 0, sumZ = 0;
                   let itemsList = [];
                   if (s.items_json) {
                       try { itemsList = typeof s.items_json === 'string' ? JSON.parse(s.items_json) : s.items_json; } catch(e){}
                   }
                   
                   if (Array.isArray(itemsList) && itemsList.length > 0) {
                       itemsList.forEach(it => {
                           let typeStr = String(it.type || '').trim();
                           if (typeStr === 'ราคาพิเศษ' || typeStr === 'ราคาโปรโมชั่น') typeStr = 'ราคาโปร';
                           if (typeStr === 'ราคาแถม') typeStr = 'ราคาศูนย์';
                           const qtyNum = Number(it.qty || it.quantity || 1);
                           const pName = String(it.prod || it.productName || it.name || 'Unknown').trim();
                           
                           s[`${pName}_${typeStr}`] = qtyNum;
                           
                           if (typeStr === 'ราคาเต็ม') sumF += qtyNum;
                           else if (typeStr === 'ราคาสมาชิก') sumM += qtyNum;
                           else if (typeStr === 'ราคาโปร' || typeStr === 'โปรโมชั่น') sumP += qtyNum;
                           else if (typeStr === 'ราคาศูนย์') sumZ += qtyNum;
                           else sumM += qtyNum;
                       });
                   } else {
                       Object.keys(s).forEach(k => {
                           if (k !== 'รวมชิ้นราคาเต็ม' && k !== 'รวมชิ้นราคาสมาชิก' && k !== 'รวมชิ้นราคาโปร' && k !== 'รวมชิ้นราคาศูนย์' && k !== 'ยอดรวมชิ้นทั้งหมด') {
                               if (k.endsWith('_ราคาเต็ม')) sumF += (parseInt(s[k]) || 0);
                               else if (k.endsWith('_ราคาสมาชิก')) sumM += (parseInt(s[k]) || 0);
                               else if (k.endsWith('_ราคาโปร') || k.endsWith('_โปรโมชั่น')) sumP += (parseInt(s[k]) || 0);
                               else if (k.endsWith('_ราคาศูนย์')) sumZ += (parseInt(s[k]) || 0);
                           }
                       });
                   }
                   
                   s['memberId'] = s.memberId || s.sellerId || s.seller_id || s.seller;
                   s['sellerId'] = s.sellerId || s.seller_id || s.seller || s.memberId;
                   s['รวมชิ้นราคาเต็ม'] = sumF; 
                   s['รวมชิ้นราคาสมาชิก'] = sumM;
                   s['รวมชิ้นราคาโปร'] = sumP; 
                   s['รวมชิ้นราคาศูนย์'] = sumZ;
                   s['ยอดรวมชิ้นทั้งหมด'] = Number(s.total_bottles || 0) || (sumF + sumM + sumP + sumZ);
                   s.customerId = s.customerId || s.customer_id;
                   s.totalAmount = s.totalAmount || s.total_amount;
                   s.saleType = s.saleType || s.sale_type;
                   s.date = s.date || s.created_at;
                   s.recordedBy = s.recordedBy || s.recorded_by;
                   s.paymentNote = s.paymentNote || s.payment_note || s.notes;
                   s.id = s.id || s.sale_id || s.receipt_id || s.order_id;
                   return s;
               });
               setSales(processedSales);
               if (processedSales.length > 0) latestSaleIdRef.current = processedSales[0].id; 
           }
           if (response.systemSettings) setSystemSettings(response.systemSettings);
      };

      const handleLoginSuccess = (user) => {
        localStorage.setItem('stk_current_user', JSON.stringify(user));
        setCurrentUser(user);
        setIsLoggedIn(true);
        setShowLoginModal(false);
        showToast('เข้าสู่ระบบสำเร็จ!', 'success');
      };

      const handleLogout = () => {
        localStorage.removeItem('stk_current_user');
        setCurrentUser(null);
        setIsLoggedIn(false);
        if (typeof window !== 'undefined') window.location.href = 'Mlm.html';
      };

      return (
        <div className="min-h-screen flex flex-col lg:flex-row font-sans bg-slate-50">
          <Sidebar 
            activePage="sales" 
            isLoggedIn={isLoggedIn} 
            currentUser={currentUser} 
            currentUserProfileUrl={currentUserProfileUrl} 
            isAdmin={isAdmin} 
            onLogout={handleLogout} 
            showLoginModal={showLoginModal} 
            setShowLoginModal={setShowLoginModal} 
            SCRIPT_URL={SCRIPT_URL}
            setIsAppLoading={setIsAppLoading}
            isSidebarCollapsed={isSidebarCollapsed}
            setIsSidebarCollapsed={setIsSidebarCollapsed}
          />
          
          <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>
            
            {toast.show && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4 animation-fade-in" style={{ animationDuration: '0.2s' }}>
                 <div className={`bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center animation-pop border-t-4 ${toast.type === 'error' ? 'border-red-500' : toast.type === 'info' ? 'border-blue-500' : 'border-emerald-500'}`}>
                    <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${toast.type === 'error' ? 'bg-red-100 text-red-500' : toast.type === 'info' ? 'bg-blue-100 text-blue-500' : 'bg-emerald-100 text-emerald-500'}`}>
                       {toast.type === 'error' ? <X size={32} /> : toast.type === 'info' ? <Trophy size={32} /> : <CheckCircle size={32} />}
                    </div>
                    <h3 className="text-xl font-bold text-slate-800 mb-2">{toast.type === 'error' ? 'เกิดข้อผิดพลาด' : toast.type === 'info' ? 'แจ้งเตือน' : 'สำเร็จ!'}</h3>
                    <p className="text-slate-600 font-medium text-sm mb-6">{toast.message}</p>
                    <button onClick={() => setToast({ ...toast, show: false })} className="w-full py-2.5 rounded-lg font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">ตกลง</button>
                 </div>
              </div>
            )}

            <div className="p-3 sm:p-5 flex-1 w-full relative z-0 custom-scrollbar">
              <div className="w-full relative z-10 xl:h-full flex flex-col min-h-0 pos-layout">
                {isAppLoading ? (
                  <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in flex-1">
                    <div className="w-16 h-16 border-[4px] border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                    <h2 className="text-lg font-bold text-slate-700">กำลังซิงค์ข้อมูลกับฐานข้อมูล...</h2>
                    <p className="text-slate-500 text-sm">กรุณารอสักครู่ ระบบกำลังดึงข้อมูลล่าสุด</p>
                  </div>
                ) : isLoggedIn ? (
                  <SalesEntryView 
                    members={members} 
                    customers={customers} 
                    closers={closers} 
                    sales={sales} 
                    setSales={setSales} 
                    setCustomers={setCustomers} 
                    activeProductsList={activeProductsList} 
                    activeCustomerTypes={activeCustomerTypes} 
                    isAdmin={isAdmin} 
                    showToast={showToast} 
                    currentUser={currentUser} 
                    products={products}
                    setProducts={setProducts}
                    systemSettings={systemSettings}
                  />
                ) : (
                  <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in flex-1">
                    <h2 className="text-xl font-black text-red-500">กรุณาเข้าสู่ระบบก่อนใช้งาน</h2>
                    <button onClick={() => setShowLoginModal(true)} className={btnClassPrimary}>เข้าสู่ระบบ</button>
                  </div>
                )}
              </div>
            </div>
          </main>

          <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={systemUsers} />

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
