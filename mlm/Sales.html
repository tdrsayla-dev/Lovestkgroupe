                            const inQtyMap = {};
                            itemsList.forEach(it => {
                                const qty = parseInt(it.qty) || parseInt(it.quantity) || 0;
                                if (qty > 0) {
                                    const pName = String(it.prod || it.productName || it.name || '').trim();
                                    const p = currentProducts.find(prod => {
                                        const pDbName = String(prod.name || prod.product_name || '').trim();
                                        const pDbId = String(prod.product_id || prod.id || '').trim();
                                        // ⚡ FIX: ค้นหาสินค้าทั้งแบบตรงๆ และแบบละเว้นวงเล็บ เพื่อความชัวร์
                                        return pDbName === pName || pDbId === pName || pDbName.replace(/\(.*?\)/g, '').trim() === pName.replace(/\(.*?\)/g, '').trim();
                                    });

                                    if (p) {
                                        if (p.is_bundle || p.isBundle) {
                                            const baseP = currentProducts.find(bp => {
                                                const bpName = String(bp.name || bp.product_name || '').trim();
                                                const targetBase = String(p.base_product || p.baseProduct || '').trim();
                                                return bpName === targetBase;
                                            });
                                            if (baseP) {
                                                const totalToReturn = qty * (parseInt(p.bundle_qty || p.bundleQty) || 1);
                                                const baseId = baseP.product_id || baseP.id;
                                                inQtyMap[baseId] = (inQtyMap[baseId] || 0) + totalToReturn;
                                            }
                                        } else {
                                            const pId = p.product_id || p.id;
                                            inQtyMap[pId] = (inQtyMap[pId] || 0) + qty;
                                        }
                                    }
                                }
                            });

                            for (const pid of Object.keys(inQtyMap)) {
                                const totalQtyToReturn = inQtyMap[pid];
                                const pInfo = currentProducts.find(p => (p.product_id || p.id) === pid);

                                if (pInfo && totalQtyToReturn > 0) {
                                    const realProductId = pInfo.product_id || pInfo.id;
                                    const currentStock = parseInt(pInfo.current_stock || pInfo.stock) || 0;
                                    const newStock = currentStock + totalQtyToReturn;

                                    if (typeof supabaseUpdate === 'function' && realProductId) {

                                    if (typeof supabaseInsert === 'function' && realProductId) {
                                        await supabaseInsert('stk_stock_movements', {

                    await supabaseDelete('stk_sales', confirmDelete.id, 'order_id').catch(() => { });
                    await supabaseDelete('sales', confirmDelete.id, 'order_id').catch(() => { });

                    if (saleToCancel && (saleToCancel.customerId || saleToCancel.customer_id || saleToCancel.customer)) {
                        const custId = saleToCancel.customerId || saleToCancel.customer_id || saleToCancel.customer;
                        const custType = String(saleToCancel.customerType || saleToCancel.customer_type || '').trim();
                        const isOldCustType = custType.includes('เก่า') || custType.includes('เดิม') || custType.includes('ต่อยา') || custType.includes('เคสเดิม');

                        if (!isOldCustType) {
                            let otherSales = [];

                                otherSales = await supabaseSelect('stk_sales', `customer_id=eq.${custId}&select=order_id`);
                            } catch (e) { }

                            if (!otherSales || otherSales.length === 0) {
                                try { await supabaseDelete('stk_customers', custId, 'customer_id'); } catch (e) { }
                                try { await supabaseDelete('customers', custId, 'id'); } catch (e) { }
                                try { await supabaseDelete('customers', custId, 'customer_id'); } catch (e) { }
                            }
                        }
                    }

                    // แจ้งยกเลิกบิลไปยังตารางใบสั่งยา (Nutrients)
                    const paymentNoteStr = saleToCancel ? (saleToCancel.paymentNote || saleToCancel.payment_note || '') : '';

                    if (visitMatch && visitMatch[1]) {

                    setSales(prev => prev.filter(s => s.id !== confirmDelete.id));

                } catch (e) {
                    showToast('เกิดข้อผิดพลาดในการลบ: ' + e.message, 'error');
                } finally {
                    setConfirmDelete({ show: false, id: null, title: '' });

            };

            const handleSuccessFinish = (recordToShow = null) => {
                if (recordToShow) {
                    setSuccessModal({ show: true, saleRecord: recordToShow });

                // --- 🟢 โค้ดส่งแจ้งเตือน LINE OA (ยิงผ่าน Supabase) ---
                try {

                    const targetLineUid = foundMember ? (foundMember.lineUid || foundMember.line_uid) : null;

                    if (targetLineUid && targetLineUid.startsWith('U')) {
                        const totalBoxes = cart.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);
                        const netTotal = cartTotals.amount;

                        const msg = `🎉 มีออเดอร์ใหม่ถูกคีย์เข้าสู่ระบบ!\n\n` +
                            `🧾 เลขที่บิล: ${recordToShow ? recordToShow.id : '-'}\n` +
                            `👤 ลูกค้า: ${custData.name || 'ไม่ระบุ'}\n` +
                            `📦 จำนวน: ${totalBoxes} กล่อง\n` +
                            `💰 ยอดรวม: ฿${netTotal.toLocaleString()}\n\n` +
                            `ตรวจสอบรายละเอียดเพิ่มเติมในระบบได้เลยครับ`;

                        // สั่งให้ฟังก์ชัน send_line_message ใน Supabase ทำงาน
                        fetch(window.SUPABASE_REST_URL + '/rpc/send_line_message', {
                            method: 'POST',
                            headers: window.SUPABASE_HEADERS,
                            body: JSON.stringify({
                                line_uid: targetLineUid,
                                msg_text: msg
                            })
                        }).then(res => {
                            if (!res.ok) console.warn('ส่ง LINE ไม่สำเร็จ รหัส Error:', res.status);
                            else console.log('✅ ส่งแจ้งเตือน LINE สำเร็จ!');
                        }).catch(e => console.warn('Supabase RPC Error:', e));
                    }
                } catch (e) {
                    console.warn('LINE Notify Error:', e);
                }
                // ---------------------------------------------------
            };

            const handleAdd = async (e) => {
                e.preventDefault();
                if (isSubmittingRef.current || isSubmitting) return;
                isSubmittingRef.current = true;
                setIsSubmitting(true);
                try {
                    await _handleAdd(e);
                } finally {
                    isSubmittingRef.current = false;
                    setIsSubmitting(false);
                }
            };

            const _handleAdd = async (e) => {
                e.preventDefault();
                if (!foundMember) { showToast('ระบุรหัสสมาชิกผู้ขายไม่ถูกต้อง', 'error'); return; }
                if (!custMode || String(custMode).trim() === '') { showToast('กรุณาระบุประเภทลูกค้า', 'error'); return; }

                // --- ⚡ เพิ่มการตรวจสอบห้ามเปิดบิลซ้ำสำหรับ VISIT ID เดิม (เฉพาะตอนเปิดบิลใหม่) ---
                if (!editingSaleId && paymentNote && paymentNote.includes('VISIT:')) {
                    const visitMatch = paymentNote.match(/VISIT:\s*([^\)\s]+)/);
                    if (visitMatch && visitMatch[1]) {
                        const visitId = visitMatch[1];
                        try {
                            if (typeof window.supabaseSelect === 'function') {
                                const existingBills = await window.supabaseSelect('stk_sales', `payment_note=ilike.%VISIT: ${visitId}%`);
                                if (existingBills && existingBills.length > 0) {
                                    Swal.fire({
                                        icon: 'error',
                                        title: 'ไม่อนุญาตให้เปิดบิลซ้ำ',
                                        text: `รหัส VISIT ${visitId} ได้ถูกใช้เปิดบิลไปแล้ว กรุณายกเลิกบิลเก่าก่อนหากต้องการเปิดบิลใหม่`,
                                        confirmButtonColor: '#047857'
                                    });
                                    return;
                                }
                            }
                        } catch (err) {
                            console.warn('Error checking existing visit id:', err);
                        }
                    }
                }
                // --------------------------------------------------------

                let finalCustomerId = custData.id; let newCustomerObj = null;
                const isOldCustomerMode = custMode.includes('เก่า');

                if (!isOldCustomerMode) {
                    if (!custData.name) { showToast('กรุณากรอกชื่อลูกค้า', 'error'); return; }
                    if (!custData.closerTeam) { showToast('กรุณาเลือกทีมผู้ปิดการขาย', 'error'); return; }
                    if (!custData.closer) { showToast('กรุณาระบุผู้ปิดการขาย', 'error'); return; }
                    if (!finalCustomerId) {
                        const usedIds = new Set();
                        (customers || []).forEach(c => {
                            const match = c && c.id && c.id.match(/^C(\d+)$/i);
                            if (match) usedIds.add(parseInt(match[1], 10));
                        });
                        (sales || []).forEach(s => {
                            const match = s && s.customerId && s.customerId.match(/^C(\d+)$/i);
                            if (match) usedIds.add(parseInt(match[1], 10));
                        });

                        // Query DB to prevent race conditions on Customer ID
                        try {
                            const dbCusts = await supabaseSelect('stk_customers', 'customer_id=like.C*&select=customer_id&limit=10000');
                            if (Array.isArray(dbCusts)) {
                                dbCusts.forEach(c => {
                                    const match = c && c.customer_id && c.customer_id.match(/^C(\d+)$/i);
                                    if (match) usedIds.add(parseInt(match[1], 10));
                                });
                            }
                        } catch (e) {
                            console.warn('Querying stk_customers for unique ID failed:', e);
                        }

                        let nextIdNum = 1;
                        while (usedIds.has(nextIdNum)) {
                            nextIdNum++;
                        }

                        // Double check uniqueness in database loop
                        let idCheckAttempts = 0;
                        while (idCheckAttempts < 10) {
                            const candidateId = "C" + nextIdNum.toString().padStart(3, '0');
                            try {
                                const existCheck = await supabaseSelect('stk_customers', `customer_id=eq.${candidateId}&select=customer_id`);
                                if (!Array.isArray(existCheck) || existCheck.length === 0) {
                                    finalCustomerId = candidateId;
                                    break;
                                }
                                nextIdNum++;
                            } catch (_) {
                                finalCustomerId = candidateId;
                                break;
                            }
                            idCheckAttempts++;
                        }
                        if (!finalCustomerId) {
                            finalCustomerId = "C" + nextIdNum.toString().padStart(3, '0');
                        }
                    }
                    newCustomerObj = { id: finalCustomerId, name: custData.name, phone: custData.phone, lineId: custData.lineId || '', type: custMode, symptom: custData.symptom, closerTeam: custData.closerTeam, closer: custData.closer, memberId: foundMember.id, memberName: foundMember.name };
                } else {
                    let originalCust = (customers || []).find(c => c && safeUpper(c.id) === safeUpper(finalCustomerId));

                    // 🔒 CASE STEALING PROTECTION: If customer is not found in client state, query DB directly
                    if (!originalCust) {
                        try {
                            const dbCheck = await supabaseSelect('stk_customers', `customer_id=eq.${finalCustomerId}`);
                            if (Array.isArray(dbCheck) && dbCheck.length > 0) {
                                const c = dbCheck[0];
                                originalCust = {
                                    id: c.customer_id,
                                    name: c.name,
                                    phone: c.phone || '',
                                    lineId: c.line_id || '',
                                    type: c.customer_type || '',
                                    symptom: c.symptom_disease || '',
                                    closer: c.closer_id || '',
                                    closerTeam: c.extra_details_json?.closerTeam || '',
                                    memberId: c.owner_member_id || c.member_id || '',
                                    memberName: c.member_name || c.extra_details_json?.memberName || ''
                                };
                            }
                        } catch (e) {
                            console.warn('Checking customer owner in DB failed:', e);
                        }
                    }

                    if (!originalCust) {
                        showToast('ไม่พบข้อมูลลูกค้าเก่ารหัสนี้ในระบบ', 'error');
                        return;
                    }
                    if (!custData.closerTeam) { showToast('กรุณาเลือกทีมผู้ปิดการขาย', 'error'); return; }
                    if (!custData.closer) { showToast('กรุณาระบุผู้ปิดการขาย', 'error'); return; }

                    // Compare original owner member ID with the entered seller member ID
                    const ownerId = String(originalCust.memberId || '').trim().toUpperCase();
                    const sellerId = String(foundMember.id || '').trim().toUpperCase();
                    if (ownerId && ownerId !== sellerId) {
                        showToast(`ขออภัย! ลูกค้าท่านนี้ไม่ใช่เคสที่คุณดูแล (เป็นเคสของสมาชิก ${originalCust.memberId})`, 'error');
                        return;
                    }

                    if (originalCust.closer !== custData.closer || originalCust.type !== custMode || originalCust.phone !== custData.phone || originalCust.lineId !== custData.lineId || originalCust.symptom !== custData.symptom) {
                        const updatedCust = { ...originalCust, closer: custData.closer, type: custMode, phone: custData.phone, lineId: custData.lineId, symptom: custData.symptom };
                        newCustomerObj = updatedCust;
                    }
                }

                const isHistoryBypass = saleTab === 'OLD_SYSTEM';

                const qtyMap = {};
                cart.forEach(item => {
                    const p = (products || []).find(prod => prod.name === item.productName);
                    if (p) {
                        if (p.isBundle || p.is_bundle) {
                            // ถ้าเป็นเซ็ตโปรโมชั่น ให้ไปดึงสินค้าหลักมาตัดสต๊อก
                            const baseP = (products || []).find(bp => bp.name === (p.baseProduct || p.base_product));
                            if (baseP) {
                                const totalToDeduct = (parseInt(item.qty) || 0) * (parseInt(p.bundleQty || p.bundle_qty) || 1);
                                qtyMap[baseP.id] = (qtyMap[baseP.id] || 0) + totalToDeduct;
                            }
                        } else {
                            // ถ้าเป็นสินค้าปกติ ตัดของตัวเอง
                            qtyMap[p.id] = (qtyMap[p.id] || 0) + (parseInt(item.qty) || 0);
                        }
                    }
                });

                for (const pid of Object.keys(qtyMap)) {
                    const p = (products || []).find(prod => prod.id === pid);
                    if (!isHistoryBypass && !editingSaleId && p && p.stock < qtyMap[pid]) {
                        showToast(`สินค้า ${p.name} มีสต๊อกไม่พอ (ต้องการ ${qtyMap[pid]}, เหลือ ${p.stock} ชิ้น)`, 'error');
                        return;
                    }
                }

                let nextSaleIdStr = "";
                if (!editingSaleId) {
                    const dateParts = formData.date.split('-');
                    const datePrefix = `${dateParts[0]}${dateParts[1]}${dateParts[2]}`;

                    // 🔒 RACE CONDITION FIX: ดึง ID ล่าสุดจาก Database จริงๆ เสมอ
                    // (ไม่ใช้ State ที่อาจค้างอยู่) เพื่อป้องกันพนักงาน 2 คนกดพร้อมกัน
                    // แล้วได้ ID เดียวกัน ทำให้บิลหายเมื่อ upsert ทับกัน
                    let dbMaxRun = 0;
                    try {
                        const dbSales = await supabaseSelect(
                            'stk_sales',
                            `order_id=like.${datePrefix}*&select=order_id&order=order_id.desc&limit=50`
                        );
                        if (Array.isArray(dbSales) && dbSales.length > 0) {
                            dbSales.forEach(s => {
                                const parts = String(s.order_id || '').split('-');
                                if (parts.length === 2) {
                                    const runNum = parseInt(parts[1], 10);
                                    if (!isNaN(runNum) && runNum > dbMaxRun) dbMaxRun = runNum;
                                }
                            });
                        }
                    } catch (err) {
                        // Fallback: ใช้ State ถ้า DB query ล้มเหลว
                        const prefixSales = (sales || []).filter(s => String(s.id).startsWith(datePrefix));
                        prefixSales.forEach(s => {
                            const parts = String(s.id).split('-');
                            if (parts.length === 2) {
                                const runNum = parseInt(parts[1], 10);
                                if (!isNaN(runNum) && runNum > dbMaxRun) dbMaxRun = runNum;
                            }
                        });
                        console.warn('⚠️ DB query for ID failed, using local state fallback:', err);
                    }
                    nextSaleIdStr = `${datePrefix}-${String(dbMaxRun + 1).padStart(3, '0')}`;

                    // 🛡️ DOUBLE-CHECK: ตรวจสอบซ้ำว่า ID ที่สร้างขึ้นยังไม่มีในฐานข้อมูล
                    // (ป้องกันกรณี 2 คนกดพร้อมกัน millisecond เดียวกัน)
                    let finalRun = dbMaxRun + 1;
                    let idCheckAttempts = 0;
                    while (idCheckAttempts < 5) {
                        try {
                            const existCheck = await supabaseSelect(
                                'stk_sales',
                                `order_id=eq.${datePrefix}-${String(finalRun).padStart(3, '0')}&select=order_id`
                            );
                            if (!Array.isArray(existCheck) || existCheck.length === 0) {
                                break; // ID นี้ยังไม่มีในระบบ ใช้ได้
                            }
                            // ID ซ้ำ — เพิ่มเลขและลองใหม่
                            finalRun++;
                        } catch (_) {
                            break; // ถ้า check ไม่ได้ก็ดำเนินการต่อด้วย ID ปัจจุบัน
                        }
                        idCheckAttempts++;
                    }
                    nextSaleIdStr = `${datePrefix}-${String(finalRun).padStart(3, '0')}`;

                } else {
                    nextSaleIdStr = editingSaleId;
                }

                const paymentSummaryParts = [];
                const cTHB = parseFloat(payCashTHB) || 0;
                const cLAK = parseFloat(payCashLAK) || 0;
                const tThaiTHB = parseFloat(payTransferThaiTHB) || 0;
                const tLaosTHB = parseFloat(payTransferLaosTHB) || 0;
                const tLaosLAK = parseFloat(payTransferLaosLAK) || 0;

                // 🚨 เพิ่มเงื่อนไขบังคับให้ต้องกรอกตัวเลข (ข้ามการเช็คถ้ายอดบิลเป็น 0)
                if (!isHistoryBypass && cartTotals.amount > 0) {
                    if (payMode === 'สด' && cTHB === 0 && cLAK === 0) {
                        showToast('กรุณาระบุจำนวนเงินในช่อง "รับเงินสด" (บาท หรือ กีบ)', 'error');
                        setIsSubmitting(false);
                        return;
                    }
                    if (payMode === 'โอน' && tThaiTHB === 0 && tLaosTHB === 0 && tLaosLAK === 0) {
                        showToast('กรุณาระบุจำนวนเงินในช่อง "รับเงินโอน"', 'error');
                        setIsSubmitting(false);
                        return;
                    }
                    if (payMode === 'สด+โอน' && (cTHB === 0 && cLAK === 0) && (tThaiTHB === 0 && tLaosTHB === 0 && tLaosLAK === 0)) {
                        showToast('กรุณาระบุจำนวนเงินที่รับชำระให้ครบถ้วน', 'error');
                        setIsSubmitting(false);
                        return;
                    }
                }

                if (payMode === 'สด' || payMode === 'สด+โอน') {
                    if (cTHB > 0) paymentSummaryParts.push(`สด:${cTHB}`);
                    if (cLAK > 0) paymentSummaryParts.push(`สดกีบ:${cLAK}`);
                }

                if (payMode === 'โอน' || payMode === 'สด+โอน') {
                    if (tThaiTHB > 0) paymentSummaryParts.push(`โอนไทย(${payTransferThaiBank}):${tThaiTHB}`);
                    if (tLaosTHB > 0) paymentSummaryParts.push(`โอนลาวบาท(${payTransferLaosBankTHB}):${tLaosTHB}`);
                    if (tLaosLAK > 0) paymentSummaryParts.push(`โอนลาวกีบ(${payTransferLaosBankLAK}):${tLaosLAK}`);
                }

                const paymentSummaryStr = paymentSummaryParts.length > 0 ? paymentSummaryParts.join(' | ') : `${payMode}`;
                const newRecord = {
                    customerName: (newCustomerObj ? newCustomerObj.name : custData.name || ''),
                    customerType: custMode || '',
                    id: nextSaleIdStr,
                    date: formData.date,
                    created_at: editingSaleId ? ((sales || []).find(s => s.id === editingSaleId)?.created_at || new Date().toISOString()) : new Date().toISOString(),
                    memberId: foundMember.id,
                    memberName: foundMember.name,
                    customerId: finalCustomerId,
                    recordedBy: currentUser ? (currentUser.name || currentUser.username || 'Admin') : 'ไม่ระบุ',
                    saleType: isHistoryBypass ? 'ยอดระบบเก่า (ไม่คิดเงิน)' : paymentSummaryStr,
                    totalAmount: isHistoryBypass ? 0 : cartTotals.amount,
                    paymentNote: paymentNote
                };

                let sumFull = 0, sumPro = 0, sumMember = 0, sumZero = 0;
                const allProductNamesToSave = [...new Set([
                    ...activeProductsList,
                    ...cart.map(item => item.productName)
                ])];

                if (editingSaleId) {
                    const oldRecord = (sales || []).find(s => s.id === editingSaleId);
                    if (oldRecord) {
                        Object.keys(oldRecord).forEach(k => {
                            if (k.endsWith('_ราคาเต็ม') || k.endsWith('_ราคาโปร') || k.endsWith('_ราคาสมาชิก') || k.endsWith('_ราคาศูนย์')) {
                                newRecord[k] = 0;
                            }
                        });
                    }
                }

                allProductNamesToSave.forEach(product => {
                    const fQty = cart.filter(item => item.productName === product && item.priceType === 'ราคาเต็ม').reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);
                    const pQty = cart.filter(item => item.productName === product && item.priceType === 'ราคาโปร').reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);
                    const mQty = cart.filter(item => item.productName === product && item.priceType === 'ราคาสมาชิก').reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);
                    const zQty = cart.filter(item => item.productName === product && item.priceType === 'ราคาศูนย์').reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);

                    if (fQty > 0 || newRecord[`${product}_ราคาเต็ม`] === 0) newRecord[`${product}_ราคาเต็ม`] = fQty;
                    if (pQty > 0 || newRecord[`${product}_ราคาโปร`] === 0) newRecord[`${product}_ราคาโปร`] = pQty;
                    if (mQty > 0 || newRecord[`${product}_ราคาสมาชิก`] === 0) newRecord[`${product}_ราคาสมาชิก`] = mQty;
                    if (zQty > 0 || newRecord[`${product}_ราคาศูนย์`] === 0) newRecord[`${product}_ราคาศูนย์`] = zQty;

                    sumFull += fQty; sumPro += pQty; sumMember += mQty; sumZero += zQty;
                });
                newRecord['รวมชิ้นราคาเต็ม'] = sumFull;
                newRecord['รวมชิ้นราคาโปร'] = sumPro;
                newRecord['รวมชิ้นราคาสมาชิก'] = sumMember;
                newRecord['รวมชิ้นราคาศูนย์'] = sumZero;
                newRecord['ยอดรวมชิ้นทั้งหมด'] = sumFull + sumPro + sumMember + sumZero;

                if (newRecord['ยอดรวมชิ้นทั้งหมด'] === 0) { showToast('กรุณาระบุจำนวนสินค้าที่จะเปิดบิลอย่างน้อย 1 ชิ้น', 'error'); return; }

                setIsSubmitting(true);
                try {

                    let pvChange = 0;
                    let oldPv = 0;
                    let newPv = calculateBillPV(cart, products);

                    if (editingSaleId) {
                        const oldRecord = (sales || []).find(s => s.id === editingSaleId);
                        if (oldRecord) {
                            const oldCart = [];
                            Object.keys(oldRecord).forEach(k => {
                                const qty = parseInt(oldRecord[k], 10) || 0;
                                if (qty > 0) {
                                    if (k.endsWith('_ราคาเต็ม') && k !== 'รวมชิ้นราคาเต็ม') oldCart.push({ productName: k.replace('_ราคาเต็ม', ''), priceType: 'ราคาเต็ม', qty });
                                    else if (k.endsWith('_ราคาสมาชิก') && k !== 'รวมชิ้นราคาสมาชิก') oldCart.push({ productName: k.replace('_ราคาสมาชิก', ''), priceType: 'ราคาสมาชิก', qty });
                                }
                            });
                            oldPv = calculateBillPV(oldCart, products);
                        }
                        pvChange = newPv - oldPv;
                    } else {
                        pvChange = newPv;
                    }

                    const clearAppCache = () => {
                        try {
                            localStorage.removeItem('stk_app_cache_data');
                            localStorage.removeItem('stk_app_cache_time');
                        } catch (e) { }
                        window.parent.postMessage('refresh_data', '*');
                    };

                    if (editingSaleId) {
                        newRecord.id = editingSaleId;
                        // 🔒 RACE CONDITION LOCK: Insert customer first and retry if ID collision occurs
                        if (newCustomerObj && typeof supabaseInsert === 'function') {
                            let success = false;
                            let retryCount = 0;
                            let currentCustId = newCustomerObj.id;
                            let custNum = parseInt(currentCustId.replace('C', ''), 10);

                            while (!success && retryCount < 10) {
                                const custPayload = {
                                    customer_id: currentCustId,
                                    name: newCustomerObj.name,
                                    phone: newCustomerObj.phone,
                                    line_id: newCustomerObj.lineId || '',
                                    customer_type: newCustomerObj.type,
                                    symptom_disease: newCustomerObj.symptom,
                                    owner_member_id: newCustomerObj.memberId,
                                    closer_id: newCustomerObj.closer,
                                    extra_details_json: { closerTeam: newCustomerObj.closerTeam, memberName: newCustomerObj.memberName },
                                    status: 'Active'
                                };

                                try {
                                    await supabaseInsert('stk_customers', custPayload);
                                    success = true;
                                    newCustomerObj.id = currentCustId;
                                    newRecord.customerId = currentCustId;
                                } catch (err) {
                                    const errMsg = String(err.message || '').toLowerCase();
                                    if (errMsg.includes('duplicate') || errMsg.includes('409') || errMsg.includes('already exists')) {
                                        custNum++;
                                        currentCustId = "C" + custNum.toString().padStart(3, '0');
                                        retryCount++;
                                    } else {
                                        console.error('Database customer insert failed:', err);
                                        break;
                                    }
                                }
                            }
                        }

                        const supaSalesData = {
                            order_id: newRecord.id,
                            date: newRecord.date,
                            seller_id: newRecord.memberId,
                            customer_id: newRecord.customerId,
                            sale_type: newRecord.saleType,
                            total_amount: newRecord.totalAmount,
                            total_bottles: cart.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0),
                            status: 'Completed',
                            recorded_by: newRecord.recordedBy,
                            items_json: cart.map(item => {
                                const prodObj = (products || []).find(p => p.name === item.productName) || {};
                                return {
                                    qty: item.qty,
                                    prod: item.productName,
                                    type: item.priceType,
                                    id: prodObj.id || prodObj.product_id || ''
                                };
                            }),
                            payment_note: newRecord.paymentNote || newRecord.payment_note || ''
                        };

                        if (typeof supabaseUpsert === 'function') {
                            try {
                                await supabaseUpsert('stk_sales', supaSalesData);
                            } catch (e1) {
                                console.warn('stk_sales upsert with payment_note failed, trying without payment_note:', e1);
                                const fallbackData = { ...supaSalesData };
                                delete fallbackData.payment_note;
                                await supabaseUpsert('stk_sales', fallbackData).catch(e2 => console.error('stk_sales fallback upsert failed:', e2));
                            }
                        }
                        const oldQtyMap = {};
                        const oldRecord = (sales || []).find(s => s.id === editingSaleId);
                        if (oldRecord) {
                            Object.keys(oldRecord).forEach(k => {
                                if ((k.endsWith('_ราคาเต็ม') || k.endsWith('_ราคาโปร') || k.endsWith('_ราคาสมาชิก') || k.endsWith('_ราคาศูนย์')) && !k.startsWith('รวมชิ้น')) {
                                    const pName = k.replace(/_ราคาเต็ม$|_ราคาโปร$|_ราคาสมาชิก$|_ราคาศูนย์$/, '');
                                    const p = (products || []).find(prod => prod.name === pName);
                                    if (p) {
                                        const qty = parseInt(oldRecord[k], 10) || 0;
                                        if (p.isBundle || p.is_bundle) {
                                            const baseP = (products || []).find(bp => bp.name === (p.baseProduct || p.base_product));
                                            if (baseP) {
                                                const totalToReturn = qty * (parseInt(p.bundleQty || p.bundle_qty) || 1);
                                                oldQtyMap[baseP.id] = (oldQtyMap[baseP.id] || 0) + totalToReturn;
                                            }
                                        } else {
                                            oldQtyMap[p.id] = (oldQtyMap[p.id] || 0) + qty;
                                        }
                                    }
                                }
                            });
                        }

                        // ⚡ FIX: ดึงค่าสต็อกล่าสุดแบบ Real-time เพื่อป้องกันสต็อกกลายเป็น 0 รวดเดียวเวลาเปิดบิลติดกัน
                        if (!isHistoryBypass && typeof supabaseUpdate === 'function') {
                            for (const pid of [...new Set([...Object.keys(oldQtyMap), ...Object.keys(qtyMap)])]) {
                                const diff = (qtyMap[pid] || 0) - (oldQtyMap[pid] || 0);
                                if (diff !== 0) {
                                    let currentStockNum = 0;
                                    try {
                                        // Query DB สดๆ ก่อนหักสต็อก เพื่อความชัวร์ 100%
                                        const latestP = await supabaseSelect('stk_products', `product_id=eq.${pid}&select=current_stock`);
                                        if (latestP && latestP.length > 0) {
                                            currentStockNum = parseInt(latestP[0].current_stock || 0) || 0;
                                        } else {
                                            const localP = (products || []).find(p => p.id === pid);
                                            currentStockNum = localP ? parseInt(localP.stock || 0) : 0;
                                        }
                                    } catch (err) {
                                        const localP = (products || []).find(p => p.id === pid);
                                        currentStockNum = localP ? parseInt(localP.stock || 0) : 0;
                                    }

                                    const newStock = Math.max(0, currentStockNum - diff);
                                    await supabaseUpdate('stk_products', pid, { current_stock: newStock }, 'product_id').catch(() => { });
                                    await supabaseUpdate('products', pid, { stock: newStock }).catch(() => { });

                                    if (typeof supabaseInsert === 'function') {
                                        await supabaseInsert('stk_stock_movements', {
                                            movement_id: 'MOV-EDIT-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
                                            date: newRecord.date,
                                            product_id: pid,
                                            type: diff > 0 ? 'OUT' : 'IN',
                                            sub_type: diff > 0 ? 'แก้ไขบิล (ตัดสต๊อกเพิ่ม)' : 'แก้ไขบิล (คืนสต๊อก)',
                                            quantity: Math.abs(diff),
                                            notes: 'อัปเดตจากการแก้ไขบิล ' + newRecord.id,
                                            created_by: currentUser ? (currentUser.name || currentUser.username) : 'SYSTEM'
                                        }).catch(e => console.warn('Edit stock movement log error:', e));
                                    }
                                }
                            }
                        }

                        if (!isHistoryBypass && setProducts) {
                            setProducts(prev => prev.map(p => {
                                const diff = (qtyMap[p.id] || 0) - (oldQtyMap[p.id] || 0);
                                return diff !== 0 ? { ...p, stock: Math.max(0, p.stock - diff) } : p;
                            }));
                        }

                        setSales(prev => prev.map(s => s.id === editingSaleId ? newRecord : s));
                        if (newCustomerObj) {
                            setCustomers(prev => {
                                const pr = prev || [];
                                const exists = pr.find(c => c.id === newCustomerObj.id);
                                if (exists) return pr.map(c => c.id === newCustomerObj.id ? newCustomerObj : c);
                                return [newCustomerObj, ...pr];
                            });
                        }
                        if (foundMember && foundMember.id && pvChange !== 0) await updateMemberPVInSupabase(foundMember.id, pvChange, 'user_id');
                        clearAppCache();
                        handleCancelEdit();
                        setSuccessModal({ show: true, saleRecord: newRecord });
                        setIsSubmitting(false);
                        return;
                    }
                    const supaSalesData = {
                        order_id: newRecord.id,
                        date: newRecord.date,
                        seller_id: newRecord.memberId,
                        customer_id: newRecord.customerId,
                        sale_type: newRecord.saleType,
                        total_amount: newRecord.totalAmount,
                        total_bottles: cart.reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0),
                        status: 'Completed',
                        recorded_by: newRecord.recordedBy,
                        items_json: cart.map(item => {
                            const prodObj = (products || []).find(p => p.name === item.productName) || {};
                            return {
                                qty: item.qty,
                                prod: item.productName,
                                type: item.priceType,
                                id: prodObj.id || prodObj.product_id || ''
                            };
                        }),
                        payment_note: newRecord.paymentNote || newRecord.payment_note || ''
                    };

                    let saleInsertSuccess = false;
                    let saleRetryCount = 0;
                    let currentSaleId = newRecord.id;

                    while (!saleInsertSuccess && saleRetryCount < 5) {
                        supaSalesData.order_id = currentSaleId;
                        try {
                            await supabaseInsert('stk_sales', supaSalesData);
                            saleInsertSuccess = true;
                            newRecord.id = currentSaleId;
                        } catch (e1) {
                            const errMsg = String(e1.message || '').toLowerCase();
                            if (errMsg.includes('duplicate') || errMsg.includes('409') || errMsg.includes('already exists')) {
                                const parts = currentSaleId.split('-');
                                if (parts.length === 2) {
                                    currentSaleId = `${parts[0]}-${String(parseInt(parts[1], 10) + 1).padStart(3, '0')}`;
                                } else { break; }
                                saleRetryCount++;
                            } else {
                                const fallbackData = { ...supaSalesData };
                                delete fallbackData.payment_note;
                                try {
                                    await supabaseInsert('stk_sales', fallbackData);
                                    saleInsertSuccess = true;
                                    newRecord.id = currentSaleId;
                                } catch (e2) {
                                    const e2Msg = String(e2.message || '').toLowerCase();
                                    if (e2Msg.includes('duplicate') || e2Msg.includes('409') || e2Msg.includes('already exists')) {
                                        const parts = currentSaleId.split('-');
                                        if (parts.length === 2) {
                                            currentSaleId = `${parts[0]}-${String(parseInt(parts[1], 10) + 1).padStart(3, '0')}`;
                                        } else { break; }
                                        saleRetryCount++;
                                    } else {
                                        throw e2;
                                    }
                                }
                            }
                        }
                    }

                    if (!saleInsertSuccess) throw new Error("รหัสบิลชนกันหลายครั้ง ระบบไม่สามารถบันทึกได้ กรุณากดบันทึกใหม่อีกครั้ง");

                    if (newCustomerObj) {
                        let custInsertSuccess = false;
                        let custRetryCount = 0;
                        let currentCustId = newCustomerObj.id;
                        let custNum = parseInt(currentCustId.replace('C', ''), 10);

                        while (!custInsertSuccess && custRetryCount < 10) {
                            const custPayload = {
                                customer_id: currentCustId,
                                name: newCustomerObj.name,
                                phone: newCustomerObj.phone,
                                line_id: newCustomerObj.lineId || '',
                                customer_type: newCustomerObj.type,
                                symptom_disease: newCustomerObj.symptom,
                                owner_member_id: newCustomerObj.memberId,
                                closer_id: newCustomerObj.closer,
                                extra_details_json: { closerTeam: newCustomerObj.closerTeam, memberName: newCustomerObj.memberName },
                                status: 'Active'
                            };
                            try {
                                await supabaseInsert('stk_customers', custPayload);
                                custInsertSuccess = true;
                                newCustomerObj.id = currentCustId;
                                newRecord.customerId = currentCustId;
                            } catch (err) {
                                const errMsg = String(err.message || '').toLowerCase();
                                if (errMsg.includes('duplicate') || errMsg.includes('409') || errMsg.includes('already exists')) {
                                    if (currentCustId.match(/^C\d+$/i)) {
                                        custNum++;
                                        currentCustId = "C" + custNum.toString().padStart(3, '0');
                                        custRetryCount++;
                                    } else {
                                        // เป็นลูกค้าจาก Clinic (เช่น รหัส HN) ที่เคยมีประวัติบันทึกใน stk_customers แล้ว
                                        // ให้ถือว่าสำเร็จและใช้รหัสเดิมได้เลย
                                        custInsertSuccess = true;
                                        newCustomerObj.id = currentCustId;
                                        newRecord.customerId = currentCustId;
                                        break;
                                    }
                                } else {
                                    const fallbackCust = { ...custPayload };
                                    delete fallbackCust.extra_details_json;
                                    try {
                                        await supabaseInsert('stk_customers', fallbackCust);
                                        custInsertSuccess = true;
                                        newCustomerObj.id = currentCustId;
                                        newRecord.customerId = currentCustId;
                                    } catch (e2) {
                                        const e2Msg = String(e2.message || '').toLowerCase();
                                        if (e2Msg.includes('duplicate') || e2Msg.includes('409') || e2Msg.includes('already exists')) {
                                            if (currentCustId.match(/^C\d+$/i)) {
                                                custNum++;
                                                currentCustId = "C" + custNum.toString().padStart(3, '0');
                                                custRetryCount++;
                                            } else {
                                                custInsertSuccess = true;
                                                newCustomerObj.id = currentCustId;
                                                newRecord.customerId = currentCustId;
                                                break;
                                            }
                                        } else {
                                            throw e2;
                                        }
                                    }
                                }
                            }
                        }
                        if (!custInsertSuccess) throw new Error("รหัสลูกค้าชนกันหลายครั้ง ระบบไม่สามารถบันทึกได้ กรุณากดบันทึกใหม่อีกครั้ง");
                    }

                    // ⚡ FIX: ตัดสต็อกเปิดบิลใหม่ ดึงค่าสดจากฐานข้อมูลเช่นกัน
                    if (!isHistoryBypass) {
                        for (const pid of Object.keys(qtyMap)) {
                            const deductQty = qtyMap[pid];
                            if (deductQty > 0) {
                                let currentStockNum = 0;
                                try {
                                    const latestP = await supabaseSelect('stk_products', `product_id=eq.${pid}&select=current_stock`);
                                    if (latestP && latestP.length > 0) {
                                        currentStockNum = parseInt(latestP[0].current_stock || 0) || 0;
                                    } else {
                                        const localP = (products || []).find(p => p.id === pid);
                                        currentStockNum = localP ? parseInt(localP.stock || 0) : 0;
                                    }
                                } catch (err) {
                                    const localP = (products || []).find(p => p.id === pid);
                                    currentStockNum = localP ? parseInt(localP.stock || 0) : 0;
                                }

                                const newStock = Math.max(0, currentStockNum - deductQty);

                                if (typeof supabaseUpdate === 'function') {
                                    await supabaseUpdate('stk_products', pid, { current_stock: newStock }, 'product_id').catch(() => { });
                                    await supabaseUpdate('products', pid, { stock: newStock }).catch(() => { });
                                }
                                if (typeof supabaseInsert === 'function') {
                                    await supabaseInsert('stk_stock_movements', {
                                        movement_id: 'MOV-OUT-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
                                        date: newRecord.date,
                                        product_id: pid,
                                        type: 'OUT',
                                        sub_type: 'ตัดสต๊อกขาย',
                                        quantity: deductQty,
                                        notes: 'ตัดสต๊อกบิล ' + newRecord.id,
                                        created_by: newRecord.recordedBy || 'SYSTEM'
                                    }).catch(e => console.warn('Stock movement log error:', e));
                                }
                            }
                        }
                    }
                    if (foundMember && foundMember.id && pvChange !== 0) await updateMemberPVInSupabase(foundMember.id, pvChange, 'user_id');

                    if (!isHistoryBypass && setProducts) {
                        setProducts(prev => prev.map(p => {
                            const deduct = qtyMap[p.id] || 0;
                            return deduct > 0 ? { ...p, stock: Math.max(0, p.stock - deduct) } : p;
                        }));
                    }

                    setSales(prev => [newRecord, ...(prev || [])]);
                    if (newCustomerObj) setCustomers(prev => [newCustomerObj, ...(prev || [])]);
                    clearAppCache();
                    setIsSubmitting(false);  // <---- แทรกบรรทัดนี้ลงไป
                    handleSuccessFinish(newRecord);
                } catch (err) {
                    console.error("Save Error:", err);
                    showToast('เกิดข้อผิดพลาดในการบันทึก: ' + (err.message || err), 'error');
                    setIsSubmitting(false);
                }
            };


            const filteredSalesHistory = useMemo(() => {
                let result = (sales || []);

                result = result.sort((a, b) => {
                    const idA = String(a.id || '');
                    const idB = String(b.id || '');
                    return idB.localeCompare(idA);
                });

                if (historyStartDate) result = result.filter(s => formatDbDateForFilter(s.date) >= historyStartDate);
                if (historyEndDate) result = result.filter(s => formatDbDateForFilter(s.date) <= historyEndDate);

                if (salesSearchTerm.trim() !== '') {
                    const st = salesSearchTerm.toLowerCase();
                    result = result.filter(s => {
                        const sCustId = s.customerId ? s.customerId.toLowerCase() : '';
                        const sMemId = s.memberId ? s.memberId.toLowerCase() : '';
                        const sMemName = s.memberName ? s.memberName.toLowerCase() : '';
                        const sIdStr = s.id ? s.id.toString() : '';
                        return sCustId.includes(st) || sMemId.includes(st) || sMemName.includes(st) || sIdStr.includes(st);
                    });
                }

                if (saleTab !== 'B2M') {
                    result = [];
                }

                return result;
            }, [sales, historyStartDate, historyEndDate, salesSearchTerm, saleTab]);

            const totalSalesPages = Math.max(1, Math.ceil(filteredSalesHistory.length / SALES_PER_PAGE));
            const paginatedSalesHistory = useMemo(() => {
                return filteredSalesHistory.slice((salesPage - 1) * SALES_PER_PAGE, salesPage * SALES_PER_PAGE);
            }, [filteredSalesHistory, salesPage]);

            useEffect(() => { setSalesPage(1); }, [historyStartDate, historyEndDate, salesSearchTerm, saleTab]);

            const tableTotals = useMemo(() => {
                let totalFull = 0, totalMember = 0, totalPro = 0, totalZero = 0, grandTotal = 0, totalAmountTHB = 0;
                filteredSalesHistory.forEach(s => {
                    let rowF = 0, rowM = 0, rowP = 0, rowZ = 0;
                    Object.keys(s).forEach(key => {
                        const qty = parseInt(s[key]) || 0;
                        if (qty > 0) {
                            if (key.endsWith('_ราคาเต็ม') && key !== 'รวมชิ้นราคาเต็ม') rowF += qty;
                            else if (key.endsWith('_ราคาสมาชิก') && key !== 'รวมชิ้นราคาสมาชิก') rowM += qty;
                            else if (key.endsWith('_ราคาโปร') && key !== 'รวมชิ้นราคาโปร') rowP += qty;
                            else if (key.endsWith('_ราคาศูนย์') && key !== 'รวมชิ้นราคาศูนย์') rowZ += qty;
                        }
                    });

                    totalFull += rowF;
                    totalMember += rowM;
                    totalPro += rowP;
                    totalZero += rowZ;
                    grandTotal += (rowF + rowM + rowP + rowZ);
                    totalAmountTHB += parseFloat(s.totalAmount || 0);
                });
                return { totalFull, totalMember, totalPro, totalZero, grandTotal, totalAmountTHB, count: filteredSalesHistory.length };
            }, [filteredSalesHistory]);

            const renderRecordCells = (record) => {
                let fullItems = []; let memberItems = []; let proItems = []; let zeroItems = [];
                Object.keys(record).forEach(key => {
                    const qty = parseInt(record[key]) || 0;
                    if (qty > 0) {
                        const cleanProdName = (raw) => raw.replace(/\(.*?\)/g, '').trim();
                        if (key.endsWith('_ราคาเต็ม') && key !== 'รวมชิ้นราคาเต็ม') fullItems.push({ name: cleanProdName(key.replace('_ราคาเต็ม', '')), qty });
                        else if (key.endsWith('_ราคาสมาชิก') && key !== 'รวมชิ้นราคาสมาชิก') memberItems.push({ name: cleanProdName(key.replace('_ราคาสมาชิก', '')), qty });
                        else if (key.endsWith('_ราคาโปร') && key !== 'รวมชิ้นราคาโปร') proItems.push({ name: cleanProdName(key.replace('_ราคาโปร', '')), qty });
                        else if (key.endsWith('_ราคาศูนย์') && key !== 'รวมชิ้นราคาศูนย์') zeroItems.push({ name: cleanProdName(key.replace('_ราคาศูนย์', '')), qty });
                    }
                });

                const totalQtyInRow = [...fullItems, ...memberItems, ...proItems, ...zeroItems].reduce((sum, item) => sum + item.qty, 0);

                const renderList = (items, textClass) => {
                    if (items.length === 0) return <span className="text-slate-300 text-xs">-</span>;
                    return (
                        <div className="flex flex-col gap-1 w-full">
                            {items.map((it, i) => (
                                <div key={i} className="flex justify-between items-center text-[11px] bg-white px-2 py-1 rounded shadow-sm border border-slate-100">
                                    <span className="font-bold text-slate-700 truncate mr-2" title={it.name}>{it.name}</span>
                                    <span className={`font-black ${textClass}`}>x{it.qty}</span>
                                </div>
                            ))}
                        </div>
                    )
                }

                return (
                    <React.Fragment>
                        <td className={`${tableCellClass} bg-green-50/30 border-l border-slate-100 align-top`}>{renderList(fullItems, 'text-green-600')}</td>
                        <td className={`${tableCellClass} bg-purple-50/30 border-l border-slate-100 align-top`}>{renderList(memberItems, 'text-purple-600')}</td>
                        <td className={`${tableCellClass} bg-orange-50/30 border-l border-slate-100 align-top`}>{renderList(proItems, 'text-orange-600')}</td>
                        <td className={`${tableCellClass} bg-slate-50/50 border-l border-slate-100 align-top`}>{renderList(zeroItems, 'text-slate-600')}</td>
                        <td className="p-4 align-middle text-center border-l border-blue-200 bg-blue-50/50 w-[180px]">
                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">รวมทั้งหมด</div>
                            <div className="font-black text-4xl text-blue-700 drop-shadow-sm leading-none">
                                {totalQtyInRow} <span className="text-[14px] font-bold text-blue-500">ชิ้น</span>
                            </div>
                            <div className="text-[12px] font-black text-emerald-700 mt-2 bg-white py-1.5 px-2 rounded-lg border border-emerald-200 shadow-sm">
                                มูลค่า: ฿{parseFloat(record.totalAmount || 0).toLocaleString(undefined, { minimumFractionDigits: 2 })}
                            </div>
                        </td>
                    </React.Fragment>
                )
            };

            const renderSalesForm = () => (
                <div className="flex flex-col xl:flex-row gap-4 w-full xl:h-[calc(100vh-120px)] xl:min-h-[650px] mb-0 relative">

                    {/* LEFT COLUMN (50%): Customer + Payment */}
                    <div className="w-full xl:w-1/2 flex flex-col gap-3 xl:h-full relative">

                        {/* Customer Box */}
                        <div className="bg-white border border-slate-200 rounded-2xl p-3 shadow-sm w-full shrink-0">
                            <div
                                onClick={() => setIsCustomerExpanded(!isCustomerExpanded)}
                                className="flex items-center justify-between cursor-pointer border-b border-slate-100 pb-1.5 hover:opacity-80 transition-opacity"
                            >
                                <div className="flex items-center gap-1.5">
                                    <UserCircle size={16} className="text-blue-600 shrink-0" />
                                    <h4 className="font-extrabold text-[13px] text-slate-800">ข้อมูลผู้ขาย &amp; ลูกค้า</h4>
                                </div>
                                <div className="flex items-center gap-2">
                                    {!isCustomerExpanded && foundMember && (
                                        <span className="text-[10px] font-black text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-100 max-w-[150px] truncate">
                                            👤 {foundMember.name} {custData.name ? ` | ${custData.name}` : ''}
                                        </span>
                                    )}
                                    <span className="text-slate-400 bg-slate-50 p-1 rounded-lg border border-slate-100">
                                        <ChevronDown size={14} className={`transform transition-transform duration-300 ${isCustomerExpanded ? 'rotate-180' : ''}`} />
                                    </span>
                                </div>
                            </div>

                            {isCustomerExpanded && (
                                <div className="space-y-1.5 transition-all mt-2 w-full">
                                    <div className="flex gap-2">
                                        <div className="flex-1 bg-slate-50 p-1.5 rounded-lg border border-slate-100">
                                            <label className="block text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">วันที่บิล</label>
                                            <input type="date" required className="w-full bg-white border border-slate-200 rounded-md text-[11px] py-1.5 px-2 outline-none focus:border-blue-500 shadow-sm" value={formData.date} onChange={e => setFormData({ ...formData, date: e.target.value })} />
                                        </div>
                                        <div className="flex-[2] relative bg-slate-50 p-1.5 rounded-lg border border-slate-100">
                                            <label className="block text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">ผู้ขาย (เจ้าของเคส) *</label>
                                            <AutoSuggestInput value={memberIdInput} onChange={setMemberIdInput} onSelect={setMemberIdInput} data={membersSuggestList} placeholder="พิมพ์ค้นหารหัส หรือชื่อพนักงาน" required={true} />
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <div className="flex-[1.5] bg-slate-50 p-1.5 rounded-lg border border-slate-100">
                                            <label className="block text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">ประเภทลูกค้า</label>
                                            <select className="w-full bg-white border border-slate-200 rounded-md text-[11px] py-1.5 px-2 outline-none focus:border-blue-500 shadow-sm" value={custMode} onChange={(e) => {
                                                const newMode = e.target.value;
                                                setCustMode(newMode);
                                                const isOld = newMode.includes('เก่า');
                                                if (isOld) {
                                                    setCustData(prev => ({ ...prev, id: '', name: '', phone: '', lineId: '', symptom: '', closer: '', closerTeam: '' }));
                                                } else {
                                                    // สั่งดึงรหัสลูกค้าที่ว่างอยู่แบบ Real-time ทันทีที่เลือกเป็นลูกค้าใหม่
                                                    fetchNextAvailableCustId();
                                                    setCustData(prev => ({ ...prev, name: '', phone: '', lineId: '', symptom: '', closer: '', closerTeam: '' }));
                                                }
                                            }}>
                                                <option value="" disabled>ระบุประเภท</option>
                                                {activeCustomerTypes.map(t => <option key={t.id} value={t.name}>{t.name}</option>)}
                                            </select>
                                        </div>
                                        <div className="flex-[1.5] bg-slate-50 p-1.5 rounded-lg border border-slate-100">
                                            <label className="block text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">{isOldCustomerMode ? 'ลูกค้าเก่า *' : 'รหัสลูกค้า'}</label>
                                            {isOldCustomerMode ? (
                                                <AutoSuggestInput value={custData.id} onChange={handleOldCustomerChange} onSelect={handleOldCustomerChange} data={customersSuggestList} placeholder="รหัส/เบอร์โทร..." required={true} />
                                            ) : (
                                                <input
                                                    type="text"
                                                    className="w-full bg-slate-50 border border-slate-200 rounded-md text-[11px] py-1.5 px-2 font-bold text-blue-700 outline-none focus:border-blue-500 shadow-sm"
                                                    value={custData.id}
                                                    onChange={e => setCustData({ ...custData, id: e.target.value })}
                                                    placeholder="เลือกระบุประเภทลูกค้า..."
                                                    disabled={custData.id === 'กำลังคำนวณรหัส...'}
                                                />
                                            )}
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <div className="flex-1 bg-slate-50 p-1.5 rounded-lg border border-slate-100">
                                            <label className="block text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">ทีมผู้ปิด</label>
                                            <select required className="w-full bg-white border border-slate-200 rounded-md text-[11px] py-1.5 px-2 outline-none focus:border-blue-500 shadow-sm" value={custData.closerTeam} onChange={(e) => setCustData({ ...custData, closerTeam: e.target.value, closer: '' })}>
                                                <option value="">- เลือกทีมผู้ปิด -</option>
                                                <option value="Center">Center (ทีมผู้เชี่ยวชาญปิดการขาย)</option>
                                                <option value="Marketing">Marketing (ฝ่ายการตลาด - รวมทุกสังกัดย่อย)</option>
                                                {(businessTeams || []).map(t => {
                                                    const tName = t.name || t.team_name || t.id || t.team_id;
                                                    if (!tName || tName === 'Center' || tName === 'Marketing') return null;
                                                    return <option key={t.id || t.team_id} value={tName}>{tName}</option>;
                                                })}
                                            </select>
                                        </div>
                                        <div className="flex-[2] bg-slate-50 p-1.5 rounded-lg border border-slate-100">
                                            <label className="block text-[9px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">ผู้ปิดการขาย *</label>
                                            <AutoSuggestInput value={custData.closer} onChange={(val) => setCustData({ ...custData, closer: val })} onSelect={(val) => setCustData({ ...custData, closer: val })} data={closersSuggestList} placeholder="พิมพ์ค้นหารหัส หรือชื่อผู้ปิด..." required={true} />
                                        </div>
                                    </div>

                                    <div className="flex gap-2 border-t border-slate-100 pt-1.5 mt-1.5">
                                        <div className="flex-[2]">
                                            <input type="text" required={!isOldCustomerMode} disabled={isOldCustomerMode} placeholder="ชื่อ-นามสกุลลูกค้า" className="w-full bg-white border border-slate-200 rounded-md text-[11px] py-1.5 px-2 outline-none focus:border-blue-500 shadow-sm" value={custData.name} onChange={e => setCustData({ ...custData, name: e.target.value })} />
                                        </div>
                                        <div className="flex-1">
                                            <input type="text" disabled={isOldCustomerMode} placeholder="เบอร์โทรศัพท์" className="w-full bg-white border border-slate-200 rounded-md text-[11px] py-1.5 px-2 outline-none focus:border-blue-500 shadow-sm" value={custData.phone || ''} onChange={e => setCustData({ ...custData, phone: e.target.value })} />
                                        </div>
                                    </div>

                                    <div className="flex gap-2">
                                        <div className="flex-1">
                                            <input type="text" disabled={isOldCustomerMode} placeholder="LINE ID" className="w-full bg-white border border-slate-200 rounded-md text-[11px] py-1.5 px-2 outline-none focus:border-blue-500 shadow-sm" value={custData.lineId || ''} onChange={e => setCustData({ ...custData, lineId: e.target.value })} />
                                        </div>
                                        <div className="flex-[2]">
                                            <input type="text" disabled={isOldCustomerMode} placeholder="โรคประจำตัว/อาการ..." className="w-full bg-white border border-slate-200 rounded-md text-[11px] py-1.5 px-2 outline-none focus:border-blue-500 shadow-sm" value={custData.symptom || ''} onChange={e => setCustData({ ...custData, symptom: e.target.value })} />
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Payment Box */}
                        <div className="bg-white border border-slate-200 rounded-2xl p-3 shadow-lg shrink-0 flex flex-col xl:mt-auto z-20 w-full">
                            <div className="flex flex-col bg-slate-50 border border-slate-200 rounded-lg p-2 shadow-sm gap-1 mb-1.5">
                                <div className="flex justify-between items-center text-[10px] text-slate-500 font-bold border-b border-slate-200 pb-1">
                                    <span>รวมราคาปกติ:</span>
                                    <span>฿{cartTotals.baseAmount.toLocaleString()}</span>
                                </div>
                                {cartTotals.discount > 0 && (
                                    <div className="flex justify-between items-center text-[10px] text-red-500 font-bold border-b border-slate-200 pb-1">
                                        <span>ส่วนลดทั้งหมด:</span>
                                        <span>- ฿{cartTotals.discount.toLocaleString()}</span>
                                    </div>
                                )}
                                <div className="flex justify-between items-end pt-0.5">
                                    <div className="flex flex-col">
                                        <span className="text-[9px] font-black text-slate-500 uppercase tracking-wider">ยอดสุทธิ (Net Total)</span>
                                        <span className="text-[10px] font-bold text-amber-500">{(cartTotals.amount * exchangeRate).toLocaleString()} ₭</span>
                                    </div>
                                    <span className="text-2xl font-black text-blue-700 leading-none">฿{cartTotals.amount.toLocaleString()}</span>
                                </div>
                            </div>

                            {saleTab === 'OLD_SYSTEM' ? (
                                <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-center mb-1.5 shadow-sm">
                                    <p className="text-amber-800 font-extrabold text-[12px] flex items-center justify-center gap-1">📦 โหมดป้อนยอดระบบเก่า</p>
                                    <p className="text-amber-700 text-[10px] mt-1 font-bold">บิลนี้จะไม่หักสต๊อกสินค้า และไม่นำยอดเงินสะสมเข้าคำนวณในรายงาน แต้ม PV ทั้งหมดจะเพิ่มให้สมาชิกสะสมโดยตรง</p>
                                </div>
                            ) : (
                                <React.Fragment>
                                    <div className="grid grid-cols-3 gap-1.5 mb-1.5">
                                        {['สด', 'โอน', 'สด+โอน'].map(mode => (
                                            <button key={mode} type="button" onClick={() => setPayMode(mode)}
                                                className={`py-1.5 px-1 rounded-md text-[11px] font-black border transition-all shadow-sm ${payMode === mode ? 'bg-blue-600 border-blue-500 text-white' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-100 hover:text-slate-800'}`}
                                            >{mode === 'สด' ? '💵 สด' : mode === 'โอน' ? '📱 โอน' : '💵+📱 สด+โอน'}</button>
                                        ))}
                                    </div>

                                    {(payMode === 'สด' || payMode === 'สด+โอน') && (
                                        <div className="bg-green-50/50 p-2 rounded-lg border border-green-200 space-y-1 mb-1.5">
                                            <label className="text-[9px] font-black text-green-700 flex items-center gap-1"><Coins size={10} /> รับเงินสด (บาท/กีบ)</label>
                                            <div className="flex gap-2">
                                                <div className="flex-1 relative">
                                                    <span className="absolute left-2.5 top-1 text-[10px] text-slate-400 font-bold">฿</span>
                                                    <input type="text" inputMode="decimal" placeholder="บาท" className="w-full pl-6 pr-1 py-1 rounded-md border border-green-300 bg-white text-slate-800 text-[11px] font-bold outline-none focus:border-green-500 shadow-sm" value={formatDisplayNumber(payCashTHB)} onChange={handleNumberInput(setPayCashTHB)} />
                                                </div>
                                                <div className="flex-1 relative">
                                                    <span className="absolute left-2.5 top-1 text-[10px] text-slate-400 font-bold">₭</span>
                                                    <input type="text" inputMode="decimal" placeholder="กีบ" className="w-full pl-6 pr-1 py-1 rounded-md border border-green-300 bg-white text-slate-800 text-[11px] font-bold outline-none focus:border-green-500 shadow-sm" value={formatDisplayNumber(payCashLAK)} onChange={handleNumberInput(setPayCashLAK)} />
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {(payMode === 'โอน' || payMode === 'สด+โอน') && (
                                        <div className="bg-blue-50/50 p-2 rounded-lg border border-blue-200 flex flex-col gap-1.5 mb-1.5">
                                            <label className="text-[9px] font-black text-blue-700 flex items-center gap-1"><Activity size={10} /> รับเงินโอน</label>
                                            <div className="flex flex-col gap-1">
                                                <div className="flex gap-1.5">
                                                    <span className="bg-amber-100 text-amber-800 text-[9px] font-bold px-1 py-1 rounded-md border border-amber-200 shrink-0 w-10 text-center flex items-center justify-center">ลาว</span>
                                                    <select className="w-[75px] rounded-md border border-amber-300 bg-white text-slate-700 text-[9px] font-bold px-1 outline-none focus:border-amber-500 shadow-sm" value={payTransferLaosBankLAK} onChange={e => setPayTransferLaosBankLAK(e.target.value)}>
                                                        <option value="BCEL">BCEL</option>
                                                        <option value="JDB">JDB</option>
                                                        <option value="LDB">LDB</option>
                                                    </select>
                                                    <div className="flex-1 relative">
                                                        <span className="absolute left-2.5 top-1 text-[9px] text-slate-400 font-bold">₭</span>
                                                        <input type="text" inputMode="decimal" placeholder="กีบ" className="w-full pl-6 pr-1 py-1 rounded-md border border-amber-300 bg-white text-slate-800 text-[11px] font-bold outline-none focus:border-amber-500 shadow-sm" value={formatDisplayNumber(payTransferLaosLAK)} onChange={handleNumberInput(setPayTransferLaosLAK)} />
                                                    </div>
                                                </div>
                                                <div className="flex gap-1.5">
                                                    <span className="bg-indigo-100 text-indigo-800 text-[9px] font-bold px-1 py-1 rounded-md border border-indigo-200 shrink-0 w-10 text-center flex items-center justify-center">ลาว</span>
                                                    <select className="w-[75px] rounded-md border border-indigo-300 bg-white text-slate-700 text-[9px] font-bold px-1 outline-none focus:border-indigo-500 shadow-sm" value={payTransferLaosBankTHB} onChange={e => setPayTransferLaosBankTHB(e.target.value)}>
                                                        <option value="BCEL">BCEL</option>
                                                        <option value="JDB">JDB</option>
                                                        <option value="LDB">LDB</option>
                                                    </select>
                                                    <div className="flex-1 relative">
                                                        <span className="absolute left-2.5 top-1 text-[9px] text-slate-400 font-bold">฿</span>
                                                        <input type="text" inputMode="decimal" placeholder="บาท" className="w-full pl-6 pr-1 py-1 rounded-md border border-indigo-300 bg-white text-slate-800 text-[11px] font-bold outline-none focus:border-indigo-500 shadow-sm" value={formatDisplayNumber(payTransferLaosTHB)} onChange={handleNumberInput(setPayTransferLaosTHB)} />
                                                    </div>
                                                </div>
                                                <div className="flex gap-1.5">
                                                    <span className="bg-blue-100 text-blue-800 text-[9px] font-bold px-1 py-1 rounded-md border border-blue-200 shrink-0 w-10 text-center flex items-center justify-center">ไทย</span>
                                                    <select className="w-[75px] rounded-md border border-blue-300 bg-white text-slate-700 text-[9px] font-bold px-1 outline-none focus:border-blue-500 shadow-sm" value={payTransferThaiBank} onChange={e => setPayTransferThaiBank(e.target.value)}>
