    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef, useCallback } = React;
        // 🛡️ GLOBAL ICONS DESTRUCTURING: ปลอดภัยจากตัวแปรซ้ำซ้อน และดึงโมดูลและคอมโพเนนต์มาครบถ้วน
        const { LayoutDashboard, ShoppingCart, Users, Contact, Headset, BarChart3, Plus, Edit, Trash2, UserCircle, Menu, X, Save, Info, PackageIcon, Package, Target, Trophy, Activity, Eye, Tags, CheckCircle, GitBranch, Archive, ChevronDown, FileText, SettingsIcon, Coins, ShieldCheck, AlertTriangle, AlertCircle, LoginModal, Toast, Sidebar, Header, ConfirmModal, EditModal, DonutChart, AutoSuggestInput, SearchIcon } = window;

            { id: 'T002', name: 'ลูกค้าเก่ากลับมาต่อยา', status: 'ใช้งาน' }
        ];
        const fallbackProductsList = window.fallbackProductsList || ['SESAMIN', 'APPLE', 'KING_GOLD'];

        const PrinterIcon = ({ size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <polyline points="6 9 6 2 18 2 18 9"></polyline>
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
        );

        const formatDbDateForFilter = (dateVal) => {
            if (!dateVal) return '';
            let str = String(dateVal).trim();
            if (str.includes('T')) str = str.split('T')[0];
            if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
            const parts = str.split(/[\/\-]/);
            if (parts.length === 3 && parts[2].length === 4) {
                return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
            }
            const d = new Date(dateVal);
            if (!isNaN(d.getTime())) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${y}-${m}-${day}`;
            }
            return str;
        };

        // ==========================================
        // 📌 Sales Entry View Component
        // ==========================================
        const SalesEntryView = ({ members, customers, closers, businessTeams = [], sales, setSales, setCustomers, activeProductsList, activeCustomerTypes, isAdmin, showToast, currentUser, products, setProducts, systemSettings, loading }) => {
            const triggerGlobalRefresh = () => {
                try {
                    localStorage.removeItem('stk_app_cache_data');
                    localStorage.removeItem('stk_app_cache_time');
                    if (typeof window.clearDbCache === 'function') window.clearDbCache();
                    window.parent.postMessage('refresh_data', '*');
                    if (typeof BroadcastChannel !== 'undefined') {
                        const bc = new BroadcastChannel('stk_mlm_channel');
                        bc.postMessage('refresh_data');
                        bc.close();
                    }
                    localStorage.setItem('stk_refresh_trigger', String(Date.now()));
                } catch (e) { }
            };
            const [saleTab, setSaleTab] = useState('B2M');

            const formatOrderTime = (saleObj) => {
                if (!saleObj) return '';
                const str = typeof saleObj === 'string' ? saleObj : (saleObj.created_at || saleObj.createdAt || saleObj.time || saleObj.created_time || saleObj.date || '');
                if (!str || typeof str !== 'string') return '';
                if (str.includes('น.')) {
                    const match = str.match(/(\d{1,2}:\d{2}\s*น\.)/);
                    if (match) return match[1];
                    return str;
                }
                try {
                    let d = null;
                    if (str.includes('T')) {
                        let isoStr = str;
                        if (!isoStr.endsWith('Z') && !isoStr.includes('+') && !isoStr.includes('-', 10)) {
                            isoStr += 'Z';
                        }
                        d = new Date(isoStr);
                    } else if (str.includes(' ')) {
                        const parts = str.split(' ');
                        if (parts[1] && parts[1].includes(':')) {
                            const isoStr = parts[0] + 'T' + parts[1] + 'Z';
                            d = new Date(isoStr);
                        }
                    }

                    if (d && !isNaN(d.getTime())) {
                        const hours = String(d.getHours()).padStart(2, '0');
                        const mins = String(d.getMinutes()).padStart(2, '0');
                        if (hours === '00' && mins === '00' && !str.includes(':')) {
                            return '';
                        }
                        return `${hours}:${mins} น.`;
                    }
                    return '';
                } catch (e) {
                    return '';
                }
            };

            const parseSaleCurrencyAmounts = (s, exRate) => {
                const rawAmt = Number(s.totalAmount || s.total_amount || 0);
                const pModeStr = String(s.payMode || s.pay_mode || s.saleType || s.sale_type || s.payment_method || '').trim();

                let lakAmt = 0;
                let thbAmt = 0;

                if (pModeStr.includes(':')) {
                    const parts = pModeStr.split('|');
                    let hasParsedLAK = false;
                    let hasParsedTHB = false;

                    parts.forEach(part => {
                        const trimmed = part.trim();
                        if (!trimmed.includes(':')) return;
                        const colonIdx = trimmed.indexOf(':');
                        const key = trimmed.substring(0, colonIdx).trim().toLowerCase();
                        const val = parseFloat(trimmed.substring(colonIdx + 1).replace(/,/g, '')) || 0;

                        if (key === 'เรท' || key === 'rate' || key === 'อัตรา') return;

                        if (key.includes('กีบ') || key.includes('lak') || key === 'สดกีบ' || (key.includes('ลาว') && !key.includes('บาท'))) {
                            lakAmt += val;
                            hasParsedLAK = true;
                        }
                        else if (key === 'สด' || key.includes('ไทย') || key.includes('บาท') || key.includes('thb') || key.includes('โอน')) {
                            thbAmt += val;
                            hasParsedTHB = true;
                        }
                    });

                    if (hasParsedLAK || hasParsedTHB) {
                        return { lakAmt, thbAmt, isLakBill: lakAmt > 0, isThbBill: thbAmt > 0 };
                    }
                }

                const lowerPMode = pModeStr.toLowerCase();
                const isLakBill = lowerPMode.includes('กีบ') || lowerPMode.includes('lak') || (lowerPMode.includes('ลาว') && !lowerPMode.includes('บาท'));

                if (isLakBill) {
                    let amt = Number(s.total_amount_lak || s.totalAmountLak || 0);
                    if (!amt || amt <= 0) amt = rawAmt * exRate;
                    return { lakAmt: amt, thbAmt: 0, isLakBill: true, isThbBill: false };
                }

                let amt = Number(s.total_amount_thb || s.totalAmountThb || 0);
                if (!amt || amt <= 0) amt = rawAmt;
                return { lakAmt: 0, thbAmt: amt, isLakBill: false, isThbBill: true };
            };

            const handlePrintReceiptPopup = (saleRecord) => {
                if (!saleRecord) return;
                const printWindow = window.open('', '_blank');
                if (!printWindow) {
                    showToast('เบราว์เซอร์บล็อกหน้าต่าง Popup กรุณาอนุญาต (Allow Pop-ups) ก่อนพิมพ์ใบเสร็จ', 'error');
                    return;
                }

                const isMarketing = currentUser && (
                    String(currentUser.role).trim() === 'พนักงานการตลาด' ||
                    String(currentUser.role).trim().toLowerCase() === 'marketing'
                );

                const mName = (members || []).find(m => m && m.id === saleRecord.memberId)?.name || saleRecord.memberName || saleRecord.member_name || '-';
                const custObj = (customers || []).find(c => c && (c.id === saleRecord.customerId || c.id === saleRecord.customer_id)) || {};
                const custName = custObj.name || saleRecord.customerName || saleRecord.customer_name || '';
                const closersList = typeof closers !== 'undefined' ? closers : [];
                const closerObj = closersList.find(cl => cl && (cl.id === (custObj.closer || custObj.closerId || custObj.closer_id) || cl.name === custObj.closer)) || {};
                const closerName = closerObj.name || custObj.closer || custObj.closerName || custObj.closer_name || '-';
                const cleanCustName = (() => {
                    const parts = custName.split(/\s+/);
                    const nameParts = [];
                    for (let part of parts) {
                        const p = part.trim();
                        if (!p) continue;
                        if (/^\d+$/.test(p) || p.startsWith('(')) {
                            break;
                        }
                        nameParts.push(p);
                    }
                    return nameParts.join(' ').trim() || custName;
                })();
                let cleanCloserName = closerName;
                if (cleanCloserName.includes(' - ')) {
                    cleanCloserName = cleanCloserName.split(' - ')[1].trim();
                } else if (cleanCloserName.includes('-')) {
                    cleanCloserName = cleanCloserName.split('-')[1].trim();
                }

                const saleTypeStr = saleRecord.saleType || saleRecord.payMode || 'เงินสด';
                let cTHB = 0; let cLAK = 0;
                let tThaiTHB = 0; let bThaiTHB = '';
                let tLaosTHB = 0; let bLaosTHB = '';
                let tLaosLAK = 0; let bLaosLAK = '';
                let rate = parseFloat(systemSettings?.exchange_rate) || 700;

                if (saleTypeStr.includes(':') || saleTypeStr.includes('โอน') || saleTypeStr.includes('|')) {
                    const parts = saleTypeStr.split('|').map(p => p.trim());
                    parts.forEach(p => {
                        if (!p.includes(':')) return;
                        const colonIdx = p.indexOf(':');
                        const key = p.substring(0, colonIdx).trim().toLowerCase();
                        const val = parseFloat(p.substring(colonIdx + 1).replace(/,/g, '')) || 0;

                        let bank = 'ไม่ระบุ';
                        const bankMatch = key.match(/\(([^)]+)\)/);
                        if (bankMatch) bank = bankMatch[1].toUpperCase();

                        if (key === 'เรท' || key === 'rate') {
                            rate = val || 700;
                        } else if (key === 'สด' || key.includes('สด (บาท)') || key.includes('สด(บาท)')) {
                            cTHB = val;
                        } else if (key === 'สดกีบ' || key === 'สด (กีบ)' || key === 'สด(กีบ)') {
                            cLAK = val;
                        } else if (key.includes('กีบ') || key.includes('lak')) {
                            bLaosLAK = bank; tLaosLAK = val;
                        } else if (key.includes('ลาว') && (key.includes('บาท') || key.includes('thb'))) {
                            bLaosTHB = bank; tLaosTHB = val;
                        } else if (key.includes('ไทย') || key.includes('โอน')) {
                            bThaiTHB = bank; tThaiTHB = val;
                        }
                    });
                } else {
                    const amt = parseFloat(saleRecord.totalAmount || saleRecord.total_amount || 0);
                    if (saleTypeStr.includes('โอน')) {
                        tThaiTHB = amt;
                        const matchBank = saleTypeStr.match(/ธ\.(.+)\)/);
                        if (matchBank) bThaiTHB = matchBank[1]; else bThaiTHB = 'ไม่ระบุ';
                    } else {
                        cTHB = amt;
                    }
                }

                const items = [];
                let totalBaseAmount = 0;
                let totalDiscountAmount = 0;
                let totalItemQuantity = 0;

                const prodMap = {};
                (products || []).forEach(p => {
                    if (p && p.name) prodMap[p.name] = p;
                    if (p && p.id) prodMap[p.id] = p;
                });

                let itemsList = [];
                if (saleRecord.items_json) {
                    try { itemsList = typeof saleRecord.items_json === 'string' ? JSON.parse(saleRecord.items_json) : saleRecord.items_json; } catch (e) { }
                }
                if (isMarketing && Array.isArray(itemsList)) {
                    itemsList = itemsList.filter(it => it.type === 'ราคาเต็ม' || it.type === 'ราคาสมาชิก' || it.priceType === 'ราคาเต็ม' || it.priceType === 'ราคาสมาชิก');
                }

                if (Array.isArray(itemsList) && itemsList.length > 0) {
                    itemsList.forEach(it => {
                        const qty = parseInt(it.qty || it.quantity || 1);
                        if (qty > 0) {
                            const productName = it.prod || it.productName || it.name || 'สินค้า';
                            const priceType = it.type || it.priceType || 'ราคาเต็ม';

                            const cleanProdNameForMatch = productName.replace(/\(.*?\)/g, '').trim();
                            const prodObj = prodMap[cleanProdNameForMatch] || prodMap[productName] || {};

                            const multiplier = (prodObj && (prodObj.isBundle || prodObj.is_bundle)) ? (parseInt(prodObj.bundleQty || prodObj.bundle_qty) || 1) : 1;

                            let fullPrice = parseFloat(prodObj.priceFull || 0);

                            let unitPrice = 0;
                            if (it.unitPrice !== undefined && it.unitPrice !== null) {
                                unitPrice = parseFloat(it.unitPrice);
                            } else if (priceType === 'ราคาเต็ม') unitPrice = fullPrice;
                            else if (priceType === 'ราคาโปร') unitPrice = parseFloat(prodObj.pricePromo || 0);
                            else if (priceType === 'ราคาสมาชิก') unitPrice = parseFloat(prodObj.priceMember || 0);
                            else if (priceType === 'ราคาศูนย์') unitPrice = 0;

                            if (fullPrice < unitPrice) fullPrice = unitPrice;
                            if (fullPrice === 0) fullPrice = unitPrice;

                            const itemTotal = unitPrice * qty;
                            const itemBaseTotal = fullPrice * qty;
                            const itemDiscount = itemBaseTotal - itemTotal;

                            totalBaseAmount += itemBaseTotal;
                            totalDiscountAmount += itemDiscount;
                            totalItemQuantity += (qty * multiplier);

                            items.push({
                                name: productName, priceType, qty, unitPrice, fullPrice, total: itemTotal, discount: itemDiscount, multiplier
                            });
                        }
                    });
                }

                if (items.length === 0) {
                    Object.keys(saleRecord).forEach(key => {
                        const qty = parseInt(saleRecord[key]) || 0;
                        if (qty > 0) {
                            let productName = ''; let priceType = ''; let unitPrice = 0;

                            if (key.endsWith('_ราคาเต็ม') && key !== 'รวมชิ้นราคาเต็ม') { productName = key.replace('_ราคาเต็ม', ''); priceType = 'ราคาเต็ม'; }
                            else if (key.endsWith('_ราคาโปร') && key !== 'รวมชิ้นราคาโปร') { productName = key.replace('_ราคาโปร', ''); priceType = 'ราคาโปร'; }
                            else if (key.endsWith('_ราคาสมาชิก') && key !== 'รวมชิ้นราคาสมาชิก') { productName = key.replace('_ราคาสมาชิก', ''); priceType = 'ราคาสมาชิก'; }
                            else if (key.endsWith('_ราคาศูนย์') && key !== 'รวมชิ้นราคาศูนย์') { productName = key.replace('_ราคาศูนย์', ''); priceType = 'ราคาศูนย์'; }

                            if (productName) {
                                const cleanProdName = productName.replace(/\(.*?\)/g, '').trim();
                                const prodObj = prodMap[cleanProdName] || prodMap[productName] || {};
                                const multiplier = (prodObj && (prodObj.isBundle || prodObj.is_bundle)) ? (parseInt(prodObj.bundleQty || prodObj.bundle_qty) || 1) : 1;

                                let fullPrice = parseFloat(prodObj.priceFull || 0);

                                if (priceType === 'ราคาเต็ม') unitPrice = fullPrice;
                                else if (priceType === 'ราคาโปร') unitPrice = parseFloat(prodObj.pricePromo || 0);
                                else if (priceType === 'ราคาสมาชิก') unitPrice = parseFloat(prodObj.priceMember || 0);
                                else if (priceType === 'ราคาศูนย์') unitPrice = 0;

                                if (fullPrice < unitPrice) fullPrice = unitPrice;
                                if (fullPrice === 0) fullPrice = unitPrice;

                                const itemTotal = unitPrice * qty;
                                const itemBaseTotal = fullPrice * qty;
                                const itemDiscount = itemBaseTotal - itemTotal;

                                totalBaseAmount += itemBaseTotal;
                                totalDiscountAmount += itemDiscount;
                                totalItemQuantity += (qty * multiplier);

                                items.push({
                                    name: productName, priceType, qty, unitPrice, fullPrice, total: itemTotal, discount: itemDiscount, multiplier
                                });
                            }
                        }
                    });
                }

                if (totalBaseAmount > 0 && totalBaseAmount === totalDiscountAmount) {
                    totalBaseAmount = 0;
                    totalDiscountAmount = 0;
                }

                const typeOrder = { 'ราคาเต็ม': 1, 'ราคาสมาชิก': 2, 'ราคาโปร': 3, 'ราคาศูนย์': 4 };
                items.sort((a, b) => (typeOrder[a.priceType] || 99) - (typeOrder[b.priceType] || 99));

                const breakdownParts = [];

                let payMethodLabel = 'เงินสด';
                if ((cTHB > 0 || cLAK > 0) && (tThaiTHB > 0 || tLaosTHB > 0 || tLaosLAK > 0)) {
                    payMethodLabel = 'เงินสด + เงินโอน';
                } else if (tThaiTHB > 0 || tLaosTHB > 0 || tLaosLAK > 0) {
                    payMethodLabel = 'เงินโอน';
                }

                breakdownParts.push(`<tr><td colspan="2" style="padding: 4px 0; font-weight: bold; color: #1e3a8a;">ชำระโดย: ${payMethodLabel}</td></tr>`);

                if (cTHB > 0) breakdownParts.push(`<tr><td style="padding: 2px 0; padding-left: 8px;">- เงินสด (THB):</td><td style="padding: 2px 0; text-align: right; font-weight: bold;">฿${cTHB.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td></tr>`);
                if (cLAK > 0) breakdownParts.push(`<tr><td style="padding: 2px 0; padding-left: 8px;">- เงินสด (LAK):</td><td style="padding: 2px 0; text-align: right; font-weight: bold;">${cLAK.toLocaleString()} ₭</td></tr>`);
                if (tThaiTHB > 0) breakdownParts.push(`<tr><td style="padding: 2px 0; padding-left: 8px;">- โอนไทย (${bThaiTHB}):</td><td style="padding: 2px 0; text-align: right; font-weight: bold;">฿${tThaiTHB.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td></tr>`);
                if (tLaosTHB > 0) breakdownParts.push(`<tr><td style="padding: 2px 0; padding-left: 8px;">- โอนลาวบาท (${bLaosTHB}):</td><td style="padding: 2px 0; text-align: right; font-weight: bold;">฿${tLaosTHB.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td></tr>`);
                if (tLaosLAK > 0) breakdownParts.push(`<tr><td style="padding: 2px 0; padding-left: 8px;">- โอนลาวกีบ (${bLaosLAK}):</td><td style="padding: 2px 0; text-align: right; font-weight: bold;">${tLaosLAK.toLocaleString()} ₭</td></tr>`);

                const totalRecordAmt = parseFloat(saleRecord.totalAmount || saleRecord.total_amount || 0);
                if (totalBaseAmount === 0) totalBaseAmount = totalRecordAmt;

                const pMode = String(saleRecord.payMode || saleRecord.pay_mode || saleRecord.saleType || '').toLowerCase();
                const isLakMain = pMode.includes('กีบ') || pMode.includes('lak') || (pMode.includes('ลาว') && !pMode.includes('บาท')) || pMode.includes('สดกีบ');

                if (isLakMain) {
                    const totalLakBill = Number(saleRecord.total_amount_lak || saleRecord.totalAmountLak || (totalRecordAmt >= 100000 ? totalRecordAmt : totalRecordAmt * rate));
                    const totalPaidLak = cLAK + (cTHB * rate) + (tThaiTHB * rate) + (tLaosTHB * rate) + tLaosLAK;
                    const changeLAK = totalPaidLak - totalLakBill;
                    if (changeLAK > 0.5) {
                        breakdownParts.push(`<tr><td style="padding: 4px 0; border-top: 1px dashed #cbd5e1; font-weight: bold; color: #047857;">เงินทอน (LAK):</td><td style="padding: 4px 0; border-top: 1px dashed #cbd5e1; text-align: right; font-weight: bold; color: #047857;">${Math.round(changeLAK).toLocaleString()} ₭</td></tr>`);
                    }
                } else {
                    const totalThbBill = Number(saleRecord.total_amount_thb || saleRecord.totalAmountThb || (totalRecordAmt >= 100000 ? totalRecordAmt / rate : totalRecordAmt));
                    const totalPaidThb = cTHB + (cLAK / rate) + tThaiTHB + tLaosTHB + (tLaosLAK / rate);
                    const changeTHB = totalPaidThb - totalThbBill;
                    if (changeTHB > 0.05) {
                        if (cLAK > 0 && cTHB === 0) {
                            breakdownParts.push(`<tr><td style="padding: 4px 0; border-top: 1px dashed #cbd5e1; font-weight: bold; color: #047857;">เงินทอน (LAK):</td><td style="padding: 4px 0; border-top: 1px dashed #cbd5e1; text-align: right; font-weight: bold; color: #047857;">${Math.round(changeTHB * rate).toLocaleString()} ₭</td></tr>`);
                        } else {
                            breakdownParts.push(`<tr><td style="padding: 4px 0; border-top: 1px dashed #cbd5e1; font-weight: bold; color: #1e3a8a;">เงินทอน (THB):</td><td style="padding: 4px 0; border-top: 1px dashed #cbd5e1; text-align: right; font-weight: bold; color: #1e3a8a;">฿${(Math.round(changeTHB * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: 2 })}</td></tr>`);
                        }
                    }
                }

                if (saleRecord.paymentNote && String(saleRecord.paymentNote).trim() !== String(saleRecord.saleType).trim()) {
                    breakdownParts.push(`<tr><td colspan="2" style="font-size: 10px; color: #b45309; padding-top: 6px; font-weight: 600;">หมายเหตุ: ${saleRecord.paymentNote}</td></tr>`);
                }

                const paymentBreakdownHtml = breakdownParts.join('');

                const printTableRowsHtml = items.map(item => {
                    const qtyDisplay = item.multiplier > 1
                        ? `${item.qty} เซ็ต<br><span style="font-size: 10px; color: #3b82f6;">(${item.qty * item.multiplier} กล่อง)</span>`

                    return `
                <tr>

                    <div class="bold" style="color: #0f172a;">${item.name}</div>

                  ${isMarketing ? '' : `<td style="text-align: right; font-family: monospace;">${item.unitPrice > 0 ? '฿' + item.unitPrice.toLocaleString() : '-'}</td>`}
                  <td style="text-align: center; font-weight: 700;">${qtyDisplay}</td>
                  ${isMarketing ? '' : `<td style="text-align: right; font-weight: 700; font-family: monospace; color: #0f172a;">${item.total > 0 ? '฿' + item.total.toLocaleString() : '฿0'}</td>`}
                </tr>
            `;
                }).join('');

                let printMetaSectionHtml = '';
                if (!isMarketing) {

                    } else if (lakAmt > 0 || isLakMain) {

                    } else {

                    printMetaSectionHtml = `

                    ${totalDiscountAmount > 0 ? `<tr class="total-row"><td>ส่วนลดรวม:</td><td class="text-right" style="color: #ef4444; font-weight:700;">- ฿${totalDiscountAmount.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td></tr>` : ''}
                    ${rateHtml}
                  </table>
                  <div class="divider"></div>
                  <table class="meta-table">
                    <tr class="bold"><td colspan="2" style="font-size: 11px; color: #1e3a8a; padding-bottom: 2px;">🐾 รายละเอียดการชำระเงิน</td></tr>
                    ${paymentBreakdownHtml}
                  </table>
                `;
                }

                const htmlStr = `
            <!DOCTYPE html>

            `;
                printWindow.document.open();
                printWindow.document.write(htmlStr);
                printWindow.document.close();
                printWindow.focus();
            };


            const [formData, setFormData] = useState({ date: getLocalISODate() });
            const [memberIdInput, setMemberIdInput] = useState('');

            const [custMode, setCustMode] = useState('');
            const isOldCustomerMode = (custMode || '').includes('เก่า');

            const [custData, setCustData] = useState({ id: '', name: '', phone: '', lineId: '', symptom: '', closer: '', closerTeam: '' });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const isSubmittingRef = useRef(false);
            const [editingSaleId, setEditingSaleId] = useState(null);
            const hasLoadedEditIdRef = React.useRef(false);

            const [confirmDelete, setConfirmDelete] = useState({ show: false, id: null, customerId: null, title: '' });
            const [successModal, setSuccessModal] = useState({ show: false, saleRecord: null });
            // ฟังก์ชันดึงรหัสลูกค้าที่ว่างอยู่แบบ Real-time จาก Database (ป้องกันรหัสชนและอุดช่องโหว่)
            const fetchNextAvailableCustId = async () => {
                setCustData(prev => ({ ...prev, id: 'กำลังคำนวณรหัส...' }));
                try {
                    const usedIds = new Set();

                    // 1. ดึงข้อมูลจากฐานข้อมูลแบบ Real-time เพื่อความชัวร์ 100% ว่าไม่มีใครใช้รหัสนี้ไปแล้ว
                    if (typeof supabaseSelect === 'function') {
                        const [dbCusts, dbSales] = await Promise.all([
                            supabaseSelect('stk_customers', 'customer_id=like.C*&select=customer_id&limit=10000').catch(() => []),
                            supabaseSelect('stk_sales', 'customer_id=like.C*&select=customer_id&limit=10000').catch(() => [])
                        ]);

                        (dbCusts || []).forEach(c => {
                            const match = c && c.customer_id && c.customer_id.match(/^C(\d+)$/i);
                            if (match) usedIds.add(parseInt(match[1], 10));
                        });
                        (dbSales || []).forEach(s => {
                            const match = s && s.customer_id && s.customer_id.match(/^C(\d+)$/i);
                            if (match) usedIds.add(parseInt(match[1], 10));
                        });
                    } else {
                        // Fallback กรณีเชื่อมต่อ DB ไม่ได้ ให้เช็คจากข้อมูลในหน้าจอแทน
                        (customers || []).forEach(c => {
                            const match = c && c.id && c.id.match(/^C(\d+)$/i);
                            if (match) usedIds.add(parseInt(match[1], 10));
                        });
                        (sales || []).forEach(s => {
                            const match = s && s.customerId && s.customerId.match(/^C(\d+)$/i);
                            if (match) usedIds.add(parseInt(match[1], 10));
                        });
                    }

                    // 2. หาช่องว่าง (Gap Filling) เริ่มจากเลข 1 (C001)
                    let nextIdNum = 1;
                    while (usedIds.has(nextIdNum)) {
                        nextIdNum++;
                    }

                    const finalId = "C" + nextIdNum.toString().padStart(3, '0');
                    setCustData(prev => ({ ...prev, id: finalId }));
                } catch (error) {
                    console.error('Error fetching next customer ID:', error);
                    setCustData(prev => ({ ...prev, id: '' }));
                }
            };
            const calculateBillPV = (cartItems, prods) => {
                let totalPV = 0;
                cartItems.forEach(item => {
                    const p = (prods || []).find(prod => prod.name === item.productName);
                    if (p) {
                        // ดึงค่า PV ตรงๆ ถ้าไม่ตั้งไว้ให้เป็น 0 (ไม่บังคับปัดเป็น 1 แล้ว)
                        const pvRate = p.givePv !== undefined ? Number(p.givePv) : 0;
                        if (item.priceType === 'ราคาเต็ม' || item.priceType === 'ราคาสมาชิก') {
                            totalPV += (Number(item.qty) || 0) * pvRate;
                        }
                    }
                });
                return totalPV;
            };

            const updateMemberPVInSupabase = async (memberId, pvChange) => {
                if (!memberId || pvChange === 0) return;
                try {
                    let pk = 'user_id';
                    let memRes;
                    try { memRes = await supabaseSelect('stk_members', `user_id=eq.${encodeURIComponent(memberId)}`); }
                    catch (err) {
                        try { memRes = await supabaseSelect('stk_members', `id=eq.${encodeURIComponent(memberId)}`); pk = 'id'; }
                        catch (err2) { memRes = await supabaseSelect('stk_members', `User_ID=eq.${encodeURIComponent(memberId)}`); pk = 'User_ID'; }
                    }

                    if (memRes && memRes.length > 0) {
                        const mem = memRes[0];
                        let currentPv = Number(mem.accumulated_pv || mem.Accumulated_PV || 0);
                        let newPv = currentPv + pvChange;
                        if (newPv < 0) newPv = 0;
                        const updatePayload = mem.Accumulated_PV !== undefined ? { Accumulated_PV: newPv } : { accumulated_pv: newPv };
                        await supabaseUpdate('stk_members', memberId, updatePayload, 'user_id');
                        console.log(`✅ Updated PV for ${memberId}: ${currentPv} -> ${newPv} (Change: ${pvChange})`);
                    }
                } catch (err) {
                    console.error('❌ Failed to update member PV in Supabase:', err);
                }
            };

            const [viewBillDetail, setViewBillDetail] = useState(null);

            const fallbackToday = new Date().toISOString().split('T')[0];
            const getLocalISO = (typeof window !== 'undefined' && window.getLocalISODate) ? window.getLocalISODate : () => fallbackToday;
            const getFirstDOM = (typeof window !== 'undefined' && window.getFirstDayOfMonth) ? window.getFirstDayOfMonth : () => `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}-01`;

            const [historyStartDate, setHistoryStartDate] = useState(getLocalISO());
            const [historyEndDate, setHistoryEndDate] = useState(getLocalISO());
            const [salesSearchTerm, setSalesSearchTerm] = useState('');

            const [salesPage, setSalesPage] = useState(1);
            const SALES_PER_PAGE = 20;

            const findMemberRobustLocal = (inputStr) => {
                if (!inputStr) return null;
                const mId = inputStr.split(' ')[0].replace('-', '').trim();
                return (members || []).find(m => m && safeUpper(m.id) === safeUpper(mId));
            };
            const foundMember = findMemberRobustLocal(memberIdInput);

            const membersSuggestList = useMemo(() => (members || []).filter(m => m && m.id).map(m => ({
                label: `${m.id} - ${m.name}`,
                value: `${m.id} - ${m.name}`
            })), [members]);

            const customersSuggestList = useMemo(() => (customers || []).filter(c => c && c.id).map(c => ({
                label: `${c.id} - ${c.name} (${c.phone || 'ไม่มีเบอร์'})`,
                value: c.id,
                searchText: `${c.id} ${c.name} ${c.phone}`
            })), [customers]);

            const allClosersPool = useMemo(() => {
                const poolMap = new Map();
                const teamIdToName = {};
                (businessTeams || []).forEach(t => {
                    const tId = String(t.id || t.team_id || '').trim().toUpperCase();
                    const tName = String(t.name || t.team_name || t.team_id || '').trim();
                    if (tId) teamIdToName[tId] = tName;
                });

                // 1. Add all from closers table
                (closers || []).forEach(c => {
                    const id = String(c.id || c.closer_id || '').trim();
                    if (id && (!c.status || c.status === 'ใช้งาน')) {
                        poolMap.set(id.toUpperCase(), {
                            id: id,
                            name: c.name || id,
                            team: c.team || 'Center'
                        });
                    }
                });

                // 2. Add all from members table (captures ALL newly added employees instantly!)
                (members || []).forEach(m => {
                    const id = String(m.id || m.user_id || m.username || '').trim();
                    if (id && (!m.status || m.status === 'ทำงานอยู่' || m.status === 'ใช้งาน')) {
                        const bTeamRaw = String(m.businessTeam || m.business_team || m.team || '').trim();
                        const teamNameStr = teamIdToName[bTeamRaw.toUpperCase()] || teamIdToName[bTeamRaw] || bTeamRaw || 'Marketing';
                        
                        if (!poolMap.has(id.toUpperCase())) {
                            poolMap.set(id.toUpperCase(), {
                                id: id,
                                name: m.name || id,
                                team: teamNameStr
                            });
                        } else {
                            const existing = poolMap.get(id.toUpperCase());
                            if (bTeamRaw) {
                                existing.team = teamNameStr;
                                if (m.name) existing.name = m.name;
                            }
                        }
                    }
                });

                return Array.from(poolMap.values());
            }, [closers, members, businessTeams]);

            const closersSuggestList = useMemo(() => {
                const selectedTeam = String(custData.closerTeam || '').trim().toUpperCase();
                
                return allClosersPool.filter(c => {
                    if (!selectedTeam) return true; // Show all if team not selected yet
                    
                    const cTeam = String(c.team || '').trim().toUpperCase();

                    if (cTeam === selectedTeam) return true;

                    if (selectedTeam === 'MARKETING' || selectedTeam.includes('การตลาด') || selectedTeam === 'T01') {
                        if (cTeam === 'MARKETING' || cTeam.includes('การตลาด') || cTeam === 'T01' || (cTeam !== 'CENTER' && cTeam !== 'TEAM B' && cTeam !== 'T02')) return true;
                    }

                    if (selectedTeam === 'CENTER' && (cTeam === 'CENTER' || cTeam.includes('ผู้เชี่ยวชาญ') || cTeam === 'T02' || cTeam === 'TEAM B')) {
                        return true;
                    }

                    return false;
                }).map(c => ({
                    label: `${c.id} - ${c.name} (${c.team || 'ไม่ระบุทีม'})`,
                    value: `${c.id} - ${c.name}`
                }));
            }, [allClosersPool, custData.closerTeam]);

            const [cart, setCart] = useState([]);
            const [catalogSearch, setCatalogSearch] = useState('');

            const [payMode, setPayMode] = useState('สด');
            const [payCashTHB, setPayCashTHB] = useState('');
            const [payCashLAK, setPayCashLAK] = useState('');
            const [payTransferThaiTHB, setPayTransferThaiTHB] = useState('');
            const [payTransferThaiBank, setPayTransferThaiBank] = useState('กสิกรไทย');
            const [payTransferLaosTHB, setPayTransferLaosTHB] = useState('');
            const [payTransferLaosBankTHB, setPayTransferLaosBankTHB] = useState('BCEL');
            const [payTransferLaosLAK, setPayTransferLaosLAK] = useState('');
            const [payTransferLaosBankLAK, setPayTransferLaosBankLAK] = useState('BCEL');
            const [paymentNote, setPaymentNote] = useState('');
            const exchangeRate = parseFloat(systemSettings?.exchange_rate) || 700;

            const [isCustomerExpanded, setIsCustomerExpanded] = useState(true);

            useEffect(() => {
                // หยุดทันทีถ้าโหลดข้อมูลเพื่อแก้ไขแล้ว ไม่ต้องดึงซ้ำอีก (prevent double fetch)
                if (hasLoadedEditIdRef.current) return;
                try {
                    const pendingSaleStr = localStorage.getItem('stk_pending_sale');
                    if (pendingSaleStr) {
                        const pending = JSON.parse(pendingSaleStr);
                        localStorage.removeItem('stk_pending_sale');

                        if (pending && pending.recorded_by) {
                            setMemberIdInput(pending.recorded_by);
                        }

                        if (pending && pending.visit_id) {
                            setPaymentNote(`VISIT: ${pending.visit_id}`);
                        }

                        if (pending && (pending.hn || pending.customer_name)) {
                            setCustData(prev => ({
                                ...prev,
                                id: pending.hn || prev.id || '',
                                name: pending.customer_name || prev.name || '',
                                phone: pending.phone || prev.phone || '',
                                symptom: pending.disease || prev.symptom || ''
                            }));
                            setCustMode('ลูกค้าใหม่');
                        }

                        if (pending && Array.isArray(pending.items) && pending.items.length > 0) {
                            const newCart = pending.items.map(it => {
                                const rawName = it.name || '';
                                const cleanName = rawName.replace(/\s*\([^)]*\)\s*/g, '').trim();
                                const prodObj = (products || []).find(p =>
                                    p.name === cleanName ||
                                    p.name.toLowerCase() === cleanName.toLowerCase() ||
                                    cleanName.toLowerCase().includes(p.name.toLowerCase())
                                ) || { name: cleanName || rawName, priceFull: it.price, pricePromo: it.price, priceMember: it.price };

                                let mappedPriceType = 'ราคาโปร';
                                const typeStr = String(it.type || it.priceType || '');
                                if (typeStr.includes('สมาชิก') || typeStr.includes('ส่ง') || rawName.includes('สมาชิก') || rawName.includes('ส่ง')) {
                                    mappedPriceType = 'ราคาสมาชิก';
                                } else if (typeStr.includes('โปร') || rawName.includes('โปร')) {
                                    mappedPriceType = 'ราคาโปร';
                                } else if (typeStr.includes('แถม') || typeStr.includes('ฟรี') || rawName.includes('แถม')) {
                                    mappedPriceType = 'ราคาศูนย์';
                                } else if (typeStr.includes('เต็ม') || typeStr.includes('ปกติ')) {
                                    mappedPriceType = 'ราคาเต็ม';
                                }

                                let unitPrice = Number(it.price || 0);
                                if (!unitPrice) {
                                    if (mappedPriceType === 'ราคาเต็ม') unitPrice = parseFloat(prodObj.priceFull || 0);
                                    else if (mappedPriceType === 'ราคาโปร') unitPrice = parseFloat(prodObj.pricePromo || 0);
                                    else if (mappedPriceType === 'ราคาสมาชิก') unitPrice = parseFloat(prodObj.priceMember || 0);
                                    else if (mappedPriceType === 'ราคาศูนย์') unitPrice = 0;
                                }

                                return {
                                    productName: prodObj.name || cleanName || rawName,
                                    priceType: mappedPriceType,
                                    price: unitPrice,
                                    qty: Number(it.qty || 1)
                                };
                            });
                            setCart(newCart);
                        }

                        if (showToast) {
                            showToast(`โหลดข้อมูลสั่งจ่ายยา VISIT: ${pending.visit_id || ''} เข้าสู่หน้าขายเรียบร้อย!`, 'success');
                        }
                    }
                } catch (e) {
                    console.warn('Error loading pending sale:', e);
                }
                // 🔒 ROBUST DIRECT FETCH FOR EDIT MODE:
                // ดึงข้อมูลบิล + products + member + customer พร้อมกันเพื่อให้ราคาและข้อมูลครบถ้วน
                const loadEditRecordDirectly = async (editId) => {
                    try {
                        if (hasLoadedEditIdRef.current) return;
                        hasLoadedEditIdRef.current = true; // 🔒 lock ทันที ป้องกัน race condition (double call)

                        // ดึงทุกอย่างพร้อมกัน: บิล + สินค้า + สมาชิก
                        const [saleRes, prodRes] = await Promise.all([
                            supabaseSelect('stk_sales', 'order_id=eq.' + encodeURIComponent(editId)).catch(() => []),
                            supabaseSelect('stk_products').catch(() => [])
                        ]);

                        if (!Array.isArray(saleRes) || saleRes.length === 0) {
                            console.warn('Direct fetch sale not found:', editId);
                            return;
                        }

                        // จะ setProducts หลังจาก map freshProducts แล้ว (เพื่อให้มี imageUrl ถูกต้อง)

                        const rawSale = saleRes[0];
                        let itemsList = [];
                        if (rawSale.items_json) {
                            try { itemsList = typeof rawSale.items_json === 'string' ? JSON.parse(rawSale.items_json) : rawSale.items_json; } catch (e) { }
                        }
                        // แปลง items_json เป็น field สำหรับ handleEditSale
                        if (Array.isArray(itemsList) && itemsList.length > 0) {
                            itemsList.forEach(it => {
                                let typeStr = String(it.type || '').trim();
                                if (typeStr === 'ราคาพิเศษ' || typeStr === 'ราคาโปรโมชั่น') typeStr = 'ราคาโปร';
                                if (typeStr === 'ราคาแถม') typeStr = 'ราคาศูนย์';
                                const qtyNum = Number(it.qty || it.quantity || 1);
                                const pName = String(it.prod || it.productName || it.name || 'Unknown').trim();
                                rawSale[pName + '_' + typeStr] = qtyNum;
                            });
                        }

                        rawSale['memberId'] = rawSale.memberId || rawSale.seller_id || rawSale.seller;
                        rawSale.customerId = rawSale.customerId || rawSale.customer_id;
                        rawSale.totalAmount = rawSale.totalAmount || rawSale.total_amount;
                        rawSale.saleType = rawSale.saleType || rawSale.sale_type;
                        rawSale.date = rawSale.date || rawSale.created_at;
                        rawSale.recordedBy = rawSale.recordedBy || rawSale.recorded_by;
                        rawSale.paymentNote = rawSale.paymentNote || rawSale.payment_note;
                        rawSale.customerType = rawSale.customerType || rawSale.customer_type || '';
                        rawSale.id = rawSale.order_id || rawSale.id;

                        // ดึงสมาชิกและลูกค้าพร้อมกัน (ใช้ user_id สำหรับสมาชิก, customer_id สำหรับลูกค้า)
                        const [memFetch, custFetch] = await Promise.all([
                            rawSale.memberId
                                ? supabaseSelect('stk_members', 'user_id=eq.' + encodeURIComponent(rawSale.memberId)).catch(() => [])
                                : Promise.resolve([]),
                            rawSale.customerId
                                ? supabaseSelect('stk_customers', 'customer_id=eq.' + encodeURIComponent(rawSale.customerId)).catch(() => [])
                                : Promise.resolve([])
                        ]);

                        // ตั้งชื่อสมาชิก
                        if (Array.isArray(memFetch) && memFetch.length > 0) {
                            rawSale.memberName = memFetch[0].name || memFetch[0].user_name || '';
                        }

                        // อัปเดตข้อมูลลูกค้า
                        if (Array.isArray(custFetch) && custFetch.length > 0) {
                            const fetchedCustomers = custFetch.map(c => ({
                                ...c,
                                id: c.customer_id || c.id,
                                name: c.name || c.customer_name || '',
                                phone: c.phone || c.phone_number || '',
                                lineId: c.lineId || c.line_id || '',
                                symptom: c.symptom || c.symptom_disease || '',
                                closer: c.closer || c.closer_id || '',
                                type: c.customer_type || c.type || ''
                            }));
                            // merge กับ customers ที่มีอยู่
                            setCustomers(prev => {
                                const existing = (prev || []).filter(c => c.id !== fetchedCustomers[0].id);
                                return [...fetchedCustomers, ...existing];
                            });
                        }

                        // map freshProducts ให้มี imageUrl และ price fields ถูกต้อง
                        const freshProducts = (Array.isArray(prodRes) ? prodRes : (products || [])).map(x => ({
                            ...x,
                            id: x.id || x.product_id,
                            imageUrl: x.image_url ?? x.imageUrl ?? '',
                            priceFull: Number(x.price_full ?? x.priceFull ?? 0) || 0,
                            priceMember: Number(x.price_member ?? x.priceMember ?? 0) || 0,
                            pricePromo: Number(x.price_promo ?? x.pricePromo ?? 0) || 0,
                            stock: parseInt(x.current_stock ?? x.stock ?? 0) || 0
                        }));
                        // บันทึก freshProducts เข้า state (มี imageUrl ถูกต้อง) สำหรับ render รูปสินค้า
                        if (freshProducts.length > 0) setProducts(freshProducts);

                        // สร้าง cart โดยตรงจาก items_json + ราคาจาก freshProducts
                        if (Array.isArray(itemsList) && itemsList.length > 0) {
                            const directCart = itemsList.map(it => {
                                let typeStr = String(it.type || '').trim();
                                if (typeStr === 'ราคาพิเศษ' || typeStr === 'ราคาโปรโมชั่น') typeStr = 'ราคาโปร';
                                if (typeStr === 'ราคาแถม') typeStr = 'ราคาศูนย์';
                                const qtyNum = Number(it.qty || it.quantity || 1);
                                const pName = String(it.prod || it.productName || it.name || '').trim();
                                const prodObj = freshProducts.find(p => p.name === pName) || {};
                                let unitPrice = 0;
                                if (typeStr === 'ราคาเต็ม') unitPrice = prodObj.priceFull || 0;
                                else if (typeStr === 'ราคาโปร') unitPrice = prodObj.pricePromo || 0;
                                else if (typeStr === 'ราคาสมาชิก') unitPrice = prodObj.priceMember || 0;
                                else if (typeStr === 'ราคาศูนย์') unitPrice = 0;
                                else unitPrice = prodObj.priceMember || prodObj.pricePromo || prodObj.priceFull || 0;
                                return { productName: pName, priceType: typeStr, price: unitPrice, qty: qtyNum };
                            }).filter(it => it.productName && it.qty > 0);

                            // ตั้งค่าฟอร์มทั้งหมดโดยตรง (ไม่ผ่าน handleEditSale เพื่อหลีกเลี่ยง stale closure ของ products)
                            setEditingSaleId(rawSale.id);
                            setFormData({ date: rawSale.date ? rawSale.date.split('T')[0] : getLocalISODate() });
                            const mObjName = rawSale.memberName || '';
                            setMemberIdInput(mObjName ? `${rawSale.memberId} - ${mObjName}` : (rawSale.memberId || ''));

                            // Payment — parse รายละเอียดการจ่าย ให้ครบทุกช่อง
                            const saleTypeStr = rawSale.saleType || 'สด';
                            let loadedMode = 'สด';
                            let lCashTHB = ''; let lCashLAK = '';
                            let lThaiTHB = ''; let bThaiTHB = 'กสิกรไทย';
                            let lLaosTHB = ''; let bLaosTHB = 'BCEL';
                            let lLaosLAK = ''; let bLaosLAK = 'BCEL';
                            if (saleTypeStr.includes(':') || saleTypeStr.includes('|')) {
                                const parts = saleTypeStr.split('|').map(p => p.trim());
                                let hasCash = false; let hasTransfer = false;
                                parts.forEach(p => {
                                    if (p.startsWith('สดบาท:')) { lCashTHB = p.replace('สดบาท:', '').trim(); hasCash = true; }
                                    else if (p.startsWith('สด:')) { lCashTHB = p.replace('สด:', '').trim(); hasCash = true; }
                                    else if (p.startsWith('สดกีบ:')) { lCashLAK = p.replace('สดกีบ:', '').trim(); hasCash = true; }
                                    else if (p.match(/^โอนไทย\(([^)]+)\):(.*)$/)) {
                                        const m = p.match(/^โอนไทย\(([^)]+)\):(.*)$/);
                                        bThaiTHB = m[1].trim(); lThaiTHB = m[2].trim(); hasTransfer = true;
                                    } else if (p.match(/^โอนลาวบาท\(([^)]+)\):(.*)$/)) {
                                        const m = p.match(/^โอนลาวบาท\(([^)]+)\):(.*)$/);
                                        bLaosTHB = m[1].trim(); lLaosTHB = m[2].trim(); hasTransfer = true;
                                    } else if (p.match(/^โอนลาวกีบ\(([^)]+)\):(.*)$/)) {
                                        const m = p.match(/^โอนลาวกีบ\(([^)]+)\):(.*)$/);
                                        bLaosLAK = m[1].trim(); lLaosLAK = m[2].trim(); hasTransfer = true;
                                    } else if (p.match(/^โอน\(([^)]+)\):(.*)$/)) {
                                        const m = p.match(/^โอน\(([^)]+)\):(.*)$/);
                                        bThaiTHB = m[1].trim(); lThaiTHB = m[2].trim(); hasTransfer = true;
                                    } else if (p.match(/^โอนกีบ\(([^)]+)\):(.*)$/)) {
                                        const m = p.match(/^โอนกีบ\(([^)]+)\):(.*)$/);
                                        bLaosLAK = m[1].trim(); lLaosLAK = m[2].trim(); hasTransfer = true;
                                    }
                                });
                                if (hasCash && hasTransfer) loadedMode = 'สด+โอน';
                                else if (hasTransfer) loadedMode = 'โอน';
                                else loadedMode = 'สด';
                            } else {
                                const amt = rawSale.totalAmount ? String(rawSale.totalAmount) : '';
                                if (saleTypeStr.includes('โอน')) { lThaiTHB = amt; loadedMode = 'โอน'; }
                                else { lCashTHB = amt; loadedMode = 'สด'; }
                            }
                            setPayMode(loadedMode);
                            setPayCashTHB(lCashTHB);
                            setPayCashLAK(lCashLAK);
                            setPayTransferThaiTHB(lThaiTHB);
                            setPayTransferThaiBank(bThaiTHB);
                            setPayTransferLaosTHB(lLaosTHB);
                            setPayTransferLaosBankTHB(bLaosTHB);
                            setPayTransferLaosLAK(lLaosLAK);
                            setPayTransferLaosBankLAK(bLaosLAK);
                            setPaymentNote(rawSale.paymentNote || '');

                            // Customer
                            const fetchedCust = Array.isArray(custFetch) && custFetch.length > 0 ? custFetch[0] : null;
                            if (fetchedCust) {
                                const custType = rawSale.customerType || fetchedCust.customer_type || fetchedCust.type || '';
                                setCustMode(custType);
                                const closerName = fetchedCust.closer || fetchedCust.closer_id || '';
                                const cObj = (closers || []).find(cl => cl.name === closerName);
                                let cTeam = cObj ? cObj.team : (fetchedCust.extra_details_json?.closerTeam || '');
                                if (cTeam === 'Team A') cTeam = 'Marketing';
                                if (cTeam === 'Team B') cTeam = 'Center';
                                setCustData({
                                    id: fetchedCust.customer_id || fetchedCust.id || rawSale.customerId || '',
                                    name: fetchedCust.name || fetchedCust.customer_name || '',
                                    phone: fetchedCust.phone || fetchedCust.phone_number || '',
                                    lineId: fetchedCust.line_id || fetchedCust.lineId || '',
                                    symptom: fetchedCust.symptom_disease || fetchedCust.symptom || '',
                                    closer: closerName,
                                    closerTeam: cTeam
                                });
                            } else {
                                setCustMode(rawSale.customerType || '');
                                setCustData({ id: rawSale.customerId || '', name: rawSale.customer_name || '', phone: '', lineId: '', symptom: '', closer: '', closerTeam: '' });
                            }

                            setCart(directCart);
                            if (showToast) showToast('ดึงข้อมูลบิล ' + editId + ' สำหรับการแก้ไขเสร็จเรียบร้อย!', 'success');
                        } else {
                            // ไม่มี items_json → ใช้ handleEditSale ปกติ
                            handleEditSale(rawSale);
                            hasLoadedEditIdRef.current = true;
                        }
                    } catch (err) {
                        console.error('Direct edit load error:', err);
                    }
                };

                const urlParams = new URLSearchParams(window.location.search);
                const editIdParam = urlParams.get('editId');
                if (editIdParam && !hasLoadedEditIdRef.current) {
                    loadEditRecordDirectly(editIdParam);
                }
            }, [products, sales, customers]);

            const formatDisplayNumber = (val) => {
                if (val === '' || val === null || val === undefined) return '';
                const parts = val.toString().split('.');
                parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                return parts.join('.');
            };

            const handleNumberInput = (setter) => (e) => {
                let val = e.target.value.replace(/,/g, '');
                if (val === '') { setter(''); return; }
                if (/^\d*\.?\d*$/.test(val)) {
                    setter(val);
                }
            };

            const handleAddToCart = (productName, priceType = 'ราคาโปร', forceQty = null) => {
                const prodObj = (products || []).find(p => p.name === productName) || {};
                const currentQtyInCart = cart.filter(item => item.productName === productName).reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);
                const addAmount = forceQty !== null ? forceQty : 1;

                if (prodObj.stock < currentQtyInCart + addAmount) {
                    showToast(`ไม่สามารถเพิ่มได้ สต๊อก ${productName} มีไม่พอ (เหลือ ${prodObj.stock} ชิ้น)`, 'error');
                    return;
                }

                let unitPrice = 0;
                if (priceType === 'ราคาเต็ม') unitPrice = parseFloat(prodObj.priceFull || 0);
                else if (priceType === 'ราคาโปร') unitPrice = parseFloat(prodObj.pricePromo || 0);
                else if (priceType === 'ราคาสมาชิก') unitPrice = parseFloat(prodObj.priceMember || 0);
                else if (priceType === 'ราคาศูนย์') unitPrice = 0;

                setCart(prev => {
                    const existingIdx = prev.findIndex(item => item.productName === productName && item.priceType === priceType);
                    if (existingIdx > -1) {
                        const nextCart = [...prev];
                        if (forceQty !== null) nextCart[existingIdx].qty = forceQty;
                        else nextCart[existingIdx].qty = (parseInt(nextCart[existingIdx].qty) || 0) + 1;
                        return nextCart;
                    } else {
                        return [...prev, { productName, priceType, price: unitPrice, qty: forceQty !== null ? forceQty : 1 }];
                    }
                });
            };

            const handleRemoveFromCart = (productName, priceType) => {
                setCart(prev => prev.filter(item => !(item.productName === productName && item.priceType === priceType)));
            };

            const handleUpdateCartQty = (productName, priceType, delta) => {
                if (delta > 0) {
                    const prodObj = (products || []).find(p => p.name === productName) || {};
                    const currentQtyInCart = cart.filter(item => item.productName === productName).reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);
                    if (prodObj.stock <= currentQtyInCart) {
                        showToast(`สต๊อก ${productName} มีจำกัดแค่ ${prodObj.stock} ชิ้น`, 'error');
                        return;
                    }
                }

                setCart(prev => prev.map(item => {
                    if (item.productName === productName && item.priceType === priceType) {
                        return { ...item, qty: Math.max(1, (parseInt(item.qty) || 0) + delta) };
                    }
                    return item;
                }));
            };

            const handleSetCartQty = (productName, priceType, newQtyVal) => {
                if (newQtyVal === '') {
                    setCart(prev => prev.map(item => item.productName === productName && item.priceType === priceType ? { ...item, qty: '' } : item));
                    return;
                }

                let parsedQty = parseInt(newQtyVal, 10);
                if (isNaN(parsedQty)) return;

                const prodObj = (products || []).find(p => p.name === productName) || {};
                const currentQtyInCartOtherTypes = cart.filter(item => item.productName === productName && item.priceType !== priceType).reduce((sum, item) => sum + (parseInt(item.qty) || 0), 0);

                if (prodObj.stock < currentQtyInCartOtherTypes + parsedQty) {
                    showToast(`สต๊อก ${productName} มีจำกัดแค่ ${prodObj.stock} ชิ้น`, 'error');
                    parsedQty = Math.max(1, prodObj.stock - currentQtyInCartOtherTypes);
                }

                setCart(prev => prev.map(item => {
                    if (item.productName === productName && item.priceType === priceType) {
                        return { ...item, qty: parsedQty };
                    }
                    return item;
                }));
            };

            const handleUpdateCartPriceType = (productName, oldPriceType, newPriceType) => {
                const prodObj = (products || []).find(p => p.name === productName) || {};
                let newPrice = 0;
                if (newPriceType === 'ราคาเต็ม') newPrice = parseFloat(prodObj.priceFull || 0);
                else if (newPriceType === 'ราคาโปร') newPrice = parseFloat(prodObj.pricePromo || 0);
                else if (newPriceType === 'ราคาสมาชิก') newPrice = parseFloat(prodObj.priceMember || 0);
                else if (newPriceType === 'ราคาศูนย์') newPrice = 0;

                setCart(prev => {
                    const existingIdx = prev.findIndex(item => item.productName === productName && item.priceType === newPriceType);
                    const oldIdx = prev.findIndex(item => item.productName === productName && item.priceType === oldPriceType);
                    if (oldIdx === -1) return prev;

                    const nextCart = [...prev];
                    const oldQty = parseInt(nextCart[oldIdx].qty) || 0;

                    if (existingIdx > -1 && existingIdx !== oldIdx) {
                        nextCart[existingIdx].qty = (parseInt(nextCart[existingIdx].qty) || 0) + oldQty;
                        return nextCart.filter((_, idx) => idx !== oldIdx);
                    } else {
                        nextCart[oldIdx].priceType = newPriceType;
                        nextCart[oldIdx].price = newPrice;
                        return nextCart;
                    }
                });
            };

            const cartTotals = useMemo(() => {
                let qty = 0; let amount = 0; let baseAmount = 0;
                cart.forEach(item => {
                    const itemQty = parseInt(item.qty) || 0;
                    qty += itemQty;
                    amount += item.price * itemQty;
                    const prodObj = (products || []).find(p => p.name === item.productName) || {};
                    let fPrice = parseFloat(prodObj.priceFull || 0);
                    if (fPrice < item.price) fPrice = item.price;
                    baseAmount += fPrice * itemQty;
                });
                return { qty, amount, baseAmount, discount: baseAmount - amount };
            }, [cart, products]);

            const filteredProductsList = useMemo(() => {
                const search = catalogSearch.trim().toLowerCase();
                return (products || [])
                    .filter(p => p && p.status !== 'เลิกขาย')
                    .map(p => {
                        if (p.isBundle || p.is_bundle) {
                            const baseP = (products || []).find(bp => bp.name === (p.baseProduct || p.base_product));
                            const bQty = Number(p.bundleQty || p.bundle_qty) || 1;
                            const realStock = baseP ? Math.floor((baseP.stock || 0) / bQty) : 0;
                            return { ...p, stock: realStock };
                        }
                        return p;
                    })
                    .filter(p => {
                        return String(p.name || '').toLowerCase().includes(search) ||
                            String(p.id || '').toLowerCase().includes(search) ||
                            String(p.barcode || '').toLowerCase().includes(search) ||
                            (p.category && String(p.category || '').toLowerCase().includes(search));
                    });
            }, [products, catalogSearch]);

            const performSearch = () => {
                const search = catalogSearch.trim().toLowerCase();
                if (!search) return;

                let matchedProd = (products || []).find(p => p && p.status !== 'เลิกขาย' && (String(p.id || '').toLowerCase() === search || String(p.name || '').toLowerCase() === search || String(p.barcode || '').toLowerCase() === search));
                if (!matchedProd) {
                    const matches = filteredProductsList;
                    if (matches.length === 1) matchedProd = matches[0];
                }

                if (matchedProd) {
                    handleAddToCart(matchedProd.name, 'ราคาโปร');
                    setCatalogSearch('');
                    showToast(`เพิ่ม ${matchedProd.name} ลงตะกร้าแล้ว`, 'success');
                } else {
                    showToast(`ไม่พบสินค้า: "${search}"`, 'error');
                }
            };

            const handleBarcodeScan = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    performSearch();
                }
            };

            const handleOldCustomerChange = (searchId) => {
                const foundCust = (customers || []).find(c => c && safeUpper(c.id) === safeUpper(searchId));
                if (foundCust) {
                    const cObj = (closers || []).find(c => c.name === foundCust.closer);

                        closerTeam: cTeam
                    });
                } else {
                    setCustData({ id: searchId, name: '', phone: '', lineId: '', symptom: '', closer: '', closerTeam: '' });
                }
            };

            const handleCancelEdit = () => {

                setCart([]);
                setCustData({ id: '', name: '', phone: '', lineId: '', symptom: '', closer: '', closerTeam: '' });

                setPayTransferThaiTHB('');
                setPayTransferThaiBank('กสิกรไทย');
                setPayTransferLaosTHB('');
                setPayTransferLaosBankTHB('BCEL');
                setPayTransferLaosLAK('');
                setPayTransferLaosBankLAK('BCEL');
                setPaymentNote('');
            };

            const handleEditSale = (record) => {
                setEditingSaleId(record.id);
                setFormData({ date: record.date || getLocalISODate() });
                const mObj = (members || []).find(m => m && String(m.id || '').toUpperCase() === String(record.memberId || '').toUpperCase());
                const mName = mObj ? mObj.name : '';
                setMemberIdInput(mName ? `${record.memberId} - ${mName}` : (record.memberId || ''));

                const saleTypeStr = record.saleType || 'สด';
                let loadedMode = 'สด';

                let lCashTHB = ''; let lCashLAK = '';
                let lThaiTHB = ''; let bThaiTHB = 'กสิกรไทย';
                let lLaosTHB = ''; let bLaosTHB = 'BCEL';
                let lLaosLAK = ''; let bLaosLAK = 'BCEL';

                if (saleTypeStr.includes(':') || saleTypeStr.includes('|')) {
                    const parts = saleTypeStr.split('|').map(p => p.trim());
                    let hasCash = false; let hasTransfer = false;
                    parts.forEach(p => {
                        if (p.startsWith('สดบาท:')) { lCashTHB = p.replace('สดบาท:', '').trim(); hasCash = true; }
                        else if (p.startsWith('สด:')) { lCashTHB = p.replace('สด:', '').trim(); hasCash = true; }
                        else if (p.startsWith('สดกีบ:')) { lCashLAK = p.replace('สดกีบ:', '').trim(); hasCash = true; }
                        else if (p.match(/^โอนไทย\(([^)]+)\):(.*)$/)) {
                            const m = p.match(/^โอนไทย\(([^)]+)\):(.*)$/);
                            bThaiTHB = m[1].trim(); lThaiTHB = m[2].trim(); hasTransfer = true;
                        }
                        else if (p.match(/^โอนลาวบาท\(([^)]+)\):(.*)$/)) {
                            const m = p.match(/^โอนลาวบาท\(([^)]+)\):(.*)$/);
                            bLaosTHB = m[1].trim(); lLaosTHB = m[2].trim(); hasTransfer = true;
                        }
                        else if (p.match(/^โอนลาวกีบ\(([^)]+)\):(.*)$/)) {
                            const m = p.match(/^โอนลาวกีบ\(([^)]+)\):(.*)$/);
                            bLaosLAK = m[1].trim(); lLaosLAK = m[2].trim(); hasTransfer = true;
                        }
                        else if (p.match(/^โอน\(([^)]+)\):(.*)$/)) {
                            const m = p.match(/^โอน\(([^)]+)\):(.*)$/);
                            bThaiTHB = m[1].trim(); lThaiTHB = m[2].trim(); hasTransfer = true;
                        }
                        else if (p.match(/^โอนกีบ\(([^)]+)\):(.*)$/)) {
                            const m = p.match(/^โอนกีบ\(([^)]+)\):(.*)$/);
                            bLaosLAK = m[1].trim(); lLaosLAK = m[2].trim(); hasTransfer = true;
                        }
                    });
                    if (hasCash && hasTransfer) loadedMode = 'สด+โอน';
                    else if (hasTransfer) loadedMode = 'โอน';
                    else loadedMode = 'สด';
                } else {
                    const amt = record.totalAmount ? String(record.totalAmount) : '';
                    if (saleTypeStr.includes('โอน')) {
                        lThaiTHB = amt; loadedMode = 'โอน';
                        const matchBank = saleTypeStr.match(/ธ\.(.+)\)/);
                        if (matchBank) bThaiTHB = matchBank[1];

                    else { lCashTHB = amt; loadedMode = 'สด'; }

                setPayCashTHB(lCashTHB);

                setPayTransferLaosLAK(lLaosLAK);

                setPaymentNote(record.paymentNote || '');

                let cust = (customers || []).find(c => c && safeUpper(c.id) === safeUpper(record.customerId));
                if (!cust && record.customerName) {
                    cust = (customers || []).find(c => c && safeUpper(c.name || c.Name) === safeUpper(record.customerName));
                }

                if (cust) {
                    setCustMode(record.customerType || record.customer_type || cust.type || '');
                    const cObj = (closers || []).find(cl => cl.name === cust.closer);
                    let cTeam = cObj ? cObj.team : '';
                    if (cTeam === 'Team A') cTeam = 'Marketing';
                    if (cTeam === 'Team B') cTeam = 'Center';
                    setCustData({ id: cust.id, name: cust.name || '', phone: cust.phone || '', lineId: cust.lineId || '', symptom: cust.symptom || '', closer: cust.closer || '', closerTeam: cTeam });
                } else {
                    setCustMode(record.customerType || record.customer_type || '');
                    setCustData({ id: record.customerId || '', name: record.customerName || '', phone: '', lineId: '', symptom: '', closer: '', closerTeam: '' });
                }

                const loadedCart = [];
                const allProdNamesInRecord = [...new Set([
                    ...Object.keys(record).filter(k =>
                        (k.endsWith('_ราคาเต็ม') && k !== 'รวมชิ้นราคาเต็ม') ||
                        (k.endsWith('_ราคาโปร') && k !== 'รวมชิ้นราคาโปร') ||
                        (k.endsWith('_ราคาสมาชิก') && k !== 'รวมชิ้นราคาสมาชิก') ||
                        (k.endsWith('_ราคาศูนย์') && k !== 'รวมชิ้นราคาศูนย์')
                    ).map(k => k.replace(/_ราคาเต็ม$|_ราคาโปร$|_ราคาสมาชิก$|_ราคาศูนย์$/, '')),
                    ...activeProductsList
                ])];
                for (const product of allProdNamesInRecord) {
                    const fQty = parseInt(record[`${product}_ราคาเต็ม`], 10) || 0;
                    const pQty = parseInt(record[`${product}_ราคาโปร`], 10) || 0;
                    const mQty = parseInt(record[`${product}_ราคาสมาชิก`], 10) || 0;
                    const zQty = parseInt(record[`${product}_ราคาศูนย์`], 10) || 0;
                    const prodObj = (products || []).find(p => p.name === product) || {};

                    if (fQty > 0) loadedCart.push({ productName: product, priceType: 'ราคาเต็ม', price: parseFloat(prodObj.priceFull || 0), qty: fQty });
                    if (pQty > 0) loadedCart.push({ productName: product, priceType: 'ราคาโปร', price: parseFloat(prodObj.pricePromo || 0), qty: pQty });
                    if (mQty > 0) loadedCart.push({ productName: product, priceType: 'ราคาสมาชิก', price: parseFloat(prodObj.priceMember || 0), qty: mQty });
                    if (zQty > 0) loadedCart.push({ productName: product, priceType: 'ราคาศูนย์', price: 0, qty: zQty });
                }
                setCart(loadedCart);
            };

            const executeDeleteSale = async () => {
                if (!confirmDelete.id) return;
                try {
                    const saleToCancel = dbSalesHistory.find(s => s.id === confirmDelete.id) || sales.find(s => s.id === confirmDelete.id);
                    if (saleToCancel) {

                        let itemsList = [];
                        if (saleToCancel.items_json) {
                            try {
                                itemsList = typeof saleToCancel.items_json === 'string' ? JSON.parse(saleToCancel.items_json) : saleToCancel.items_json;
                            } catch (e) { }
                        }

                        if (!Array.isArray(itemsList) || itemsList.length === 0) {
                            Object.keys(saleToCancel).forEach(key => {
                                const qty = parseInt(saleToCancel[key]) || 0;
                                if (qty > 0) {
                                    // ⚡ FIX: ไม่ตัดวงเล็บทิ้ง ป้องกันปัญหาสินค้าเช่น ZINC(สิว) คืนสต็อกไม่ได้
                                    if (key.endsWith('_ราคาเต็ม') && key !== 'รวมชิ้นราคาเต็ม') itemsList.push({ prod: key.replace('_ราคาเต็ม', ''), qty, priceType: 'ราคาเต็ม' });
                                    else if (key.endsWith('_ราคาสมาชิก') && key !== 'รวมชิ้นราคาสมาชิก') itemsList.push({ prod: key.replace('_ราคาสมาชิก', ''), qty, priceType: 'ราคาสมาชิก' });
                                    else if (key.endsWith('_ราคาโปร') && key !== 'รวมชิ้นราคาโปร') itemsList.push({ prod: key.replace('_ราคาโปร', ''), qty, priceType: 'ราคาโปร' });
                                    else if (key.endsWith('_ราคาศูนย์') && key !== 'รวมชิ้นราคาศูนย์') itemsList.push({ prod: key.replace('_ราคาศูนย์', ''), qty, priceType: 'ราคาศูนย์' });
                                }
                            });
                        }

                        if (itemsList.length > 0) {

                                currentProducts = await supabaseSelect('stk_products').catch(() => []) || [];
