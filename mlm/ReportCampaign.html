        document.documentElement.style.backgroundColor = '#0f172a';

        document.documentElement.style.backgroundColor = '#f8fafc';

  })();

<body class="antialiased overflow-x-hidden selection:bg-blue-600 selection:text-white bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;
    const {
      Sidebar, Header, LoginModal, Toast,
      Trophy, Target, Activity, SearchIcon, Eye, CheckCircle,
      BarChart3, FileText, ChevronDown, Coins, ShieldCheck, X
    } = window;

    // Helper functions
    const safeUp = (val) => String(val || '').trim().toUpperCase();
    const fmtNum = (val) => Number(val || 0).toLocaleString();
    const cleanAvatar = (url, name) => {
      let cleanUrl = String(url || '').trim();
      if (!cleanUrl || cleanUrl === 'undefined' || cleanUrl === 'null' || cleanUrl === '-') {
        return `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'Staff')}&background=1e293b&color=cbd5e1&rounded=true&bold=true`;
      }
      if (cleanUrl.startsWith('/9j/')) {
        cleanUrl = 'data:image/jpeg;base64,' + cleanUrl;
      } else if (cleanUrl.startsWith('iVBORw0KGgo')) {
        cleanUrl = 'data:image/png;base64,' + cleanUrl;
      }
      if (cleanUrl.includes('drive.google.com')) {
        const match = cleanUrl.match(/[-\w]{25,}/);
        const fileId = match ? match[0] : '';
        if (fileId) cleanUrl = 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w300';
      }
      return cleanUrl;
    };
    const fmtCurrency = (val, cur = 'LAK') => {
      const num = Number(val || 0);
      if (cur === 'LAK') return `₭${num.toLocaleString()}`;
      if (cur === 'THB') return `฿${num.toLocaleString()}`;
      return `${num.toLocaleString()} ${cur}`;
    };
    const cleanClinicItemDetails = (str) => {
      if (!str) return '-';
      return String(str)
        .replace(/:\s*[₭฿LAKTHB]?\s*\d+(?:,\d+)*(?:\.\d+)?/gi, '')
        .replace(/\s*[₭฿]\s*\d+(?:,\d+)*(?:\.\d+)?/gi, '')
        .replace(/\s*,\s*/g, ', ')
        .replace(/^[\s,:]+|[\s,:]+$/g, '')
        .trim() || '-';
    };

    const CAMPAIGNS_CACHE_KEY = 'stk_campaigns_cache';
    const SELECTED_CAMP_KEY = 'stk_selected_campaign_id';
    const EVAL_CACHE_PREFIX = 'stk_rep_campaign_eval_';

    // Synchronous initial cache loaders (0ms instant mount)
    const getInitialCampaigns = () => {
      try {
        const saved = localStorage.getItem(CAMPAIGNS_CACHE_KEY);
        if (saved) {
          const p = JSON.parse(saved);
          if (Array.isArray(p) && p.length > 0) return p;
        }
        const appCache = localStorage.getItem('stk_app_cache_data');
        if (appCache) {
          const p = JSON.parse(appCache);
          if (Array.isArray(p.campaigns) && p.campaigns.length > 0) return p.campaigns;
        }
      } catch(e) {}
      return [];
    };

    const getInitialCampaignId = (camps) => {
      try {
        const urlId = new URLSearchParams(window.location.search).get('campaignId');
        if (urlId) return urlId;
        const savedId = localStorage.getItem(SELECTED_CAMP_KEY);
        if (savedId && camps.some(c => c.campaign_id === savedId)) return savedId;
        const active = camps.find(c => c.status === 'active') || camps[0];
        return active ? active.campaign_id : (savedId || '');
      } catch(e) {
        return '';
      }
    };

    const getInitialEvalCache = (cId) => {
      if (!cId) return null;
      try {
        const raw = localStorage.getItem(EVAL_CACHE_PREFIX + cId) || sessionStorage.getItem(EVAL_CACHE_PREFIX + cId);
        if (raw) {
          const p = JSON.parse(raw);
          if (p && Array.isArray(p.data) && p.data.length > 0) return p;
        }
      } catch(e) {}
      return null;
    };

    function App() {
      // 1. Core States with Instant Local Cache
      const [currentUser, setCurrentUser] = useState(() => {
        try {
          const saved = localStorage.getItem('stk_current_user');
          return saved ? JSON.parse(saved) : null;
        } catch(e) { return null; }
      });

      const initialCamps = useMemo(() => getInitialCampaigns(), []);
      const [campaigns, setCampaigns] = useState(initialCamps);

      const [selectedCampaignId, setSelectedCampaignId] = useState(() => getInitialCampaignId(initialCamps));

      const initialEvalCache = useMemo(() => {
        const cId = selectedCampaignId || getInitialCampaignId(initialCamps);
        return getInitialEvalCache(cId);
      }, []);

      const [evaluationResults, setEvaluationResults] = useState(() => initialEvalCache ? initialEvalCache.data : []);
      // ⚡ INSTANT RENDER: ถ้ามีแคชใน localStorage อยู่แล้ว ไม่ต้องแสดง Loading Spinner เลย (0ms)
      const [isLoading, setIsLoading] = useState(() => !initialEvalCache);
      const [isBgLoading, setIsBgLoading] = useState(false);
      const [toast, setToast] = useState(null);

      // Filters
      const [searchTerm, setSearchTerm] = useState('');
      const [filterTeam, setFilterTeam] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL'); // 'ALL' | 'QUALIFIED' | 'IN_PROGRESS'
      const [sortBy, setSortBy] = useState('rank'); // 'rank' | 'points' | 'boxes' | 'deducted'

      // Drilldown Modal
      const [drilldownMember, setDrilldownMember] = useState(null);
      const [drilldownTab, setDrilldownTab] = useState('clinic'); // 'clinic' | 'mlm'

      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try {
          return localStorage.getItem('stk_sidebar_collapsed') === 'true';
        } catch (e) {
          return false;
        }
      });
      const [showLoginModal, setShowLoginModal] = useState(false);

      const isLoggedIn = !!currentUser;
      const isAdmin = currentUser?.role === 'ผู้ดูแลระบบ' || currentUser?.role === 'ADMIN' || currentUser?.permission_role === 'ADMIN' || currentUser?.permission_role === 'ผู้ดูแลระบบ';

      const handleLogout = () => {
        localStorage.removeItem('stk_current_user');
        setCurrentUser(null);
        window.location.reload();
      };

      const showToast = (message, type = 'info') => {
        setToast({ message, type });
      };

      // เปลี่ยนแคมเปญ พร้อมสลับแคชทันที 0ms
      const handleSelectCampaign = useCallback((cId) => {
        setSelectedCampaignId(cId);
        try { localStorage.setItem(SELECTED_CAMP_KEY, cId); } catch(e) {}
        const cached = getInitialEvalCache(cId);
        if (cached && Array.isArray(cached.data) && cached.data.length > 0) {
          setEvaluationResults(cached.data);
          setIsLoading(false);
        } else {
          setIsLoading(true);
        }
      }, []);

      // 2. Fetch all campaigns in background (เงียบๆ ไม่บล็อกหน้าจอ)
      useEffect(() => {
        async function loadCampaigns() {
          try {
            const camps = await window.CampaignEngine.fetchAllCampaigns();
            if (camps && camps.length > 0) {
              setCampaigns(camps);
              try { localStorage.setItem(CAMPAIGNS_CACHE_KEY, JSON.stringify(camps)); } catch(e) {}

              const urlParamId = new URLSearchParams(window.location.search).get('campaignId');
              if (urlParamId && camps.some(c => c.campaign_id === urlParamId)) {
                setSelectedCampaignId(urlParamId);
                try { localStorage.setItem(SELECTED_CAMP_KEY, urlParamId); } catch(e) {}
              } else if (!selectedCampaignId || !camps.some(c => c.campaign_id === selectedCampaignId)) {
                const activeOne = camps.find(c => c.status === 'active') || camps[0];
                if (activeOne) {
                  setSelectedCampaignId(activeOne.campaign_id);
                  try { localStorage.setItem(SELECTED_CAMP_KEY, activeOne.campaign_id); } catch(e) {}
                }
              }
            }
          } catch (err) {
            console.error('Load campaigns error:', err);
          }
        }
        loadCampaigns();
      }, []);

      const activeCampaign = useMemo(() => {
        return campaigns.find(c => c.campaign_id === selectedCampaignId) || null;
      }, [campaigns, selectedCampaignId]);

      const isCurrentNoDeduct = useMemo(() => {
        return activeCampaign && (activeCampaign.deduct_policy === 'no_deduct' || activeCampaign.cond2_type === 'boxes_no_deduct');
      }, [activeCampaign]);

      // 3. Evaluate Campaign Cross-DB with Intelligent Persistent Cache & Silent Sentinel Background Check
      const runEvaluation = useCallback(async (forceLive = false) => {
        if (!activeCampaign) return;
        const cId = activeCampaign.campaign_id;
        const startDate = String(activeCampaign.start_date || '').trim().substring(0, 10);
        const endDate = String(activeCampaign.end_date || '').trim().substring(0, 10);
        const CACHE_KEY = EVAL_CACHE_PREFIX + cId;

        // ─── TIER 0: ตรวจสอบ Persistent Cache ทันที (0ms, 0 Network, 0 Egress) ───
        let cachedObj = null;
        try {
          const raw = localStorage.getItem(CACHE_KEY) || sessionStorage.getItem(CACHE_KEY);
          if (raw) cachedObj = JSON.parse(raw);
        } catch(e) {}

        const hasValidCache = cachedObj && Array.isArray(cachedObj.data) && cachedObj.data.length > 0;
        const cacheAge = Date.now() - (cachedObj?.timestamp || 0);

        // แสดงผลจากแคชทันทีหากมี และปลดสถานะ Loading ทันที (0ms)
        if (hasValidCache) {
          setEvaluationResults(cachedObj.data);
          setIsLoading(false);
        }

        // หากแคชเพิ่งสร้างไม่เกิน 5 นาที และไม่ได้สั่งบังคับรีเฟรช ให้จบการทำงานทันที (0 Egress)
        if (!forceLive && hasValidCache && cacheAge < 5 * 60 * 1000) {
          setIsBgLoading(false);
          return;
        }

        // ─── TIER 1: ตรวจสอบการยิงข้อมูลใหม่หลังบ้านแบบ Lightweight Sentinel (Egress < 500 bytes) ───
        // หากมีแคชอยู่แล้ว แทนที่จะดาวน์โหลดทั้งฐานข้อมูล ให้เช็คแค่ ID แถวล่าสุด (limit=1)
        if (!forceLive && hasValidCache) {
          try {
            const [latestSale, latestClinic] = await Promise.all([
              (window.supabaseSelect ? window.supabaseSelect('stk_sales', 'select=id,created_at&order=created_at.desc&limit=1') : Promise.resolve([])).catch(() => []),
              (window.clinicSupabaseSelect ? window.clinicSupabaseSelect('commission_logs', 'select=id,created_at&order=created_at.desc&limit=1') : Promise.resolve([])).catch(() => [])
            ]);

            const currentSaleId = latestSale?.[0]?.id || null;
            const currentClinicId = latestClinic?.[0]?.id || null;

            // ถ้าไม่มีบิลขายใหม่ และไม่มีคนไข้คลินิกใหม่ -> ถือว่าไม่มีข้อมูลใหม่ ไม่ต้องคำนวณซ้ำ ประหยัด Egress 100%
            if (
              cachedObj.lastSaleId && cachedObj.lastClinicId &&
              cachedObj.lastSaleId === currentSaleId &&
              cachedObj.lastClinicId === currentClinicId
            ) {
              cachedObj.timestamp = Date.now();
              try {
                localStorage.setItem(CACHE_KEY, JSON.stringify(cachedObj));
                sessionStorage.setItem(CACHE_KEY, JSON.stringify(cachedObj));
              } catch(e) {}
              setIsBgLoading(false);
              return;
            }
          } catch(sentinelErr) {
            console.warn('Sentinel check error, continuing background evaluation:', sentinelErr);
          }
        }

        // ─── TIER 2: กรณีไม่มีแคชเลยในเครื่อง ให้ดึงจากตาราง stk_campaign_results ก่อน (< 100ms) ───
        if (!hasValidCache && !forceLive && typeof window.CampaignEngine.fetchSavedCampaignResults === 'function') {
          try {
            const savedData = await window.CampaignEngine.fetchSavedCampaignResults(cId);
            if (Array.isArray(savedData) && savedData.length > 0) {
              const mapped = savedData.map(row => {
                const dj = row.details_json || {};
                const qBoxes = Number(row.boxes_qualifying_quota || (row.is_qualified ? 5 : 0));
                const isQual = !!row.is_qualified;
                const isNoDed = row.deduct_policy === 'no_deduct';
                const cDeducted = (isQual && !isNoDed) ? (qBoxes * 250000) : 0;
                const rDeducted = (isQual && !isNoDed) ? (qBoxes * 200000) : 0;
                return {
                  memberId: row.member_id,
                  memberName: row.member_name,
                  profileUrl: null,
                  team: row.team_name,
                  teamName: row.team_name,
                  clinicPatientCount: Number(row.clinic_patients_count || 0),
                  clinicAbiPoints: Number(row.clinic_abi_points || 0),
                  clinicCompPoints: Number(row.clinic_comprehensive_points || 0),
                  clinicTotalPoints: Number(row.clinic_total_points || 0),
                  clinicTargetPoints: Number(row.clinic_target_points || 5),
                  clinicPassed: !!row.clinic_passed,
                  patientVisits: dj.patientVisits || [],
                  boxesTotalCount: Number(row.boxes_total_count || 0),
                  boxesQualifyingQuota: qBoxes,
                  boxesSurplusCount: Number(row.boxes_surplus_count || 0),
                  boxesTarget: Number(row.boxes_target || 5),
                  boxesMinPrice: Number(row.boxes_min_price || 1500),
                  boxesPassed: !!row.boxes_passed,
                  qualifyingSalesDetails: dj.qualifyingSalesDetails || [],
                  isNoDeduct: isNoDed,
                  policyLabel: isNoDed ? 'ไม่ตัดกล่อง (เก็บสถิติ/จ่ายเงินเต็ม 100%)' : 'ตัดกล่องโปรโมชั่น',
                  referralDeducted: rDeducted,
                  commissionDeducted: cDeducted,
                  totalDeducted: cDeducted,
                  deductionBreakdown: dj.deduction_breakdown || {
                    isNoDeduct: isNoDed,
                    quotaBoxes: qBoxes,
                    surplusBoxes: Number(row.boxes_surplus_count || 0),
                    referralDeducted: rDeducted,
                    commissionDeducted: cDeducted,
                    totalDeducted: cDeducted
                  },
                  isQualified: !!row.is_qualified,
                  currency: row.currency || 'LAK',
                  status: row.status || (row.is_qualified ? 'QUALIFIED' : 'IN_PROGRESS')
                };
              });

              setEvaluationResults(mapped);
              setIsLoading(false);

              try {
                localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data: mapped }));
              } catch(e) {}
            }
          } catch (e) {
            console.warn('Tier 2 saved campaign results load error:', e);
          }
        }

        // ─── TIER 3: ประมวลผลสด Cross-Database ดึงอยู่หลังบ้าน (ไม่บล็อก UI ตาราง) ───
        setIsBgLoading(true);
        try {
          let membersRes = [];
          let teamsRes = [];
          try {
            const cachedApp = localStorage.getItem('stk_app_cache_data');
            if (cachedApp) {
              const parsedApp = JSON.parse(cachedApp);
              if (Array.isArray(parsedApp.members) && parsedApp.members.length > 0) membersRes = parsedApp.members;
              if (Array.isArray(parsedApp.businessTeams) && parsedApp.businessTeams.length > 0) teamsRes = parsedApp.businessTeams;
            }
          } catch (e) {}

          let salesQuery = 'select=id,order_id,date,seller_id,customer_id,customer_name,total_amount,total_bottles,status,items_json,payment_note,created_at&order=created_at.desc';
          if (startDate) salesQuery += `&date=gte.${startDate}`;
          if (endDate) salesQuery += `&date=lte.${endDate}`;

          const [salesRes, fetchedMembers, fetchedTeams, latestSaleSentinel, latestClinicSentinel] = await Promise.all([
            (window.supabaseSelect ? window.supabaseSelect('stk_sales', salesQuery) : Promise.resolve([])).catch(() => []),
            (!membersRes.length && window.supabaseSelect) ? window.supabaseSelect('stk_members', 'order=user_id.asc').catch(() => []) : Promise.resolve(membersRes),
            (!teamsRes.length && window.supabaseSelect) ? window.supabaseSelect('stk_business_teams').catch(() => []) : Promise.resolve(teamsRes),
            (window.supabaseSelect ? window.supabaseSelect('stk_sales', 'select=id&order=created_at.desc&limit=1') : Promise.resolve([])).catch(() => []),
            (window.clinicSupabaseSelect ? window.clinicSupabaseSelect('commission_logs', 'select=id&order=created_at.desc&limit=1') : Promise.resolve([])).catch(() => [])
          ]);

          let finalSales = salesRes;
          if ((!finalSales || finalSales.length === 0) && window.supabaseSelect) {
            finalSales = await window.supabaseSelect('stk_sales', 'order=created_at.desc&limit=1000').catch(() => []);
          }

          const evaluated = await window.CampaignEngine.evaluateCampaignCrossDB(activeCampaign, {
            allSales: finalSales || [],
            allMembers: (fetchedMembers && fetchedMembers.length > 0) ? fetchedMembers : membersRes,
            allBusinessTeams: (fetchedTeams && fetchedTeams.length > 0) ? fetchedTeams : teamsRes
          });

          if (Array.isArray(evaluated) && evaluated.length > 0) {
            setEvaluationResults(evaluated);

            const payloadToSave = {
              timestamp: Date.now(),
              lastSaleId: latestSaleSentinel?.[0]?.id || null,
              lastClinicId: latestClinicSentinel?.[0]?.id || null,
              data: evaluated
            };

            // บันทึก Persistent Cache ทั้ง localStorage และ sessionStorage
            try {
              localStorage.setItem(CACHE_KEY, JSON.stringify(payloadToSave));
              sessionStorage.setItem(CACHE_KEY, JSON.stringify(payloadToSave));
            } catch (e) {}

            // ซิงค์บันทึกผลลงตาราง stk_campaign_results แบบ Batch Background
            if (typeof window.CampaignEngine.syncAndSaveCampaignResults === 'function') {
              window.CampaignEngine.syncAndSaveCampaignResults(activeCampaign, evaluated, 'SYNCED').catch(e => console.warn('Auto-sync error:', e));
            }
          }
        } catch (err) {
          console.error('Evaluate cross db error:', err);
          if (!hasValidCache) {
            showToast('เกิดข้อผิดพลาดในการคำนวณผลแคมเปญ: ' + err.message, 'error');
          }
        } finally {
          setIsLoading(false);
          setIsBgLoading(false);
        }
      }, [activeCampaign]);

      useEffect(() => {
        if (activeCampaign) {
          runEvaluation();
        }
      }, [activeCampaign, runEvaluation]);

      // Teams list for filter
      const availableTeams = useMemo(() => {
        const teams = new Set();
        evaluationResults.forEach(item => {
          const t = item.teamName || item.team_name || item.team;
          if (t) teams.add(t);
        });
        return Array.from(teams).sort();
      }, [evaluationResults]);

      // 4. Combined & Filtered Rows (จากผลการประเมินที่ซิงค์ลงฐานข้อมูลเรียบร้อยแล้ว)
      const displayRows = useMemo(() => {
        let rows = evaluationResults;

        // Search Filter
        if (searchTerm.trim()) {
          const term = searchTerm.toLowerCase().trim();
          rows = rows.filter(r =>
            String(r.memberName || '').toLowerCase().includes(term) ||
            String(r.memberId || '').toLowerCase().includes(term) ||
            String(r.teamName || '').toLowerCase().includes(term)
          );
        }

        // Team Filter
        if (filterTeam !== 'ALL') {
          rows = rows.filter(r => (r.teamName || r.team) === filterTeam);
        }

        // Status Filter
        if (filterStatus === 'QUALIFIED') {
          rows = rows.filter(r => r.isQualified);
        } else if (filterStatus === 'IN_PROGRESS') {
          rows = rows.filter(r => !r.isQualified);
        }

        // Sorting
        return [...rows].sort((a, b) => {
          if (sortBy === 'points') {
            return (b.clinicTotalPoints || 0) - (a.clinicTotalPoints || 0);
          }
          if (sortBy === 'boxes') {
            return (b.boxesTotalCount || 0) - (a.boxesTotalCount || 0);
          }
          if (sortBy === 'deducted') {
            return (b.commissionDeducted || 0) - (a.commissionDeducted || 0);
          }
          // Default: Rank
          if (a.isQualified !== b.isQualified) return a.isQualified ? -1 : 1;
          if (b.clinicTotalPoints !== a.clinicTotalPoints) return (b.clinicTotalPoints || 0) - (a.clinicTotalPoints || 0);
          return (b.boxesTotalCount || 0) - (a.boxesTotalCount || 0);
        });
      }, [evaluationResults, searchTerm, filterTeam, filterStatus, sortBy]);

      // Summary KPIs
      const kpis = useMemo(() => {
        const totalMarketing = evaluationResults.length;
        const qualifiedCount = evaluationResults.filter(r => r.isQualified).length;
        const totalClinicPoints = evaluationResults.reduce((acc, r) => acc + (r.clinicTotalPoints || 0), 0);
        const totalQuotaBoxes = evaluationResults.filter(r => r.isQualified).reduce((acc, r) => acc + (r.boxesQualifyingQuota || 0), 0);
        const totalSurplusBoxes = evaluationResults.reduce((acc, r) => acc + (r.boxesSurplusCount || 0), 0);
        const totalDeducted = evaluationResults.reduce((acc, r) => acc + (r.commissionDeducted || r.totalDeducted || 0), 0);

        return {
          totalMarketing,
          qualifiedCount,
          totalClinicPoints,
          totalQuotaBoxes,
          totalSurplusBoxes,
          totalDeducted
        };
      }, [evaluationResults]);

      // 5. Export to Excel
      const handleExportExcel = () => {
        if (!activeCampaign || displayRows.length === 0) {

                    <span className="text-slate-400">สรุปการหักคอมมิชชั่น:</span>{' '}
                    <b className="text-rose-600 dark:text-rose-400">
                      {drilldownMember.isQualified ? fmtCurrency(drilldownMember.commissionDeducted, drilldownMember.currency) : '₭0 (ไม่ถูกหัก)'}
                    </b>
                  </div>
                  <button
                    onClick={() => setDrilldownMember(null)}
                    className="px-5 py-2 rounded-xl text-xs font-black bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-300 transition-colors"
                  >
                    ปิดหน้าต่าง
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toast && (
            <Toast
              message={toast.message}
              type={toast.type}
              onClose={() => setToast(null)}
            />
          )}

          {/* Login Modal */}
          {showLoginModal && (
            <LoginModal 
              isOpen={showLoginModal} 
              onClose={() => setShowLoginModal(false)} 
              onSuccess={(user) => {
                setCurrentUser(user);
                setShowLoginModal(false);
              }} 
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
