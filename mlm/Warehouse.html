        <rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>

    // =========================================================================
    // MAIN APP COMPONENT
    // =========================================================================
    function WarehouseApp() {
      // 1. Session & Auth State
      const [currentUser, setCurrentUser] = useState(() => {
        try { return JSON.parse(localStorage.getItem('stk_current_user') || 'null'); } catch(e) { return null; }
      });
      const [showLoginModal, setShowLoginModal] = useState(!localStorage.getItem('stk_current_user'));
      const [toast, setToast] = useState({ show: false, message: '', type: 'info' });
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch(e) { return false; }
      });

      const companyInfo = useMemo(() => {
        try {
          if (typeof window.getCompanySettings === 'function') {
            return window.getCompanySettings();
          }
          const direct = localStorage.getItem('stk_company_settings');
          if (direct) return JSON.parse(direct);
        } catch(e){}
        return {
          name: 'LOVE STK GROUPE',
          branch: 'สำนักงานใหญ่ / คลินิกเวชกรรม',
          address: 'เวียงจันทน์, สปป.ลาว (Vientiane, Lao PDR)',
          phone: '+856 20 85387291',
          taxId: '',
          logoUrl: ''
        };
      }, []);

      // 🔐 Auth Handlers & Permissions
      const handleLoginSuccess = useCallback((user) => {
        try {
          localStorage.setItem('stk_current_user', JSON.stringify(user));
        } catch(e){}
        setCurrentUser(user);
        setShowLoginModal(false);
        setToast({ show: true, message: `ยินดีต้อนรับคุณ ${user.name || user.username || 'ผู้ใช้งาน'}!`, type: 'success' });
        setTimeout(() => setToast(prev => ({ ...prev, show: false })), 4000);
      }, []);

      const handleLogout = useCallback(() => {
        if (typeof window.performGlobalLogout === 'function') {
          window.performGlobalLogout(() => {
            setCurrentUser(null);
            setShowLoginModal(true);
          });
        } else {
          try { localStorage.removeItem('stk_current_user'); } catch(e){}
          setCurrentUser(null);
          setShowLoginModal(true);
          setToast({ show: true, message: 'ออกจากระบบเรียบร้อยแล้ว', type: 'info' });
          setTimeout(() => setToast(prev => ({ ...prev, show: false })), 4000);
        }
      }, []);

      // ตรวจสอบสถานะการเข้าใช้งาน ถ้าไม่ได้ล็อกอินให้เปิด Modal ทันที
      useEffect(() => {
        if (!currentUser) {
          setShowLoginModal(true);
        }
      }, [currentUser]);

      const isAdmin = currentUser?.role === 'แอดมิน' || currentUser?.permission_role === 'admin' || currentUser?.permission_role === 'ADMIN';
      const userStockPerm = (typeof window.getUserPagePermission === 'function' && currentUser)
        ? window.getUserPagePermission(currentUser, 'stock')
        : (currentUser ? 'view' : 'none');
      const canAccessWarehouse = !currentUser ? false : (isAdmin || userStockPerm !== 'none');

      // 🌓 Theme Sync (Light / Dark mode link)
      const [, forceThemeUpdate] = useReducer(x => x + 1, 0);
      useEffect(() => {
        const onThemeChange = () => forceThemeUpdate();
        window.addEventListener('stk_theme_change', onThemeChange);
        return () => window.removeEventListener('stk_theme_change', onThemeChange);
      }, []);

      // 🌐 Language Sync
      const [, forceLangUpdate] = useReducer(x => x + 1, 0);
      useEffect(() => {
        const onLangChange = () => forceLangUpdate();
        window.addEventListener('stk_lang_change', onLangChange);
        return () => window.removeEventListener('stk_lang_change', onLangChange);
      }, []);

      const t = (key, fallback) => (typeof window.t === 'function' ? window.t(key, fallback) : (fallback || key));

      const showToast = (message, type = 'info') => {
        setToast({ show: true, message, type });
        setTimeout(() => setToast(prev => ({ ...prev, show: false })), 4000);
      };

      // 2. Multi-Domain & Tabs
      const [activeDomain, setActiveDomain] = useState('SUPPLEMENT'); // SUPPLEMENT | PHARMACY | MEDICAL_DEVICE
      const [activeTab, setActiveTab] = useState('overview'); // overview | stockin | transfer | audit | ledger

      // 3. Data States (Cached & Live) - Instant Stale-While-Revalidate Render
      const getCachedData = (key, fallback = []) => {
        try {
          const val = sessionStorage.getItem(key) || localStorage.getItem(key);
          return val ? JSON.parse(val) : fallback;
        } catch(e) {
          return fallback;
        }
      };

      const cachedProductsInit = getCachedData('stk_warehouse_products', []);
      const [products, setProducts] = useState(cachedProductsInit);
      const [lots, setLots] = useState(() => getCachedData('stk_warehouse_lots', []));
      const [transfers, setTransfers] = useState(() => getCachedData('stk_warehouse_transfers', []));
      const [movements, setMovements] = useState(() => getCachedData('stk_warehouse_movements', []));
      const [loading, setLoading] = useState(cachedProductsInit.length === 0);
      const [refreshing, setRefreshing] = useState(false);

      // Search & Filters
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedStatusFilter, setSelectedStatusFilter] = useState('ALL');
      const [inventorySortBy, setInventorySortBy] = useState('product_id'); // 'product_id' | 'name' | 'mainStock' | 'frontStock' | 'totalStock' | 'expiry'
      const [inventorySortOrder, setInventorySortOrder] = useState('asc'); // 'asc' | 'desc'
      const [inventoryTypeFilter, setInventoryTypeFilter] = useState('ALL'); // 'ALL' | 'PHYSICAL' | 'BUNDLE'

      // Date state for Audit & Ledger
      const todayISO = (typeof window.getLocalISODate === 'function') ? window.getLocalISODate() : new Date().toISOString().split('T')[0];
      const [auditDate, setAuditDate] = useState(todayISO);
      const [ledgerDate, setLedgerDate] = useState(todayISO);
      const [ledgerDetailOpen, setLedgerDetailOpen] = useState(true);
      const [ledgerBalances, setLedgerBalances] = useState([]);
      const [isLoadingLedger, setIsLoadingLedger] = useState(false);
      const [auditHistorySessions, setAuditHistorySessions] = useState([]);
      const [isLoadingAuditHistory, setIsLoadingAuditHistory] = useState(false);
      const [auditSavedInfo, setAuditSavedInfo] = useState(null);
      const [auditRecordsCache, setAuditRecordsCache] = useState(() => getCachedData('stk_warehouse_audit_cache', []));

      // Physical Count State for Daily Audit: { [productId]: countNumber }
      const [physicalCounts, setPhysicalCounts] = useState({});
      const [dailySalesMap, setDailySalesMap] = useState({});
      const [auditNotes, setAuditNotes] = useState('');
      const [isSavingAudit, setIsSavingAudit] = useState(false);

      // 📍 Map จุดอ้างอิงปิดยอดล่าสุดของแต่ละสินค้า (Latest Daily Balance Checkpoint Map)
      const latestCheckpointMap = useMemo(() => {
        const map = {};
        if (!Array.isArray(auditRecordsCache) || auditRecordsCache.length === 0) return map;
        const sorted = [...auditRecordsCache].sort((a, b) => (b.balance_date || '').localeCompare(a.balance_date || ''));
        sorted.forEach(row => {
          const pid = row.product_id;
          if (!pid) return;
          if (!map[pid]) {
            const closing = (row.physical_count_qty !== null && row.physical_count_qty !== undefined)
              ? Number(row.physical_count_qty)
              : Number(row.system_closing_qty || 0);
            map[pid] = {
              date: row.balance_date,
              stock: closing,
              physicalCount: row.physical_count_qty,
              systemClosing: row.system_closing_qty,
              status: row.audit_status
            };
          }
        });
        return map;
      }, [auditRecordsCache]);

      // Multi-Item Stock In (GRN) States
      const [grnSubTab, setGrnSubTab] = useState('form'); // 'form' | 'history'
      const [grnHeader, setGrnHeader] = useState({
        grnId: '',
        date: todayISO,
        warehouseId: 'MAIN_WH',
        supplier: '',
        notes: '',
        receivedBy: currentUser?.name || 'ADMIN'
      });
      const [grnItems, setGrnItems] = useState([
        {
          tempId: 'row-1',
          productId: '',
          lotId: '',
          mfgDate: '',
          expiryDate: '',
          qty: '',
          costPrice: ''
        }
      ]);
      const [grnHistoryList, setGrnHistoryList] = useState([]);
      const [grnHistorySearch, setGrnHistorySearch] = useState('');
      const [isSubmittingGrn, setIsSubmittingGrn] = useState(false);
      const [printGrnSlipData, setPrintGrnSlipData] = useState(null);
      const [viewGrnDetailModal, setViewGrnDetailModal] = useState(null);

      // Multi-Item Transfer Requisition (TRF) States
      const [transferSubTab, setTransferSubTab] = useState('form'); // 'form' | 'history'
      const [transferHeader, setTransferHeader] = useState({
        transferId: '',
        date: todayISO,
        fromWarehouse: 'MAIN_WH',
        toWarehouse: 'FRONT_STORE',
        requestedBy: currentUser?.name || 'ADMIN',
        notes: ''
      });
      const [transferItems, setTransferItems] = useState([
        {
          tempId: 'trf-row-1',
          productId: '',
          lotId: '',
          qty: ''
        }
      ]);
      const [transferHistoryList, setTransferHistoryList] = useState([]);
      const [transferHistorySearch, setTransferHistorySearch] = useState('');
      const [isSubmittingTransfer, setIsSubmittingTransfer] = useState(false);
      const [printSlipData, setPrintSlipData] = useState(null);
      const [printLedgerData, setPrintLedgerData] = useState(null);
      const [printOrientation, setPrintOrientation] = useState('landscape'); // 'landscape' | 'portrait'
      const [viewTransferDetailModal, setViewTransferDetailModal] = useState(null);

      // Lot Breakdown Detail Modal
      const [selectedProductForLots, setSelectedProductForLots] = useState(null);

      // 4. Data Fetching: Parallel Live Sync (Stale-While-Revalidate)
      const loadWarehouseData = useCallback(async (isSilent = false, forceRefresh = false) => {
        // 🛡️ AUTH GUARD: ถ้ายังไม่ได้เข้าสู่ระบบหรือไม่ได้รับอนุญาต ห้ามยิงเรียกข้อมูล (ประหยัด Egress 100%)
        if (!currentUser || !canAccessWarehouse) {
          setLoading(false);
          setRefreshing(false);
          return;
        }

        // ถ้ามีข้อมูลสินค้าเดิมแสดงอยู่แล้ว จะไม่ขึ้นหน้าหมุนเต็มจอให้ผู้ใช้ต้องรอ (Zero Loading Wait)
        if (!isSilent && products.length === 0) {
          setLoading(true);
        } else {
          setRefreshing(true);
        }

        try {
          if (forceRefresh && typeof window.invalidateTableCache === 'function') {
            window.invalidateTableCache('stk_products');
            window.invalidateTableCache('stk_warehouse_transfers');
            window.invalidateTableCache('stk_stock_movements');
          }

          const cacheParam = forceRefresh ? '&nocache=true' : '';

          // ⚡ ยิงคำขอทั้งหมดพร้อมกันแบบ Parallel (Promise.allSettled) ลดเวลารอจาก 4-5 วินาที เหลือเพียง ~400ms
          const fetchProductsPromise = (async () => {
            if (typeof window.supabaseSelect !== 'function') return [];
            try {
              if (activeDomain === 'PHARMACY') {
                const pharmaRes = await window.supabaseSelect('pharma_drugs', 'select=drug_id,trade_name,generic_name,strength,drug_category,unit_dispense,price_retail,price_cost,status&order=trade_name.asc&limit=1000' + cacheParam);
                if (Array.isArray(pharmaRes) && pharmaRes.length > 0) {
                  return pharmaRes.map(d => ({
                    product_id: d.drug_id,
                    name: `${d.trade_name}${d.strength ? ' ' + d.strength : ''}${d.generic_name ? ' (' + d.generic_name + ')' : ''}`,
                    category: `ยาหลวง / ${d.drug_category || 'ทั่วไป'}`,
                    price_member: d.price_retail || 0,
                    price_full: d.price_retail || 0,
                    current_stock: 0,
                    status: d.status || 'ACTIVE'
                  }));
                }
              } else if (activeDomain === 'MEDICAL_DEVICE') {
                const medRes = await window.supabaseSelect('med_equipment', 'select=item_id,name,item_type,brand,model_no,unit,price_cost,status&order=name.asc&limit=1000' + cacheParam);
                if (Array.isArray(medRes) && medRes.length > 0) {
                  return medRes.map(m => ({
                    product_id: m.item_id,
                    name: `${m.name}${m.brand ? ' (' + m.brand + ')' : ''}`,
                    category: `เครื่องมือแพทย์ / ${m.item_type || 'ทั่วไป'}`,
                    price_member: m.price_cost || 0,
                    price_full: m.price_cost || 0,
                    current_stock: 0,
                    status: m.status || 'ACTIVE'
                  }));
                }
              }
              const res = await window.supabaseSelect('stk_products', 'select=product_id,name,category,price_member,price_full,current_stock,barcode,image_url,status,is_bundle,base_product,bundle_qty&order=name.asc&limit=1000' + cacheParam);
              return Array.isArray(res) ? res : [];
            } catch(e) {
              console.warn('fetchProducts error:', e);
              return [];
            }
          })();

          const fetchLotsPromise = (async () => {
            if (window.StockLogic?.fetchLotsWithExpiry) {
              try {
                return await window.StockLogic.fetchLotsWithExpiry(null, activeDomain);
              } catch(e) {
                console.warn('fetchLots error:', e);
              }
            }
            return [];
          })();

          const fetchTransfersPromise = (async () => {
            if (typeof window.supabaseSelect === 'function') {
              try {
                return await window.supabaseSelect('stk_warehouse_transfers', 'select=transfer_id,transfer_date,from_warehouse,to_warehouse,domain_type,items_json,total_items,status,created_at&order=created_at.desc&limit=50' + cacheParam);
              } catch(e) {
                console.warn('fetchTransfers error:', e);
              }
            }
            return [];
          })();

          const fetchMovementsPromise = (async () => {
            if (typeof window.supabaseSelect === 'function') {
              try {
                // ดึงความเคลื่อนไหวล่าสุดเฉพาะคอลัมน์สำคัญ (ประหยัด Egress สูงสุด)
                return await window.supabaseSelect('stk_stock_movements', 'select=movement_id,date,product_id,type,sub_type,quantity,notes,created_at&order=created_at.desc&limit=100' + cacheParam);
              } catch(e) {
                console.warn('fetchMovements error:', e);
              }
            }
            return [];
          })();

          const fetchAuditBalancePromise = (async () => {
            if (typeof window.supabaseSelect === 'function') {
              try {
                // ดึงประวัติปิดยอดสต็อกล่าสุด 300 รายการ เป็น Checkpoint ให้ทุกสินค้าในคราวเดียว
                return await window.supabaseSelect('stk_daily_balance', 'select=id,balance_date,warehouse_id,product_id,opening_qty,transfer_in_qty,transfer_out_qty,sales_qty,system_closing_qty,physical_count_qty,diff_qty,audited_by,audit_status,audit_notes,created_at&order=balance_date.desc&limit=300' + cacheParam);
              } catch(e) {
                console.warn('fetchAuditBalance error:', e);
              }
            }
            return [];
          })();

          const fetchGrnPromise = (async () => {
            if (window.StockLogic?.fetchGrnHistory) {
              try {
                return await window.StockLogic.fetchGrnHistory(activeDomain);
              } catch(e) {
                console.warn('fetchGrn error:', e);
              }
            }
            return [];
          })();

          const fetchTrfHistoryPromise = (async () => {
            if (window.StockLogic?.fetchTransferHistory) {
              try {
                return await window.StockLogic.fetchTransferHistory(activeDomain);
              } catch(e) {
                console.warn('fetchTrfHistory error:', e);
              }
            }
            return [];
          })();

          const fetchSalesPromise = (async () => {
            if (auditDate && typeof window.supabaseSelect === 'function') {
              try {
                return await window.supabaseSelect('stk_sales', `select=date,items_json,status&date=eq.${auditDate}&limit=300` + cacheParam);
              } catch(e) {
                console.warn('fetchSales error:', e);
              }
            }
            return [];
          })();

          // ดึงข้อมูลทั้ง 8 คำสั่งพร้อมกันในระดับ Network Pipeline
          const [
            prodResult,
            lotsResult,
            transfersResult,
            movementsResult,
            auditResult,
            grnResult,
            trfHistResult,
            salesResult
          ] = await Promise.allSettled([
            fetchProductsPromise,
            fetchLotsPromise,
            fetchTransfersPromise,
            fetchMovementsPromise,
            fetchAuditBalancePromise,
            fetchGrnPromise,
            fetchTrfHistoryPromise,
            fetchSalesPromise
          ]);

          // บันทึกและอัปเดต Products
          if (prodResult.status === 'fulfilled' && Array.isArray(prodResult.value) && prodResult.value.length > 0) {
            setProducts(prodResult.value);
            try { sessionStorage.setItem('stk_warehouse_products', JSON.stringify(prodResult.value)); } catch(e){}
          }

          // บันทึกและอัปเดต Lots
          if (lotsResult.status === 'fulfilled' && Array.isArray(lotsResult.value)) {
            setLots(lotsResult.value);
            try { sessionStorage.setItem('stk_warehouse_lots', JSON.stringify(lotsResult.value)); } catch(e){}
          }

          // บันทึกและอัปเดต Transfers
          if (transfersResult.status === 'fulfilled' && Array.isArray(transfersResult.value)) {
            setTransfers(transfersResult.value);
            try { sessionStorage.setItem('stk_warehouse_transfers', JSON.stringify(transfersResult.value)); } catch(e){}
          }

          // บันทึกและอัปเดต Movements
          if (movementsResult.status === 'fulfilled' && Array.isArray(movementsResult.value)) {
            setMovements(movementsResult.value);
            try { sessionStorage.setItem('stk_warehouse_movements', JSON.stringify(movementsResult.value)); } catch(e){}
          }

          // บันทึกและอัปเดต Audit Balance & Checkpoint Cache
          if (auditResult.status === 'fulfilled' && Array.isArray(auditResult.value) && auditResult.value.length > 0) {
            setAuditRecordsCache(auditResult.value);
            try { sessionStorage.setItem('stk_warehouse_audit_cache', JSON.stringify(auditResult.value)); } catch(e){}

            // สร้าง Session History สรุปผลทันทีจากข้อมูลในหน่วยความจำ
            const sessionMap = {};
            auditResult.value.forEach(row => {
              const key = `${row.balance_date}_${row.warehouse_id || 'FRONT_STORE'}`;
              if (!sessionMap[key]) {
                sessionMap[key] = {
                  date: row.balance_date,
                  warehouseId: row.warehouse_id || 'FRONT_STORE',
                  auditedBy: row.audited_by || 'ADMIN',
                  notes: row.audit_notes || '',
                  createdAt: row.created_at,
                  totalItems: 0,
                  countedItems: 0,
                  balancedItems: 0,
                  diffItems: 0,
                  hasDiscrepancy: false
                };
              }
              sessionMap[key].totalItems += 1;
              if (row.physical_count_qty !== null && row.physical_count_qty !== undefined) {
                sessionMap[key].countedItems += 1;
                const diff = Number(row.diff_qty !== null && row.diff_qty !== undefined ? row.diff_qty : (Number(row.physical_count_qty) - Number(row.system_closing_qty || 0)));
                if (diff === 0) sessionMap[key].balancedItems += 1;
                else { sessionMap[key].diffItems += 1; sessionMap[key].hasDiscrepancy = true; }
              }
            });
            setAuditHistorySessions(Object.values(sessionMap).sort((a, b) => b.date.localeCompare(a.date)));

            // อัปเดตข้อมูลของ auditDate ถ้ามีบันทึกในระบบ
            const currentDayRecords = auditResult.value.filter(b => b.balance_date === auditDate);
            if (currentDayRecords.length > 0) {
              const countMap = {};
              let loadedNotes = '';
              currentDayRecords.forEach(b => {
                if (b.physical_count_qty !== null && b.physical_count_qty !== undefined) {
                  countMap[b.product_id] = b.physical_count_qty;
                }
                if (b.audit_notes && !loadedNotes) loadedNotes = b.audit_notes;
              });
              setPhysicalCounts(countMap);
              if (loadedNotes) setAuditNotes(loadedNotes);
              setAuditSavedInfo({
                date: auditDate,
                auditedBy: currentDayRecords[0]?.audited_by || 'ADMIN',
                count: currentDayRecords.length,
                updatedAt: currentDayRecords[0]?.created_at,
                hasPhysicalCount: currentDayRecords.some(b => b.physical_count_qty !== null && b.physical_count_qty !== undefined)
              });
            } else {
              setPhysicalCounts({});
              setAuditSavedInfo(null);
            }
          }

          // บันทึกและอัปเดต Daily Sales Map (ยอดขายสำเร็จจริง)
          if (salesResult.status === 'fulfilled' && Array.isArray(salesResult.value)) {
            const sMap = {};
            salesResult.value.forEach(bill => {
              const bStatus = String(bill.status || '').toUpperCase();
              if (bStatus === 'CANCELLED' || bStatus === 'ยกเลิก' || bStatus === 'DELETED') return;
              let items = [];
              if (bill.items_json) {
                try { items = typeof bill.items_json === 'string' ? JSON.parse(bill.items_json) : bill.items_json; } catch(e){}
              }
              if (Array.isArray(items)) {
                items.forEach(it => {
                  let pid = String(it.product_id || it.productId || it.id || '').trim();
                  const pName = String(it.product_name || it.productName || it.name || it.prod || '').trim().toLowerCase();
                  if (!pid && pName) {
                    const foundP = (prodResult.value || products || []).find(p => String(p.name || '').trim().toLowerCase() === pName);
                    if (foundP) pid = foundP.product_id;
                  }
                  const q = Number(it.qty || it.quantity || 0);
                  if (pid && q > 0) {
                    sMap[pid] = (sMap[pid] || 0) + q;
                  }
                });
              }
            });
            setDailySalesMap(sMap);
          }

          // บันทึกและอัปเดต GRN History
          if (grnResult.status === 'fulfilled' && Array.isArray(grnResult.value)) {
            setGrnHistoryList(grnResult.value);
          }

          // บันทึกและอัปเดต Transfer History
          if (trfHistResult.status === 'fulfilled' && Array.isArray(trfHistResult.value)) {
            setTransferHistoryList(trfHistResult.value);
          }

        } catch (err) {
          console.error('Error loading warehouse data:', err);
          showToast('เกิดข้อผิดพลาดในการโหลดข้อมูลคลังสินค้า', 'error');
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      }, [activeDomain, auditDate, products.length, currentUser, canAccessWarehouse]);

      useEffect(() => {
        if (!currentUser || !canAccessWarehouse) return;
        // หากมีแคชอยู่แล้ว ให้โหลดเงียบๆ อัปเดตพื้นหลัง (Stale-While-Revalidate)
        const hasCache = products && products.length > 0;
        loadWarehouseData(hasCache);
      }, [activeDomain, currentUser, canAccessWarehouse]);

      // Load daily audit balances & daily sales when auditDate changes
      useEffect(() => {
        if (!currentUser || !canAccessWarehouse || !auditDate || typeof window.supabaseSelect !== 'function') return;
        (async () => {
          try {
            // 1. ตรวจสอบข้อมูลปิดยอดของ auditDate จาก cache ในหน่วยความจำก่อน (Zero Egress!)
            let matchingBal = (auditRecordsCache || []).filter(b => b.balance_date === auditDate);
            if (matchingBal.length === 0) {
              const balRes = await window.supabaseSelect('stk_daily_balance', `balance_date=eq.${auditDate}&select=id,balance_date,warehouse_id,product_id,opening_qty,transfer_in_qty,transfer_out_qty,sales_qty,system_closing_qty,physical_count_qty,diff_qty,audited_by,audit_status,audit_notes,created_at&limit=200`).catch(() => []);
              if (Array.isArray(balRes) && balRes.length > 0) {
                matchingBal = balRes;
                setAuditRecordsCache(prev => [...balRes, ...(prev || []).filter(p => p.balance_date !== auditDate)]);
              }
            }

            if (matchingBal.length > 0) {
              const countMap = {};
              let loadedNotes = '';
              matchingBal.forEach(b => {
                if (b.physical_count_qty !== null && b.physical_count_qty !== undefined) {
                  countMap[b.product_id] = b.physical_count_qty;
                }
                if (b.audit_notes && !loadedNotes) {
                  loadedNotes = b.audit_notes;
                }
              });
              setPhysicalCounts(countMap);
              if (loadedNotes) setAuditNotes(loadedNotes);
              setAuditSavedInfo({
                date: auditDate,
                auditedBy: matchingBal[0]?.audited_by || 'ADMIN',
                count: matchingBal.length,
                updatedAt: matchingBal[0]?.created_at,
                hasPhysicalCount: matchingBal.some(b => b.physical_count_qty !== null && b.physical_count_qty !== undefined)
              });
            } else {
              setPhysicalCounts({});
              setAuditSavedInfo(null);
            }

            // 2. ดึงยอดขายประจำวัน เฉพาะคอลัมน์จำเป็นและจำกัดขอบเขต
            const salesRes = await window.supabaseSelect('stk_sales', `date=eq.${auditDate}&select=bill_id,date,items_json,status&limit=500`).catch(() => []);
            if (Array.isArray(salesRes)) {
              const sMap = {};
              salesRes.forEach(bill => {
                const bStatus = String(bill.status || '').toUpperCase();
                if (bStatus === 'CANCELLED' || bStatus === 'ยกเลิก' || bStatus === 'DELETED') return;
                let items = [];
                if (bill.items_json) {
                  try { items = typeof bill.items_json === 'string' ? JSON.parse(bill.items_json) : bill.items_json; } catch(e){}
                }
                if (Array.isArray(items)) {
                  items.forEach(it => {
                    let pid = String(it.product_id || it.productId || it.id || '').trim();
                    const pName = String(it.product_name || it.productName || it.name || it.prod || '').trim().toLowerCase();
                    if (!pid && pName) {
                      const foundP = (products || []).find(p => String(p.name || '').trim().toLowerCase() === pName);
                      if (foundP) pid = foundP.product_id;
                    }
                    const q = Number(it.qty || it.quantity || 0);
                    if (pid && q > 0) {
                      sMap[pid] = (sMap[pid] || 0) + q;
                    }
                  });
                }
              });
              setDailySalesMap(sMap);
            }
          } catch(e) {
            console.warn('auditDate fetch balance/sales error:', e);
          }
        })();
      }, [auditDate, products, auditRecordsCache]);

      // โหลดประวัติกระทบยอดตามวันที่กำหนด (Ledger)
      const loadLedgerBalances = useCallback(async (targetDate) => {
        const d = targetDate || ledgerDate;
        if (!d || typeof window.supabaseSelect !== 'function') return;
        setIsLoadingLedger(true);
        try {
          // ตรวจสอบใน auditRecordsCache ก่อน ถ้ามีไม่ต้องยิง Network (ประหยัด Egress 100%)
          const matched = (auditRecordsCache || []).filter(r => r.balance_date === d);
          if (matched.length > 0) {
            setLedgerBalances(matched);
            setIsLoadingLedger(false);
            return;
          }
          const balRes = await window.supabaseSelect('stk_daily_balance', `balance_date=eq.${d}&select=id,balance_date,warehouse_id,product_id,opening_qty,transfer_in_qty,transfer_out_qty,sales_qty,system_closing_qty,physical_count_qty,diff_qty,audited_by,audit_status,audit_notes,created_at&limit=200`);
          if (Array.isArray(balRes)) {
            setLedgerBalances(balRes);
          } else {
            setLedgerBalances([]);
          }
        } catch(e) {
          console.warn('loadLedgerBalances error:', e);
        } finally {
          setIsLoadingLedger(false);
        }
      }, [ledgerDate, auditRecordsCache]);

      // โหลดสรุปประวัติการตรวจนับทั้งหมด (Sessions History) - ใช้คอลัมน์น้ำหนักเบา ประหยัดโควต้า
      const loadAuditHistorySessions = useCallback(async () => {
        // ถ้า auditRecordsCache มีข้อมูลอยู่แล้ว ให้ประมวลผลจาก Cache ในหน่วยความจำเลย (Zero Egress!)
        if (Array.isArray(auditRecordsCache) && auditRecordsCache.length > 0) {
          const sessionMap = {};
          auditRecordsCache.forEach(row => {
            const key = `${row.balance_date}_${row.warehouse_id || 'FRONT_STORE'}`;
            if (!sessionMap[key]) {
              sessionMap[key] = {
                date: row.balance_date,
                warehouseId: row.warehouse_id || 'FRONT_STORE',
                auditedBy: row.audited_by || 'ADMIN',
                notes: row.audit_notes || '',
                createdAt: row.created_at,
                totalItems: 0,
                countedItems: 0,
                balancedItems: 0,
                diffItems: 0,
                hasDiscrepancy: false
              };
            }
            sessionMap[key].totalItems += 1;
            if (row.physical_count_qty !== null && row.physical_count_qty !== undefined) {
              sessionMap[key].countedItems += 1;
              const diff = Number(row.diff_qty !== null && row.diff_qty !== undefined ? row.diff_qty : (Number(row.physical_count_qty) - Number(row.system_closing_qty || 0)));
              if (diff === 0) {
                sessionMap[key].balancedItems += 1;
              } else {
                sessionMap[key].diffItems += 1;
                sessionMap[key].hasDiscrepancy = true;
              }
            }
          });
          const list = Object.values(sessionMap).sort((a, b) => b.date.localeCompare(a.date));
          setAuditHistorySessions(list);
          return;
        }

        if (typeof window.supabaseSelect !== 'function') return;
        setIsLoadingAuditHistory(true);
        try {
          const res = await window.supabaseSelect('stk_daily_balance', 'select=id,balance_date,warehouse_id,product_id,opening_qty,transfer_in_qty,transfer_out_qty,sales_qty,system_closing_qty,physical_count_qty,diff_qty,audited_by,audit_status,audit_notes,created_at&order=balance_date.desc&limit=300');
          if (Array.isArray(res) && res.length > 0) {
            setAuditRecordsCache(res);
            const sessionMap = {};
            res.forEach(row => {
              const key = `${row.balance_date}_${row.warehouse_id || 'FRONT_STORE'}`;
              if (!sessionMap[key]) {
                sessionMap[key] = {
                  date: row.balance_date,
                  warehouseId: row.warehouse_id || 'FRONT_STORE',
                  auditedBy: row.audited_by || 'ADMIN',
                  notes: row.audit_notes || '',
                  createdAt: row.created_at,
                  totalItems: 0,
                  countedItems: 0,
                  balancedItems: 0,
                  diffItems: 0,
                  hasDiscrepancy: false
                };
              }
              sessionMap[key].totalItems += 1;
              if (row.physical_count_qty !== null && row.physical_count_qty !== undefined) {
                sessionMap[key].countedItems += 1;
                const diff = Number(row.diff_qty !== null && row.diff_qty !== undefined ? row.diff_qty : (Number(row.physical_count_qty) - Number(row.system_closing_qty || 0)));
                if (diff === 0) {
                  sessionMap[key].balancedItems += 1;
                } else {
                  sessionMap[key].diffItems += 1;
                  sessionMap[key].hasDiscrepancy = true;
                }
              }
            });
            const list = Object.values(sessionMap).sort((a, b) => b.date.localeCompare(a.date));
            setAuditHistorySessions(list);
          } else {
            setAuditHistorySessions([]);
          }
        } catch(e) {
          console.warn('loadAuditHistorySessions error:', e);
        } finally {
          setIsLoadingAuditHistory(false);
        }
      }, [auditRecordsCache]);

      // Load ledger balances when ledgerDate changes
      useEffect(() => {
        loadLedgerBalances(ledgerDate);
      }, [ledgerDate, loadLedgerBalances]);

      // Load audit history sessions initially
      useEffect(() => {
        loadAuditHistorySessions();
      }, [loadAuditHistorySessions]);

      // ฟังก์ชันตรวจสอบสินค้าที่เลิกขาย / ปิดการขาย / ยกเลิก
      const isProductDiscontinued = useCallback((p) => {
        if (!p) return false;
        const st = String(p.status || '').trim().toLowerCase();
        return st === 'เลิกขาย' || st === 'ยกเลิก' || st === 'ปิดการขาย' || st === 'ปิด' || st === 'inactive' || st === 'discontinued' || st === 'disabled';
      }, []);

      // Filtered Products by active domain & search (กรองสินค้าเลิกขายออกทันทีตามคำสั่ง)
      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          if (isProductDiscontinued(p)) return false;
          // Domain filter (Supplements are default products; Pharmacy & Medical can be mapped by category or custom domain)
          if (activeDomain === 'PHARMACY') {
            const cat = String(p.category || '').toLowerCase();
            const isPharma = cat.includes('ยา') || cat.includes('pharma') || cat.includes('เวชภัณฑ์');
            if (!isPharma) return false;
          } else if (activeDomain === 'MEDICAL_DEVICE') {
            const cat = String(p.category || '').toLowerCase();
            const isMed = cat.includes('อุปกรณ์') || cat.includes('เครื่องมือ') || cat.includes('device');
            if (!isMed) return false;
          }

          if (searchQuery.trim()) {
            const q = searchQuery.toLowerCase().trim();
            const matchName = String(p.name || '').toLowerCase().includes(q);
            const matchId = String(p.product_id || '').toLowerCase().includes(q);
            const matchBarcode = String(p.barcode || '').toLowerCase().includes(q);
            if (!matchName && !matchId && !matchBarcode) return false;
          }
          return true;
        });
      }, [products, activeDomain, searchQuery]);

      // ตรวจสอบสินค้ามัดชุด / เซ็ตโปรโมชั่น (Virtual Promo Bundle)
      const isPromoBundleProduct = useCallback((p) => {
        if (!p) return false;
        return Boolean(
          p.is_bundle || 
          p.isBundle || 
          p.category === 'Promotion' || 
          String(p.category || '').toLowerCase().includes('promotion') ||
          String(p.category || '').includes('โปร') ||
          String(p.product_id || p.id || '').toUpperCase().startsWith('PRO')
        );
      }, []);

      // ดึงข้อมูลสินค้าหลักและตัวคูณของสินค้าจัดชุด
      const resolveBundleBaseInfo = useCallback((p, allProducts) => {
        let baseName = p.base_product || p.baseProduct || '';
        let bQty = Number(p.bundle_qty || p.bundleQty) || 0;

        // หากไม่มีข้อมูล ให้แกะจากชื่อสินค้า เช่น "LipoC : 3 กล่อง" หรือ "Lutine : 3 กล่อง"
        if (!baseName || bQty <= 0) {
          const colonMatch = String(p.name || '').match(/^(.*?)\s*[:：]\s*(\d+)\s*(?:กล่อง|ชิ้น|ขวด|กระปุก|ชุด|เซ็ต)?/i);
          if (colonMatch) {
            if (!baseName) baseName = colonMatch[1].trim();
            if (bQty <= 0) bQty = parseInt(colonMatch[2], 10) || 1;
          }
        }
        if (bQty <= 0) {
          const boxMatch = String(p.name || '').match(/(\d+)\s*(?:กล่อง|ชิ้น|ขวด|กระปุก|ชุด|เซ็ต)/i);
          bQty = boxMatch ? (parseInt(boxMatch[1], 10) || 1) : 1;
        }

        // ค้นหาสินค้าหลักจากรายการสินค้าทั้งหมด
        let baseProd = null;
        if (baseName && Array.isArray(allProducts)) {
          const cleanTarget = String(baseName).toLowerCase().replace(/\(.*?\)/g, '').trim();
          baseProd = allProducts.find(item => {
            if (item.product_id === baseName) return true;
            const cleanPName = String(item.name || '').toLowerCase().replace(/\(.*?\)/g, '').trim();
            return cleanPName === cleanTarget || cleanPName.includes(cleanTarget) || cleanTarget.includes(cleanPName);
          });
        }

        return {
          baseName: baseProd ? baseProd.name : (baseName || 'สินค้าหลัก'),
          baseProductId: baseProd ? baseProd.product_id : '',
          baseProduct: baseProd,
          bundleQty: bQty || 1
        };
      }, []);

      // Calculate Stock per Product by Warehouse
      const productStockSummary = useMemo(() => {
        const map = {};

        // 1. สร้าง Map ตั้งต้น
        filteredProducts.forEach(p => {
          const isBundle = isPromoBundleProduct(p);
          const liveCurrentStock = Number(p.current_stock !== undefined && p.current_stock !== null ? p.current_stock : (p.stock || 0));
          map[p.product_id] = {
            product: p,
            isPromoBundle: isBundle,
            baseInfo: null,
            mainStock: 0,
            frontStock: 0,
            totalStock: isBundle ? 0 : Math.max(0, liveCurrentStock),
            earliestExpiry: null,
            earliestStatus: 'NORMAL',
            daysRemaining: null,
            lotCount: 0,
            frontEvents: []
          };
        });

        // 2. ดึงวันหมดอายุจากล็อต (เอาแค่ FEFO ไม่เอายอดมาคำนวณคลังใหญ่แล้ว)
        lots.forEach(lot => {
          const pid = lot.product_id;
          if (map[pid] && !map[pid].isPromoBundle) {
            map[pid].lotCount += 1;
            const cleanExp = lot.expiry_date ? String(lot.expiry_date).split('T')[0] : null;
            if (cleanExp && (!map[pid].earliestExpiry || cleanExp < map[pid].earliestExpiry)) {
              map[pid].earliestExpiry = cleanExp;
              map[pid].earliestStatus = lot.statusTag || 'NORMAL';
              map[pid].daysRemaining = lot.daysRemaining;
            }
          }
        });

        // 3. กวาดประวัติเบิกเข้าหน้าร้าน (TRANSFER IN)
        const combinedTransfers = [...(transfers || []), ...(transferHistoryList || [])];
        const processedTrfIds = new Set();
        combinedTransfers.forEach(tr => {
          if (!tr || tr.status === 'CANCELLED') return;
          const trfId = String(tr.transfer_id || '');
          if (trfId && processedTrfIds.has(trfId)) return;
          if (trfId) processedTrfIds.add(trfId);

          const toWh = String(tr.to_warehouse || '').toUpperCase();
          if (toWh === 'FRONT_STORE' || toWh.includes('FRONT')) {
            let trItems = [];
            if (tr.items_json) { try { trItems = typeof tr.items_json === 'string' ? JSON.parse(tr.items_json) : tr.items_json; } catch(e){} }
            if (Array.isArray(trItems)) {
              const trTime = tr.created_at || (tr.transfer_date ? tr.transfer_date + 'T00:00:00Z' : '') || tr.date || '';
              trItems.forEach(it => {
                let pid = it.productId || it.product_id || it.id;
                const q = Number(it.qty || it.quantity || 0);
                if (map[pid] && !map[pid].isPromoBundle && q > 0) {
                  map[pid].frontEvents.push({ type: 'TRANSFER_IN', time: trTime, qty: q });
                }
              });
            }
          }
        });

        // 4. กวาดประวัติการขาย และคืนสินค้า (บังคับให้การขายทุกอย่างหักจากหน้าร้านเสมอ)
        (movements || []).forEach(m => {
          const pid = m.product_id;
          if (!map[pid] || map[pid].isPromoBundle) return;
          const q = Number(m.quantity || 0);
          if (q <= 0) return;

          const subType = String(m.sub_type || '').toLowerCase();
          const notesStr = String(m.notes || '').toLowerCase();
          const mTime = m.created_at || (m.date ? m.date + 'T00:00:00Z' : '') || '';

          const isTransfer = subType.includes('เบิก') || notesStr.includes('เบิก') || m.type === 'TRANSFER';
          if (isTransfer) return;

          const isGrn = subType.includes('รับสินค้า') || subType.includes('รับเข้า') || notesStr.includes('grn');
          if (isGrn) return;

          if (m.type === 'OUT') {
            map[pid].frontEvents.push({ type: 'SALE_OUT', time: mTime, qty: q });
          } else if (m.type === 'IN') {
            map[pid].frontEvents.push({ type: 'SALE_RETURN', time: mTime, qty: q });
          }
        });

        // 5. จัดสรรสต๊อกตาม Checkpoint + Delta (หน้าร้าน = ยอดปิดล่าสุด + เบิกเข้าสะสม - ขายสะสม, คลังใหญ่ = ยอดรวม - หน้าร้าน)
        Object.values(map).forEach(item => {
          if (!item.isPromoBundle) {
            const pid = item.product.product_id;

            // 5.1 ตรวจสอบว่าในวันที่กำลังตรวจนับ มีการกรอกยอดนับจริงหรือไม่
            const hasActivePhysicalCount = (physicalCounts[pid] !== undefined && physicalCounts[pid] !== null && physicalCounts[pid] !== '');

            // 5.2 จุดอ้างอิงปิดยอดล่าสุด (Checkpoint) จากตาราง stk_daily_balance
            const cp = latestCheckpointMap[pid];

            if (hasActivePhysicalCount) {
              // ถ้ามีการใส่นับจริงในวันตรวจนับ ให้ล็อกหน้าร้านตามค่านั้นทันที
              item.frontStock = Number(physicalCounts[pid]);
            } else if (cp) {
              // ใช้ Snapshot จากวันที่ปิดยอดล่าสุด (เช่น 2026-10-07 ได้ 57 ชิ้น)
              const baseStock = Number(cp.stock || 0);
              const cpDate = cp.date;

              // คำนวณเฉพาะ Transaction ที่เกิดขึ้น "หลังจาก" วันที่ปิดยอดล่าสุด (Delta Since Checkpoint)
              let deltaIn = 0;
              let deltaOut = 0;

              // เบิกเข้าหน้าร้านหลังวัน Checkpoint
              combinedTransfers.forEach(tr => {
                if (!tr || tr.status === 'CANCELLED') return;
                const trDate = (tr.transfer_date || tr.created_at || '').slice(0, 10);
                if (trDate > cpDate) {
                  const toWh = String(tr.to_warehouse || '').toUpperCase();
                  if (toWh === 'FRONT_STORE' || toWh.includes('FRONT')) {
                    let trItems = [];
                    if (tr.items_json) { try { trItems = typeof tr.items_json === 'string' ? JSON.parse(tr.items_json) : tr.items_json; } catch(e){} }
                    if (Array.isArray(trItems)) {
                      trItems.forEach(it => {
                        const trPid = it.productId || it.product_id || it.id;
                        if (trPid === pid) {
                          deltaIn += Number(it.qty || it.quantity || 0);
                        }
                      });
                    }
                  }
                }
              });

              // รายการขาย และ คืนสินค้า หลังวัน Checkpoint
              (movements || []).forEach(m => {
                if (m.product_id !== pid) return;
                const mDate = (m.date || m.created_at || '').slice(0, 10);
                if (mDate > cpDate) {
                  const q = Number(m.quantity || 0);
                  if (q <= 0) return;
                  const subType = String(m.sub_type || '').toLowerCase();
                  const notesStr = String(m.notes || '').toLowerCase();
                  const isTransfer = subType.includes('เบิก') || notesStr.includes('เบิก') || m.type === 'TRANSFER';
                  const isGrn = subType.includes('รับสินค้า') || subType.includes('รับเข้า') || notesStr.includes('grn');
                  if (!isTransfer && !isGrn) {
                    if (m.type === 'OUT') deltaOut += q;
                    else if (m.type === 'IN') deltaIn += q;
                  }
                }
              });

              item.frontStock = Math.max(0, baseStock + deltaIn - deltaOut);
            } else {
              // กรณีสินค้าใหม่ยังไม่เคยผ่านการตรวจนับปิดยอด ให้ใช้ runningFront ตั้งต้น
              const getTimeMs = (t) => { if (!t) return 0; const ms = new Date(t).getTime(); return isNaN(ms) ? 0 : ms; };

              item.frontEvents.sort((a, b) => {
                const diff = getTimeMs(a.time) - getTimeMs(b.time);
                if (diff !== 0) return diff;
                if (a.type === 'TRANSFER_IN' && b.type !== 'TRANSFER_IN') return -1;
                if (b.type === 'TRANSFER_IN' && a.type !== 'TRANSFER_IN') return 1;
                return 0;
              });

              let runningFront = 0;
              item.frontEvents.forEach(ev => {
                if (ev.type === 'TRANSFER_IN') runningFront += ev.qty;
                else if (ev.type === 'SALE_OUT') runningFront = Math.max(0, runningFront - ev.qty);
                else if (ev.type === 'SALE_RETURN') runningFront += ev.qty;
              });

              item.frontStock = Math.max(0, runningFront);
            }

            // ป้องกันไม่ให้หน้าร้านเยอะกว่ายอดรวม
            item.frontStock = Math.min(item.totalStock, item.frontStock);

            // 5.3 คลังใหญ่ = สต๊อกรวมทั้งระบบ - สต๊อกหน้าร้าน
            item.mainStock = Math.max(0, item.totalStock - item.frontStock);
          }
        });

        // 6. คำนวณสต๊อกสินค้าเซ็ต (Bundle)
        Object.values(map).forEach(item => {
          if (item.isPromoBundle) {
            const baseInfo = resolveBundleBaseInfo(item.product, products);
            item.baseInfo = baseInfo;
            const baseStockItem = baseInfo.baseProductId ? map[baseInfo.baseProductId] : null;
            if (baseStockItem) {
              const bQty = baseInfo.bundleQty;
              item.mainStock = Math.floor(baseStockItem.mainStock / bQty);
              item.frontStock = Math.floor(baseStockItem.frontStock / bQty);
              item.totalStock = Math.floor(baseStockItem.totalStock / bQty);
              item.earliestExpiry = baseStockItem.earliestExpiry;
              item.earliestStatus = baseStockItem.earliestStatus;
              item.daysRemaining = baseStockItem.daysRemaining;
              item.lotCount = baseStockItem.lotCount;
            }
          }
        });

        return Object.values(map);
      }, [filteredProducts, lots, products, transfers, transferHistoryList, movements, physicalCounts, latestCheckpointMap, isPromoBundleProduct, resolveBundleBaseInfo]);
      
      // สลับการจัดเรียงคอลัมน์ในตารางคลังสินค้า
      const handleToggleInventorySort = useCallback((col) => {
        if (inventorySortBy === col) {
          setInventorySortOrder(prev => prev === 'asc' ? 'desc' : 'asc');
        } else {
          setInventorySortBy(col);
          setInventorySortOrder(['mainStock', 'frontStock', 'totalStock'].includes(col) ? 'desc' : 'asc');
        }
      }, [inventorySortBy]);

      // รายการสินค้าที่จะแสดงในตารางคลังสินค้า พร้อมการจัดหมวดหมู่ กรอง และจัดเรียงอย่างเป็นระเบียบสวยงาม
      const displayedStockItems = useMemo(() => {
        let list = [...productStockSummary];

        // 1. กรองประเภทสินค้า (สินค้าหลัก / สินค้าชุดโปรโมชั่น)
        if (inventoryTypeFilter === 'PHYSICAL') {
          list = list.filter(item => !item.isPromoBundle);
        } else if (inventoryTypeFilter === 'BUNDLE') {
          list = list.filter(item => item.isPromoBundle);
        }

        // 2. กรองตามสถานะวันหมดอายุ (FEFO)
        if (selectedStatusFilter === 'EXPIRING') {
          list = list.filter(item => item.daysRemaining !== null && item.daysRemaining <= 90 && item.daysRemaining > 0);
        } else if (selectedStatusFilter === 'CRITICAL') {
          list = list.filter(item => item.daysRemaining !== null && item.daysRemaining <= 30 && item.daysRemaining > 0);
        } else if (selectedStatusFilter === 'EXPIRED') {
          list = list.filter(item => item.daysRemaining !== null && item.daysRemaining <= 0);
        }

        // 3. จัดเรียงข้อมูล (Natural Alphanumeric Sorting)
        list.sort((a, b) => {
          let cmp = 0;
          if (inventorySortBy === 'product_id') {
            // เมื่อเลือก 'ทั้งหมด' และเรียงปกติ: ให้สินค้าหลักขึ้นก่อนเป็นระเบียบ ตามด้วยเซ็ตโปรโมชั่น
            if (inventoryTypeFilter === 'ALL' && a.isPromoBundle !== b.isPromoBundle) {
              cmp = a.isPromoBundle ? 1 : -1;
            } else {
              cmp = String(a.product.product_id || '').localeCompare(
                String(b.product.product_id || ''),
                undefined,
                { numeric: true, sensitivity: 'base' }
              );
            }
          } else if (inventorySortBy === 'name') {
            cmp = String(a.product.name || '').localeCompare(
              String(b.product.name || ''),
              'th',
              { sensitivity: 'base' }
            );
          } else if (inventorySortBy === 'mainStock') {
            cmp = (a.mainStock || 0) - (b.mainStock || 0);
          } else if (inventorySortBy === 'frontStock') {
            cmp = (a.frontStock || 0) - (b.frontStock || 0);
          } else if (inventorySortBy === 'totalStock') {
            const totA = a.totalStock || 0;
            const totB = b.totalStock || 0;
            cmp = totA - totB;
          } else if (inventorySortBy === 'expiry') {
            const expA = a.earliestExpiry || '9999-12-31';
            const expB = b.earliestExpiry || '9999-12-31';
            cmp = expA.localeCompare(expB);
          }

          return inventorySortOrder === 'desc' ? -cmp : cmp;
        });

        return list;
      }, [productStockSummary, inventoryTypeFilter, selectedStatusFilter, inventorySortBy, inventorySortOrder]);

      // KPI Aggregations (นับเฉพาะสินค้าจริง ไม่นำเซ็ตโปรโมชั่นมาบวกทบสต๊อกคลัง)
      const kpis = useMemo(() => {
        let physicalSkus = 0;
        let promoSkus = 0;
        let mainUnits = 0;
        let frontUnits = 0;
        let totalUnits = 0;
        let nearExpiryCount = 0;
        let expiredCount = 0;

        productStockSummary.forEach(item => {
          if (item.isPromoBundle) {
            promoSkus++;
            // ข้ามไม่รวมจำนวนชิ้นของสินค้าจัดชุด เพื่อป้องกันการนับซ้ำกับสินค้าหลัก
            return;
          }
          physicalSkus++;
          mainUnits += item.mainStock;
          frontUnits += item.frontStock;
          totalUnits += item.totalStock;
          if (item.earliestStatus === 'WARNING' || item.earliestStatus === 'CRITICAL') nearExpiryCount++;
          if (item.earliestStatus === 'EXPIRED') expiredCount++;
        });

        return { 
          totalSkus: physicalSkus, 
          promoSkus, 
          allSkus: physicalSkus + promoSkus, 
          mainUnits, 
          frontUnits, 
          totalUnits, 
          nearExpiryCount, 
          expiredCount 
        };
      }, [productStockSummary]);

      // Auto-generate Lot Number helper
      // Multi-Item GRN Helpers
      const generateGrnNumber = useCallback(() => {
        const dateCode = todayISO.replace(/-/g, '').slice(2);
        const rand = Math.floor(100 + Math.random() * 900);
        return `GRN-${dateCode}-${rand}`;
      }, [todayISO]);

      const loadGrnHistory = useCallback(async () => {
        if (window.StockLogic?.fetchGrnHistory) {
          try {
            const list = await window.StockLogic.fetchGrnHistory(activeDomain);
            setGrnHistoryList(list || []);
          } catch(e) {
            console.warn('loadGrnHistory error:', e);
          }
        }
      }, [activeDomain]);

      useEffect(() => {
        if (activeTab === 'stockin' && grnSubTab === 'history') {
          loadGrnHistory();
        }
      }, [activeTab, grnSubTab, loadGrnHistory]);

      const handleAddGrnRow = () => {
        setGrnItems(prev => [
          ...prev,
          {
            tempId: `row-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
            productId: '',
            lotId: '',
            mfgDate: '',
            expiryDate: '',
            qty: '',
            costPrice: ''
          }
        ]);
      };

      const handleRemoveGrnRow = (tempId) => {
        if (grnItems.length <= 1) {
          showToast('ต้องมีรายการสินค้าอย่างน้อย 1 รายการในใบรับ', 'warning');
          return;
        }
        setGrnItems(prev => prev.filter(it => it.tempId !== tempId));
      };

      const handleUpdateGrnRow = (tempId, field, value) => {
        setGrnItems(prev => prev.map(it => {
          if (it.tempId !== tempId) return it;
          const updated = { ...it, [field]: value };
          if (field === 'productId') {
            const p = products.find(prod => prod.product_id === value);
            if (p) {
              if ((!updated.costPrice || updated.costPrice === '') && p.price_cost) {
                updated.costPrice = p.price_cost;
              }
              if (!updated.lotId) {
                const dateCode = todayISO.replace(/-/g, '').slice(2);
                const rand = Math.floor(100 + Math.random() * 900);
                updated.lotId = `LOT-${value}-${dateCode}-${rand}`;
              }
            }
          }
          return updated;
        }));
      };

      const handleAutoAssignAllLots = () => {
        const dateCode = todayISO.replace(/-/g, '').slice(2);
        let count = 0;
        setGrnItems(prev => prev.map(it => {
          if (!it.productId) return it;
          count++;
          const rand = Math.floor(100 + Math.random() * 900);
          return { ...it, lotId: `LOT-${it.productId}-${dateCode}-${rand}` };
        }));
        if (count > 0) {
          showToast(`✨ สุ่มสร้างเลขล็อตให้ ${count} รายการเรียบร้อย`, 'success');
        } else {
          showToast('กรุณาเลือกสินค้าในแถวก่อนสุ่มเลขล็อต', 'warning');
        }
      };

      // Submit Multi-Item Stock In
      const handleSubmitMultiStockIn = async (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (grnItems.length === 0) {
          showToast('กรุณาระบุรายการสินค้าที่รับเข้าอย่างน้อย 1 รายการ', 'warning');
          return;
        }
        for (let i = 0; i < grnItems.length; i++) {
          const it = grnItems[i];
          if (!it.productId) {
            showToast(`แถวที่ ${i+1}: กรุณาเลือกสินค้า`, 'warning');
            return;
          }
          if (!it.qty || Number(it.qty) <= 0) {
            showToast(`แถวที่ ${i+1}: กรุณาระบุจำนวนสินค้าที่ถูกต้อง`, 'warning');
            return;
          }
          if (!it.expiryDate) {
            showToast(`แถวที่ ${i+1}: กรุณาระบุวันหมดอายุตามหลัก FEFO`, 'warning');
            return;
          }
        }

        setIsSubmittingGrn(true);
        try {
          const finalGrnNo = grnHeader.grnId || generateGrnNumber();
          const res = await window.StockLogic.saveMultiLotStockIn({
            grnId: finalGrnNo,
            date: grnHeader.date || todayISO,
            warehouseId: grnHeader.warehouseId || 'MAIN_WH',
            domainType: activeDomain,
            supplier: grnHeader.supplier,
            notes: grnHeader.notes,
            actor: grnHeader.receivedBy || currentUser?.name || 'ADMIN',
            items: grnItems.map(it => {
              const p = products.find(prod => prod.product_id === it.productId);
              return {
                ...it,
                productName: p?.name || it.productId,
                qty: Number(it.qty),
                costPrice: Number(it.costPrice || 0)
              };
            })
          });

          if (res.success) {
            showToast(`✅ บันทึกรับเข้าสำเร็จ ${res.totalItems} รายการ (รวม ${res.totalQty} ชิ้น)`, 'success');
            
            // Open print slip modal
            setPrintGrnSlipData(res.grnRecord);

            // Reset form
            setGrnHeader({
              grnId: '',
              date: todayISO,
              warehouseId: 'MAIN_WH',
              supplier: '',
              notes: '',
              receivedBy: currentUser?.name || 'ADMIN'
            });
            setGrnItems([
              {
                tempId: `row-${Date.now()}`,
                productId: '',
                lotId: '',
                mfgDate: '',
                expiryDate: '',
                qty: '',
                costPrice: ''
              }
            ]);

            // Refresh data
            await loadWarehouseData(true);
            await loadGrnHistory();
          } else {
            showToast(res.error || 'บันทึกรับเข้าไม่สำเร็จ', 'error');
          }
        } catch (err) {
          console.error(err);
          showToast('เกิดข้อผิดพลาดในการบันทึกรับเข้าสินค้า', 'error');
        } finally {
          setIsSubmittingGrn(false);
        }
      };

      // Multi-Item Transfer Requisition (TRF) Helpers
      const generateTransferNumber = useCallback(() => {
        const dateCode = todayISO.replace(/-/g, '').slice(2);
        const rand = Math.floor(100 + Math.random() * 900);
        return `TRF-${dateCode}-${rand}`;
      }, [todayISO]);

      const loadTransferHistory = useCallback(async () => {
        if (window.StockLogic?.fetchTransferHistory) {
          try {
            const list = await window.StockLogic.fetchTransferHistory(activeDomain);
            setTransferHistoryList(list || []);
          } catch(e) {
            console.warn('loadTransferHistory error:', e);
          }
        }
      }, [activeDomain]);

      useEffect(() => {
        if (!transferHeader.transferId) {
          setTransferHeader(prev => ({ ...prev, transferId: generateTransferNumber() }));
        }
      }, [generateTransferNumber, transferHeader.transferId]);

      const handleAddTransferRow = () => {
        setTransferItems(prev => [
          ...prev,
          {
            tempId: `trf-row-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
            productId: '',
            lotId: '',
            qty: ''
          }
        ]);
      };

      const handleRemoveTransferRow = (tempId) => {
        if (transferItems.length <= 1) {
          showToast('ต้องมีรายการสินค้าอย่างน้อย 1 รายการในใบเบิก', 'warning');
          return;
        }
        setTransferItems(prev => prev.filter(it => it.tempId !== tempId));
      };

      const handleUpdateTransferRow = (tempId, field, value) => {
        setTransferItems(prev => prev.map(it => {
          if (it.tempId !== tempId) return it;
          const updated = { ...it, [field]: value };
          if (field === 'productId') {
            updated.lotId = ''; // reset lot selection on product change
          }
          return updated;
        }));
      };

      // Submit Multi-Item Transfer Requisition
      const handleSubmitMultiTransfer = async (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (transferItems.length === 0) {
          showToast('กรุณาระบุรายการสินค้าที่ต้องการเบิกย้ายอย่างน้อย 1 รายการ', 'warning');
          return;
        }

        // Validate rows
        for (let i = 0; i < transferItems.length; i++) {
          const it = transferItems[i];
          if (!it.productId) {
            showToast(`แถวที่ ${i+1}: กรุณาเลือกสินค้า`, 'warning');
            return;
          }
          const q = Number(it.qty);
          if (!it.qty || q <= 0) {
            showToast(`แถวที่ ${i+1}: กรุณาระบุจำนวนสินค้าที่ถูกต้อง`, 'warning');
            return;
          }
          // Check stock in Main WH
          const stockItem = productStockSummary.find(s => s.product.product_id === it.productId);
          if (stockItem && stockItem.mainStock > 0 && q > stockItem.mainStock) {
            if (!confirm(`⚠️ แถวที่ ${i+1} (${stockItem.product.name}): คลังใหญ่มีคงเหลือ ${stockItem.mainStock} ชิ้น แต่มียอดเบิก ${q} ชิ้น ต้องการดำเนินการต่อหรือไม่?`)) {
              return;
            }
          }
        }

        setIsSubmittingTransfer(true);
        try {
          const finalTrfNo = transferHeader.transferId || generateTransferNumber();
          const itemsPayload = transferItems.map(it => {
            const p = products.find(prod => prod.product_id === it.productId);
            return {
              productId: it.productId,
              productName: p?.name || it.productId,
              lotId: it.lotId || 'FEFO Auto-Assign',
              qty: Number(it.qty)
            };
          });

          const res = await window.StockLogic.transferStockBetweenWarehouses({
            transferId: finalTrfNo,
            fromWarehouse: transferHeader.fromWarehouse || 'MAIN_WH',
            toWarehouse: transferHeader.toWarehouse || 'FRONT_STORE',
            domainType: activeDomain,
            items: itemsPayload,
            requestedBy: transferHeader.requestedBy || currentUser?.name || 'พนักงานหน้าร้าน',
            notes: transferHeader.notes,
            date: transferHeader.date || todayISO
          });

          if (res.success) {
            const totalQty = itemsPayload.reduce((s, it) => s + it.qty, 0);
            showToast(`✅ เบิกย้ายสินค้าสำเร็จ ${itemsPayload.length} รายการ (รวม ${totalQty} ชิ้น) พร้อมออกใบเบิก!`, 'success');

            // Open print slip modal with full multi-item data
            setPrintSlipData({
              transferId: res.transferId,
              date: transferHeader.date || todayISO,
              fromWarehouse: transferHeader.fromWarehouse === 'MAIN_WH' ? 'คลังใหญ่ (Main WH - ชั้น 2)' : transferHeader.fromWarehouse,
              toWarehouse: transferHeader.toWarehouse === 'FRONT_STORE' ? 'ห้องขายหน้าร้าน (Front Store)' : transferHeader.toWarehouse,
              items: itemsPayload,
              requestedBy: transferHeader.requestedBy || currentUser?.name || '-',
              approvedBy: currentUser?.name || 'หัวหน้าคลังสินค้า',
              notes: transferHeader.notes || '-'
            });

            // Reset form
            setTransferHeader({
              transferId: '',
              date: todayISO,
              fromWarehouse: 'MAIN_WH',
              toWarehouse: 'FRONT_STORE',
              requestedBy: currentUser?.name || 'ADMIN',
              notes: ''
            });
            setTransferItems([
              {
                tempId: `trf-row-${Date.now()}`,
                productId: '',
                lotId: '',
                qty: ''
              }
            ]);

            // Refresh data
            await loadWarehouseData(true);
            await loadTransferHistory();
          } else {
            showToast(res.error || 'เบิกย้ายสินค้าไม่สำเร็จ', 'error');
          }
        } catch (err) {
          console.error(err);
          showToast('เกิดข้อผิดพลาดในการเบิกย้ายสินค้า', 'error');
        } finally {
          setIsSubmittingTransfer(false);
        }
      };

      // Daily Reconciliation Ledger Calculation
      const dailyReconciliation = useMemo(() => {
        // Daily formula: Opening + Transfer In - Sales = System Closing
        return productStockSummary
          .filter(item => !item.isPromoBundle && !isProductDiscontinued(item.product))
          .map(item => {
          const pid = item.product.product_id;
          // Calculate transfers in on this date
          const dateTransfersIn = transfers
            .filter(t => (t.transfer_date === auditDate || (t.created_at && t.created_at.slice(0, 10) === auditDate)) && t.status !== 'CANCELLED')
            .reduce((sum, t) => {
              let items = [];
              try { items = typeof t.items_json === 'string' ? JSON.parse(t.items_json) : t.items_json; } catch(e){}
              const found = (Array.isArray(items) ? items : []).find(i => (i.product_id === pid || i.productId === pid || i.id === pid));
              return sum + (found ? Number(found.quantity || found.qty || 0) : 0);
            }, 0);

          // Calculate sales on this date: อ้างอิงจากบิลขายสำเร็จจริง (Single Source of Truth)
          let dateSales = 0;
          if (dailySalesMap && dailySalesMap[pid] !== undefined) {
            dateSales = dailySalesMap[pid];
          } else {
            // Fallback: Net movements (OUT sales minus IN returns)
            const salesOut = movements
              .filter(m => (m.date === auditDate || (m.created_at && m.created_at.slice(0, 10) === auditDate)) && m.product_id === pid && m.type === 'OUT' && (String(m.sub_type || '').includes('ขาย') || String(m.notes || '').includes('บิล')))
              .reduce((sum, m) => sum + Number(m.quantity || 0), 0);
            const salesReturn = movements
              .filter(m => (m.date === auditDate || (m.created_at && m.created_at.slice(0, 10) === auditDate)) && m.product_id === pid && m.type === 'IN' && (String(m.sub_type || '').includes('คืน') || String(m.sub_type || '').includes('ยกเลิก') || String(m.notes || '').includes('คืน') || String(m.notes || '').includes('Cancel')))
              .reduce((sum, m) => sum + Number(m.quantity || 0), 0);
            dateSales = Math.max(0, salesOut - salesReturn);
          }

          // ยอดยกมาต้นวัน: ค้นหาจากยอดปิดของวันก่อนหน้า (Yesterday / Previous Audited Closing)
          let opening = 0;
          const prevAudit = (auditRecordsCache || []).find(r => r.product_id === pid && r.balance_date < auditDate);
          if (prevAudit) {
            opening = (prevAudit.physical_count_qty !== null && prevAudit.physical_count_qty !== undefined)
              ? Number(prevAudit.physical_count_qty)
              : Number(prevAudit.system_closing_qty || 0);
          } else {
            // Fallback ถ้ายังไม่เคยมีบันทึกตรวจนับก่อนหน้านี้
            const baseClosing = (item.frontStock > 0 || transfers.length > 0) ? item.frontStock : (item.totalStock || 0);
            opening = Math.max(0, baseClosing - dateTransfersIn + dateSales);
          }

          // สต๊อกห้องขายหน้าร้านตามระบบ = ยอดยกมา + เบิกเข้า - ขาย
          const systemClosing = Math.max(0, opening + dateTransfersIn - dateSales);

          const physCount = physicalCounts[pid] !== undefined && physicalCounts[pid] !== '' 
            ? Number(physicalCounts[pid]) 
            : null;
          
          const diff = physCount !== null ? (physCount - systemClosing) : 0;

          return {
            productId: pid,
            name: item.product.name,
            openingQty: opening,
            transferInQty: dateTransfersIn,
            salesQty: dateSales,
            systemClosingQty: systemClosing,
            frontStockQty: systemClosing,
            mainStockQty: Number(item.mainStock || 0),
            totalStockQty: Number(item.totalStock || 0),
            physicalCount: physCount,
            diff: diff
          };
        });
      }, [productStockSummary, transfers, movements, auditDate, physicalCounts, dailySalesMap, isProductDiscontinued, auditRecordsCache]);

      // Handle Physical Count Input Change
      const handlePhysicalCountChange = (productId, val) => {
        setPhysicalCounts(prev => ({
          ...prev,
          [productId]: val
        }));
      };

      // Quick Auto-fill System Stock to Physical Counts
      const handleAutoFillPhysicalCounts = () => {
        const filled = {};
        dailyReconciliation.forEach(r => {
          filled[r.productId] = r.systemClosingQty;
        });
        setPhysicalCounts(filled);
        showToast('คัดลอกยอดตามระบบลงช่องนับจริงทั้งหมดแล้ว', 'info');
      };

      // Save Daily Audit to Supabase
      const handleSaveDailyAudit = async () => {
        setIsSavingAudit(true);
        try {
          const auditRecords = dailyReconciliation.map(r => ({
            productId: r.productId,
            openingQty: r.openingQty,
            receivedQty: r.transferInQty,
            salesQty: r.salesQty,
            closingQty: r.systemClosingQty,
            physicalCount: r.physicalCount
          }));

          const res = await window.StockLogic.saveDailyAuditRecords({
            balanceDate: auditDate,
            warehouseId: 'FRONT_STORE',
            domainType: activeDomain,
            auditRecords,
            auditor: currentUser?.name || 'ADMIN',
            notes: auditNotes
          });

          if (res.success) {
            showToast(`✅ บันทึกกระทบยอดประจำวัน (${auditDate}) เรียบร้อยแล้ว (${res.count} รายการ)`, 'success');
            const savedTime = new Date().toISOString();
            setAuditSavedInfo({
              date: auditDate,
              auditedBy: currentUser?.name || 'ADMIN',
              count: res.count,
              updatedAt: savedTime,
              hasPhysicalCount: auditRecords.some(r => r.physicalCount !== null && r.physicalCount !== undefined)
            });

            // อัปเดต auditRecordsCache ในหน่วยความจำทันที ไม่ต้องโหลดซ้ำ (Zero Egress!)
            const newAuditRows = auditRecords.map(r => ({
              id: `BAL-FRONT_STORE-${auditDate}-${r.productId}`,
              balance_date: auditDate,
              warehouse_id: 'FRONT_STORE',
              product_id: r.productId,
              domain_type: activeDomain,
              opening_qty: r.openingQty,
              transfer_in_qty: r.receivedQty,
              transfer_out_qty: 0,
              sales_qty: r.salesQty,
              system_closing_qty: r.closingQty,
              physical_count_qty: r.physicalCount,
              diff_qty: r.physicalCount !== null ? (Number(r.physicalCount) - Number(r.closingQty)) : 0,
              audited_by: currentUser?.name || 'ADMIN',
              audit_status: r.physicalCount !== null ? (Number(r.physicalCount) === Number(r.closingQty) ? 'BALANCED' : 'DISCREPANCY') : 'PENDING',
              audit_notes: auditNotes,
              created_at: savedTime
            }));

            setAuditRecordsCache(prev => {
              const filtered = (prev || []).filter(row => row.balance_date !== auditDate);
              const combined = [...newAuditRows, ...filtered];
              try { sessionStorage.setItem('stk_warehouse_audit_cache', JSON.stringify(combined)); } catch(e){}
              return combined;
            });

            // อัปเดตประวัติและสมุดบัญชีย้อนหลังทันที
            await loadLedgerBalances(auditDate);
            await loadAuditHistorySessions();
          } else {
            showToast(res.error || 'บันทึกไม่สำเร็จ', 'error');
          }
        } catch (err) {
          console.error(err);
          showToast('เกิดข้อผิดพลาดในการบันทึกยอดตรวจนับ: ' + (err.message || String(err)), 'error');
        } finally {
          setIsSavingAudit(false);
        }
      };

      // Open Print / Export PDF Modal for Historical Daily Stock Ledger (Strictly for single selected date)
      const handleOpenPrintLedger = useCallback(async (targetDate) => {
        const d = (typeof targetDate === 'string' && targetDate) ? targetDate : ledgerDate;
        if (!d) return;

        const selectedSession = (auditHistorySessions || []).find(s => s.date === d);

        // 1. ตรวจสอบข้อมูลเฉพาะของวันที่ d จากแคช
        let rowsForDate = (auditRecordsCache || []).filter(r => r.balance_date === d);

        // 2. ถ้าในแคชไม่มี ให้ดูจาก ledgerBalances (ถ้าตรงกับวันที่ d)
        if (rowsForDate.length === 0 && Array.isArray(ledgerBalances) && ledgerBalances.length > 0) {
          rowsForDate = ledgerBalances.filter(b => b.balance_date === d);
        }

        // 3. ถ้ายังไม่มี ให้ดึงจากฐานข้อมูลตรงๆ สำหรับวันที่ d
        if (rowsForDate.length === 0 && typeof window.supabaseSelect === 'function') {
          try {
            const fetched = await window.supabaseSelect('stk_daily_balance', `balance_date=eq.${d}&select=id,balance_date,warehouse_id,product_id,opening_qty,transfer_in_qty,transfer_out_qty,sales_qty,system_closing_qty,physical_count_qty,diff_qty,audited_by,audit_status,audit_notes,created_at&limit=200`);
            if (Array.isArray(fetched) && fetched.length > 0) {
              rowsForDate = fetched;
              setAuditRecordsCache(prev => [...fetched, ...(prev || []).filter(p => p.balance_date !== d)]);
            }
          } catch(e) {
            console.warn('handleOpenPrintLedger direct fetch error:', e);
          }
        }

        // 4. สร้างรายการสินค้าเฉพาะของวันที่ d เท่านั้น
        let items = [];
        if (rowsForDate.length > 0) {
          items = rowsForDate.map(b => {
            const p = (products || []).find(prod => prod.product_id === b.product_id);
            return {
              productId: b.product_id,
              name: p?.name || b.product_id,
              openingQty: Number(b.opening_qty || 0),
              transferInQty: Number(b.transfer_in_qty || 0),
              transferOutQty: Number((b.transfer_out_qty || 0) + (b.sales_qty || 0)),
              systemClosingQty: Number(b.system_closing_qty || 0),
              physicalCountQty: b.physical_count_qty !== null && b.physical_count_qty !== undefined ? Number(b.physical_count_qty) : null,
              diffQty: Number(b.diff_qty || 0),
              status: b.audit_status || 'PENDING'
            };
          });
        } else if (d === auditDate && Array.isArray(dailyReconciliation) && dailyReconciliation.length > 0) {
          items = dailyReconciliation.map(r => ({
            productId: r.productId,
            name: r.name,
            openingQty: Number(r.openingQty || 0),
            transferInQty: Number(r.transferInQty || 0),
            transferOutQty: Number(r.salesQty || 0),
            systemClosingQty: Number(r.systemClosingQty || 0),
            physicalCountQty: r.physicalCount,
            diffQty: Number(r.diff || 0),
            status: r.physicalCount !== null ? (r.diff === 0 ? 'BALANCED' : 'DISCREPANCY') : 'PENDING'
          }));
        }

        setPrintLedgerData({
          date: d,
          warehouseId: selectedSession?.warehouseId === 'FRONT_STORE' ? 'ห้องขายหน้าร้าน (Front Store)' : (selectedSession?.warehouseId || 'ห้องขายหน้าร้าน (Front Store)'),
          auditedBy: selectedSession?.auditedBy || rowsForDate[0]?.audited_by || currentUser?.name || 'ADMIN',
          createdAt: selectedSession?.createdAt || rowsForDate[0]?.created_at || null,
          notes: selectedSession?.notes || rowsForDate[0]?.audit_notes || '',
          items: items
        });
      }, [auditHistorySessions, ledgerDate, auditRecordsCache, ledgerBalances, products, auditDate, dailyReconciliation, currentUser]);

      // Safeguard: Reset scroll position before printing
      useEffect(() => {
        const handleBeforePrint = () => {
          const slip = document.getElementById('printable-ledger-slip');
          if (slip) slip.scrollTop = 0;
        };
        window.addEventListener('beforeprint', handleBeforePrint);
        return () => window.removeEventListener('beforeprint', handleBeforePrint);
      }, []);

      // ═════════════════════════════════════════════════════════════════════
      // 🖨️ DEDICATED HISTORICAL DAILY STOCK LEDGER PRINT & PDF GENERATOR
      // ═════════════════════════════════════════════════════════════════════

        const orient = customOrientation || printOrientation || 'landscape';
        const d = printLedgerData;
        const items = Array.isArray(d.items) ? d.items : [];
        const totalOpening = items.reduce((s, it) => s + (it.openingQty || 0), 0);
        const totalIn = items.reduce((s, it) => s + (it.transferInQty || 0), 0);
        const totalOut = items.reduce((s, it) => s + (it.transferOutQty || 0), 0);
        const totalSystem = items.reduce((s, it) => s + (it.systemClosingQty || 0), 0);
        const totalPhysical = items.reduce((s, it) => s + (it.physicalCountQty !== null && it.physicalCountQty !== undefined ? it.physicalCountQty : 0), 0);
        const totalDiff = items.reduce((s, it) => s + (it.diffQty || 0), 0);
        const hasDiscrepancy = items.some(it => it.physicalCountQty !== null && it.physicalCountQty !== undefined && it.diffQty !== 0);

        const escape = (str) => String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        const rowsHtml = items.length > 0 ? items.map((it, idx) => {

          if (it.physicalCountQty !== null && it.physicalCountQty !== undefined) {
            if (it.diffQty === 0) {
              diffHtml = '<span style="color: #047857; font-weight: 700;">&plusmn;0</span>';
            } else if (it.diffQty < 0) {
              diffHtml = `<span style="color: #b91c1c; font-weight: 800;">${it.diffQty}</span>`;
            } else {
              diffHtml = `<span style="color: #b45309; font-weight: 800;">+${it.diffQty}</span>`;

          }

          if (it.physicalCountQty !== null && it.physicalCountQty !== undefined) {

          return `

              </td>

              <td style="padding: 5px 6px; text-align: center; font-family: monospace; font-weight: 700; color: #047857; border-right: 1px solid #cbd5e1;">+${Number(it.transferInQty || 0).toLocaleString()}</td>
              <td style="padding: 5px 6px; text-align: center; font-family: monospace; font-weight: 700; color: #b91c1c; border-right: 1px solid #cbd5e1;">-${Number(it.transferOutQty || 0).toLocaleString()}</td>
              <td style="padding: 5px 6px; text-align: center; font-family: monospace; font-weight: 800; color: #1d4ed8; background-color: #eff6ff !important; border-right: 1px solid #cbd5e1;">${Number(it.systemClosingQty || 0).toLocaleString()}</td>
              <td style="padding: 5px 6px; text-align: center; font-family: monospace; font-weight: 800; color: #0f172a; border-right: 1px solid #cbd5e1;">
                ${it.physicalCountQty !== null && it.physicalCountQty !== undefined ? Number(it.physicalCountQty).toLocaleString() : '-'}
              </td>
              <td style="padding: 5px 6px; text-align: center; font-family: monospace; border-right: 1px solid #cbd5e1;">
                ${diffHtml}

                ${statusHtml}

            </tr>
          `;
        }).join('') : `
          <tr>
            <td colspan="9" style="padding: 30px; text-align: center; color: #94a3b8; font-weight: 700;">ยังไม่มีข้อมูลบันทึกตรวจนับปิดยอดประจำวัน (${escape(d.date)}) ในระบบ</td>
          </tr>
        `;

        const timeStr = d.createdAt ? new Date(d.createdAt).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.' : '-';

        const htmlContent = `<!DOCTYPE html>
<html lang="th">
