                        <table className="w-full border-collapse border border-slate-300 text-left my-3 text-xs sm:text-sm">
                          <thead>
                            <tr className="bg-slate-100 border-b-2 border-slate-300 text-slate-700 font-black">
                              <th className="p-2.5 border-r border-slate-300 text-center w-10">#</th>
                              <th className="p-2.5 border-r border-slate-300">รหัส / รายการสินค้า</th>
                              <th className="p-2.5 border-r border-slate-300 text-center w-20">ยอดยกมา</th>
                              <th className="p-2.5 border-r border-slate-300 text-center w-20">รับเข้า (+)</th>
                              <th className="p-2.5 border-r border-slate-300 text-center w-20">จ่ายออก (-)</th>
                              <th className="p-2.5 border-r border-slate-300 text-center w-24 bg-blue-50/50">สต๊อกระบบ</th>
                              <th className="p-2.5 border-r border-slate-300 text-center w-20">นับจริง</th>
                              <th className="p-2.5 border-r border-slate-300 text-center w-20">ผลต่าง</th>
                              <th className="p-2.5 text-center w-20">สถานะ</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-200">
                            {items.length > 0 ? (
                              items.map((it, idx) => (
                                <tr key={idx} className="hover:bg-slate-50/50">
                                  <td className="p-2.5 border-r border-slate-300 text-center font-bold text-slate-500">{idx + 1}</td>
                                  <td className="p-2.5 border-r border-slate-300 font-bold">
                                    <div className="text-xs sm:text-sm font-bold text-slate-900">{it.name}</div>
                                    <span className="font-mono text-[10px] text-slate-400 font-normal">{it.productId}</span>
                                  </td>
                                  <td className="p-2.5 border-r border-slate-300 text-center font-mono">{Number(it.openingQty || 0).toLocaleString()}</td>
                                  <td className="p-2.5 border-r border-slate-300 text-center font-mono font-bold text-emerald-700">+{Number(it.transferInQty || 0).toLocaleString()}</td>
                                  <td className="p-2.5 border-r border-slate-300 text-center font-mono font-bold text-rose-700">-{Number(it.transferOutQty || 0).toLocaleString()}</td>
                                  <td className="p-2.5 border-r border-slate-300 text-center font-mono font-black text-blue-700 bg-blue-50/30">{Number(it.systemClosingQty || 0).toLocaleString()}</td>
                                  <td className="p-2.5 border-r border-slate-300 text-center font-mono font-black text-slate-900">
                                    {it.physicalCountQty !== null ? Number(it.physicalCountQty).toLocaleString() : '-'}
                                  </td>
                                  <td className="p-2.5 border-r border-slate-300 text-center font-mono font-bold">
                                    {it.physicalCountQty === null ? (
                                      <span className="text-slate-400 text-xs">-</span>
                                    ) : it.diffQty === 0 ? (
                                      <span className="text-emerald-700">&plusmn;0</span>
                                    ) : it.diffQty < 0 ? (
                                      <span className="text-rose-700 font-black">{it.diffQty}</span>
                                    ) : (
                                      <span className="text-amber-700 font-black">+{it.diffQty}</span>
                                    )}
                                  </td>
                                  <td className="p-2.5 text-center text-xs">
                                    {it.physicalCountQty === null ? (
                                      <span className="text-slate-400">ปิดตามระบบ</span>
                                    ) : it.diffQty === 0 ? (
                                      <span className="text-emerald-700 font-bold">ตรง</span>
                                    ) : (
                                      <span className="text-rose-700 font-bold">ผลต่าง</span>
                                    )}
                                  </td>
                                </tr>
                              ))
                            ) : (
                              <tr>
                                <td colSpan="9" className="p-8 text-center text-slate-400 font-bold">
                                  ยังไม่มีข้อมูลบันทึกตรวจนับปิดยอดประจำวัน ({printLedgerData.date}) ในระบบ
                                </td>
                              </tr>
                            )}
                          </tbody>
                          <tfoot>
                            <tr className="bg-slate-100 font-black border-t-2 border-slate-400 text-slate-900 text-xs sm:text-sm">
                              <td colSpan="2" className="p-2.5 text-right border-r border-slate-300">รวมทั้งสิ้น ({items.length} รายการ):</td>
                              <td className="p-2.5 text-center border-r border-slate-300 font-mono">{totalOpening.toLocaleString()}</td>
                              <td className="p-2.5 text-center border-r border-slate-300 font-mono text-emerald-700">+{totalIn.toLocaleString()}</td>
                              <td className="p-2.5 text-center border-r border-slate-300 font-mono text-rose-700">-{totalOut.toLocaleString()}</td>
                              <td className="p-2.5 text-center border-r border-slate-300 font-mono text-blue-700">{totalSystem.toLocaleString()}</td>
                              <td className="p-2.5 text-center border-r border-slate-300 font-mono">{totalPhysical.toLocaleString()}</td>
                              <td className="p-2.5 text-center border-r border-slate-300 font-mono">
                                {totalDiff === 0 ? '±0' : (totalDiff > 0 ? `+${totalDiff}` : totalDiff)}
                              </td>
                              <td className="p-2.5 text-center font-bold">
                                {hasDiscrepancy ? <span className="text-rose-700">พบผลต่าง</span> : <span className="text-emerald-700">เรียบร้อย</span>}
                              </td>
                            </tr>
                          </tfoot>
                        </table>

                        {printLedgerData.notes && (
                          <div className="p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs text-slate-700">
                            <span className="font-bold text-slate-900">หมายเหตุ: </span>
                            <span>{printLedgerData.notes}</span>
                          </div>
                        )}
                      </>
                    );
                  })()}

                  {/* 3-COLUMN SIGNATURE BLOCK */}
                  <div className="grid grid-cols-3 gap-6 pt-8 text-center text-xs sm:text-sm signature-block-print">
                    <div className="border-t-2 border-slate-400 pt-3">
                      <p className="font-bold text-sm text-slate-800">ลงชื่อผู้ตรวจนับ / บันทึกยอด</p>
                      <p className="text-slate-600 mt-10 font-semibold">({printLedgerData.auditedBy || '...........................................'})</p>
                      <p className="text-slate-400 text-xs mt-1">วันที่: ........ / ........ / ................</p>
                    </div>
                    <div className="border-t-2 border-slate-400 pt-3">
                      <p className="font-bold text-sm text-slate-800">ลงชื่อผู้จัดการคลังสินค้า / เภสัชกร</p>
                      <p className="text-slate-600 mt-10 font-semibold">(...........................................)</p>
                      <p className="text-slate-400 text-xs mt-1">วันที่: ........ / ........ / ................</p>
                    </div>
                    <div className="border-t-2 border-slate-400 pt-3">
                      <p className="font-bold text-sm text-slate-800">ลงชื่อผู้มีอำนาจอนุมัติ / กรรมการผู้จัดการ</p>
                      <p className="text-slate-600 mt-10 font-semibold">(...........................................)</p>
                      <p className="text-slate-400 text-xs mt-1">วันที่: ........ / ........ / ................</p>
                    </div>
                  </div>
                </div>

                <div className="flex justify-between items-center pt-2 shrink-0 no-print-zone">
                  <div className="text-xs text-slate-500 font-medium">
                    โหมดการพิมพ์ปัจจุบัน: <span className="font-bold text-blue-600">{printOrientation === 'landscape' ? 'แนวนอน (A4 Landscape)' : 'แนวตั้ง (A4 Portrait)'}</span>
                  </div>
                  <div className="flex items-center gap-2.5">
                    <button
                      onClick={() => setPrintLedgerData(null)}
                      className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition-colors"
                    >
                      ปิด
                    </button>
                    <button
                      onClick={() => executePrintLedger(printOrientation)}
                      className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold flex items-center gap-1.5 transition-all shadow-2xs active:scale-95"
                      title="ส่งออกเอกสารเป็น PDF"
                    >
                      <Download size={14} className="text-blue-600 dark:text-blue-400" />
                      <span>บันทึก PDF</span>
                    </button>
                    <button
                      onClick={() => executePrintLedger(printOrientation)}
                      className="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold flex items-center gap-1.5 shadow-md transition-all active:scale-95"
                    >
                      <Printer size={15} />
                      <span>พิมพ์รายงาน ({printOrientation === 'landscape' ? 'แนวนอน A4' : 'แนวตั้ง A4'})</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* MODAL: VIEW GRN ITEMS DETAIL                             */}
          {/* ========================================================= */}
          {viewGrnDetailModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl max-w-2xl w-full p-6 space-y-4 max-h-[85vh] flex flex-col">
                <div className="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-3 shrink-0">
                  <div>
                    <h3 className="font-black text-base text-slate-900 dark:text-white">
                      รายละเอียดใบรับสินค้า: {viewGrnDetailModal.transfer_id}
                    </h3>
                    <p className="text-xs text-slate-400">
                      วันที่: {viewGrnDetailModal.transfer_date} &bull; ซัพพลายเออร์: {viewGrnDetailModal.from_warehouse || '-'}
                    </p>
                  </div>
                  <button
                    onClick={() => setViewGrnDetailModal(null)}
                    className="p-2 text-slate-400 hover:text-slate-700 dark:hover:text-white rounded-xl"
                  >
                    <X size={20} />
                  </button>
                </div>

                <div className="overflow-y-auto space-y-3">
                  {(() => {
                    let items = [];
                    if (viewGrnDetailModal.items_json) {
                      try { items = typeof viewGrnDetailModal.items_json === 'string' ? JSON.parse(viewGrnDetailModal.items_json) : viewGrnDetailModal.items_json; } catch(e){}
                    }

                    if (!Array.isArray(items) || items.length === 0) {
                      return <p className="text-center py-6 text-slate-400">ไม่มีข้อมูลรายการสินค้า</p>;
                    }

                    return (
                      <table className="w-full text-left text-xs border-collapse">
                        <thead>
                          <tr className="bg-slate-50 dark:bg-slate-800 text-slate-400 font-bold uppercase text-[10px]">
                            <th className="py-2.5 px-3">#</th>
                            <th className="py-2.5 px-3">สินค้า</th>
                            <th className="py-2.5 px-3">เลขล็อต</th>
                            <th className="py-2.5 px-3">วันหมดอายุ</th>
                            <th className="py-2.5 px-3 text-center">จำนวน (ชิ้น)</th>
                            <th className="py-2.5 px-3 text-right">ต้นทุน/หน่วย</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                          {items.map((it, idx) => (
                            <tr key={idx}>
                              <td className="py-2.5 px-3 font-bold text-slate-400">{idx + 1}</td>
                              <td className="py-2.5 px-3 font-bold text-slate-800 dark:text-slate-200">
                                {it.productName || it.name || it.productId}
                              </td>
                              <td className="py-2.5 px-3 font-mono font-bold text-blue-600">{it.lotId || '-'}</td>
                              <td className="py-2.5 px-3 font-bold text-slate-700 dark:text-slate-300">{it.expiryDate || it.expiry_date || '-'}</td>
                              <td className="py-2.5 px-3 text-center font-black">{it.qty}</td>
                              <td className="py-2.5 px-3 text-right text-emerald-600 font-bold">
                                {Number(it.costPrice || it.cost_price || 0) > 0 ? `฿${Number(it.costPrice || it.cost_price).toLocaleString()}` : '-'}
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    );
                  })()}
                </div>

                <div className="flex justify-between items-center pt-3 border-t border-slate-200 dark:border-slate-800 shrink-0">
                  <button
                    onClick={() => {
                      const grn = viewGrnDetailModal;
                      setViewGrnDetailModal(null);
                      setPrintGrnSlipData(grn);
                    }}
                    className="px-4 py-2 rounded-xl bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 hover:bg-blue-600 hover:text-white text-xs font-bold flex items-center gap-1.5 transition-all"
                  >
                    <Printer size={15} />
                    <span>เปิดพิมพ์ใบรับนี้</span>
                  </button>
                  <button
                    onClick={() => setViewGrnDetailModal(null)}
                    className="px-5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold text-slate-600 dark:text-slate-300"
                  >
                    ปิด
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ========================================================= */}
          {/* LOGIN MODAL                                               */}
          {/* ========================================================= */}
          {LoginModal && (
            <LoginModal
              isOpen={showLoginModal}
              onClose={() => setShowLoginModal(false)}
              onLoginSuccess={handleLoginSuccess}
              systemUsers={[]}
            />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WarehouseApp />);
  </script>
</body>
</html>
