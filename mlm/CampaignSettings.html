<!DOCTYPE html>
<html lang="th">
<head>
<script>
  (function() {
    try {
      var theme = localStorage.getItem('stk_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.style.backgroundColor = '#0f172a';
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.style.backgroundColor = '#f8fafc';
      }
    } catch (e) {}
  })();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งค่าแคมเปญ & โปรโมชั่นแข่งขัน - LOVE STK GROUPE</title>
  <link rel="stylesheet" href="mainstyle.css?v=6">
  <script>(function(){var w=console.warn;console.warn=function(){var m=arguments[0]?String(arguments[0]):'';if(m.includes('cdn.tailwindcss.com')||m.includes('in-browser Babel transformer'))return;w.apply(console,arguments);};})();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="dictionary.js"></script>
  <script src="CommonComponents.js?v=3"></script>
  <script src="campaignLogic.js"></script>
</head>
<body class="antialiased overflow-x-hidden selection:bg-blue-600 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;
    const {
      LayoutDashboard, ShoppingCart, Users, Contact, Headset, BarChart3, Plus, Edit, Trash2,
      UserCircle, Menu, X, Save, Info, PackageIcon, Target, Trophy, Activity, Eye, Tags,
      CheckCircle, GitBranch, Archive, ChevronDown, FileText, SettingsIcon, Coins, ShieldCheck,
      LoginModal, Toast, Sidebar, Header, ConfirmModal, EditModal, AutoSuggestInput, SearchIcon,
      inputClassHud, labelClassHud, btnClassPrimary, btnClassSecondary, boxWrapper,
      tableHeaderClass, tableCellClass, safeUpper, getLocalISODate
    } = window;

    // ─────────────────────────────────────────────────────────────
    // 🎨 Helper: Formatter
    // ─────────────────────────────────────────────────────────────
    const formatNumber = (num) => Number(num || 0).toLocaleString();
    const cleanAvatar = (url, name) => {
      let cleanUrl = String(url || '').trim();
      if (!cleanUrl || cleanUrl === 'undefined' || cleanUrl === 'null' || cleanUrl === '-') {
        return `https://ui-avatars.com/api/?name=${encodeURIComponent(name || 'Staff')}&background=1e293b&color=cbd5e1&rounded=true&bold=true`;
      }
      if (cleanUrl.includes('drive.google.com')) {
        const match = cleanUrl.match(/[-\w]{25,}/);
        const fileId = match ? match[0] : '';
        if (fileId) cleanUrl = 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w300';
      }
      return cleanUrl;
    };

    // ─────────────────────────────────────────────────────────────
    // 📋 SQL Create Table Notice Component (Graceful Fallback)
    // ─────────────────────────────────────────────────────────────
    const SqlNoticeModal = ({ isOpen, onClose }) => {
      const [copied, setCopied] = useState(false);
      if (!isOpen) return null;
      const sqlText = `CREATE TABLE IF NOT EXISTS stk_campaigns (
  campaign_id          TEXT PRIMARY KEY,
  name                 TEXT NOT NULL,
  description          TEXT,
  status               TEXT DEFAULT 'inactive',
  start_date           DATE NOT NULL,
  end_date             DATE NOT NULL,
  cond1_enabled        BOOLEAN DEFAULT false,
  cond1_type           TEXT DEFAULT 'customers',
  cond1_target         NUMERIC DEFAULT 0,
  cond2_enabled        BOOLEAN DEFAULT false,
  cond2_type           TEXT DEFAULT 'boxes',
  cond2_min_price      NUMERIC DEFAULT 1500,
  cond2_target         NUMERIC DEFAULT 0,
  display_on_dashboard BOOLEAN DEFAULT true,
  display_order        INT DEFAULT 0,
  created_at           TIMESTAMPTZ DEFAULT now(),
  updated_at           TIMESTAMPTZ DEFAULT now()
);

ALTER TABLE stk_campaigns ENABLE ROW LEVEL SECURITY;
CREATE POLICY "Public read stk_campaigns" ON stk_campaigns FOR SELECT USING (true);
CREATE POLICY "Service write stk_campaigns" ON stk_campaigns FOR ALL USING (true);`;

      const handleCopy = () => {
        navigator.clipboard.writeText(sqlText).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        });
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[99999] flex items-center justify-center p-4 animation-fade-in">
          <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl max-w-2xl w-full p-6 border border-slate-200 dark:border-slate-800 animation-pop">
            <div className="flex justify-between items-center mb-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-amber-500/10 text-amber-500 flex items-center justify-center font-bold">
                  ⚠️
                </div>
                <div>
                  <h3 className="text-lg font-black text-slate-900 dark:text-white">คำสั่ง SQL สร้างตาราง stk_campaigns</h3>
                  <p className="text-xs text-slate-500 dark:text-slate-400">คัดลอกไปวางใน Supabase SQL Editor แล้วกด Run</p>
                </div>
              </div>
              <button onClick={onClose} className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-white rounded-xl">
                <X size={20} />
              </button>
            </div>
            <pre className="bg-slate-950 text-slate-200 p-4 rounded-2xl text-xs font-mono overflow-x-auto max-h-72 border border-slate-800">
              {sqlText}
            </pre>
            <div className="mt-5 flex justify-end gap-3">
              <button onClick={handleCopy} className={`px-4 py-2 rounded-xl text-xs font-bold transition-all ${copied ? 'bg-emerald-600 text-white' : 'bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-500/25'}`}>
                {copied ? '✅ คัดลอกสำเร็จ!' : '📋 คัดลอกคำสั่ง SQL'}
              </button>
              <button onClick={onClose} className="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200">
                ปิดหน้าต่าง
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────
    // 🏆 Campaign Live Preview Modal
    // ─────────────────────────────────────────────────────────────
    const CampaignPreviewModal = ({ isOpen, onClose, campaign, sales, members, customers }) => {
      const [searchTerm, setSearchTerm] = useState('');
      const [filterStatus, setFilterStatus] = useState('all'); // 'all' | 'passed' | 'pending'

      if (!isOpen || !campaign) return null;

      const results = useMemo(() => {
        if (!window.CampaignEngine) return [];
        return window.CampaignEngine.calcCampaignResults(campaign, sales, members, customers);
      }, [campaign, sales, members, customers]);

      const passedCount = results.filter(r => r.passed).length;
      const notPassedCount = results.length - passedCount;

      const filteredResults = results.filter(r => {
        const matchName = String(r.name || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                          String(r.memberId || '').toLowerCase().includes(searchTerm.toLowerCase());
        if (!matchName) return false;
        if (filterStatus === 'passed') return r.passed;
        if (filterStatus === 'pending') return !r.passed;
        return true;
      });

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[9999] flex items-center justify-center p-3 sm:p-6 animation-fade-in">
          <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col border border-slate-200 dark:border-slate-800 animation-pop overflow-hidden">
            {/* Header */}
            <div className="p-6 border-b border-slate-200 dark:border-slate-800 flex justify-between items-start bg-slate-50/50 dark:bg-slate-800/30">
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 rounded-2xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-2xl shadow-inner">
                  🏆
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h3 className="text-xl font-black text-slate-900 dark:text-white">{campaign.name}</h3>
                    <span className={`text-[10px] font-black px-2 py-0.5 rounded-full ${campaign.status === 'active' ? 'bg-emerald-500/10 text-emerald-600 border border-emerald-500/20' : 'bg-slate-500/10 text-slate-500 border border-slate-500/20'}`}>
                      {campaign.status === 'active' ? '🟢 เปิดใช้งาน' : '⚪ ปิดอยู่'}
                    </span>
                  </div>
                  <p className="text-xs font-semibold text-slate-500 dark:text-slate-400 mt-0.5">
                    ช่วงเวลา: <span className="font-bold text-slate-700 dark:text-slate-300">{campaign.start_date}</span> ถึง <span className="font-bold text-slate-700 dark:text-slate-300">{campaign.end_date}</span>
                    {campaign.description ? ` • ${campaign.description}` : ''}
                  </p>
                </div>
              </div>
              <button onClick={onClose} className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-white rounded-xl">
                <X size={20} />
              </button>
            </div>

            {/* Rules Summary Banner */}
            <div className="px-6 py-3 bg-blue-50/60 dark:bg-blue-950/20 border-b border-blue-100 dark:border-blue-900/30 flex flex-wrap items-center justify-between gap-3 text-xs">
              <div className="flex items-center gap-4">
                <span className="font-bold text-slate-600 dark:text-slate-300">กฎเกณฑ์:</span>
                {campaign.cond1_enabled ? (
                  <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400 font-bold border border-blue-200 dark:border-blue-800/60 shadow-xs">
                    🩺 คนมาตรวจ ≥ <span className="underline">{campaign.cond1_target} คน</span>
                  </span>
                ) : null}
                {campaign.cond2_enabled ? (
                  <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800 text-purple-600 dark:text-purple-400 font-bold border border-purple-200 dark:border-purple-800/60 shadow-xs">
                    📦 กล่องราคา ≥ {Number(campaign.cond2_min_price || 0).toLocaleString()}฿ → ≥ <span className="underline">{campaign.cond2_target} กล่อง</span>
                  </span>
                ) : null}
              </div>

              <div className="flex items-center gap-2">
                <span className="px-2.5 py-0.5 rounded-full text-[11px] font-black bg-emerald-500 text-white shadow-xs">
                  🎉 ผ่านเกณฑ์ {passedCount} คน
                </span>
                <span className="px-2.5 py-0.5 rounded-full text-[11px] font-black bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300">
                  ⏳ ยังไม่ถึง {notPassedCount} คน
                </span>
              </div>
            </div>

            {/* Filter Bar */}
            <div className="p-4 border-b border-slate-100 dark:border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="relative w-full sm:w-64">
                <SearchIcon size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                <input
                  type="text"
                  placeholder="ค้นหาชื่อพนักงาน..."
                  value={searchTerm}
                  onChange={e => setSearchTerm(e.target.value)}
                  className="w-full pl-9 pr-3 py-1.5 bg-slate-100 dark:bg-slate-800 border-none rounded-xl text-xs font-semibold text-slate-800 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 outline-none"
                />
              </div>

              <div className="flex items-center gap-1.5 w-full sm:w-auto">
                <button
                  onClick={() => setFilterStatus('all')}
                  className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${filterStatus === 'all' ? 'bg-blue-600 text-white shadow-xs' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'}`}
                >
                  ทั้งหมด ({results.length})
                </button>
                <button
                  onClick={() => setFilterStatus('passed')}
                  className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${filterStatus === 'passed' ? 'bg-emerald-600 text-white shadow-xs' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'}`}
                >
                  ✅ ผ่านแล้ว ({passedCount})
                </button>
                <button
                  onClick={() => setFilterStatus('pending')}
                  className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${filterStatus === 'pending' ? 'bg-amber-600 text-white shadow-xs' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'}`}
                >
                  ⏳ ยังไม่ถึง ({notPassedCount})
                </button>
              </div>
            </div>

            {/* Staff Performance Table */}
            <div className="flex-1 overflow-y-auto p-4 hide-scroll">
              {filteredResults.length === 0 ? (
                <div className="py-16 text-center text-slate-400">
                  <p className="text-3xl mb-2">🔍</p>
                  <p className="text-xs font-bold">ไม่พบรายชื่อพนักงานที่ตรงกับเงื่อนไขค้นหา</p>
                </div>
              ) : (
                <div className="space-y-2.5">
                  {filteredResults.map((r, idx) => {
                    const avatar = cleanAvatar(r.profileUrl, r.name);
                    return (
                      <div
                        key={r.memberId || idx}
                        className={`p-3.5 rounded-2xl border transition-all flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 ${
                          r.passed
                            ? 'bg-gradient-to-r from-emerald-500/5 via-teal-500/5 to-transparent border-emerald-500/30 dark:border-emerald-500/20'
                            : 'bg-white dark:bg-slate-800/60 border-slate-200 dark:border-slate-800'
                        }`}
                      >
                        {/* Member Info */}
                        <div className="flex items-center gap-3 min-w-[200px]">
                          <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-black shrink-0 ${
                            idx === 0 && r.passed ? 'bg-amber-400 text-amber-950 shadow-md' :
                            idx === 1 && r.passed ? 'bg-slate-300 text-slate-900' :
                            idx === 2 && r.passed ? 'bg-amber-600 text-white' :
                            'bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300'
                          }`}>
                            {idx + 1}
                          </div>
                          <img src={avatar} alt={r.name} className="w-10 h-10 rounded-full object-cover border border-slate-300 dark:border-slate-700 shrink-0" />
                          <div>
                            <p className="text-xs font-black text-slate-800 dark:text-white leading-tight">{r.name}</p>
                            <p className="text-[10px] text-slate-400 font-semibold">{r.team || 'พนักงานการตลาด'}</p>
                          </div>
                        </div>

                        {/* Conditions Progress */}
                        <div className="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-3 w-full sm:w-auto sm:px-4">
                          {/* Cond 1 */}
                          {campaign.cond1_enabled ? (
                            <div className="bg-slate-50 dark:bg-slate-900/60 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800">
                              <div className="flex justify-between items-center text-[10px] font-bold text-slate-500 mb-1">
                                <span>🩺 คนมาตรวจ</span>
                                <span className={r.actual_cond1 >= campaign.cond1_target ? 'text-emerald-500 font-black' : 'text-slate-700 dark:text-slate-300'}>
                                  {r.actual_cond1} / {campaign.cond1_target} คน ({r.pct1}%)
                                </span>
                              </div>
                              <div className="w-full bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                                <div
                                  className={`h-full rounded-full transition-all duration-500 ${r.actual_cond1 >= campaign.cond1_target ? 'bg-emerald-500' : 'bg-blue-500'}`}
                                  style={{ width: `${r.pct1}%` }}
                                ></div>
                              </div>
                            </div>
                          ) : null}

                          {/* Cond 2 */}
                          {campaign.cond2_enabled ? (
                            <div className="bg-slate-50 dark:bg-slate-900/60 p-2.5 rounded-xl border border-slate-100 dark:border-slate-800">
                              <div className="flex justify-between items-center text-[10px] font-bold text-slate-500 mb-1">
                                <span>📦 กล่อง (≥{formatNumber(campaign.cond2_min_price)}฿)</span>
                                <span className={r.actual_cond2 >= campaign.cond2_target ? 'text-emerald-500 font-black' : 'text-slate-700 dark:text-slate-300'}>
                                  {r.actual_cond2} / {campaign.cond2_target} กล่อง ({r.pct2}%)
                                </span>
                              </div>
                              <div className="w-full bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
                                <div
                                  className={`h-full rounded-full transition-all duration-500 ${r.actual_cond2 >= campaign.cond2_target ? 'bg-emerald-500' : 'bg-purple-500'}`}
                                  style={{ width: `${r.pct2}%` }}
                                ></div>
                              </div>
                            </div>
                          ) : null}
                        </div>

                        {/* Pass Status Badge */}
                        <div className="shrink-0 w-full sm:w-auto flex justify-end">
                          {r.passed ? (
                            <span className="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl text-xs font-black bg-emerald-500 text-white shadow-md shadow-emerald-500/25">
                              🎉 ผ่านเกณฑ์
                            </span>
                          ) : (
                            <span className="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">
                              ⏳ ยังไม่ถึง
                            </span>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Footer */}
            <div className="p-4 border-t border-slate-200 dark:border-slate-800 flex justify-end bg-slate-50 dark:bg-slate-800/30">
              <button onClick={onClose} className="px-5 py-2 rounded-xl text-xs font-bold bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-300 transition-colors">
                ปิดหน้าต่าง
              </button>
            </div>
          </div>
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────
    // 📝 Campaign Form Modal (Create / Edit)
    // ─────────────────────────────────────────────────────────────
    const CampaignFormModal = ({ isOpen, onClose, initialData, onSave, isSaving }) => {
      const getDefaultDates = () => {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const lastDay = new Date(y, now.getMonth() + 1, 0).getDate();
        return { start: `${y}-${m}-01`, end: `${y}-${m}-${String(lastDay).padStart(2, '0')}` };
      };

      const [formData, setFormData] = useState({
        campaign_id: '',
        name: '',
        description: '',
        status: 'active',
        start_date: getDefaultDates().start,
        end_date: getDefaultDates().end,
        cond1_enabled: true,
        cond1_target: 10,
        cond2_enabled: true,
        cond2_min_price: 1500,
        cond2_target: 10,
        display_order: 0
      });

      useEffect(() => {
        if (initialData) {
          setFormData({
            campaign_id: initialData.campaign_id || '',
            name: initialData.name || '',
            description: initialData.description || '',
            status: initialData.status || 'active',
            start_date: initialData.start_date || getDefaultDates().start,
            end_date: initialData.end_date || getDefaultDates().end,
            cond1_enabled: initialData.cond1_enabled !== false,
            cond1_target: Number(initialData.cond1_target || 10),
            cond2_enabled: initialData.cond2_enabled !== false,
            cond2_min_price: Number(initialData.cond2_min_price || 1500),
            cond2_target: Number(initialData.cond2_target || 10),
            display_order: Number(initialData.display_order || 0)
          });
        } else {
          const generatedId = 'CAMP-' + Date.now().toString().slice(-6);
          setFormData({
            campaign_id: generatedId,
            name: '',
            description: '',
            status: 'active',
            start_date: getDefaultDates().start,
            end_date: getDefaultDates().end,
            cond1_enabled: true,
            cond1_target: 10,
            cond2_enabled: true,
            cond2_min_price: 1500,
            cond2_target: 10,
            display_order: 0
          });
        }
      }, [initialData, isOpen]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.name.trim()) {
          alert('กรุณากรอกชื่อแคมเปญ');
          return;
        }
        if (!formData.cond1_enabled && !formData.cond2_enabled) {
          alert('กรุณาเลือกเปิดใช้งานเงื่อนไขอย่างน้อย 1 ข้อ');
          return;
        }
        onSave(formData);
      };

      return (
        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[9999] flex items-center justify-center p-3 sm:p-6 animation-fade-in overflow-y-auto">
          <div className="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl max-w-2xl w-full p-6 sm:p-8 border border-slate-200 dark:border-slate-800 animation-pop my-auto">
            <div className="flex justify-between items-center mb-6">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-blue-500/10 text-blue-600 dark:text-blue-400 flex items-center justify-center font-black">
                  🏆
                </div>
                <div>
                  <h3 className="text-xl font-black text-slate-900 dark:text-white">
                    {initialData ? 'แก้ไขแคมเปญ' : 'สร้างแคมเปญแข่งขันใหม่'}
                  </h3>
                  <p className="text-xs text-slate-500 dark:text-slate-400">
                    ตั้งกฎเกณฑ์เพื่อคัดเลือกพนักงานการตลาดที่ทำผลงานผ่านเป้า
                  </p>
                </div>
              </div>
              <button onClick={onClose} className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-white rounded-xl">
                <X size={20} />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-5">
              {/* Basic Details */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div className="sm:col-span-2">
                  <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1">
                    ชื่อแคมเปญ <span className="text-red-500">*</span>

    // ─────────────────────────────────────────────────────────────
    // 👑 Main Campaign Settings View
    // ─────────────────────────────────────────────────────────────
    const CampaignSettingsView = ({ currentUser, isAdmin, showToast }) => {
      const [campaigns, setCampaigns] = useState([]);
      const [sales, setSales] = useState([]);
      const [members, setMembers] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [isLoading, setIsLoading] = useState(true);

      const [showFormModal, setShowFormModal] = useState(false);
      const [editItem, setEditItem] = useState(null);
      const [isSaving, setIsSaving] = useState(false);

      const [previewItem, setPreviewItem] = useState(null);
      const [showSqlNotice, setShowSqlNotice] = useState(false);
      const [deleteTarget, setDeleteTarget] = useState(null);

      const [searchTerm, setSearchTerm] = useState('');
      const [filterStatus, setFilterStatus] = useState('all');

      // Load All Data
      const loadAllData = useCallback(async () => {
        setIsLoading(true);
        try {
          const [campRes, salesRes, memRes, custRes] = await Promise.all([
            window.supabaseSelect('stk_campaigns', 'nocache=true&order=display_order.asc,created_at.asc').catch(err => {
              console.warn("stk_campaigns fetch error:", err);
              setShowSqlNotice(true);
              return [];
            }),
            window.supabaseSelect('stk_sales', 'nocache=true&limit=2000').catch(() => []),
            window.supabaseSelect('stk_members', 'nocache=true&limit=500').catch(() => []),
            window.supabaseSelect('stk_customers', 'order=created_at.desc&nocache=true&limit=3000').catch(() => [])
          ]);

          setCampaigns(Array.isArray(campRes) ? campRes : []);
          setSales(Array.isArray(salesRes) ? salesRes : []);
          setMembers(Array.isArray(memRes) ? memRes : []);
          setCustomers(Array.isArray(custRes) ? custRes : []);
        } catch (e) {
          console.error("Load data error:", e);
        } finally {
          setIsLoading(false);
        }
      }, []);

      useEffect(() => {
        loadAllData();
      }, [loadAllData]);

      // Quick Toggle Status
      const handleToggleStatus = async (camp) => {
        const nextStatus = camp.status === 'active' ? 'inactive' : 'active';
        try {
          await window.supabaseUpdate('stk_campaigns', camp.campaign_id, { status: nextStatus }, 'campaign_id');
          setCampaigns(prev => prev.map(c => c.campaign_id === camp.campaign_id ? { ...c, status: nextStatus } : c));
          showToast(`เปลี่ยนสถานะเป็น ${nextStatus === 'active' ? 'เปิดใช้งาน' : 'ปิดใช้งาน'} สำเร็จ`, 'success');
        } catch (err) {
          showToast('บันทึกสถานะล้มเหลว: ' + err.message, 'error');
        }
      };

      // Save (Create or Update)
      const handleSaveCampaign = async (formData) => {
        setIsSaving(true);
        try {
          const isEdit = !!editItem;
          if (isEdit) {
            await window.supabaseUpdate('stk_campaigns', formData.campaign_id, formData, 'campaign_id');
            setCampaigns(prev => prev.map(c => c.campaign_id === formData.campaign_id ? formData : c));
            showToast('อัปเดตแคมเปญสำเร็จ!', 'success');
          } else {
            await window.supabaseInsert('stk_campaigns', formData);
            setCampaigns(prev => [...prev, formData]);
            showToast('สร้างแคมเปญใหม่สำเร็จ!', 'success');
          }
          setShowFormModal(false);
          setEditItem(null);
        } catch (err) {
          showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
        } finally {
          setIsSaving(false);
        }
      };

      // Delete Campaign
      const handleDeleteCampaign = async () => {
        if (!deleteTarget) return;
        try {
          await window.supabaseDelete('stk_campaigns', deleteTarget.campaign_id, 'campaign_id');
          setCampaigns(prev => prev.filter(c => c.campaign_id !== deleteTarget.campaign_id));
          showToast('ลบแคมเปญเรียบร้อยแล้ว', 'success');
        } catch (err) {
          showToast('ลบล้มเหลว: ' + err.message, 'error');
        } finally {
          setDeleteTarget(null);
        }
      };

      // Filtered campaigns
      const filteredCampaigns = useMemo(() => {
        return (campaigns || []).filter(c => {
          const term = searchTerm.toLowerCase().trim();
          const matchSearch = !term ||
            String(c.name || '').toLowerCase().includes(term) ||
            String(c.campaign_id || '').toLowerCase().includes(term);
          if (!matchSearch) return false;
          if (filterStatus === 'active') return c.status === 'active';
          if (filterStatus === 'inactive') return c.status !== 'active';
          return true;
        });
      }, [campaigns, searchTerm, filterStatus]);

      const activeCount = campaigns.filter(c => c.status === 'active').length;
      const inactiveCount = campaigns.length - activeCount;

      return (
        <div className="p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl mx-auto animation-fade-in">
          {/* Header Banner - Theme-Adaptive & Responsive */}
          <div className="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 relative overflow-hidden shadow-sm dark:shadow-xl border border-slate-200/80 dark:border-slate-800 transition-all">
            {/* Soft Ambient Background Glow */}
            <div className="absolute top-0 right-0 w-96 h-96 bg-blue-500/5 dark:bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div className="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
              <div>
                <div className="flex items-center gap-3.5 mb-2">
                  <div className="w-12 h-12 rounded-2xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-2xl shadow-xs border border-amber-500/20 shrink-0">
                    🏆
                  </div>
                  <div>
                    <h1 className="text-2xl sm:text-3xl font-black tracking-tight text-slate-900 dark:text-white">
                      ตั้งค่าแคมเปญ & โปรโมชั่น
                    </h1>
                  </div>
                </div>
                <p className="text-xs sm:text-sm text-slate-600 dark:text-slate-400 max-w-2xl font-medium leading-relaxed">
                  กำหนดเป้าหมายและการแข่งขันสำหรับพนักงานการตลาด ผสม 2 เงื่อนไข (คนมาตรวจ + จำนวนกล่องราคาขั้นต่ำ) เพื่อแสดงผลในแดชบอร์ดหลัก
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <button
                  onClick={() => setShowSqlNotice(true)}
                  className="px-4 py-2.5 rounded-xl text-xs font-bold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700 transition-all flex items-center gap-2 shadow-xs"
                >
                  <span>📋</span> คำสั่ง SQL
                </button>
                <button
                  onClick={() => { setEditItem(null); setShowFormModal(true); }}
                  className="px-5 py-2.5 rounded-xl text-xs font-black bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-500/25 transition-all flex items-center gap-2"
                >
                  <Plus size={18} />
                  สร้างแคมเปญใหม่
                </button>
              </div>
            </div>

            {/* Quick Stats Grid */}
            <div className="mt-6 pt-6 border-t border-slate-100 dark:border-slate-800 grid grid-cols-3 gap-3 sm:gap-4 max-w-lg">
              <div className="bg-slate-50 dark:bg-slate-800/60 rounded-2xl p-3 sm:p-3.5 border border-slate-200/70 dark:border-slate-700/60">
                <span className="text-[10px] sm:text-xs font-bold text-slate-500 dark:text-slate-400">ทั้งหมด</span>
                <p className="text-lg sm:text-xl font-black text-slate-900 dark:text-white mt-0.5">{campaigns.length} <span className="text-xs font-semibold text-slate-400">รายการ</span></p>
              </div>
              <div className="bg-emerald-50/80 dark:bg-emerald-950/20 rounded-2xl p-3 sm:p-3.5 border border-emerald-200/70 dark:border-emerald-800/40">
                <span className="text-[10px] sm:text-xs font-bold text-emerald-600 dark:text-emerald-400">เปิดใช้งาน</span>
                <p className="text-lg sm:text-xl font-black text-emerald-600 dark:text-emerald-400 mt-0.5">{activeCount} <span className="text-xs font-semibold text-emerald-500/70">รายการ</span></p>
              </div>
              <div className="bg-slate-50 dark:bg-slate-800/60 rounded-2xl p-3 sm:p-3.5 border border-slate-200/70 dark:border-slate-700/60">
                <span className="text-[10px] sm:text-xs font-bold text-slate-500 dark:text-slate-400">ปิดใช้งาน</span>
                <p className="text-lg sm:text-xl font-black text-slate-600 dark:text-slate-300 mt-0.5">{inactiveCount} <span className="text-xs font-semibold text-slate-400">รายการ</span></p>
              </div>
            </div>
          </div>

          {/* Filter and Search Bar */}
          <div className="flex flex-col sm:flex-row items-center justify-between gap-3 sm:gap-4 bg-white dark:bg-slate-900 p-3.5 sm:p-4 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-xs">
            <div className="relative w-full sm:w-80">
              <SearchIcon size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
              <input
                type="text"
                placeholder="ค้นหาชื่อหรือรหัสแคมเปญ..."
                value={searchTerm}
                onChange={e => setSearchTerm(e.target.value)}
                className="w-full pl-9 pr-3 py-2 bg-slate-100 dark:bg-slate-800 border-none rounded-xl text-xs font-semibold text-slate-800 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-blue-500 outline-none"
              />
            </div>

            <div className="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
              <span className="text-xs font-bold text-slate-400 mr-1 hidden sm:inline">สถานะ:</span>
              <button
                onClick={() => setFilterStatus('all')}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${filterStatus === 'all' ? 'bg-blue-600 text-white shadow-xs' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'}`}
              >
                ทั้งหมด
              </button>
              <button
                onClick={() => setFilterStatus('active')}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${filterStatus === 'active' ? 'bg-emerald-600 text-white shadow-xs' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'}`}
              >
                🟢 เปิดใช้งาน ({activeCount})
              </button>
              <button
                onClick={() => setFilterStatus('inactive')}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${filterStatus === 'inactive' ? 'bg-slate-700 text-white shadow-xs' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'}`}
              >
                ⚪ ปิดใช้งาน ({inactiveCount})
              </button>
            </div>
          </div>

          {/* Campaigns Grid - Highly Responsive (1 col mobile, 2 col tablet/desktop, 3 col wide) */}
          {isLoading ? (
            <div className="py-20 text-center text-slate-400 font-bold text-sm">
              <div className="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
              กำลังโหลดข้อมูลแคมเปญ...
            </div>
          ) : filteredCampaigns.length === 0 ? (
            <div className="bg-white dark:bg-slate-900 rounded-3xl p-12 text-center border border-slate-200 dark:border-slate-800 shadow-xs">
              <div className="w-16 h-16 rounded-3xl bg-blue-50 dark:bg-slate-800 text-blue-500 flex items-center justify-center mx-auto mb-4 text-3xl">
                🏆
              </div>
              <h3 className="text-lg font-black text-slate-800 dark:text-white">ยังไม่มีรายการแคมเปญ</h3>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 max-w-sm mx-auto">
                กดปุ่ม "สร้างแคมเปญใหม่" เพื่อเริ่มสร้างโปรโมชั่นการแข่งขันแรกให้กับทีมการตลาด
              </p>
              <button
                onClick={() => { setEditItem(null); setShowFormModal(true); }}
                className="mt-5 px-5 py-2.5 rounded-xl text-xs font-black bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-500/25 transition-all inline-flex items-center gap-2"
              >
                <Plus size={16} />
                สร้างแคมเปญแรก
              </button>
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5 sm:gap-6">
              {filteredCampaigns.map((camp) => {
                const isActive = camp.status === 'active';
                const today = getLocalISODate();
                const isOngoing = today >= camp.start_date && today <= camp.end_date;
                const isEnded = today > camp.end_date;

                return (
                  <div
                    key={camp.campaign_id}
                    className={`bg-white dark:bg-slate-900 rounded-3xl p-5 sm:p-6 border transition-all duration-300 shadow-sm hover:shadow-lg flex flex-col justify-between ${
                      isActive 
                        ? 'border-blue-300/80 dark:border-blue-500/40 ring-1 ring-blue-500/15' 
                        : 'border-slate-200/90 dark:border-slate-800 opacity-90'
                    }`}
                  >
                    <div>
                      {/* Top Bar inside Card */}
                      <div className="flex items-start justify-between gap-3 mb-3.5">
                        <div className="flex items-start gap-3">
                          <div className={`w-11 h-11 rounded-2xl flex items-center justify-center text-xl shadow-xs shrink-0 ${
                            isActive ? 'bg-amber-500/10 text-amber-500 border border-amber-500/20' : 'bg-slate-100 dark:bg-slate-800 text-slate-400 border border-slate-200 dark:border-slate-700'
                          }`}>
                            🏆
                          </div>
                          <div>
                            <span className="text-[10px] font-black uppercase tracking-wider px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 inline-block mb-1">
                              {camp.campaign_id}
                            </span>
                            <h3 className="text-base sm:text-lg font-black text-slate-900 dark:text-white leading-snug">
                              {camp.name}
                            </h3>
                          </div>
                        </div>

                        {/* Status Toggle Switch */}
                        <button
                          onClick={() => handleToggleStatus(camp)}
                          className={`flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-black transition-all shrink-0 ${
                            isActive
                              ? 'bg-emerald-500 text-white shadow-md shadow-emerald-500/25'
                              : 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'
                          }`}
                          title="คลิกเพื่อสลับ เปิด/ปิด ใช้งาน"
                        >
                          <span className={`w-2 h-2 rounded-full ${isActive ? 'bg-white animate-pulse' : 'bg-slate-400'}`}></span>
                          {isActive ? 'เปิดใช้งาน' : 'ปิดอยู่'}
                        </button>
                      </div>

                      {/* Description / Award */}
                      {camp.description ? (
                        <div className="p-3 rounded-2xl bg-amber-50/70 dark:bg-amber-950/20 border border-amber-200/70 dark:border-amber-900/40 mb-3.5 flex items-start gap-2">
                          <span className="text-sm shrink-0">🎁</span>
                          <p className="text-xs font-bold text-amber-900 dark:text-amber-200 leading-relaxed">
                            รางวัล: {camp.description}
                          </p>
                        </div>
                      ) : null}

                      {/* Date Badge */}
                      <div className="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-700/60 mb-3.5 flex items-center justify-between gap-2 text-xs">
                        <div className="flex items-center gap-2">
                          <span className="text-sm">🗓️</span>
                          <div>
                            <span className="font-bold text-slate-400 dark:text-slate-400 block text-[10px] uppercase tracking-wide">ช่วงเวลาแข่งขัน:</span>
                            <span className="font-black text-slate-800 dark:text-slate-100 text-xs">{camp.start_date} ถึง {camp.end_date}</span>
                          </div>
                        </div>
                        <span className={`text-[10px] font-black px-2.5 py-1 rounded-xl shrink-0 ${
                          isOngoing ? 'bg-blue-600 text-white shadow-xs' :
                          isEnded ? 'bg-rose-100 dark:bg-rose-950/40 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800/60' :
                          'bg-amber-100 dark:bg-amber-950/40 text-amber-700 dark:text-amber-400 border border-amber-200 dark:border-amber-800/60'
                        }`}>
                          {isOngoing ? '⚡ กำลังแข่งขัน' : isEnded ? 'สิ้นสุดแล้ว' : 'ยังไม่เริ่ม'}
                        </span>
                      </div>

                      {/* Rules Breakdown - Responsive 2 Columns */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-5">
                        {camp.cond1_enabled ? (
                          <div className="p-3 rounded-2xl bg-blue-50/70 dark:bg-blue-950/30 border border-blue-200/80 dark:border-blue-900/40 text-xs flex flex-col justify-between">
                            <span className="font-bold text-blue-800 dark:text-blue-300 block text-[11px]">
                              🩺 เงื่อนไข 1: คนมาตรวจ
                            </span>
                            <span className="font-black text-blue-600 dark:text-blue-400 text-sm mt-1">
                              ≥ {camp.cond1_target} คน
                            </span>
                          </div>
                        ) : (
                          <div className="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/30 text-[11px] text-slate-400 border border-slate-100 dark:border-slate-800/40 flex items-center">
                            ⚪ เงื่อนไข 1: ปิด
                          </div>
                        )}

                        {camp.cond2_enabled ? (
                          <div className="p-3 rounded-2xl bg-purple-50/70 dark:bg-purple-950/30 border border-purple-200/80 dark:border-purple-900/40 text-xs flex flex-col justify-between">
                            <span className="font-bold text-purple-800 dark:text-purple-300 block text-[11px]">
                              📦 เงื่อนไข 2: กล่อง (≥{formatNumber(camp.cond2_min_price)}฿)
                            </span>
                            <span className="font-black text-purple-600 dark:text-purple-400 text-sm mt-1">
                              ≥ {camp.cond2_target} กล่อง
                            </span>
                          </div>
                        ) : (
                          <div className="p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/30 text-[11px] text-slate-400 border border-slate-100 dark:border-slate-800/40 flex items-center">
                            ⚪ เงื่อนไข 2: ปิด
                          </div>
                        )}
                      </div>
                    </div>

                    {/* Actions Footer */}
                    <div className="pt-3.5 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between gap-2">
                      <button
                        onClick={() => setPreviewItem(camp)}
                        className="px-3.5 py-2 rounded-xl text-xs font-black bg-blue-50 dark:bg-blue-950/40 text-blue-600 dark:text-blue-400 hover:bg-blue-100 dark:hover:bg-blue-900/60 border border-blue-200/80 dark:border-blue-800/50 transition-colors flex items-center gap-1.5 shadow-2xs"
                      >
                        <Eye size={15} />
                        ดูผลแข่งขันสด
                      </button>

                      <div className="flex items-center gap-1.5">
                        <button
                          onClick={() => { setEditItem(camp); setShowFormModal(true); }}
                          className="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200/70 dark:border-slate-700/70 transition-colors"
                          title="แก้ไขแคมเปญ"
                        >
                          <Edit size={16} />
                        </button>
                        <button
                          onClick={() => setDeleteTarget(camp)}
                          className="p-2 rounded-xl text-rose-500 hover:text-rose-600 dark:hover:text-rose-400 bg-rose-50 dark:bg-rose-950/30 hover:bg-rose-100 dark:hover:bg-rose-900/40 border border-rose-200/70 dark:border-rose-900/40 transition-colors"
                          title="ลบแคมเปญ"
                        >
                          <Trash2 size={16} />
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* Modals */}
          <CampaignFormModal
            isOpen={showFormModal}
            onClose={() => { setShowFormModal(false); setEditItem(null); }}
            initialData={editItem}
            onSave={handleSaveCampaign}
            isSaving={isSaving}
          />

          <CampaignPreviewModal
            isOpen={!!previewItem}
            onClose={() => setPreviewItem(null)}
            campaign={previewItem}
            sales={sales}
            members={members}
            customers={customers}
          />

          <SqlNoticeModal
            isOpen={showSqlNotice}
            onClose={() => setShowSqlNotice(false)}
          />

          <ConfirmModal
            isOpen={!!deleteTarget}
            title="ยืนยันการลบแคมเปญ"
            message={`คุณแน่ใจหรือไม่ที่จะลบแคมเปญ "${deleteTarget?.name}"? การดำเนินการนี้ไม่สามารถย้อนกลับได้`}
            onConfirm={handleDeleteCampaign}
            onCancel={() => setDeleteTarget(null)}
          />
        </div>
      );
    };

    // ─────────────────────────────────────────────────────────────
    // 🚀 App Root Component
    // ─────────────────────────────────────────────────────────────
    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [isAppLoading, setIsAppLoading] = useState(true);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try {
          return localStorage.getItem('stk_sidebar_collapsed') === 'true';
        } catch(e) {
          return false;
        }
      });
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

      // 🌓 Theme Synchronization (Light / Dark)
      const [currentTheme, setCurrentTheme] = useState(() => {
        return (typeof window.getTheme === 'function') ? window.getTheme() : (localStorage.getItem('stk_theme') || 'light');
      });

      useEffect(() => {
        const applyTheme = (theme) => {
          setCurrentTheme(theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.backgroundColor = '#0f172a';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.backgroundColor = '#f8fafc';
          }
        };

        const initial = (typeof window.getTheme === 'function') ? window.getTheme() : (localStorage.getItem('stk_theme') || 'light');
        applyTheme(initial);

        const onThemeChange = (e) => {
          const t = e.detail?.theme || localStorage.getItem('stk_theme') || 'light';
          applyTheme(t);
        };
        window.addEventListener('stk_theme_change', onThemeChange);
        return () => window.removeEventListener('stk_theme_change', onThemeChange);
      }, []);

      const showToast = useCallback((msg, type = 'success') => {
        setToast({ show: true, message: msg, type });
        if (type === 'success') {
          setTimeout(() => setToast(prev => ({ ...prev, show: false })), 2500);
        }
      }, []);

      const currentUserProfileUrl = currentUser?.profileUrl || '';
      const pagePerm = window.getUserPagePermission ? window.getUserPagePermission(currentUser, 'campaign_settings') : 'none';
      const isAdmin = currentUser && (
        String(currentUser.role).trim() === 'ผู้ดูแลระบบ' ||
        String(currentUser.role).trim().toLowerCase().includes('admin') ||
        String(currentUser.role).trim().includes('แอดมิน') ||
        pagePerm === 'full'
      );

      useEffect(() => {
        try {
          const savedUser = localStorage.getItem('stk_current_user');
          if (savedUser) {
            const u = JSON.parse(savedUser);
            setCurrentUser(u);
            setIsLoggedIn(true);
          } else {
            setShowLoginModal(true);
          }
        } catch(e) {}

        setIsAppLoading(false);
      }, []);

      const handleLoginSuccess = (user) => {
        localStorage.setItem('stk_current_user', JSON.stringify(user));
        setCurrentUser(user);
        setIsLoggedIn(true);
        setShowLoginModal(false);
        showToast('เข้าสู่ระบบสำเร็จ!', 'success');
      };

      const handleLogout = () => {
        localStorage.removeItem('stk_current_user');
        setCurrentUser(null);
        setIsLoggedIn(false);
        const targetUrl = typeof resolvePageUrl === 'function' ? resolvePageUrl('?page=dashboard') : 'Mlm.html';
        if (typeof window !== 'undefined') window.location.href = targetUrl;
      };

      return (
        <div className="min-h-screen flex flex-col lg:flex-row font-sans bg-slate-50 dark:bg-slate-950 transition-colors">
          <Sidebar
            activePage="campaign_settings"
            isLoggedIn={isLoggedIn}
            currentUser={currentUser}
            currentUserProfileUrl={currentUserProfileUrl}
            isAdmin={isAdmin}
            onLogout={handleLogout}
            showLoginModal={showLoginModal}
            setShowLoginModal={setShowLoginModal}
            SCRIPT_URL=""
            setIsAppLoading={setIsAppLoading}
            isSidebarCollapsed={isSidebarCollapsed}
            setIsSidebarCollapsed={setIsSidebarCollapsed}
          />

          <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 dark:bg-slate-950 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden pb-24 lg:pb-8`}>
            {toast.show && (
              <div className="fixed bottom-5 right-5 z-[99999] flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border text-sm font-bold animation-pop bg-emerald-600 text-white border-emerald-500">
                <span>{toast.message}</span>
              </div>
            )}

            <CampaignSettingsView
              currentUser={currentUser}
              isAdmin={isAdmin}
              showToast={showToast}
            />
          </main>

          <LoginModal
            isOpen={showLoginModal}
            onClose={() => setShowLoginModal(false)}
            onLoginSuccess={handleLoginSuccess}
          />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
