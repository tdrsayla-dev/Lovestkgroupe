  <div id="initial-loader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999;">

    <p style="font-size: 0.875rem; color: #64748b; margin-top: 8px;">กำลังโหลดรายงานการเงิน...</p>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback, useReducer } = React;
    const { 
        Sidebar, LoginModal, Toast, EditModal, 
        Coins, Activity, FileText, Archive, Eye, Info, SearchIcon 
    } = window;

    const safeUpper = (str) => String(str || '').trim().toUpperCase();
    const getLocalISODate = () => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    function useDebounce(value, delay) {
        const [debouncedValue, setDebouncedValue] = React.useState(value);
        React.useEffect(() => {
            const handler = setTimeout(() => { setDebouncedValue(value); }, delay);
            return () => clearTimeout(handler);
        }, [value, delay]);
        return debouncedValue;
    }

    const SubTabButton = ({ id, label, activeTab, setSubTab, isSpecial, isData }) => {
        const isActive = activeTab === id;
        let baseClass = "px-4 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap flex-shrink-0 shadow-sm border ";
        if (isActive) {
            if (isSpecial) baseClass += "bg-indigo-600 text-white border-indigo-600 shadow-indigo-200";
            else if (isData) baseClass += "bg-emerald-600 text-white border-emerald-600 shadow-emerald-200";
            else baseClass += "bg-blue-600 text-white border-blue-600 shadow-blue-200";
        } else {
            baseClass += "bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-blue-600";
        }
        return (
            <button type="button" onClick={() => setSubTab(id)} className={baseClass}>
                {label}
            </button>
        );
    };

    const { 
        parseSaleCurrencyAmounts, 
        processFinanceSales, 
        filterFinanceBills, 
        calculateFinanceKpi, 
        calculateYearlyFinanceData 
    } = window.ReportFinanceEngine || {};


    function App() {
        const [currentUser, setCurrentUser] = useState(null);
        const [isLoggedIn, setIsLoggedIn] = useState(false);
        const [showLoginModal, setShowLoginModal] = useState(false);
        const [systemUsers, setSystemUsers] = useState([]);
        const [isAppLoading, setIsAppLoading] = useState(true);
        const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
            try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch (e) { return false; }
        });

        // Language & Theme Sync
        const [, forceThemeUpdate] = useReducer(x => x + 1, 0);
        useEffect(() => {
            const onThemeChange = () => forceThemeUpdate();
            window.addEventListener('stk_theme_change', onThemeChange);
            return () => window.removeEventListener('stk_theme_change', onThemeChange);
        }, []);

        // Data States
        const [sales, setSales] = useState([]);
        const [members, setMembers] = useState([]);
        const [systemSettings, setSystemSettings] = useState({ exchange_rate: 700 });

        // Filter States
        const todayStr = getLocalISODate();
        const [subTab, setSubTab] = useState('finance_summary'); // 'finance_summary' | 'finance_detail'
        const [startDate, setStartDate] = useState(todayStr);
        const [endDate, setEndDate] = useState(todayStr);
        const [searchQuery, setSearchQuery] = useState('');
        const debouncedSearchQuery = useDebounce(searchQuery, 300);
        const [viewBillDetail, setViewBillDetail] = useState(null);

        const exchangeRate = Number(systemSettings?.exchange_rate || 700);

        const pagePerm = window.getUserPagePermission ? window.getUserPagePermission(currentUser, 'reports') : 'none';
        const isAdmin = currentUser && (
            String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || 
            String(currentUser.role).trim().toLowerCase().includes('admin') || String(currentUser.role).trim().includes('แอดมิน') ||
            pagePerm === 'full'
        );

        const handleLoginSuccess = (user) => {
            localStorage.setItem('stk_current_user', JSON.stringify(user));
            setCurrentUser(user);
            setIsLoggedIn(true);
            setShowLoginModal(false);
        };

        const handleLogout = () => {
            localStorage.removeItem('stk_current_user');
            setCurrentUser(null);
            setIsLoggedIn(false);
        };

        const permittedMemberSet = useMemo(() => {
            if (!currentUser || isAdmin) return null;
            const userId = safeUpper(currentUser.id || currentUser.username);
            let downlines = new Set([userId]);
            let queue = [userId];

            while (queue.length > 0) {
                let parentId = queue.shift();
                (members || []).forEach(m => {
                    if (m && m.id) {
                        const sponsor = safeUpper(m.referrer || m.sponsorId);
                        if (sponsor === parentId) {
                            let mId = safeUpper(m.id);
                            if (!downlines.has(mId)) {
                                downlines.add(mId);
                                queue.push(mId);
                            }
                        }
                    }
                });
            }
            return downlines;
        }, [currentUser, isAdmin, members]);

        const fetchFinanceData = useCallback(async () => {
            try {
                const [saleRes, memRes, settingsRes] = await Promise.all([
                    window.supabaseSelect('stk_sales', 'order=order_id.desc&limit=2500').catch(() => []),
                    window.supabaseSelect('stk_members', 'select=user_id,name,sponsor_id,business_team,permission_role,status').catch(() => []),
                    window.supabaseSelect('stk_system_settings').catch(() => [])
                ]);

                if (Array.isArray(memRes)) {
                    setSystemUsers(memRes);
                }

                if (Array.isArray(settingsRes) && settingsRes.length > 0) {
                    const settingsObj = {};
                    settingsRes.forEach(s => {
                        if (s && (s.key || s.setting_key)) {
                            const k = s.key || s.setting_key;
                            const v = s.value !== undefined ? s.value : s.setting_value;
                            settingsObj[k] = typeof v === 'string' ? v : JSON.stringify(v);
                        }
                    });
                    setSystemSettings(prev => ({ ...prev, ...settingsObj }));
                }

                if (Array.isArray(memRes)) {
                    setMembers(memRes.map(m => ({
                        id: String(m.user_id || m.id || '').trim(),
                        name: String(m.name || '').trim(),
                        referrer: String(m.sponsor_id || m.referrer || '').trim(),
                        team: String(m.business_team || m.team || 'Marketing').trim()
                    })));
                }

                if (Array.isArray(saleRes)) {
                    setSales(processFinanceSales ? processFinanceSales(saleRes) : saleRes);
                }
            } catch (err) {
                console.error("Finance fetch error:", err);
            } finally {
                setIsAppLoading(false);
            }
        }, []);

        useEffect(() => {
            const savedUserStr = localStorage.getItem('stk_current_user');
            if (savedUserStr) {
                try {
                    setCurrentUser(JSON.parse(savedUserStr));
                    setIsLoggedIn(true);
                } catch(e) {
                    setShowLoginModal(true);
                }
            } else setShowLoginModal(true);

            const initialLoader = document.getElementById('initial-loader');
            if (initialLoader) { 
                initialLoader.style.opacity = '0'; 
                setTimeout(() => { if (initialLoader) initialLoader.style.display = 'none'; }, 400); 
            }

            fetchFinanceData();
        }, [fetchFinanceData]);

        // Filtered Bills for Detail Tab
        const financeBills = useMemo(() => {
            if (filterFinanceBills) {
                return filterFinanceBills(sales, startDate, endDate, permittedMemberSet, debouncedSearchQuery || searchQuery);
            }
            return [];
        }, [sales, startDate, endDate, permittedMemberSet, debouncedSearchQuery, searchQuery]);

        // KPI Summary
        const financeKpi = useMemo(() => {
            if (calculateFinanceKpi) {
                return calculateFinanceKpi(financeBills, exchangeRate);
            }
            return { sumLak: 0, sumThb: 0, grandCombinedTHB: 0, lakBillsCount: 0, thbBillsCount: 0 };
        }, [financeBills, exchangeRate]);

        // 12 Months Summary (for Annual Table & Combo Chart)
        const currentYearNum = startDate ? new Date(startDate).getFullYear() : new Date().getFullYear();
        const activeYear = isNaN(currentYearNum) ? new Date().getFullYear() : currentYearNum;

        const financeSummaryData = useMemo(() => {
            if (calculateYearlyFinanceData) {
                return calculateYearlyFinanceData(sales, activeYear, exchangeRate, permittedMemberSet, debouncedSearchQuery || searchQuery);
            }
            return [];
        }, [sales, activeYear, permittedMemberSet, debouncedSearchQuery, searchQuery, exchangeRate]);
        // ═════════════════════════════════════════════════════════════════════
        // 🖨️ OFFICIAL PRINT & PDF REPORT GENERATOR (FOR FINANCE)
        // ═════════════════════════════════════════════════════════════════════
        const handlePrintReport = (isPdf = false) => {
            const printWin = window.open('', '_blank');
            if (!printWin) {
                alert('เบราว์เซอร์บล็อกหน้าต่าง Popup กรุณาอนุญาต (Allow Pop-ups) ก่อนพิมพ์เอกสารรายงาน');
                return;
            }

            const compSettings = (typeof window.getCompanySettings === 'function') 
                ? window.getCompanySettings() 
                : { name: 'LOVE STK GROUPE', branch: 'สำนักงานใหญ่', address: 'เวียงจันทน์, สปป.ลาว', phone: '+856 20 xx xxx xxx', taxId: '' };

            // ดึงโลโก้จากตั้งค่าระบบเพิ่มเติม
            let logoUrl = compSettings.logoUrl || '';
            try {
                const localSet = JSON.parse(localStorage.getItem('stk_system_settings') || '{}');
                if (localSet.company_logo || localSet.logo_url) {
                    logoUrl = localSet.company_logo || localSet.logo_url;
                }
            } catch(e) {}

            const now = new Date();
            const printDateStr = now.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            const printTimeStr = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.';
            const escapeHtml = (str) => String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            const formatThaiDate = (dateStr) => {
                if (!dateStr) return '-';
                try {
                    const parts = String(dateStr).split('-');
                    if (parts.length === 3) {
                        const dt = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                        if (!isNaN(dt.getTime())) return dt.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
                    }
                    return dateStr;
                } catch(e) { return dateStr; }
            };

            const isSummary = subTab === 'finance_summary';
            const docTitle = isSummary ? `รายงานสรุปรายรับบริษัท_รายปี_${activeYear}` : `รายละเอียดรับเงินแยกตามบิล_${startDate}_ถึง_${endDate}`;

            let tableHeadersHtml = '';
            let tableRowsHtml = '';
            let tableFootHtml = '';

            if (isSummary) {
                tableHeadersHtml = `
                    <tr>
                        <th style="width: 50px;">ลำดับ</th>
                        <th>ช่วงเวลา (เดือน)</th>
                        <th style="text-align: center;">จำนวนบิลทั้งหมด</th>
                        <th style="text-align: right;">รายรับ (เงินกีบ ₭)</th>
                        <th style="text-align: right;">รายรับ (เงินบาท ฿)</th>
                        <th style="text-align: right; background-color: #e0e7ff;">ยอดรวมสุทธิ (คิดเป็นบาท ฿)</th>
                    </tr>
                `;
                
                let totalBills = 0, totalThbRaw = 0;
                tableRowsHtml = financeSummaryData.map((row, idx) => {
                    totalBills += row.billsCount;
                    const rowNetThb = row.sumThb + (row.sumLak / exchangeRate);
                    totalThbRaw += rowNetThb;
                    return `
                        <tr>
                            <td style="text-align: center;">${idx + 1}</td>
                            <td style="font-weight: bold;">${escapeHtml(row.period)}</td>
                            <td style="text-align: center;">${row.billsCount.toLocaleString()} บิล</td>
                            <td class="num-cell" style="color: #047857;">${row.sumLak > 0 ? Math.round(row.sumLak).toLocaleString() + ' ₭' : '-'}</td>
                            <td class="num-cell" style="color: #1d4ed8;">${row.sumThb > 0 ? '฿' + row.sumThb.toLocaleString(undefined, {minimumFractionDigits: 2}) : '-'}</td>
                            <td class="num-cell" style="font-weight: 800; background: #eff6ff; color: #1e3a8a;">${rowNetThb > 0 ? '฿' + rowNetThb.toLocaleString(undefined, {minimumFractionDigits: 2}) : '-'}</td>
                        </tr>
                    `;
                }).join('');

                tableFootHtml = `
                    <tr>
                        <td colspan="2" style="text-align: right; font-weight: 800;">ยอดรวมสุทธิทั้งปี:</td>
                        <td style="text-align: center; font-weight: 800;">${totalBills.toLocaleString()} บิล</td>
                        <td colspan="2" style="text-align: right; font-weight: 800;">ยอดรวมสุทธิคิดเป็นเงินบาท (THB):</td>
                        <td class="num-cell" style="font-size: 14px; font-weight: 900; background: #e0e7ff; color: #1e3a8a;">฿${totalThbRaw.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                    </tr>
                `;
            } else {
                tableHeadersHtml = `
                    <tr>
                        <th style="width: 90px;">เลขที่บิล</th>
                        <th style="width: 80px;">วันที่</th>
                        <th>ผู้ขาย (พนักงาน)</th>
                        <th>ชื่อลูกค้า</th>
                        <th style="text-align: center;">ช่องทางชำระ</th>
                        <th style="text-align: right; width: 110px;">ยอดรับ (เงินกีบ)</th>
                        <th style="text-align: right; width: 110px;">ยอดรับ (เงินบาท)</th>
                    </tr>
                `;
                
                let sumLak = 0, sumThb = 0;
                tableRowsHtml = financeBills.map((s, idx) => {
                    const displayCust = (s.customerName && s.customerName !== 'ไม่ระบุชื่อ') ? s.customerName : (s.customerId ? `ลูกค้า (${s.customerId})` : 'ลูกค้าทั่วไป');
                    const { lakAmt, thbAmt, realPayMode } = parseSaleCurrencyAmounts(s, exchangeRate);
                    sumLak += lakAmt; sumThb += thbAmt;
                    
                    return `
                        <tr>
                            <td style="font-family: monospace; font-weight: bold; color: #2563eb;">${escapeHtml(s.id)}</td>
                            <td>${escapeHtml(s.date)}</td>
                            <td>${escapeHtml(s.sellerName || s.memberId)}</td>
                            <td>${escapeHtml(displayCust)}</td>
                            <td style="text-align: center; font-size: 10px;">${escapeHtml(realPayMode || 'เงินโอน')}</td>
                            <td class="num-cell" style="color: #047857;">${lakAmt > 0 ? Math.round(lakAmt).toLocaleString() + ' ₭' : '-'}</td>
                            <td class="num-cell" style="color: #1d4ed8;">${thbAmt > 0 ? '฿' + (thbAmt % 1 === 0 ? thbAmt.toLocaleString() : thbAmt.toLocaleString(undefined, {minimumFractionDigits: 2})) : '-'}</td>
                        </tr>
                    `;
                }).join('');

                const grandTotalTHB = sumThb + (sumLak / exchangeRate);
                tableFootHtml = `
                    <tr>
                        <td colspan="5" style="text-align: right; font-weight: 800;">รวมยอดหน้านี้ (${financeBills.length.toLocaleString()} บิล):</td>
                        <td class="num-cell" style="font-weight: 800; color: #047857;">${Math.round(sumLak).toLocaleString()} ₭</td>
                        <td class="num-cell" style="font-weight: 800; color: #1d4ed8;">฿${sumThb.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                    </tr>
                    <tr>
                        <td colspan="6" style="text-align: right; font-weight: 800;">ยอดรวมสุทธิคิดเป็นเงินบาท (Net Total THB):</td>
                        <td class="num-cell" style="font-size: 14px; font-weight: 900; background: #e0e7ff; color: #1e3a8a;">฿${grandTotalTHB.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                    </tr>
                `;
            }

            const htmlContent = `

                                                            <span className="flex items-center justify-end gap-2">
                                                                <Activity size={18} className="text-blue-200" />
                                                                ยอดรวมสุทธิคิดเป็นเงินบาท (Net Total THB) จากทั้งหมด {financeSummaryData.reduce((a, r) => a + r.billsCount, 0).toLocaleString()} บิล
                                                            </span>
                                                        </td>
                                                        <td className="p-4 text-right font-black text-xl text-yellow-300 drop-shadow-md">
                                                            ฿{financeSummaryData.reduce((a, r) => a + r.sumThb + (r.sumLak / exchangeRate), 0).toLocaleString(undefined, {minimumFractionDigits: 2})}
                                                        </td>
                                                    </tr>
                                                </tfoot>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            /* TAB 2: รายละเอียดรับเงินแยกตามบิล */
                            <div className="space-y-6 animation-fade-in">
                                {/* KPI Cards */}
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div className="bg-gradient-to-br from-amber-500 to-orange-600 p-4 rounded-2xl shadow-md text-white">
                                        <div className="text-xs font-bold text-amber-100 mb-1">💰 รวมสุทธิ (คิดเป็นบาท)</div>
                                        <div className="text-2xl font-black">฿{(Math.round(financeKpi.grandCombinedTHB * 100) / 100).toLocaleString(undefined, {minimumFractionDigits: 2})}</div>
                                    </div>
                                    <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl shadow-sm">
                                        <div className="text-xs font-bold text-emerald-700 mb-1">🇱🇦 ยอดรับ (กีบ)</div>
                                        <div className="text-xl font-black text-emerald-700">{Math.round(financeKpi.sumLak).toLocaleString()} ₭</div>
                                        <div className="text-[11px] text-emerald-600 font-bold mt-1">{financeKpi.lakBillsCount} บิล</div>
                                    </div>
                                    <div className="bg-blue-50 border border-blue-200 p-4 rounded-2xl shadow-sm">
                                        <div className="text-xs font-bold text-blue-700 mb-1">🇹🇭 ยอดรับ (บาท)</div>
                                        <div className="text-xl font-black text-blue-700">฿{financeKpi.sumThb.toLocaleString(undefined, {minimumFractionDigits: 2})}</div>
                                        <div className="text-[11px] text-blue-600 font-bold mt-1">{financeKpi.thbBillsCount} บิล</div>
                                    </div>
                                </div>

                                {/* Table: บิลทั้งหมด */}
                                <div className="space-y-4">
                                    <div className="flex justify-end gap-3 print-hide">
                                        <button type="button" onClick={() => {
                                            let rows = [['เลขที่บิล', 'วันที่', 'ผู้ขาย (พนักงาน)', 'ชื่อลูกค้า', 'ช่องทางชำระ', 'ยอดรับ (เงินกีบ)', 'ยอดรับ (เงินบาท)']];
                                            financeBills.forEach(s => {
                                                const displayCust = (s.customerName && s.customerName !== 'ไม่ระบุชื่อ') ? s.customerName : (s.customerId ? `ลูกค้า (${s.customerId})` : 'ลูกค้าทั่วไป');
                                                const { lakAmt, thbAmt, realPayMode } = parseSaleCurrencyAmounts(s, exchangeRate);
                                                const payMode = String(realPayMode || 'เงินโอน').trim();
                                                rows.push([s.id, s.date, s.sellerName || s.memberId, displayCust, payMode, lakAmt, thbAmt]);
                                            });
                                            let sumLak = 0; let sumThb = 0;
                                            financeBills.forEach(s => {
                                                const { lakAmt, thbAmt } = parseSaleCurrencyAmounts(s, exchangeRate);
                                                sumLak += lakAmt; sumThb += thbAmt;
                                            });
                                            rows.push(['', '', '', '', 'ยอดรวมสุทธิ', sumLak, sumThb]);
                                            if (typeof window.exportToCSV === 'function') {
                                                window.exportToCSV(rows, `finance_bills_${getLocalISODate()}.csv`);
                                            }
                                        }} className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm flex items-center gap-2 transition-colors no-print">
                                            <Archive size={16}/> Export Excel
                                        </button>
                                        <button type="button" onClick={() => handlePrintReport(true)} className="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm flex items-center gap-2 transition-colors no-print">
                                            <FileText size={16}/> Export PDF
                                        </button>
                                        <button type="button" onClick={() => handlePrintReport(false)} className="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm flex items-center gap-2 transition-colors no-print">
                                            <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg> 
                                            พิมพ์ (Print)
                                        </button>
                                    </div>

                                    <div className={`${boxWrapper} p-0 overflow-hidden`}>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse min-w-[1000px]">
                                                <thead>
                                                    <tr className="bg-slate-100 border-b border-slate-200">
                                                        <th className={thBase}>เลขที่บิล</th>
                                                        <th className={thBase}>วันที่</th>
                                                        <th className={thBase}>ผู้ขาย (พนักงาน)</th>
                                                        <th className={thBase}>ชื่อลูกค้า</th>
                                                        <th className={thBase}>ช่องทางชำระ</th>
                                                        <th className={`${thBase} text-right text-emerald-700 font-bold bg-emerald-50/60`}>ยอดรับ (เงินกีบ)</th>
                                                        <th className={`${thBase} text-right text-blue-700 font-bold bg-blue-50/60`}>ยอดรับ (เงินบาท)</th>
                                                        <th className={`${thBase} text-center no-print`}>รายละเอียด</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {financeBills.map((s, idx) => {
                                                        const displayCust = (s.customerName && s.customerName !== 'ไม่ระบุชื่อ') ? s.customerName : (s.customerId ? `ลูกค้า (${s.customerId})` : 'ลูกค้าทั่วไป');
                                                        const { lakAmt, thbAmt, realPayMode } = parseSaleCurrencyAmounts(s, exchangeRate);
                                                        
                                                        let displayLakStr = lakAmt > 0 ? `${Math.round(lakAmt).toLocaleString()} ₭` : '-';
                                                        let displayThbStr = thbAmt > 0 ? `฿${(thbAmt % 1 === 0 ? thbAmt.toLocaleString() : thbAmt.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }))}` : '-';

                                                        return (
                                                            <tr key={s.id || idx} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                                <td className="p-4 text-xs font-mono font-bold text-blue-600 whitespace-nowrap">{s.id}</td>
                                                                <td className="p-4 text-xs font-bold text-slate-600 whitespace-nowrap">{s.date}</td>
                                                                <td className="p-4 text-xs font-bold text-slate-800">{s.sellerName || s.memberId}</td>
                                                                <td className="p-4 text-xs font-bold text-slate-900 bg-slate-50/50">{displayCust}</td>
                                                                <td className="p-4 text-xs font-bold">
                                                                    <div className="space-y-1">
                                                                        {(() => {
                                                                            const st = String(realPayMode || 'เงินโอน').trim();
                                                                            
                                                                            const getTagColor = (text, isLak) => {
                                                                                if (isLak) return 'bg-emerald-50 text-emerald-700 border-emerald-300';
                                                                                const t = String(text || '').toUpperCase();
                                                                                if (t.includes('กีบ') || t.includes('LAK') || t.includes('KIP')) return 'bg-emerald-50 text-emerald-700 border-emerald-300';
                                                                                if (t.includes('บาท') || t.includes('THB') || t.includes('ไทย') || t.includes('สดบาท')) return 'bg-blue-50 text-blue-700 border-blue-300';
                                                                                if (lakAmt > 0 && thbAmt === 0) return 'bg-emerald-50 text-emerald-700 border-emerald-300';
                                                                                return 'bg-blue-50 text-blue-700 border-blue-300';
                                                                            };

                                                                            const formatChannelName = (name, amount) => {
                                                                                let n = String(name || '').trim();
                                                                                const amt = Number(amount) || 0;
                                                                                const isLakRow = (amt >= 70000) || (lakAmt > 0 && thbAmt === 0);

                                                                                if (n === 'สด' || n === 'สดบาท') return isLakRow ? 'สดกีบ' : 'สดบาท';
                                                                                if (n === 'สดกีบ') return 'สดกีบ';
                                                                                if (n === 'โอน' || n === 'เงินโอน') {
                                                                                    return isLakRow ? 'เงินโอน (กีบ)' : 'เงินโอน (บาท)';
                                                                                }

                                                                                if (n.includes('โอนลาว') && (amt >= 70000 || (n.includes('กีบ') || (lakAmt > 0 && thbAmt === 0 && !n.includes('ไทย'))))) {
                                                                                    if (n.includes('BCEL')) return 'โอนลาวกีบ (BCEL)';
                                                                                    if (n.includes('JDB')) return 'โอนลาวกีบ (JDB)';
                                                                                    if (n.includes('LDB')) return 'โอนลาวกีบ (LDB)';
                                                                                    return 'โอนลาวกีบ';
                                                                                }

                                                                                n = n.replace('โอนลาวกีบ(BCEL)', 'โอนลาวกีบ (BCEL)')
                                                                                     .replace('โอนลาวบาท(BCEL)', 'โอนลาวบาท (BCEL)')
                                                                                     .replace('โอนลาวกีบ(JDB)', 'โอนลาวกีบ (JDB)')
                                                                                     .replace('โอนลาวบาท(JDB)', 'โอนลาวบาท (JDB)')
                                                                                     .replace('โอนไทย(กสิกรไทย)', 'โอนไทย (กสิกรไทย)')
                                                                                     .replace('โอนไทย(ไทยพาณิชย์)', 'โอนไทย (ไทยพาณิชย์)');
                                                                                return n;
                                                                            };

                                                                            if (st.includes('|') || st.includes(':')) {
                                                                                return st.split('|').map((part, pIdx) => {
                                                                                    let pTrim = part.trim();
                                                                                    if (!pTrim.includes(':')) {
                                                                                        const displayLabel = formatChannelName(pTrim, 0);
                                                                                        return <span key={pIdx} className={`inline-block px-2.5 py-1 border rounded-lg text-xs font-bold whitespace-nowrap mb-1 mr-1 ${getTagColor(pTrim, lakAmt > 0 && thbAmt === 0)}`}>{displayLabel}</span>;
                                                                                    }
                                                                                    const colonIdx = pTrim.indexOf(':');
                                                                                    const k = pTrim.substring(0, colonIdx).trim();
                                                                                    const v = Number(pTrim.substring(colonIdx + 1).trim()) || 0;
                                                                                    if (k.toUpperCase() === 'เรท' || k.toUpperCase() === 'RATE') return null;
                                                                                    
                                                                                    const isItemLak = (v >= 70000) || k.includes('กีบ') || (k.includes('ลาว') && !k.includes('บาท') && !k.includes('ไทย'));
                                                                                    const displayLabel = formatChannelName(k, v);
                                                                                    return <span key={pIdx} className={`inline-block px-2.5 py-1 border rounded-lg text-[11px] font-bold whitespace-nowrap mb-1 mr-1 ${getTagColor(displayLabel, isItemLak)}`}>{displayLabel}</span>;
                                                                                }).filter(Boolean);
                                                                            }
                                                                            
                                                                            const isOnlyLak = lakAmt > 0 && thbAmt === 0;
                                                                            const displayLabel = formatChannelName(st, lakAmt || thbAmt);
                                                                            return <span className={`px-2.5 py-1 border rounded-lg text-xs font-bold whitespace-nowrap inline-block ${getTagColor(displayLabel, isOnlyLak)}`}>{displayLabel}</span>;
                                                                        })()}
                                                                    </div>
                                                                </td>
                                                                <td className="p-4 text-right text-sm font-black text-emerald-700 bg-emerald-50/30 whitespace-nowrap">
                                                                    {displayLakStr}
                                                                </td>
                                                                <td className="p-4 text-right text-sm font-black text-blue-700 bg-blue-50/30 whitespace-nowrap">
                                                                    {displayThbStr}
                                                                </td>
                                                                <td className="p-4 text-center no-print">
                                                                    <button type="button" onClick={() => setViewBillDetail(s)} className="inline-flex items-center gap-1 px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-600 rounded-lg text-xs font-bold transition-colors">
                                                                        <Eye size={13}/> ดูบิล
                                                                    </button>
                                                                </td>
                                                            </tr>
                                                        );
                                                    })}
                                                    {financeBills.length === 0 && (
                                                        <tr><td colSpan={8} className="p-12 text-center text-slate-400 font-bold">ไม่พบข้อมูลการเงินตามเงื่อนไขที่ระบุ</td></tr>
                                                    )}
                                                </tbody>
                                                {financeBills.length > 0 && (() => {
                                                    let sumLak = 0; let sumThb = 0;
                                                    financeBills.forEach(s => {
                                                        const { lakAmt, thbAmt } = parseSaleCurrencyAmounts(s, exchangeRate);
                                                        sumLak += lakAmt; sumThb += thbAmt;
                                                    });
                                                    const grandTotalTHB = sumThb + (sumLak / exchangeRate);
                                                    return (
                                                        <tfoot className="bg-slate-50 border-t-2 border-slate-200">
                                                            <tr className="font-bold text-slate-700">
                                                                <td colSpan={5} className="p-4 text-right font-black">รวมยอดหน้านี้ ({financeBills.length.toLocaleString()} บิล):</td>
                                                                <td className="p-4 text-right text-base font-black text-emerald-700 bg-emerald-50/50">
                                                                    {Math.round(sumLak).toLocaleString()} ₭
                                                                </td>
                                                                <td className="p-4 text-right text-base font-black text-blue-700 bg-blue-50/50">
                                                                    ฿{sumThb.toLocaleString(undefined, {minimumFractionDigits: 2})}
                                                                </td>
                                                                <td className="no-print"></td>
                                                            </tr>
                                                            <tr className="bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-inner">
                                                                <td colSpan={5} className="p-4 text-right font-bold text-sm tracking-wide border-r border-white/10">
                                                                    <span className="flex items-center justify-end gap-2">
                                                                        <Activity size={18} className="text-blue-200" />
                                                                        ยอดรวมสุทธิคิดเป็นเงินบาท (Net Total THB)
                                                                    </span>
                                                                </td>
                                                                <td colSpan={2} className="p-4 text-right font-black text-xl text-yellow-300 drop-shadow-md">
                                                                    ฿{grandTotalTHB.toLocaleString(undefined, {minimumFractionDigits: 2})}
                                                                </td>
                                                                <td className="no-print"></td>
                                                            </tr>
                                                        </tfoot>
                                                    );
                                                })()}
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Modal: ดูรายละเอียดบิลอย่างสมบูรณ์แบบ (เหมือน Reports.html) */}
                        <EditModal isOpen={viewBillDetail !== null} onClose={() => setViewBillDetail(null)} title={'รายละเอียดบิล ' + (viewBillDetail?.id || '')} icon={FileText} maxWidthClass="max-w-2xl">
                            {viewBillDetail && (
                                <div className="flex flex-col gap-5 p-2">
                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200/80 space-y-2 text-xs font-semibold">
                                        <div className="flex justify-between"><span className="text-slate-500">เลขที่บิล:</span> <span className="font-black text-blue-600 text-sm">{viewBillDetail.id}</span></div>
                                        <div className="flex justify-between"><span className="text-slate-500">วันที่คีย์บิล:</span> <span className="font-bold text-slate-800">{viewBillDetail.date}</span></div>
                                        <div className="flex justify-between border-t border-slate-200/60 pt-2 mt-1"><span className="text-slate-500">ลูกค้า:</span> <span className="font-bold text-slate-800">{viewBillDetail.customerName || viewBillDetail.customerId}</span></div>
                                        <div className="flex justify-between"><span className="text-slate-500">ผู้ขาย (เจ้าของเคส):</span> <span className="font-bold text-indigo-600">{viewBillDetail.sellerName || viewBillDetail.memberId}</span></div>
                                    </div>

                                    <div className="border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                                        <table className="w-full text-left text-sm">
                                            <thead className="bg-slate-100 border-b border-slate-200 text-slate-600 text-[11px] uppercase tracking-wider">
                                                <tr>
                                                    <th className="p-3 font-black pl-4">รายการสินค้า</th>
                                                    <th className="p-3 text-center font-black w-24">จำนวน</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {(() => {
                                                    let billItems = [];
                                                    if (viewBillDetail._items && viewBillDetail._items.length > 0) {
                                                        viewBillDetail._items.forEach(it => {
                                                            billItems.push({
                                                                name: it.prod || it.productName || it.name,
                                                                qty: Number(it.qty || it.quantity),
                                                                type: it.type || 'ราคาเต็ม'
                                                            });
                                                        });
                                                    } else {
                                                        Object.keys(viewBillDetail).forEach(k => {
                                                            if (k.endsWith('_ราคาเต็ม') || k.endsWith('_ราคาสมาชิก') || k.endsWith('_ราคาโปร') || k.endsWith('_ราคาศูนย์')) {
                                                                const qty = Number(viewBillDetail[k]);
                                                                if (qty > 0) {
                                                                    const pName = k.substring(0, k.lastIndexOf('_'));
                                                                    const type = k.substring(k.lastIndexOf('_') + 1);
                                                                    billItems.push({ name: pName, qty, type });
                                                                }
                                                            }
                                                        });
                                                    }

                                                    if (billItems.length === 0) {
                                                        return <tr><td colSpan="2" className="p-8 text-center text-slate-400 font-bold">ไม่พบรายการสินค้าในบิลนี้</td></tr>;
                                                    }

                                                    return billItems.map((item, idx) => (
                                                        <tr key={idx} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                            <td className="p-4 font-bold text-slate-800">
                                                                {item.name} 
                                                                <span className="text-[10px] text-slate-500 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded-md ml-2">{item.type}</span>
                                                            </td>
                                                            <td className="p-4 text-center font-black text-blue-600 text-lg">{item.qty}</td>
                                                        </tr>
                                                    ));
                                                })()}
                                            </tbody>
                                            <tfoot className="bg-blue-50/50 border-t-2 border-blue-100">
                                                <tr>
                                                    <td className="p-4 text-right font-black text-slate-600 uppercase">รวมจำนวนชิ้นทั้งหมด:</td>
                                                    <td className="p-4 text-center font-black text-2xl text-blue-700 bg-blue-100/50 rounded-br-xl border-x border-blue-100/50">
                                                        {viewBillDetail['ยอดรวมชิ้นทั้งหมด'] || Object.keys(viewBillDetail).filter(k => k.includes('_ราคา') && !k.includes('รวมชิ้น') && viewBillDetail[k] > 0).reduce((sum, key) => sum + parseInt(viewBillDetail[key]), 0)}
                                                    </td>
                                                </tr>
                                            </tfoot>
                                        </table>
                                        
                                        <div className="p-4 bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-t border-slate-200">
                                            <div className="flex flex-col gap-1 w-full md:w-auto">
                                                <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">ช่องทางชำระเงิน</span>
                                                <div className="flex flex-wrap items-center gap-1.5 pt-1">
                                                    {(() => {
                                                        const st = String(viewBillDetail.saleType || viewBillDetail.payMode || 'เงินโอน').trim();
                                                        if (st.includes('|') || st.includes(':')) {
                                                            return st.split('|').map(p => p.trim()).join(' | ');
                                                        }
                                                        return st;
                                                    })()}
                                                </div>
                                                {viewBillDetail.paymentNote && <span className="text-[11px] text-amber-600 font-bold mt-2 flex items-center gap-1"><Info size={12}/> หมายเหตุ: {viewBillDetail.paymentNote}</span>}
                                            </div>
                                            <div className="flex flex-col items-end text-right w-full md:w-auto border-t md:border-t-0 md:border-l border-blue-200/50 pt-4 md:pt-0 md:pl-6">
                                                <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">ยอดรับรวม</span>
                                                {(() => {
                                                    const { lakAmt, thbAmt } = parseSaleCurrencyAmounts(viewBillDetail, exchangeRate);
                                                    return (
                                                        <div className="flex flex-col items-end gap-1">
                                                            {lakAmt > 0 && <span className="text-2xl font-black text-emerald-600 leading-none drop-shadow-sm">{Math.round(lakAmt).toLocaleString()} ₭</span>}
                                                            {thbAmt > 0 && <span className="text-2xl font-black text-blue-700 leading-none drop-shadow-sm">฿{(thbAmt % 1 === 0 ? thbAmt.toLocaleString() : thbAmt.toLocaleString(undefined, {minimumFractionDigits:2}))}</span>}
                                                            {lakAmt === 0 && thbAmt === 0 && <span className="text-xl font-bold text-slate-400">0 บาท</span>}
                                                        </div>
                                                    );
                                                })()}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex justify-end pt-2 border-t border-slate-100">
                                        <button onClick={() => setViewBillDetail(null)} className="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl border border-slate-200 transition-colors shadow-sm">ปิดหน้าต่าง</button>
                                    </div>
                                </div>
                            )}
                        </EditModal>
                    </div>
                </main>
                <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={systemUsers} />
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
