  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback, useReducer } = React;
    const { 
        Sidebar, LoginModal, Toast, EditModal, 
        Coins, Activity, FileText, Archive, Eye, Info, SearchIcon 
    } = window;

    const safeUpper = (str) => String(str || '').trim().toUpperCase();
    const getLocalISODate = () => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    function useDebounce(value, delay) {
        const [debouncedValue, setDebouncedValue] = React.useState(value);
        React.useEffect(() => {
            const handler = setTimeout(() => { setDebouncedValue(value); }, delay);
            return () => clearTimeout(handler);
        }, [value, delay]);
        return debouncedValue;
    }

    const SubTabButton = ({ id, label, activeTab, setSubTab, isSpecial, isData }) => {
        const isActive = activeTab === id;
        let baseClass = "px-4 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap flex-shrink-0 shadow-sm border ";
        if (isActive) {
            if (isSpecial) baseClass += "bg-indigo-600 text-white border-indigo-600 shadow-indigo-200";
            else if (isData) baseClass += "bg-emerald-600 text-white border-emerald-600 shadow-emerald-200";
            else baseClass += "bg-blue-600 text-white border-blue-600 shadow-blue-200";
        } else {
            baseClass += "bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-blue-600";
        }
        return (
            <button type="button" onClick={() => setSubTab(id)} className={baseClass}>
                {label}
            </button>
        );
    };

    // ═════════════════════════════════════════════════════════════════════
    // 📊 EXCEL EXPORT ENGINE (SheetJS .xlsx & Safe CSV Engine)
    // ═════════════════════════════════════════════════════════════════════
    const ensureXlsxLoaded = () => {
        return new Promise((resolve) => {
            if (window.XLSX) return resolve(true);
            const cdns = [
                'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
                'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'
            ];
            let idx = 0;
            const tryLoad = () => {
                if (window.XLSX) return resolve(true);
                if (idx >= cdns.length) return resolve(false);
                const s = document.createElement('script');
                s.src = cdns[idx++];
                s.onload = () => resolve(true);
                s.onerror = () => tryLoad();
                document.head.appendChild(s);
            };
            tryLoad();
        });
    };

    const exportFinanceExcel = async (rows, filename, sheetName = "FinanceReport") => {
        await ensureXlsxLoaded();
        if (typeof window.XLSX !== 'undefined') {
            try {
                const ws = window.XLSX.utils.aoa_to_sheet(rows);
                if (rows && rows.length > 0) {
                    const colWidths = rows[0].map((_, colIdx) => {
                        let maxLen = 12;
                        rows.forEach(r => {
                            const val = r[colIdx] !== null && r[colIdx] !== undefined ? String(r[colIdx]) : '';
                            if (val.length > maxLen) maxLen = Math.min(val.length, 50);
                        });
                        return { wch: maxLen + 3 };
                    });
                    ws['!cols'] = colWidths;
                }
                const wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, ws, sheetName);
                const finalFilename = filename.toLowerCase().endsWith('.xlsx') ? filename : `${filename}.xlsx`;
                window.XLSX.writeFile(wb, finalFilename, { compression: true });
                return;
            } catch (err) {
                console.error('XLSX export error, falling back to CSV:', err);
            }
        }

        // Fallback: ส่งออกเป็น CSV พร้อม UTF-8 BOM (เปิดใน Excel ได้ 100% ภาษาไทยไม่เพี้ยน ไม่ติด Error Format Mismatch)
        try {
            const csvFilename = filename.replace(/\.xlsx$/i, '') + '.csv';
            const csvContent = '\uFEFF' + (rows || []).map(row => 
                (row || []).map(cell => {
                    let text = (cell === null || cell === undefined) ? '' : String(cell);
                    if (text.includes('"') || text.includes(',') || text.includes('\n') || text.includes('\r')) {
                        text = '"' + text.replace(/"/g, '""') + '"';
                    }
                    return text;
                }).join(',')
            ).join('\r\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = csvFilename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } catch(e) {
            alert('ไม่สามารถดาวน์โหลดไฟล์ได้: ' + (e.message || ''));
        }
    };

    const { 
        parseSaleCurrencyAmounts, 
        processFinanceSales, 
        filterFinanceBills, 
        calculateFinanceKpi, 
        calculateYearlyFinanceData,
        groupSalesForProductReport
    } = window.ReportFinanceEngine || {};


    function App() {
        const [currentUser, setCurrentUser] = useState(null);
        const [isLoggedIn, setIsLoggedIn] = useState(false);
        const [showLoginModal, setShowLoginModal] = useState(false);
        const [systemUsers, setSystemUsers] = useState([]);
        const [isAppLoading, setIsAppLoading] = useState(true);
        const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
            try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch (e) { return false; }
        });

        // Language & Theme Sync
        const [, forceThemeUpdate] = useReducer(x => x + 1, 0);
        useEffect(() => {
            const onThemeChange = () => forceThemeUpdate();
            window.addEventListener('stk_theme_change', onThemeChange);
            return () => window.removeEventListener('stk_theme_change', onThemeChange);
        }, []);

        useEffect(() => {
            if (typeof window.syncCompanySettingsFromSupabase === 'function') {
                window.syncCompanySettingsFromSupabase().catch(() => {});
            }
        }, []);

        // Data States
        const [sales, setSales] = useState([]);
        const [members, setMembers] = useState([]);
        const [products, setProducts] = useState(() => {
            try {
                if (window.top && window.top.stkDbCache && Array.isArray(window.top.stkDbCache.products)) {
                    return window.top.stkDbCache.products;
                }
                const cached = sessionStorage.getItem('stkDbCache');
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (parsed && Array.isArray(parsed.products)) return parsed.products;
                }
            } catch(e) {}
            return [];
        });
        const [systemSettings, setSystemSettings] = useState({ exchange_rate: 700 });
        const [yearlySummaryFromDb, setYearlySummaryFromDb] = useState([]); // รับข้อมูล Summary จาก Database

        // Filter States & SubTab Persistence Across Browser Refresh
        const todayStr = getLocalISODate();
        const [subTab, setSubTabState] = useState(() => {
            try {
                const params = new URLSearchParams(window.location.search);
                const tabParam = params.get('tab');
                if (tabParam && ['finance_summary', 'finance_detail', 'sale_product_report'].includes(tabParam)) {
                    return tabParam;
                }
                const hash = (window.location.hash || '').replace('#', '').trim();
                if (hash && ['finance_summary', 'finance_detail', 'sale_product_report'].includes(hash)) {
                    return hash;
                }
                const savedTab = sessionStorage.getItem('stk_report_finance_subtab');
                if (savedTab && ['finance_summary', 'finance_detail', 'sale_product_report'].includes(savedTab)) {
                    return savedTab;
                }
            } catch(e) {}
            return 'finance_summary';
        });

        const setSubTab = (tab) => {
            setSubTabState(tab);
            try {
                sessionStorage.setItem('stk_report_finance_subtab', tab);
                const url = new URL(window.location.href);
                url.searchParams.set('tab', tab);
                window.history.replaceState(null, '', url.pathname + url.search + window.location.hash);
                if (window.top && window.top !== window && window.top.location) {
                    const topUrl = new URL(window.top.location.href);
                    topUrl.searchParams.set('tab', tab);
                    window.top.history.replaceState(null, '', topUrl.pathname + topUrl.search + topUrl.hash);
                }
            } catch(e) {}
        };

        const [startDate, setStartDate] = useState(todayStr);
        const [endDate, setEndDate] = useState(todayStr);
        const [searchQuery, setSearchQuery] = useState('');
        const debouncedSearchQuery = useDebounce(searchQuery, 300);
        const [productReportGroupBy, setProductReportGroupBy] = useState('seller');
        const [productReportViewMode, setProductReportViewMode] = useState('summary'); // 'summary' (ยุบรวมรายชื่อสินค้าตามพนักงานขาย) | 'bill' (แยกตามบิล)
        const [viewBillDetail, setViewBillDetail] = useState(null);

        const exchangeRate = Number(systemSettings?.exchange_rate || 700);

        const pagePerm = window.getUserPagePermission ? window.getUserPagePermission(currentUser, 'reports') : 'none';
        const isAdmin = currentUser && (
            String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || 
            String(currentUser.role).trim().toLowerCase().includes('admin') || String(currentUser.role).trim().includes('แอดมิน') ||
            pagePerm === 'full'
        );

        const handleLoginSuccess = (user) => {
            localStorage.setItem('stk_current_user', JSON.stringify(user));
            setCurrentUser(user);
            setIsLoggedIn(true);
            setShowLoginModal(false);
            if (typeof fetchFinanceData === 'function') fetchFinanceData();
        };

        const handleLogout = () => {
            try {
                localStorage.removeItem('stk_current_user');
                localStorage.removeItem('stk_app_cache_data');
                localStorage.removeItem('stk_last_activity');
                sessionStorage.clear();
                localStorage.setItem('stk_broadcast_session_event', JSON.stringify({ action: 'logout', reason: 'manual_logout', time: Date.now() }));
            } catch(e) {}
            setCurrentUser(null);
            setIsLoggedIn(false);
            setSales([]);
            setMembers([]);
            setYearlySummaryFromDb([]);
            setShowLoginModal(true);

            const targetUrl = (typeof window.resolvePageUrl === 'function')
                ? window.resolvePageUrl('?page=dashboard&login=1')
                : 'Mlm.html?login=1';
            try {
                if (window.top && window.top !== window && window.top.location) {
                    window.top.location.href = targetUrl;
                    return;
                }
            } catch(e) {}
            window.location.href = targetUrl;
        };

        const permittedMemberSet = useMemo(() => {
            if (!currentUser || isAdmin) return null;
            const userId = safeUpper(currentUser.id || currentUser.username);
            let downlines = new Set([userId]);
            let queue = [userId];

            while (queue.length > 0) {
                let parentId = queue.shift();
                (members || []).forEach(m => {
                    if (m && m.id) {
                        const sponsor = safeUpper(m.referrer || m.sponsorId);
                        if (sponsor === parentId) {
                            let mId = safeUpper(m.id);
                            if (!downlines.has(mId)) {
                                downlines.add(mId);
                                queue.push(mId);
                            }
                        }
                    }
                });
            }
            return downlines;
        }, [currentUser, isAdmin, members]);

       const fetchFinanceData = useCallback(async () => {
            try {
                const currentYear = new Date().getFullYear();
                const startRange = `${currentYear - 1}-01-01`; 
                const endRange = `${currentYear + 1}-12-31`;

                // 1. ดึงสรุปรายปีจาก Database ตรงๆ
                let dbSummary = [];
                try {
                    if (typeof window.supabaseRpc === 'function') {
                        const summaryData = await window.supabaseRpc('get_monthly_finance_summary', { p_year: currentYear });
                        if (Array.isArray(summaryData)) {
                            dbSummary = summaryData.map(d => ({
                                period: d.period,
                                monthNum: parseInt(d.period.split('-')[1], 10),
                                billsCount: Number(d.bills_count || 0),
                                sumLak: Number(d.sum_lak || 0),
                                sumThb: Number(d.sum_thb || 0)
                            }));
                        }
                    }
                } catch(e) { console.warn('RPC Summary Error:', e); }

                // 2. Loop ดึงบิลดิบโดยใช้คำสั่งเฉพาะของระบบ (window.supabaseSelect) เพื่อหลีกเลี่ยง Error
                let allSales = [];
                if (typeof window.supabaseSelect === 'function') {
                    let hasMore = true;
                    let offset = 0;
                    const limit = 1000;
                    
                    while (hasMore) {
                        // ใช้ offset ในการเลื่อนดึงข้อมูลทีละ 1,000 บิล
                        const queryStr = `date=gte.${startRange}&date=lte.${endRange}&order=order_id.desc&limit=${limit}&offset=${offset}`;
                        const data = await window.supabaseSelect('stk_sales', queryStr).catch(() => null);
                        
                        if (data && Array.isArray(data) && data.length > 0) {
                            allSales = allSales.concat(data);
                            offset += limit;
                            // ถ้าข้อมูลที่ดึงมาได้น้อยกว่า 1,000 แปลว่าบิลหมดสต๊อกแล้ว ให้หยุดลูป
                            if (data.length < limit) {
                                hasMore = false; 
                            }
                        } else {
                            hasMore = false; 
                        }
                    }
                }

                // Fallback เผื่อกรณีเชื่อมต่อ Loop ไม่สำเร็จ
                if (allSales.length === 0) {
                    allSales = await window.supabaseSelect('stk_sales', 'order=order_id.desc&limit=15000').catch(() => []);
                }

                const [memRes, settingsRes, prodRes] = await Promise.all([
                    window.supabaseSelect('stk_members', 'select=user_id,name,sponsor_id,business_team,permission_role,status').catch(() => []),
                    window.supabaseSelect('stk_system_settings').catch(() => []),
                    window.supabaseSelect('stk_products', 'select=product_id,name,category,price_full,price_member,price_promo,give_pv,current_stock,status,is_bundle,base_product,bundle_qty').catch(() => window.supabaseSelect('products')).catch(() => [])
                ]);

                setYearlySummaryFromDb(dbSummary);

                if (Array.isArray(prodRes) && prodRes.length > 0) {
                    setProducts(prodRes);
                }

                if (Array.isArray(memRes)) {
                    setSystemUsers(memRes);
                }

                if (Array.isArray(settingsRes) && settingsRes.length > 0) {
                    const settingsObj = {};
                    settingsRes.forEach(s => {
                        if (s && (s.key || s.setting_key)) {
                            const k = s.key || s.setting_key;
                            const v = s.value !== undefined ? s.value : s.setting_value;
                            settingsObj[k] = typeof v === 'string' ? v : JSON.stringify(v);
                        }
                    });
                    setSystemSettings(prev => ({ ...prev, ...settingsObj }));
                }

                if (Array.isArray(memRes)) {
                    setMembers(memRes.map(m => ({
                        id: String(m.user_id || m.id || '').trim(),
                        name: String(m.name || '').trim(),
                        referrer: String(m.sponsor_id || m.referrer || '').trim(),
                        team: String(m.business_team || m.team || 'Marketing').trim()
                    })));
                }

                if (Array.isArray(allSales)) {
                    setSales(processFinanceSales ? processFinanceSales(allSales) : allSales);
                }
            } catch (err) {
                console.error("Finance fetch error:", err);
            } finally {
                setIsAppLoading(false);
            }
        }, []);

        useEffect(() => {
            const savedUserStr = localStorage.getItem('stk_current_user');
            if (savedUserStr) {
                try {
                    const parsedUser = JSON.parse(savedUserStr);
                    setCurrentUser(parsedUser);
                    setIsLoggedIn(true);
                    fetchFinanceData();
                } catch(e) {
                    setShowLoginModal(true);
                }
            } else {
                setShowLoginModal(true);
            }

            const initialLoader = document.getElementById('initial-loader');
            if (initialLoader) { 
                initialLoader.style.opacity = '0'; 
                setTimeout(() => { if (initialLoader) initialLoader.style.display = 'none'; }, 400); 
            }
        }, [fetchFinanceData]);

        // Filtered Bills for Detail Tab
        const financeBills = useMemo(() => {
            if (filterFinanceBills) {
                return filterFinanceBills(sales, startDate, endDate, permittedMemberSet, debouncedSearchQuery || searchQuery);
            }
            return [];
        }, [sales, startDate, endDate, permittedMemberSet, debouncedSearchQuery, searchQuery]);

        // KPI Summary
        const financeKpi = useMemo(() => {
            if (calculateFinanceKpi) {
                return calculateFinanceKpi(financeBills, exchangeRate);
            }
            return { sumLak: 0, sumThb: 0, grandCombinedTHB: 0, lakBillsCount: 0, thbBillsCount: 0 };
        }, [financeBills, exchangeRate]);

        // 12 Months Summary
        const currentYearNum = startDate ? new Date(startDate).getFullYear() : new Date().getFullYear();
        const activeYear = isNaN(currentYearNum) ? new Date().getFullYear() : currentYearNum;

        const financeSummaryData = useMemo(() => {
            const query = String(debouncedSearchQuery || searchQuery || '').trim();

            // 🎯 ข้อมูลประวัติศาสตร์จากระบบเก่า (ใช้เฉพาะเดือน 1 ถึง 7 เท่านั้น)
            const legacyData2026 = {
                1: 3008020,
                2: 2993920,
                3: 3176980,
                4: 2855460,
                5: 2406800,
                6: 2670130,
                7: 2377030
            };

            // 🌟 บังคับใช้ JS คำนวณจากบิลดิบเสมอ (เพราะดึง Loop มาครบแล้ว และ JS อ่านบิลสกุลเงินผสมได้ฉลาดกว่า SQL)
            if (calculateYearlyFinanceData) {
                const calcData = calculateYearlyFinanceData(sales, activeYear, exchangeRate, permittedMemberSet, query);
                
                // 💡 แทรกยอดเก่าเฉพาะเดือน 1-7 ตอนที่ "ไม่ได้พิมพ์ค้นหาชื่อ"
                if (activeYear === 2026 && query === '') {
                    return calcData.map(d => {
                        // ถ้าเป็นเดือน 1-7 และยอดบิลในระบบใหม่ยังไม่มี (หรือเป็น 0) ให้สวมยอดเก่า
                        if (d.monthNum >= 1 && d.monthNum <= 7 && d.billsCount === 0) {
                            return { ...d, sumThb: legacyData2026[d.monthNum], billsCount: 1 };
                        }
                        // ปล่อยเดือน 8, 9 และเดือนอื่นๆ ให้เป็นข้อมูลคำนวณจริงจากระบบใหม่ล้วนๆ 100%
                        return d;
                    });
                }
                return calcData;
            }

            return [];
        }, [sales, activeYear, permittedMemberSet, debouncedSearchQuery, searchQuery, exchangeRate]);

        // 3. ข้อมูลสำหรับแท็บที่ 3: รายงานยอดขายและสินค้า (Sale Report Template) - ประมวลผลในหน่วยความจำ Egress = 0 Byte
        const productReportData = useMemo(() => {
            const filtered = filterFinanceBills ? filterFinanceBills(sales, startDate, endDate, permittedMemberSet, debouncedSearchQuery) : sales;
            if (typeof groupSalesForProductReport === 'function') {
                return groupSalesForProductReport(filtered, productReportGroupBy, products, members, productReportViewMode);
            }
            return { 
                groups: [], 
                totalBillsCount: 0, 
                grandTotalQty: 0, 
                grandTotalWg: 0, 
                grandTotalAmount: 0,
                grandQtyFull: 0, grandAmountFull: 0,
                grandQtyMember: 0, grandAmountMember: 0,
                grandQtyPromo: 0, grandAmountPromo: 0,
                grandQtyFree: 0, grandAmountFree: 0 
            };
        }, [sales, startDate, endDate, permittedMemberSet, debouncedSearchQuery, productReportGroupBy, products, members, productReportViewMode]);

        // ═════════════════════════════════════════════════════════════════════
        // 🖨️ OFFICIAL PRINT & PDF REPORT GENERATOR (FOR FINANCE)
        // ═════════════════════════════════════════════════════════════════════
        const handlePrintReport = (isPdf = false) => {
            const printWin = window.open('', '_blank');
            if (!printWin) {
                alert('เบราว์เซอร์บล็อกหน้าต่าง Popup กรุณาอนุญาต (Allow Pop-ups) ก่อนพิมพ์เอกสารรายงาน');
                return;
            }

            // ดึงข้อมูลบริษัทและการตั้งค่าโลโก้จาก CompanySettings / LocalStorage / Supabase
            let compSettings = {

                                                                            <span className="text-slate-400 text-[11px] font-normal ml-1">({g.billsCount} บิล)</span>
                                                                        </div>
                                                                    </td>
                                                                    <td className="p-2.5 text-right text-slate-700 font-black">รวม (ລວມ)</td>
                                                                    <td className="p-2.5 text-center font-mono font-black text-slate-900 bg-slate-200/50">{g.subtotalQty.toLocaleString()}</td>
                                                                    <td className="p-2.5 text-center font-mono font-black text-slate-900 bg-slate-200/50">{g.subtotalWg.toLocaleString()}</td>
                                                                    <td className="p-2.5 text-right font-mono font-black text-emerald-800 bg-emerald-50">฿{g.subtotalAmount.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                                                                    <td></td>
                                                                </tr>
                                                            </React.Fragment>
                                                        ))
                                                    )}
                                                </tbody>
                                                {productReportData.groups.length > 0 && (
                                                    <tfoot>
                                                        <tr className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white font-black text-sm">
                                                            <td colSpan={4} className="p-4 text-left font-black tracking-wider uppercase">
                                                                GRAND TOTAL (ยอดรวมทั้งหมด {productReportData.totalBillsCount.toLocaleString()} บิล)
                                                            </td>
                                                            <td className="p-4 text-center font-mono text-base text-yellow-300">{productReportData.grandTotalQty.toLocaleString()}</td>
                                                            <td className="p-4 text-center font-mono text-base text-yellow-300">{productReportData.grandTotalWg.toLocaleString()}</td>
                                                            <td className="p-4 text-right font-mono text-lg text-emerald-300">฿{productReportData.grandTotalAmount.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                                                            <td></td>
                                                        </tr>
                                                        <tr className="bg-slate-900 text-white font-medium text-xs border-t border-slate-800">
                                                            <td colSpan={8} className="p-3">
                                                                <div className="flex flex-wrap items-center justify-between gap-3 px-2">
                                                                    <span className="font-bold text-slate-400 tracking-wide uppercase flex items-center gap-1.5">
                                                                        <Activity size={14} className="text-blue-400"/> สรุปแยก 4 ประเภทราคา:
                                                                    </span>
                                                                    <div className="flex flex-wrap items-center gap-2">
                                                                        <span className="inline-flex items-center gap-1.5 bg-slate-800/90 border border-slate-700 text-slate-200 px-2.5 py-1 rounded-md text-[11px]">
                                                                            <span className="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
                                                                            <span>เต็ม:</span> <strong className="text-white font-mono">{productReportData.grandQtyFull.toLocaleString()} ชิ้น</strong>
                                                                            <span className="text-slate-400 text-[10px] font-mono">(฿{productReportData.grandAmountFull.toLocaleString(undefined, {minimumFractionDigits: 2})})</span>
                                                                        </span>
                                                                        <span className="inline-flex items-center gap-1.5 bg-slate-800/90 border border-blue-900/60 text-blue-200 px-2.5 py-1 rounded-md text-[11px]">
                                                                            <span className="w-1.5 h-1.5 rounded-full bg-blue-400"></span>
                                                                            <span>สมาชิก:</span> <strong className="text-white font-mono">{productReportData.grandQtyMember.toLocaleString()} ชิ้น</strong>
                                                                            <span className="text-blue-300 text-[10px] font-mono">(฿{productReportData.grandAmountMember.toLocaleString(undefined, {minimumFractionDigits: 2})})</span>
                                                                        </span>
                                                                        <span className="inline-flex items-center gap-1.5 bg-slate-800/90 border border-amber-900/60 text-amber-200 px-2.5 py-1 rounded-md text-[11px]">
                                                                            <span className="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                                                                            <span>โปร:</span> <strong className="text-white font-mono">{productReportData.grandQtyPromo.toLocaleString()} ชิ้น</strong>
                                                                            <span className="text-amber-300 text-[10px] font-mono">(฿{productReportData.grandAmountPromo.toLocaleString(undefined, {minimumFractionDigits: 2})})</span>
                                                                        </span>
                                                                        <span className="inline-flex items-center gap-1.5 bg-slate-800/90 border border-emerald-900/60 text-emerald-200 px-2.5 py-1 rounded-md text-[11px]">
                                                                            <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                                                            <span>แถมฟรี:</span> <strong className="text-white font-mono">{productReportData.grandQtyFree.toLocaleString()} ชิ้น</strong>
                                                                            <span className="text-emerald-300 text-[10px] font-mono">(฿0.00)</span>
                                                                        </span>
                                                                    </div>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    </tfoot>
                                                )}
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Modal: ดูรายละเอียดบิลอย่างสมบูรณ์แบบ (เหมือน Reports.html) */}
                        <EditModal isOpen={viewBillDetail !== null} onClose={() => setViewBillDetail(null)} title={'รายละเอียดบิล ' + (viewBillDetail?.id || '')} icon={FileText} maxWidthClass="max-w-2xl">
                            {viewBillDetail && (
                                <div className="flex flex-col gap-5 p-2">
                                    <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200/80 space-y-2 text-xs font-semibold">
                                        <div className="flex justify-between"><span className="text-slate-500">เลขที่บิล:</span> <span className="font-black text-blue-600 text-sm">{viewBillDetail.id}</span></div>
                                        <div className="flex justify-between"><span className="text-slate-500">วันที่คีย์บิล:</span> <span className="font-bold text-slate-800">{viewBillDetail.date}</span></div>
                                        <div className="flex justify-between border-t border-slate-200/60 pt-2 mt-1"><span className="text-slate-500">ลูกค้า:</span> <span className="font-bold text-slate-800">{viewBillDetail.customerName || viewBillDetail.customerId}</span></div>
                                        <div className="flex justify-between"><span className="text-slate-500">ผู้ขาย (เจ้าของเคส):</span> <span className="font-bold text-indigo-600">{viewBillDetail.sellerName || viewBillDetail.memberId}</span></div>
                                    </div>

                                    <div className="border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                                        <table className="w-full text-left text-sm">
                                            <thead className="bg-slate-100 border-b border-slate-200 text-slate-600 text-[11px] uppercase tracking-wider">
                                                <tr>
                                                    <th className="p-3 font-black pl-4">รายการสินค้า</th>
                                                    <th className="p-3 text-center font-black w-24">จำนวน</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {(() => {
                                                    let billItems = [];
                                                    if (viewBillDetail._items && viewBillDetail._items.length > 0) {
                                                        viewBillDetail._items.forEach(it => {
                                                            billItems.push({
                                                                name: it.prod || it.productName || it.name,
                                                                qty: Number(it.qty || it.quantity),
                                                                type: it.type || 'ราคาเต็ม'
                                                            });
                                                        });
                                                    } else {
                                                        Object.keys(viewBillDetail).forEach(k => {
                                                            if (k.endsWith('_ราคาเต็ม') || k.endsWith('_ราคาสมาชิก') || k.endsWith('_ราคาโปร') || k.endsWith('_ราคาศูนย์')) {
                                                                const qty = Number(viewBillDetail[k]);
                                                                if (qty > 0) {
                                                                    const pName = k.substring(0, k.lastIndexOf('_'));
                                                                    const type = k.substring(k.lastIndexOf('_') + 1);
                                                                    billItems.push({ name: pName, qty, type });
                                                                }
                                                            }
                                                        });
                                                    }

                                                    if (billItems.length === 0) {
                                                        return <tr><td colSpan="2" className="p-8 text-center text-slate-400 font-bold">ไม่พบรายการสินค้าในบิลนี้</td></tr>;
                                                    }

                                                    return billItems.map((item, idx) => (
                                                        <tr key={idx} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                            <td className="p-4 font-bold text-slate-800">
                                                                {item.name} 
                                                                <span className="text-[10px] text-slate-500 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded-md ml-2">{item.type}</span>
                                                            </td>
                                                            <td className="p-4 text-center font-black text-blue-600 text-lg">{item.qty}</td>
                                                        </tr>
                                                    ));
                                                })()}
                                            </tbody>
                                            <tfoot className="bg-blue-50/50 border-t-2 border-blue-100">
                                                <tr>
                                                    <td className="p-4 text-right font-black text-slate-600 uppercase">รวมจำนวนชิ้นทั้งหมด:</td>
                                                    <td className="p-4 text-center font-black text-2xl text-blue-700 bg-blue-100/50 rounded-br-xl border-x border-blue-100/50">
                                                        {viewBillDetail['ยอดรวมชิ้นทั้งหมด'] || Object.keys(viewBillDetail).filter(k => k.includes('_ราคา') && !k.includes('รวมชิ้น') && viewBillDetail[k] > 0).reduce((sum, key) => sum + parseInt(viewBillDetail[key]), 0)}
                                                    </td>
                                                </tr>
                                            </tfoot>
                                        </table>
                                        
                                        <div className="p-4 bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-t border-slate-200">
                                            <div className="flex flex-col gap-1 w-full md:w-auto">
                                                <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider">ช่องทางชำระเงิน</span>
                                                <div className="flex flex-wrap items-center gap-1.5 pt-1">
                                                    {(() => {
                                                        const st = String(viewBillDetail.saleType || viewBillDetail.payMode || 'เงินโอน').trim();
                                                        if (st.includes('|') || st.includes(':')) {
                                                            return st.split('|').map(p => p.trim()).join(' | ');
                                                        }
                                                        return st;
                                                    })()}
                                                </div>
                                                {viewBillDetail.paymentNote && <span className="text-[11px] text-amber-600 font-bold mt-2 flex items-center gap-1"><Info size={12}/> หมายเหตุ: {viewBillDetail.paymentNote}</span>}
                                            </div>
                                            <div className="flex flex-col items-end text-right w-full md:w-auto border-t md:border-t-0 md:border-l border-blue-200/50 pt-4 md:pt-0 md:pl-6">
                                                <span className="text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">ยอดรับรวม</span>
                                                {(() => {
                                                    const { lakAmt, thbAmt } = parseSaleCurrencyAmounts(viewBillDetail, exchangeRate);
                                                    return (
                                                        <div className="flex flex-col items-end gap-1">
                                                            {lakAmt > 0 && <span className="text-2xl font-black text-emerald-600 leading-none drop-shadow-sm">{Math.round(lakAmt).toLocaleString()} ₭</span>}
                                                            {thbAmt > 0 && <span className="text-2xl font-black text-blue-700 leading-none drop-shadow-sm">฿{(thbAmt % 1 === 0 ? thbAmt.toLocaleString() : thbAmt.toLocaleString(undefined, {minimumFractionDigits:2}))}</span>}
                                                            {lakAmt === 0 && thbAmt === 0 && <span className="text-xl font-bold text-slate-400">0 บาท</span>}
                                                        </div>
                                                    );
                                                })()}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex justify-end pt-2 border-t border-slate-100">
                                        <button onClick={() => setViewBillDetail(null)} className="px-6 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl border border-slate-200 transition-colors shadow-sm">ปิดหน้าต่าง</button>
                                    </div>
                                </div>
                            )}
                        </EditModal>
                            </React.Fragment>
                        )}
                    </div>
                </main>
                <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={systemUsers} />
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
