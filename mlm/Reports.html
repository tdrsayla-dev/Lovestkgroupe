<body class="antialiased overflow-x-hidden selection:bg-blue-600 selection:text-white">

  

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;
    // ðŸ›¡ï¸ GLOBAL ICONS DESTRUCTURING: à¸›à¸¥à¸­à¸”à¸ à¸±à¸¢à¸ˆà¸²à¸à¸•à¸±à¸§à¹à¸›à¸£à¸‹à¹‰à¸³à¸‹à¹‰à¸­à¸™ à¹à¸¥à¸°à¸”à¸¶à¸‡à¹‚à¸¡à¸”à¸¹à¸¥à¹à¸¥à¸°à¸„à¸­à¸¡à¹‚à¸žà¹€à¸™à¸™à¸•à¹Œà¸¡à¸²à¸„à¸£à¸šà¸–à¹‰à¸§à¸™
    const { LayoutDashboard, ShoppingCart, Users, Contact, Headset, BarChart3, Plus, Edit, Trash2, UserCircle, Menu, X, Save, Info, PackageIcon, Package, Target, Trophy, Activity, Eye, Tags, CheckCircle, GitBranch, Archive, ChevronDown, FileText, SettingsIcon, Coins, ShieldCheck, AlertTriangle, AlertCircle, LoginModal, Toast, Sidebar, Header, ConfirmModal, EditModal, DonutChart, AutoSuggestInput, SearchIcon } = window;
    
    

    const safeUpper = (str) => String(str || '').trim().toUpperCase();
    const getLocalISODate = () => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };
    function useDebounce(value, delay) {
        const [debouncedValue, setDebouncedValue] = React.useState(value);
        React.useEffect(() => {
            const handler = setTimeout(() => { setDebouncedValue(value); }, delay);
            return () => clearTimeout(handler);
        }, [value, delay]);
        return debouncedValue;
    }

    const fallbackCustomerTypes = window.fallbackCustomerTypes || [
       { id: 'T001', name: 'ลูกค้าใหม่มาตรวจ', status: 'ใช้งาน' },
       { id: 'T002', name: 'ลูกค้าเก่ากลับมาต่อยา', status: 'ใช้งาน' },
       { id: 'T003', name: 'ลูกค้าใหม่นำผลตรวจมาปรึกษา', status: 'ใช้งาน' },
       { id: 'T004', name: 'โทรปิดการขายลูกค้าใหม่', status: 'ใช้งาน' },
       { id: 'T005', name: 'ลูกค้านำผลตรวจมาปรึกษา', status: 'ใช้งาน' },
       { id: 'T006', name: 'โทรปิดการขายลูกค้าเก่า', status: 'ใช้งาน' },
       { id: 'T007', name: 'ส่วนกลางใหม่', status: 'ใช้งาน' }
    ];

    const renderDetailBadges = (detailsObj, colorClasses) => {
        const keys = Object.keys(detailsObj || {});
        if (keys.length === 0) return <span className="text-slate-300 text-xs">-</span>;
        return (
            <div className="flex flex-wrap gap-1.5">
                {keys.map(p => (
                    <span key={p} className={`whitespace-nowrap px-2.5 py-1 rounded-md text-[11px] font-bold flex items-center gap-1.5 shadow-sm ${colorClasses}`}>
                        {p} <span className="bg-white/90 px-1.5 rounded-sm border border-[inherit] font-black">{detailsObj[p]}</span>
                    </span>
                ))}
            </div>
        );
    };

    const resolveTeamName = (rawTeam, businessTeams) => {
        if (!rawTeam) return 'N/A';
        const tUpper = safeUpper(rawTeam);
        if (Array.isArray(businessTeams) && businessTeams.length > 0) {
            const found = businessTeams.find(bt => {
                if (!bt) return false;
                const bId = safeUpper(bt.id || bt.team_id || bt.Team_ID || bt.code || '');
                const bName = safeUpper(bt.name || bt.team_name || bt.Team_Name || bt.TeamName || '');
                return bId === tUpper || bName === tUpper;
            });
            if (found) {
                const resName = String(found.name || found.team_name || found.Team_Name || found.TeamName || '').trim();
                if (resName) return resName;
            }
        }
        if (tUpper === 'TEAM A' || tUpper === 'TB1') return 'Marketing';
        if (tUpper === 'TEAM B' || tUpper === 'TB2') return 'Center';
        return rawTeam;
    };

    const SubTabButton = ({ id, label, activeTab, setSubTab, isSpecial, isData }) => {
        const isActive = activeTab === id;
        let baseClass = "px-4 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap flex-shrink-0 shadow-sm border ";
        if (isActive) {
            if (isSpecial) baseClass += "bg-indigo-600 text-white border-indigo-600 shadow-indigo-200";
            else if (isData) baseClass += "bg-emerald-600 text-white border-emerald-600 shadow-emerald-200";
            else baseClass += "bg-blue-600 text-white border-blue-600 shadow-blue-200";
        } else {
            baseClass += "bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-blue-600";
        }
        return (
            <button type="button" onClick={() => setSubTab(id)} className={baseClass}>
                {label}
            </button>
        );
    };

    const ReportsView = ({ sales, members, closers = [], customers, activeCustomerTypes, products, systemSettings, businessTeams, currentUser, isAdmin, onRefreshData, stockMovements, payoutLogs = [] }) => {
        const todayStr = getLocalISODate();
        const [startDate, setStartDate] = useState(todayStr);
        const [endDate, setEndDate] = useState(todayStr);

        const [activeGroup, setActiveGroup] = useState(() => {
            const params = new URLSearchParams(window.location.search);
            return params.get('group') || 'sales';
        });

        const [subTab, setSubTab] = useState(() => {
            const params = new URLSearchParams(window.location.search);
            const tabParam = params.get('tab');
            if (tabParam) return tabParam;
            const g = params.get('group') || 'sales';
            if (g === 'referral') return 'referral_fee';
            return 'sales_member_day';
        });
        const [searchQuery, setSearchQuery] = useState('');
        const [currencyMode, setCurrencyMode] = useState('LAK');
        const exchangeRate = Number(systemSettings?.exchange_rate || 700);

        const [selectedTeamFilter, setSelectedTeamFilter] = useState('');

        useEffect(() => {
            const checkUrlGroup = () => {
                const params = new URLSearchParams(window.location.search);
                const currentGroup = params.get('group') || 'sales';
                if (currentGroup === 'finance') {
                    window.location.replace('ReportFinance.html');
                    return;
                }
                if (currentGroup === 'stock') {
                    window.location.replace('ReportStock.html');
                    return;
                }
                if (currentGroup === 'referral') {
                    window.location.replace('ReportReferral.html');
                    return;
                }
                setActiveGroup(currentGroup);
            };
            checkUrlGroup();
            window.addEventListener('popstate', checkUrlGroup);
            const originalPushState = window.history.pushState;
            window.history.pushState = function(...args) {
                originalPushState.apply(this, args);
                checkUrlGroup();
            };
            return () => {
                window.removeEventListener('popstate', checkUrlGroup);
                window.history.pushState = originalPushState;
            };
        }, []);

        useEffect(() => {
            if (activeGroup === 'sales') setSubTab('sales_member_day');
        }, [activeGroup]);

        const convertVal = useCallback((lakVal) => {
            if (currencyMode === 'THB') return lakVal / exchangeRate;
            return lakVal;
        }, [currencyMode, exchangeRate]);

        const getCurrencySuffix = useCallback(() => {
            return currencyMode === 'THB' ? 'บาท' : 'กีบ';
        }, [currencyMode]);

        const formatValDisplay = useCallback((lakVal) => {
            if (lakVal <= 0) return '-';
            const converted = convertVal(lakVal);
            if (currencyMode === 'THB') {
                return converted % 1 === 0 ? converted.toLocaleString() : converted.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
            return Math.round(converted).toLocaleString();
        }, [convertVal, currencyMode]);

        const parseSaleCurrencyAmounts = useCallback((s, exRate) => {
            let rawAmt = Number(s['ยอดขายรวม'] || s.total_amount || s.totalAmount || s.amount || s.grand_total || s.grandTotal || 0);
            
            // ถ้า rawAmt เป็น 0 แต่มี items_json หรือ _items ให้ลองคำนวณราคาจริงจากสินค้า
            if (rawAmt === 0 && (s._items || s.items_json)) {
                let itList = s._items;
                if (!itList && s.items_json) {
                    try { itList = typeof s.items_json === 'string' ? JSON.parse(s.items_json) : s.items_json; } catch(e){}
                }
                if (Array.isArray(itList) && itList.length > 0) {
                    rawAmt = itList.reduce((acc, it) => acc + ((Number(it.qty) || 0) * (Number(it.price) || 0)), 0);
                }
            }

            const pModeStr = String(s.payMode || s.pay_mode || s.saleType || s.sale_type || s.payment_method || s.payment_type || '').trim();
            const safeExRate = Number(exRate) || 700;

            let lakAmt = 0;
            let thbAmt = 0;

            // 1. แยกตามช่องทางชำระเงินที่มีหลายรายการ เช่น สดบาท:1000 | โอนลาวกีบ:500000 | เรท:700
            if (pModeStr.includes(':')) {
                const parts = pModeStr.split('|');
                let hasParsedLAK = false;
                let hasParsedTHB = false;

                parts.forEach(part => {
                    const trimmed = part.trim();
                    if (!trimmed.includes(':')) return;
                    const colonIdx = trimmed.indexOf(':');
                    const key = trimmed.substring(0, colonIdx).trim().toLowerCase();
                    const val = parseFloat(trimmed.substring(colonIdx + 1).replace(/[^\d.]/g, '')) || 0;

                    if (key === 'เรท' || key === 'rate' || key === 'อัตรา') return;

                    // ตรวจสอบเงินกีบก่อนอย่างแม่นยำ (คำที่มี กีบ, lak, kip หรือยอดเงิน >= 70,000 หรือมี bcel/jdb/ldb/ลาว ที่ไม่ใช่ยอดระดับหลักร้อย/พันบาท)
                    const isKeyLak = key.includes('กีบ') || key.includes('lak') || key.includes('kip') || key === 'สดกีบ' || 
                                     (key.includes('ลาว') && !key.includes('บาท')) ||
                                     (val >= 70000 && !key.includes('ไทย') && !key.includes('thb') && !key.includes('สดบาท'));

                    if (isKeyLak) {
                        lakAmt += val;
                        hasParsedLAK = true;
                    } else if (key.includes('บาท') || key.includes('thb') || key === 'สด' || key.includes('สดบาท') || key.includes('ไทย') || key.includes('โอน')) {
                        // ป้องกันกรณีตัวเลขเป็นหลักแสนหลักล้านที่เป็นเงินกีบหลุดเข้ามา แต่ถูกคีย์เป็น โอนลาวบาท(BCEL):1050000
                        if (val >= 70000 && (key.includes('ลาว') || key.includes('bcel') || key.includes('jdb') || key.includes('ldb'))) {
                            lakAmt += val;
                            hasParsedLAK = true;
                        } else {
                            thbAmt += val;
                            hasParsedTHB = true;
                        }
                    } else if (val >= 70000) {
                        lakAmt += val;
                        hasParsedLAK = true;
                    } else {
                        thbAmt += val;
                        hasParsedTHB = true;
                    }
                });

                if (hasParsedLAK || hasParsedTHB) {
                    return { lakAmt, thbAmt, isLakBill: lakAmt > 0, isThbBill: thbAmt > 0, realPayMode: pModeStr };
                }
            }

            // 2. ถ้าใน record มีคอลัมน์เงินกีบ/บาท ที่แยกไว้ชัดเจน
            const expLak = Number(s.total_amount_lak || s.totalAmountLak || 0);
            const expThb = Number(s.total_amount_thb || s.totalAmountThb || 0);
            if (expLak > 0 || expThb > 0) {
                return { lakAmt: expLak, thbAmt: expThb, isLakBill: expLak > 0, isThbBill: expThb > 0, realPayMode: pModeStr };
            }

            // 3. ตรวจสอบสกุลเงินจากคำระบุช่องทางชำระเงิน
            const lowerPMode = pModeStr.toLowerCase();
            const isLakBill = lowerPMode.includes('กีบ') || lowerPMode.includes('lak') || lowerPMode.includes('kip') || 
                              (lowerPMode.includes('ลาว') && !lowerPMode.includes('บาท')) || rawAmt >= 70000;

            if (isLakBill) {
                return { lakAmt: rawAmt, thbAmt: 0, isLakBill: true, isThbBill: false, realPayMode: pModeStr };
            }

            // ค่าเริ่มต้นเป็นเงินบาท (THB)
            return { lakAmt: 0, thbAmt: rawAmt, isLakBill: false, isThbBill: true, realPayMode: pModeStr };
        }, []);
        const debouncedSearchQuery = useDebounce(searchQuery, 300);

        const distinctTeams = useMemo(() => {
            const set = new Set();
            if (Array.isArray(businessTeams)) {
                businessTeams.forEach(bt => {
                    if (bt && bt.name) set.add(bt.name.trim());
                });
            }
            (members || []).forEach(m => { 
                if (m && m.team) {
                    const cName = resolveTeamName(m.team, businessTeams);
                    set.add(cName);
                } 
            });
            return Array.from(set).sort();
        }, [members, businessTeams]);

        const uplineLeadersList = useMemo(() => {
            const sponsorIds = new Set();
            (members || []).forEach(m => {
                if (m && (m.referrer || m.sponsorId)) {
                    sponsorIds.add(safeUpper(m.referrer || m.sponsorId));
                }
            });
            return (members || []).filter(m => m && sponsorIds.has(safeUpper(m.id)));
        }, [members]);

        const permittedMemberSet = useMemo(() => {
            if (!currentUser || isAdmin) return null;
            const userId = safeUpper(currentUser.id || currentUser.username);
            let downlines = new Set([userId]);
            let queue = [userId];

            while (queue.length > 0) {
                let parentId = queue.shift();
                (members || []).forEach(m => {
                    if (m && m.id) {
                        const sponsor = safeUpper(m.referrer || m.sponsorId);
                        if (sponsor === parentId) {
                            let mId = safeUpper(m.id);
                            if (!downlines.has(mId)) {
                                downlines.add(mId);
                                queue.push(mId);
                            }
                        }
                    }
                });
            }
            return downlines;
        }, [currentUser, isAdmin, members]);

        useEffect(() => {
            const isMonthly = subTab.includes('month');
            if (isMonthly || subTab === 'ranking' || subTab === 'ranking_closers' || subTab === 'sales_by_cust_type' || subTab === 'referral_fee') {
                const now = new Date();
                setStartDate(`${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`);
                setEndDate(todayStr);
            } else {
                setStartDate(todayStr);
                setEndDate(todayStr);
            }
        }, [subTab]);

        const unfoldedSales = useMemo(() => {
            let items = [];
            const dateFilteredSales = (sales || []).filter(s => {
                const sDate = s.date || s.sale_date || '';
                if (!s || sDate < startDate || sDate > endDate) return false;
                const sMemId = safeUpper(s.memberId || s.member_id || s.sellerId || s.seller_id || s.seller || s.marketing);
                if (permittedMemberSet !== null) return permittedMemberSet.has(sMemId);
                return true;
            });

            dateFilteredSales.forEach(record => {
                const recMemberId = safeUpper(record.memberId || record.member_id || record.sellerId || record.seller_id || record.seller || record.marketing);
                const member = (members || []).find(m => m && safeUpper(m.id) === recMemberId);
                const cust = (customers || []).find(c => c && c.id === record.customerId);
                const cleanTeam = resolveTeamName(member?.team, businessTeams);
                const resolvedCustType = record.customerType || record.custType || record.customer_type || (cust ? cust.type : '') || 'ไม่ระบุประเภท';

                let rawItems = [];
                if (record.items_json) {
                    try { rawItems = typeof record.items_json === 'string' ? JSON.parse(record.items_json) : record.items_json; } catch(e){}
                }

                if (!Array.isArray(rawItems) || rawItems.length === 0) {
                    Object.entries(record || {}).forEach(([key, value]) => {
                        if (key.endsWith('_ราคาเต็ม') || key.endsWith('_ราคาสมาชิก') || key.endsWith('_ราคาโปร') || key.endsWith('_ราคาศูนย์')) {
                            const qty = parseInt(value, 10);
                            if (!isNaN(qty) && qty > 0) {
                                const lastUnderscore = key.lastIndexOf('_');
                                rawItems.push({
                                    prod: key.substring(0, lastUnderscore).replace(/\(.*?\)/g, '').trim(),
                                    type: key.substring(lastUnderscore + 1),
                                    qty: qty
                                });
                            }
                        }
                    });
                }

                if (Array.isArray(rawItems) && rawItems.length > 0) {
                    rawItems.forEach(it => {
                        const q = Number(it.qty || it.quantity || 1);
                        if (q > 0) {
                            items.push({
                                billId: record.id,
                                date: record.date || record.sale_date || '',
                                memberId: recMemberId,
                                memberName: member?.name || recMemberId || 'UNKNOWN',
                                team: cleanTeam,
                                custType: resolvedCustType,
                                product: String(it.prod || it.productName || it.name || 'สินค้าอื่นๆ').trim(),
                                priceType: String(it.type || 'ราคาเต็ม').trim(),
                                qty: q
                            });
                        }
                    });
                } else {
                    const f = Number(record['รวมชิ้นราคาเต็ม'] || 0);
                    const m = Number(record['รวมชิ้นราคาสมาชิก'] || 0);
                    const p = Number(record['รวมชิ้นราคาโปร'] || 0);
                    const z = Number(record['รวมชิ้นราคาศูนย์'] || 0);
                    if (f > 0) items.push({ billId: record.id, date: record.date || record.sale_date || '', memberId: recMemberId, memberName: member?.name || recMemberId, team: cleanTeam, custType: resolvedCustType, product: 'สินค้าทั่วไป', priceType: 'ราคาเต็ม', qty: f });
                    if (m > 0) items.push({ billId: record.id, date: record.date || record.sale_date || '', memberId: recMemberId, memberName: member?.name || recMemberId, team: cleanTeam, custType: resolvedCustType, product: 'สินค้าทั่วไป', priceType: 'ราคาสมาชิก', qty: m });
                    if (p > 0) items.push({ billId: record.id, date: record.date || record.sale_date || '', memberId: recMemberId, memberName: member?.name || recMemberId, team: cleanTeam, custType: resolvedCustType, product: 'สินค้าทั่วไป', priceType: 'ราคาโปร', qty: p });
                    if (z > 0) items.push({ billId: record.id, date: record.date || record.sale_date || '', memberId: recMemberId, memberName: member?.name || record.memberId, team: cleanTeam, custType: resolvedCustType, product: 'สินค้าทั่วไป', priceType: 'ราคาศูนย์', qty: z });
                }
            });
            return items;
        }, [sales, members, customers, startDate, endDate, permittedMemberSet, businessTeams]);

        const uplineTeamSummary = useMemo(() => {
            if (!currentUser || !permittedMemberSet) return null;
            const currentId = safeUpper(currentUser.id || currentUser.username);
            const downlineCount = Math.max(permittedMemberSet.size - 1, 0);
            let selfBoxes = 0; let downlineBoxes = 0;
            (unfoldedSales || []).forEach(s => {
                const mId = safeUpper(s.memberId);
                if (mId === currentId) selfBoxes += s.qty;
                else if (permittedMemberSet.has(mId)) downlineBoxes += s.qty;
            });
            return { downlineCount, selfBoxes, downlineBoxes, totalTeamBoxes: selfBoxes + downlineBoxes };
        }, [currentUser, permittedMemberSet, unfoldedSales]);



        const thBase = "p-4 text-[13px] font-bold border-b border-slate-200 bg-slate-50 text-slate-700 whitespace-nowrap uppercase tracking-wide";
        const groupTitles = { sales: '📊 รายงานสรุปยอดขายและพนักงาน', finance: '💰 รายงานการเงินและรายรับบริษัท', stock: '📦 รายงานสต๊อกสินค้าและสินค้าตัดศูนย์', referral: '🎁 รายงานสรุปค่าแนะนำและปันผล' };

        return (
            <div className="space-y-6 animation-fade-in w-full">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-200 pb-4 no-print">
                    <div>
                        <h2 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-3">
                            {groupTitles[activeGroup] || '📊 รายงานสรุปผลงาน'}
                        </h2>
                    </div>
                </div>

                <div className="flex flex-wrap gap-2 pb-2 w-full border-b border-slate-200 no-print">
                    {activeGroup === 'sales' && (
                        <React.Fragment>
                            <SubTabButton id="sales_member_day" label="ยอดบุคคล (วัน)" activeTab={subTab} setSubTab={setSubTab} />
                            <SubTabButton id="sales_member_month" label="ยอดบุคคล (เดือน)" activeTab={subTab} setSubTab={setSubTab} />
                            <SubTabButton id="total_member_day" label="รวมยอดบุคคล (วัน)" activeTab={subTab} setSubTab={setSubTab} />
                            <SubTabButton id="total_member_month" label="รวมยอดบุคคล (เดือน)" activeTab={subTab} setSubTab={setSubTab} />

                            if (query !== '') {
                                if (isTeamView) { if (!(s.team || '').toUpperCase().includes(query)) return; }

                                else { if (!(s.memberId || '').toUpperCase().includes(query) && !(s.memberName || '').toUpperCase().includes(query)) return; }

                            let key = ''; let label2 = ''; let subLabel2 = '';

                            grouped[key].total += s.qty;
                            if (s.priceType === 'ราคาเต็ม') grouped[key].detailsFull[s.product] = (grouped[key].detailsFull[s.product] || 0) + s.qty;
