                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                                <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl shadow-sm">
                                    <div className="text-xs font-bold text-emerald-600 mb-1">รายรับรวมสุทธิ</div>
                                    <div className="text-2xl font-black text-emerald-700">{formatValDisplay(financeKpi.grandRevenue)}</div>
                                    <div className="text-[10px] text-emerald-500 font-bold mt-1">{getCurrencySuffix()}/ช่วงเวลา</div>
                                </div>
                                <div className="bg-white border border-slate-200 p-4 rounded-2xl shadow-sm">
                                    <div className="text-xs font-bold text-slate-500 mb-1">ยอดขายราคาเต็ม</div>
                                    <div className="text-2xl font-black text-slate-800">{financeKpi.fullBoxes.toLocaleString()}</div>
                                    <div className="text-[10px] text-slate-400 font-bold mt-1">กล่อง</div>
                                </div>
                                <div className="bg-blue-50 border border-blue-200 p-4 rounded-2xl shadow-sm">
                                    <div className="text-xs font-bold text-blue-600 mb-1">ยอดขายราคาสมาชิก</div>
                                    <div className="text-2xl font-black text-blue-700">{financeKpi.memberBoxes.toLocaleString()}</div>
                                    <div className="text-[10px] text-blue-500 font-bold mt-1">กล่อง</div>
                                </div>
                                <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl shadow-sm">
                                    <div className="text-xs font-bold text-amber-600 mb-1">ยอดขายราคาโปร</div>
                                    <div className="text-2xl font-black text-amber-700">{financeKpi.proBoxes.toLocaleString()}</div>
                                    <div className="text-[10px] text-amber-500 font-bold mt-1">กล่อง</div>
                                </div>
                                <div className="bg-slate-50 border border-slate-200 p-4 rounded-2xl shadow-sm">
                                    <div className="text-xs font-bold text-slate-500 mb-1">ยอดขายราคาศูนย์</div>
                                    <div className="text-2xl font-black text-slate-600">{financeKpi.zeroBoxes.toLocaleString()}</div>
                                    <div className="text-[10px] text-slate-400 font-bold mt-1">กล่อง</div>
                                </div>
                            </div>

                            {/* Main Table */}
                            {isDetailView ? (
                                <div className={`${boxWrapper} p-0 overflow-hidden`}>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse min-w-[1100px]">
                                            <thead>
                                                <tr className="bg-slate-100 border-b border-slate-200">
                                                    <th className={thBase}>เลขที่บิล</th>
                                                    <th className={thBase}>วันที่</th>
                                                    <th className={thBase}>ผู้ขาย (พนักงาน)</th>
                                                    <th className={thBase}>ชื่อลูกค้า</th>
                                                    <th className={thBase}>ช่องทางชำระ</th>
                                                    <th className={`${thBase} text-center`}>เต็ม (กล่อง)</th>
                                                    <th className={`${thBase} text-center text-blue-700`}>สมาชิก (กล่อง)</th>
                                                    <th className={`${thBase} text-center text-amber-700`}>โปร (กล่อง)</th>
                                                    <th className={`${thBase} text-center text-slate-500`}>ศูนย์ (กล่อง)</th>
                                                    <th className={`${thBase} text-right text-emerald-700 font-bold bg-emerald-50/60`}>ยอดรับ (เงินกีบ)</th>
                                                    <th className={`${thBase} text-right text-blue-700 font-bold bg-blue-50/60`}>ยอดรับ (เงินบาท)</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {financeBills.map((s, idx) => {
                                                    const rawAmt = Number(s['ยอดขายรวม'] || s.total_amount || 0);
                                                    const displayCust = (s.customerName && s.customerName !== 'ไม่ระบุชื่อ') 
                                                        ? s.customerName 
                                                        : (s.customerId ? `ลูกค้า (${s.customerId})` : 'ลูกค้าทั่วไป');
                                                    
                                                    const pModeStr = String(s.payMode || s.pay_mode || s.saleType || s.payment_method || '').toLowerCase();
                                                    
                                                    let isLakBill = pModeStr.includes('กีบ') || pModeStr.includes('lak') || pModeStr.includes('โอนลาวกีบ') || pModeStr.includes('สดกีบ');
                                                    let isThbBill = pModeStr.includes('บาท') || pModeStr.includes('thb') || pModeStr.includes('โอนไทย') || pModeStr.includes('โอนลาวบาท');

                                                    if (!isLakBill && !isThbBill) {
                                                        if (rawAmt >= 100000) isLakBill = true;
                                                        else isThbBill = true;
                                                    }

                                                    let displayLakStr = '-';
                                                    let displayThbStr = '-';

                                                    if (isLakBill) {
                                                        let lakAmt = Number(s.total_amount_lak || s.totalAmountLak || 0);
                                                        if (!lakAmt || lakAmt <= 0) lakAmt = rawAmt >= 100000 ? rawAmt : rawAmt * exchangeRate;
                                                        displayLakStr = `${Math.round(lakAmt).toLocaleString()} ₭`;
                                                    } else {
                                                        let thbAmt = Number(s.total_amount_thb || s.totalAmountThb || 0);
                                                        if (!thbAmt || thbAmt <= 0) thbAmt = rawAmt >= 100000 ? rawAmt / exchangeRate : rawAmt;
                                                        displayThbStr = `฿${(thbAmt % 1 === 0 ? thbAmt.toLocaleString() : thbAmt.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }))}`;
                                                    }

                                                    return (
                                                        <tr key={s.id || idx} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                            <td className="p-4 text-xs font-mono font-bold text-blue-600 whitespace-nowrap">{s.id}</td>
                                                            <td className="p-4 text-xs font-bold text-slate-600 whitespace-nowrap">{s.date}</td>
                                                            <td className="p-4 text-xs font-bold text-slate-800">{s.sellerName || s.memberId}</td>
                                                            <td className="p-4 text-xs font-bold text-slate-900 bg-slate-50/50">{displayCust}</td>
                                                            <td className="p-4 text-xs font-bold">
                                                                <div className="space-y-1">
                                                                    {(() => {
                                                                        const st = String(s.saleType || s.payMode || s.pay_mode || 'เงินโอน').trim();
                                                                        if (st.includes('|') || st.includes(':')) {
                                                                            return st.split('|').map((part, pIdx) => {
                                                                                let pTrim = part.trim();
                                                                                if (pTrim.startsWith('สด:')) pTrim = `เงินสด (THB): ฿${Number(pTrim.replace('สด:', '')).toLocaleString()}`;
                                                                                else if (pTrim.startsWith('สดกีบ:')) pTrim = `เงินสด (LAK): ${Number(pTrim.replace('สดกีบ:', '')).toLocaleString()} ₭`;
                                                                                return <span key={pIdx} className="block px-2.5 py-0.5 bg-slate-100 text-slate-700 border border-slate-200 rounded-md text-[11px] font-semibold whitespace-nowrap">{pTrim}</span>;
                                                                            });
                                                                        }
                                                                        return <span className="px-2.5 py-1 bg-slate-100 text-slate-700 border border-slate-200 rounded-lg text-xs whitespace-nowrap">{st}</span>;
                                                                    })()}
                                                                </div>
                                                            </td>
                                                            <td className="p-4 text-center text-xs font-bold text-slate-700">{s['รวมชิ้นราคาเต็ม'] || 0}</td>
                                                            <td className="p-4 text-center text-xs font-black text-blue-600 bg-blue-50/20">{s['รวมชิ้นราคาสมาชิก'] || 0}</td>
                                                            <td className="p-4 text-center text-xs font-bold text-amber-600">{s['รวมชิ้นราคาโปร'] || 0}</td>
                                                            <td className="p-4 text-center text-xs font-bold text-slate-400">{s['รวมชิ้นราคาศูนย์'] || 0}</td>
                                                            <td className="p-4 text-right text-sm font-black text-emerald-700 bg-emerald-50/30 whitespace-nowrap">
                                                                {displayLakStr}
                                                            </td>
                                                            <td className="p-4 text-right text-sm font-black text-blue-700 bg-blue-50/30 whitespace-nowrap">
                                                                {displayThbStr}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                                {financeBills.length === 0 && (
                                                    <tr><td colSpan={11} className="p-12 text-center text-slate-400 font-bold">ไม่พบข้อมูลการเงินตามเงื่อนไขที่ระบุ</td></tr>
                                                )}
                                            </tbody>
                                            {financeBills.length > 0 && (() => {
                                                let sumLak = 0;
                                                let sumThb = 0;
                                                financeBills.forEach(s => {
                                                    const rawAmt = Number(s['ยอดขายรวม'] || s.total_amount || 0);
                                                    const pModeStr = String(s.payMode || s.pay_mode || s.saleType || s.payment_method || '').toLowerCase();
                                                    let isLakBill = pModeStr.includes('กีบ') || pModeStr.includes('lak') || pModeStr.includes('โอนลาวกีบ') || pModeStr.includes('สดกีบ');
                                                    let isThbBill = pModeStr.includes('บาท') || pModeStr.includes('thb') || pModeStr.includes('โอนไทย') || pModeStr.includes('โอนลาวบาท');
                                                    if (!isLakBill && !isThbBill) {
                                                        if (rawAmt >= 100000) isLakBill = true;
                                                        else isThbBill = true;
                                                    }
                                                    if (isLakBill) {
                                                        let lakAmt = Number(s.total_amount_lak || s.totalAmountLak || 0);
                                                        if (!lakAmt || lakAmt <= 0) lakAmt = rawAmt >= 100000 ? rawAmt : rawAmt * exchangeRate;
                                                        sumLak += lakAmt;
                                                    } else {
                                                        let thbAmt = Number(s.total_amount_thb || s.totalAmountThb || 0);
                                                        if (!thbAmt || thbAmt <= 0) thbAmt = rawAmt >= 100000 ? rawAmt / exchangeRate : rawAmt;
                                                        sumThb += thbAmt;
                                                    }
                                                });
                                                const grandCombinedTHB = sumThb + (sumLak / exchangeRate);

                                                return (
                                                    <tfoot className="bg-slate-900 text-white border-t-4 border-slate-950 sticky bottom-0">
                                                        <tr>
                                                            <td colSpan={5} className="p-4 text-right font-black text-sm text-slate-300">
                                                                ยอดรวมสุทธิแยกตามสกุลเงิน ({financeBills.length} รายการ):
                                                            </td>
                                                            <td className="p-4 text-center font-bold text-slate-300">
                                                                {financeBills.reduce((acc, curr) => acc + Number(curr['รวมชิ้นราคาเต็ม'] || 0), 0)}
                                                            </td>
                                                            <td className="p-4 text-center font-black text-blue-400 bg-blue-950/40">
                                                                {financeBills.reduce((acc, curr) => acc + Number(curr['รวมชิ้นราคาสมาชิก'] || 0), 0)}
                                                            </td>
                                                            <td className="p-4 text-center font-bold text-amber-400">
                                                                {financeBills.reduce((acc, curr) => acc + Number(curr['รวมชิ้นราคาโปร'] || 0), 0)}
                                                            </td>
                                                            <td className="p-4 text-center font-bold text-slate-400">
                                                                {financeBills.reduce((acc, curr) => acc + Number(curr['รวมชิ้นราคาศูนย์'] || 0), 0)}
                                                            </td>
                                                            <td className="p-4 text-right text-sm font-black text-emerald-400 bg-emerald-950/60 whitespace-nowrap">
                                                                {Math.round(sumLak).toLocaleString()} ₭
                                                            </td>
                                                            <td className="p-4 text-right text-sm font-black text-blue-400 bg-blue-950/60 whitespace-nowrap">
                                                                ฿{sumThb.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
                                                            </td>
                                                        </tr>
                                                        <tr className="bg-slate-950 text-slate-200 border-t border-slate-800">
                                                            <td colSpan={9} className="p-3 text-right font-black text-xs text-amber-400 tracking-wide">
                                                                💡 รวมคำนวณรวบยอดคิดเป็นเงินบาททั้งหมด (Combined Total in THB):
                                                            </td>
                                                            <td colSpan={2} className="p-3 text-right font-black text-base text-amber-300">
                                                                ฿{grandCombinedTHB.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })} <span className="text-[10px] font-bold text-slate-400">(อัตราแลกเปลี่ยน {exchangeRate.toLocaleString()} ₭/฿)</span>
                                                            </td>
                                                        </tr>
                                                    </tfoot>
                                                );
                                            })()}
                                        </table>
                                    </div>
                                </div>
                            ) : (
                                <div className={`${boxWrapper} p-0 overflow-hidden`}>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse min-w-[800px]">
                                            <thead>
                                                <tr className="bg-slate-100 border-b border-slate-200">
                                                    <th className={thBase}>ช่วงเวลา (เดือน/วัน)</th>
                                                    <th className={`${thBase} text-center`}>จำนวนบิลทั้งหมด</th>
                                                    <th className={`${thBase} text-center text-emerald-700`}>กล่องราคาเต็ม</th>
                                                    <th className={`${thBase} text-center text-blue-700`}>กล่องราคาสมาชิก</th>
                                                    <th className={`${thBase} text-center text-amber-700`}>กล่องราคาโปร</th>
                                                    <th className={`${thBase} text-center text-slate-500`}>กล่องราคาศูนย์</th>
                                                    <th className={`${thBase} text-right text-emerald-700 font-bold`}>รายรับรวม (เงิน)</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {financeSummaryData.map((row, idx) => (
                                                    <tr key={row.period || idx} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                        <td className="p-4 text-sm font-bold text-slate-800 whitespace-nowrap">{row.period}</td>
                                                        <td className="p-4 text-center text-xs font-bold text-slate-700">{row.billsCount} บิล</td>
                                                        <td className="p-4 text-center text-xs font-bold text-emerald-700 bg-emerald-50/20">{row.fullBoxes} กล่อง</td>
                                                        <td className="p-4 text-center text-xs font-black text-blue-700 bg-blue-50/20">{row.memberBoxes} กล่อง</td>
                                                        <td className="p-4 text-center text-xs font-bold text-amber-700 bg-amber-50/20">{row.proBoxes} กล่อง</td>
                                                        <td className="p-4 text-center text-xs font-bold text-slate-500">{row.zeroBoxes} กล่อง</td>
                                                        <td className="p-4 text-right text-sm font-black text-emerald-700 whitespace-nowrap">
                                                            {formatValDisplay(row.revenue)} <span className="text-[10px] font-bold text-slate-400">{getCurrencySuffix()}</span>
                                                        </td>
                                                    </tr>
                                                ))}
                                                {financeSummaryData.length === 0 && (
                                                    <tr><td colSpan={7} className="p-12 text-center text-slate-400 font-bold">ไม่พบสรุปข้อมูลการเงินตามเงื่อนไขที่ระบุ</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    );
                })()}

                {/* 📌 ส่วนแสดงผลสำหรับกลุ่ม "สต๊อก & สินค้าตัดศูนย์" (activeGroup === 'stock') */}
                {activeGroup === 'stock' && (() => {
                    const isZeroPromoView = subTab === 'stock_zero_promo';
                    const isBalanceView = subTab === 'stock_balance';

                    // 1. คำนวณสรุปยอดขายและยอดเบิกออกจำแนกตามสินค้าจากรายการขาย
                    const stockSalesReport = (() => {
                        let map = {};
                        
                        // กรองบิลขายตั้งแต่วันที่เริ่มต้นโลกจนถึง endDate (สำหรับคำนวณเบิกออกสะสมถึงวันที่เลือก)
                        let salesUpToEndDate = [];
                        (sales || []).forEach(record => {
                            if (!record || (record.date || '') > endDate) return;
                            if (permittedMemberSet !== null && !permittedMemberSet.has(safeUpper(record.memberId))) return;
                            
                            Object.entries(record || {}).forEach(([key, value]) => {
                                if (key.endsWith('_ราคาเต็ม') || key.endsWith('_ราคาสมาชิก') || key.endsWith('_ราคาโปร') || key.endsWith('_ราคาศูนย์')) {
                                    const qty = parseInt(value, 10);
                                    if (!isNaN(qty) && qty > 0) {
                                        const lastUnderscore = key.lastIndexOf('_');
                                        salesUpToEndDate.push({
                                            date: record.date || '',
                                            product: key.substring(0, lastUnderscore).replace(/\(.*?\)/g, '').trim(),
                                            priceType: key.substring(lastUnderscore + 1),
                                            qty: qty
                                        });
                                    }
                                }
                            });
                        });

                        (products || []).forEach(p => {
                            if (!p) return;
                            const pName = String(p.name || p.id || '').trim();
                            const pId = String(p.id || pName).trim();
                            const liveStock = Number(p.stock !== undefined ? p.stock : (p.quantity !== undefined ? p.quantity : (p.qty !== undefined ? p.qty : (p.Stock !== undefined ? p.Stock : 0))));
                            
                            map[pName] = {
                                id: pId,
                                name: pName,
                                category: p.category || '-',
                                fullQty: 0,
                                memberQty: 0,
                                promoQty: 0,
                                zeroQty: 0,
                                periodOut: 0,
                                outUpToEnd: 0,
                                liveStock: liveStock
                            };
                        });

                        // 1.1 คำนวณยอดขายออกสะสมตั้งแต่อดีตจนถึง endDate (outUpToEnd)
                        salesUpToEndDate.forEach(s => {
                            const targetName = String(s.product || '').trim();
                            let foundKey = Object.keys(map).find(k => k.toUpperCase() === targetName.toUpperCase() || map[k].id.toUpperCase() === targetName.toUpperCase());
                            if (!foundKey) {
                                map[targetName] = { id: targetName, name: targetName, category: '-', fullQty: 0, memberQty: 0, promoQty: 0, zeroQty: 0, periodOut: 0, outUpToEnd: 0, liveStock: 0 };
                                foundKey = targetName;
                            }
                            map[foundKey].outUpToEnd += s.qty;
                        });

                        // 1.2 คำนวณยอดขายออกเฉพาะในช่วงวันที่เลือก (periodOut, fullQty, memberQty, etc.)
                        unfoldedSales.forEach(s => {
                            const targetName = String(s.product || '').trim();
                            let foundKey = Object.keys(map).find(k => k.toUpperCase() === targetName.toUpperCase() || map[k].id.toUpperCase() === targetName.toUpperCase());
                            if (!foundKey) {
                                map[targetName] = { id: targetName, name: targetName, category: '-', fullQty: 0, memberQty: 0, promoQty: 0, zeroQty: 0, periodOut: 0, outUpToEnd: 0, liveStock: 0 };
                                foundKey = targetName;
                            }
                            
                            const item = map[foundKey];
                            if (s.priceType === 'ราคาเต็ม') item.fullQty += s.qty;
                            else if (s.priceType === 'ราคาสมาชิก') item.memberQty += s.qty;
                            else if (s.priceType === 'ราคาโปร' || s.priceType === 'โปรโมชั่น') item.promoQty += s.qty;
                            else if (s.priceType === 'ราคาศูนย์') item.zeroQty += s.qty;
                            
                            item.periodOut += s.qty;
                        });

                        const query = (debouncedSearchQuery || searchQuery || '').trim().toUpperCase();
                        return Object.values(map)
                            .map(item => {
                                // คำนวณยอดขายหลังวันที่เลือก (Out After EndDate) เพื่อย้อนเวลาคำนวณยอดคงเหลือ ณ วันที่เลือก
                                let outAfterEnd = 0;
                                (sales || []).forEach(record => {
                                    if (!record || (record.date || '') <= endDate) return;
                                    Object.entries(record || {}).forEach(([key, value]) => {
                                        if (key.endsWith('_ราคาเต็ม') || key.endsWith('_ราคาสมาชิก') || key.endsWith('_ราคาโปร') || key.endsWith('_ราคาศูนย์')) {
                                            const qty = parseInt(value, 10);
                                            if (!isNaN(qty) && qty > 0) {
                                                const pName = key.substring(0, key.lastIndexOf('_')).replace(/\(.*?\)/g, '').trim();
                                                if (pName.toUpperCase() === item.name.toUpperCase() || pName.toUpperCase() === item.id.toUpperCase()) {
                                                    outAfterEnd += qty;
                                                }
                                            }
                                        }
                                    });
                                });

                                // 📌 ยอดสต๊อกคงเหลือ ณ วันที่เลือก = สต๊อกปัจจุบัน + ยอดที่ถูกขายออกหลังวันที่เลือก
                                const stockAtEndDate = item.liveStock + outAfterEnd;
                                // 📌 ยอดรับเข้าสะสม = สต๊อกคงเหลือ ณ วันที่เลือก + ยอดที่ขายออกสะสมจนถึงวันที่เลือก
                                const totalInUpToEnd = stockAtEndDate + item.outUpToEnd;

                                return {
                                    ...item,
                                    currentIn: totalInUpToEnd,
                                    totalOut: item.periodOut,
                                    currentStock: stockAtEndDate
                                };
                            })
                            .filter(item => {
                                if (isZeroPromoView && item.promoQty === 0 && item.zeroQty === 0) return false;
                                if (query !== '' && !item.id.toUpperCase().includes(query) && !item.name.toUpperCase().includes(query)) return false;
                                return true;
                            })
                            .sort((a, b) => b.totalOut - a.totalOut || a.name.localeCompare(b.name));
                    })();

                    // 2. รายงานบิลสินค้าแถมและสินค้าตัดศูนย์แบบเจาะลึกตามบิล (Zero & Promo Items Bills Log)
                    const zeroPromoBills = (() => {
                        if (!isZeroPromoView) return [];
                        let list = [];
                        unfoldedSales.forEach(s => {
                            if (s.priceType === 'ราคาโปร' || s.priceType === 'โปรโมชั่น' || s.priceType === 'ราคาศูนย์') {
                                list.push(s);
                            }
                        });
                        const query = (debouncedSearchQuery || searchQuery || '').trim().toUpperCase();
                        return list.filter(item => {
                            if (query === '') return true;
                            const bId = (item.billId || '').toUpperCase();
                            const mName = (item.memberName || '').toUpperCase();
                            const mId = (item.memberId || '').toUpperCase();
                            const cType = (item.custType || '').toUpperCase();
                            const pName = (item.product || '').toUpperCase();
                            return bId.includes(query) || mName.includes(query) || mId.includes(query) || cType.includes(query) || pName.includes(query);
                        }).sort((a, b) => b.date.localeCompare(a.date) || b.billId.localeCompare(a.billId));
                    })();

                    return (
                        <div className="space-y-6 animation-fade-in">
                            <div className={`${boxWrapper} p-0 overflow-hidden`}>
                                <div className="overflow-x-auto">
                                    {isZeroPromoView ? (
                                        <table className="w-full text-left border-collapse min-w-[1000px]">
                                            <thead>
                                                <tr className="bg-slate-100 border-b border-slate-200">
                                                    <th className={thBase}>เลขที่บิล</th>
                                                    <th className={thBase}>วันที่</th>
                                                    <th className={thBase}>ผู้ขาย (สมาชิก)</th>
                                                    <th className={thBase}>สังกัดทีม</th>
                                                    <th className={thBase}>ประเภทลูกค้า</th>
                                                    <th className={thBase}>สินค้าที่แถม/ตัดศูนย์</th>
                                                    <th className={`${thBase} text-center`}>ประเภทแถม/ศูนย์</th>
                                                    <th className={`${thBase} text-center font-bold text-rose-700`}>จำนวนที่แถม (กล่อง)</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {zeroPromoBills.map((item, idx) => (
                                                    <tr key={idx} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                        <td className="p-4 text-xs font-mono font-bold text-blue-600 whitespace-nowrap">{item.billId}</td>
                                                        <td className="p-4 text-xs font-bold text-slate-600 whitespace-nowrap">{item.date}</td>
                                                        <td className="p-4 text-xs font-bold text-slate-800">
                                                            <div>{item.memberName}</div>
                                                            <div className="text-[10px] text-slate-400 font-mono">รหัส: {item.memberId}</div>
                                                        </td>
                                                        <td className="p-4 text-xs font-bold text-slate-600">
                                                            <span className="px-2 py-0.5 bg-slate-100 border border-slate-200 rounded text-[11px]">{item.team || '-'}</span>
                                                        </td>
                                                        <td className="p-4 text-xs font-bold text-indigo-600">{item.custType || 'ทั่วไป'}</td>
                                                        <td className="p-4 text-xs font-bold text-slate-900 bg-slate-50/50">{item.product}</td>
                                                        <td className="p-4 text-center">
                                                            {item.priceType === 'ราคาศูนย์' ? (
                                                                <span className="px-2.5 py-1 bg-slate-200 text-slate-700 rounded-full text-[11px] font-black border border-slate-300">
                                                                    ตัดศูนย์ราคา
                                                                </span>
                                                            ) : (
                                                                <span className="px-2.5 py-1 bg-amber-100 text-amber-800 rounded-full text-[11px] font-black border border-amber-300">
                                                                    🎁 แถมโปรโมชั่น
                                                                </span>
                                                            )}
                                                        </td>
                                                        <td className="p-4 text-center text-sm font-black text-rose-600 bg-rose-50/20">{item.qty} กล่อง</td>
                                                    </tr>
                                                ))}
                                                {zeroPromoBills.length === 0 && (
                                                    <tr><td colSpan={8} className="p-12 text-center text-slate-400 font-bold">ไม่พบรายการสินค้าแถมหรือตัดศูนย์ตามเงื่อนไขที่ระบุ</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    ) : (
                                        <table className="w-full text-left border-collapse min-w-[900px]">
                                            <thead>
                                                <tr className="bg-slate-100 border-b border-slate-200">
                                                    <th className={thBase}>รหัส/ชื่อสินค้า</th>
                                                    {isBalanceView ? (
                                                        <React.Fragment>
                                                            <th className={`${thBase} text-center text-blue-700`}>ยอดรับเข้าสะสม</th>
                                                            <th className={`${thBase} text-center text-amber-700`}>เบิก/ขายออกในช่วงเวลา</th>
                                                            <th className={`${thBase} text-center text-emerald-700 font-bold bg-emerald-50/50`}>ยอดสต๊อกคงเหลือ ณ วันที่เลือก</th>
                                                        </React.Fragment>
                                                    ) : (
                                                        <React.Fragment>
                                                            <th className={`${thBase} text-center`}>ขายราคาเต็ม</th>
                                                            <th className={`${thBase} text-center text-blue-700`}>ขายราคาสมาชิก</th>
                                                            <th className={`${thBase} text-center text-amber-700`}>ขายราคาโปร</th>
                                                            <th className={`${thBase} text-center text-slate-500`}>ตัดศูนย์ราคา</th>
                                                            <th className={`${thBase} text-center text-blue-700 font-bold bg-blue-50/50`}>รวมเบิกขายทั้งหมด</th>
                                                        </React.Fragment>
                                                    )}
                                                    <th className={`${thBase} text-center w-12`}><SearchIcon size={16} className="mx-auto text-slate-400"/></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {stockSalesReport.map((item, idx) => (
                                                    <tr key={item.id || idx} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                        <td className="p-4">
                                                            <div className="flex items-center gap-3">
                                                                <div className="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-xs shrink-0 border border-blue-100">
                                                                    P
                                                                </div>
                                                                <div>
                                                                    <div className="font-bold text-slate-800 text-sm">{item.name}</div>
                                                                    <div className="text-[10px] text-slate-400 font-mono">รหัส: {item.id}</div>
                                                                </div>
                                                            </div>
                                                        </td>

                                                        {isBalanceView ? (
                                                            <React.Fragment>
                                                                <td className="p-4 text-center text-sm font-black text-blue-600 bg-blue-50/10">{item.currentIn.toLocaleString()}</td>
                                                                <td className="p-4 text-center text-sm font-black text-amber-600 bg-amber-50/10">{item.totalOut.toLocaleString()}</td>
                                                                <td className="p-4 text-center text-base font-black text-emerald-700 bg-emerald-50/30">
                                                                    {item.currentStock.toLocaleString()}
                                                                </td>
                                                            </React.Fragment>
                                                        ) : (
                                                            <React.Fragment>
                                                                <td className="p-4 text-center text-xs font-bold text-slate-700">{item.fullQty}</td>
                                                                <td className="p-4 text-center text-xs font-black text-blue-600 bg-blue-50/20">{item.memberQty}</td>
                                                                <td className="p-4 text-center text-xs font-bold text-amber-600">{item.promoQty}</td>
                                                                <td className="p-4 text-center text-xs font-bold text-slate-400">{item.zeroQty}</td>
                                                                <td className="p-4 text-center text-sm font-black text-blue-700 bg-blue-50/30">
                                                                    {item.totalOut}
                                                                </td>
                                                            </React.Fragment>
                                                        )}
                                                        
                                                        <td className="p-4 text-center">
                                                            <button type="button" onClick={() => setStockModalItem(item)} className="p-1.5 rounded-lg text-slate-400 hover:text-blue-600 hover:bg-blue-50 transition-colors">
                                                                <SearchIcon size={16}/>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                                {stockSalesReport.length === 0 && (
                                                    <tr><td colSpan={isBalanceView ? 5 : 7} className="p-12 text-center text-slate-400 font-bold">ไม่พบข้อมูลรายงานสต๊อกตามเงื่อนไขที่ระบุ</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    )}
                                </div>
                            </div>
                        </div>
                    );
                })()}

                {activeGroup === 'referral' && (
                    <div className="space-y-4 animation-fade-in">
                        <div className="flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                            <div className="flex flex-wrap items-center gap-2">
                                <button type="button" onClick={() => setReferralCalcMode('box')} className={`px-3.5 py-2 rounded-xl text-xs font-black transition-all flex items-center gap-1.5 ${referralCalcMode === 'box' ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                                    <span>📦</span> คำนวณข้างกล่องทั้งหมด
                                </button>
                                <button type="button" onClick={() => setReferralCalcMode('percent')} className={`px-3.5 py-2 rounded-xl text-xs font-black transition-all flex items-center gap-1.5 ${referralCalcMode === 'percent' ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                                    <span>📊</span> คำนวณเปอร์เซ็นต์ทั้งหมด
                                </button>
                                <button type="button" onClick={() => setReferralCalcMode('combo')} className={`px-3.5 py-2 rounded-xl text-xs font-black transition-all flex items-center gap-1.5 ${referralCalcMode === 'combo' ? 'bg-fuchsia-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                                    <span>🔀</span> คำนวณแบบผสม
                                </button>
                            </div>

                            <div className="flex items-center gap-3">
                                <div className="flex items-center gap-2 shrink-0">
                                    <span className="text-xs font-bold text-slate-600">สกุลเงิน:</span>
                                    <button type="button" onClick={() => setCurrencyMode('LAK')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${currencyMode === 'LAK' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>🇱🇦 LAK</button>
                                    <button type="button" onClick={() => setCurrencyMode('THB')} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${currencyMode === 'THB' ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>🇹🇭 THB</button>
                                </div>
                            </div>
                        </div>

                        {subTab === 'referral_payout' ? (
                            <div className="space-y-4 animation-fade-in">
                                <div className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 text-white p-5 rounded-2xl shadow-lg border border-slate-800 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                                    <div className="flex flex-wrap items-center gap-3">
                                        <div className="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-xl backdrop-blur-md">
                                            <input 
                                                type="checkbox" 
                                                id="selectAllPayouts"
                                                className="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 cursor-pointer"
                                                checked={referralDailyPayoutData.length > 0 && selectedPayoutKeys.size > 0 && selectedPayoutKeys.size === referralDailyPayoutData.filter(i => i.status === 'PENDING').length}
                                                onChange={(e) => {
                                                    if (e.target.checked) {
                                                        const pendingKeys = new Set(referralDailyPayoutData.filter(i => i.status === 'PENDING').map(i => i.key));
                                                        setSelectedPayoutKeys(pendingKeys);
                                                    } else {
                                                        setSelectedPayoutKeys(new Set());
                                                    }
                                                }}
                                            />
                                            <label htmlFor="selectAllPayouts" className="text-xs font-bold text-slate-200 cursor-pointer whitespace-nowrap">
                                                เลือกทั้งหมด (รอจ่าย)
                                            </label>
                                        </div>
                                        <div className="flex flex-wrap items-center gap-1 bg-white/10 p-1 rounded-xl backdrop-blur-md text-xs font-bold">
                                            <button type="button" onClick={() => setPayoutStatusFilter('ALL')} className={`px-3 py-1.5 rounded-lg transition-all ${payoutStatusFilter === 'ALL' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-300 hover:text-white'}`}>ทั้งหมด ({referralDailyPayoutData.length})</button>
                                            <button type="button" onClick={() => setPayoutStatusFilter('PENDING')} className={`px-3 py-1.5 rounded-lg transition-all ${payoutStatusFilter === 'PENDING' ? 'bg-amber-500 text-slate-900 font-black shadow-sm' : 'text-amber-300 hover:text-white'}`}>🟡 รอปันผล ({referralDailyPayoutData.filter(i => i.status === 'PENDING').length})</button>
                                            <button type="button" onClick={() => setPayoutStatusFilter('PAID')} className={`px-3 py-1.5 rounded-lg transition-all ${payoutStatusFilter === 'PAID' ? 'bg-emerald-500 text-slate-900 font-black shadow-sm' : 'text-emerald-300 hover:text-white'}`}>🟢 จ่ายแล้ว ({referralDailyPayoutData.filter(i => i.status === 'PAID').length})</button>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2 w-full md:w-auto">
                                        <button
                                            type="button"
                                            onClick={() => setShowPayoutModal(true)}
                                            disabled={selectedPayoutKeys.size === 0}
                                            className={`w-full md:w-auto px-5 py-2.5 rounded-xl font-black text-xs transition-all shadow-md flex items-center justify-center gap-2 ${selectedPayoutKeys.size > 0 ? 'bg-emerald-500 hover:bg-emerald-600 text-slate-950 cursor-pointer animate-pulse' : 'bg-slate-700 text-slate-400 cursor-not-allowed'}`}
                                        >
                                            <span>💸</span> ทำรายการจ่ายเงินปันผล ({selectedPayoutKeys.size} คน)
                                        </button>
                                    </div>
                                </div>
                                <div className={`${boxWrapper} p-0 overflow-hidden`}>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse min-w-[1000px]">
                                            <thead>
                                                <tr className="bg-slate-100 border-b border-slate-200">
                                                    <th className={`${thBase} w-12 text-center`}>เลือก</th>
                                                    <th className={thBase}>วันที่</th>
                                                    <th className={thBase}>รหัส</th>
                                                    <th className={thBase}>พนักงาน</th>
                                                    <th className={thBase}>สังกัดทีม</th>
                                                    <th className={`${thBase} text-right text-blue-700`}>คอมขายเอง</th>
                                                    <th className={`${thBase} text-right text-emerald-700`}>ปันผลสายงาน</th>
                                                    <th className={`${thBase} text-right text-slate-900 font-bold`}>รวมรับสุทธิวันนั้น</th>
                                                    <th className={`${thBase} text-center`}>สถานะการจ่าย</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {referralDailyPayoutData.map((item) => {
                                                    const isSelected = selectedPayoutKeys.has(item.key);
                                                    const isPaid = item.status === 'PAID';
                                                    return (
                                                        <tr key={item.key} className={`border-b border-slate-100 hover:bg-slate-50 transition-colors ${isSelected ? 'bg-blue-50/40' : ''}`}>
                                                            <td className="p-4 text-center">
                                                                <input type="checkbox" disabled={isPaid} checked={isSelected} onChange={(e) => { const next = new Set(selectedPayoutKeys); if (e.target.checked) next.add(item.key); else next.delete(item.key); setSelectedPayoutKeys(next); }} className="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 cursor-pointer disabled:opacity-40" />
                                                            </td>
                                                            <td className="p-4 text-sm font-mono font-bold text-slate-700 whitespace-nowrap">{item.date}</td>
                                                            <td className="p-4 text-sm font-bold text-blue-600 font-mono whitespace-nowrap">{item.memberId}</td>
                                                            <td className="p-4 text-sm font-black text-slate-800">{item.memberName}</td>
                                                            <td className="p-4 text-sm font-bold"><span className="px-2.5 py-1 bg-slate-100 text-slate-700 rounded-lg text-xs border border-slate-200 whitespace-nowrap">{item.team}</span></td>
                                                            <td className="p-4 text-sm text-right font-black text-blue-600">{formatValDisplay(item.selfEarn)}</td>
                                                            <td className="p-4 text-sm text-right font-black text-emerald-600">{formatValDisplay(item.teamEarn)}</td>
                                                            <td className="p-4 text-sm text-right font-black text-slate-900 bg-slate-50/50">{formatValDisplay(item.totalEarn)} <span className="text-[10px] font-bold text-slate-500">{getCurrencySuffix()}</span></td>
                                                            <td className="p-4 text-center">
                                                                {isPaid ? (
                                                                    <div className="flex flex-col items-center">
                                                                        <span className="whitespace-nowrap px-3 py-1 bg-emerald-100 text-emerald-800 border border-emerald-300 rounded-full text-[11px] font-black inline-flex items-center gap-1 shadow-sm">🟢 จ่ายปันผลแล้ว</span>
                                                                        <span className="text-[10px] text-slate-400 font-bold mt-1 whitespace-nowrap" title={`จ่ายเมื่อ: ${item.paidAt ? new Date(item.paidAt).toLocaleDateString('th-TH') : '-'}`}>โดย {item.paidBy || 'แอดมิน'}</span>
                                                                    </div>
                                                                ) : (
                                                                    <span className="whitespace-nowrap px-3 py-1 bg-amber-100 text-amber-800 border border-amber-300 rounded-full text-[11px] font-black inline-flex items-center gap-1 shadow-sm">🟡 รอปันผล</span>
                                                                )}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                                {referralDailyPayoutData.length === 0 && <tr><td colSpan="9" className="p-12 text-center text-slate-400 font-bold">ไม่พบรายการปันผลรายวันตามเงื่อนไขที่ระบุ</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        ) : (

    const App = () => {
        const [isLoggedIn, setIsLoggedIn] = useState(false);
        const [currentUser, setCurrentUser] = useState(null);
        const [showLoginModal, setShowLoginModal] = useState(false);

        const [systemSettings, setSystemSettings] = useState({ exchange_rate: 700, commission_levels: 6 });
        const [products, setProducts] = useState([]);
        const [customerTypes, setCustomerTypes] = useState(fallbackCustomerTypes);
        const [businessTeams, setBusinessTeams] = useState([]);
        const [members, setMembers] = useState([]);
        const [customers, setCustomers] = useState([]);
        const [sales, setSales] = useState([]);
        const [stockMovements, setStockMovements] = useState([]);
        const [systemUsers, setSystemUsers] = useState([]);
        const [payoutLogs, setPayoutLogs] = useState([]);
        const [isAppLoading, setIsAppLoading] = useState(true);
        const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(false);

        const isAdmin = currentUser && (String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || String(currentUser.role).trim().toLowerCase() === 'admin');

        const activeCustomerTypes = useMemo(() => {
            if (!customerTypes || customerTypes.length === 0) return fallbackCustomerTypes;
            return (customerTypes || []).filter(p => p && p.status === 'ใช้งาน');
        }, [customerTypes]);

        const fetchAllData = useCallback(async () => {
            try {
                const [pRes, typeRes, cloRes, memRes, custRes, saleRes, teamRes, settingsRes, movRes, payRes] = await Promise.all([
                    supabaseSelect('stk_products', 'limit=1000').catch(() => []),
                    supabaseSelect('stk_customer_types', 'limit=1000').catch(() => fallbackCustomerTypes),
                    supabaseSelect('stk_closers', 'limit=1000').catch(() => []),
                    supabaseSelect('stk_members', 'limit=5000').catch(() => []),
                    supabaseSelect('stk_customers', 'limit=5000').catch(() => []),
                    supabaseSelect('stk_sales', 'limit=10000').catch(() => []),
                    supabaseSelect('stk_business_teams', 'limit=1000').catch(() => []),
                    supabaseSelect('stk_system_settings', 'limit=100').catch(() => []),
                    supabaseSelect('stk_stock_movements', 'limit=5000').catch(() => []),
                    supabaseSelect('stk_payout_logs', 'limit=5000').catch(() => [])
                ]);

                setSystemSettings({ exchange_rate: 700, commission_levels: 6, ...(settingsRes[0] || {}) });
                
                const formattedProducts = (pRes || []).map(p => ({
                    ...p,
                    id: String(p.id || p.product_id || p.Product_ID || p.code || '').trim(),
                    name: String(p.name || p.product_name || p.Product_Name || p.id || '').trim(),
                    stock: Number(p.stock !== undefined ? p.stock : (p.quantity !== undefined ? p.quantity : (p.qty !== undefined ? p.qty : (p.Stock !== undefined ? p.Stock : 0))))
                }));
                setProducts(formattedProducts);
                setCustomerTypes(typeRes);

                // แปลงข้อมูลทีมให้ถูกต้อง (Mapping)
                const formattedTeams = (teamRes || []).map(t => ({
                    id: String(t.id || t.team_id || t.Team_ID || '').trim(),
                    name: String(t.name || t.team_name || t.Team_Name || t.TeamName || '').trim(),
                    status: String(t.status || t.Status || 'ใช้งาน').trim()
                }));
                setBusinessTeams(formattedTeams);
                
                const formattedMembers = (memRes || []).map(m => ({
                    id: String(m.id || m.user_id || m.User_ID || '').trim(),
                    name: String(m.name || m.Name || '').trim(),
                    referrer: String(m.referrer || m.sponsor_id || m.Sponsor_ID || '').trim(),
                    team: String(m.team || m.business_team || m.Business_Team || 'Marketing').trim(),
                    role: String(m.role || m.permission_role || m.Permission_Role || 'Staff').trim(),
                    status: String(m.status || m.Status || 'ทำงานอยู่').trim(),
                    profileUrl: m.profile_url || m.id_card_url || m.ID_Card_URL || '',
                    phone: m.phone || m.phone_number || m.Phone_Number || '',
                    email: m.email || m.Email || '',
                    lineId: m.line_id || m.LINE_ID || '',
                    accumulatedPV: Number(m.accumulated_pv || m.Accumulated_PV || 0)
                })).filter(m => m.id !== '');
                setMembers(formattedMembers);
                
                setCustomers(custRes);
                
                if (Array.isArray(saleRes)) {
                    const processedSales = saleRes.map(s => {
                        let sumF = 0, sumM = 0, sumP = 0, sumZ = 0;
                        let itemsList = [];
                        if (s.items_json) {
                            try { itemsList = typeof s.items_json === 'string' ? JSON.parse(s.items_json) : s.items_json; } catch(e){}
                        }
                        
                        if (Array.isArray(itemsList) && itemsList.length > 0) {
                            itemsList.forEach(it => {
                                const typeStr = String(it.type || '').trim();
                                const qtyNum = Number(it.qty || it.quantity || 1);
                                const pName = String(it.prod || it.productName || it.name || 'Unknown').trim();
                                s[`${pName}_${typeStr}`] = qtyNum;
                                
                                if (typeStr === 'ราคาเต็ม') sumF += qtyNum;
                                else if (typeStr === 'ราคาสมาชิก') sumM += qtyNum;
                                else if (typeStr === 'ราคาโปร' || typeStr === 'โปรโมชั่น') sumP += qtyNum;
                                else if (typeStr === 'ราคาศูนย์') sumZ += qtyNum;
                                else sumM += qtyNum;
                            });
                        } else {
                            Object.keys(s).forEach(k => {
                                if (k !== 'รวมชิ้นราคาเต็ม' && k !== 'รวมชิ้นราคาสมาชิก' && k !== 'รวมชิ้นราคาโปร' && k !== 'รวมชิ้นราคาศูนย์' && k !== 'ยอดรวมชิ้นทั้งหมด') {
                                    if (k.endsWith('_ราคาเต็ม')) sumF += (parseInt(s[k]) || 0);
                                    else if (k.endsWith('_ราคาสมาชิก')) sumM += (parseInt(s[k]) || 0);
                                    else if (k.endsWith('_ราคาโปร') || k.endsWith('_โปรโมชั่น')) sumP += (parseInt(s[k]) || 0);
                                    else if (k.endsWith('_ราคาศูนย์')) sumZ += (parseInt(s[k]) || 0);
                                }
                            });
                        }
                        
                        s['id'] = s.id || s.order_id || s.sale_id || s.receipt_id || s.bill_id || '';
                        s['memberId'] = s.memberId || s.member_id || s.sellerId || s.seller_id || s.seller || s.user_id || s.created_by || s.marketing || '';
                        s['sellerId'] = s['memberId'];
                        s['sellerName'] = s.sellerName || s.seller_name || s.member_name || s.marketing_name || s['memberId'];
                        s['customerType'] = s.customer_type || s.customerType || s.custType || '';
                        
                        // 📌 Fix: ดึงชื่อลูกค้าให้ถูกต้อง (สอดคล้องกับโครงสร้างฟิลด์ Supabase / Customers List)
                        const rawCustId = String(s.customerId || s.customer_id || s.client_id || s.cust_id || s.hn || '').trim().toUpperCase();
                        let resolvedCustName = s.customerName || s.customer_name || s.custName || s.client_name || '';
                        
                        if (rawCustId && (custRes || []).length > 0) {
                            const foundCust = (custRes || []).find(c => c && (
                                String(c.id || '').trim().toUpperCase() === rawCustId || 
                                String(c.customer_id || '').trim().toUpperCase() === rawCustId ||
                                String(c.hn || '').trim().toUpperCase() === rawCustId
                            ));
                            if (foundCust && (foundCust.name || foundCust.customer_name || foundCust.Name)) {
                                resolvedCustName = foundCust.name || foundCust.customer_name || foundCust.Name;
                            }
                        }
                        
                        s['customerName'] = resolvedCustName || (rawCustId ? `ลูกค้า (${rawCustId})` : 'ไม่ระบุชื่อ');
                        s['payMode'] = s.payMode || s.pay_mode || s.payment_method || s.payment || 'เงินโอน';
                        
                        const dbTotalBottles = Number(s.total_bottles || s.totalQty || 0);
                        if (sumF + sumM + sumP + sumZ === 0 && dbTotalBottles > 0) {
                            sumM = dbTotalBottles;
                        } else if (sumF + sumM + sumP + sumZ === 0 && Number(s.total_amount || s.totalAmount || 0) > 0) {
                            const estimated = Math.max(1, Math.round(Number(s.total_amount || s.totalAmount || 0) / 1000));
                            sumM = estimated;
                        }

                        s['รวมชิ้นราคาเต็ม'] = sumF; 
                        s['รวมชิ้นราคาสมาชิก'] = sumM;
                        s['รวมชิ้นราคาโปร'] = sumP; 
                        s['รวมชิ้นราคาศูนย์'] = sumZ;
                        s['ยอดรวมชิ้นทั้งหมด'] = sumF + sumM + sumP + sumZ;
                        
                        s['_items'] = itemsList;
                        if (!s['ยอดขายรวม']) {
                            s['ยอดขายรวม'] = Number(s.total_amount || s.grand_total || s.totalAmount || s.grandTotal || s.amount || 0);
                        }
                        
                        const rawDate = String(s.date || s.sale_date || s.created_at || '');
                        s['date'] = rawDate.split('T')[0].split(' ')[0];
                        
                        return s;
                    });
                    setSales(processedSales);
                } else {
                    setSales([]);
                }
                
                setStockMovements(movRes);
                setPayoutLogs(payRes);
            } catch (err) {
                console.error("Supabase load error:", err);
            } finally {
                setIsAppLoading(false);
            }
        }, []);

        useEffect(() => {
            const savedUserStr = localStorage.getItem('stk_current_user');
            if (savedUserStr) {
                setCurrentUser(JSON.parse(savedUserStr));
                setIsLoggedIn(true);
            } else setShowLoginModal(true);

            const initialLoader = document.getElementById('initial-loader');
            if (initialLoader) initialLoader.style.display = 'none';

            fetchAllData();
        }, [fetchAllData]);

        const handleLoginSuccess = (user) => {
            localStorage.setItem('stk_current_user', JSON.stringify(user));
            setCurrentUser(user);
            setIsLoggedIn(true);
            setShowLoginModal(false);
        };

        const handleLogout = () => {
            localStorage.removeItem('stk_current_user');
            setCurrentUser(null);
            setIsLoggedIn(false);
        };

        return (
            <div className="min-h-screen flex flex-col lg:flex-row font-sans bg-slate-50">
                <Sidebar 
                    activePage="reports" 
                    isLoggedIn={isLoggedIn} 
                    currentUser={currentUser} 
                    isAdmin={isAdmin} 
                    onLogout={handleLogout} 
                    showLoginModal={showLoginModal} 
                    setShowLoginModal={setShowLoginModal} 
                    SCRIPT_URL=""
                    isSidebarCollapsed={isSidebarCollapsed}
                    setIsSidebarCollapsed={setIsSidebarCollapsed}
                />
                <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>
                    <div className="p-3 sm:p-6 flex-1 w-full relative z-0">
                        {isAppLoading ? (
                            <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                                <div className="w-16 h-16 border-[4px] border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                                <h2 className="text-lg font-bold text-slate-700">กำลังโหลดข้อมูล...</h2>
                            </div>
                        ) : isLoggedIn ? (
                            <ReportsView 
                                sales={sales} 
                                members={members} 
                                customers={customers} 
                                activeCustomerTypes={activeCustomerTypes} 
                                products={products} 
                                systemSettings={systemSettings}
                                businessTeams={businessTeams}
                                currentUser={currentUser}
                                isAdmin={isAdmin}
                                onRefreshData={fetchAllData}
                                stockMovements={stockMovements}
                                payoutLogs={payoutLogs}
                            />
                        ) : (
                            <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                                <h2 className="text-xl font-black text-red-500">กรุณาเข้าสู่ระบบก่อนใช้งาน</h2>
                            </div>
                        )}
                    </div>
                </main>
                <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={systemUsers} />
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
