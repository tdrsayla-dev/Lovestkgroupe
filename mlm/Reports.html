    const { LayoutDashboard, ShoppingCart, Users, Contact, Headset, BarChart3, Plus, Edit, Trash2, UserCircle, Menu, X, Save, Info, PackageIcon, Package, Target, Trophy, Activity, Eye, Tags, CheckCircle, GitBranch, Archive, ChevronDown, FileText, SettingsIcon, Coins, ShieldCheck, AlertTriangle, AlertCircle, LoginModal, Toast, Sidebar, Header, ConfirmModal, EditModal, DonutChart, AutoSuggestInput, SearchIcon } = window;
    
    

    const safeUpper = (str) => String(str || '').trim().toUpperCase();

    };
    function useDebounce(value, delay) {
        const [debouncedValue, setDebouncedValue] = React.useState(value);
        React.useEffect(() => {
            const handler = setTimeout(() => { setDebouncedValue(value); }, delay);
            return () => clearTimeout(handler);
        }, [value, delay]);
        return debouncedValue;
    }

    const fallbackCustomerTypes = window.fallbackCustomerTypes || [
       { id: 'T001', name: 'ลูกค้าใหม่', status: 'ใช้งาน' },

        const keys = Object.keys(detailsObj || {});
        if (keys.length === 0) return <span className="text-slate-300 text-xs">-</span>;

                    <span key={p} className={`whitespace-nowrap px-2.5 py-1 rounded-md text-[11px] font-bold flex items-center gap-1.5 shadow-sm ${colorClasses}`}>
                        {p} <span className="bg-white/90 px-1.5 rounded-sm border border-[inherit] font-black">{detailsObj[p]}</span>

    const resolveTeamName = (rawTeam, businessTeams) => {
        if (!rawTeam) return 'N/A';
        const tUpper = safeUpper(rawTeam);
        if (tUpper === 'TEAM A' || tUpper === 'T01' || tUpper === 'TB1') return 'Marketing';
        if (tUpper === 'TEAM B' || tUpper === 'T02' || tUpper === 'TB2') return 'Center';
        if (Array.isArray(businessTeams)) {
            const found = businessTeams.find(bt => bt && (safeUpper(bt.id) === tUpper || safeUpper(bt.name) === tUpper));
            if (found && found.name) return found.name;
        }
        return rawTeam;
    };

    const SubTabButton = ({ id, label, activeTab, setSubTab, isSpecial, isData }) => {
        const isActive = activeTab === id;
        let baseClass = "px-4 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap flex-shrink-0 shadow-sm border ";
        if (isActive) {
            if (isSpecial) baseClass += "bg-indigo-600 text-white border-indigo-600 shadow-indigo-200";
            else if (isData) baseClass += "bg-emerald-600 text-white border-emerald-600 shadow-emerald-200";
            else baseClass += "bg-blue-600 text-white border-blue-600 shadow-blue-200";
        } else {
            baseClass += "bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-blue-600";
        }
        return (
            <button type="button" onClick={() => setSubTab(id)} className={baseClass}>
                {label}
            </button>
        );
    };

    const ReportsView = ({ sales, members, customers, activeCustomerTypes, products, systemSettings, businessTeams, currentUser, isAdmin, onRefreshData, stockMovements, payoutLogs = [] }) => {
        const todayStr = getLocalISODate();
        const [startDate, setStartDate] = useState(todayStr);
        const [endDate, setEndDate] = useState(todayStr);

        const [activeGroup, setActiveGroup] = useState(() => {
            const params = new URLSearchParams(window.location.search);
            return params.get('group') || 'sales';
        });

        const [subTab, setSubTab] = useState('sales_member_day');
        const [searchQuery, setSearchQuery] = useState('');
        const [currencyMode, setCurrencyMode] = useState('LAK');
        const exchangeRate = Number(systemSettings?.exchange_rate || 700);

        const [referralCalcMode, setReferralCalcMode] = useState('box');
        const [selectedSponsorFilter, setSelectedSponsorFilter] = useState('');
        const [selectedTeamFilter, setSelectedTeamFilter] = useState('');

        const [stockModalItem, setStockModalItem] = useState(null);

        const [selectedPayouts, setSelectedPayouts] = useState([]);
        const [showPayoutModal, setShowPayoutModal] = useState(false);
        const [payoutMethod, setPayoutMethod] = useState('เงินโอน');
        const [payoutNote, setPayoutNote] = useState('');
        const [isProcessingPayout, setIsProcessingPayout] = useState(false);

        const [paidRecords, setPaidRecords] = useState({});

        useEffect(() => {
            setSelectedPayouts([]);
        }, [startDate, endDate, activeGroup, subTab, selectedTeamFilter, selectedSponsorFilter]);

        useEffect(() => {
            let initialRecords = {};
            try {
                const saved = localStorage.getItem('stk_payout_history');
                if (saved) initialRecords = JSON.parse(saved);
            } catch(e) {}

            if (Array.isArray(payoutLogs) && payoutLogs.length > 0) {
                payoutLogs.forEach(log => {
                    const key = log.payout_id || `${log.member_id}_${log.payout_date}`;
                    if (key) {
                        initialRecords[key] = {
                            status: log.status || 'PAID',
                            paidAt: log.paid_at || log.created_at,
                            paidBy: log.paid_by || log.member_name || 'แอดมิน',
                            amount: log.amount
                        };
                    }
                });
            }
            setPaidRecords(initialRecords);
        }, [payoutLogs]);

        const [selectedPayoutKeys, setSelectedPayoutKeys] = useState(new Set());
        const [payoutStatusFilter, setPayoutStatusFilter] = useState('ALL'); 

        const handleSavePayouts = async (keysToPay) => {
            if (!keysToPay || keysToPay.size === 0) {
                alert('กรุณาเลือกรายการที่ต้องการจ่ายปันผลก่อนครับ');
                return;
            }
            const updated = { ...paidRecords };
            const todayNow = new Date().toISOString();
            const payer = currentUser?.name || 'Administrator';

            keysToPay.forEach(key => {
                updated[key] = { status: 'PAID', paidAt: todayNow, paidBy: payer };
            });

            setPaidRecords(updated);
            try { localStorage.setItem('stk_payout_history', JSON.stringify(updated)); } catch(e) {}

            if (typeof window.supabaseInsert === 'function') {
                try {
                    for (const k of Array.from(keysToPay)) {
                        const payoutItem = (referralDailyPayoutData || []).find(item => item.key === k);
                        const [mId, pDate] = k.split('_');
                        const logData = {
                            payout_id: k,
                            member_id: payoutItem?.memberId || mId,
                            member_name: payoutItem?.memberName || '',
                            team_name: payoutItem?.team || '',
                            amount: payoutItem?.totalEarn || 0,
                            payout_date: payoutItem?.date || pDate,
                            status: 'PAID',
                            paid_by: payer,
                            paid_at: todayNow
                        };
                        await window.supabaseInsert('stk_payout_logs', logData).catch(async () => {
                            if (typeof window.supabaseUpdate === 'function') {
                                await window.supabaseUpdate('stk_payout_logs', k, logData, 'payout_id').catch(() => {});
                            }
                        });
                    }
                    if (typeof onRefreshData === 'function') onRefreshData();
                } catch(e) {
                    console.log('Supabase sync info:', e.message);
                }
            }

            setSelectedPayoutKeys(new Set());
            alert(`บันทึกการจ่ายปันผลสำเร็จเรียบร้อย (${keysToPay.size} รายการ)`);
        };

        useEffect(() => {
            const checkUrlGroup = () => {
                const params = new URLSearchParams(window.location.search);
                const currentGroup = params.get('group') || 'sales';
                setActiveGroup(currentGroup);
            };
            checkUrlGroup();
            window.addEventListener('popstate', checkUrlGroup);
            const originalPushState = window.history.pushState;
            window.history.pushState = function(...args) {
                originalPushState.apply(this, args);
                checkUrlGroup();
            };
            return () => {
                window.removeEventListener('popstate', checkUrlGroup);
                window.history.pushState = originalPushState;
            };
        }, []);

        useEffect(() => {
            if (activeGroup === 'sales') setSubTab('sales_member_day');
            else if (activeGroup === 'finance') setSubTab('finance_summary');
            else if (activeGroup === 'stock') setSubTab('stock_sales_by_product');
            else if (activeGroup === 'referral') setSubTab('referral_fee');
        }, [activeGroup]);

        const convertVal = useCallback((lakVal) => {
            if (currencyMode === 'THB') return lakVal / exchangeRate;
            return lakVal;
        }, [currencyMode, exchangeRate]);

        const getCurrencySuffix = useCallback(() => {
            return currencyMode === 'THB' ? 'บาท' : 'กีบ';
        }, [currencyMode]);

        const formatValDisplay = useCallback((lakVal) => {
            if (lakVal <= 0) return '-';
            const converted = convertVal(lakVal);
            if (currencyMode === 'THB') {
                return converted % 1 === 0 ? converted.toLocaleString() : converted.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
            return Math.round(converted).toLocaleString();
        }, [convertVal, currencyMode]);

        const debouncedSearchQuery = useDebounce(searchQuery, 300);
        const [detailModalEarner, setDetailModalEarner] = useState(null);

        const distinctTeams = useMemo(() => {
            const set = new Set();
            if (Array.isArray(businessTeams)) {
                businessTeams.forEach(bt => {
                    if (bt && bt.name) set.add(bt.name.trim());
                });
            }
            (members || []).forEach(m => { 
                if (m && m.team) {
                    const cName = resolveTeamName(m.team, businessTeams);
                    set.add(cName);
                } 
            });
            return Array.from(set).sort();
        }, [members, businessTeams]);

        const uplineLeadersList = useMemo(() => {
            const sponsorIds = new Set();
            (members || []).forEach(m => {
                if (m && (m.referrer || m.sponsorId)) {
                    sponsorIds.add(safeUpper(m.referrer || m.sponsorId));
                }
            });
            return (members || []).filter(m => m && sponsorIds.has(safeUpper(m.id)));
        }, [members]);

        const permittedMemberSet = useMemo(() => {
            if (!currentUser || isAdmin) return null;
            const userId = safeUpper(currentUser.id || currentUser.username);
            let downlines = new Set([userId]);
            let queue = [userId];

            while (queue.length > 0) {
                let parentId = queue.shift();
                (members || []).forEach(m => {
                    if (m && m.id) {
                        const sponsor = safeUpper(m.referrer || m.sponsorId);
                        if (sponsor === parentId) {
                            let mId = safeUpper(m.id);
                            if (!downlines.has(mId)) {
                                downlines.add(mId);
                                queue.push(mId);
                            }
                        }
                    }
                });
            }
            return downlines;
        }, [currentUser, isAdmin, members]);

        useEffect(() => {
            const isMonthly = subTab.includes('month') || subTab === 'finance_summary';
            if (isMonthly || subTab === 'ranking' || subTab === 'sales_by_cust_type' || subTab === 'referral_fee') {
                const now = new Date();
                setStartDate(`${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`);
                setEndDate(todayStr);
            } else {
                setStartDate(todayStr);
                setEndDate(todayStr);
            }
        }, [subTab]);

        const unfoldedSales = useMemo(() => {
            let items = [];
            const dateFilteredSales = (sales || []).filter(s => {
                if (!s || (s.date || '') < startDate || (s.date || '') > endDate) return false;
                if (permittedMemberSet !== null) return permittedMemberSet.has(safeUpper(s.memberId));
                return true;
            });

            dateFilteredSales.forEach(record => {
                const member = (members || []).find(m => m && safeUpper(m.id) === safeUpper(record.memberId));
                const cust = (customers || []).find(c => c && c.id === record.customerId);
                const cleanTeam = resolveTeamName(member?.team, businessTeams);
                const resolvedCustType = record.customerType || record.custType || record.customer_type || (cust ? cust.type : '') || 'ไม่ระบุประเภท';

                Object.entries(record || {}).forEach(([key, value]) => {
                    if (key.endsWith('_ราคาเต็ม') || key.endsWith('_ราคาสมาชิก') || key.endsWith('_ราคาโปร') || key.endsWith('_ราคาศูนย์')) {
                        const qty = parseInt(value, 10);
                        if (!isNaN(qty) && qty > 0) {
                            const lastUnderscore = key.lastIndexOf('_');
                            items.push({
                                billId: record.id,
                                date: record.date || '',
                                memberId: record.memberId,
                                memberName: member?.name || record.memberId || 'UNKNOWN',
                                team: cleanTeam,
                                custType: resolvedCustType,
                                product: key.substring(0, lastUnderscore).replace(/\(.*?\)/g, '').trim(),
                                priceType: key.substring(lastUnderscore + 1),
                                qty: qty
                            });
                        }
                    }
                });
            });
            return items;
        }, [sales, members, customers, startDate, endDate, permittedMemberSet, businessTeams]);

        const uplineTeamSummary = useMemo(() => {
            if (!currentUser || !permittedMemberSet) return null;
            const currentId = safeUpper(currentUser.id || currentUser.username);
            const downlineCount = Math.max(permittedMemberSet.size - 1, 0);
            let selfBoxes = 0; let downlineBoxes = 0;
            (unfoldedSales || []).forEach(s => {
                const mId = safeUpper(s.memberId);
                if (mId === currentId) selfBoxes += s.qty;
                else if (permittedMemberSet.has(mId)) downlineBoxes += s.qty;
            });
            return { downlineCount, selfBoxes, downlineBoxes, totalTeamBoxes: selfBoxes + downlineBoxes };
        }, [currentUser, permittedMemberSet, unfoldedSales]);

        const referralReportData = useMemo(() => {
            if (activeGroup !== 'referral') return [];
            let memberMap = {};

            (members || []).forEach(m => {
                if (permittedMemberSet !== null && !permittedMemberSet.has(safeUpper(m.id))) return;
                const cTeam = resolveTeamName(m.team, businessTeams);
                if (selectedTeamFilter && safeUpper(cTeam) !== safeUpper(selectedTeamFilter)) return;
                if (selectedSponsorFilter) {
                    const motherId = safeUpper(selectedSponsorFilter);
                    const isMotherOrChild = safeUpper(m.id) === motherId || safeUpper(m.referrer) === motherId || safeUpper(m.sponsorId) === motherId;
                    if (!isMotherOrChild) return;
                }

                let levelEarns = {};
                for (let l = 1; l <= 10; l++) levelEarns[`level${l}Earn`] = 0;

                memberMap[safeUpper(m.id)] = {
                    id: m.id, name: m.name, team: cTeam, profileUrl: m.profileUrl || '', details: {},
                    selfBoxes: 0, selfEarn: 0, selfPv: 0, teamBoxes: 0, teamPv: 0, totalPaid: 0, ...levelEarns
                };
            });

            unfoldedSales.forEach(s => {
                if (s.priceType !== 'ราคาเต็ม' && s.priceType !== 'ราคาสมาชิก') return;
                const cleanProdName = (name) => String(name || '').replace(/\(.*?\)/g, '').trim().toUpperCase();
                const target = cleanProdName(s.product);
                const prodConfig = (products || []).find(p => {
                    if (!p) return false;
                    const pName = cleanProdName(p.name);
                    const pId = cleanProdName(p.id);
                    return target === pName || target === pId || pName.includes(target) || target.includes(pName);
                }) || { priceFull: 0, givePv: 0, selfFee: 0, level1Fee: 0 };

                const computePayout = (levelIdx) => {
                    let feePerBox = 0; let feePercent = 0;
                    if (levelIdx === 0) {
                        feePerBox = Number(prodConfig.selfFee || prodConfig.directFee || prodConfig.self_fee || prodConfig.level0Fee || 0);
                        feePercent = s.priceType === 'ราคาสมาชิก' ? Number(prodConfig.selfPercentMember || prodConfig.self_percent_member || 0) : Number(prodConfig.selfPercentFull || prodConfig.self_percent_full || prodConfig.selfPercent || 0);
                    } else if (levelIdx === 1) {
                        feePerBox = Number(prodConfig.level1Fee || prodConfig.uplineFee || prodConfig.level_1_fee || 0);
                        feePercent = s.priceType === 'ราคาสมาชิก' ? Number(prodConfig.level1PercentMember || prodConfig.level_1_percent_member || 0) : Number(prodConfig.level1PercentFull || prodConfig.level_1_percent_full || prodConfig.level1Percent || 0);
                    } else {
                        feePerBox = Number(prodConfig[`level${levelIdx}Fee`] || prodConfig[`level_${levelIdx}_fee`] || 0);
                        feePercent = s.priceType === 'ราคาสมาชิก' ? Number(prodConfig[`level${levelIdx}PercentMember`] || prodConfig[`level_${levelIdx}_percent_member`] || 0) : Number(prodConfig[`level${levelIdx}PercentFull`] || prodConfig[`level_${levelIdx}_percent_full`] || prodConfig[`level${levelIdx}Percent`] || 0);
                    }
                    const itemPrice = s.priceType === 'ราคาสมาชิก' ? Number(prodConfig.priceMember || prodConfig.priceFull || 0) : Number(prodConfig.priceFull || prodConfig.priceMember || 0);
                    const boxEarn = feePerBox * s.qty;
                    const percentEarn = (itemPrice * s.qty) * (feePercent / 100);
                    if (referralCalcMode === 'percent') return percentEarn;
                    if (referralCalcMode === 'combo') return boxEarn + percentEarn;
                    return boxEarn;
                };

                const sellerKey = safeUpper(s.memberId);
                if (memberMap[sellerKey]) {
                    memberMap[sellerKey].selfBoxes += s.qty;
                    memberMap[sellerKey].selfEarn += computePayout(0);
                    memberMap[sellerKey].details[s.product] = (memberMap[sellerKey].details[s.product] || 0) + s.qty;
                }

                let currentMemInfo = (members || []).find(m => safeUpper(m.id) === sellerKey);
                let currentMemberId = currentMemInfo ? (currentMemInfo.referrer || currentMemInfo.sponsorId) : null;
                let currentLevel = 1;
                const maxCommLevels = Math.max(2, Number(systemSettings?.commission_levels ?? 6));
                const maxDownlines = Math.max(1, maxCommLevels - 1);

                while (currentMemberId && currentLevel <= maxDownlines) {
                    let targetKey = safeUpper(currentMemberId);
                    let payAmt = computePayout(currentLevel);
                    if (memberMap[targetKey]) {
                        if (payAmt > 0) memberMap[targetKey][`level${currentLevel}Earn`] += payAmt;
                        memberMap[targetKey].teamBoxes += s.qty;
                    }
                    const memInfo = (members || []).find(m => safeUpper(m.id) === targetKey);
                    currentMemberId = memInfo ? (memInfo.referrer || memInfo.sponsorId) : null;
                    currentLevel++;
                }
            });

            (payoutLogs || []).forEach(log => {
                if (log.status === 'จ่ายปันผลแล้ว' || log.status === 'สำเร็จ' || log.status === 'PAID') {
                    if (log.period_start >= startDate && log.period_end <= endDate) {
                        const mId = safeUpper(log.member_id);
                        if (memberMap[mId]) {
                            memberMap[mId].totalPaid = (memberMap[mId].totalPaid || 0) + Number(log.amount);
                        }
                    }
                }
            });

            const query = (debouncedSearchQuery || '').trim().toUpperCase();

            return Object.values(memberMap)
                .filter(m => {
                    if (m.selfBoxes > 0 || m.teamBoxes > 0 || m.selfEarn > 0) return true;
                    for (let l = 1; l <= 10; l++) if (m[`level${l}Earn`] > 0) return true;
                    return false;
                })
                .map(m => {
                    let sumAll = m.selfEarn;
                    for (let l = 1; l <= 10; l++) sumAll += (m[`level${l}Earn`] || 0);
                    m.grandTotal = sumAll;
                    m.totalPaid = m.totalPaid || 0;
                    m.remainingToPay = Math.max(0, m.grandTotal - m.totalPaid);
                    m.payoutStatus = m.grandTotal === 0 ? '-' : (m.remainingToPay <= 0 ? 'จ่ายปันผลแล้ว' : 'รอปันผล');
                    return m;
                })
                .filter(m => query === '' || m.id.toUpperCase().includes(query) || m.name.toUpperCase().includes(query))
                .sort((a, b) => b.grandTotal - a.grandTotal);
        }, [unfoldedSales, activeGroup, referralCalcMode, selectedTeamFilter, selectedSponsorFilter, members, products, debouncedSearchQuery, permittedMemberSet, businessTeams, payoutLogs, startDate, endDate, systemSettings]);

        const referralDailyPayoutData = useMemo(() => {
            if (activeGroup !== 'referral') return [];
            let dailyMap = {};

            (members || []).forEach(m => {
                if (permittedMemberSet !== null && !permittedMemberSet.has(safeUpper(m.id))) return;
                const cTeam = resolveTeamName(m.team, businessTeams);
                if (selectedTeamFilter && safeUpper(cTeam) !== safeUpper(selectedTeamFilter)) return;
                if (selectedSponsorFilter) {
                    const motherId = safeUpper(selectedSponsorFilter);
                    const isMotherOrChild = safeUpper(m.id) === motherId || safeUpper(m.referrer) === motherId || safeUpper(m.sponsorId) === motherId;
                    if (!isMotherOrChild) return;
                }
            });

            unfoldedSales.forEach(s => {
                if (s.priceType !== 'ราคาเต็ม' && s.priceType !== 'ราคาสมาชิก') return;
                const cleanProdName = (name) => String(name || '').replace(/\(.*?\)/g, '').trim().toUpperCase();
                const target = cleanProdName(s.product);
                const prodConfig = (products || []).find(p => {
                    if (!p) return false;
                    const pName = cleanProdName(p.name);
                    const pId = cleanProdName(p.id);
                    return target === pName || target === pId || pName.includes(target) || target.includes(pName);
                }) || { priceFull: 0, givePv: 0, selfFee: 0, level1Fee: 0 };

                const computePayout = (levelIdx) => {
                    let feePerBox = 0; let feePercent = 0;
                    if (levelIdx === 0) {
                        feePerBox = Number(prodConfig.selfFee || prodConfig.directFee || prodConfig.self_fee || prodConfig.level0Fee || 0);
                        feePercent = s.priceType === 'ราคาสมาชิก' ? Number(prodConfig.selfPercentMember || prodConfig.self_percent_member || 0) : Number(prodConfig.selfPercentFull || prodConfig.self_percent_full || prodConfig.selfPercent || 0);
                    } else if (levelIdx === 1) {
                        feePerBox = Number(prodConfig.level1Fee || prodConfig.uplineFee || prodConfig.level_1_fee || 0);
                        feePercent = s.priceType === 'ราคาสมาชิก' ? Number(prodConfig.level1PercentMember || prodConfig.level_1_percent_member || 0) : Number(prodConfig.level1PercentFull || prodConfig.level_1_percent_full || prodConfig.level1Percent || 0);
                    } else {
                        feePerBox = Number(prodConfig[`level${levelIdx}Fee`] || prodConfig[`level_${levelIdx}_fee`] || 0);
                        feePercent = s.priceType === 'ราคาสมาชิก' ? Number(prodConfig[`level${levelIdx}PercentMember`] || prodConfig[`level_${levelIdx}_percent_member`] || 0) : Number(prodConfig[`level${levelIdx}PercentFull`] || prodConfig[`level_${levelIdx}_percent_full`] || prodConfig[`level${levelIdx}Percent`] || 0);
                    }
                    const itemPrice = s.priceType === 'ราคาสมาชิก' ? Number(prodConfig.priceMember || prodConfig.priceFull || 0) : Number(prodConfig.priceFull || prodConfig.priceMember || 0);
                    const boxEarn = feePerBox * s.qty;
                    const percentEarn = (itemPrice * s.qty) * (feePercent / 100);

                    // 📌 ส่วนต่างราคาเต็ม (เฉพาะผู้ขายตัวเอง levelIdx === 0 และขายราคาเต็ม)
                    let retailMarginEarn = 0;
                    if (levelIdx === 0 && (s.priceType === 'ราคาเต็ม' || !s.priceType)) {
                        const marginAmt = Number(prodConfig.fullMarginAmount || prodConfig.full_margin_amount || 0);
                        const marginCurr = prodConfig.fullMarginCurrency || prodConfig.full_margin_currency || 'LAK';
                        if (marginAmt > 0) {
                            if (marginCurr === 'THB') {
                                retailMarginEarn = currencyMode === 'THB' ? (marginAmt * s.qty) : (marginAmt * s.qty * rate);
                            } else {
                                retailMarginEarn = currencyMode === 'THB' ? (marginAmt * s.qty / rate) : (marginAmt * s.qty);
                            }
                        }
                    }

                    if (referralCalcMode === 'percent') return percentEarn + retailMarginEarn;
                    if (referralCalcMode === 'combo') return boxEarn + percentEarn + retailMarginEarn;
                    return boxEarn + retailMarginEarn;
                };

                const sDate = s.date || '';
                const sellerKey = safeUpper(s.memberId);
                const sellerMem = (members || []).find(m => safeUpper(m.id) === sellerKey);
                const sellerTeam = resolveTeamName(sellerMem?.team, businessTeams);

                const getOrCreateDaily = (mId, mName, mTeam, pDate) => {
                    const key = `${safeUpper(mId)}_${pDate}`;
                    if (!dailyMap[key]) {
                        dailyMap[key] = { key, date: pDate, memberId: mId, memberName: mName, team: mTeam, selfEarn: 0, teamEarn: 0, totalEarn: 0, boxes: 0 };
                    }
                    return dailyMap[key];
                };

                const selfPay = computePayout(0);
                if (selfPay > 0 && sellerMem) {
                    const item = getOrCreateDaily(sellerMem.id, sellerMem.name, sellerTeam, sDate);
                    item.selfEarn += selfPay;
                    item.totalEarn += selfPay;
                    item.boxes += s.qty;
                }

                let currentMemInfo = sellerMem;
                let currentMemberId = currentMemInfo ? (currentMemInfo.referrer || currentMemInfo.sponsorId) : null;
                let currentLevel = 1;
                const maxCommLevels = Math.max(2, Number(systemSettings?.commission_levels ?? 6));
                const maxDownlines = Math.max(1, maxCommLevels - 1);

                while (currentMemberId && currentLevel <= maxDownlines) {
                    let targetKey = safeUpper(currentMemberId);
                    let payAmt = computePayout(currentLevel);
                    let targetMem = (members || []).find(m => safeUpper(m.id) === targetKey);
                    if (payAmt > 0 && targetMem) {
                        const targetTeam = resolveTeamName(targetMem.team, businessTeams);
                        const item = getOrCreateDaily(targetMem.id, targetMem.name, targetTeam, sDate);
                        item.teamEarn += payAmt;
                        item.totalEarn += payAmt;
                    }
                    currentMemberId = targetMem ? (targetMem.referrer || targetMem.sponsorId) : null;
                    currentLevel++;
                }
            });

            // Integrate with payoutLogs
            (payoutLogs || []).forEach(log => {
                if (log.status === 'จ่ายปันผลแล้ว' || log.status === 'สำเร็จ' || log.status === 'PAID') {
                    const key = log.payout_id || `${safeUpper(log.member_id)}_${log.payout_date}`;
                    if (dailyMap[key]) {
                        dailyMap[key].status = 'PAID';
                        dailyMap[key].paidAt = log.paid_at || log.created_at;
                        dailyMap[key].paidBy = log.paid_by || log.member_name || 'แอดมิน';
                    }
                }
            });

            const query = (debouncedSearchQuery || '').trim().toUpperCase();

            return Object.values(dailyMap)
                .map(item => {
                    const record = paidRecords[item.key];
                    const isPaid = item.status === 'PAID' || (record && record.status === 'PAID');
                    return { ...item, status: isPaid ? 'PAID' : 'PENDING', paidAt: item.paidAt || record?.paidAt || null, paidBy: item.paidBy || record?.paidBy || null };
                })
                .filter(item => {
                    if (permittedMemberSet !== null && !permittedMemberSet.has(safeUpper(item.memberId))) return false;
                    if (selectedTeamFilter && safeUpper(item.team) !== safeUpper(selectedTeamFilter)) return false;
                    if (payoutStatusFilter !== 'ALL' && item.status !== payoutStatusFilter) return false;
                    if (query !== '' && !item.memberId.toUpperCase().includes(query) && !item.memberName.toUpperCase().includes(query)) return false;
                    return item.totalEarn > 0;
                })
                .sort((a, b) => b.date.localeCompare(a.date) || b.totalEarn - a.totalEarn);
        }, [unfoldedSales, activeGroup, referralCalcMode, selectedTeamFilter, selectedSponsorFilter, members, products, debouncedSearchQuery, permittedMemberSet, businessTeams, payoutLogs, paidRecords, payoutStatusFilter, systemSettings]);

        const activeLevelCols = useMemo(() => {
            const maxCommLevels = Math.max(2, Number(systemSettings?.commission_levels ?? 6));
            const maxDownlines = Math.max(1, maxCommLevels - 1);
            let activeLevels = [];
            for (let l = 1; l <= maxDownlines; l++) {
                const sum = referralReportData.reduce((acc, r) => acc + (r[`level${l}Earn`] || 0), 0);
                activeLevels.push({ level: l, total: sum });
            }
            return activeLevels;
        }, [referralReportData, systemSettings]);

        const referralTotals = useMemo(() => {
            let Self = 0, grandTotal = 0, totalPaid = 0, totalRemaining = 0;
            let levelTotals = {};
            for (let l = 1; l <= 10; l++) levelTotals[`L${l}`] = 0;

            referralReportData.forEach(r => {
                Self += r.selfEarn;
                grandTotal += r.grandTotal;
                totalPaid += r.totalPaid;
                totalRemaining += r.remainingToPay;
                for (let l = 1; l <= 10; l++) levelTotals[`L${l}`] += (r[`level${l}Earn`] || 0);
            });

            return { Self, levelTotals, grandTotal, totalPaid, totalRemaining };
        }, [referralReportData]);

        const selectedEarnerDetails = useMemo(() => {
            if (!detailModalEarner) return [];
            let details = [];
            let memberMap = {};
            (members || []).forEach(m => { memberMap[safeUpper(m.id)] = { ...m }; });

            unfoldedSales.forEach(s => {
                if (s.priceType !== 'ราคาเต็ม' && s.priceType !== 'ราคาสมาชิก') return;
                const cleanProdName = (name) => String(name || '').replace(/\(.*?\)/g, '').trim().toUpperCase();
                const target = cleanProdName(s.product);
                const prodConfig = (products || []).find(p => {
                    if (!p) return false;
                    const pName = cleanProdName(p.name);
                    const pId = cleanProdName(p.id);
                    return target === pName || target === pId || pName.includes(target) || target.includes(pName);
                }) || { priceFull: 0, givePv: 0, selfFee: 0, level1Fee: 0 };

                const computePayout = (levelIdx) => {
                    let feePerBox = 0;
                    let feePercent = 0;

                    if (levelIdx === 0) {
                        feePerBox = Number(prodConfig.selfFee || prodConfig.directFee || prodConfig.self_fee || prodConfig.level0Fee || 0);
                        feePercent = s.priceType === 'ราคาสมาชิก' 
                            ? Number(prodConfig.selfPercentMember || prodConfig.self_percent_member || 0)
                            : Number(prodConfig.selfPercentFull || prodConfig.self_percent_full || prodConfig.selfPercent || 0);
                    } else if (levelIdx === 1) {
                        feePerBox = Number(prodConfig.level1Fee || prodConfig.uplineFee || prodConfig.level_1_fee || 0);
                        feePercent = s.priceType === 'ราคาสมาชิก'
                            ? Number(prodConfig.level1PercentMember || prodConfig.level_1_percent_member || 0)
                            : Number(prodConfig.level1PercentFull || prodConfig.level_1_percent_full || prodConfig.level1Percent || 0);
                    } else {
                        feePerBox = Number(prodConfig[`level${levelIdx}Fee`] || prodConfig[`level_${levelIdx}_fee`] || 0);
                        feePercent = s.priceType === 'ราคาสมาชิก'
                            ? Number(prodConfig[`level${levelIdx}PercentMember`] || prodConfig[`level_${levelIdx}_percent_member`] || 0)
                            : Number(prodConfig[`level${levelIdx}PercentFull`] || prodConfig[`level_${levelIdx}_percent_full`] || prodConfig[`level${levelIdx}Percent`] || 0);
                    }

                    const itemPrice = s.priceType === 'ราคาสมาชิก' 
                        ? Number(prodConfig.priceMember || prodConfig.priceFull || 0) 
                        : Number(prodConfig.priceFull || prodConfig.priceMember || 0);
                    const boxEarn = feePerBox * s.qty;
                    const percentEarn = (itemPrice * s.qty) * (feePercent / 100);

                    if (referralCalcMode === 'percent') return { earn: percentEarn, rateStr: `${feePercent}%` };
                    if (referralCalcMode === 'combo') return { earn: boxEarn + percentEarn, rateStr: `@${feePerBox.toLocaleString()} + ${feePercent}%` };
                    return { earn: boxEarn, rateStr: `@${feePerBox.toLocaleString()}` };
                };

                const earnerId = safeUpper(detailModalEarner.id);

                if (safeUpper(s.memberId) === earnerId) {
                    const res = computePayout(0);
                    if (res.earn > 0) {
                        details.push({
                            date: s.date, billId: s.billId, sellerId: s.memberId, sellerName: s.memberName, product: s.product, qty: s.qty, level: 'ขายเอง (ข้างกล่อง)', feeRateStr: res.rateStr, totalEarned: res.earn
                        });
                    }
                }

                let currentMemInfo = memberMap[safeUpper(s.memberId)];
                let currentMemberId = currentMemInfo ? (currentMemInfo.referrer || currentMemInfo.sponsorId) : null;
                let currentLevel = 1;

                const maxCommLevels = Math.max(2, Number(systemSettings?.commission_levels ?? 6));
                const maxDownlines = Math.max(1, maxCommLevels - 1);
                while (currentMemberId && currentLevel <= maxDownlines) {
                    let targetKey = safeUpper(currentMemberId);
                    const res = computePayout(currentLevel);

                    if (res.earn > 0 && targetKey === earnerId) {
                        details.push({
                            date: s.date, billId: s.billId, sellerId: s.memberId, sellerName: s.memberName, product: s.product, qty: s.qty, level: `ชั้นที่ ${currentLevel}`, feeRateStr: res.rateStr, totalEarned: res.earn
                        });
                    }
                    const memInfo = memberMap[targetKey];
                    currentMemberId = memInfo ? (memInfo.referrer || memInfo.sponsorId) : null;
                    currentLevel++;
                }
            });

            return details.sort((a, b) => b.date.localeCompare(a.date) || b.billId.localeCompare(a.billId));
        }, [unfoldedSales, detailModalEarner, members, products, referralCalcMode, systemSettings]);

        const handleExportModalExcel = () => {
            if (!detailModalEarner || selectedEarnerDetails.length === 0) return;
            const headers = ["วันที่", "เลขที่บิล", "ประเภทได้รับ", "รหัสผู้ขาย", "ชื่อผู้ขายบิลนี้", "สินค้าที่ขายได้", "จำนวน (กล่อง)", "เรทคำนวณ", `เงินที่ได้ (${getCurrencySuffix()})`];
            const rows = [headers];
            selectedEarnerDetails.forEach(d => {
                rows.push([d.date, d.billId, d.level, d.sellerId, d.sellerName, d.product, d.qty, d.feeRateStr, d.totalEarned]);
            });
            window.exportToCSV(`STK_Commission_Detail_${detailModalEarner.id}_${detailModalEarner.name}_${startDate}_to_${endDate}.csv`, rows);
        };

        const thBase = "p-4 text-[13px] font-bold border-b border-slate-200 bg-slate-50 text-slate-700 whitespace-nowrap uppercase tracking-wide";
        const groupTitles = { sales: '📊 รายงานสรุปยอดขายและพนักงาน', finance: '💰 รายงานการเงินและรายรับบริษัท', stock: '📦 รายงานสต๊อกสินค้าและสินค้าตัดศูนย์', referral: '🎁 รายงานสรุปค่าแนะนำและปันผล' };

        return (
            <div className="space-y-6 animation-fade-in w-full">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-200 pb-4 no-print">
                    <div>
                        <h2 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-3">
                            {groupTitles[activeGroup] || '📊 รายงานสรุปผลงาน'}
                        </h2>
                    </div>
                    <div className="flex items-center gap-2 bg-slate-100 p-1 rounded-xl border border-slate-200">
                        <span className="text-xs font-bold text-slate-500 pl-2">แสดงผลสกุลเงิน:</span>
                        <button
                            type="button"
                            onClick={() => setCurrencyMode('THB')}
                            className={`px-3 py-1.5 rounded-lg text-xs font-black transition-all ${currencyMode === 'THB' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-200'}`}
                        >
                            🇹🇭 เงินบาท (THB)
                        </button>
                        <button
                            type="button"
                            onClick={() => setCurrencyMode('LAK')}
                            className={`px-3 py-1.5 rounded-lg text-xs font-black transition-all ${currencyMode === 'LAK' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-200'}`}
                        >
                            🇱🇦 เงินกีบ (LAK)
                        </button>
                    </div>
                </div>

                <div className="flex flex-wrap gap-2 pb-2 w-full border-b border-slate-200 no-print">
                    {activeGroup === 'sales' && (
                        <React.Fragment>
                            <SubTabButton id="sales_member_day" label="ยอดบุคคล (วัน)" activeTab={subTab} setSubTab={setSubTab} />
                            <SubTabButton id="sales_member_month" label="ยอดบุคคล (เดือน)" activeTab={subTab} setSubTab={setSubTab} />
                            <SubTabButton id="total_member_day" label="รวมยอดบุคคล (วัน)" activeTab={subTab} setSubTab={setSubTab} />
                            <SubTabButton id="total_member_month" label="รวมยอดบุคคล (เดือน)" activeTab={subTab} setSubTab={setSubTab} />
                            <SubTabButton id="total_team_day" label="ยอดทีม (วัน)" activeTab={subTab} setSubTab={setSubTab} />
                            <SubTabButton id="total_team_month" label="ยอดทีม (เดือน)" activeTab={subTab} setSubTab={setSubTab} />
                            <SubTabButton id="sales_by_cust_type" label="📊 ตามประเภทลูกค้า" activeTab={subTab} setSubTab={setSubTab} isData={true} />
                            <SubTabButton id="ranking" label="🏆 จัดอันดับ (Ranking)" activeTab={subTab} setSubTab={setSubTab} isSpecial={true} />
                        </React.Fragment>
                    )}
                    {activeGroup === 'finance' && (
                        <React.Fragment>
                            <SubTabButton id="finance_summary" label="💵 สรุปรายรับบริษัท (รายวัน/เดือน)" activeTab={subTab} setSubTab={setSubTab} />
                            <SubTabButton id="finance_detail" label="📜 รายละเอียดรับเงินแยกตามบิล" activeTab={subTab} setSubTab={setSubTab} isData={true} />
                        </React.Fragment>
                    )}
                    {activeGroup === 'stock' && (
                        <React.Fragment>
                            <SubTabButton id="stock_sales_by_product" label="📦 สรุปยอดขายแยกตามสินค้า" activeTab={subTab} setSubTab={setSubTab} />
                            <SubTabButton id="stock_zero_promo" label="⚠️ รายงานสินค้าตัดศูนย์ (แถม/สูญ)" activeTab={subTab} setSubTab={setSubTab} isSpecial={true} />
                            <SubTabButton id="stock_balance" label="📊 รายงานสต๊อกคงเหลือ" activeTab={subTab} setSubTab={setSubTab} isData={true} />
                        </React.Fragment>
                    )}
                    {activeGroup === 'referral' && (
                        <React.Fragment>
                            <SubTabButton id="referral_fee" label="🎁 สรุปค่าแนะนำรวม" activeTab={subTab} setSubTab={setSubTab} isSpecial={true} />
                            <SubTabButton id="referral_payout" label="💵 จัดการจ่ายปันผลรายวัน" activeTab={subTab} setSubTab={setSubTab} isData={true} />
                        </React.Fragment>
                    )}
                </div>

                <div className={`${boxWrapper} py-4`}>
                    <div className="flex flex-col md:flex-row flex-wrap items-start md:items-end gap-4">
                        <div><label className={labelClassHud}>ตั้งแต่วันที่</label><input type="date" className={inputClassHud} value={startDate} onChange={e => setStartDate(e.target.value)} /></div>
                        <div><label className={labelClassHud}>ถึงวันที่</label><input type="date" className={inputClassHud} value={endDate} onChange={e => setEndDate(e.target.value)} /></div>
                        
                        {activeGroup === 'referral' && (
                            <div>
                                <label className={labelClassHud}>ค้นหาตามสังกัดทีม</label>
                                <select className={inputClassHud} value={selectedTeamFilter} onChange={e => setSelectedTeamFilter(e.target.value)}>
                                    <option value="">ทุกทีมทั้งหมด</option>
                                    {distinctTeams.map(t => <option key={t} value={t}>{t}</option>)}
                                </select>
                            </div>
                        )}
                        {activeGroup === 'referral' && (
                            <div>
                                <label className={labelClassHud}>ค้นหาตามสายงาน</label>
                                <select className={inputClassHud} value={selectedSponsorFilter} onChange={e => setSelectedSponsorFilter(e.target.value)}>
                                    <option value="">ทุกสายงานแม่ทีม</option>
                                    {uplineLeadersList.map(l => <option key={l.id} value={l.id}>{l.name} ({l.id})</option>)}
                                </select>
                            </div>
                        )}
                        <div className="w-full md:w-auto md:pl-4 md:border-l border-slate-200 flex-1 md:min-w-[200px]">
                            <label className={labelClassHud}>พิมพ์ค้นหาข้อมูล</label>
                            <div className="flex items-center bg-slate-50/30 focus-within:bg-white border border-slate-200 rounded-xl px-3 shadow-sm focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-100 transition-all duration-300 w-full h-[38px] sm:h-[40px]">
                                <SearchIcon size={18} className="text-slate-400 shrink-0" />
                                <input type="text" placeholder="พิมพ์ชื่อ/รหัส..." className="w-full bg-transparent border-none outline-none text-[13px] font-medium text-slate-800 placeholder-slate-400 pl-2 h-full" value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                            </div>
                        </div>
                    </div>
                </div>

                {/* 📌 ส่วนแสดงผลสำหรับกลุ่ม "ยอดขาย & พนักงาน" (activeGroup === 'sales') */}
                {activeGroup === 'sales' && (() => {
                    const isMonthly = subTab.includes('month');
                    const isTotalOnly = subTab.includes('total_');
                    const isTeamView = subTab.includes('team');
                    const isRanking = subTab === 'ranking';
                    const isCustTypeView = subTab === 'sales_by_cust_type';

                    const salesReportData = (() => {
                        if (isRanking) return [];
                        let grouped = {};
                        
                        unfoldedSales.forEach(s => {
                            if (isTotalOnly && s.priceType !== 'ราคาเต็ม' && s.priceType !== 'ราคาสมาชิก') return;
                            const query = (debouncedSearchQuery || searchQuery || '').trim().toUpperCase();
                            if (query !== '') {

                                else { if (!(s.memberId || '').toUpperCase().includes(query) && !(s.memberName || '').toUpperCase().includes(query)) return; }
                            }

                            let key = ''; let label2 = ''; let subLabel2 = '';

                            else if (isCustTypeView) { key = `${period}_${s.custType}_${s.memberId}`; label2 = s.custType; subLabel2 = `${s.memberName} (${s.memberId})`; }
                            else { key = `${period}_${s.memberId}`; label2 = s.memberId; subLabel2 = s.memberName; }

                            if (!grouped[key]) grouped[key] = { label1: period, label2, subLabel2, total: 0, detailsFull: {}, detailsMember: {}, detailsPro: {}, detailsZero: {} };
                            
                            grouped[key].total += s.qty;
                            if (s.priceType === 'ราคาเต็ม') grouped[key].detailsFull[s.product] = (grouped[key].detailsFull[s.product] || 0) + s.qty;
                            else if (s.priceType === 'ราคาสมาชิก') grouped[key].detailsMember[s.product] = (grouped[key].detailsMember[s.product] || 0) + s.qty;

                            else if (s.priceType === 'ราคาศูนย์') grouped[key].detailsZero[s.product] = (grouped[key].detailsZero[s.product] || 0) + s.qty;
                        });
                        
                        return Object.values(grouped).sort((a, b) => b.total - a.total);

                            else if (s.priceType === 'ราคาศูนย์') { pTotals.zero[p] = (pTotals.zero[p] || 0) + qty; mTotals.zero[mName] = (mTotals.zero[mName] || 0) + qty; }

                            if (!productSellers[p]) productSellers[p] = {};
                            if (!productSellers[p][mName]) productSellers[p][mName] = { total: 0, full: 0, member: 0, pro: 0, zero: 0 };

                            if (s.priceType === 'ราคาเต็ม') productSellers[p][mName].full += qty;
                            else if (s.priceType === 'ราคาสมาชิก') productSellers[p][mName].member += qty;
                            else if (s.priceType === 'ราคาโปร' || s.priceType === 'โปรโมชั่น') productSellers[p][mName].pro += qty;

                        });

                        const sortEntries = (obj) => Object.entries(obj).filter(([_, qty]) => qty > 0).sort((a, b) => b[1] - a[1]);
                        const topProductSellers = {};
                        Object.keys(productSellers).forEach(p => { topProductSellers[p] = Object.entries(productSellers[p]).filter(([_, data]) => data.total > 0).sort((a, b) => b[1].total - a[1].total); });

                        return { products: { full: sortEntries(pTotals.full), member: sortEntries(pTotals.member), pro: sortEntries(pTotals.pro), zero: sortEntries(pTotals.zero) }, members: { full: sortEntries(mTotals.full), member: sortEntries(mTotals.member), pro: sortEntries(mTotals.pro), zero: sortEntries(mTotals.zero) }, topSellersByProduct: topProductSellers };
                    })();

                            Object.values(row.detailsPro).forEach(v => sumPro += v);
                            Object.values(row.detailsZero).forEach(v => sumZero += v);

                                                    <div className="font-black text-xl text-slate-300">{reportTotals.sumZero}</div>

                                                </td>
                                                <td className="p-4 align-middle text-center bg-blue-950">
                                                    <div className="font-black text-3xl text-blue-300">{reportTotals.sumTotal}</div>
                                                    <div className="text-[11px] font-black text-blue-400 uppercase tracking-widest mt-0.5">TOTAL</div>
                                                </td>
                                            </tr>
                                        </tfoot>
                                    )}
                                </table>
                            </div>
                        </div>
                    );
                })()}

                {/* 📌 ส่วนแสดงผลสำหรับกลุ่ม "การเงิน & รายรับ" (activeGroup === 'finance') */}
                {activeGroup === 'finance' && (() => {
                    const isDetailView = subTab === 'finance_detail';

                    // สรุปยอดขายตามบิล
                    const financeBills = sales.filter(s => {
                        if (!s || (s.date || '') < startDate || (s.date || '') > endDate) return false;
                        if (permittedMemberSet !== null && !permittedMemberSet.has(safeUpper(s.memberId))) return false;
                        const query = (debouncedSearchQuery || searchQuery || '').trim().toUpperCase();
                        if (query !== '') {
                            const mName = (s.memberName || '').toUpperCase();
                            const mId = (s.memberId || '').toUpperCase();
                            const cName = (s.customerName || '').toUpperCase();
                            const bId = (s.id || '').toUpperCase();
                            if (!mName.includes(query) && !mId.includes(query) && !cName.includes(query) && !bId.includes(query)) return false;
                        }
                        return true;
                    });

                    // สรุปยอดการเงินรวม Cards
                    const financeKpi = (() => {
                        let grandRevenue = 0, fullBoxes = 0, memberBoxes = 0, proBoxes = 0, zeroBoxes = 0, totalBills = financeBills.length;
                        financeBills.forEach(s => {
                            grandRevenue += Number(s['ยอดขายรวม'] || s.total_amount || 0);
                            fullBoxes += Number(s['รวมชิ้นราคาเต็ม'] || 0);
                            memberBoxes += Number(s['รวมชิ้นราคาสมาชิก'] || 0);
                            proBoxes += Number(s['รวมชิ้นราคาโปร'] || 0);
                            zeroBoxes += Number(s['รวมชิ้นราคาศูนย์'] || 0);
                        });
                        return { grandRevenue, fullBoxes, memberBoxes, proBoxes, zeroBoxes, totalBills };
                    })();

                    // สรุปรายเดือน/รายวัน (Summary View)
                    const financeSummaryData = (() => {
                        let grouped = {};
                        financeBills.forEach(s => {
                            const monthKey = (s.date || '').substring(0, 7);
                            if (!grouped[monthKey]) {
                                grouped[monthKey] = { period: monthKey, billsCount: 0, fullBoxes: 0, memberBoxes: 0, proBoxes: 0, zeroBoxes: 0, revenue: 0 };
                            }
                            grouped[monthKey].billsCount += 1;
                            grouped[monthKey].fullBoxes += Number(s['รวมชิ้นราคาเต็ม'] || 0);
                            grouped[monthKey].memberBoxes += Number(s['รวมชิ้นราคาสมาชิก'] || 0);
                            grouped[monthKey].proBoxes += Number(s['รวมชิ้นราคาโปร'] || 0);
                            grouped[monthKey].zeroBoxes += Number(s['รวมชิ้นราคาศูนย์'] || 0);
                            grouped[monthKey].revenue += Number(s['ยอดขายรวม'] || s.total_amount || 0);
                        });
                        return Object.values(grouped).sort((a, b) => b.period.localeCompare(a.period));
                    })();

                    return (
                        <div className="space-y-6 animation-fade-in">
