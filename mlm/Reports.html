                                                {rankingsData?.members?.zero?.length > 0 ? rankingsData.members.zero.map(([m, q], i) => (
                                                    <li key={m} className="flex justify-between items-center text-xs">
                                                        <div className="flex items-center gap-2"><span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black ${i===0?'bg-yellow-400 text-yellow-900':i===1?'bg-slate-200 text-slate-700':i===2?'bg-orange-500 text-white':'bg-slate-100 text-slate-500'}`}>{i+1}</span><span className="font-bold text-slate-700">{m}</span></div>
                                                        <span className="font-black text-slate-500">{q} <span className="text-[10px] font-normal text-slate-400">กล่อง</span></span>
                                                    </li>
                                                )) : <li className="text-xs text-slate-400 py-3 text-center">ไม่มีข้อมูล</li>}
                                            </ul>
                                        </div>
                                    </div>
                                </div>

                                <hr className="border-slate-200" />

                                <div>
                                    <h4 className="font-bold text-slate-800 mb-5 flex items-center gap-2"><span className="text-2xl">🔥</span> พนักงานขายยอดเยี่ยมแยกตามสินค้า</h4>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        {rankingsData?.topSellersByProduct && Object.entries(rankingsData.topSellersByProduct).map(([p, sellers]) => (
                                            <div key={p} className="bg-white rounded-2xl p-4 shadow-sm border border-fuchsia-100">
                                                <h5 className="font-bold text-fuchsia-700 mb-3 border-b border-fuchsia-100 pb-2 flex justify-between items-center text-xs"><span className="truncate pr-2">{p}</span><span className="text-[10px] bg-fuchsia-50 border border-fuchsia-200 px-2 py-0.5 rounded-md text-fuchsia-700">{sellers.length} คน</span></h5>
                                                <ul className="space-y-2">
                                                    {sellers.slice(0, 5).map(([mName, data], i) => (
                                                        <li key={mName} className="flex justify-between items-center text-xs">
                                                            <div className="flex items-center gap-2 min-w-0 pr-2"><span className={`w-5 h-5 shrink-0 rounded-full flex items-center justify-center text-[10px] font-black ${i===0?'bg-yellow-400 text-yellow-900':i===1?'bg-slate-200 text-slate-700':i===2?'bg-orange-500 text-white':'bg-slate-100 text-slate-500'}`}>{i+1}</span><span className="font-bold text-slate-700 truncate">{mName}</span></div>
                                                            <span className="font-black text-fuchsia-600">{data.total} <span className="text-[10px] font-normal text-fuchsia-500">กล่อง</span></span>
                                                        </li>
                                                    ))}
                                                    {sellers.length === 0 && <li className="text-xs text-slate-400 py-3 text-center">ไม่มีข้อมูล</li>}
                                                </ul>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        );
                    }

                    if (subTab === 'ranking_closers') {
                        // 🎯 คำนวณอันดับผู้ปิดการขาย (Closers Ranking Data)
                        const closersData = (() => {
                            let map = {};
                            
                            // Initialize with registered closers if available
                            (closers || []).forEach(cl => {
                                if (!cl || !cl.name) return;
                                const cName = String(cl.name).trim();
                                const cKey = cName.toUpperCase();
                                const rawTeam = String(cl.team || '').trim();
                                let resolvedTeam = 'Marketing';
                                if (rawTeam.toLowerCase().includes('center') || cName.toLowerCase().includes('dr.') || cName.toLowerCase().includes('หมอ')) {
                                    resolvedTeam = 'Center';
                                } else if (rawTeam) {
                                    resolvedTeam = rawTeam;
                                }

                                map[cKey] = {
                                    key: cKey,
                                    name: cName,
                                    code: cl.code || cl.id || '-',
                                    team: resolvedTeam,
                                    casesCount: 0,
                                    fullBoxes: 0,
                                    memberBoxes: 0,
                                    proBoxes: 0,
                                    zeroBoxes: 0,
                                    totalBoxes: 0,
                                    totalAmountLak: 0,
                                    totalAmountThb: 0
                                };
                            });

                            // Aggregate from dateFilteredSales
                            (sales || []).forEach(record => {
                                const sDate = record.date || record.sale_date || '';
                                if (!record || sDate < startDate || sDate > endDate) return;

                                // 📌 Find closer info from customer or sale record
                                const cust = (customers || []).find(c => c && (
                                    c.id === record.customerId || 
                                    (c.customer_id && c.customer_id === record.customerId) ||
                                    (c.hn && c.hn === record.customerId)
                                ));

                                let closerName = String(record.closer || record.closer_id || (cust ? (cust.closer || cust.closer_id) : '') || '').trim();
                                if (!closerName) return;

                                const closerKey = closerName.toUpperCase();
                                if (!map[closerKey]) {
                                    // Match against registered closers list by name or code
                                    const closerObj = (closers || []).find(cl => cl && (
                                        safeUpper(cl.name) === closerKey || 
                                        safeUpper(cl.code) === closerKey || 
                                        safeUpper(cl.id) === closerKey ||
                                        closerKey.includes(safeUpper(cl.name)) ||
                                        safeUpper(cl.name).includes(closerKey)
                                    ));

                                    let resolvedTeam = closerObj?.team || cust?.closerTeam || '';
                                    if (!resolvedTeam) {
                                        if (closerKey.includes('DR.') || closerKey.includes('หมอ') || closerKey.includes('CENTER')) {
                                            resolvedTeam = 'Center';
                                        } else {
                                            resolvedTeam = 'Marketing';
                                        }
                                    } else if (resolvedTeam.toLowerCase().includes('center')) {
                                        resolvedTeam = 'Center';
                                    }

                                    map[closerKey] = {
                                        key: closerKey,
                                        name: closerObj ? closerObj.name : closerName,
                                        code: closerObj?.code || closerObj?.id || '-',
                                        team: resolvedTeam,
                                        casesCount: 0,
                                        fullBoxes: 0,
                                        memberBoxes: 0,
                                        proBoxes: 0,
                                        zeroBoxes: 0,
                                        totalBoxes: 0,
                                        totalAmountLak: 0,
                                        totalAmountThb: 0
                                    };
                                }

                                map[closerKey].casesCount += 1;

                                // Parse item quantities
                                let rawItems = [];
                                if (record.items_json) {
                                    try { rawItems = typeof record.items_json === 'string' ? JSON.parse(record.items_json) : record.items_json; } catch(e){}
                                }

                                if (Array.isArray(rawItems) && rawItems.length > 0) {
                                    rawItems.forEach(it => {
                                        const q = Number(it.qty || it.quantity || 1);
                                        const pType = String(it.type || '').trim();
                                        if (q > 0) {
                                            map[closerKey].totalBoxes += q;
                                            if (pType === 'ราคาเต็ม') map[closerKey].fullBoxes += q;
                                            else if (pType === 'ราคาสมาชิก') map[closerKey].memberBoxes += q;
                                            else if (pType === 'ราคาโปร' || pType === 'โปรโมชั่น') map[closerKey].proBoxes += q;
                                            else if (pType === 'ราคาศูนย์') map[closerKey].zeroBoxes += q;
                                            else map[closerKey].memberBoxes += q;
                                        }
                                    });
                                } else {
                                    const f = Number(record['รวมชิ้นราคาเต็ม'] || 0);
                                    const m = Number(record['รวมชิ้นราคาสมาชิก'] || 0);
                                    const p = Number(record['รวมชิ้นราคาโปร'] || 0);
                                    const z = Number(record['รวมชิ้นราคาศูนย์'] || 0);
                                    map[closerKey].fullBoxes += f;
                                    map[closerKey].memberBoxes += m;
                                    map[closerKey].proBoxes += p;
                                    map[closerKey].zeroBoxes += z;
                                    map[closerKey].totalBoxes += (f + m + p + z);
                                }

                                const { lakAmt, thbAmt } = parseSaleCurrencyAmounts(record, exchangeRate);
                                map[closerKey].totalAmountLak += lakAmt;
                                map[closerKey].totalAmountThb += thbAmt;
                            });

                            // Filter by search query
                            const query = (debouncedSearchQuery || searchQuery || '').trim().toUpperCase();
                            return Object.values(map).filter(cl => {
                                if (cl.casesCount === 0 && cl.totalBoxes === 0) return false;
                                if (query && !cl.name.toUpperCase().includes(query) && !cl.code.toUpperCase().includes(query) && !cl.team.toUpperCase().includes(query)) return false;
                                return true;
                            }).sort((a, b) => b.totalBoxes - a.totalBoxes || b.casesCount - a.casesCount);
                        })();

                        // 🏷️ แยกเป็น 2 ทีม: ทีม Marketing และ ทีม Center (คุณหมอ / เจ้าหน้าที่ Center)
                        const marketingClosers = closersData.filter(c => {
                            const t = String(c.team || '').toUpperCase();
                            return !t.includes('CENTER') && !c.name.toUpperCase().includes('DR.') && !c.name.includes('หมอ');
                        });

                        const centerClosers = closersData.filter(c => {
                            const t = String(c.team || '').toUpperCase();
                            return t.includes('CENTER') || c.name.toUpperCase().includes('DR.') || c.name.includes('หมอ');
                        });

                        const calcTotals = (list) => list.reduce((acc, row) => {
                            acc.cases += row.casesCount;
                            acc.boxes += row.totalBoxes;
                            acc.pro += row.proBoxes;
                            acc.full += row.fullBoxes;
                            acc.member += row.memberBoxes;
                            acc.zero += row.zeroBoxes;
                            acc.lak += row.totalAmountLak;
                            acc.thb += row.totalAmountThb;
                            return acc;
                        }, { cases: 0, boxes: 0, pro: 0, full: 0, member: 0, zero: 0, lak: 0, thb: 0 });

                        const closerTotals = calcTotals(closersData);
                        const marketingTotals = calcTotals(marketingClosers);
                        const centerTotals = calcTotals(centerClosers);

                        const handleExportClosersExcel = (list, title = 'closers_ranking') => {
                            const rows = [
                                ['อันดับ', 'ชื่อผู้ปิดการขาย', 'รหัส', 'ทีม', 'จำนวนเคสที่ปิด', 'รวมกล่องทั้งหมด', 'ราคาโปร (กล่อง)', 'ราคาเต็ม (กล่อง)', 'ราคาสมาชิก (กล่อง)', 'ราคาศูนย์ (กล่อง)', 'ยอดเงินรวม (กีบ)', 'ยอดเงินรวม (บาท)']
                            ];
                            const tTotals = calcTotals(list);
                            list.forEach((r, idx) => {
                                rows.push([
                                    idx + 1, r.name, r.code, r.team, r.casesCount, r.totalBoxes, r.proBoxes, r.fullBoxes, r.memberBoxes, r.zeroBoxes, r.totalAmountLak, r.totalAmountThb
                                ]);
                            });
                            rows.push(['', 'รวมสุทธิ', '', '', tTotals.cases, tTotals.boxes, tTotals.pro, tTotals.full, tTotals.member, tTotals.zero, tTotals.lak, tTotals.thb]);
                            if (typeof window.exportToCSV === 'function') {
                                window.exportToCSV(rows, `${title}_${getLocalISODate()}.csv`);
                            }
                        };

                        // 🎨 Sub-component: ฟังก์ชั่นแสดงตารางของแต่ละทีม
                        const renderCloserTable = (list, totals, teamName, teamIcon, badgeColor, borderColor) => (
                            <div className={`${boxWrapper} p-0 overflow-hidden border ${borderColor} shadow-sm`}>
                                <div className="p-4 bg-slate-50/80 border-b border-slate-200 flex flex-wrap justify-between items-center gap-3">
                                    <div className="flex items-center gap-2.5">
                                        <span className="text-2xl">{teamIcon}</span>
                                        <div>
                                            <div className="flex items-center gap-2">
                                                <h3 className="text-base font-black text-slate-800">{teamName}</h3>
                                                <span className={`px-2 py-0.5 rounded-full text-xs font-black ${badgeColor}`}>
                                                    {list.length} คน
                                                </span>
                                            </div>
                                            <p className="text-xs text-slate-500 font-bold mt-0.5">
                                                รวมปิดได้ {totals.cases.toLocaleString()} เคส | รวม {totals.boxes.toLocaleString()} กล่อง | ฿{(Math.round((totals.thb + (totals.lak / exchangeRate)) * 100) / 100).toLocaleString(undefined, {minimumFractionDigits: 2})}
                                            </p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2 no-print">
                                        <button 
                                            type="button" 
                                            onClick={() => handleExportClosersExcel(list, teamName.replace(/\s+/g, '_'))} 
                                            className="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm flex items-center gap-1.5 transition-colors"
                                        >
                                            <Archive size={13}/> Export
                                        </button>
                                    </div>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse min-w-[1000px]">
                                        <thead>
                                            <tr className="bg-slate-100/90 border-b border-slate-200 text-xs font-bold text-slate-700">
                                                <th className={`${thBase} text-center w-16`}>อันดับ</th>
                                                <th className={thBase}>ผู้ปิดการขาย</th>
                                                <th className={`${thBase} text-center`}>ทีมสังกัด</th>
                                                <th className={`${thBase} text-center bg-indigo-50/50 text-indigo-800`}>จำนวนเคสที่ปิด</th>
                                                <th className={`${thBase} text-center bg-blue-50/60 text-blue-900 font-black`}>รวมทั้งหมด (กล่อง)</th>
                                                <th className={`${thBase} text-center bg-amber-50/40 text-amber-700`}>🎁 ราคาโปร</th>
                                                <th className={`${thBase} text-center bg-emerald-50/40 text-emerald-700`}>💎 ราคาเต็ม</th>
                                                <th className={`${thBase} text-center bg-blue-50/40 text-blue-700`}>👥 ราคาสมาชิก</th>
                                                <th className={`${thBase} text-center bg-slate-100 text-slate-600`}>🏷️ ราคาศูนย์</th>
                                                <th className={`${thBase} text-right text-slate-700`}>ยอดเงินรวม</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 text-xs font-bold">
                                            {list.map((r, idx) => {
                                                const rankMedal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : idx + 1;
                                                const isMkt = (r.team || '').toUpperCase().includes('MARKETING');
                                                return (
                                                    <tr key={r.key || idx} className="hover:bg-blue-50/30 transition-colors">
                                                        <td className="p-4 text-center font-black text-sm text-slate-700">
                                                            {rankMedal}
                                                        </td>
                                                        <td className="p-4">
                                                            <div className="font-black text-slate-900 text-sm">{r.name}</div>
                                                            {r.code && r.code !== '-' && <div className="text-[10px] text-slate-400 font-mono">รหัส: {r.code}</div>}
                                                        </td>
                                                        <td className="p-4 text-center">
                                                            <span className={`px-2.5 py-1 rounded-full text-[11px] font-black border ${
                                                                isMkt 
                                                                    ? 'bg-rose-50 text-rose-700 border-rose-200' 
                                                                    : 'bg-emerald-50 text-emerald-700 border-emerald-200'
                                                            }`}>
                                                                {r.team || (teamName.includes('Marketing') ? 'Marketing' : 'Center')}
                                                            </span>
                                                        </td>
                                                        <td className="p-4 text-center text-sm font-black text-indigo-700 bg-indigo-50/30">
                                                            {r.casesCount.toLocaleString()} <span className="text-[10px] font-bold text-indigo-500">เคส</span>
                                                        </td>
                                                        <td className="p-4 text-center text-sm font-black text-blue-700 bg-blue-50/40">
                                                            {r.totalBoxes.toLocaleString()} <span className="text-[10px] font-bold text-blue-500">กล่อง</span>
                                                        </td>
                                                        <td className="p-4 text-center font-bold text-amber-700 bg-amber-50/20">
                                                            {r.proBoxes > 0 ? `${r.proBoxes.toLocaleString()} กล่อง` : <span className="text-slate-300">-</span>}
                                                        </td>
                                                        <td className="p-4 text-center font-bold text-emerald-700 bg-emerald-50/20">
                                                            {r.fullBoxes > 0 ? `${r.fullBoxes.toLocaleString()} กล่อง` : <span className="text-slate-300">-</span>}
                                                        </td>
                                                        <td className="p-4 text-center font-bold text-blue-700 bg-blue-50/20">
                                                            {r.memberBoxes > 0 ? `${r.memberBoxes.toLocaleString()} กล่อง` : <span className="text-slate-300">-</span>}
                                                        </td>
                                                        <td className="p-4 text-center font-bold text-slate-500 bg-slate-50/50">
                                                            {r.zeroBoxes > 0 ? `${r.zeroBoxes.toLocaleString()} กล่อง` : <span className="text-slate-300">-</span>}
                                                        </td>
                                                        <td className="p-4 text-right whitespace-nowrap">
                                                            {r.totalAmountThb > 0 && <div className="text-xs font-black text-blue-700">฿{r.totalAmountThb.toLocaleString(undefined, {minimumFractionDigits: 2})}</div>}
                                                            {r.totalAmountLak > 0 && (
                                                                <div className="text-[11px] font-bold text-emerald-700">
                                                                    {Math.round(r.totalAmountLak).toLocaleString()} ₭ 
                                                                    <span className="text-[10px] text-slate-400 block font-normal">(≈ ฿{(Math.round(r.totalAmountLak / exchangeRate)).toLocaleString()})</span>
                                                                </div>
                                                            )}
                                                            {r.totalAmountLak === 0 && r.totalAmountThb === 0 && <span className="text-slate-300">-</span>}
                                                        </td>
                                                    </tr>
                                                );
                                            })}
                                            {list.length === 0 && (
                                                <tr>
                                                    <td colSpan={10} className="p-10 text-center text-slate-400 font-bold">
                                                        ไม่พบข้อมูลผู้ปิดการขายของ {teamName} ในช่วงเวลาที่เลือก
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                        {list.length > 0 && (
                                            <tfoot className="bg-slate-50 border-t-2 border-slate-200 font-black text-xs text-slate-800">
                                                <tr>
                                                    <td colSpan={3} className="p-4 text-right">รวมสุทธิ {teamName} ({list.length} คน) :</td>
                                                    <td className="p-4 text-center text-indigo-700 bg-indigo-50/50">{totals.cases.toLocaleString()} เคส</td>
                                                    <td className="p-4 text-center text-blue-700 bg-blue-50/60">{totals.boxes.toLocaleString()} กล่อง</td>
                                                    <td className="p-4 text-center text-amber-700 bg-amber-50/30">{totals.pro.toLocaleString()} กล่อง</td>
                                                    <td className="p-4 text-center text-emerald-700 bg-emerald-50/30">{totals.full.toLocaleString()} กล่อง</td>
                                                    <td className="p-4 text-center text-blue-700 bg-blue-50/30">{totals.member.toLocaleString()} กล่อง</td>
                                                    <td className="p-4 text-center text-slate-500">{totals.zero.toLocaleString()} กล่อง</td>
                                                    <td className="p-4 text-right whitespace-nowrap">
                                                        {totals.thb > 0 && <div className="text-blue-700 font-black">฿{totals.thb.toLocaleString(undefined, {minimumFractionDigits: 2})}</div>}
                                                        {totals.lak > 0 && <div className="text-emerald-700 text-[11px] font-bold">{Math.round(totals.lak).toLocaleString()} ₭</div>}
                                                        <div className="text-[11px] text-amber-700 font-black border-t border-slate-200 pt-0.5 mt-0.5">
                                                            รวมเทียบเท่า: ฿{(Math.round((totals.thb + (totals.lak / exchangeRate)) * 100) / 100).toLocaleString(undefined, {minimumFractionDigits: 2})}
                                                        </div>
                                                    </td>
                                                </tr>
                                            </tfoot>
                                        )}
                                    </table>
                                </div>
                            </div>
                        );

                        return (
                            <div className="space-y-6 animation-fade-in">
                                {/* Top KPI Summary Cards */}
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                    <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                                        <div className="text-xs font-bold text-slate-500 mb-1">🎯 ผู้ปิดการขายทั้งหมด</div>
                                        <div className="text-2xl font-black text-slate-800">{closersData.length} <span className="text-xs text-slate-400 font-bold">คน</span></div>
                                        <div className="text-[11px] text-slate-400 mt-1 font-bold">Marketing: {marketingClosers.length} | Center: {centerClosers.length}</div>
                                    </div>
                                    <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                                        <div className="text-xs font-bold text-indigo-600 mb-1">📑 จำนวนเคสที่ปิดได้รวม</div>
                                        <div className="text-2xl font-black text-indigo-700">{closerTotals.cases.toLocaleString()} <span className="text-xs text-indigo-400 font-bold">เคส</span></div>
                                        <div className="text-[11px] text-indigo-400 mt-1 font-bold">Marketing: {marketingTotals.cases} | Center: {centerTotals.cases}</div>
                                    </div>
                                    <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                                        <div className="text-xs font-bold text-blue-600 mb-1">📦 สินค้าที่ปิดได้ทั้งหมด</div>
                                        <div className="text-2xl font-black text-blue-700">{closerTotals.boxes.toLocaleString()} <span className="text-xs text-blue-400 font-bold">กล่อง</span></div>
                                        <div className="text-[11px] text-blue-400 mt-1 font-bold">Marketing: {marketingTotals.boxes} | Center: {centerTotals.boxes}</div>
                                    </div>
                                    <div className="bg-gradient-to-br from-amber-500 to-orange-600 p-4 rounded-2xl shadow-md text-white">
                                        <div className="text-xs font-bold text-amber-100 mb-1">💰 ยอดเงินรวม (คิดเป็นบาท)</div>
                                        <div className="text-2xl font-black">฿{(Math.round((closerTotals.thb + (closerTotals.lak / exchangeRate)) * 100) / 100).toLocaleString(undefined, {minimumFractionDigits: 2})}</div>
                                        <div className="text-[11px] text-amber-100/90 mt-1 font-bold">
                                            (เงินสด/โอนบาท ฿{closerTotals.thb.toLocaleString()} + กีบ {Math.round(closerTotals.lak).toLocaleString()} ₭)
                                        </div>
                                    </div>
                                </div>

                                {/* Table 1: ทีม Marketing */}
                                {renderCloserTable(
                                    marketingClosers, 
                                    marketingTotals, 
                                    'ตารางจัดอันดับผู้ปิดการขาย - ทีม Marketing', 
                                    '📣', 
                                    'bg-rose-100 text-rose-700', 
                                    'border-rose-100'
                                )}

                                {/* Table 2: ทีม Center (คุณหมอ / เจ้าหน้าที่ Center) */}
                                {renderCloserTable(
                                    centerClosers, 
                                    centerTotals, 
                                    'ตารางจัดอันดับผู้ปิดการขาย - ทีม Center (คุณหมอ / ประจำศูนย์)', 
                                    '🩺', 
                                    'bg-emerald-100 text-emerald-700', 
                                    'border-emerald-100'
                                )}
                            </div>
                        );
                    }

                    return (
                        <div className="space-y-6 animation-fade-in">
                            <div className="flex justify-end gap-3 mb-2 print-hide">
                                <button type="button" onClick={handleExportSalesExcel} className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm flex items-center gap-2 transition-colors no-print">
                                    <Archive size={16}/> Export Excel
                                </button>
                                <button type="button" onClick={() => window.print()} className="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm flex items-center gap-2 transition-colors no-print">
                                    <FileText size={16}/> Export PDF
                                </button>
                                <button type="button" onClick={() => window.print()} className="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm flex items-center gap-2 transition-colors no-print">
                                    <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg> 
                                    พิมพ์ (Print)
                                </button>
                            </div>
                            <div className={`${boxWrapper} p-0 overflow-hidden`}>
                                <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse min-w-[900px]">
                                    <thead>
                                        <tr className="bg-slate-100 border-b border-slate-200">
                                            <th className={thBase}>เดือน/ช่วงเวลา</th>
                                            <th className={thBase}>{isTeamView ? 'ทีมสังกัด' : (isCustTypeView ? 'ประเภทลูกค้า' : 'พนักงาน')}</th>
                                            <th className={`${thBase} border-l border-slate-200`}>รายการ (เต็ม)</th>
                                            <th className={`${thBase} border-l border-slate-200 text-blue-700`}>รายการ (สมาชิก)</th>
                                            <th className={`${thBase} border-l border-slate-200 text-amber-700`}>รายการ (โปร)</th>
                                            <th className={`${thBase} border-l border-slate-200 text-slate-600`}>รายการ (ศูนย์)</th>
                                            <th className={`${thBase} border-l border-slate-200 text-center text-blue-700 font-bold bg-blue-50/50`}>รวม<br/><span className="text-[10px] font-normal">(ทุกราคา)</span></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {salesReportData.map((row, index) => (
                                            <tr key={index} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                <td className="p-4 text-sm font-bold text-slate-800 whitespace-nowrap">{row.label1}</td>
                                                <td className="p-4 text-sm font-bold text-slate-800">
                                                    <div className="flex flex-col">
                                                        <span>{row.label2}</span>
                                                        {row.subLabel2 && <span className="text-[11px] text-blue-600 font-normal mt-0.5">{row.subLabel2}</span>}
                                                    </div>
                                                </td>
                                                <td className="p-4 border-l border-slate-100 bg-emerald-50/20">{renderDetailBadges(row.detailsFull, 'bg-emerald-100 text-emerald-800 border-emerald-200')}</td>
                                                <td className="p-4 border-l border-slate-100 bg-blue-50/20">{renderDetailBadges(row.detailsMember, 'bg-blue-100 text-blue-800 border-blue-200')}</td>
                                                <td className="p-4 border-l border-slate-100 bg-amber-50/20">{renderDetailBadges(row.detailsPro, 'bg-amber-100 text-amber-800 border-amber-200')}</td>
                                                <td className="p-4 border-l border-slate-100 bg-slate-50/50">{renderDetailBadges(row.detailsZero, 'bg-white text-slate-600 border-slate-300')}</td>
                                                <td className="p-4 text-center align-middle border-l border-slate-100 bg-blue-50/50">
                                                    <div className="text-xl font-black text-blue-700">{row.total}</div>
                                                    <div className="text-[10px] font-bold text-slate-500">กล่อง</div>
                                                </td>
                                            </tr>
                                        ))}
                                        {salesReportData.length === 0 && (
                                            <tr><td colSpan={7} className="p-12 text-center text-slate-400 font-bold">ไม่พบข้อมูลยอดขายตามเงื่อนไขที่ระบุ</td></tr>
                                        )}
                                    </tbody>
                                    {salesReportData.length > 0 && (
                                        <tfoot className="bg-slate-900 text-white border-t-4 border-slate-950">
                                            <tr>
                                                <td colSpan={2} className="py-4 px-4 align-middle text-center border-r border-slate-800">
                                                    <div className="font-black text-white text-sm">ยอดรวมสุทธิ (Grand Total)</div>
                                                    <div className="text-[11px] font-bold text-slate-400 mt-1">ทั้งหมด {salesReportData.length} รายการ</div>
                                                </td>
                                                <td className="p-4 align-middle text-center border-r border-slate-800 bg-emerald-950/40">
                                                    <div className="font-black text-xl text-emerald-400">{reportTotals.sumFull}</div>
                                                    <div className="text-[10px] font-bold text-emerald-500 mt-0.5">กล่อง (เต็ม)</div>
                                                </td>
                                                <td className="p-4 align-middle text-center border-r border-slate-800 bg-blue-950/40">
                                                    <div className="font-black text-xl text-blue-400">{reportTotals.sumMember}</div>
                                                    <div className="text-[10px] font-bold text-blue-500 mt-0.5">กล่อง (สมาชิก)</div>
                                                </td>
                                                <td className="p-4 align-middle text-center border-r border-slate-800 bg-amber-950/40">
                                                    <div className="font-black text-xl text-amber-400">{reportTotals.sumPro}</div>
                                                    <div className="text-[10px] font-bold text-amber-500 mt-0.5">กล่อง (โปร)</div>
                                                </td>
                                                <td className="p-4 align-middle text-center border-r border-slate-800 bg-slate-800/40">
                                                    <div className="font-black text-xl text-slate-300">{reportTotals.sumZero}</div>
                                                    <div className="text-[10px] font-bold text-slate-400 mt-0.5">กล่อง (ศูนย์)</div>
                                                </td>
                                                <td className="p-4 align-middle text-center bg-blue-950">
                                                    <div className="font-black text-3xl text-blue-300">{reportTotals.sumTotal}</div>
                                                    <div className="text-[11px] font-black text-blue-400 uppercase tracking-widest mt-0.5">TOTAL</div>
                                                </td>
                                            </tr>
                                        </tfoot>
                                    )}
                                </table>
                            </div>
                        </div>
                        </div>
                    );
                })()}



            </div>
        );
    };

    const App = () => {
        const [isLoggedIn, setIsLoggedIn] = useState(false);
        const [currentUser, setCurrentUser] = useState(null);
        const [showLoginModal, setShowLoginModal] = useState(false);

        // ⚡ INSTANT MOUNT CACHE INJECTION: เปิดหน้าปุ๊บ แสดงข้อมูลจาก Cache ทันที ไม่ต้องรอหมุนติ้ว
        const initialCache = (() => {
            try { 
                const data = localStorage.getItem('stk_reports_cache_data') || localStorage.getItem('stk_app_cache_data'); 
                return data ? JSON.parse(data) : null; 
            } catch(e) { return null; }
        })();

        const [systemSettings, setSystemSettings] = useState(() => {
            try {
                const saved = localStorage.getItem('stk_system_settings');
                return saved ? JSON.parse(saved) : (initialCache?.systemSettings || { exchange_rate: 700, commission_levels: 6 });
            } catch(e) {
                return { exchange_rate: 700, commission_levels: 6 };
            }
        });
        const [products, setProducts] = useState(() => initialCache && Array.isArray(initialCache.products) ? initialCache.products : []);
        const [customerTypes, setCustomerTypes] = useState(() => initialCache && Array.isArray(initialCache.customerTypes) ? initialCache.customerTypes : fallbackCustomerTypes);
        const [closers, setClosers] = useState(() => initialCache && Array.isArray(initialCache.closers) ? initialCache.closers : []);
        const [businessTeams, setBusinessTeams] = useState(() => initialCache && Array.isArray(initialCache.businessTeams) ? initialCache.businessTeams : []);
        const [members, setMembers] = useState(() => initialCache && Array.isArray(initialCache.members) ? initialCache.members : []);
        const [customers, setCustomers] = useState(() => initialCache && Array.isArray(initialCache.customers) ? initialCache.customers : []);
        const [sales, setSales] = useState(() => initialCache && Array.isArray(initialCache.sales) ? initialCache.sales : []);
        const [stockMovements, setStockMovements] = useState([]);
        const [systemUsers, setSystemUsers] = useState([]);
        const [payoutLogs, setPayoutLogs] = useState(() => initialCache && Array.isArray(initialCache.payoutLogs) ? initialCache.payoutLogs : []);
        const [isAppLoading, setIsAppLoading] = useState(() => !initialCache);
        const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
            try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch (e) { return false; }
        });

        const pagePerm = window.getUserPagePermission ? window.getUserPagePermission(currentUser, 'reports') : 'none';
      const isAdmin = currentUser && (
          String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || 
          String(currentUser.role).trim().toLowerCase().includes('admin') || String(currentUser.role).trim().includes('แอดมิน') ||
          pagePerm === 'full'
      );

        const activeCustomerTypes = useMemo(() => {
            if (!customerTypes || customerTypes.length === 0) return fallbackCustomerTypes;
            return (customerTypes || []).filter(p => p && p.status === 'ใช้งาน');
        }, [customerTypes]);

        const fetchAllData = useCallback(async () => {
            try {
                // ⚡ RESTORED FULL QUERY: ดึงข้อมูลครบถ้วนเพื่อให้รายงานทุกแท็บและกราฟแสดงผลถูกต้องสมบูรณ์
                const [pRes, typeRes, cloRes, memRes, custRes, saleRes, teamRes, settingsRes, payRes] = await Promise.all([
                    supabaseSelect('stk_products', 'select=product_id,name,category,price_full,price_member,price_promo,give_pv,current_stock,status,self_fee,level_1_fee,level_2_fee,level_3_fee,level_4_fee,level_5_fee,self_percent_full,level_1_percent_full,self_percent_member,level_1_percent_member').catch(() => []),
                    supabaseSelect('stk_customer_types').catch(() => fallbackCustomerTypes),
                    supabaseSelect('stk_closers').catch(() => []),
                    supabaseSelect('stk_members', 'select=user_id,name,sponsor_id,business_team,permission_role,status,accumulated_pv,phone_number').catch(() => []),
                    supabaseSelect('stk_customers', 'select=customer_id,name,customer_type,closer_id,owner_member_id,extra_details_json&order=customer_id.desc&limit=2500').catch(() => []),
                    supabaseSelect('stk_sales', 'order=order_id.desc&limit=2500').catch(() => []),
                    supabaseSelect('stk_business_teams').catch(() => []),
                    supabaseSelect('stk_system_settings').catch(() => []),
                    supabaseSelect('stk_payout_logs', 'order=payout_id.desc&limit=500').catch(() => [])
                ]);

                let loadedSettings = { exchange_rate: 700, commission_levels: 6 };
                try {
                    const localSaved = localStorage.getItem('stk_system_settings');
                    if (localSaved) {
                        const parsed = JSON.parse(localSaved);
                        if (parsed && typeof parsed === 'object') loadedSettings = { ...loadedSettings, ...parsed };
                    }
                } catch(e) {}
                if (Array.isArray(settingsRes) && settingsRes.length > 0) {
                    const settingsObj = {};
                    settingsRes.forEach(s => {
                        if (s && (s.key || s.setting_key)) {
                            const k = s.key || s.setting_key;
                            const v = s.value !== undefined ? s.value : s.setting_value;
                            settingsObj[k] = typeof v === 'string' ? v : JSON.stringify(v);
                        }
                    });
                    if (settingsObj.MAIN) {
                        try {
                            const parsedMain = typeof settingsObj.MAIN === 'string' ? JSON.parse(settingsObj.MAIN) : settingsObj.MAIN;
                            if (parsedMain.commission_levels != null) settingsObj.commission_levels = Number(parsedMain.commission_levels);
                        } catch(e){}
                    }
                    loadedSettings = { ...loadedSettings, ...settingsObj };
                    try {
                        const localSaved = localStorage.getItem('stk_system_settings');
                        if (localSaved) {
                            const parsedLocal = JSON.parse(localSaved);
                            if (parsedLocal?.commission_condition_config) {
                                loadedSettings.commission_condition_config = parsedLocal.commission_condition_config;
                            }
                        }
                    } catch(e){}
                }
                setSystemSettings(loadedSettings);
                try { localStorage.setItem('stk_system_settings', JSON.stringify(loadedSettings)); } catch(e){}
                
                const formattedProducts = (pRes || []).map(p => ({
                    ...p,
                    id: String(p.id || p.product_id || p.Product_ID || p.code || '').trim(),
                    name: String(p.name || p.product_name || p.Product_Name || p.id || '').trim(),
                    stock: Number(p.stock !== undefined ? p.stock : (p.quantity !== undefined ? p.quantity : (p.qty !== undefined ? p.qty : (p.Stock !== undefined ? p.Stock : (p.current_stock !== undefined ? p.current_stock : 0)))))
                }));
                setProducts(formattedProducts);
                setCustomerTypes(typeRes);

                // แปลงข้อมูลทีมให้ถูกต้อง (Mapping)
                const formattedTeams = (teamRes || []).map(t => ({
                    id: String(t.id || t.team_id || t.Team_ID || '').trim(),
                    name: String(t.name || t.team_name || t.Team_Name || t.TeamName || '').trim(),
                    status: String(t.status || t.Status || 'ใช้งาน').trim()
                }));
                setBusinessTeams(formattedTeams);
                
                const formattedMembers = (memRes || []).map(m => ({
                    id: String(m.id || m.user_id || m.User_ID || '').trim(),
                    name: String(m.name || m.Name || '').trim(),
                    referrer: String(m.referrer || m.sponsor_id || m.Sponsor_ID || '').trim(),
                    team: String(m.team || m.business_team || m.Business_Team || 'Marketing').trim(),
                    role: String(m.role || m.permission_role || m.Permission_Role || 'Staff').trim(),
                    status: String(m.status || m.Status || 'ทำงานอยู่').trim(),
                    profileUrl: m.profile_url || m.id_card_url || m.ID_Card_URL || '',
                    phone: m.phone || m.phone_number || m.Phone_Number || '',
                    email: m.email || m.Email || '',
                    lineId: m.line_id || m.LINE_ID || '',
                    accumulatedPV: Number(m.accumulated_pv || m.Accumulated_PV || 0)
                })).filter(m => m.id !== '');
                if (Array.isArray(cloRes)) setClosers(cloRes);
                setMembers(formattedMembers);
                
                let formattedCustomers = [];
                if (Array.isArray(custRes)) {
                    formattedCustomers = custRes.map(c => {
                        let extra = {};
                        if (c.extra_details_json) {
                            try { extra = typeof c.extra_details_json === 'string' ? JSON.parse(c.extra_details_json) : c.extra_details_json; } catch(e){}
                        }
                        const rawCloser = String(c.closer || c.closer_id || c.closer_name || c.Closer || extra.closer || extra.closer_id || '').trim();
                        return {
                            ...c,
                            id: String(c.id || c.customer_id || c.hn || '').trim(),
                            name: String(c.name || c.customer_name || '').trim(),
                            type: String(c.type || c.customer_type || c.customerType || '').trim(),
                            memberId: String(c.memberId || c.member_id || c.owner_member_id || '').trim(),
                            closer: rawCloser,
                            closer_id: rawCloser,
                            closerTeam: String(c.closer_team || c.closerTeam || extra.closerTeam || '').trim()
                        };
                    });
                    setCustomers(formattedCustomers);
                } else {
                    setCustomers([]);
                }
                
                let processedSales = [];
                if (Array.isArray(saleRes)) {
                    processedSales = saleRes.map(s => {
                        let sumF = 0, sumM = 0, sumP = 0, sumZ = 0;
                        let itemsList = [];
                        if (s.items_json) {
                            try { itemsList = typeof s.items_json === 'string' ? JSON.parse(s.items_json) : s.items_json; } catch(e){}
                        }
                        
                        if (Array.isArray(itemsList) && itemsList.length > 0) {
                            itemsList.forEach(it => {
                                const typeStr = String(it.type || '').trim();
                                const qtyNum = Number(it.qty || it.quantity || 1);
                                const pName = String(it.prod || it.productName || it.name || 'Unknown').trim();
                                s[`${pName}_${typeStr}`] = qtyNum;
                                
                                if (typeStr === 'ราคาเต็ม') sumF += qtyNum;
                                else if (typeStr === 'ราคาสมาชิก') sumM += qtyNum;
                                else if (typeStr === 'ราคาโปร' || typeStr === 'โปรโมชั่น') sumP += qtyNum;
                                else if (typeStr === 'ราคาศูนย์') sumZ += qtyNum;
                                else sumM += qtyNum;
                            });
                        } else {
                            Object.keys(s).forEach(k => {
                                if (k !== 'รวมชิ้นราคาเต็ม' && k !== 'รวมชิ้นราคาสมาชิก' && k !== 'รวมชิ้นราคาโปร' && k !== 'รวมชิ้นราคาศูนย์' && k !== 'ยอดรวมชิ้นทั้งหมด') {
                                    if (k.endsWith('_ราคาเต็ม')) sumF += (parseInt(s[k]) || 0);
                                    else if (k.endsWith('_ราคาสมาชิก')) sumM += (parseInt(s[k]) || 0);
                                    else if (k.endsWith('_ราคาโปร') || k.endsWith('_โปรโมชั่น')) sumP += (parseInt(s[k]) || 0);
                                    else if (k.endsWith('_ราคาศูนย์')) sumZ += (parseInt(s[k]) || 0);
                                }
                            });
                        }
                        
                        s['id'] = s.id || s.order_id || s.sale_id || s.receipt_id || s.bill_id || '';
                        s['memberId'] = s.memberId || s.member_id || s.sellerId || s.seller_id || s.seller || s.user_id || s.created_by || s.marketing || '';
                        s['sellerId'] = s['memberId'];
                        s['sellerName'] = s.sellerName || s.seller_name || s.member_name || s.marketing_name || s['memberId'];
                        s['customerType'] = s.customer_type || s.customerType || s.custType || '';
                        
                        // 📌 ดึงชื่อลูกค้าและผู้ปิดการขายให้ถูกต้อง
                        const rawCustId = String(s.customerId || s.customer_id || s.client_id || s.cust_id || s.hn || '').trim().toUpperCase();
                        let resolvedCustName = s.customerName || s.customer_name || s.custName || s.client_name || '';
                        let resolvedCloser = s.closer || s.closer_id || '';
                        
                        if (rawCustId && (custRes || []).length > 0) {
                            const foundCust = (custRes || []).find(c => c && (
                                String(c.id || '').trim().toUpperCase() === rawCustId || 
                                String(c.customer_id || '').trim().toUpperCase() === rawCustId ||
                                String(c.hn || '').trim().toUpperCase() === rawCustId
                            ));
                            if (foundCust) {
                                if (foundCust.name || foundCust.customer_name || foundCust.Name) {
                                    resolvedCustName = foundCust.name || foundCust.customer_name || foundCust.Name;
                                }
                                if (!resolvedCloser) {
                                    let cExtra = {};
                                    if (foundCust.extra_details_json) {
                                        try { cExtra = typeof foundCust.extra_details_json === 'string' ? JSON.parse(foundCust.extra_details_json) : foundCust.extra_details_json; } catch(e){}
                                    }
                                    resolvedCloser = foundCust.closer || foundCust.closer_id || foundCust.closer_name || foundCust.Closer || cExtra.closer || cExtra.closer_id || '';
                                }
                            }
                        }
                        
                        s['customerId'] = rawCustId;
                        s['customerName'] = resolvedCustName || (rawCustId ? `ลูกค้า (${rawCustId})` : 'ไม่ระบุชื่อ');
                        s['closer'] = resolvedCloser;
                        s['saleType'] = s.sale_type || s.saleType || '';
                        s['payMode'] = s.sale_type || s.saleType || s.payMode || s.pay_mode || s.payment_method || s.payment || 'เงินโอน';
                        s['currency'] = s.currency || s.สกุลเงิน || s.Currency || '';
                        
                        const dbTotalBottles = Number(s.total_bottles || s.totalQty || 0);
                        if (sumF + sumM + sumP + sumZ === 0 && dbTotalBottles > 0) {
                            sumM = dbTotalBottles;
                        } else if (sumF + sumM + sumP + sumZ === 0 && Number(s.total_amount || s.totalAmount || 0) > 0) {
                            const estimated = Math.max(1, Math.round(Number(s.total_amount || s.totalAmount || 0) / 1000));
                            sumM = estimated;
                        }

                        s['รวมชิ้นราคาเต็ม'] = sumF; 
                        s['รวมชิ้นราคาสมาชิก'] = sumM;
                        s['รวมชิ้นราคาโปร'] = sumP; 
                        s['รวมชิ้นราคาศูนย์'] = sumZ;
                        s['ยอดรวมชิ้นทั้งหมด'] = sumF + sumM + sumP + sumZ;
                        
                        s['_items'] = itemsList;
                        if (!s['ยอดขายรวม']) {
                            s['ยอดขายรวม'] = Number(s.total_amount || s.grand_total || s.totalAmount || s.grandTotal || s.amount || 0);
                        }
                        
                        const rawDate = String(s.date || s.sale_date || s.created_at || '');
                        s['date'] = rawDate.split('T')[0].split(' ')[0];
                        
                        return s;
                    });
                    setSales(processedSales);
                } else {
                    setSales([]);
                }
                
                setPayoutLogs(payRes);

                // ⚡ บันทึกข้อมูลลงใน Cache เพื่อให้เปิดหน้านี้ครั้งถัดไปเร็วทันที (ตัดทอนเฉพาะฟิลด์ที่จำเป็นเพื่อป้องกัน localStorage เต็ม)
                try {
                    const cachePayload = {
                        products: formattedProducts,
                        customerTypes: typeRes,
                        closers: cloRes,
                        members: formattedMembers,
                        customers: formattedCustomers.slice(0, 1000).map(c => ({ id: c.id, name: c.name, type: c.type, closer: c.closer, memberId: c.memberId })),
                        businessTeams: formattedTeams,
                        sales: processedSales.slice(0, 1000)
                    };
                    localStorage.setItem('stk_reports_cache_data', JSON.stringify(cachePayload));
                    localStorage.setItem('stk_app_cache_data', JSON.stringify(cachePayload));
                } catch(e){}
            } catch (err) {
                console.error("Supabase load error:", err);
            } finally {
                setIsAppLoading(false);
            }
        }, []);

        useEffect(() => {
            const savedUserStr = localStorage.getItem('stk_current_user');
            if (savedUserStr) {
                setCurrentUser(JSON.parse(savedUserStr));
                setIsLoggedIn(true);
            } else setShowLoginModal(true);

            const initialLoader = document.getElementById('initial-loader');
            if (initialLoader) { initialLoader.style.opacity = '0'; setTimeout(() => { if (initialLoader) initialLoader.style.display = 'none'; }, 400); }

            fetchAllData();
        }, [fetchAllData]);

        const handleLoginSuccess = (user) => {
            localStorage.setItem('stk_current_user', JSON.stringify(user));
            setCurrentUser(user);
            setIsLoggedIn(true);
            setShowLoginModal(false);
        };

        const handleLogout = () => {
            localStorage.removeItem('stk_current_user');
            setCurrentUser(null);
            setIsLoggedIn(false);
        };

        return (
            <div className="min-h-screen flex flex-col lg:flex-row font-sans bg-slate-50">
                <Sidebar 
                    activePage="reports" 
                    isLoggedIn={isLoggedIn} 
                    currentUser={currentUser} 
                    isAdmin={isAdmin} 
                    onLogout={handleLogout} 
                    showLoginModal={showLoginModal} 
                    setShowLoginModal={setShowLoginModal} 
                    SCRIPT_URL=""
                    isSidebarCollapsed={isSidebarCollapsed}
                    setIsSidebarCollapsed={setIsSidebarCollapsed}
                />
                <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>
                    <div className="p-3 sm:p-6 flex-1 w-full relative z-0">
                        {isAppLoading ? (
                            <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                                <div className="w-16 h-16 border-[4px] border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                                <h2 className="text-lg font-bold text-slate-700">กำลังโหลดข้อมูล...</h2>
                            </div>
                        ) : isLoggedIn ? (
                            <ReportsView 
                                sales={sales} 
                                members={members} 
                                closers={closers}
                                customers={customers} 
                                activeCustomerTypes={activeCustomerTypes} 
                                products={products} 
                                systemSettings={systemSettings}
                                businessTeams={businessTeams}
                                currentUser={currentUser}
                                isAdmin={isAdmin}
                                onRefreshData={fetchAllData}
                                stockMovements={stockMovements}
                                payoutLogs={payoutLogs}
                            />
                        ) : (
                            <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                                <h2 className="text-xl font-black text-red-500">กรุณาเข้าสู่ระบบก่อนใช้งาน</h2>
                            </div>
                        )}
                    </div>
                </main>
                <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={systemUsers} />
            </div>
        );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
