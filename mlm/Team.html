    async function supabaseSelect(table, query) {
      var url = window.SUPABASE_REST_URL + '/' + table + (query ? '?' + query : '');
      var res = await fetch(url, { method: 'GET', headers: window.SUPABASE_HEADERS });
      if (!res.ok) { var t = await res.text(); throw new Error('SELECT ' + table + ': ' + res.status + ' ' + t); }
      return res.json();
    }
    async function supabaseInsert(table, data) {
      var res = await fetch(window.SUPABASE_REST_URL + '/' + table, { method: 'POST', headers: window.SUPABASE_HEADERS, body: JSON.stringify(data) });
      if (!res.ok) { var t = await res.text(); throw new Error('INSERT ' + table + ': ' + res.status + ' ' + t); }
      return res.json();
    }
    async function supabaseUpdate(table, id, data, pk='id') {
      var url = window.SUPABASE_REST_URL + '/' + table + '?' + pk + '=eq.' + encodeURIComponent(id);
      var res = await fetch(url, { method: 'PATCH', headers: window.SUPABASE_HEADERS, body: JSON.stringify(data) });
      if (!res.ok) { var t = await res.text(); throw new Error('UPDATE ' + table + ': ' + res.status + ' ' + t); }
      return res.json();
    }
    async function supabaseDelete(table, id, pk='id') {
      var h = Object.assign({}, window.SUPABASE_HEADERS, { 'Prefer': 'return=minimal' });
      var url = window.SUPABASE_REST_URL + '/' + table + '?' + pk + '=eq.' + encodeURIComponent(id);
      var res = await fetch(url, { method: 'DELETE', headers: h });
      if (!res.ok) { var t = await res.text(); throw new Error('DELETE ' + table + ': ' + res.status + ' ' + t); }
      return true;
    }
    async function supabaseUpsert(table, data) {
      var h = Object.assign({}, window.SUPABASE_HEADERS, { 'Prefer': 'resolution=merge-duplicates,return=representation' });
      var res = await fetch(window.SUPABASE_REST_URL + '/' + table, { method: 'POST', headers: h, body: JSON.stringify(data) });
      if (!res.ok) { var t = await res.text(); throw new Error('UPSERT ' + table + ': ' + res.status + ' ' + t); }
      return res.json();
    }

    // ✅ Helper: BFS หา ID ทั้งหมดใน downline รวมตัวเอง
    const getAllDownlineIds = (membersList, rootId) => {
        const result = new Set();
        const rootUp = String(rootId || '').trim().toUpperCase();
        if (!rootUp) return result;
        // build children map
        const childMap = new Map();
        (membersList || []).forEach(m => {
            const ref = String(m.referrer || m.sponsor_id || m.sponsorId || '').trim().toUpperCase();
            const mid = String(m.id || '').trim().toUpperCase();
            if (ref && ref !== mid) {
                if (!childMap.has(ref)) childMap.set(ref, []);
                childMap.get(ref).push(mid);
            }
        });
        const queue = [rootUp];
        while (queue.length > 0) {
            const current = queue.shift();
            if (result.has(current)) continue;
            result.add(current);
            (childMap.get(current) || []).forEach(c => queue.push(c));
        }
        return result;
    };

    // ==========================================

    const BusinessTeamsManagementView = ({ businessTeams, setBusinessTeams, members, isAdmin, showToast }) => {
        const [showModal, setShowModal] = useState(false);
        const [editingTeam, setEditingTeam] = useState(null);
        const [teamName, setTeamName] = useState('');
        const [isSubmitting, setIsSubmitting] = useState(false);
        const [searchTerm, setSearchTerm] = useState('');
        const [confirmDelete, setConfirmDelete] = useState({ show: false, id: null, title: '' });

        const filteredTeams = useMemo(() => {
            const query = (searchTerm || '').trim().toUpperCase();
            return (businessTeams || []).filter(t => {
                if (!t) return false;
                return query === '' || (t.id && t.id.toUpperCase().includes(query)) || (t.name && t.name.toUpperCase().includes(query));
            });
        }, [businessTeams, searchTerm]);

        const getMemberCount = (teamId, teamName) => {
            return (members || []).filter(m => {
                if (!m || !m.team) return false;
                const tUpper = m.team.trim().toUpperCase();
                return tUpper === safeUpper(teamId) || tUpper === safeUpper(teamName);
            }).length;
        };

        const handleOpenAdd = () => {
            setEditingTeam(null);
            setTeamName('');
            setShowModal(true);
        };

        const handleOpenEdit = (team) => {
            setEditingTeam(team);
            setTeamName(team.name || '');
            setShowModal(true);
        };

        const handleSave = async (e) => {
            e.preventDefault();
            if (!teamName.trim()) { showToast('กรุณากรอกชื่อทีม', 'error'); return; }
            setIsSubmitting(true);

            try {
                if (editingTeam) {
                    await supabaseUpdate('stk_business_teams', editingTeam.id || editingTeam.team_id, { team_name: teamName.trim() }, 'team_id');
                    setBusinessTeams(prev => prev.map(t => (t.id === editingTeam.id || t.team_id === editingTeam.team_id) ? { ...t, name: teamName.trim(), team_name: teamName.trim() } : t));
                    showToast('บันทึกข้อมูลเรียบร้อย!', 'success');
                } else {
                    let nextIdNum = 1;
                    const existingIds = (businessTeams || []).map(t => {
                        const idStr = String(t.id || t.team_id || '');
                        const match = idStr.match(/^T(\d+)$/i);
                        return match ? parseInt(match[1], 10) : 0;
                    });
                    if (existingIds.length > 0) {
                        nextIdNum = Math.max(0, ...existingIds) + 1;
                    }
                    const newId = 'T' + String(nextIdNum).padStart(2, '0');
                    const dbPayload = { team_id: newId, team_name: teamName.trim(), status: 'เข้าใช้งาน' };
                    await supabaseInsert('stk_business_teams', dbPayload);
                    const uiTeam = { team_id: newId, id: newId, team_name: teamName.trim(), name: teamName.trim(), status: 'เข้าใช้งาน' };
                    setBusinessTeams(prev => [...prev, uiTeam]);
                    showToast('เพิ่มทีมใหม่เรียบร้อย!', 'success');
                }
                setShowModal(false);
            } catch (error) {
                showToast('เกิดข้อผิดพลาด: ' + (error.message || error), 'error');
            } finally {
                setIsSubmitting(false);
            }
        };

        const handleToggleStatus = async (team) => {
            const currentStatus = String(team.status || 'เข้าใช้งาน').trim();
            const isActive = currentStatus === 'เข้าใช้งาน' || currentStatus === 'ใช้งาน' || currentStatus === 'เปิดใช้งาน' || currentStatus === 'Active' || currentStatus === 'ทำงานอยู่';
            const newStatus = isActive ? 'ปิดเข้าใช้งาน' : 'เข้าใช้งาน';
            
            try {
                await supabaseUpdate('stk_business_teams', team.id, { status: newStatus }, 'team_id');
                setBusinessTeams(prev => prev.map(t => t.id === team.id ? { ...t, status: newStatus } : t));
                showToast('อัปเดตสถานะ ' + team.name + ' เป็น ' + newStatus + ' เรียบร้อย', 'info');
            } catch (error) {
                showToast('เกิดข้อผิดพลาด: ' + (error.message || error), 'error');
            }
        };

        const executeDelete = async () => {
            const id = confirmDelete.id;
            try {
                await supabaseDelete('stk_business_teams', id, 'team_id');
                setBusinessTeams(prev => prev.filter(t => t.id !== id));
                setConfirmDelete({ show: false, id: null, title: '' });
                showToast('ลบข้อมูลเรียบร้อย!', 'success');
            } catch (error) {
                showToast('เกิดข้อผิดพลาด: ' + (error.message || error), 'error');
            }
        };

                    </div>
                    {isAdmin && (
                        <button onClick={handleOpenAdd} className={btnClassPrimary + " flex items-center gap-2"}>
                            <Plus size={16}/> เพิ่มทีมใหม่
                        </button>
                    )}
                </div>

                <div className={`${boxWrapper} py-4`}>
                    <div className="flex items-center bg-slate-50/30 focus-within:bg-white border border-slate-200 rounded-xl px-3 shadow-sm focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-100 transition-all duration-300 w-full max-w-md h-[40px]">
                        <SearchIcon size={18} className="text-slate-400 shrink-0" />
                        <input type="text" placeholder="ค้นหาชื่อทีมหรือรหัส..." className="w-full bg-transparent border-none outline-none text-[13px] font-medium text-slate-800 placeholder-slate-400 pl-2 h-full" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                    </div>
                </div>

                <div className={`${boxWrapper} p-0 overflow-hidden`}>
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse min-w-[700px]">
                            <thead>
                                <tr className="bg-slate-100 border-b border-slate-200">
                                    <th className={thBase}>รหัสทีม</th>
                                    <th className={thBase}>ชื่อทีมสังกัด</th>
                                    <th className={`${thBase} text-center`}>จำนวนสมาชิกพนักงาน</th>
                                    <th className={`${thBase} text-center`}>สถานะการเข้าใช้งาน</th>
                                    {isAdmin && <th className={`${thBase} text-center w-24`}>จัดการ</th>}
                                </tr>
                            </thead>
                            <tbody>
                                {filteredTeams.map((team, idx) => {
                                    const mCount = getMemberCount(team.id, team.name);
                                    const isTeamDisabled = team.status === 'ปิดเข้าใช้งาน' || team.status === 'ปิดใช้งาน' || team.status === 'Disabled';
                                    return (
                                        <tr key={team.id || idx} className={`border-b border-slate-100 transition-colors ${isTeamDisabled ? 'bg-slate-50/60 opacity-85' : 'hover:bg-slate-50'}`}>
                                            <td className="p-4 text-sm font-bold text-blue-600 whitespace-nowrap">{team.id}</td>
                                            <td className="p-4 text-sm font-black text-slate-800 flex items-center gap-2">
                                                {team.name}
                                                {isTeamDisabled && <span className="text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded font-bold">ซ่อนจากหน้าหลัก</span>}
                                            </td>
                                            <td className="p-4 text-center">
                                                <span className="px-3 py-1 bg-indigo-50 text-indigo-700 font-bold rounded-full text-xs border border-indigo-200">
                                                    {mCount} คน
                                                </span>
                                            </td>
                                            <td className="p-4 text-center">
                                                <div className="flex items-center justify-center gap-3">
                                                    <button 
                                                        type="button"
                                                        onClick={() => handleToggleStatus(team)}
                                                        className={`relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out outline-none ${
                                                            isTeamDisabled ? 'bg-slate-300' : 'bg-emerald-500'
                                                        }`}
                                                        title="คลิกเพื่อเปิด/ปิดใช้งานทีมนี้"
                                                    >
                                                        <span
                                                            className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${
                                                                isTeamDisabled ? 'translate-x-0' : 'translate-x-5'
                                                            }`}
                                                        />
                                                    </button>
                                                    <span className={`text-xs font-black w-24 text-left ${isTeamDisabled ? 'text-slate-400' : 'text-emerald-700'}`}>
                                                        {isTeamDisabled ? 'ปิดใช้งาน (ซ่อน)' : 'เปิดใช้งาน'}
                                                    </span>
                                                </div>
                                            </td>
                                            {isAdmin && (
                                                <td className="p-2 text-center border-l border-slate-100">
                                                    <div className="flex justify-center items-center gap-1.5">
                                                        <button onClick={() => handleOpenEdit(team)} className="w-8 h-8 flex justify-center items-center bg-white hover:bg-blue-50 text-blue-600 rounded-lg border border-slate-200 shadow-sm transition-all">
                                                            <Edit size={14}/>
                                                        </button>
                                                        <button onClick={() => setConfirmDelete({ show: true, id: team.id, title: team.name })} className="w-8 h-8 flex justify-center items-center bg-white hover:bg-red-50 text-red-600 rounded-lg border border-slate-200 shadow-sm transition-all">
                                                            <Trash2 size={14}/>
                                                        </button>
                                                    </div>
                                                </td>
                                            )}
                                        </tr>
                                    );
                                })}
                                {filteredTeams.length === 0 && (
                                    <tr><td colSpan="5" className="p-12 text-center text-slate-400 font-bold">ไม่พบข้อมูลทีมสังกัดตามเงื่อนไขที่ค้นหา</td></tr>
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>

                <EditModal isOpen={showModal} onClose={() => setShowModal(false)} title={editingTeam ? 'แก้ไขข้อมูลทีมสังกัด' : 'เพิ่มทีมสังกัดใหม่'} icon={Briefcase} maxWidthClass="max-w-md">
                    <form onSubmit={handleSave} className="space-y-4">
                        <div>
                            <label className={labelClassHud}>ชื่อทีมสังกัด</label>
                            <input type="text" placeholder="ระบุชื่อทีม เช่น Marketing, Center..." className={inputClassHud} value={teamName} onChange={e => setTeamName(e.target.value)} required />
                        </div>
                        <div className="flex justify-end gap-3 pt-3">
                            <button type="button" onClick={() => setShowModal(false)} className="px-5 py-2.5 rounded-xl font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 text-xs">ยกเลิก</button>
                            <button type="submit" disabled={isSubmitting} className={btnClassPrimary}>
                                {isSubmitting ? 'กำลังบันทึก...' : 'บันทึกข้อมูลทีม'}
                            </button>
                        </div>
                    </form>
                </EditModal>

                <ConfirmModal isOpen={confirmDelete.show} onClose={() => setConfirmDelete({ show: false, id: null, title: '' })} onConfirm={executeDelete} title="ยืนยันการลบทีมสังกัด" message={`คุณต้องการลบทีมสังกัด "${confirmDelete.title}" ออกจากระบบใช่หรือไม่?`} />
            </div>
        );
    };

    // ==========================================
    // 📌 React App (Main Component)
    // ==========================================
    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);

      const [activeSubTab, setActiveSubTab] = useState(() => {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const tabFromUrl = urlParams.get('tab') || urlParams.get('page');
          if (tabFromUrl) {
            const lower = tabFromUrl.toLowerCase();
            if (lower === 'business_teams' || lower === 'business_team' || lower === 'teams') {
              return 'business_teams';
            }
          }
        } catch(e) {}
        return 'members';
      });

      useEffect(() => {
        const handleLocationChange = () => {
          try {
            const urlParams = new URLSearchParams(window.location.search);
            const tabFromUrl = urlParams.get('tab') || urlParams.get('page');
            if (tabFromUrl) {
              const lower = tabFromUrl.toLowerCase();
              if (lower === 'business_teams' || lower === 'business_team' || lower === 'teams') {
                setActiveSubTab('business_teams');
              } else if (lower === 'members' || lower === 'team') {
                setActiveSubTab('members');
              }
            }
          } catch(e) {}
        };
        handleLocationChange();
        window.addEventListener('popstate', handleLocationChange);
        return () => window.removeEventListener('popstate', handleLocationChange);
      }, []);

      const [products, setProducts] = useState([]);
      const [customerTypes, setCustomerTypes] = useState(fallbackCustomerTypes);
      const [closers, setClosers] = useState([]);
      const [members, setMembers] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [sales, setSales] = useState([]);
      const [systemUsers, setSystemUsers] = useState([]);
      const [businessTeams, setBusinessTeams] = useState([]);
      const [isAppLoading, setIsAppLoading] = useState(false);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch (e) { return false; }
      });

      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const showToast = (message, type = 'success') => { setToast({ show: true, message, type }); };

      const SCRIPT_URL = "";

      const isAdmin = currentUser && (
          String(currentUser.role).trim() === 'ผู้ดูแลระบบ' ||
          String(currentUser.role).trim().toLowerCase() === 'admin'
      );
      const currentUserProfileUrl = currentUser?.profileUrl || '';

      useEffect(() => {
        const savedUserStr = localStorage.getItem('stk_current_user');
        if (savedUserStr) {
          try {
            const user = JSON.parse(savedUserStr);
            setCurrentUser(user);
            setIsLoggedIn(true);
          } catch (e) { localStorage.removeItem('stk_current_user'); }
        } else {
          setShowLoginModal(true);
        }

        const initialLoader = document.getElementById('initial-loader');
        if (initialLoader) initialLoader.style.display = 'none';

        Promise.all([
            supabaseSelect('stk_products').catch(() => []),
            supabaseSelect('stk_customer_types').catch(() => []),
            supabaseSelect('stk_closers').catch(() => []),
            supabaseSelect('stk_members').catch(() => []),
            supabaseSelect('stk_customers').catch(() => []),
            supabaseSelect('stk_sales').catch(() => []),
            supabaseSelect('stk_business_teams').catch(() => []),
            supabaseSelect('stk_target_history').catch(() => [])
        ]).then(([products, customerTypes, closers, members, customers, sales, businessTeams, targetHistory]) => {
            const response = {
                products: products,
                customerTypes: customerTypes,
                closers: closers,
                members: members,
                customers: customers,
                sales: sales,
                businessTeams: businessTeams,
                targetHistory: targetHistory
            };
            try { localStorage.setItem('stk_app_cache_data', JSON.stringify(response)); } catch(e){}
            applyDataToStates(response);
            setIsAppLoading(false);
        }).catch((error) => {
            setIsAppLoading(false);
            showToast('เกิดข้อผิดพลาดในการโหลดข้อมูล: ' + (error.message || error), 'error');
        });
      }, []);

      const applyDataToStates = (response) => {
           if (Array.isArray(response.products)) setProducts(response.products);
           if (Array.isArray(response.customerTypes)) setCustomerTypes(response.customerTypes);
           if (Array.isArray(response.closers)) setClosers(response.closers);
           if (Array.isArray(response.members)) { 
             setMembers(response.members.map(m => ({ 
               ...m, 
               id: m.id || m.user_id || m.member_id, 
               name: m.name, 
               profileUrl: m.profile_url || m.profileImageUrl || m.profileUrl || m.id_card_url, 
               idCardDocUrl: m.id_doc_url || m.id_card_doc_url || m.idCardDocUrl || m.id_card_url || '', 
               businessTeam: m.business_team || m.businessTeam, 
               team: m.business_team || m.team || m.businessTeam || 'T01', 
               role: m.permission_role || m.role || m.permissionRole, 
               status: m.status, 
               sponsorId: m.sponsor_id || m.sponsorId, 
               referrer: m.referrer || m.sponsor_id || m.sponsorId || '',
               accumulatedPv: m.accumulated_pv || m.Accumulated_PV || m.accumulatedPv || m.pv || 0, 
               phone: m.phone_number || m.phone || m.phoneNumber || '',
               email: m.email || '',
               address: m.address || '',
               lineId: m.line_id || m.lineId || '',
               bankName: m.bank_name || m.bankName || '',
               bankAccountNo: m.bank_account_no || m.bankAccountNo || '',
               bankAccountName: m.bank_account_name || m.bankAccountName || '',
               idCardNumber: m.id_card_number || m.idCardNumber || ''
             }))); 
           }
           if (Array.isArray(response.customers)) setCustomers(response.customers);
           if (Array.isArray(response.systemUsers)) setSystemUsers(response.systemUsers);
           if (Array.isArray(response.businessTeams)) setBusinessTeams(response.businessTeams.map(t => ({ ...t, id: t.id || t.team_id, name: t.name || t.team_name, status: t.status })));
           if (Array.isArray(response.sales)) {
               const processedSales = response.sales.map(s => {
                   let sumF = 0, sumP = 0, sumZ = 0;
                   Object.keys(s).forEach(k => {
                       if (k !== 'รวมชิ้นราคาเต็ม' && k !== 'รวมชิ้นราคาโปร' && k !== 'รวมชิ้นราคาศูนย์' && k !== 'ยอดรวมชิ้นทั้งหมด') {
                           if (k.endsWith('_ราคาเต็ม')) sumF += (parseInt(s[k]) || 0);
                           else if (k.endsWith('_ราคาโปร')) sumP += (parseInt(s[k]) || 0);
                           else if (k.endsWith('_ราคาศูนย์')) sumZ += (parseInt(s[k]) || 0);
                       }
                   });
                   s['รวมชิ้นราคาเต็ม'] = sumF; s['รวมชิ้นราคาโปร'] = sumP; s['รวมชิ้นราคาศูนย์'] = sumZ;
                   s['ยอดรวมชิ้นทั้งหมด'] = sumF + sumP + sumZ;
                   return s;
               });
               setSales(processedSales);
           }
      };

      const handleLoginSuccess = (user) => {
        localStorage.setItem('stk_current_user', JSON.stringify(user));
        setCurrentUser(user);
        setIsLoggedIn(true);
        setShowLoginModal(false);
        showToast('เข้าสู่ระบบสำเร็จ!', 'success');
      };

      const handleLogout = () => {
        localStorage.removeItem('stk_current_user');
        setCurrentUser(null);
        setIsLoggedIn(false);
        const targetUrl = typeof resolvePageUrl === 'function' ? resolvePageUrl('?page=dashboard') : 'Mlm.html';
        if (typeof window !== 'undefined') window.location.href = targetUrl;
      };

      return (
        <div className="min-h-screen flex flex-col lg:flex-row font-sans bg-slate-50 w-full">
          <Sidebar
            activePage={activeSubTab === 'business_teams' ? 'business_teams' : 'team'}
            onSubTabChange={(sub) => setActiveSubTab(sub)}
            isLoggedIn={isLoggedIn}
            currentUser={currentUser}
            currentUserProfileUrl={currentUserProfileUrl}
            isAdmin={isAdmin}
            onLogout={handleLogout}
            showLoginModal={showLoginModal}
            setShowLoginModal={setShowLoginModal}
            SCRIPT_URL={SCRIPT_URL}
            setIsAppLoading={setIsAppLoading}
            isSidebarCollapsed={isSidebarCollapsed}
            setIsSidebarCollapsed={setIsSidebarCollapsed}
          />

          <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>

            {toast.show && ReactDOM.createPortal(
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[999999] flex items-center justify-center p-4 animation-fade-in" style={{ animationDuration: '0.2s' }}>
                 <div className={`bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center animation-pop border-t-4 ${toast.type === 'error' ? 'border-red-500' : toast.type === 'info' ? 'border-blue-500' : 'border-emerald-500'}`}>
                    <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${toast.type === 'error' ? 'bg-red-100 text-red-500' : toast.type === 'info' ? 'bg-blue-100 text-blue-500' : 'bg-emerald-100 text-emerald-500'}`}>
                       {toast.type === 'error' ? <X size={32} /> : toast.type === 'info' ? <Trophy size={32} /> : <CheckCircle size={32} />}
                    </div>
                    <h3 className="text-xl font-bold text-slate-800 mb-2">{toast.type === 'error' ? 'เกิดข้อผิดพลาด' : toast.type === 'info' ? 'แจ้งเตือน' : 'สำเร็จ!'}</h3>
                    <p className="text-slate-600 font-medium text-sm mb-6">{toast.message}</p>
                    <button onClick={() => setToast({ ...toast, show: false })} className="w-full py-2.5 rounded-lg font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">ตกลง</button>
                 </div>
              </div>
            , document.body)}

            <div className="p-3 sm:p-6 flex-1 w-full relative z-0 space-y-4">
              <div className="w-full relative z-10">
                {isAppLoading ? (
                  <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                    <div className="w-16 h-16 border-[4px] border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                    <h2 className="text-lg font-bold text-slate-700">กำลังโหลดข้อมูล...</h2>
                    <p className="text-slate-500 text-sm">กรุณารอสักครู่ ระบบกำลังดึงข้อมูลล่าสุด</p>
                  </div>
                ) : isLoggedIn ? (
                  activeSubTab === 'business_teams' ? (
                    <BusinessTeamsManagementView
                      businessTeams={businessTeams}
                      setBusinessTeams={setBusinessTeams}
                      members={members}
                      isAdmin={isAdmin}
                      showToast={showToast}
                    />
                  ) : (
                    <TeamManagementView
                      members={members}
                      setMembers={setMembers}
                      businessTeams={businessTeams}
                      isAdmin={isAdmin}
                      showToast={showToast}
                      sales={sales}
                      products={products}
                      currentUser={currentUser}
                    />
                  )
                ) : (
                  <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                    <h2 className="text-xl font-black text-red-500">กรุณาเข้าสู่ระบบก่อนเข้าใช้งาน</h2>
                    <button onClick={() => setShowLoginModal(true)} className={btnClassPrimary}>เข้าสู่ระบบ</button>
                  </div>
                )}
              </div>
            </div>

            <footer className="w-full text-center py-6 mt-auto border-t border-slate-200/50 no-print shrink-0">
               <p className="text-[11px] font-bold text-slate-400 opacity-60 hover:opacity-100 transition-opacity">
                  &copy; {new Date().getFullYear()} STK Sales Management System. Developed by Sackda Southammavong.
               </p>
            </footer>
          </main>

          <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={systemUsers} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
