  <script>
    window.SUPABASE_URL='https://mfpkeyrykqnrywyksyqp.supabase.co';window.SUPABASE_ANON_KEY='sb_publishable_807NIkuj6MAs1KZY-m4tug_Fm1Mk-AO';window.SUPABASE_REST_URL=window.SUPABASE_URL+'/rest/v1';window.SUPABASE_HEADERS={'Content-Type':'application/json','apikey':window.SUPABASE_ANON_KEY,'Authorization':'Bearer '+window.SUPABASE_ANON_KEY,'Prefer':'return=representation'};

    async function supabaseUpdate(t,id,d){var r=await fetch(window.SUPABASE_REST_URL+'/'+t+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:window.SUPABASE_HEADERS,body:JSON.stringify(d)});if(!r.ok)throw new Error('UPDATE '+t+':'+r.status);return r.json();}
    async function supabaseDelete(t,id){var r=await fetch(window.SUPABASE_REST_URL+'/'+t+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:Object.assign({},window.SUPABASE_HEADERS,{'Prefer':'return=minimal'})});if(!r.ok)throw new Error('DELETE '+t+':'+r.status);return true;}
    async function supabaseUpsert(t,d){var r=await fetch(window.SUPABASE_REST_URL+'/'+t,{method:'POST',headers:Object.assign({},window.SUPABASE_HEADERS,{'Prefer':'resolution=merge-duplicates,return=representation'}),body:JSON.stringify(d)});if(!r.ok)throw new Error('UPSERT '+t+':'+r.status);return r.json();}

<body class="antialiased overflow-x-hidden selection:bg-blue-600 selection:text-white">

  <div id="initial-loader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999;">
    <div style="width: 60px; height: 60px; border: 4px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: initial-spin 1s linear infinite; margin-bottom: 24px;"></div>
    <style>@keyframes initial-spin { to { transform: rotate(360deg); } }</style>
    <h2 style="font-size: 1.75rem; font-weight: 800; color: #1e40af; margin: 0; letter-spacing: -0.025em;">STK<span style="color: #475569;">System</span></h2>
    <p style="font-size: 0.875rem; color: #64748b; font-weight: 500; margin-top: 8px;">กำลังโหลดระบบจัดการข้อมูล...</p>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;

    const fallbackCustomerTypes = window.fallbackCustomerTypes || [
       { id: 'T001', name: 'ลูกค้าใหม่', status: 'ใช้งาน' },
       { id: 'T002', name: 'ลูกค้าเก่ากลับมาต่อยา', status: 'ใช้งาน' }
    ];
    const fallbackProductsList = window.fallbackProductsList || ['SESAMIN', 'APPLE', 'KING_GOLD'];

    /* <?!= include('CommonComponents'); ?> */

    // 📌 Icons added for Team.html
    const UserIcon = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    const PhoneIcon = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>;
    const CreditCardIcon = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>;
    const MailIcon = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>;
    const MessageSquareIcon = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>;
    const MapPinIcon = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;
    const FileTextIcon = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>;
    const Briefcase = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>;

    // ==========================================
    // 📌 ส่วนจัดการข้อมูลพนักงาน (Team Management View)
    // ==========================================
    const TeamManagementView = ({ members, setMembers, businessTeams, isAdmin, showToast, sales, products, currentUser }) => {
        const [showForm, setShowForm] = useState(false);
        const [isEditing, setIsEditing] = useState(false);
        const [isSubmitting, setIsSubmitting] = useState(false);
        const [filterTeam, setFilterTeam] = useState('All');
        const [searchTerm, setSearchTerm] = useState('');
        
        const [previewImage, setPreviewImage] = useState(null);
        const [imageFileBase64, setImageFileBase64] = useState(null);

        const [idDocPreviewImage, setIdDocPreviewImage] = useState(null);
        const [idDocFileBase64, setIdDocFileBase64] = useState(null);

        const [confirmDelete, setConfirmDelete] = useState({ show: false, id: null, title: '' });
        const [selectedMember, setSelectedMember] = useState(null);

        const selectedMemberStats = useMemo(() => {
            if (!selectedMember) return { personalComm: 0, teamComm: 0, accumulatedPv: 0 };
            const mId = String(selectedMember.id || '').trim().toUpperCase();
            let personalComm = 0;
            let teamComm = 0;
            let accumulatedPv = 0;

            (sales || []).forEach(s => {
                const seller = String(s.sellerId || s.sellerName || s.seller || s.memberId || '').trim().toUpperCase();
                if (seller === mId) {
                    (products || []).forEach(p => {
                        const pName = p.name;
                        const fullQty = Number(s[`${pName}_ราคาเต็ม`] || 0);
                        const memQty = Number(s[`${pName}_ราคาสมาชิก`] || 0);
                        const promoQty = Number(s[`${pName}_ราคาโปร`] || 0);
                        const givePv = Number(p.givePv || 0);
                        const selfFee = Number(p.selfFee || 0);

                        // Strict PV Rule: PV awarded ONLY for Full Price or Member Price items!
                        if (givePv > 0) {
                            accumulatedPv += ((fullQty + memQty) * givePv);
                        }
                        if (selfFee > 0) {
                            personalComm += ((fullQty + memQty + promoQty) * selfFee);
                        }
                    });
                }
            });

            const sheetPv = Number(selectedMember.accumulatedPV || 0); return { personalComm, teamComm, accumulatedPv: sheetPv > 0 ? sheetPv : accumulatedPv };
        }, [selectedMember, sales, products]);

        const visibleMembers = useMemo(() => {
            if (!currentUser) return members || [];
            const role = currentUser.role || 'พนักงานทั่วไป';
            if (role === 'ผู้ดูแลระบบ' || String(role).toLowerCase() === 'admin' || role === 'พนักงานทั่วไป') {
                return members || [];
            }
            if (role === 'พนักงานการตลาด') {
                const currId = String(currentUser.user_id || currentUser.username || currentUser.id || '').trim().toUpperCase();
                const downlines = new Set([currId]);
                let changed = true;
                while (changed) {
                    changed = false;
                    for (const m of (members || [])) {
                        const mId = String(m.id || m.user_id || '').trim().toUpperCase();
                        const sponsor = String(m.referrer || m.sponsor_id || '').trim().toUpperCase();
                        if (sponsor && downlines.has(sponsor) && !downlines.has(mId)) {
                            downlines.add(mId);
                            changed = true;
                        }
                    }
                }
                return (members || []).filter(m => {
                    const mId = String(m.id || m.user_id || '').trim().toUpperCase();
                    return downlines.has(mId);
                });
            }
            return members || [];
        }, [members, currentUser]);

        const initialFormState = {
          id: '', username: '', password: '1234', name: '', team: 'T01', role: 'Staff',
          startDate: getLocalISODate(), status: 'ทำงานอยู่', profileUrl: '', referrer: '',
          phone: '', email: '', address: '', lineId: '',
          bankName: '', bankAccountNo: '', bankAccountName: '',
          idCardNumber: '', idCardDocUrl: '' 
        };
        const [formData, setFormData] = useState(initialFormState);

        // 🟢 รายชื่อสำหรับ AutoSuggest ผู้แนะนำ (แม่ทีม)
        const referrerSuggestList = useMemo(() => {
            const list = visibleMembers
                .filter(m => m && m.id !== formData.id && m.status === 'ทำงานอยู่')
                .map(m => ({
                    label: `${m.id} - ${m.name}`,
                    value: m.id,
                    searchText: `${m.id} ${m.name}`
                }));
            return list;
        }, [visibleMembers, formData.id]);

        // 🟢 ฟังก์ชันค้นหาข้อมูลแม่ทีมมาโชว์ใต้ช่องกรอก
        const foundReferrer = useMemo(() => {
            if (!formData.referrer) return null;
            return visibleMembers.find(m => m.id.toUpperCase() === formData.referrer.toUpperCase());
        }, [formData.referrer, visibleMembers]);

        const handleOpenAdd = () => { 
            setIsEditing(false); 
            setFormData(initialFormState); 
            setPreviewImage(null); 
            setImageFileBase64(null); 
            setIdDocPreviewImage(null);
            setIdDocFileBase64(null);
            setShowForm(true); 
        };

        const handleOpenEdit = (member) => {
           setIsEditing(true);
           setFormData({
              id: member.id,
              username: member.username || member.id.toLowerCase(),
              name: member.name,
              team: member.team || 'T01',
              role: member.role || 'Staff',
              password: member.password || '1234',
              startDate: member.startDate || getLocalISODate(),
              status: member.status || 'ทำงานอยู่',
              profileUrl: member.profileUrl || '',
              referrer: member.referrer || '',
              phone: member.phone || '',
              email: member.email || '',
              address: member.address || '',
              lineId: member.lineId || '',
              bankName: member.bankName || '',
              bankAccountNo: member.bankAccountNo || '',
              bankAccountName: member.bankAccountName || '',
              idCardNumber: member.idCardNumber || '',
              idCardDocUrl: member.idCardDocUrl || ''
           });
           setPreviewImage(member.profileUrl || null);
           setImageFileBase64(null);
           
           setIdDocPreviewImage(member.idCardDocUrl || null);
           setIdDocFileBase64(null);

           setShowForm(true);
        };

        const handleImageChange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 300; const MAX_HEIGHT = 300;
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } }
                    else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    setPreviewImage(dataUrl); setImageFileBase64(dataUrl);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        const handleIdDocImageChange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } }
                    else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    setIdDocPreviewImage(dataUrl); 
                    setIdDocFileBase64(dataUrl);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };

        const handleSaveMember = (e) => {
           e.preventDefault();
           if (!formData.id || !formData.name) { showToast('กรุณากรอกข้อมูลให้ครบ', 'error'); return; }
           setIsSubmitting(true);
           
           const dataToSave = { 
               ...formData, 
               imageBase64: imageFileBase64,
               idCardDocBase64: idDocFileBase64 
           };

           if (typeof google !== 'undefined' && google.script) {
              if (isEditing) {
                 google.script.run
                   .withSuccessHandler((resRaw) => {
                       let res = resRaw;
                       try { if (typeof resRaw === 'string') res = JSON.parse(resRaw); } catch(e){}
                       if (res && res.status === 'error') {
                           setIsSubmitting(false); showToast('แก้ไขล้มเหลว: ' + res.message, 'error'); return;
                       }

                       let finalProfileUrl = formData.profileUrl;
                       let finalDocUrl = formData.idCardDocUrl;
                       
                       if (typeof res === 'object' && res !== null) {
                           finalProfileUrl = res.profileUrl || formData.profileUrl;
                           finalDocUrl = res.idCardDocUrl || formData.idCardDocUrl;
                       } else if (res && res !== 'success' && res !== 'not_found') {
                           finalProfileUrl = res; 
                       }

                       setMembers((members || []).map(m => m && safeUpper(m.id) === safeUpper(formData.id) ? { 
                           ...m, 
                           ...formData, 
                           profileUrl: imageFileBase64 ? finalProfileUrl : formData.profileUrl,
                           idCardDocUrl: idDocFileBase64 ? finalDocUrl : formData.idCardDocUrl
                       } : m));
                       setShowForm(false); setIsSubmitting(false); showToast('แก้ไขข้อมูลพนักงานสำเร็จ', 'success');
                   })
                   .withFailureHandler((error) => { setIsSubmitting(false); showToast('แก้ไขล้มเหลว: ' + (error ? (error.message || error) : ''), 'error'); })
                   .updateMemberData(dataToSave);
              } else {
                 if ((members || []).find(m => m && safeUpper(m.id) === safeUpper(formData.id))) { setIsSubmitting(false); showToast('รหัสพนักงานซ้ำในระบบ', 'error'); return; }
                 google.script.run
                   .withSuccessHandler((resRaw) => {
                       let res = resRaw;
                       try { if (typeof resRaw === 'string') res = JSON.parse(resRaw); } catch(e){}
                       if (res && res.status === 'error') {
                           setIsSubmitting(false); showToast('เพิ่มล้มเหลว: ' + res.message, 'error'); return;
                       }

                       let finalProfileUrl = formData.profileUrl;
                       let finalDocUrl = formData.idCardDocUrl;

                       if (typeof res === 'object' && res !== null) {
                           finalProfileUrl = res.profileUrl || formData.profileUrl;
                           finalDocUrl = res.idCardDocUrl || formData.idCardDocUrl;
                       } else if (res && res !== 'success' && res !== 'not_found') {
                           finalProfileUrl = res;
                       }

                       setMembers([...(members || []), { 
                           ...formData, 
                           profileUrl: imageFileBase64 ? finalProfileUrl : formData.profileUrl,
                           idCardDocUrl: idDocFileBase64 ? finalDocUrl : formData.idCardDocUrl 
                       }]);
                       setShowForm(false); setIsSubmitting(false); showToast('เพิ่มพนักงานสำเร็จ', 'success');
                   })
                   .withFailureHandler((error) => { setIsSubmitting(false); showToast('บันทึกล้มเหลว: ' + (error ? (error.message || error) : ''), 'error'); })
                   .saveMemberData(dataToSave);
              }
           } else {
              setTimeout(() => {
                 const finalData = { 
                     ...formData, 
                     profileUrl: imageFileBase64 || formData.profileUrl, 
                     idCardDocUrl: idDocFileBase64 || formData.idCardDocUrl,
                     accumulatedE: 250000, 
                     accumulatedPV: 150 
                 };
                 if (isEditing) setMembers((members || []).map(m => m && safeUpper(m.id) === safeUpper(formData.id) ? { ...m, ...finalData } : m));
                 else setMembers([...(members || []), finalData]);
                 setShowForm(false); setIsSubmitting(false); showToast('จำลองบันทึกสำเร็จ', 'success');
              }, 500);
           }
        };

        const executeDelete = () => {
            const id = confirmDelete.id;
            setConfirmDelete({ show: false, id: null, title: '' });
            if (typeof google !== 'undefined' && google.script) {
                google.script.run
                  .withSuccessHandler((res) => { if (res === 'success') { setMembers((members || []).filter(m => m && m.id !== id)); showToast('ลบพนักงานสำเร็จ', 'success'); } })
                  .withFailureHandler((err) => { showToast('ลบล้มเหลว: ' + (err ? (err.message || err) : ''), 'error'); })
                  .deleteMemberData(id);
            } else {
                setMembers((members || []).filter(m => m && m.id !== id));
                showToast('จำลองลบสำเร็จ', 'success');
            }
        };

        const displayedMembers = filterTeam === 'All' ? visibleMembers : visibleMembers.filter(m => {
           let t = m && m.team;
           if (t === 'T01' || t === 'Marketing' || t === 'Team A') return filterTeam === 'Marketing';
           if (t === 'T02' || t === 'Center' || t === 'Team B') return filterTeam === 'Center';
           return false;
        });

        const searchedMembers = displayedMembers
           .filter(m => m && ((m.id && m.id.toLowerCase().includes(searchTerm.toLowerCase())) || (m.name && m.name.toLowerCase().includes(searchTerm.toLowerCase()))))
           .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'th'));

        const filterBtn = "px-5 py-2 rounded-xl text-[13px] font-bold transition-all border shadow-sm shrink-0 h-[38px] sm:h-[40px] flex items-center justify-center";

        return (
          <div className="space-y-6 animation-fade-in relative w-full">
            <ConfirmModal
              isOpen={confirmDelete.show}
              onClose={() => setConfirmDelete({ show: false, id: null, title: '' })}
              onConfirm={executeDelete}
              title="ยืนยันการลบพนักงาน"
              message={`คุณต้องการลบพนักงาน "${confirmDelete.title}" ออกจากระบบใช่หรือไม่?`}
            />

            {/* Add / Edit Form Modal */}
            <EditModal isOpen={showForm} onClose={() => setShowForm(false)} title={isEditing ? 'แก้ไขข้อมูลพนักงาน' : 'เพิ่มพนักงานใหม่'} icon={Users} maxWidthClass="max-w-5xl">
                <form onSubmit={handleSaveMember} className="space-y-6">

                  {/* ส่วนที่ 1: ข้อมูลบัญชีเข้าระบบ */}
                  <div>
                    <h3 className="text-sm font-extrabold text-blue-600 mb-3 flex items-center gap-2 bg-blue-50 py-1.5 px-3 rounded-lg"><UserIcon size={16}/> ข้อมูลบัญชีเข้าระบบ</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div>
                        <label className={labelClassHud}>รหัสสมาชิก *</label>
                        <input type="text" required disabled={isEditing} placeholder="เช่น L02987" className={inputClassHud + " uppercase"} value={formData.id} onChange={e => setFormData({...formData, id: e.target.value})} />
                      </div>
                      <div>
                        <label className={labelClassHud}>ชื่อผู้ใช้งาน (Username) *</label>

                      </div>
                      <div>
                        <label className={labelClassHud}>รหัสผ่านเข้าระบบ *</label>
                        <input type="text" required placeholder="รหัสผ่านเข้าใช้งาน" className={inputClassHud} value={formData.password} onChange={e => setFormData({...formData, password: e.target.value})} />
                      </div>
                    </div>
                  </div>

                  {/* ส่วนที่ 2: ข้อมูลส่วนตัวและสังกัดทีม */}

                        <label className={labelClassHud}>ชื่อ-นามสกุล *</label>

                      </div>
                      <div>
                        <label className={labelClassHud}>สังกัดทีม</label>
                        <select className={inputClassHud} value={formData.team} onChange={e => setFormData({...formData, team: e.target.value})}>
                          {(businessTeams || []).map(t => (<option key={t.id} value={t.id}>{t.name}</option>))}

                        </select>
                      </div>
                      <div>
                        <label className={labelClassHud}>สิทธิ์การใช้งาน (Role)</label>
                        <select disabled={!isAdmin} className={`${inputClassHud} ${!isAdmin ? 'bg-slate-100 text-slate-500 cursor-not-allowed' : ''}`} value={formData.role} onChange={e => setFormData({...formData, role: e.target.value})}>

                          <option value="Admin">ผู้ดูแลระบบ (Admin)</option>
                        </select>
                      </div>
                      
                      {/* 🟢 อัปเกรด: ช่องผู้แนะนำ (แม่ทีม) เป็นแบบ AutoSuggest */}

                            value={formData.referrer} 
                            onChange={val => setFormData({...formData, referrer: val})} 
                            onSelect={val => setFormData({...formData, referrer: val})} 
                            data={referrerSuggestList} 
                            placeholder="พิมพ์รหัส หรือชื่อเพื่อค้นหา..." 
                            required={false} 
                            disabled={isEditing && !isAdmin}
                        />
                        {/* 🟢 แสดงชื่อแม่ทีมที่เลือกไว้ด้านล่างเพื่อรีเช็ค */}
                        {foundReferrer ? (
                            <div className="text-[10px] font-bold text-emerald-600 mt-1.5 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100 inline-block truncate max-w-full shadow-sm">
                                👤 {foundReferrer.name}
                            </div>
                        ) : formData.referrer.length > 0 ? (
                            <div className="text-[10px] font-bold text-red-500 mt-1.5">❌ ไม่พบรหัสแม่ทีมนี้ในระบบ</div>

                        )}
                      </div>
                      
                      <div>
                        <label className={labelClassHud}>สถานะการทำงาน</label>

                          <option value="ลาออก">ลาออก</option>

                        </select>
                      </div>
                      <div>
                        <label className={labelClassHud}>วันที่เริ่มงาน</label>
                        <input type="date" className={inputClassHud} value={formData.startDate} onChange={e => setFormData({...formData, startDate: e.target.value})} />
                      </div>
                    </div>
                  </div>

                  {/* ส่วนที่ 3: ข้อมูลการติดต่อ */}

                      </div>
                      <div>
                        <label className={labelClassHud}>อีเมล</label>
                        <input type="email" placeholder="เช่น email@domain.com" className={inputClassHud} value={formData.email || ''} onChange={e => setFormData({...formData, email: e.target.value})} />

                      <div>
                        <label className={labelClassHud}>LINE ID</label>

                      </div>
                      <div className="md:col-span-3">
                        <label className={labelClassHud}>ที่อยู่ปัจจุบัน</label>

                      </div>
                    </div>
                  </div>

                  {/* ส่วนที่ 4: ข้อมูลบัญชีธนาคาร */}

                      </div>
                      <div>
                        <label className={labelClassHud}>เลขบัญชีธนาคาร</label>

                      </div>
                      <div>
                        <label className={labelClassHud}>ชื่อบัญชีธนาคาร</label>

                      </div>
                    </div>
                  </div>

                       <div className="flex items-center justify-center h-full min-h-[160px]">

                                  <img src={idDocPreviewImage} className="max-h-48 object-contain" alt="ID Document Preview" />
                              </div>
                          ) : (
                              <div className="w-full h-40 border-2 border-dashed border-slate-300 rounded-xl bg-slate-50 flex flex-col items-center justify-center text-slate-400 gap-2">
                                  <FileTextIcon size={32} />
                                  <span className="text-xs font-bold">ยังไม่มีรูปเอกสารแนบ</span>
                              </div>
                          )}
                       </div>
                    </div>
                  </div>

                  {/* อัปโหลดรูปโปรไฟล์ */}

                        <label className={labelClassHud}>อัปโหลดรูปโปรไฟล์พนักงาน</label>

                      </div>
                      {previewImage && (
                        <div className="shrink-0 bg-white p-2 rounded-full shadow-md border border-slate-200">
                           <img src={previewImage} className="w-20 h-20 rounded-full object-cover" alt="Preview" />
                        </div>
                      )}
                  </div>

                  <div className="flex justify-end pt-4 border-t border-slate-100 gap-3">
                     <button type="button" onClick={() => setShowForm(false)} className={btnClassSecondary}>ยกเลิก</button>
                     <button type="submit" disabled={isSubmitting} className={btnClassPrimary}>{isSubmitting ? 'กำลังบันทึก...' : 'บันทึกข้อมูล'}</button>
                  </div>
                </form>
            </EditModal>

            {/* Profile Detail Modal */}
            {selectedMember && (
              <EditModal isOpen={!!selectedMember} onClose={() => setSelectedMember(null)} title="บัตรประจำตัวพนักงาน (Identity Card)" icon={Contact} maxWidthClass="max-w-4xl">
                 <div className="space-y-6 py-2">

                   {/* Premium Signature Card */}
                   <div className="w-full bg-white rounded-3xl overflow-hidden border border-slate-200 shadow-xl flex flex-col md:flex-row relative min-h-[220px]">

                      {/* Left — Avatar */}
                      <div className="bg-gradient-to-br from-blue-600 to-indigo-700 p-8 flex flex-col items-center justify-center shrink-0 w-full md:w-64 text-white relative">
                         <div className="absolute top-0 left-0 w-24 h-24 bg-white/5 rounded-full blur-2xl"></div>
                         <div className="relative">
                           <div className="w-32 h-32 rounded-full overflow-hidden border-4 border-white shadow-2xl ring-4 ring-white/20 bg-slate-100">
                              <img
                                src={selectedMember.profileUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(selectedMember.name || "")}&background=eff6ff&color=1d4ed8&rounded=true&bold=true`}
                                className="w-full h-full object-cover"
                                alt={selectedMember.name}
                                onError={(e) => { e.target.onerror = null; e.target.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(selectedMember.name || "")}&background=eff6ff&color=1d4ed8&rounded=true&bold=true`; }}
                              />
                           </div>
                           <span className={`absolute bottom-1.5 right-1.5 px-2.5 py-0.5 rounded-full text-[9px] font-black uppercase tracking-wider shadow-md ${selectedMember.status === "ทำงานอยู่" || selectedMember.status === "ใช้งาน" ? "bg-emerald-500 text-white" : selectedMember.status === "พักงาน" ? "bg-amber-500 text-white" : "bg-red-500 text-white"}`}>
                              {selectedMember.status}
                           </span>
                         </div>
                         <div className="mt-4 text-center">
                            <span className="text-[10px] font-extrabold uppercase bg-white/20 text-white px-3 py-0.5 rounded-full tracking-wider">
                               {selectedMember.id}
                            </span>
                         </div>
                      </div>

                      {/* Right — Info */}
                      <div className="p-8 flex-1 flex flex-col justify-between">
                         <div>
                            <div className="border-b-2 border-slate-100 pb-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                               <div>
                                  <h3 className="text-2xl font-black text-slate-800 leading-tight">{selectedMember.name}</h3>
                                  <p className="text-sm font-extrabold text-blue-600 mt-0.5">
                                     {selectedMember.role === 'Admin' ? 'Project Manager (Admin)' : 'Staff (ทีมงาน)'}
                                  </p>
                               </div>
                               <div className="text-right shrink-0">
                                  <span className="text-[10px] font-extrabold uppercase tracking-wide bg-blue-50 text-blue-700 px-3 py-1 rounded-lg">LOVE STK GROUPE</span>
                               </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-3.5 mt-5">
                               <div className="flex items-center gap-3.5 text-slate-600">
                                  <div className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-700 border border-slate-200/80"><PhoneIcon size={14}/></div>
                                  <div className="space-y-0.5">
                                     <span className="text-[10px] font-bold text-slate-400 block uppercase leading-none">เบอร์โทรศัพท์</span>
                                     <span className="text-xs font-extrabold text-slate-800">{selectedMember.phone || '-'}</span>
                                  </div>
                               </div>
                               <div className="flex items-center gap-3.5 text-slate-600">
                                  <div className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-700 border border-slate-200/80"><MailIcon size={14}/></div>
                                  <div className="space-y-0.5">
                                     <span className="text-[10px] font-bold text-slate-400 block uppercase leading-none">อีเมล</span>
                                     <span className="text-xs font-extrabold text-slate-800">{selectedMember.email || '-'}</span>
                                  </div>
                               </div>
                               <div className="flex items-center gap-3.5 text-slate-600">
                                  <div className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-700 border border-slate-200/80"><MessageSquareIcon size={14}/></div>
                                  <div className="space-y-0.5">
                                     <span className="text-[10px] font-bold text-slate-400 block uppercase leading-none">LINE ID</span>
                                     <span className="text-xs font-extrabold text-slate-800">{selectedMember.lineId || '-'}</span>
                                  </div>
                               </div>
                               <div className="flex items-center gap-3.5 text-slate-600">
                                  <div className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-700 border border-slate-200/80"><MapPinIcon size={14}/></div>
                                  <div className="space-y-0.5">
                                     <span className="text-[10px] font-bold text-slate-400 block uppercase leading-none">สังกัดทีม</span>
                                     <span className="text-xs font-extrabold text-slate-800">
                                        {(() => {
                                          const teamInfo = (businessTeams || []).find(t => t.id === selectedMember.team);
                                          return teamInfo ? teamInfo.name : (selectedMember.team === 'Team A' ? 'Marketing' : (selectedMember.team === 'Team B' ? 'Center' : selectedMember.team));
                                        })()}

                                  </div>
                               </div>
                            </div>

                                 const refInfo = (members || []).find(mem => mem.id === selectedMember.referrer);
                                 return refInfo ? `${refInfo.name} (${refInfo.id})` : "ไม่มี";
                               })()}

                            <div>วันที่เริ่มงาน: {selectedMember.startDate ? new Date(selectedMember.startDate).toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' }) : '-'}</div>

                      </div>

                            </div>
                            <span className="text-slate-300 hidden sm:inline">|</span>
                            <div className="flex items-center gap-1.5">
                               <span className="text-slate-400 font-bold">เลขบัญชี:</span>
                               <span className="text-slate-800 font-extrabold tracking-wider">{selectedMember.bankAccountNo || '-'}</span>
                            </div>
                            <span className="text-slate-300 hidden sm:inline">|</span>
                            <div className="flex items-center gap-1.5">
                               <span className="text-slate-400 font-bold">ชื่อบัญชี:</span>
                               <span className="text-slate-800 font-extrabold">{selectedMember.bankAccountName || '-'}</span>
                            </div>
                         </div>
                      </div>

                               <div className="text-sm sm:text-base font-black text-emerald-800 mt-1 leading-tight whitespace-nowrap">
                                  {Number(selectedMemberStats.personalComm || 0).toLocaleString()}
                               </div>
                               <span className="text-[10px] font-bold text-emerald-600 block mt-0.5">LAK (กีบ)</span>
                            </div>
                            <div className="bg-gradient-to-br from-purple-500/10 to-indigo-500/10 p-2.5 rounded-xl border border-purple-100 shadow-sm text-center">
                               <span className="text-[9px] font-bold text-purple-700 block uppercase leading-none">รายได้จากทีม</span>
                               <div className="text-sm sm:text-base font-black text-purple-800 mt-1 leading-tight whitespace-nowrap">
                                  {Number(selectedMemberStats.teamComm || 0).toLocaleString()}
                               </div>
                               <span className="text-[10px] font-bold text-purple-600 block mt-0.5">LAK (กีบ)</span>
                            </div>
                            <div className="bg-gradient-to-br from-blue-500/10 to-cyan-500/10 p-2.5 rounded-xl border border-blue-100 shadow-sm text-center" title="คิดเฉพาะสินค้าขายราคาเต็ม หรือ ราคาสมาชิก เท่านั้น">
                               <span className="text-[9px] font-bold text-blue-700 block uppercase leading-none">PV สะสม</span>
                               <div className="text-sm sm:text-base font-black text-blue-800 mt-1 leading-tight whitespace-nowrap">
                                  {Number(selectedMemberStats.accumulatedPv || 0).toLocaleString()}
                               </div>
                               <span className="text-[13px] font-bold text-blue-100">{visibleMembers.length} คน</span>
                            </div>
                         </div>
                      </div>
                   </div>

                   <div className="bg-slate-50 p-5 rounded-2xl border border-slate-100 space-y-3 mt-5">

                        <div className="bg-white p-4 rounded-xl border border-slate-200/60 shadow-sm flex flex-col md:flex-row gap-5 text-sm w-full items-start">
                            <div className="flex-1 space-y-1">
                                <div className="text-slate-400 font-bold text-xs">เลขประจำตัวเอกสาร (บัตรประชาชน/พาสปอร์ต)</div>
                                <div className="text-slate-800 font-black text-base">{selectedMember.idCardNumber || 'ไม่ได้ระบุ'}</div>
                                {selectedMember.idCardDocUrl && String(selectedMember.idCardDocUrl).trim().length > 5 && String(selectedMember.idCardDocUrl).trim() !== '-' && (
                                    <a href={selectedMember.idCardDocUrl} target="_blank" className="text-blue-600 hover:underline text-[11px] font-bold inline-flex items-center gap-1 mt-2 bg-blue-50 px-3 py-1.5 rounded-lg border border-blue-100">
                                        🔗 ดูรูปขนาดเต็ม (คลิก)
                                    </a>
                                )}
                            </div>
                            
                            {selectedMember.idCardDocUrl && String(selectedMember.idCardDocUrl).trim().length > 5 && String(selectedMember.idCardDocUrl).trim() !== '-' && (
                                <div className="shrink-0 rounded-lg overflow-hidden border border-slate-200 shadow-sm bg-slate-50 p-1">
                                    <img src={selectedMember.idCardDocUrl} className="max-h-32 md:max-h-40 object-contain rounded" alt="ID Document" />
                                </div>
                            )}
                        </div>
                   </div>

                   <div className="flex justify-end pt-2 mt-2">
                      <button type="button" onClick={() => setSelectedMember(null)} className={btnClassSecondary + " px-10"}>ปิดหน้าต่าง</button>
                   </div>
                 </div>
              </EditModal>
            )}

            {/* Page Header */}
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-200 pb-4">
              <h2 className="text-2xl font-bold text-slate-800">จัดการข้อมูลพนักงาน (Team)</h2>
              <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full md:w-auto">
                 <div className="flex items-center bg-slate-50/30 focus-within:bg-white border border-slate-200 rounded-xl px-3 shadow-sm focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-100 transition-all duration-300 flex-1 sm:w-72 h-[38px] sm:h-[40px]">
                    <SearchIcon size={18} className="text-slate-400 shrink-0" />
                    <input type="text" placeholder="ค้นหารหัส หรือ ชื่อ..." className="w-full bg-transparent border-none outline-none text-[13px] font-medium text-slate-800 placeholder-slate-400 pl-2 h-full" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                 </div>
                 <button onClick={handleOpenAdd} className={btnClassPrimary + " shrink-0"}><Plus size={18}/> เพิ่มพนักงาน</button>
              </div>
            </div>

            {/* Filter Tabs */}
            <div className="flex gap-2 bg-slate-100 p-1.5 rounded-xl border border-slate-200 w-full sm:w-fit overflow-x-auto hide-scroll">
               <button onClick={() => setFilterTeam("All")} className={filterBtn + (filterTeam === "All" ? " bg-blue-600 text-white border-blue-600 shadow-sm" : " bg-white text-slate-700 hover:bg-slate-50 border-slate-200")}>
                 ทั้งหมด ({visibleMembers.length})
               </button>
               <button onClick={() => setFilterTeam("Marketing")} className={filterBtn + (filterTeam === "Marketing" ? " bg-blue-600 text-white border-blue-600 shadow-sm" : " bg-white text-slate-700 hover:bg-slate-50 border-slate-200")}>
                 ทีม Marketing ({visibleMembers.filter(m => { let t = m && m.team; return t === "Marketing" || t === "Team A" || t === "T01"; }).length})
               </button>
               <button onClick={() => setFilterTeam("Center")} className={filterBtn + (filterTeam === "Center" ? " bg-blue-600 text-white border-blue-600 shadow-sm" : " bg-white text-slate-700 hover:bg-slate-50 border-slate-200")}>
                 ทีม Center ({visibleMembers.filter(m => { let t = m && m.team; return t === "Center" || t === "Team B" || t === "T02"; }).length})
               </button>
            </div>

            {/* Card Grid */}
            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
              {searchedMembers.map((m) => {
                const refInfo = (members || []).find(mem => mem && mem.id === m.referrer);
                const refName = refInfo ? refInfo.name : '-';
                const isWorking = m.status === 'ทำงานอยู่' || m.status === 'ใช้งาน';

                return (
                  <div
                    key={m?.id || Math.random()}
                    onClick={() => setSelectedMember(m)}
                    className="bg-white rounded-3xl border border-slate-200/80 shadow-md p-5 flex flex-col justify-between text-center relative hover:shadow-xl hover:-translate-y-1 transition-all duration-300 min-h-[350px] cursor-pointer group"
                  >
                    {/* Status Badge */}
                    <span className={`absolute top-4 right-4 px-2.5 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider ${
                      isWorking
                        ? 'bg-emerald-50 text-emerald-600 border border-emerald-200'
                        : m.status === 'พักงาน'
                          ? 'bg-amber-50 text-amber-600 border border-amber-200'
                          : 'bg-red-50 text-red-600 border border-red-200'
                    }`}>
                      {m.status}
                    </span>

                    <div className="flex flex-col items-center flex-1">
                      {/* Avatar */}
                      <div className="w-24 h-24 rounded-full overflow-hidden border-2 border-slate-100 shadow-inner mt-4 mb-3 shrink-0 bg-slate-50 relative group-hover:scale-105 transition-transform duration-300">
                        <img
                          src={m?.profileUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(m?.name || '')}&background=eff6ff&color=1d4ed8&rounded=true&bold=true`}
                          alt={m?.name}
                          className="w-full h-full object-cover"
                          onError={(e) => { e.target.onerror = null; e.target.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(m?.name || '')}&background=eff6ff&color=1d4ed8&rounded=true&bold=true`; }}
                        />
                      </div>

                      {/* ID */}
                      <span className="text-[10px] font-extrabold uppercase bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full tracking-wider mb-2">{m?.id}</span>

                      {/* Name */}
                      <h3 className="text-[15px] font-black text-slate-800 line-clamp-1 leading-tight mb-1">{m?.name}</h3>

                      {/* Role */}
                      <p className="text-[11px] font-bold text-blue-600 mb-4">{m?.role === 'Admin' ? 'Project Manager (Admin)' : 'Staff (ทีมงาน)'}</p>

                      {/* Team & Start Date */}
                      <div className="grid grid-cols-2 gap-4 w-full text-left pt-3 border-t border-slate-100 text-xs mt-auto">
                        <div>
                          <span className="text-slate-400 font-bold block uppercase leading-none text-[9px] mb-1">ทีม</span>
                          <span className="text-slate-700 font-extrabold line-clamp-1">
                            {(() => {
                              const teamInfo = (businessTeams || []).find(t => t.id === m?.team);
                              if (teamInfo) return teamInfo.name;
                              if (m?.team === 'Team A' || m?.team === 'T01' || m?.team === 'Marketing') return 'Marketing';
                              if (m?.team === 'Team B' || m?.team === 'T02' || m?.team === 'Center') return 'Center';
                              return m?.team || '-';
                            })()}
                          </span>
                        </div>
                        <div>
                          <span className="text-slate-400 font-bold block uppercase leading-none text-[9px] mb-1">เริ่มงาน</span>
                          <span className="text-slate-700 font-extrabold">
                            {m?.startDate ? new Date(m.startDate).toLocaleDateString('th-TH', { year: '2-digit', month: 'short' }) : '-'}
                          </span>
                        </div>
                      </div>

                      {/* Contact Details */}
                      <div className="w-full space-y-1.5 text-left text-xs text-slate-500 pt-3 border-t border-slate-100 mt-3">
                        <div className="flex items-center gap-2">
                          <MailIcon size={12} className="text-slate-400 shrink-0" />
                          <span className="truncate font-medium">{m?.email || '-'}</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <PhoneIcon size={12} className="text-slate-400 shrink-0" />
                          <span className="font-extrabold text-slate-700">{m?.phone || '-'}</span>
                        </div>
                      </div>
                    </div>

                    {/* Action Buttons */}
                    <div className="flex justify-end gap-2 w-full mt-4 pt-3 border-t border-slate-100">
                      <button
                        onClick={(e) => { e.stopPropagation(); handleOpenEdit(m); }}
                        title="แก้ไข"
                        className="text-blue-500 hover:text-blue-700 hover:bg-blue-50 p-2 rounded-xl border border-slate-200 shadow-sm transition-all"
                      >
                        <Edit size={14}/>
                      </button>
                      {isAdmin && (
                        <button
                          onClick={(e) => { e.stopPropagation(); setConfirmDelete({ show: true, id: m.id, title: m.name }); }}
                          title="ลบ"
                          className="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-xl border border-slate-200 shadow-sm transition-all"
                        >
                          <Trash2 size={14}/>
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
              {searchedMembers.length === 0 && (
                <div className="col-span-full py-16 text-center text-slate-400 font-bold text-base bg-white rounded-3xl border border-dashed border-slate-300">
                  ไม่พบข้อมูลที่ค้นหา
                </div>
              )}
            </div>
          </div>
        );
    };

    // ==========================================
    // 🏢 ส่วนจัดการข้อมูลทีมสังกัด (Business Teams Management View)
    // ==========================================
    const BusinessTeamsManagementView = ({ businessTeams, setBusinessTeams, members, isAdmin, showToast }) => {
        const [showModal, setShowModal] = useState(false);
        const [editingTeam, setEditingTeam] = useState(null);
        const [teamName, setTeamName] = useState('');
        const [isSubmitting, setIsSubmitting] = useState(false);
        const [searchTerm, setSearchTerm] = useState('');
        const [confirmDelete, setConfirmDelete] = useState({ show: false, id: null, title: '' });

        const filteredTeams = useMemo(() => {
            const query = (searchTerm || '').trim().toUpperCase();
            return (businessTeams || []).filter(t => {
                if (!t) return false;
                return query === '' || (t.id && t.id.toUpperCase().includes(query)) || (t.name && t.name.toUpperCase().includes(query));
            });
        }, [businessTeams, searchTerm]);

        const getMemberCount = (teamId, teamName) => {
            return (members || []).filter(m => {
                if (!m || !m.team) return false;
                const tUpper = m.team.trim().toUpperCase();
                return tUpper === safeUpper(teamId) || tUpper === safeUpper(teamName);
            }).length;
        };

        const handleOpenAdd = () => {
            setEditingTeam(null);
            setTeamName('');
            setShowModal(true);
        };

        const handleOpenEdit = (team) => {
            setEditingTeam(team);
            setTeamName(team.name || '');
            setShowModal(true);
        };

        const handleSave = (e) => {
            e.preventDefault();
            if (!teamName.trim()) { showToast('กรุณาระบุชื่อทีม', 'error'); return; }
            setIsSubmitting(true);

            if (editingTeam) {
                if (typeof google !== 'undefined' && google.script) {
                    google.script.run
                        .withSuccessHandler(() => {
                            setBusinessTeams(prev => prev.map(t => t.id === editingTeam.id ? { ...t, name: teamName.trim() } : t));
                            setIsSubmitting(false);
                            setShowModal(false);
                            showToast('แก้ไขชื่อทีมสำเร็จ!', 'success');
                        })
                        .withFailureHandler(err => {
                            setIsSubmitting(false);
                            showToast('เกิดข้อผิดพลาด: ' + (err.message || err), 'error');
                        })
                        .updateBusinessTeam(editingTeam.id, teamName.trim());
                } else {
                    setBusinessTeams(prev => prev.map(t => t.id === editingTeam.id ? { ...t, name: teamName.trim() } : t));
                    setIsSubmitting(false);
                    setShowModal(false);
                    showToast('แก้ไขชื่อทีมสำเร็จ (จำลอง)', 'success');
                }
            } else {
                if (typeof google !== 'undefined' && google.script) {
                    google.script.run
                        .withSuccessHandler((resJson) => {
                            try {
                                const newTeam = JSON.parse(resJson);
                                setBusinessTeams(prev => [...prev, newTeam]);
                            } catch(e){}
                            setIsSubmitting(false);
                            setShowModal(false);
                            showToast('เพิ่มทีมใหม่สำเร็จ!', 'success');
                        })
                        .withFailureHandler(err => {
                            setIsSubmitting(false);
                            showToast('เกิดข้อผิดพลาด: ' + (err.message || err), 'error');
                        })
                        .saveBusinessTeam(teamName.trim());
                } else {
                    const newTeam = { id: 'TB' + Math.floor(Math.random()*100), name: teamName.trim(), status: 'ใช้งาน' };
                    setBusinessTeams(prev => [...prev, newTeam]);
                    setIsSubmitting(false);
                    setShowModal(false);
                    showToast('เพิ่มทีมใหม่สำเร็จ (จำลอง)', 'success');
                }
            }
        };

        const handleToggleStatus = (team) => {
            const currentStatus = team.status || 'ใช้งาน';
            const newStatus = (currentStatus === 'ปิดใช้งาน' || currentStatus === 'Disabled') ? 'ใช้งาน' : 'ปิดใช้งาน';
            
            setBusinessTeams(prev => prev.map(t => t.id === team.id ? { ...t, status: newStatus } : t));

            if (typeof google !== 'undefined' && google.script) {
                google.script.run
                    .withSuccessHandler(() => {
                        showToast(`เปลี่ยนสถานะทีม "${team.name}" เป็น ${newStatus} เรียบร้อยแล้ว`, 'info');
                    })
                    .withFailureHandler(err => {
                        showToast('เกิดข้อผิดพลาด: ' + (err.message || err), 'error');
                    })
                    .updateBusinessTeam(team.id, null, newStatus);
            } else {
                showToast(`เปลี่ยนสถานะทีม "${team.name}" เป็น ${newStatus} (จำลอง)`, 'info');
            }
        };

        const executeDelete = () => {
            const id = confirmDelete.id;
            if (typeof google !== 'undefined' && google.script) {
                google.script.run
                    .withSuccessHandler(() => {
                        setBusinessTeams(prev => prev.filter(t => t.id !== id));
                        setConfirmDelete({ show: false, id: null, title: '' });
                        showToast('ลบทีมสำเร็จ!', 'success');
                    })
                    .withFailureHandler(err => {
                        showToast('เกิดข้อผิดพลาดในการลบทีม: ' + err, 'error');
                    })
                    .deleteBusinessTeam(id);
            } else {
                setBusinessTeams(prev => prev.filter(t => t.id !== id));
                setConfirmDelete({ show: false, id: null, title: '' });
                showToast('ลบทีมสำเร็จ (จำลอง)', 'success');
            }
        };

        return (
            <div className="space-y-6 animation-fade-in">
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                        <h2 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2">🏢 จัดการข้อมูลทีมสังกัด (Business Teams)</h2>
                        <p className="text-xs font-bold text-slate-400 mt-1">กำหนดและจัดการรายชื่อทีมสังกัดพนักงานทั้งหมดในองค์กร (สวิตช์เปิด/ปิด เพื่อแสดงหรือซ่อนในหน้าหลัก)</p>
                    </div>
                    {isAdmin && (
                        <button onClick={handleOpenAdd} className={btnClassPrimary + " flex items-center gap-2"}>
                            <Plus size={16}/> เพิ่มทีมใหม่
                        </button>
                    )}
                </div>

                <div className={`${boxWrapper} py-4`}>
                    <div className="flex items-center bg-slate-50/30 focus-within:bg-white border border-slate-200 rounded-xl px-3 shadow-sm focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-100 transition-all duration-300 w-full max-w-md h-[40px]">
                        <SearchIcon size={18} className="text-slate-400 shrink-0" />
                        <input type="text" placeholder="ค้นหาชื่อทีมหรือรหัส..." className="w-full bg-transparent border-none outline-none text-[13px] font-medium text-slate-800 placeholder-slate-400 pl-2 h-full" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                    </div>
                </div>

                <div className={`${boxWrapper} p-0 overflow-hidden`}>
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse min-w-[700px]">
                            <thead>
                                <tr className="bg-slate-100 border-b border-slate-200">
                                    <th className={thBase}>รหัสทีม</th>
                                    <th className={thBase}>ชื่อทีมสังกัด</th>
                                    <th className={`${thBase} text-center`}>จำนวนสมาชิกพนักงาน</th>
                                    <th className={`${thBase} text-center`}>สถานะการใช้งาน</th>
                                    {isAdmin && <th className={`${thBase} text-center w-24`}>จัดการ</th>}
                                </tr>
                            </thead>
                            <tbody>
                                {filteredTeams.map((team, idx) => {
                                    const mCount = getMemberCount(team.id, team.name);
                                    const isTeamDisabled = team.status === 'ปิดใช้งาน' || team.status === 'Disabled';
                                    return (
                                        <tr key={team.id || idx} className={`border-b border-slate-100 transition-colors ${isTeamDisabled ? 'bg-slate-50/60 opacity-85' : 'hover:bg-slate-50'}`}>
                                            <td className="p-4 text-sm font-bold text-blue-600 whitespace-nowrap">{team.id}</td>
                                            <td className="p-4 text-sm font-black text-slate-800 flex items-center gap-2">
                                                {team.name}
                                                {isTeamDisabled && <span className="text-[10px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded font-bold">ซ่อนจากหน้าหลัก</span>}
                                            </td>
                                            <td className="p-4 text-center">
                                                <span className="px-3 py-1 bg-indigo-50 text-indigo-700 font-bold rounded-full text-xs border border-indigo-200">
                                                    {mCount} คน
                                                </span>
                                            </td>
                                            <td className="p-4 text-center">
                                                <button 
                                                    type="button"
                                                    onClick={() => handleToggleStatus(team)}
                                                    className={`px-3.5 py-1.5 rounded-full text-xs font-black transition-all shadow-sm flex items-center gap-1.5 mx-auto cursor-pointer ${
                                                        isTeamDisabled
                                                        ? 'bg-slate-200 text-slate-600 hover:bg-slate-300 border border-slate-300'
                                                        : 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200 border border-emerald-300'
                                                    }`}
                                                    title="คลิกเพื่อเปิดหรือปิดการใช้งานทีมนี้ในหน้าหลัก"
                                                >
                                                    <span className={`w-2 h-2 rounded-full ${isTeamDisabled ? 'bg-slate-500' : 'bg-emerald-500 animate-pulse'}`}></span>
                                                    {isTeamDisabled ? '🔴 ปิดใช้งาน (ซ่อนอยู่)' : '🟢 เปิดใช้งาน'}
                                                </button>
                                            </td>
                                            {isAdmin && (
                                                <td className="p-2 text-center border-l border-slate-100">
                                                    <div className="flex justify-center items-center gap-1.5">
                                                        <button onClick={() => handleOpenEdit(team)} className="w-8 h-8 flex justify-center items-center bg-white hover:bg-blue-50 text-blue-600 rounded-lg border border-slate-200 shadow-sm transition-all">
                                                            <Edit size={14}/>
                                                        </button>
                                                        <button onClick={() => setConfirmDelete({ show: true, id: team.id, title: team.name })} className="w-8 h-8 flex justify-center items-center bg-white hover:bg-red-50 text-red-600 rounded-lg border border-slate-200 shadow-sm transition-all">
                                                            <Trash2 size={14}/>
                                                        </button>
                                                    </div>
                                                </td>
                                            )}
                                        </tr>
                                    );
                                })}
                                {filteredTeams.length === 0 && (
                                    <tr><td colSpan="5" className="p-12 text-center text-slate-400 font-bold">ไม่พบข้อมูลทีมสังกัดตามเงื่อนไขที่ค้นหา</td></tr>
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>

                <EditModal isOpen={showModal} onClose={() => setShowModal(false)} title={editingTeam ? 'แก้ไขข้อมูลทีมสังกัด' : 'เพิ่มทีมสังกัดใหม่'} icon={Briefcase} maxWidthClass="max-w-md">
                    <form onSubmit={handleSave} className="space-y-4">
                        <div>
                            <label className={labelClassHud}>ชื่อทีมสังกัด</label>
                            <input type="text" placeholder="ระบุชื่อทีม เช่น Marketing, Center..." className={inputClassHud} value={teamName} onChange={e => setTeamName(e.target.value)} required />
                        </div>
                        <div className="flex justify-end gap-3 pt-3">
                            <button type="button" onClick={() => setShowModal(false)} className="px-5 py-2.5 rounded-xl font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 text-xs">ยกเลิก</button>
                            <button type="submit" disabled={isSubmitting} className={btnClassPrimary}>
                                {isSubmitting ? 'กำลังบันทึก...' : 'บันทึกข้อมูลทีม'}
                            </button>
                        </div>
                    </form>
                </EditModal>

                <ConfirmModal isOpen={confirmDelete.show} onClose={() => setConfirmDelete({ show: false, id: null, title: '' })} onConfirm={executeDelete} title="ยืนยันการลบทีมสังกัด" message={`คุณแน่ใจหรือไม่ว่าต้องการลบทีม "${confirmDelete.title}" ออกจากระบบ?`} />
            </div>
        );
    };

    // ==========================================
    // 📌 React App (Main Component)
    // ==========================================
    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);

      const [activeSubTab, setActiveSubTab] = useState(() => {
        try {
          const initTab = "<?= getInitialTab() ?>".toLowerCase();
          if (initTab === 'business_teams' || initTab === 'business_team' || initTab === 'teams') {
            return 'business_teams';
          }
        } catch(e) {}
        return 'members';
      });

      const [products, setProducts] = useState([]);
      const [customerTypes, setCustomerTypes] = useState(fallbackCustomerTypes);
      const [closers, setClosers] = useState([]);
      const [members, setMembers] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [sales, setSales] = useState([]);
      const [systemUsers, setSystemUsers] = useState([]);
      const [businessTeams, setBusinessTeams] = useState([]);
      const [isAppLoading, setIsAppLoading] = useState(true);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch (e) { return false; }
      });

      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const showToast = (message, type = 'success') => { setToast({ show: true, message, type }); };

      const SCRIPT_URL = (() => {
  try {
    if (window.top && window.top.location && window.top.location.href) {
      const base = window.top.location.href.split('?')[0];
      if (base && base.startsWith('http')) return base;
    }
  } catch(e) {}
  return "<?= getScriptUrl() ?>";
})();

      const isAdmin = currentUser && (
          String(currentUser.role).trim() === 'ผู้ดูแลระบบ' ||
          String(currentUser.role).trim().toLowerCase() === 'admin'
      );
      const currentUserProfileUrl = currentUser?.profileUrl || '';

      useEffect(() => {
        const savedUserStr = localStorage.getItem('stk_current_user');
        if (savedUserStr) {
          try {
            const user = JSON.parse(savedUserStr);
            setCurrentUser(user);
            setIsLoggedIn(true);
          } catch (e) { localStorage.removeItem('stk_current_user'); }
        } else {
          setShowLoginModal(true);
        }

        const initialLoader = document.getElementById('initial-loader');
        if (initialLoader) initialLoader.style.display = 'none';

        if (typeof google !== 'undefined' && google.script) {
           try {
               const cachedData = localStorage.getItem('stk_app_cache_data');
               if (cachedData) {
                   applyDataToStates(JSON.parse(cachedData));
                   setIsAppLoading(false);
               }
           } catch (e) { console.warn("Cache error", e); }

           google.script.run
             .withSuccessHandler((response) => {
                if (response) {
                    try { localStorage.setItem('stk_app_cache_data', JSON.stringify(response)); } catch (e) {}
                    applyDataToStates(response);
                }
                setIsAppLoading(false);
             })
             .withFailureHandler((error) => {
                setIsAppLoading(false);
                showToast('การเชื่อมต่อเซิร์ฟเวอร์ขัดข้อง: ' + (error ? (error.message || error) : ''), 'error');
             })
             .getInitialData();
        } else {
           // Load real data directly from Supabase
           Promise.all([
             supabaseSelect('stk_products').catch(() => supabaseSelect('products')),
             supabaseSelect('stk_customer_types').catch(() => supabaseSelect('customer_types')),
             supabaseSelect('stk_closers').catch(() => supabaseSelect('closers')),
             supabaseSelect('stk_members').catch(() => supabaseSelect('members')),
             supabaseSelect('stk_business_teams').catch(() => supabaseSelect('business_teams'))
           ]).then(([pRes, typeRes, cloRes, memRes, teamRes]) => {
             const resObj = {
               products: pRes,
               customerTypes: typeRes,
               closers: cloRes,
               members: memRes,
               businessTeams: teamRes
             };
             applyDataToStates(resObj);
           }).catch(err => {
             console.error("Supabase load error:", err);
           }).finally(() => {
             setIsAppLoading(false);
           });
        }
      }, []);

      const applyDataToStates = (response) => {
           if (Array.isArray(response.products)) setProducts(response.products);
           if (Array.isArray(response.customerTypes)) setCustomerTypes(response.customerTypes);
           if (Array.isArray(response.closers)) setClosers(response.closers);
           if (Array.isArray(response.members)) {
               const formattedMembers = response.members.map(m => ({
                   id: String(m.id || m.user_id || m.User_ID || '').trim(),
                   name: String(m.name || m.Name || '').trim(),
                   referrer: String(m.referrer || m.sponsor_id || m.Sponsor_ID || '').trim(),
                   team: String(m.team || m.business_team || m.Business_Team || 'Marketing').trim(),
                   role: String(m.role || m.permission_role || m.Permission_Role || 'Staff').trim(),
                   status: String(m.status || m.Status || 'ทำงานอยู่').trim(),
                   profileUrl: m.profile_url || m.id_card_url || m.ID_Card_URL || '',
                   phone: m.phone || m.phone_number || m.Phone_Number || '',
                   email: m.email || m.Email || '',
                   lineId: m.line_id || m.LINE_ID || '',
                   bankName: m.bank_name || m.Bank_Name || '',
                   bankAccountNo: m.bank_account_no || m.Bank_Account_No || '',
                   bankAccountName: m.bank_account_name || m.Bank_Account_Name || '',
                   accumulatedPV: Number(m.accumulated_pv || m.Accumulated_PV || 0)
               })).filter(m => m.id !== '');
               setMembers(formattedMembers);
           }
           if (Array.isArray(response.customers)) setCustomers(response.customers);
           if (Array.isArray(response.systemUsers)) setSystemUsers(response.systemUsers);
           if (Array.isArray(response.businessTeams)) setBusinessTeams(response.businessTeams);
           if (Array.isArray(response.sales)) {
               const processedSales = response.sales.map(s => {
                   let sumF = 0, sumP = 0, sumZ = 0;
                   Object.keys(s).forEach(k => {
                       if (k !== 'รวมชิ้นราคาเต็ม' && k !== 'รวมชิ้นราคาโปร' && k !== 'รวมชิ้นราคาศูนย์' && k !== 'ยอดรวมชิ้นทั้งหมด') {
                           if (k.endsWith('_ราคาเต็ม')) sumF += (parseInt(s[k]) || 0);
                           else if (k.endsWith('_ราคาโปร')) sumP += (parseInt(s[k]) || 0);
                           else if (k.endsWith('_ราคาศูนย์')) sumZ += (parseInt(s[k]) || 0);
                       }
                   });
                   s['รวมชิ้นราคาเต็ม'] = sumF; s['รวมชิ้นราคาโปร'] = sumP; s['รวมชิ้นราคาศูนย์'] = sumZ;
                   s['ยอดรวมชิ้นทั้งหมด'] = sumF + sumP + sumZ;
                   return s;
               });
               setSales(processedSales);
           }
      };

      const handleLoginSuccess = (user) => {
        localStorage.setItem('stk_current_user', JSON.stringify(user));
        setCurrentUser(user);
        setIsLoggedIn(true);
        setShowLoginModal(false);
        showToast('เข้าสู่ระบบสำเร็จ!', 'success');
      };

      const handleLogout = () => {
        localStorage.removeItem('stk_current_user');
        setCurrentUser(null);
        setIsLoggedIn(false);
        if (typeof window !== 'undefined') window.open(resolvePageUrl(SCRIPT_URL + '?page=dashboard'), '_top');
      };

      return (
        <div className="min-h-screen flex flex-col lg:flex-row font-sans bg-slate-50">
          <Sidebar
            activePage={activeSubTab === 'business_teams' ? 'business_teams' : 'team'}
            onSubTabChange={(sub) => setActiveSubTab(sub)}
            isLoggedIn={isLoggedIn}
            currentUser={currentUser}
            currentUserProfileUrl={currentUserProfileUrl}
            isAdmin={isAdmin}
            onLogout={handleLogout}
            showLoginModal={showLoginModal}
            setShowLoginModal={setShowLoginModal}
            SCRIPT_URL={SCRIPT_URL}
            setIsAppLoading={setIsAppLoading}
            isSidebarCollapsed={isSidebarCollapsed}
            setIsSidebarCollapsed={setIsSidebarCollapsed}
          />

          <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>

            {toast.show && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4 animation-fade-in" style={{ animationDuration: '0.2s' }}>
                 <div className={`bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center animation-pop border-t-4 ${toast.type === 'error' ? 'border-red-500' : toast.type === 'info' ? 'border-blue-500' : 'border-emerald-500'}`}>
                    <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${toast.type === 'error' ? 'bg-red-100 text-red-500' : toast.type === 'info' ? 'bg-blue-100 text-blue-500' : 'bg-emerald-100 text-emerald-500'}`}>
                       {toast.type === 'error' ? <X size={32} /> : toast.type === 'info' ? <Trophy size={32} /> : <CheckCircle size={32} />}
                    </div>
                    <h3 className="text-xl font-bold text-slate-800 mb-2">{toast.type === 'error' ? 'เกิดข้อผิดพลาด' : toast.type === 'info' ? 'แจ้งเตือน' : 'สำเร็จ!'}</h3>
                    <p className="text-slate-600 font-medium text-sm mb-6">{toast.message}</p>
                    <button onClick={() => setToast({ ...toast, show: false })} className="w-full py-2.5 rounded-lg font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">ตกลง</button>
                 </div>
              </div>
            )}

            <div className="p-3 sm:p-6 flex-1 w-full relative z-0 space-y-4">
              <div className="w-full relative z-10">
                {isAppLoading ? (
                  <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                    <div className="w-16 h-16 border-[4px] border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                    <h2 className="text-lg font-bold text-slate-700">กำลังซิงค์ข้อมูลกับฐานข้อมูล...</h2>
                    <p className="text-slate-500 text-sm">กรุณารอสักครู่ ระบบกำลังดึงข้อมูลล่าสุด</p>
                  </div>
                ) : isLoggedIn ? (
                  activeSubTab === 'business_teams' ? (
                    <BusinessTeamsManagementView
                      businessTeams={businessTeams}
                      setBusinessTeams={setBusinessTeams}
                      members={members}
                      isAdmin={isAdmin}
                      showToast={showToast}
                    />
                  ) : (
                    <TeamManagementView
                      members={members}
                      setMembers={setMembers}
                      businessTeams={businessTeams}
                      isAdmin={isAdmin}
                      showToast={showToast}
                      sales={sales}
                      products={products}
                      currentUser={currentUser}
                    />
                  )
                ) : (
                  <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                    <h2 className="text-xl font-black text-red-500">กรุณาเข้าสู่ระบบก่อนใช้งาน</h2>
                    <button onClick={() => setShowLoginModal(true)} className={btnClassPrimary}>เข้าสู่ระบบ</button>
                  </div>
                )}
              </div>
            </div>

            <footer className="w-full text-center py-6 mt-auto border-t border-slate-200/50 no-print shrink-0">
               <p className="text-[11px] font-bold text-slate-400 opacity-60 hover:opacity-100 transition-opacity">
                  &copy; {new Date().getFullYear()} STK Sales Management System. Developed by Sackda Southammavong.
               </p>
            </footer>
          </main>

          <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={systemUsers} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
