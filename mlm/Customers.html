  <!-- Standalone & GAS Libraries -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Sans+Lao:wght@400;500;600;700&display=swap');
    body { font-family: 'Sukhumvit Set', 'Sarabun', 'Noto Sans Lao', sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; padding: 0; width: 100%; max-width: 100vw; overflow-x: hidden; }
    @media (min-width: 1024px) {

  <script>(function(){var w=console.warn;console.warn=function(){var m=arguments[0]?String(arguments[0]):'';if(m.includes('cdn.tailwindcss.com')||m.includes('in-browser Babel transformer'))return;w.apply(console,arguments);};})();</script>

  <script>
    window.SUPABASE_URL      = 'https://mfpkeyrykqnrywyksyqp.supabase.co';
    window.SUPABASE_ANON_KEY = 'sb_publishable_807NIkuj6MAs1KZY-m4tug_Fm1Mk-AO';
    window.SUPABASE_REST_URL = window.SUPABASE_URL + '/rest/v1';
    window.SUPABASE_HEADERS  = {
      'Content-Type' : 'application/json',
      'apikey'       : window.SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + window.SUPABASE_ANON_KEY,
      'Prefer'       : 'return=representation'
    };
    if (typeof supabase !== 'undefined') {
      window.supabaseClient = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      console.log('%c✅ Supabase Connected!', 'color:green;font-weight:bold', window.SUPABASE_URL);
    }
    async function supabaseSelect(t,q){var r=await fetch(window.SUPABASE_REST_URL+'/'+t+(q?'?'+q:''),{method:'GET',headers:window.SUPABASE_HEADERS});if(!r.ok)throw new Error('SELECT '+t+':'+r.status);return r.json();}
    async function supabaseInsert(t,d){var r=await fetch(window.SUPABASE_REST_URL+'/'+t,{method:'POST',headers:window.SUPABASE_HEADERS,body:JSON.stringify(d)});if(!r.ok)throw new Error('INSERT '+t+':'+r.status);return r.json();}
    async function supabaseUpdate(t,id,d,pk='id'){var r=await fetch(window.SUPABASE_REST_URL+'/'+t+'?'+pk+'=eq.'+encodeURIComponent(id),{method:'PATCH',headers:window.SUPABASE_HEADERS,body:JSON.stringify(d)});if(!r.ok)throw new Error('UPDATE '+t+':'+r.status);return r.json();}
    async function supabaseDelete(t,id){var r=await fetch(window.SUPABASE_REST_URL+'/'+t+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:Object.assign({},window.SUPABASE_HEADERS,{'Prefer':'return=minimal'})});if(!r.ok)throw new Error('DELETE '+t+':'+r.status);return true;}
    async function supabaseUpsert(t,d){var r=await fetch(window.SUPABASE_REST_URL+'/'+t,{method:'POST',headers:Object.assign({},window.SUPABASE_HEADERS,{'Prefer':'resolution=merge-duplicates,return=representation'}),body:JSON.stringify(d)});if(!r.ok)throw new Error('UPSERT '+t+':'+r.status);return r.json();}
  </script>
  <script src="CommonComponents.js"></script>

    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() { var l=document.getElementById('initial-loader'); if(l)l.style.display='none'; }, 600);

<body class="antialiased overflow-x-hidden selection:bg-blue-600 selection:text-white">

  <div id="initial-loader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999;">
    <div style="width: 60px; height: 60px; border: 4px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: initial-spin 1s linear infinite; margin-bottom: 24px;"></div>
    <style>@keyframes initial-spin { to { transform: rotate(360deg); } }</style>
    <h2 style="font-size: 1.75rem; font-weight: 800; color: #1e40af; margin: 0; letter-spacing: -0.025em;">LOVE <span style="color: #475569;">STK GROUPE</span></h2>
    <p style="font-size: 0.875rem; color: #64748b; font-weight: 500; margin-top: 8px;">กำลังโหลดระบบจัดการข้อมูล...</p>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;
    const { 
      LayoutDashboard, ShoppingCart, Users, Contact, Headset, BarChart3, Plus, Edit, Trash2, UserCircle, Menu, X, Save, Info, PackageIcon, Package, Target, Trophy, Activity, Eye, Tags, CheckCircle, GitBranch, Archive, ChevronDown, FileText, SettingsIcon, Coins, ShieldCheck, AlertTriangle, AlertCircle, 
      Toast, Sidebar, Header, LoginModal, DonutChart, ConfirmModal, EditModal, AutoSuggestInput, SearchIcon,
      getUserPagePermission, resolvePageUrl, fallbackCustomerTypes, fallbackProductsList
    } = window;

    const getLocalISODate = (d = new Date()) => {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const safeUpper = (val) => String(val || '').trim().toUpperCase();

    // ==========================================
    // 📌 Customer Management View Component
    // ==========================================
    const CustomerManagementView = ({ sales, customers, members, closers, activeCustomerTypes, setCustomers, showToast, isAdmin }) => {
        const [activeCustTab, setActiveCustTab] = useState('allData'); 
        const [rankingModal, setRankingModal] = useState(null); 
        const todayStr = getLocalISODate();
        const firstDayOfMonthStr = `${todayStr.substring(0, 7)}-01`;
        const [statStartDate, setStatStartDate] = useState(firstDayOfMonthStr);
        const [statEndDate, setStatEndDate] = useState(todayStr); 
        const [memberFilter, setMemberFilter] = useState('All');
        const [viewCustomer, setViewCustomer] = useState(null);
        
        const [searchAllData, setSearchAllData] = useState(''); 
        const [teamFilter, setTeamFilter] = useState('All');
        
        const [editCustData, setEditCustData] = useState(null);
        const [isSubmitting, setIsSubmitting] = useState(false);
        const [confirmDeleteCust, setConfirmDeleteCust] = useState({ show: false, id: null, title: '' });
        const [showAddCustModal, setShowAddCustModal] = useState(false);
        const [newCustData, setNewCustData] = useState({ id: '', name: '', phone: '', lineId: '', type: '', symptom: '', closer: '', memberId: '', memberName: '' });
        const [isAddingCust, setIsAddingCust] = useState(false);

        const handleOpenAddCustomer = () => {
            let nextIdNum = 1;
            const cIds = (customers || []).map(c => { const match = c && c.id && c.id.match(/^C(\d+)$/i); return match ? parseInt(match[1], 10) : 0; });
            if (cIds.length > 0) nextIdNum = Math.max(...cIds) + 1;
            setNewCustData({ 
                id: "C" + nextIdNum.toString().padStart(3, '0'), 
                name: '', phone: '', lineId: '', type: activeCustomerTypes.length > 0 ? activeCustomerTypes[0].name : '', 
                symptom: '', closer: '', memberId: '', memberName: '' 
            });
            setShowAddCustModal(true);
        };

        const handleSaveNewCustomer = async (e) => {
            e.preventDefault();
            if(!newCustData.name) { showToast('กรุณากรอกชื่อลูกค้า', 'error'); return; }
            setIsAddingCust(true);
            
            const mFull = (members || []).find(m => m && String(m.id).toUpperCase() === String(newCustData.memberId).toUpperCase());
            const finalData = { ...newCustData, memberName: mFull ? mFull.name : newCustData.memberId };

            const supaPayload = {
                customer_id: finalData.id,
                name: finalData.name,
                phone: finalData.phone || '',
                line_id: finalData.lineId || '',
                type: finalData.type || '',
                symptom: finalData.symptom || '',
                closer: finalData.closer || '',
                member_id: finalData.memberId || '',
                member_name: finalData.memberName || ''
            };

            let savedOk = false;
            if (window.supabaseClient) {
                try {
                    const { error } = await window.supabaseClient.from('stk_customers').insert(supaPayload);
                    if (!error) savedOk = true;
                } catch(e) {}
            }

            if (!savedOk) {
                try {
                    await supabaseInsert('stk_customers', supaPayload).catch(() => supabaseInsert('customers', supaPayload));
                } catch (err) {
                    console.warn("Supabase insert fallback", err);
                }
            }

            setCustomers([finalData, ...(customers || [])]);
            setShowAddCustModal(false);
            setIsAddingCust(false);
            showToast('เพิ่มข้อมูลลูกค้าใหม่สำเร็จ!', 'success');
        };

        const handleSaveCust = async (e) => {
            e.preventDefault();
            setIsSubmitting(true);
            const mFull = (members || []).find(m => m && String(m.id).toUpperCase() === String(editCustData.memberId || '').toUpperCase());
            const finalData = { ...editCustData, memberName: mFull ? mFull.name : editCustData.memberId };

            const supaPayload = {
                customer_id: finalData.id,
                id: finalData.id,
                name: finalData.name,
                customer_name: finalData.name,
                phone: finalData.phone || '',
                phone_number: finalData.phone || '',
                line_id: finalData.lineId || '',
                type: finalData.type || '',
                customer_type: finalData.type || '',
                symptom: finalData.symptom || '',
                symptom_disease: finalData.symptom || '',
                closer: finalData.closer || '',
                closer_id: finalData.closer || '',
                member_id: finalData.memberId || '',
                owner_member_id: finalData.memberId || '',
                member_name: finalData.memberName || ''
            };

            let savedOk = false;
            if (window.supabaseClient) {
                try {
                    const { error } = await window.supabaseClient.from('stk_customers').update(supaPayload).eq('customer_id', finalData.id);
                    if (!error) savedOk = true;
                    else {
                        const { error: err2 } = await window.supabaseClient.from('stk_customers').update(supaPayload).eq('id', finalData.id);
                        if (!err2) savedOk = true;
                    }
                } catch(e) {}
            }

            if (!savedOk) {
                try {
                    await supabaseUpdate('stk_customers', finalData.id, supaPayload, 'customer_id');
                    savedOk = true;
                } catch (err) {
                    try {
                        await supabaseUpdate('stk_customers', finalData.id, supaPayload, 'id');
                        savedOk = true;
                    } catch(e2){}
                }
            }

            setCustomers(customers.map(c => c.id === editCustData.id ? finalData : c));
            setEditCustData(null);
            setIsSubmitting(false);
            showToast('อัปเดตข้อมูลลูกค้าสำเร็จ!', 'success');
        };

        const executeDeleteCust = async () => {
            const id = confirmDeleteCust.id;
            try {
                await supabaseDelete('stk_customers', id).catch(() => supabaseDelete('customers', id));
                setCustomers(customers.filter(c => c.id !== id));
                setConfirmDeleteCust({ show: false, id: null, title: '' });
                showToast('ลบข้อมูลลูกค้าสำเร็จ', 'success');
            } catch (err) {
                console.error("Delete customer error:", err);
                showToast('เกิดข้อผิดพลาดในการลบข้อมูล: ' + err.message, 'error');
            }
        };

        const filteredSalesInPeriod = useMemo(() => {
            return (sales || []).filter(s => {
                if (!s) return false;
                const sDate = s.date || s.sale_date || '';
                const inDateRange = (!statStartDate || sDate >= statStartDate) && (!statEndDate || sDate <= statEndDate);
                const sellerId = String(s.sellerId || s.seller_id || s.seller || s.memberId || '').trim().toUpperCase();
                const matchMember = memberFilter === 'All' || sellerId === memberFilter.toUpperCase();
                return inDateRange && matchMember;
            });
        }, [sales, statStartDate, statEndDate, memberFilter]);

        const customerSalesStatsFiltered = useMemo(() => {
            const stats = {};
            filteredSalesInPeriod.forEach(s => {
                const cid = String(s.customerId || s.customer_id || s.customer || '').trim(); 
                if (!cid) return;
                if (!stats[cid]) { stats[cid] = { count: 0, dates: [] }; }
                stats[cid].count += 1; 
                if (s.date || s.sale_date) stats[cid].dates.push(s.date || s.sale_date);
            });
            Object.keys(stats).forEach(cid => {
                const uniqueDates = [...new Set(stats[cid].dates)].sort((a, b) => b.localeCompare(a));
                stats[cid].lastVisit = uniqueDates.length > 0 ? uniqueDates[0] : '-';
                stats[cid].prevVisit = uniqueDates.length > 1 ? uniqueDates[1] : '-';
            });
            return stats;
        }, [filteredSalesInPeriod]);

        const customerStats = useMemo(() => {
          let stats = { types: {}, newMemberRankings: {}, consultMemberRankings: {}, returnRankings: {}, teleMemberRankings: {}, topCloserARankings: {}, topCloserBRankings: {} };
          (activeCustomerTypes || []).forEach(t => { if (t && t.name) stats.types[t.name] = 0; });

          const uniqueCustIds = [...new Set(filteredSalesInPeriod.map(s => String(s.customerId || s.customer_id || '').trim()).filter(Boolean))];
          uniqueCustIds.forEach(custId => {
            const c = (customers || []).find(cust => cust && String(cust.id).trim() === custId);
            if (c) {
              const cType = c.type || '';
              if (stats.types[cType] !== undefined) stats.types[cType]++; else stats.types[cType] = 1;

              const mFull = (members || []).find(m => m && String(m.id).trim().toUpperCase() === String(c.memberId).trim().toUpperCase());
              const mName = mFull ? mFull.name : (c.memberName || c.memberId);
              const isOld = cType.includes('เก่า'); const isConsult = cType.includes('ปรึกษา'); const isTele = cType.includes('โทร');
              const isNew = cType.includes('ใหม่') || (!isOld && !isConsult && !isTele);

              if (mName) {
                 if (isNew) stats.newMemberRankings[mName] = (stats.newMemberRankings[mName] || 0) + 1;
                 else if (isConsult) stats.consultMemberRankings[mName] = (stats.consultMemberRankings[mName] || 0) + 1;
                 else if (isTele) stats.teleMemberRankings[mName] = (stats.teleMemberRankings[mName] || 0) + 1;
                 else if (isOld) stats.returnRankings[mName] = (stats.returnRankings[mName] || 0) + 1;
              }
              if (c.closer) {
                 const normalizedCloser = String(c.closer).trim().toUpperCase();
                 const closerObj = (closers || []).find(cl => cl && safeUpper(cl.name) === normalizedCloser);
                 let cTeam = closerObj ? closerObj.team : '';
                 if (cTeam === 'Marketing') stats.topCloserARankings[normalizedCloser] = (stats.topCloserARankings[normalizedCloser] || 0) + 1;
                 else if (cTeam === 'Center') stats.topCloserBRankings[normalizedCloser] = (stats.topCloserBRankings[normalizedCloser] || 0) + 1;
              }
            }
          });
          const sortObj = (obj) => Object.entries(obj).sort((a, b) => b[1] - a[1]);
          return { types: stats.types, totalVisits: filteredSalesInPeriod.length, totalUnique: uniqueCustIds.length, 
             newMemberRankings: sortObj(stats.newMemberRankings).slice(0, 5), fullNewMemberRankings: sortObj(stats.newMemberRankings),
             consultMemberRankings: sortObj(stats.consultMemberRankings).slice(0, 5), fullConsultMemberRankings: sortObj(stats.consultMemberRankings),
             teleMemberRankings: sortObj(stats.teleMemberRankings).slice(0, 5), fullTeleMemberRankings: sortObj(stats.teleMemberRankings),
             returnRankings: sortObj(stats.returnRankings).slice(0, 5), fullReturnRankings: sortObj(stats.returnRankings),
             topCloserARankings: sortObj(stats.topCloserARankings).slice(0, 5), fullTopCloserARankings: sortObj(stats.topCloserARankings),
             topCloserBRankings: sortObj(stats.topCloserBRankings).slice(0, 5), fullTopCloserBRankings: sortObj(stats.topCloserBRankings)
          };
        }, [customers, filteredSalesInPeriod, members, activeCustomerTypes, closers]);

        const topFrequentCustomers = useMemo(() => {
            return Object.keys(customerSalesStatsFiltered).map(cid => {
                const custDetails = (customers || []).find(c => c && String(c.id).trim() === cid) || {};
                return { id: cid, name: custDetails.name || 'ไม่ทราบชื่อ', type: custDetails.type || 'N/A', symptom: custDetails.symptom || '-', visitCount: customerSalesStatsFiltered[cid].count, lastVisit: customerSalesStatsFiltered[cid].lastVisit, prevVisit: customerSalesStatsFiltered[cid].prevVisit };
            }).sort((a, b) => b.visitCount - a.visitCount).slice(0, 10);
        }, [customerSalesStatsFiltered, customers]);

        const displayAllCustomers = useMemo(() => {
            return (customers || []).filter(c => {
                if (teamFilter !== 'All') {
                    const m = (members || []).find(mem => mem && String(mem.id).trim().toUpperCase() === String(c.memberId).trim().toUpperCase());
                    let t = m ? m.team : '';
                    if (t === 'Team A') t = 'Marketing';
                    if (t === 'Team B') t = 'Center';
                    if (t !== teamFilter) return false;
                }
                const search = searchAllData.toLowerCase();
                return (c.id && String(c.id).toLowerCase().includes(search)) || 
                       (c.name && String(c.name).toLowerCase().includes(search)) || 
                       (c.phone && String(c.phone).includes(search));
            });
        }, [customers, teamFilter, members, searchAllData]);

        const allDatabaseStats = useMemo(() => {
            const now = new Date(); const curMonthPrefix = getLocalISODate(now).substring(0, 7);
            const lastMonthPrefix = getLocalISODate(new Date(now.getFullYear(), now.getMonth() - 1, 1)).substring(0, 7);
            let uniqueCurNew = new Set(); let uniqueLastNew = new Set(); let uniqueCurReturn = new Set();

            (sales || []).forEach(s => {
               const cid = String(s.customerId || s.customer_id || '').trim();
               const c = (customers || []).find(cust => cust && String(cust.id).trim() === cid); if (!c) return;
               const cType = c.type || '';
               const sDate = s.date || s.sale_date || '';
               if (sDate.startsWith(curMonthPrefix)) { if (cType.includes('ใหม่')) uniqueCurNew.add(c.id); else if (cType.includes('เก่า')) uniqueCurReturn.add(c.id); } 
               else if (sDate.startsWith(lastMonthPrefix)) { if (cType.includes('ใหม่')) uniqueLastNew.add(c.id); }
            });
            return { total: (customers || []).length, newCur: uniqueCurNew.size, newLast: uniqueLastNew.size, returnCur: uniqueCurReturn.size };
        }, [sales, customers]);

        const rankingBox = (title, list, icon, unit, colorClass, borderColor, bgHeader) => (
            <div className="bg-white rounded-3xl p-5 border border-slate-100 shadow-sm flex flex-col justify-between space-y-4">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                    <div className="flex items-center gap-2 font-bold text-slate-800 text-xs">
                        <span>🏆</span>
                        <span>{title}</span>
                    </div>
                    <button 
                        onClick={() => setRankingModal({ title, list, icon, unit, colorClass })} 
                        className="text-[10px] text-blue-600 font-bold hover:underline"
                    >
                        ดูทั้งหมด
                    </button>
                </div>
                <div className="space-y-2">
                    {list.length > 0 ? list.map(([name, count], idx) => (
                        <div key={name} className="flex justify-between items-center text-xs font-bold">
                            <span className="text-slate-600 truncate max-w-[160px]">{idx + 1}. {name}</span>
                            <span className="text-blue-700 bg-blue-50 px-2 py-0.5 rounded-md font-mono">{count} {unit}</span>
                        </div>
                    )) : (
                        <span className="text-xs text-slate-400 font-bold block text-center py-2">ไม่มีข้อมูล</span>
                    )}
                </div>
            </div>
        );

        const renderCustomerGroupTable = (typeObj) => {
            const tName = typeObj.name;
            const groupCustomers = (customers || []).filter(c => c && c.type === tName);
            return (
                <div key={typeObj.id} className="bg-white rounded-3xl p-6 border border-slate-100 shadow-sm space-y-4 mb-6">
                    <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                        <h3 className="text-sm font-black text-slate-800 flex items-center gap-2">
                            <span>📁 ประเภท: {tName}</span>
                        </h3>
                        <span className="bg-blue-50 text-blue-700 font-bold text-xs px-3 py-1 rounded-full border border-blue-100">
                            จำนวน {groupCustomers.length} คน
                        </span>
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs whitespace-nowrap">
                            <thead className="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                                <tr>
                                    <th className="p-3">รหัส</th>
                                    <th className="p-3">ชื่อลูกค้า</th>
                                    <th className="p-3">เบอร์โทร</th>
                                    <th className="p-3">LINE ID</th>
                                    <th className="p-3">อาการ</th>
                                    <th className="p-3">ผู้ปิดการขาย</th>
                                    <th className="p-3">เจ้าของเคส</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100 font-bold">
                                {groupCustomers.length === 0 ? (
                                    <tr><td colSpan="7" className="p-6 text-center text-slate-400">ไม่มีข้อมูลลูกค้าในประเภทนี้</td></tr>
                                ) : (
                                    groupCustomers.map(c => (
                                        <tr key={c.id} className="hover:bg-slate-50">
                                            <td className="p-3 text-blue-600 font-mono">{c.id}</td>
                                            <td className="p-3 text-slate-800">{c.name}</td>
                                            <td className="p-3 text-slate-600 font-mono">{c.phone || '-'}</td>
                                            <td className="p-3 text-slate-600 font-mono">{c.lineId || '-'}</td>
                                            <td className="p-3 text-slate-600">{c.symptom || '-'}</td>
                                            <td className="p-3 text-indigo-600">{c.closer || '-'}</td>
                                            <td className="p-3 text-amber-600">{c.memberName || c.memberId || '-'}</td>
                                        </tr>
                                    ))
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        return (
            <div className="space-y-6 animation-fade-in pb-10 w-full">
                
                {/* 📌 Header Title Bar */}
                <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-100 w-full">
                    <div>
                        <h1 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-3">

                                </div>
                            ))}
                        </div>
                    )}
                </EditModal>
            </div>
        );
    };

    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      
      const [products, setProducts] = useState([]);
      const [customerTypes, setCustomerTypes] = useState(fallbackCustomerTypes);
      const [closers, setClosers] = useState([]);
      const [members, setMembers] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [sales, setSales] = useState([]);
      const [systemUsers, setSystemUsers] = useState([]);
      const [isAppLoading, setIsAppLoading] = useState(true);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch(e) { return false; }
      });
      
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const showToast = (message, type = 'success') => { setToast({ show: true, message, type }); };

      const isAdmin = currentUser && (
          String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || 
          String(currentUser.role).trim().toLowerCase() === 'admin'
      );
      const currentUserProfileUrl = currentUser?.profileUrl || '';

      const activeCustomerTypes = useMemo(() => {
          if (!customerTypes || customerTypes.length === 0) return fallbackCustomerTypes;
          return (customerTypes || []).filter(p => p && p.status === 'ใช้งาน');
      }, [customerTypes]);

      useEffect(() => {
        const savedUserStr = localStorage.getItem('stk_current_user');
        if (savedUserStr) {
          try {
            const user = JSON.parse(savedUserStr);
            setCurrentUser(user);
            setIsLoggedIn(true);
          } catch(e) { localStorage.removeItem('stk_current_user'); }
        }

        const initialLoader = document.getElementById('initial-loader');
        if (initialLoader) initialLoader.style.display = 'none';

        // 💡 SMART CACHING & PAGE TRANSITION SPEED FIX:
        // ดึงข้อมูลจาก Cache ขึ้นมาแสดงผลทันที เพื่อสลับหน้าได้อย่างรวดเร็ว
        let isCacheFresh = false;
        try {
            const cachedData = localStorage.getItem('stk_app_cache_data');
            const cacheTime = localStorage.getItem('stk_app_cache_time');
            if (cachedData && cacheTime) {
                const parsedData = JSON.parse(cachedData);
                applyDataToStates(parsedData);
                
                const age = Date.now() - Number(cacheTime);
                if (age < 20000) { // 20 วินาที
                    isCacheFresh = true;
                    setIsAppLoading(false);
                }
            }
        } catch (e) { console.warn("Cache error", e); }

        // ถ้า cache ยังใหม่ ไม่ต้องยิงขอข้อมูลซ้ำ
        if (isCacheFresh) {
            return;
        }

        Promise.all([
          supabaseSelect('stk_products').catch(() => supabaseSelect('products')),
          supabaseSelect('stk_customer_types').catch(() => supabaseSelect('customer_types')),
          supabaseSelect('stk_closers').catch(() => supabaseSelect('closers')),
          supabaseSelect('stk_members').catch(() => supabaseSelect('members')),
          supabaseSelect('stk_customers', 'limit=500').catch(() => supabaseSelect('customers')),
          // ⚡ SPEED FIX: ดึงประวัติการขายล่าสุดแค่ 200 รายการ เพื่อความรวดเร็วในการวิเคราะห์ข้อมูลลูกค้าล่าสุด
          supabaseSelect('stk_sales', 'order=order_id.desc&limit=200').catch(() => supabaseSelect('sales'))
        ]).then(([pRes, typeRes, cloRes, memRes, custRes, saleRes]) => {
          const resObj = {
            products: pRes,
            customerTypes: typeRes,
            closers: cloRes,
            members: memRes,
            customers: custRes,
            sales: saleRes
          };
          applyDataToStates(resObj);
          try {
              localStorage.setItem('stk_app_cache_data', JSON.stringify(resObj));
              localStorage.setItem('stk_app_cache_time', String(Date.now()));
          } catch(e){}
        }).catch(err => {
          console.error("Supabase load error:", err);
        }).finally(() => {
          setIsAppLoading(false);
        });
      }, []);

      const applyDataToStates = (response) => {
           if (Array.isArray(response.products)) setProducts(response.products);
           if (Array.isArray(response.customerTypes)) setCustomerTypes(response.customerTypes);
           if (Array.isArray(response.closers)) setClosers(response.closers);
           
           const loadedMembers = Array.isArray(response.members) ? response.members.map(m => ({
               id: String(m.id || m.user_id || m.User_ID || '').trim(),
               name: String(m.name || m.Name || '').trim()
           })) : [];
           if (Array.isArray(response.members)) setMembers(response.members);
           
           if (Array.isArray(response.customers)) {
               const formattedCustomers = response.customers.map(x => {
                   let extra = {};
                   if (x.extra_details_json) {
                       try { extra = typeof x.extra_details_json === 'string' ? JSON.parse(x.extra_details_json) : x.extra_details_json; } catch(e){}
                   }

                   const cid = String(x.id || x.customer_id || x.Customer_ID || '').trim();
                   const cName = String(x.name || x.customer_name || x.Customer_Name || '').trim();
                   const cPhone = String(x.phone || x.phone_number || x.Phone || extra.phone || '').trim();
                   const cLineId = String(x.lineId || x.line_id || x.LINE_ID || extra.lineId || '').trim();
                   const cType = String(x.type || x.customer_type || x.Customer_Type || extra.type || '').trim();

                   const cSymptom = String(
                       x.symptom || x.symptom_disease || x.disease || x.Symptom || extra.symptom || extra.disease || ''
                   ).trim();

                   const cCloser = String(
                       x.closer || x.closer_id || x.closer_name || x.Closer || extra.closer || ''
                   ).trim();

                   const cMemberId = String(
                       x.memberId || x.owner_member_id || x.member_id || x.User_ID || x.seller_id || x.marketing || extra.owner_id || extra.memberId || ''
                   ).trim();

                   const mMatch = loadedMembers.find(m => m && (
                       String(m.id).trim().toUpperCase() === cMemberId.toUpperCase() ||
                       String(m.name).trim().toUpperCase() === cMemberId.toUpperCase()
                   ));
                   const resolvedMemberId = mMatch ? mMatch.id : cMemberId;
                   const cMemberName = mMatch ? mMatch.name : (x.memberName || x.member_name || extra.memberName || cMemberId);

                   return {
                       ...x,
                       id: cid,
                       name: cName,
                       phone: cPhone,
                       lineId: cLineId,
                       type: cType,
                       symptom: cSymptom,
                       closer: cCloser,
                       memberId: resolvedMemberId,
                       memberName: cMemberName
                   };
               }).filter(c => c.id !== '');

               setCustomers(formattedCustomers);
           }

           if (Array.isArray(response.sales)) setSales(response.sales);
      };

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col lg:flex-row font-sans antialiased text-slate-800 w-full">
          <Toast toast={toast} setToast={setToast} />
          
          <Sidebar 
            activePage="customers" 
            isSidebarCollapsed={isSidebarCollapsed} 
            setIsSidebarCollapsed={setIsSidebarCollapsed} 
            isAdmin={isAdmin}
            currentUserProfileUrl={currentUserProfileUrl}
            currentUser={currentUser}
            isLoggedIn={isLoggedIn}
            onLogout={() => { 
              localStorage.removeItem('stk_current_user'); 
              setIsLoggedIn(false); 
              setCurrentUser(null); 
              const targetUrl = typeof resolvePageUrl === 'function' ? resolvePageUrl('?page=dashboard') : 'Mlm.html';
              if (typeof window !== 'undefined') window.location.href = targetUrl;
            }}
            showLoginModal={showLoginModal}
            setShowLoginModal={setShowLoginModal}
            setIsAppLoading={setIsAppLoading}
          />

          <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>
            <div className="p-3 sm:p-6 lg:p-8 flex-1 w-full">
              <div className="w-full">
                {isAppLoading ? (
                  <div className="flex flex-col items-center justify-center py-32 gap-3 animation-fade-in">
                    <div className="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                    <span className="text-sm font-bold text-slate-500">กำลังโหลดข้อมูลลูกค้า...</span>
                  </div>
                ) : (
                  <CustomerManagementView 
                    sales={sales} 
                    customers={customers} 
                    members={members} 
                    closers={closers} 
                    activeCustomerTypes={activeCustomerTypes} 
                    setCustomers={setCustomers} 
                    showToast={showToast} 
                    isAdmin={isAdmin}
                  />
                )}
              </div>
            </div>

          </main>

          <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={(u) => { setCurrentUser(u); setIsLoggedIn(true); setShowLoginModal(false); }} systemUsers={systemUsers} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
