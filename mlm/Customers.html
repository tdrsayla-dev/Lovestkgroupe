                    const cMem = safeUpper(c.memberId || c.owner_member_id);
                    const cName = safeUpper(c.memberName);
                    return cMem === safeUpper(marketerFilter) || cName.includes(safeUpper(marketerFilter));
                });
            }
            
            // 🔒 Logged-in Marketer sees ONLY their assigned customers
            if (isMarketerRole) {
                return (customers || []).filter(c => {
                    const cMem = safeUpper(c.memberId || c.owner_member_id);
                    const cName = safeUpper(c.memberName);
                    const isOwner = (currentUserId && cMem === safeUpper(currentUserId)) || 
                                    (currentUserName && cName === safeUpper(currentUserName));
                    const isCloser = currentUserName && safeUpper(c.closer) === safeUpper(currentUserName);
                    return isOwner || isCloser;
                });
            }

            return (customers || []);
        }, [customers, isAdmin, isMarketerRole, marketerFilter, currentUserId, currentUserName, currentUser]);

        // 📊 Quick Customer Sales Stats (Visit count, last visit date, medications)
        const customerSalesMap = useMemo(() => {
            const map = {};
            (sales || []).forEach(s => {
                const cid = String(s.customerId || s.customer_id || s.customer || '').trim();
                if (!cid) return;
                if (!map[cid]) {
                    map[cid] = {
                        count: 0,
                        dates: [],
                        salesList: [],
                        lastDate: '',
                        medicines: []
                    };
                }
                map[cid].count += 1;
                const sDate = s.date || s.sale_date || '';
                if (sDate) map[cid].dates.push(sDate);
                map[cid].salesList.push(s);

                // Extract products / medicines
                try {
                    let items = s.items_json;
                    if (typeof items === 'string') items = JSON.parse(items);
                    if (Array.isArray(items)) {
                        items.forEach(it => {
                            const pName = it.name || it.product_name || it.prod || '';
                            if (pName && !map[cid].medicines.includes(pName)) {
                                map[cid].medicines.push(pName);
                            }
                        });
                    }
                } catch(e) {}
            });

            // Calculate last visit date
            Object.keys(map).forEach(cid => {
                const sortedDates = [...new Set(map[cid].dates)].sort((a, b) => b.localeCompare(a));
                map[cid].lastDate = sortedDates[0] || '';
            });
            return map;
        }, [sales]);

        // 🩺 Calculate Customer Visit & Follow-up Details
        const enrichedCustomers = useMemo(() => {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // Extract trigger days thresholds from notification settings
            const triggerDaysList = activeFollowupTemplates.map(t => parseInt(t.trigger_days) || 7).sort((a,b) => a - b);
            const minTrigger = triggerDaysList[0] || 7;
            const maxTrigger = triggerDaysList[triggerDaysList.length - 1] || 35;

            return roleScopedCustomers.map(c => {
                const sStats = customerSalesMap[c.id] || { count: 0, lastDate: '', medicines: [] };
                const catInfo = getCustomerCategoryInfo(c);
                const extra = parseExtraDetails(c.extra_details_json);

                const visitCount = sStats.count > 0 ? sStats.count : (catInfo.isOld ? 2 : 1);
                
                let daysSinceLast = null;
                const lastDateStr = sStats.lastDate || c.created_at?.substring(0, 10);
                if (lastDateStr) {
                    const lDate = new Date(lastDateStr);
                    if (!isNaN(lDate.getTime())) {
                        const diffTime = today - lDate;
                        daysSinceLast = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                    }
                }

                // Follow-up status determination
                let followupStatus = extra.followup_status || 'pending';
                let isFollowupDue = false;
                if (followupStatus === 'done' || followupStatus === 'scheduled') {
                    isFollowupDue = false;
                } else {
                    if (daysSinceLast !== null && daysSinceLast >= minTrigger && daysSinceLast <= (maxTrigger + 7)) {
                        isFollowupDue = true;
                    }
                }

                return {
                    ...c,
                    visitCount,
                    lastVisitDate: lastDateStr || '-',
                    daysSinceLast,
                    medicines: sStats.medicines,
                    catInfo,
                    followupStatus,
                    isFollowupDue,
                    followupNotes: extra.followup_notes || '',
                    lastFollowupDate: extra.last_followup_date || ''
                };
            });
        }, [roleScopedCustomers, customerSalesMap, activeFollowupTemplates]);

        // KPI Summary Counts
        const summaryKPIs = useMemo(() => {
            const total = enrichedCustomers.length;
            const newCount = enrichedCustomers.filter(c => !c.catInfo.isOld).length;
            const oldCount = enrichedCustomers.filter(c => c.catInfo.isOld).length;
            const dueFollowups = enrichedCustomers.filter(c => c.isFollowupDue || c.followupStatus === 'due').length;
            return { total, newCount, oldCount, dueFollowups };
        }, [enrichedCustomers]);

        // Filtered List for Table / Cards
        const displayCustomers = useMemo(() => {
            return enrichedCustomers.filter(c => {
                if (categoryFilter === 'new' && c.catInfo.isOld) return false;
                if (categoryFilter === 'old' && !c.catInfo.isOld) return false;

                if (activeCustTab === 'followup') {
                    if (followupFilter === 'due' && !c.isFollowupDue && c.followupStatus !== 'due') return false;
                    if (followupFilter === 'done' && c.followupStatus !== 'done') return false;
                    if (followupFilter === 'scheduled' && c.followupStatus !== 'scheduled') return false;
                }

                if (searchAllData) {
                    const q = searchAllData.toLowerCase().trim();
                    const matchId = String(c.id || '').toLowerCase().includes(q);
                    const matchName = String(c.name || '').toLowerCase().includes(q);
                    const matchPhone = String(c.phone || '').includes(q);
                    const matchMem = String(c.memberName || c.memberId || '').toLowerCase().includes(q);
                    const matchSymp = String(c.symptom || '').toLowerCase().includes(q);
                    if (!matchId && !matchName && !matchPhone && !matchMem && !matchSymp) return false;
                }
                return true;
            }).sort((a, b) => {
                if (activeCustTab === 'followup') {
                    if (a.isFollowupDue !== b.isFollowupDue) return a.isFollowupDue ? -1 : 1;
                    return (b.daysSinceLast || 0) - (a.daysSinceLast || 0);
                }
                const numA = parseInt(String(a.id || '').replace(/\D/g, ''), 10);
                const numB = parseInt(String(b.id || '').replace(/\D/g, ''), 10);
                if (!isNaN(numA) && !isNaN(numB) && numA !== numB) return numB - numA;
                return String(b.id || '').localeCompare(String(a.id || ''));
            });
        }, [enrichedCustomers, categoryFilter, activeCustTab, followupFilter, searchAllData]);

        const totalPages = Math.ceil(displayCustomers.length / itemsPerPage) || 1;
        const currentCustomers = displayCustomers.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

        // Real-time Duplicate & Ownership Check (Anti-Theft Protection)
        const checkCustomerDuplicate = useCallback((phone, name, currentEditId = null) => {
            const cleanP = normalizePhone(phone);
            const cleanN = String(name || '').trim().toLowerCase();

            if (!cleanP && (!cleanN || cleanN.length < 2)) return null;

            return (customers || []).find(c => {
                if (currentEditId && c.id === currentEditId) return false;
                const matchPhone = cleanP && cleanP.length >= 7 && normalizePhone(c.phone) === cleanP;
                const matchName = cleanN && cleanN.length >= 3 && String(c.name || '').trim().toLowerCase() === cleanN;
                return matchPhone || matchName;
            });
        }, [customers]);

        const duplicateMatchAdd = useMemo(() => {
            return checkCustomerDuplicate(newCustData.phone, newCustData.name);
        }, [newCustData.phone, newCustData.name, checkCustomerDuplicate]);

        const isDuplicateOwnedByOther = useMemo(() => {
            if (!duplicateMatchAdd) return false;
            const ownerId = safeUpper(duplicateMatchAdd.owner_member_id || duplicateMatchAdd.memberId);
            const ownerName = safeUpper(duplicateMatchAdd.memberName);
            const myId = safeUpper(currentUserId);
            const myName = safeUpper(currentUserName);
            return (ownerId && ownerId !== myId) || (ownerName && ownerName !== myName);
        }, [duplicateMatchAdd, currentUserId, currentUserName]);

        const handleOpenAddCustomer = async () => {
            const usedIds = new Set((customers || []).map(c => {
                const match = c && c.id && c.id.match(/^C(\d+)$/i);
                return match ? parseInt(match[1], 10) : 0;
            }).filter(n => n > 0));

            let nextIdNum = 1;
            while (usedIds.has(nextIdNum)) nextIdNum++;

            const defaultMemberId = isMarketerRole ? currentUserId : (members[0]?.id || '');
            const defaultMemberName = isMarketerRole ? currentUserName : (members[0]?.name || '');

            setNewCustData({ 
                id: "C" + nextIdNum.toString().padStart(3, '0'), 
                name: '', 
                phone: '', 
                lineId: '', 
                type: activeCustomerTypes.length > 0 ? activeCustomerTypes[0].name : 'ลูกค้าใหม่มาตรวจ', 
                symptom: '', 
                closer: '', 
                memberId: defaultMemberId, 
                memberName: defaultMemberName,
                adminOverride: false
            });
            setShowAddCustModal(true);
        };

        const handleSaveNewCustomer = async (e) => {
            e.preventDefault();
            if (!newCustData.name) { showToast('กรุณากรอกชื่อลูกค้า', 'error'); return; }

            if (duplicateMatchAdd && isDuplicateOwnedByOther && !isAdmin) {
                showToast(`ลูกค้าท่านนี้อยู่ในการดูแลของ ${duplicateMatchAdd.memberName || duplicateMatchAdd.memberId} แล้ว ไม่อนุญาตให้ลงทะเบียนซ้ำ`, 'error');
                return;
            }

            if (duplicateMatchAdd && isDuplicateOwnedByOther && isAdmin && !newCustData.adminOverride) {
                showToast('กรุณากดยืนยันการโอนย้ายสิทธิ์ดูแลลูกค้าก่อนบันทึก (สิทธิ์แอดมิน)', 'warning');
                return;
            }

            setIsAddingCust(true);
            try {
                let candidateId = newCustData.id;
                try {
                    const existCheck = await supabaseSelect('stk_customers', `customer_id=eq.${candidateId}&select=customer_id`);
                    if (Array.isArray(existCheck) && existCheck.length > 0) {
                        const num = parseInt(candidateId.replace(/\D/g, ''), 10) || 100;
                        candidateId = "C" + (num + 1).toString().padStart(3, '0');
                    }
                } catch(e) {}

                const mFull = (members || []).find(m => m && safeUpper(m.id) === safeUpper(newCustData.memberId));
                const finalMemberName = mFull ? mFull.name : (newCustData.memberName || newCustData.memberId);

                const supaPayload = {
                    customer_id: candidateId,
                    name: newCustData.name.trim(),
                    phone: newCustData.phone ? newCustData.phone.trim() : '',
                    line_id: newCustData.lineId ? newCustData.lineId.trim() : '',
                    customer_type: newCustData.type || 'ลูกค้าใหม่มาตรวจ',
                    symptom_disease: newCustData.symptom ? newCustData.symptom.trim() : '',
                    closer_id: newCustData.closer || '',
                    owner_member_id: newCustData.memberId || '',
                    extra_details_json: {
                        closerTeam: (closers || []).find(cl => cl.name === newCustData.closer)?.team || '',
                        memberName: finalMemberName,
                        followup_status: 'pending',
                        created_by: currentUserId || 'system'
                    }
                };

                await supabaseInsert('stk_customers', supaPayload);

                const createdCustObj = {
                    ...supaPayload,
                    id: candidateId,
                    type: supaPayload.customer_type,
                    symptom: supaPayload.symptom_disease,
                    closer: supaPayload.closer_id,
                    memberId: supaPayload.owner_member_id,
                    memberName: finalMemberName
                };

                setCustomers([createdCustObj, ...(customers || [])]);
                setShowAddCustModal(false);
                showToast('เพิ่มข้อมูลลูกค้าใหม่สำเร็จ', 'success');
                triggerGlobalRefresh();
            } catch (err) {
                console.error("Save new customer error:", err);
                showToast('เกิดข้อผิดพลาดในการบันทึกข้อมูล: ' + err.message, 'error');
            } finally {
                setIsAddingCust(false);
            }
        };

        const handleSaveCust = async (e) => {
            e.preventDefault();
            if (!editCustData) return;

            if (isMarketerRole) {
                const origCust = (customers || []).find(c => c.id === editCustData.id);
                if (origCust && safeUpper(origCust.memberId) !== safeUpper(currentUserId)) {
                    showToast('ไม่อนุญาตให้แก้ไขข้อมูลลูกค้าของพนักงานท่านอื่น', 'error');
                    return;
                }
            }

            setIsSubmitting(true);
            try {
                const mFull = (members || []).find(m => m && safeUpper(m.id) === safeUpper(editCustData.memberId));
                const finalMemberName = mFull ? mFull.name : (editCustData.memberName || editCustData.memberId);

                const existingExtra = parseExtraDetails(editCustData.extra_details_json);
                const updatedExtra = {
                    ...existingExtra,
                    closerTeam: (closers || []).find(cl => cl.name === editCustData.closer)?.team || existingExtra.closerTeam || '',
                    memberName: finalMemberName
                };

                const supaPayload = {
                    customer_id: editCustData.id,
                    name: editCustData.name.trim(),
                    phone: editCustData.phone || '',
                    line_id: editCustData.lineId || '',
                    customer_type: editCustData.type || '',
                    symptom_disease: editCustData.symptom || '',
                    closer_id: editCustData.closer || '',
                    owner_member_id: editCustData.memberId || '',
                    extra_details_json: updatedExtra
                };

                let savedOk = false;
                if (window.supabaseClient) {
                    const { error } = await window.supabaseClient.from('stk_customers').update(supaPayload).eq('customer_id', editCustData.id);
                    if (!error) savedOk = true;
                }
                if (!savedOk) {
                    await supabaseUpdate('stk_customers', editCustData.id, supaPayload, 'customer_id');
                }

                setCustomers(customers.map(c => c.id === editCustData.id ? { ...c, ...editCustData, memberName: finalMemberName, extra_details_json: updatedExtra } : c));
                setEditCustData(null);
                showToast('อัปเดตข้อมูลลูกค้าสำเร็จ', 'success');
                triggerGlobalRefresh();
            } catch (err) {
                console.error("Save customer edit error:", err);
                showToast('บันทึกข้อมูลล้มเหลว: ' + err.message, 'error');
            } finally {
                setIsSubmitting(false);
            }
        };

        const executeDeleteCust = async () => {
            const id = confirmDeleteCust.id;
            try {
                await supabaseDelete('stk_customers', id, 'customer_id').catch(() => {});
                setCustomers(customers.filter(c => c.id !== id));
                setConfirmDeleteCust({ show: false, id: null, title: '' });
                showToast('ลบข้อมูลลูกค้าเรียบร้อยแล้ว', 'success');
                triggerGlobalRefresh();
            } catch (err) {
                showToast('ลบข้อมูลล้มเหลว: ' + err.message, 'error');
            }
        };

        const handleOpenTreatmentHistory = async (cust) => {
            setTreatmentHistoryModal(cust);
            const custId = cust.id;

            if (custSalesHistoryMap[custId]) return;

            setHistoryLoading(true);
            try {
                const specificSales = await supabaseSelect('stk_sales', `customer_id=eq.${encodeURIComponent(custId)}&order=date.desc&limit=50`);
                if (Array.isArray(specificSales)) {
                    setCustSalesHistoryMap(prev => ({ ...prev, [custId]: specificSales }));
                }
            } catch(e) {
                console.warn('Failed to load on-demand sales for customer:', e);
            } finally {
                setHistoryLoading(false);
            }
        };

        // Generate Follow-up Message From Template (Integrated with NotificationSettings)
        const generateTemplateMessage = (template, cust) => {
            if (!template || !cust) return '';
            let msg = template.message_text || '';
            const daysText = cust.daysSinceLast !== null ? String(cust.daysSinceLast) : '7';
            msg = msg.replace(/\[ชื่อลูกค้า\]/g, cust.name || 'คุณลูกค้า');
            msg = msg.replace(/\[ผู้ขาย\]/g, cust.memberName || currentUserName || 'เจ้าหน้าที่คลินิก');
            msg = msg.replace(/\[เจ้าของเคส\]/g, cust.memberName || currentUserName || 'เจ้าหน้าที่คลินิก');
            msg = msg.replace(/\[เบอร์โทร\]/g, cust.phone || '-');
            msg = msg.replace(/\[วันที่ซื้อ\]/g, cust.lastVisitDate || '-');
            msg = msg.replace(/\[วันที่รับบริการ\]/g, cust.lastVisitDate || '-');
            msg = msg.replace(/\[จำนวนวัน\]/g, daysText);
            msg = msg.replace(/\[จำนวนวันที่ทานยา\]/g, daysText);
            msg = msg.replace(/\[จำนวนวันเหลือ\]/g, String(Math.max(0, 30 - (cust.daysSinceLast || 0))));
            return msg;
        };

        // Open Follow-up & Message Action Modal
        const handleOpenFollowupModal = (cust) => {
            setFollowupModalCust(cust);
            setFollowupNotesInput(cust.followupNotes || '');
            setFollowupStatusInput(cust.followupStatus === 'due' ? 'done' : (cust.followupStatus || 'done'));
            setCopySuccess(false);

            // Select most appropriate template based on days elapsed
            const days = cust.daysSinceLast || 7;
            let matchedTpl = activeFollowupTemplates.find(t => Math.abs((t.trigger_days || 7) - days) <= 4);
            if (!matchedTpl) matchedTpl = activeFollowupTemplates[0];

            if (matchedTpl) {
                setSelectedTemplateId(matchedTpl.template_id);
                setGeneratedMessage(generateTemplateMessage(matchedTpl, cust));
            } else {
                setGeneratedMessage(`เรียนคุณ ${cust.name} ทางคลินิกขอสอบถามอาการหลังรับประทานยา ตอนนี้เป็นอย่างไรบ้างครับ/ค่ะ`);
            }
        };

        const handleTemplateChange = (tplId) => {
            setSelectedTemplateId(tplId);
            const tpl = activeFollowupTemplates.find(t => t.template_id === tplId);
            if (tpl && followupModalCust) {
                setGeneratedMessage(generateTemplateMessage(tpl, followupModalCust));
            }
        };

        const handleCopyMessage = () => {
            if (!generatedMessage) return;
            try {
                navigator.clipboard.writeText(generatedMessage);
                setCopySuccess(true);
                showToast('คัดลอกข้อความติดตามแล้ว', 'success');
                setTimeout(() => setCopySuccess(false), 2500);
            } catch(e) {
                showToast('ไม่สามารถคัดลอกข้อความได้', 'error');
            }
        };

        const handleSaveFollowup = async (e) => {
            e.preventDefault();
            if (!followupModalCust) return;
            setIsSavingFollowup(true);

            try {
                const todayStr = getLocalISODate();
                const existingExtra = parseExtraDetails(followupModalCust.extra_details_json);
                const updatedExtra = {
                    ...existingExtra,
                    followup_status: followupStatusInput,
                    followup_notes: followupNotesInput,
                    last_followup_date: todayStr,
                    last_followup_by: currentUserName || currentUserId
                };

                const supaPayload = {
                    extra_details_json: updatedExtra
                };

                if (window.supabaseClient) {
                    await window.supabaseClient.from('stk_customers').update(supaPayload).eq('customer_id', followupModalCust.id);
                } else {
                    await supabaseUpdate('stk_customers', followupModalCust.id, supaPayload, 'customer_id');
                }

                setCustomers(customers.map(c => c.id === followupModalCust.id ? {
                    ...c,
                    extra_details_json: updatedExtra
                } : c));

                showToast('บันทึกผลการติดตามอาการสำเร็จ', 'success');
                setFollowupModalCust(null);
                triggerGlobalRefresh();
            } catch (err) {
                showToast('บันทึกการติดตามล้มเหลว: ' + err.message, 'error');
            } finally {
                setIsSavingFollowup(false);
            }
        };

        return (
            <div className="space-y-5 animation-fade-in pb-16 w-full">
                
                {/* 📌 Header Title Bar & Quick Stats */}
                <div className="bg-white p-5 sm:p-6 rounded-3xl shadow-[0_4px_20px_rgba(0,0,0,0.03)] border border-slate-200/80 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                    <div className="flex items-center gap-3.5">
                        <div className="w-12 h-12 rounded-2xl bg-blue-50 border border-blue-100 flex items-center justify-center text-blue-600 shrink-0">
                            <IconUsers size={24} />
                        </div>
                        <div>
                            <div className="flex flex-wrap items-center gap-2">
                                <h1 className="text-xl sm:text-2xl font-black text-slate-800 tracking-tight">
                                    ระบบจัดการข้อมูลลูกค้า & ติดตามผล (CRM)
                                </h1>
                                <span className={`px-2.5 py-0.5 rounded-full text-[11px] font-bold border inline-flex items-center gap-1.5 ${isAdmin ? 'bg-purple-50 text-purple-700 border-purple-200' : 'bg-blue-50 text-blue-700 border-blue-200'}`}>
                                    <IconShield size={12} />
                                    <span>{isAdmin ? 'สิทธิ์ผู้ดูแลระบบ (เห็นทั้งหมด)' : `การตลาด: ${currentUserName || currentUserId}`}</span>
                                </span>
                            </div>
                            <p className="text-xs text-slate-500 font-medium mt-1">
                                ประวัติการรักษา • นับจำนวนครั้งรับบริการ • แจ้งเตือนติดตามทานยา • ระบบล็อคสิทธิ์ดูแลเคส
                            </p>
                        </div>
                    </div>

                    {/* Navigation Tabs (Responsive Clean UI) */}
                    <div className="flex items-center gap-1 bg-slate-100 p-1.5 rounded-2xl border border-slate-200/80 w-full lg:w-auto overflow-x-auto custom-scrollbar">
                        <button 
                            onClick={() => setActiveCustTab('allData')}
                            className={`flex-1 sm:flex-initial px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 cursor-pointer whitespace-nowrap ${activeCustTab === 'allData' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/50'}`}
                        >
                            <IconFileText size={15} />
                            <span>รายชื่อลูกค้า ({summaryKPIs.total})</span>
                        </button>
                        <button 
                            onClick={() => setActiveCustTab('followup')}
                            className={`flex-1 sm:flex-initial px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 cursor-pointer whitespace-nowrap ${activeCustTab === 'followup' ? 'bg-amber-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/50'}`}
                        >
                            <IconBell size={15} />
                            <span>ติดตามอาการ & โทรเตือน</span>
                            {summaryKPIs.dueFollowups > 0 && (
                                <span className="px-1.5 py-0.2 rounded-full bg-rose-500 text-white text-[10px] font-black">
                                    {summaryKPIs.dueFollowups}
                                </span>
                            )}
                        </button>
                        <button 
                            onClick={() => setActiveCustTab('stats')}
                            className={`flex-1 sm:flex-initial px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 cursor-pointer whitespace-nowrap ${activeCustTab === 'stats' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200/50'}`}
                        >
                            <IconBarChart size={15} />
                            <span>สถิติ & จัดอันดับ</span>

                                                        </p>

                                                    <span className={`px-2.5 py-1 rounded-full text-[10px] font-black shrink-0 ${
                                                        c.followupStatus === 'done' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' :
                                                        c.followupStatus === 'scheduled' ? 'bg-sky-50 text-sky-700 border border-sky-200' :
                                                        'bg-amber-50 text-amber-700 border border-amber-200'

                                                    </div>
                                                    {c.medicines.length > 0 && (
                                                        <div className="pt-2 border-t border-slate-200/60 text-[11px] text-slate-600">
                                                            <span className="font-bold text-slate-400">ยา/สินค้า: </span>
                                                            <span className="font-bold">{c.medicines.slice(0, 3).join(', ')}{c.medicines.length > 3 ? '...' : ''}</span>
                                                        </div>
                                                    )}
                                                </div>

                                                {/* Follow-up Note Snippet */}
                                                {c.followupNotes && (
                                                    <div className="mt-2 text-xs font-bold text-slate-600 bg-amber-50/40 p-2.5 rounded-xl border border-amber-100">
                                                        <span className="text-amber-800 font-black">บันทึกล่าสุด: </span>
                                                        <span>{c.followupNotes}</span>
                                                    </div>

                                                    <IconLock size={10} />
                                                    <span>{c.memberName || c.memberId}</span>
                                                </div>
                                                <div className="flex items-center gap-1.5">
                                                    {c.phone && (
                                                        <a 
                                                            href={`tel:${c.phone}`} 
                                                            className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold inline-flex items-center gap-1.5 shadow-sm transition-all"
                                                        >
                                                            <IconPhone size={13} />
                                                            <span>โทร</span>
                                                        </a>
                                                    )}

                                                        onClick={() => handleOpenFollowupModal(c)}
                                                        className="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 text-white rounded-xl text-xs font-bold transition-all inline-flex items-center gap-1.5 shadow-sm"
                                                    >
                                                        <IconMessageSquare size={13} />
                                                        <span>ข้อความ & บันทึก</span>
                                                    </button>
                                                    <button 
                                                        onClick={() => handleOpenTreatmentHistory(c)}
                                                        className="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold transition-all"
                                                        title="ดูประวัติยา"
                                                    >
                                                        <IconEye size={14} />
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                })

                        </div>
                    </div>
                )}

                {/* ==================================================== */}
                {/* TAB 3: 📊 สถิติ & จัดอันดับ (STATS & RANKINGS)          */}
                {/* ==================================================== */}
                {activeCustTab === 'stats' && (() => {
                    const stats = { newRankings: {}, returnRankings: {}, closerRankings: {} };
                    (enrichedCustomers || []).forEach(c => {
                        const mName = c.memberName || c.memberId || 'ส่วนกลาง';
                        if (c.catInfo.isOld) {
                            stats.returnRankings[mName] = (stats.returnRankings[mName] || 0) + 1;
                        } else {
                            stats.newRankings[mName] = (stats.newRankings[mName] || 0) + 1;
                        }
                        if (c.closer) {
                            stats.closerRankings[c.closer] = (stats.closerRankings[c.closer] || 0) + 1;
                        }
                    });

                    const sortMap = (obj) => Object.entries(obj).sort((a, b) => b[1] - a[1]);
                    const topNew = sortMap(stats.newRankings).slice(0, 5);
                    const topReturn = sortMap(stats.returnRankings).slice(0, 5);
                    const topClosers = sortMap(stats.closerRankings).slice(0, 5);

                    const rankingCard = (title, list, unit) => (
                        <div className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm flex flex-col justify-between space-y-4">
                            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                <h4 className="font-black text-slate-800 text-xs">{title}</h4>
                                <span className="text-[10px] text-blue-600 font-bold bg-blue-50 px-2 py-0.5 rounded-full">Top 5</span>
                            </div>
                            <div className="space-y-2">
                                {list.length > 0 ? list.map(([name, count], idx) => (
                                    <div key={name} className="flex justify-between items-center text-xs font-bold">
                                        <span className="text-slate-600 truncate max-w-[170px]">{idx + 1}. {name}</span>
                                        <span className="text-blue-700 bg-blue-50 px-2.5 py-1 rounded-lg font-mono">{count} {unit}</span>
                                    </div>
                                )) : (
                                    <span className="text-xs text-slate-400 font-medium block text-center py-4">ไม่มีข้อมูล</span>
                                )}
                            </div>
                        </div>
                    );

                    return (
                        <div className="space-y-6 animation-fade-in">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                {rankingCard('ผู้พาลูกค้าใหม่มาตรวจ', topNew, 'คน')}
                                {rankingCard('ผู้ดึงลูกค้าเก่ากลับมา', topReturn, 'คน')}
                                {rankingCard('ยอดปิดการขาย (Closer)', topClosers, 'เคส')}
                            </div>

                            {/* Frequent Visitors Table */}
                            <div className="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-sm space-y-4">
                                <h3 className="text-sm font-black text-slate-800 flex items-center gap-2">
                                    <IconBarChart size={18} className="text-blue-600" />
                                    <span>ลูกค้าที่มารับบริการบ่อยที่สุด (Top Frequent Visitors)</span>
                                </h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs whitespace-nowrap">
                                        <thead className="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                                            <tr>
                                                <th className="p-3">รหัส</th>
                                                <th className="p-3">ชื่อลูกค้า</th>
                                                <th className="p-3">เบอร์โทร</th>
                                                <th className="p-3">ประเภท</th>
                                                <th className="p-3 text-center">จำนวนครั้งที่มา</th>
                                                <th className="p-3 text-center">มารับบริการล่าสุด</th>
                                                <th className="p-3">การตลาดดูแล</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 font-bold">
                                            {[...enrichedCustomers].sort((a, b) => b.visitCount - a.visitCount).slice(0, 10).map(c => (
                                                <tr key={c.id} className="hover:bg-slate-50">
                                                    <td className="p-3 font-mono text-blue-600">{c.id}</td>
                                                    <td className="p-3 text-slate-800 font-black">{c.name}</td>
                                                    <td className="p-3 text-slate-600 font-mono">{c.phone || '-'}</td>
                                                    <td className="p-3">
                                                        <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${c.catInfo.badgeBg}`}>
                                                            {c.catInfo.categoryTitle}
                                                        </span>
                                                    </td>
                                                    <td className="p-3 text-center text-indigo-700 font-black text-sm">{c.visitCount} ครั้ง</td>
                                                    <td className="p-3 text-center text-slate-500 font-mono">{c.lastVisitDate}</td>
                                                    <td className="p-3 text-slate-700">{c.memberName || c.memberId}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    );
                })()}

                {/* ==================================================== */}
                {/* TAB 4: 🏷️ จัดกลุ่มตามประเภท (BY CATEGORY TAB)          */}
                {/* ==================================================== */}
                {activeCustTab === 'groupedData' && (() => {
                    const currentType = selectedGroupType || (activeCustomerTypes[0] ? activeCustomerTypes[0].name : '');
                    const currentGroupCusts = enrichedCustomers.filter(c => String(c.type || c.customer_type) === currentType);

                    return (
                        <div className="space-y-6 animation-fade-in">
                            <div className="bg-white p-4 rounded-3xl border border-slate-200/80 shadow-sm flex flex-wrap gap-2">
                                {activeCustomerTypes.map(t => {
                                    const count = enrichedCustomers.filter(c => String(c.type || c.customer_type) === t.name).length;
                                    const isSel = currentType === t.name;
                                    return (
                                        <button
                                            key={t.id}
                                            onClick={() => setSelectedGroupType(t.name)}
                                            className={`px-4 py-2 rounded-2xl text-xs font-bold transition-all flex items-center gap-2 border ${
                                                isSel ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                                            }`}
                                        >
                                            <IconTag size={13} />
                                            <span>{t.name}</span>
                                            <span className={`px-2 py-0.5 rounded-full text-[10px] font-black ${isSel ? 'bg-white/20 text-white' : 'bg-slate-200 text-slate-700'}`}>
                                                {count}
                                            </span>
                                        </button>
                                    );
                                })}
                            </div>

                            <div className="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200/80 shadow-sm space-y-4">
                                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                                    <h3 className="text-sm font-black text-slate-800 flex items-center gap-2">
                                        <span>รายชื่อลูกค้าในกลุ่ม: {currentType}</span>
                                    </h3>
                                    <span className="bg-blue-50 text-blue-700 font-bold text-xs px-3 py-1 rounded-full">
                                        รวม {currentGroupCusts.length} คน
                                    </span>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs whitespace-nowrap">
                                        <thead className="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                                            <tr>
                                                <th className="p-3">รหัส</th>
                                                <th className="p-3">ชื่อลูกค้า</th>
                                                <th className="p-3">เบอร์โทร</th>
                                                <th className="p-3">อาการ</th>
                                                <th className="p-3">ผู้ปิดการขาย</th>
                                                <th className="p-3">เจ้าของเคส (การตลาด)</th>
                                                <th className="p-3 text-center">ประวัติยา</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 font-bold">
                                            {currentGroupCusts.length === 0 ? (
                                                <tr><td colSpan="7" className="p-8 text-center text-slate-400">ไม่มีข้อมูลลูกค้าในประเภทนี้</td></tr>
                                            ) : (
                                                currentGroupCusts.map(c => (
                                                    <tr key={c.id} className="hover:bg-slate-50">
                                                        <td className="p-3 font-mono text-blue-600">{c.id}</td>
                                                        <td className="p-3 text-slate-800">{c.name}</td>
                                                        <td className="p-3 text-slate-600 font-mono">{c.phone || '-'}</td>
                                                        <td className="p-3 text-slate-600">{c.symptom || '-'}</td>
                                                        <td className="p-3 text-slate-600">{c.closer || '-'}</td>
                                                        <td className="p-3 text-slate-700">{c.memberName || c.memberId || '-'}</td>
                                                        <td className="p-3 text-center">
                                                            <button 
                                                                onClick={() => handleOpenTreatmentHistory(c)}
                                                                className="px-2.5 py-1 bg-blue-50 text-blue-700 rounded-lg text-xs font-bold inline-flex items-center gap-1"
                                                            >
                                                                <IconEye size={12} />
                                                                <span>ดูประวัติ</span>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    );
                })()}

                {/* ==================================================== */}
                {/* ➕ MODAL: เพิ่มข้อมูลลูกค้าใหม่                           */}
                {/* ==================================================== */}
                <EditModal isOpen={showAddCustModal} onClose={() => setShowAddCustModal(false)} title="เพิ่มข้อมูลลูกค้าใหม่">
                    <form onSubmit={handleSaveNewCustomer} className="space-y-4 text-xs font-bold text-slate-700">
                        {duplicateMatchAdd && (
                            <div className={`p-4 rounded-2xl border ${isDuplicateOwnedByOther ? 'bg-rose-50 border-rose-300 text-rose-800' : 'bg-amber-50 border-amber-300 text-amber-800'}`}>
                                <div className="flex items-center gap-2 font-black text-sm">
                                    <IconAlertCircle size={18} />
                                    <span>แจ้งเตือน: พบข้อมูลลูกค้าท่านนี้ในระบบแล้ว</span>
                                </div>
                                <div className="mt-2 space-y-1 text-xs">
                                    <p>• ชื่อเดิม: <span className="font-black">{duplicateMatchAdd.name}</span> (รหัส: {duplicateMatchAdd.id})</p>
                                    <p>• เบอร์โทร: <span className="font-mono font-black">{duplicateMatchAdd.phone || '-'}</span></p>
                                    <p>• เจ้าของเคสปัจจุบัน: <span className="font-black text-blue-700">{duplicateMatchAdd.memberName || duplicateMatchAdd.memberId || 'ส่วนกลาง'}</span></p>
                                </div>

                                {isDuplicateOwnedByOther ? (
                                    <div className="mt-3 pt-2 border-t border-rose-200">
                                        <p className="font-black text-rose-700">
                                            ลูกค้าท่านนี้อยู่ในการดูแลของพนักงานท่านอื่นแล้ว ไม่อนุญาตให้ลงทะเบียนซ้ำหรือแย่งเคส
                                        </p>
                                        {isAdmin && (
                                            <label className="flex items-center gap-2 mt-2 cursor-pointer bg-white/60 p-2 rounded-xl border border-rose-300 text-rose-900 font-bold">
                                                <input 
                                                    type="checkbox" 
                                                    checked={newCustData.adminOverride} 
                                                    onChange={e => setNewCustData({ ...newCustData, adminOverride: e.target.checked })} 
                                                    className="w-4 h-4 rounded text-rose-600"
                                                />
                                                <span>ฉันเป็นแอดมิน ยืนยันการโอนย้ายสิทธิ์การดูแลลูกค้ามาเป็นของพนักงานคนนี้</span>
                                            </label>
                                        )}
                                    </div>
                                ) : (
                                    <p className="mt-2 text-amber-700 font-bold">
                                        ลูกค้าท่านนี้อยู่ในการดูแลของคุณอยู่แล้ว ท่านสามารถกดเข้าไปแก้ไขหรือเปิดบิลต่อยาได้ทันที
                                    </p>
                                )}
                            </div>
                        )}

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label className="block mb-1">รหัสลูกค้า (Auto ID)</label>
                                <input type="text" value={newCustData.id} readOnly className="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 font-mono font-bold" />
                            </div>
                            <div>
                                <label className="block mb-1">ชื่อลูกค้า *</label>
                                <input 
                                    type="text" 
                                    required 
                                    value={newCustData.name} 
                                    onChange={e => setNewCustData({...newCustData, name: e.target.value})} 
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none focus:bg-white focus:border-blue-500" 
                                    placeholder="ชื่อ - นามสกุลลูกค้า"
                                />
                            </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label className="block mb-1">เบอร์โทรศัพท์</label>
                                <input 
                                    type="text" 
                                    value={newCustData.phone} 
                                    onChange={e => setNewCustData({...newCustData, phone: e.target.value})} 
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none focus:bg-white focus:border-blue-500 font-mono" 
                                    placeholder="020xxxxxxxx หรือ 08xxxxxxxx"
                                />
                            </div>
                            <div>
                                <label className="block mb-1">LINE ID</label>
                                <input 
                                    type="text" 
                                    value={newCustData.lineId} 
                                    onChange={e => setNewCustData({...newCustData, lineId: e.target.value})} 
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none focus:bg-white focus:border-blue-500 font-mono" 
                                    placeholder="ไอดีไลน์ลูกค้า"
                                />
                            </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label className="block mb-1">ประเภทลูกค้า</label>
                                <select 
                                    value={newCustData.type} 
                                    onChange={e => setNewCustData({...newCustData, type: e.target.value})} 
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none"
                                >
                                    {activeCustomerTypes.map(t => <option key={t.id} value={t.name}>{t.name}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block mb-1">ผู้ปิดการขาย (Closer)</label>
                                <select 
                                    value={newCustData.closer} 
                                    onChange={e => setNewCustData({...newCustData, closer: e.target.value})} 
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none"
                                >
                                    <option value="">-- เลือกผู้ปิดการขาย --</option>
                                    {(closers || []).map(cl => <option key={cl.id} value={cl.name}>{cl.name}</option>)}
                                </select>
                            </div>
                        </div>

                        <div>
                            <label className="block mb-1">
                                เจ้าของเคส (พนักงานการตลาดที่ดูแล)
                                {isMarketerRole && <span className="text-blue-600 font-bold ml-1">(ล็อคเป็นชื่อของคุณ)</span>}
                            </label>
                            {isMarketerRole ? (
                                <input 
                                    type="text" 
                                    value={`${currentUserId} - ${currentUserName}`} 
                                    readOnly 
                                    className="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 font-bold text-slate-700 cursor-not-allowed"
                                />
                            ) : (
                                <select 
                                    value={newCustData.memberId} 
                                    onChange={e => {
                                        const m = members.find(mem => mem.id === e.target.value);
                                        setNewCustData({...newCustData, memberId: e.target.value, memberName: m ? m.name : e.target.value});
                                    }} 
                                    className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none"
                                >
                                    <option value="">-- เลือกพนักงานเจ้าของเคส --</option>
                                    {(members || []).map(m => <option key={m.id} value={m.id}>{m.id} - {m.name}</option>)}
                                </select>
                            )}
                        </div>

                        <div>
                            <label className="block mb-1">โรค / อาการป่วย</label>
                            <textarea 
                                value={newCustData.symptom} 
                                onChange={e => setNewCustData({...newCustData, symptom: e.target.value})} 
                                rows="3" 
                                className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 outline-none focus:bg-white focus:border-blue-500" 
                                placeholder="รายละเอียดอาการป่วย ยาที่สนใจ..."
                            ></textarea>
                        </div>

                        <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                            <button 
                                type="button" 
                                onClick={() => setShowAddCustModal(false)} 
                                className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 rounded-xl font-bold text-slate-600 transition-colors"

                                ยกเลิก
                            </button>
                            <button 
                                type="submit" 
                                disabled={isAddingCust || (duplicateMatchAdd && isDuplicateOwnedByOther && (!isAdmin || !newCustData.adminOverride))} 
                                className="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold shadow-sm disabled:opacity-50 transition-all inline-flex items-center gap-1.5"
                            >
                                <IconSave size={15} />
                                <span>{isAddingCust ? 'กำลังบันทึก...' : 'บันทึกข้อมูลลูกค้า'}</span>
                            </button>
                        </div>
                    </form>

    // ==========================================
    // 📌 Main Application Parent Component
    // ==========================================
    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      
      const [products, setProducts] = useState([]);
      const [customerTypes, setCustomerTypes] = useState(fallbackCustomerTypes);
      const [closers, setClosers] = useState([]);
      const [members, setMembers] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [sales, setSales] = useState([]);
      const [notificationTemplates, setNotificationTemplates] = useState([]);
      const [systemUsers, setSystemUsers] = useState([]);
      const [isAppLoading, setIsAppLoading] = useState(true);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch(e) { return false; }
      });
      
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const showToast = (message, type = 'success') => { setToast({ show: true, message, type }); };

      const pagePerm = window.getUserPagePermission ? window.getUserPagePermission(currentUser, 'customers') : 'none';
      const isAdmin = currentUser && (
          String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || 
          String(currentUser.role).trim().toLowerCase().includes('admin') || 
          String(currentUser.role).trim().includes('แอดมิน') ||
          pagePerm === 'full'
      );
      const currentUserProfileUrl = currentUser?.profileUrl || '';

      const activeCustomerTypes = useMemo(() => {
          if (!customerTypes || customerTypes.length === 0) return fallbackCustomerTypes;
          return (customerTypes || []).filter(p => p && p.status === 'ใช้งาน');
      }, [customerTypes]);

      const loadAppData = useCallback(async (forcedUser = null) => {
        const targetUser = forcedUser || currentUser || JSON.parse(localStorage.getItem('stk_current_user') || 'null');
        const userIsAdmin = targetUser && (
            String(targetUser.role).trim() === 'ผู้ดูแลระบบ' || 
            String(targetUser.role).trim().toLowerCase().includes('admin') || 
            String(targetUser.role).trim().includes('แอดมิน')
        );

        // Load local snapshot first (Preserving Egress)
        try {
            const cachedData = localStorage.getItem('stk_app_cache_data');
            const cacheTime = localStorage.getItem('stk_app_cache_time');
            if (cachedData && cacheTime) {
                const parsedData = JSON.parse(cachedData);
                applyDataToStates(parsedData);
                const age = Date.now() - Number(cacheTime);
                if (age < 25000) { 
                    setIsAppLoading(false);
                    return;
                }
            }
        } catch (e) {}

        try {
            const custLimit = userIsAdmin ? 3000 : 1500;
            const [pRes, typeRes, cloRes, memRes, custRes, saleRes, notifRes] = await Promise.all([
              supabaseSelect('stk_products', 'select=product_id,name,category,price_full,price_member,price_promo,give_pv,status').catch(() => []),
              supabaseSelect('stk_customer_types').catch(() => fallbackCustomerTypes),
              supabaseSelect('stk_closers').catch(() => []),
              supabaseSelect('stk_members', 'select=user_id,name,business_team,permission_role,status,phone_number').catch(() => []),
              supabaseSelect('stk_customers', `select=customer_id,name,phone,line_id,line_uid,customer_type,symptom_disease,closer_id,owner_member_id,extra_details_json,created_at&order=customer_id.desc&limit=${custLimit}`).catch(() => []),
              supabaseSelect('stk_sales', 'select=order_id,customer_id,seller_id,items_json,date,total_amount,recorded_by&order=order_id.desc&limit=300').catch(() => []),
              supabaseSelect('stk_notification_templates', 'order=trigger_days.asc').catch(() => [])
            ]);

            const resObj = {
                products: pRes,
                customerTypes: typeRes,
                closers: cloRes,
                members: memRes,
                customers: custRes,
                sales: saleRes,
                notificationTemplates: notifRes
            };
            applyDataToStates(resObj);

            try {
                localStorage.setItem('stk_app_cache_data', JSON.stringify(resObj));
                localStorage.setItem('stk_app_cache_time', String(Date.now()));
            } catch(e){}
        } catch (err) {
            console.error("Supabase load error:", err);
        } finally {
            setIsAppLoading(false);
        }
      }, [currentUser]);

      useEffect(() => {
        const savedUserStr = localStorage.getItem('stk_current_user');
        if (savedUserStr) {
          try {
            const user = JSON.parse(savedUserStr);
            setCurrentUser(user);
            setIsLoggedIn(true);
            loadAppData(user);
          } catch(e) { 
            localStorage.removeItem('stk_current_user'); 
            loadAppData(null);
          }
        } else {
          loadAppData(null);
        }

        const initialLoader = document.getElementById('initial-loader');
        if (initialLoader) { 
            initialLoader.style.opacity = '0'; 
            setTimeout(() => { if (initialLoader) initialLoader.style.display = 'none'; }, 400); 
        }
      }, [loadAppData]);

      const applyDataToStates = (response) => {
           if (Array.isArray(response.products)) setProducts(response.products);
           if (Array.isArray(response.customerTypes)) setCustomerTypes(response.customerTypes);
           if (Array.isArray(response.closers)) setClosers(response.closers);
           if (Array.isArray(response.members)) setMembers(response.members);
           if (Array.isArray(response.notificationTemplates)) setNotificationTemplates(response.notificationTemplates);

           const loadedMembers = Array.isArray(response.members) ? response.members.map(m => ({
               id: String(m.id || m.user_id || m.User_ID || '').trim(),
               name: String(m.name || m.Name || '').trim()
           })) : [];
           
           if (Array.isArray(response.customers)) {
               const formattedCustomers = response.customers.map(x => {
                   const cid = String(x.id || x.customer_id || x.Customer_ID || '').trim();
                   const cName = String(x.name || x.customer_name || x.Customer_Name || '').trim();
                   const cPhone = String(x.phone || x.phone_number || x.Phone || '').trim();
                   const cLineId = String(x.lineId || x.line_id || x.LINE_ID || '').trim();
                   const cLineUid = String(x.lineUid || x.line_uid || x.LINE_UID || '').trim();
                   const cType = String(x.type || x.customer_type || x.Customer_Type || '').trim();
                   const cSymptom = String(x.symptom || x.symptom_disease || x.disease || x.Symptom || '').trim();
                   const cCloser = String(x.closer || x.closer_id || x.closer_name || x.Closer || '').trim();
                   const cMemberId = String(x.memberId || x.owner_member_id || x.member_id || x.User_ID || '').trim();

                   const mMatch = loadedMembers.find(m => m && (
                       safeUpper(m.id) === safeUpper(cMemberId) || safeUpper(m.name) === safeUpper(cMemberId)
                   ));
                   const resolvedMemberId = mMatch ? mMatch.id : cMemberId;
                   const extra = parseExtraDetails(x.extra_details_json);
                   const cMemberName = extra.memberName || (mMatch ? mMatch.name : (x.memberName || x.member_name || cMemberId));

                   return {
                       ...x,
                       id: cid,
                       name: cName,
                       phone: cPhone,
                       lineId: cLineId,
                       lineUid: cLineUid,
                       type: cType,
                       symptom: cSymptom,
                       closer: cCloser,
                       memberId: resolvedMemberId,
                       memberName: cMemberName
                   };
               }).filter(c => c.id !== '');

               setCustomers(formattedCustomers);
           }

           if (Array.isArray(response.sales)) setSales(response.sales);
      };

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col lg:flex-row font-sans antialiased text-slate-800 w-full">
          <Toast toast={toast} setToast={setToast} />
          
          <Sidebar 
            activePage="customers" 
            isSidebarCollapsed={isSidebarCollapsed} 
            setIsSidebarCollapsed={setIsSidebarCollapsed} 
            isAdmin={isAdmin}
            currentUserProfileUrl={currentUserProfileUrl}
            currentUser={currentUser}
            isLoggedIn={isLoggedIn}
            onLogout={() => { 
              localStorage.removeItem('stk_current_user'); 
              setIsLoggedIn(false); 
              setCurrentUser(null); 
              const targetUrl = typeof resolvePageUrl === 'function' ? resolvePageUrl('?page=dashboard') : 'Mlm.html';
              if (typeof window !== 'undefined') window.location.href = targetUrl;
            }}
            showLoginModal={showLoginModal}
            setShowLoginModal={setShowLoginModal}
            setIsAppLoading={setIsAppLoading}
          />

          <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full max-w-full overflow-x-hidden p-3 sm:p-5 lg:p-6 box-border`}>
            <div className="w-full flex-1">
                {isAppLoading ? (
                  <div className="flex flex-col items-center justify-center py-32 gap-3 animation-fade-in">
                    <div className="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                    <span className="text-sm font-bold text-slate-500">กำลังโหลดข้อมูลลูกค้า & CRM...</span>
                  </div>
                ) : (
                  <CustomerManagementView 
                    sales={sales} 
                    customers={customers} 
                    members={members} 
                    closers={closers} 
                    activeCustomerTypes={activeCustomerTypes} 
                    setCustomers={setCustomers} 
                    showToast={showToast} 
                    isAdmin={isAdmin}
                    currentUser={currentUser}
                    onRefresh={loadAppData}
                    notificationTemplates={notificationTemplates}
                  />
                )}
              </div>
          </main>

          <LoginModal 
            isOpen={showLoginModal} 
            onClose={() => setShowLoginModal(false)} 
            onLoginSuccess={(u) => { 
                setCurrentUser(u); 
                setIsLoggedIn(true); 
                setShowLoginModal(false); 
                loadAppData(u);
            }} 
            systemUsers={systemUsers} 
          />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
