<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
<script>
  (function() {
    try {
      var theme = localStorage.getItem('stk_theme');
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.backgroundColor = '#0f172a';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.backgroundColor = '#f8fafc';
      }
    } catch (e) {}
  })();
</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผังองค์กร (Org Chart) - LOVE STK GROUPE</title>
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
    <link rel="stylesheet" href="mainstyle.css?v=6">
    <script>(function () { var w = console.warn; console.warn = function () { var m = arguments[0] ? String(arguments[0]) : ''; if (m.includes('cdn.tailwindcss.com') || m.includes('in-browser Babel transformer')) return; w.apply(console, arguments); }; })();</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="dictionary.js"></script>
    <script src="CommonComponents.js?v=3"></script>
    <script src="orgChartLogic.js"></script>
</head>

<body class="antialiased overflow-x-hidden selection:bg-blue-600 selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef, useCallback } = React;
        const { LayoutDashboard, ShoppingCart, Users, Contact, Headset, BarChart3, Plus, Edit, Trash2, UserCircle, Menu, X, Save, Info, PackageIcon, Package, Target, Trophy, Activity, Eye, Tags, CheckCircle, GitBranch, Archive, ChevronDown, FileText, SettingsIcon, Coins, ShieldCheck, AlertTriangle, AlertCircle, LoginModal, Toast, Sidebar, Header, ConfirmModal, EditModal, DonutChart, AutoSuggestInput, SearchIcon, getUserPagePermission, resolvePageUrl, fallbackCustomerTypes, fallbackProductsList } = window;

        // 🔀 OrgChartLogic Delegation
        const OrgChartLogic = window.OrgChartLogic || {};
        const getChildren = (membersList, parentId) => (OrgChartLogic.getChildren ? OrgChartLogic.getChildren(membersList, parentId) : []);
        const getAllDownlineIds = (membersList, rootId) => (OrgChartLogic.getAllDownlineIds ? OrgChartLogic.getAllDownlineIds(membersList, rootId) : new Set());
        const MemberPerformanceDetailModal = ({ isOpen, onClose, member, sales, members, products, customerTypes, systemSettings, teamMap, startDate, endDate, isAdmin }) => {
            if (!isOpen || !member) return null;

            const defRange = (window.OrgChartLogic?.getDefaultMonthRange) ? window.OrgChartLogic.getDefaultMonthRange() : { start: '', end: '' };
            const [modalStartDate, setModalStartDate] = useState(startDate || defRange.start);
            const [modalEndDate, setModalEndDate] = useState(endDate || defRange.end);

            const perf = useMemo(() => {
                if (!window.OrgChartLogic?.calculateMemberPerformanceDetails) return null;
                return window.OrgChartLogic.calculateMemberPerformanceDetails({
                    member,
                    sales,
                    members,
                    products,
                    systemSettings,
                    businessTeams: teamMap,
                    startDate: modalStartDate,
                    endDate: modalEndDate
                });
            }, [member, sales, members, products, systemSettings, teamMap, modalStartDate, modalEndDate]);

            const isLeaderWithTeam = perf?.isLeaderWithTeam ?? false;
            const downlinesWithLevels = perf?.downlinesWithLevels ?? [];
            const levelSummaryText = perf?.levelSummaryText ?? 'ไม่มีลูกทีม';
            const personalTotalBoxes = perf?.personalTotalBoxes ?? 0;
            const downlineTotalBoxes = perf?.downlineTotalBoxes ?? 0;
            const groupTotalBoxes = perf?.groupTotalBoxes ?? 0;
            const memberAccumulatedPV = perf?.memberAccumulatedPV ?? 0;
            const personalTotalLAK = perf?.personalTotalLAK ?? 0;
            const downlineTotalLAK = perf?.downlineTotalLAK ?? 0;
            const overallTeamTotalLAK = perf?.overallTeamTotalLAK ?? 0;
            const meetCommCondition = perf?.meetCommCondition ?? true;
            const personalCategorized = perf?.personalCategorized ?? {};
            const downlineCategorized = perf?.downlineCategorized ?? {};
            const totalTeamCategorized = perf?.totalTeamCategorized ?? {};
            const totalFullBoxes = perf?.totalFullBoxes ?? 0;
            const totalMemberBoxes = perf?.totalMemberBoxes ?? 0;
            const totalPromoBoxes = perf?.totalPromoBoxes ?? 0;
            const totalZeroBoxes = perf?.totalZeroBoxes ?? 0;
            const totalFullBoxesPersonal = perf?.totalFullBoxesPersonal ?? 0;
            const personalTotalMarginTHB = perf?.personalTotalMarginTHB ?? 0;
            const marginMinBoxes = perf?.marginMinBoxes ?? 10;
            const isEligibleForMargin = perf?.isEligibleForMargin ?? false;
            const salesByLevelStats = perf?.salesByLevelStats ?? {};
            const productSummaryMap = perf?.productSummaryMap ?? [];
            const maxDownlines = perf?.maxDownlines ?? 5;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-slate-900/60 backdrop-blur-sm animation-fade-in overflow-y-auto">
                    <div className="bg-white rounded-3xl shadow-2xl border border-slate-100 w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden my-auto">

                        {/* 🟣 Modal Header (Gradient Header) */}
                        <div className="bg-gradient-to-r from-blue-700 via-indigo-700 to-purple-800 p-6 text-white relative shrink-0">
                            <button
                                onClick={onClose}
                                className="absolute top-5 right-5 w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition-colors text-lg font-bold"
                            >
                                ✕
                            </button>

                            <div className="flex flex-col sm:flex-row items-start sm:items-center gap-4">
                                <div className="w-16 h-16 rounded-full border-2 border-white/80 p-0.5 bg-white shrink-0 overflow-hidden shadow-lg">
                                    {(member.profileUrl && member.profileUrl !== '-' && String(member.profileUrl).trim() !== '') ? (
                                        <img src={member.profileUrl} onError={e => e.target.style.display = 'none'} className="w-full h-full rounded-full object-cover" />
                                    ) : (
                                        <div className="w-full h-full rounded-full bg-blue-100 text-blue-700 font-black flex items-center justify-center text-xl">
                                            {member.name ? member.name.substring(0, 2) : member.id}
                                        </div>
                                    )}
                                </div>

                                <div className="flex-1 min-w-0">
                                    <div className="flex items-center gap-2 flex-wrap">
                                        <h2 className="text-xl sm:text-2xl font-black tracking-tight drop-shadow-sm">{member.name}</h2>
                                        <span className="bg-white/20 text-white font-mono font-bold text-xs px-2.5 py-0.5 rounded-full border border-white/30">
                                            {member.id}
                                        </span>
                                        <span className={`text-xs font-black px-2.5 py-0.5 rounded-full ${isLeaderWithTeam || member.role === 'หัวหน้าสายงาน' ? 'bg-amber-400 text-slate-900' : 'bg-blue-400 text-slate-900'}`}>
                                            {isLeaderWithTeam || member.role === 'หัวหน้าสายงาน' ? '👑 หัวหน้าสายงาน (แม่ทีม)' : `👤 ${member.role || 'พนักงานการตลาด'}`}
                                        </span>
                                    </div>
                                    <p className="text-xs font-bold text-blue-100/90 mt-1">
                                        สังกัดทีม: <span className="text-amber-300">{teamMap?.[String(member.team).trim().toUpperCase()] || member.team || 'Marketing'}</span> • ผู้แนะนำ: <span className="text-white">{member.referrer || 'ไม่มี (บริษัทรับตรง)'}</span>
                                    </p>

                                    {/* Date Filter Controls */}
                                    <div className="flex flex-wrap items-center gap-2 mt-3 pt-3 border-t border-white/10 text-xs">
                                        <span className="font-bold text-blue-200">📅 ช่วงวันที่:</span>
                                        <input
                                            type="date"
                                            value={modalStartDate}
                                            onChange={e => setModalStartDate(e.target.value)}
                                            className="bg-white/10 border border-white/20 rounded-lg px-2.5 py-1 text-white outline-none focus:border-white font-bold"
                                        />
                                        <span className="text-blue-200 font-bold">-</span>
                                        <input
                                            type="date"
                                            value={modalEndDate}
                                            onChange={e => setModalEndDate(e.target.value)}
                                            className="bg-white/10 border border-white/20 rounded-lg px-2.5 py-1 text-white outline-none focus:border-white font-bold"
                                        />
                                        <button
                                            onClick={() => { setModalStartDate(''); setModalEndDate(''); }}
                                            className="bg-white/20 hover:bg-white/30 text-white px-3 py-1 rounded-lg font-bold transition-all ml-1"
                                        >
                                            🔄 รีเฟรช (แสดงทั้งหมด)
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 📜 Modal Body Content */}
                        <div className="p-6 overflow-y-auto space-y-6 flex-1 text-slate-800">

                            {/* 🟢 5 KPI Summary Cards (Including PV Accumulated Card) */}
                            <div className={`grid gap-3 ${isLeaderWithTeam ? 'grid-cols-2 sm:grid-cols-3 lg:grid-cols-5' : 'grid-cols-1 sm:grid-cols-3'}`}>
                                <div className="bg-blue-50/80 border border-blue-100 p-3.5 rounded-2xl text-center shadow-xs">
                                    <span className="text-[11px] font-bold text-blue-600 block">1. ยอดขายตัวเอง</span>
                                    <span className="text-2xl sm:text-3xl font-black text-blue-700 mt-1 block">{personalTotalBoxes}</span>
                                    <span className="text-[10px] text-blue-500 font-bold">กล่อง ({personalTotalLAK.toLocaleString()} LAK)</span>
                                </div>

                                {isLeaderWithTeam && (
                                    <div className="bg-pink-50/80 border border-pink-100 p-3.5 rounded-2xl text-center shadow-xs">
                                        <span className="text-[11px] font-bold text-pink-600 block">2. ยอดจากลูกทีม</span>
                                        <span className="text-2xl sm:text-3xl font-black text-pink-700 mt-1 block">{downlineTotalBoxes}</span>
                                        <span className="text-[10px] text-pink-500 font-bold">กล่อง (ปันผล {downlineTotalLAK.toLocaleString()} LAK)</span>
                                    </div>
                                )}

                                {isLeaderWithTeam && (
                                    <div className="bg-emerald-50/80 border border-emerald-100 p-3.5 rounded-2xl text-center shadow-xs">
                                        <span className="text-[11px] font-bold text-emerald-600 block">3. ยอดรวมสายงาน (ทีม)</span>
                                        <span className="text-2xl sm:text-3xl font-black text-emerald-700 mt-1 block">{groupTotalBoxes}</span>
                                        <span className="text-[10px] text-emerald-500 font-bold">กล่อง (รวม {overallTeamTotalLAK.toLocaleString()} LAK)</span>
                                    </div>
                                )}

                                {/* 🏆 PV ACCUMULATED KPI CARD */}
                                <div className="bg-purple-50/80 border border-purple-200/80 p-3.5 rounded-2xl text-center shadow-xs relative overflow-hidden">
                                    <span className="text-[11px] font-bold text-purple-700 block">⭐ แต้ม PV สะสม</span>
                                    <span className="text-2xl sm:text-3xl font-black text-purple-800 mt-1 block font-mono">{(memberAccumulatedPV || 0).toLocaleString()}</span>
                                </div>

                                <div className="bg-slate-50/80 border border-slate-200 p-3.5 rounded-2xl text-center shadow-xs">
                                    <span className="text-[11px] font-bold text-slate-600 block">ทีมงานใต้ดูแล</span>
                                    <span className="text-2xl sm:text-3xl font-black text-slate-700 mt-1 block">{downlinesWithLevels.length}</span>
                                    <span className="text-[10px] text-slate-600 font-bold block truncate">คน ({levelSummaryText})</span>
                                </div>
                            </div>

                            {/* 📋 Section 1: Dividend Summary Tables */}
                            <div className="bg-slate-50 rounded-2xl p-4 border border-slate-100 space-y-6">
                                <h3 className="text-xs font-black text-slate-700 flex items-center gap-2 border-b border-slate-200 pb-2">
                                    <span>🧾 ตารางสรุปการปันผลยอดขายแยกตาม 4 หมวดสินค้า (Dividend Summary Tables):</span>
                                </h3>

                                {/* Table 1: Personal Sales */}
                                <div className="space-y-2">
                                    <div className="flex justify-between items-center">
                                        <h4 className="text-xs font-black text-blue-700 flex items-center gap-1.5">
                                            <span>👤 1. ยอดขายตัวเอง (Personal Sales)</span>
                                        </h4>
                                        <span className="text-xs font-black text-blue-600 bg-blue-50 px-2.5 py-0.5 rounded-lg border border-blue-200/60 font-mono">
                                            รวม {personalTotalBoxes} กล่อง | {personalTotalLAK.toLocaleString()} LAK
                                        </span>
                                    </div>
                                    <div className="overflow-x-auto rounded-xl border border-slate-200 bg-white">
                                        <table className="w-full text-xs text-left">
                                            <thead className="bg-blue-50/60 text-slate-600 font-bold border-b border-slate-200">
                                                <tr>
                                                    <th className="p-2.5 text-center">ลำดับ</th>
                                                    <th className="p-2.5">หมวดสินค้า</th>
                                                    <th className="p-2.5 text-center">จำนวนกล่อง</th>
                                                    <th className="p-2.5 text-right">ราคาปันผล/กล่อง</th>
                                                    <th className="p-2.5 text-right">ยอดรวมสุทธิ</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 font-bold">
                                                {Object.values(personalCategorized).filter(cat => cat.totalQty > 0).map((cat, idx) => (
                                                    <tr key={cat.key} className="bg-blue-50/20">
                                                        <td className="p-2.5 text-center text-slate-400">{idx + 1}</td>
                                                        <td className="p-2.5 text-slate-800">{cat.name}</td>
                                                        <td className="p-2.5 text-center text-blue-600 font-black">{cat.totalQty}</td>
                                                        <td className="p-2.5 text-right text-slate-500 font-mono">{cat.rate.toLocaleString()} LAK</td>
                                                        <td className="p-2.5 text-right text-emerald-600 font-black font-mono">{cat.totalLAK.toLocaleString()} LAK</td>
                                                    </tr>
                                                ))}
                                                {Object.values(personalCategorized).every(cat => cat.totalQty === 0) && (
                                                    <tr><td colSpan="5" className="p-4 text-center text-slate-400 text-xs">ยังไม่มียอดขายในช่วงเวลาที่เลือก</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                {/* Table 2: Downline Team Dividend (ONLY FOR LEADERS WITH TEAM) */}
                                {isLeaderWithTeam && (
                                    <div className="space-y-2 pt-2">
                                        <div className="flex justify-between items-center">
                                            <h4 className="text-xs font-black text-pink-700 flex items-center gap-1.5">
                                                <span>👑 2. ค่าปันผลยอดขายจากลูกทีม (Downline Team Dividend)</span>
                                            </h4>
                                            <span className="text-xs font-black text-pink-600 bg-pink-50 px-2.5 py-0.5 rounded-lg border border-pink-200/60 font-mono">
                                                รวม {downlineTotalBoxes} กล่อง | ปันผล {downlineTotalLAK.toLocaleString()} LAK
                                            </span>
                                        </div>
                                        {!meetCommCondition && (
                                            <div className="bg-rose-50 border border-rose-200 text-rose-600 px-3 py-2 rounded-lg text-xs font-bold mb-2 mt-2 flex items-center gap-2">
                                                <span>⚠️ ยอดขายของคุณยังไม่ถึงเกณฑ์ได้รับค่าแนะนำจากลูกทีม</span>
                                            </div>
                                        )}
                                        <div className="overflow-x-auto rounded-xl border border-slate-200 bg-white">
                                            <table className="w-full text-xs text-left">
                                                <thead className="bg-pink-50/60 text-slate-600 font-bold border-b border-slate-200">
                                                    <tr>
                                                        <th className="p-2.5 text-center">ลำดับ</th>
                                                        <th className="p-2.5">หมวดสินค้า</th>
                                                        <th className="p-2.5 text-center">จำนวนกล่องลูกทีม</th>
                                                        <th className="p-2.5 text-right">ค่าธรรมเนียมปันผลชั้น/กล่อง</th>
                                                        <th className="p-2.5 text-right">ยอดรวมปันผลลูกทีม</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100 font-bold">
                                                    {Object.values(downlineCategorized).filter(cat => cat.totalQty > 0).map((cat, idx) => (
                                                        <tr key={cat.key} className="bg-pink-50/20">
                                                            <td className="p-2.5 text-center text-slate-400">{idx + 1}</td>
                                                            <td className="p-2.5 text-slate-800">{cat.name}</td>
                                                            <td className="p-2.5 text-center text-pink-600 font-black">{cat.totalQty}</td>
                                                            <td className="p-2.5 text-right text-slate-500 font-mono">{cat.l1Rate.toLocaleString()} LAK</td>
                                                            <td className="p-2.5 text-right text-pink-600 font-black font-mono">{cat.totalLAK.toLocaleString()} LAK</td>
                                                        </tr>
                                                    ))}
                                                    {Object.values(downlineCategorized).every(cat => cat.totalQty === 0) && (
                                                        <tr><td colSpan="5" className="p-4 text-center text-slate-400 text-xs">ลูกทีมยังไม่มียอดขายในช่วงเวลาที่เลือก</td></tr>
                                                    )}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                {/* Table 3: Personal Sales Margin (Retail Profit) */}
                                <div className="space-y-2 pt-2 border-t border-slate-200">
                                    <div className="flex justify-between items-center">
                                        <h4 className="text-xs font-black text-amber-700 flex items-center gap-1.5">
                                            <span>💰 3. รายการค่าส่วนต่างราคาเต็ม (Personal Retail Profit / Margin)</span>
                                        </h4>
                                        <span className="text-xs font-black text-amber-600 bg-amber-50 px-2.5 py-0.5 rounded-lg border border-amber-200/60 font-mono font-bold">
                                            รวม {Object.values(personalCategorized).reduce((acc, c) => acc + c.fullQty, 0)} กล่องราคาเต็ม | ส่วนต่าง {personalTotalMarginTHB.toLocaleString()} บาท
                                        </span>
                                    </div>
                                    <div className="overflow-x-auto rounded-xl border border-slate-200 bg-white">
                                        <table className="w-full text-xs text-left">
                                            <thead className="bg-amber-50/60 text-slate-600 font-bold border-b border-slate-200">
                                                <tr>
                                                    <th className="p-2.5 text-center">ลำดับ</th>
                                                    <th className="p-2.5">หมวดสินค้า</th>
                                                    <th className="p-2.5 text-center">จำนวนกล่องราคาเต็ม</th>
                                                    <th className="p-2.5 text-right">ส่วนต่างปันผล/กล่อง (บาท)</th>
                                                    <th className="p-2.5 text-right">ยอดรวมค่าส่วนต่าง (บาท)</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 font-bold">
                                                {Object.values(personalCategorized).filter(cat => cat.fullQty > 0 && cat.marginLAK > 0).map((cat, idx) => {
                                                    const rate = cat.fullQty > 0 ? (cat.marginLAK / cat.fullQty) : 0;
                                                    return (
                                                        <tr key={cat.key} className="bg-amber-50/20">
                                                            <td className="p-2.5 text-center text-slate-400">{idx + 1}</td>
                                                            <td className="p-2.5 text-slate-800">{cat.name}</td>
                                                            <td className="p-2.5 text-center text-amber-600 font-black">{cat.fullQty}</td>
                                                            <td className="p-2.5 text-right text-slate-500 font-mono">{rate.toLocaleString()} บาท</td>
                                                            <td className="p-2.5 text-right text-amber-600 font-black font-mono">{cat.marginLAK.toLocaleString()} บาท</td>
                                                        </tr>
                                                    );
                                                })}
                                                {Object.values(personalCategorized).every(cat => cat.fullQty === 0 || cat.marginLAK === 0) && (
                                                    <tr><td colSpan="5" className="p-4 text-center text-slate-400 text-xs">ไม่มียอดขายสินค้าโหมดราคาเต็มที่มีค่าส่วนต่างในช่วงเวลาที่เลือก</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                {/* 💰 WIDE RETAIL PROFIT MARGIN BLOCK (Moved to bottom) */}
                                <div className="bg-amber-50 border border-amber-200 p-5 rounded-2xl flex flex-col md:flex-row items-start md:items-center justify-between gap-4 shadow-sm">
                                    <div>
                                        <span className="text-xs font-black tracking-wider uppercase block text-amber-800">
                                            💰 ค่าส่วนต่างราคาเต็มสะสม (Personal Retail Profit / Margin)
                                        </span>
                                        <span className="text-[10px] font-bold text-amber-600 block mt-1">
                                            ยอดสะสมจากสินค้าโหมดราคาเต็มทั้งหมด: {totalFullBoxesPersonal} กล่อง
                                        </span>
                                        {!isEligibleForMargin && (
                                            <span className="text-[11px] font-black text-rose-600 block mt-1">
                                                ⚠️ ยอดกล่องราคาเต็มยังไม่ถึงเกณฑ์ขั้นต่ำ {marginMinBoxes} กล่อง เพื่อรับปันผลส่วนต่างนี้
                                            </span>
                                        )}
                                        {isEligibleForMargin && (
                                            <span className="text-[11px] font-black text-emerald-600 block mt-1">
                                                ✅ บรรลุเกณฑ์ขั้นต่ำเพื่อรับปันผลส่วนต่างนี้เรียบร้อยแล้ว
                                            </span>
                                        )}
                                    </div>
                                    <div className="text-right">
                                        <span className={`text-2xl font-black block font-mono ${isEligibleForMargin ? 'text-amber-600' : 'text-slate-400 line-through'}`}>
                                            {personalTotalMarginTHB.toLocaleString()} บาท (THB)
                                        </span>
                                        {!isEligibleForMargin && (
                                            <span className="text-[10px] text-rose-500 font-bold block">
                                                สิทธิ์ได้รับจริง: 0 บาท
                                            </span>
                                        )}
                                    </div>
                                </div>

                                {/* Overall Total & Payout Net Balance Banner */}

                                        </span>

                                        <div>
                                            <span className="text-xs font-bold text-emerald-800 block">1. ราคาเต็ม</span>
                                            <span className="text-[9px] font-bold text-emerald-600">สินค้าราคาปกติ</span>
                                        </div>
                                        <span className="text-lg font-black text-emerald-700 bg-white px-3 py-1 rounded-xl border border-emerald-200 shadow-xs font-mono">

                                        </span>
                                    </div>

                                    <div className="bg-blue-50/80 border border-blue-200/80 p-3.5 rounded-2xl flex items-center justify-between">
                                        <div>
                                            <span className="text-xs font-bold text-blue-800 block">2. ราคาสมาชิก</span>
                                            <span className="text-[9px] font-bold text-blue-600">ราคาสมาชิกพิเศษ</span>
                                        </div>
                                        <span className="text-lg font-black text-blue-700 bg-white px-3 py-1 rounded-xl border border-blue-200 shadow-xs font-mono">
                                            {totalMemberBoxes} กล่อง
                                        </span>
                                    </div>

                                    {isAdmin && (
                                        <div className="bg-purple-50/80 border border-purple-200/80 p-3.5 rounded-2xl flex items-center justify-between">
                                            <div>
                                                <span className="text-xs font-bold text-purple-800 block">3. ราคาโปร</span>
                                                <span className="text-[9px] font-bold text-purple-600">สินค้าโปรโมชั่น</span>
                                            </div>
                                            <span className="text-lg font-black text-purple-700 bg-white px-3 py-1 rounded-xl border border-purple-200 shadow-xs font-mono">
                                                {totalPromoBoxes} กล่อง
                                            </span>
                                        </div>
                                    )}

                                    {isAdmin && (
                                        <div className="bg-amber-50/80 border border-amber-200/80 p-3.5 rounded-2xl flex items-center justify-between">
                                            <div>
                                                <span className="text-xs font-bold text-amber-800 block">4. ราคาศูนย์ (ฟรี)</span>
                                                <span className="text-[9px] font-bold text-amber-600">แถม/ทดลองใช้</span>
                                            </div>
                                            <span className="text-lg font-black text-amber-700 bg-white px-3 py-1 rounded-xl border border-amber-200 shadow-xs font-mono">
                                                {totalZeroBoxes} กล่อง
                                            </span>
                                        </div>
                                    )}
                                </div>
                            </div>
                            {/* 💎 Section 3: Dark Theme 4 Rate Breakdown Cards */}
                            <div className="bg-slate-900 text-white p-5 rounded-2xl space-y-4 shadow-xl">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                    <div className="flex items-center gap-2">
                                        <span className="text-lg">💎</span>
                                        <h3 className="text-xs font-black text-white">2. สรุปจำนวนกล่องตามการกำหนด 4 หมวดการปันผล (ค่าคอม & ค่าธรรมเนียมชั้น):</h3>
                                    </div>
                                    <span className="bg-slate-800 text-slate-300 text-[10px] font-bold px-2.5 py-1 rounded-full border border-slate-700 font-mono">
                                        รวม {isLeaderWithTeam ? groupTotalBoxes : personalTotalBoxes} กล่อง
                                    </span>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
                                    {Object.values(totalTeamCategorized).map((cat, idx) => {
                                        const colors = ['text-blue-400', 'text-emerald-400', 'text-purple-400', 'text-amber-400'];
                                        return (
                                            <div key={cat.key} className="bg-slate-800/80 border border-slate-700 p-3.5 rounded-xl space-y-2">
                                                <span className={`text-[11px] font-bold ${colors[idx]} block truncate`}>{idx + 1}. {cat.name}</span>
                                                <div className="flex justify-between items-center">
                                                    <div className="flex flex-wrap items-center gap-1 text-[9px] font-bold">
                                                        <span className="bg-emerald-900/60 text-emerald-300 px-1.5 py-0.5 rounded">เต็ม:{cat.fullQty}</span>
                                                        <span className="bg-blue-900/60 text-blue-300 px-1.5 py-0.5 rounded">สมาชิก:{cat.memberQty}</span>
                                                        {isAdmin && (
                                                            <span className="bg-purple-900/60 text-purple-300 px-1.5 py-0.5 rounded">โปร:{cat.promoQty}</span>
                                                        )}
                                                    </div>
                                                    <span className="text-sm font-black text-amber-300 bg-slate-900 px-2 py-1 rounded-lg border border-slate-700 font-mono">
                                                        {isLeaderWithTeam ? cat.totalQty : cat.personalQty}
                                                    </span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* 🎯 Section 4: Origin of Sales */}
                            <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-3">
                                <h3 className="text-xs font-black text-slate-700 flex items-center gap-2">
                                    <span>🎯 3. ที่มาของยอดแต่ละส่วน:</span>
                                </h3>

                                <div className="bg-white p-3.5 rounded-xl border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                    <div className="flex items-center gap-2.5">
                                        <span className="w-8 h-8 rounded-full bg-blue-100 text-blue-700 font-bold flex items-center justify-center text-xs">👤</span>
                                        <div>
                                            <span className="text-xs font-bold text-slate-800 block">ยอดขายพนักงานเอง</span>
                                            <span className="text-[10px] text-slate-400 font-bold">{member.name} ({member.id})</span>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3 font-mono">
                                        <span className="text-xs font-black text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg">{personalTotalBoxes} กล่อง</span>
                                        <span className="text-xs font-black text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg">{personalTotalLAK.toLocaleString()} LAK</span>
                                    </div>
                                </div>

                                                                {isLeaderWithTeam && (
                                    <div className="bg-white p-3.5 rounded-xl border border-slate-200 space-y-3">
                                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-slate-100 pb-2.5">
                                            <div className="flex items-center gap-2.5">
                                                <span className="w-8 h-8 rounded-full bg-pink-100 text-pink-700 font-bold flex items-center justify-center text-xs">👑</span>
                                                <div>
                                                    <span className="text-xs font-bold text-slate-800 block">ปันผลยอดขายจากทีมงาน ({downlinesWithLevels.length} คน)</span>
                                                    <span className="text-[10px] text-slate-400 font-bold">แจกแจงรายได้และจำนวนกล่องแยกตามชั้นสายงาน (Gen 1 - Gen N)</span>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-3 font-mono">
                                                <span className="text-xs font-black text-pink-600 bg-pink-50 px-2.5 py-1 rounded-lg">{downlineTotalBoxes} กล่อง</span>
                                                <span className="text-xs font-black text-pink-700 bg-pink-50 px-2.5 py-1 rounded-lg">{downlineTotalLAK.toLocaleString()} LAK</span>
                                            </div>
                                        </div>

                                        {/* 📊 Generation / Level Breakdown Grid */}
                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 pt-1">
                                            {Object.entries(salesByLevelStats).filter(([lvl, stat]) => (stat.members > 0 || stat.qty > 0)).map(([lvl, stat]) => {
                                                const isPaidLevel = Number(lvl) <= maxDownlines;
                                                return (
                                                    <div key={lvl} className={`p-2.5 rounded-xl border flex justify-between items-center ${isPaidLevel ? 'bg-pink-50/40 border-pink-200/70' : 'bg-slate-50 border-slate-200'}`}>
                                                        <div>
                                                            <div className="flex items-center gap-1.5">
                                                                <span className={`text-[11px] font-black ${isPaidLevel ? 'text-pink-700' : 'text-slate-600'}`}>
                                                                    ชั้น {lvl} (Gen {lvl})
                                                                </span>
                                                                <span className="text-[9px] font-bold px-1.5 py-0.2 bg-white rounded border border-slate-200 text-slate-500">
                                                                    {stat.members} คน
                                                                </span>
                                                            </div>
                                                            <div className="flex items-center gap-1.5 mt-0.5 font-mono">
                                                                <span className="text-[10px] font-bold text-slate-500 block">
                                                                    ยอดขาย {stat.qty} กล่อง
                                                                </span>
                                                                {!isPaidLevel && (
                                                                    <span className="text-[9px] font-bold text-amber-700 bg-amber-50 px-1 rounded border border-amber-200/60">
                                                                        ไม่จ่ายปันผล
                                                                    </span>
                                                                )}
                                                            </div>
                                                        </div>
                                                        <div className="text-right font-mono">
                                                            <span className={`text-xs font-black block ${isPaidLevel && stat.lak > 0 ? 'text-pink-700' : 'text-slate-400'}`}>
                                                                {stat.lak.toLocaleString()} LAK
                                                            </span>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                            </div>

                                                        {/* 📦 Section 5: Category & Product Summary Grid */}
                            <div className="space-y-4">
                                <div className="border-b border-slate-200 pb-2">
                                    <h3 className="text-xs font-black text-slate-800 flex items-center gap-2">
                                        <span>📦 ยอดขายจำแนกตามรายการสินค้า & รายละเอียดที่มาเงินตาม Gen</span>
                                    </h3>
                                    <p className="text-[10px] font-bold text-slate-400 mt-0.5">
                                        {isLeaderWithTeam ? 'สรุปจำนวนกล่องและปันผลแยกตาม Gen รายสินค้าของทั้งทีม' : 'สรุปจำนวนกล่องและปันผลแยกตามรายการสินค้าของพนักงาน'}
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    {productSummaryMap.length === 0 ? (
                                        <p className="text-xs font-bold text-slate-400 text-center py-6 col-span-2">ยังไม่มีประวัติการขายสินค้า</p>
                                    ) : (
                                        productSummaryMap.map((p, idx) => (
                                            <div key={p.name || idx} className="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 space-y-2.5 hover:border-slate-300 transition-colors shadow-xs">
                                                <div className="flex justify-between items-start border-b border-slate-200/80 pb-2">
                                                    <div>
                                                        <h4 className="text-xs font-black text-slate-800 uppercase tracking-tight">{p.name}</h4>
                                                        <span className="text-[9px] text-slate-400 font-bold">{p.category}</span>
                                                    </div>
                                                    <div className="text-right font-mono flex items-center gap-1.5">
                                                        <span className="text-xs font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded-lg border border-blue-200/60">{p.totalQty} กล่อง</span>
                                                        {p.totalLAK > 0 && (
                                                            <span className="text-xs font-black text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-lg border border-emerald-200/60">{p.totalLAK.toLocaleString()} LAK</span>
                                                        )}
                                                    </div>
                                                </div>

                                                {/* 🔹 Gen-by-Gen Detailed Payout for this Product */}
                                                <div className="space-y-1 pt-0.5">
                                                    {Object.values(p.byGen).sort((a, b) => a.gen - b.gen).map(g => {
                                                        const isPaid = g.gen <= maxDownlines;
                                                        const genLabel = g.gen === 0 ? '👤 ตัวเอง' : `👑 Gen ${g.gen} (ชั้น ${g.gen})`;
                                                        return (
                                                            <div key={g.gen} className="flex justify-between items-center text-[10px] font-mono px-2 py-0.5 rounded bg-white/80 border border-slate-100">
                                                                <span className="font-bold text-slate-600">{genLabel}: <b className="text-blue-700">{g.qty} กล่อง</b></span>
                                                                <span className={`font-black ${isPaid && g.lak > 0 ? 'text-emerald-600' : 'text-slate-400'}`}>
                                                                    {isPaid && g.lak > 0 ? `${g.lak.toLocaleString()} LAK` : '0 LAK'}
                                                                </span>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                        </div>

                        {/* 🔴 Modal Footer */}
                        <div className="p-4 bg-slate-50 border-t border-slate-200 flex justify-end shrink-0">
                            <button
                                onClick={onClose}
                                className="px-6 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-xs transition-colors"
                            >
                                ปิดหน้าต่าง
                            </button>
                        </div>

                    </div>
                </div>
            );
        };

        // 🟢 Compact, Clean & Collapsible Employee Card Component
        const EmployeeCardNode = ({ 
            node, 
            allMembers, 
            onSelect, 
            onOpenDetail, 
            memberSales, 
            teamMap, 
            level = 0, 
            currentUser, 
            isAdmin,
            collapsedNodeIds,
            toggleCollapse
        }) => {
            const children = getChildren(allMembers, node.id);
            const hasChildren = children.length > 0;
            const isLeader = hasChildren || node.role === 'หัวหน้าสายงาน' || node.role === 'Leader';
            const isCollapsed = collapsedNodeIds ? collapsedNodeIds.has(node.id) : false;

            // ตรวจว่า card นี้คือตัว currentUser เองหรือเปล่า
            const currentUserId = String(currentUser?.id || '').trim().toUpperCase();
            const nodeId = String(node.id || '').trim().toUpperCase();
            const isSelf = !!currentUserId && currentUserId === nodeId;
            const canOpenDetail = isAdmin || isSelf;

            return (
                <div className="flex flex-col items-center">
                    {/* Level Badge if level > 0 */}
                    {level > 0 && (
                        <div className="mb-1.5 z-10">
                            <span className="bg-emerald-50 text-emerald-700 text-[9px] font-black px-2.5 py-0.5 rounded-full border border-emerald-200/80 shadow-xs">
                                ชั้นที่ {level}
                            </span>
                        </div>
                    )}

                    {/* Main Compact Card Box */}
                    <div
                        onClick={() => onSelect(node)}
                        className={`p-3 w-[185px] rounded-2xl border transition-all duration-200 relative z-10 cursor-pointer flex flex-col items-center shadow-xs select-none bg-white ${
                            isLeader 
                                ? 'border-amber-200/90 hover:border-amber-400 hover:shadow-md' 
                                : 'border-slate-200 hover:border-blue-400 hover:shadow-md'
                        }`}
                    >
                        {/* Top Role Badge */}
                        <div className="mb-1.5">
                            {isLeader ? (
                                <span className="inline-flex items-center gap-1 bg-amber-50 text-amber-700 text-[8.5px] font-black px-2 py-0.5 rounded-full border border-amber-200/80">
                                    <svg className="w-2.5 h-2.5 fill-amber-500 shrink-0" viewBox="0 0 24 24"><path d="M2 20h20v2H2v-2zm2-2h16l-3-9-4 4-3-7-3 7-4-4-3 9z"/></svg>
                                    <span>หัวหน้าสายงาน</span>
                                </span>
                            ) : (
                                <span className="inline-flex items-center gap-1 bg-blue-50 text-blue-700 text-[8.5px] font-bold px-2 py-0.5 rounded-full border border-blue-200/80">
                                    <svg className="w-2.5 h-2.5 fill-blue-500 shrink-0" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                                    <span className="truncate max-w-[90px]">{node.role || 'พนักงานการตลาด'}</span>
                                </span>
                            )}
                        </div>

                        {/* Profile Picture Avatar */}
                        <div className="w-11 h-11 rounded-full p-0.5 bg-slate-100 border border-slate-200 shadow-xs flex items-center justify-center shrink-0 mb-1.5 overflow-hidden">
                            {(node.profileUrl && node.profileUrl !== '-' && String(node.profileUrl).trim() !== '') ? (
                                <img src={node.profileUrl} onError={e => e.target.style.display = 'none'} className="w-full h-full rounded-full object-cover" />
                            ) : (
                                <div className="w-full h-full rounded-full bg-blue-50 text-blue-700 flex items-center justify-center font-black text-xs">
                                    {node.name ? node.name.substring(0, 2) : node.id}
                                </div>
                            )}
                        </div>

                        {/* Details */}
                        <div className="text-center w-full space-y-1">
                            <h4 className="text-[11px] font-black text-slate-800 truncate px-1" title={node.name}>{node.name}</h4>

                            <div className="flex items-center justify-center gap-1 text-[8.5px]">
                                <span className="font-mono font-bold text-slate-500">{node.id}</span>
                                <span className="font-bold px-1.5 py-0.2 rounded bg-slate-100 text-slate-600 truncate max-w-[85px]">
                                    {teamMap?.[String(node.team).trim().toUpperCase()] || node.team || 'Marketing'}
                                </span>
                            </div>

                            {/* Downlines Toggle Pill (Interactive Expand / Collapse) */}
                            {hasChildren && (
                                <div className="pt-0.5 w-full">
                                    <button
                                        type="button"
                                        onClick={(e) => {
                                            e.stopPropagation();
                                            if (toggleCollapse) toggleCollapse(node.id);
                                        }}
                                        className={`w-full py-0.5 px-2 text-[8.5px] font-bold rounded-full border transition-all flex items-center justify-center gap-1 ${
                                            isCollapsed 
                                                ? 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100' 
                                                : 'bg-sky-50 text-sky-700 border-sky-100 hover:bg-sky-100'
                                        }`}
                                        title={isCollapsed ? 'คลิกเพื่อกางดูสายงานลูกทีม' : 'คลิกเพื่อพับเก็บสายงานลูกทีม'}
                                    >
                                        <svg className={`w-2.5 h-2.5 fill-current transition-transform duration-200 ${isCollapsed ? '-rotate-90' : 'rotate-0'}`} viewBox="0 0 24 24">
                                            <path d="M7 10l5 5 5-5z"/>
                                        </svg>
                                        <span className="truncate">{isCollapsed ? `ขยายลูกทีม (${children.length} คน)` : `มีลูกทีมดูแล ${children.length} คน`}</span>
                                    </button>
                                </div>
                            )}

                            {/* Action Button */}
                            <div className="pt-1">
                                {canOpenDetail ? (
                                    <button
                                        type="button"
                                        onClick={(e) => { e.stopPropagation(); onSelect(node); if (onOpenDetail) onOpenDetail(node); }}
                                        className="w-full py-1 bg-blue-50 hover:bg-blue-600 hover:text-white text-blue-600 text-[9.5px] font-black rounded-lg transition-all border border-blue-200/60 shadow-xs flex items-center justify-center gap-1"
                                    >
                                        <svg className="w-2.5 h-2.5 fill-current shrink-0" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                                        <span>คลิกดูผลงานและสายงาน</span>
                                    </button>
                                ) : (
                                    <div className="w-full py-1 bg-slate-50 text-slate-400 text-[9px] font-bold rounded-lg border border-slate-200 flex items-center justify-center gap-1 cursor-not-allowed">
                                        <span>ไม่มีสิทธิ์ดูรายละเอียด</span>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Recursive Children Level Breakdown with Hierarchy Lines */}
                    {hasChildren && !isCollapsed && (
                        <div className="flex flex-col items-center w-full mt-1 relative">
                            {/* Vertical line from parent card down */}
                            <div className="w-px h-4 bg-slate-300"></div>

                            {/* Children Container: neatly arranged in row */}
                            <div className="relative flex justify-center items-start gap-3 sm:gap-4 pt-4 px-2">
                                {children.map((child, cIdx) => {
                                    const isFirst = cIdx === 0;
                                    const isLast = cIdx === children.length - 1;
                                    const isSingle = children.length === 1;

                                    return (
                                        <div key={child.id} className="relative flex flex-col items-center">
                                            {/* Precise Horizontal Connector Bar: center of first to center of last */}
                                            {!isSingle && (
                                                <div
                                                    className="absolute top-0 h-px bg-slate-300 pointer-events-none"
                                                    style={{
                                                        left: isFirst ? '50%' : '0',
                                                        right: isLast ? '50%' : '0'
                                                    }}
                                                />
                                            )}
                                            {/* Vertical connector down to child card */}
                                            <div className="w-px h-4 bg-slate-300 -mt-4 mb-1 z-0 pointer-events-none"></div>
                                            <EmployeeCardNode
                                                node={child}
                                                allMembers={allMembers}
                                                memberSales={memberSales}
                                                onSelect={onSelect}
                                                onOpenDetail={onOpenDetail}
                                                teamMap={teamMap}
                                                level={level + 1}
                                                currentUser={currentUser}
                                                isAdmin={isAdmin}
                                                collapsedNodeIds={collapsedNodeIds}
                                                toggleCollapse={toggleCollapse}
                                            />
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        // 🟢 Main View Component with Responsive Flexible Grid Layout
        const SalesTeamHierarchyView = ({ members, sales, businessTeams, products, customerTypes, systemSettings, currentUser, isAdmin, loading }) => {
            const [searchQuery, setSearchQuery] = useState('');
            const [viewMode, setViewMode] = useState('tree');
            const [selectedMember, setSelectedMember] = useState(null);
            const [detailModalOpen, setDetailModalOpen] = useState(false);
            const [focusedLeaderId, setFocusedLeaderId] = useState('ALL');
            const [collapsedNodeIds, setCollapsedNodeIds] = useState(() => new Set());
            const [zoomScale, setZoomScale] = useState(100);

            // ✅ กรองเฉพาะคนที่มีสิทธิ์เป็น "พนักงานการตลาด" (Marketing) เท่านั้นที่จะแสดงในผังองค์กร
            const isMarketingRole = useCallback((m) => {
                if (!m) return false;
                const r = String(m.role || m.permission_role || m.Permission_Role || '').trim().toLowerCase();
                return r === 'พนักงานการตลาด' || r === 'marketing';
            }, []);

            const currentUserId = String(currentUser?.id || '').trim().toUpperCase();
            const isMarketingUser = currentUser && isMarketingRole(currentUser);
            const isScopeOwn = isMarketingUser && !isAdmin && !!currentUserId;

            const scopedMembers = useMemo(() => {
                // กรองเฉพาะคนที่มีสิทธิ์เป็นพนักงานการตลาดเท่านั้น (ตัด Staff, admin second, พนักงานทั่วไป, ผู้ดูแลระบบ ออกทั้งหมด)
                const marketingOnly = (members || []).filter(isMarketingRole);

                if (!isScopeOwn) return marketingOnly;

                // ถ้าเป็นพนักงานการตลาดล็อกอินเข้ามา (ไม่ใช่ Admin) ให้กรองดูได้เฉพาะตัวเองและ downline ในสายงาน
                const allowedIds = getAllDownlineIds(marketingOnly, currentUserId);
                return marketingOnly.filter(m => allowedIds.has(String(m.id || '').trim().toUpperCase()));
            }, [members, isMarketingRole, isScopeOwn, currentUserId]);

            const rootMembers = useMemo(() => {
                return (scopedMembers).filter(m => {
                    const ref = String(m.referrer || '').trim().toUpperCase();
                    const mid = String(m.id || '').trim().toUpperCase();
                    // root คือคนที่ไม่มี referrer, หรือ referrer ชี้มาที่ตัวเอง, หรือ referrer ไม่ได้อยู่ในกลุ่ม scopedMembers
                    return !ref || ref === mid || !(scopedMembers).some(p => String(p.id).trim().toUpperCase() === ref);
                });
            }, [scopedMembers]);

            // Filter root members by search query and focused leader
            const filteredRootMembers = useMemo(() => {
                if (!searchQuery) return rootMembers;
                return scopedMembers.filter(m =>
                    (m.name || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                    (m.id || '').toLowerCase().includes(searchQuery.toLowerCase())
                );
            }, [rootMembers, scopedMembers, searchQuery]);

            const displayedRootMembers = useMemo(() => {
                if (searchQuery) return filteredRootMembers;
                if (focusedLeaderId && focusedLeaderId !== 'ALL') {
                    const found = scopedMembers.find(m => String(m.id).trim().toUpperCase() === String(focusedLeaderId).trim().toUpperCase());
                    return found ? [found] : filteredRootMembers;
                }
                return filteredRootMembers;
            }, [focusedLeaderId, scopedMembers, filteredRootMembers, searchQuery]);

            const toggleCollapse = useCallback((nodeId) => {
                setCollapsedNodeIds(prev => {
                    const next = new Set(prev);
                    if (next.has(nodeId)) next.delete(nodeId);
                    else next.add(nodeId);
                    return next;
                });
            }, []);

            const collapseDeepLevels = useCallback(() => {
                const newCollapsed = new Set();
                (scopedMembers || []).forEach(m => {
                    const ch = getChildren(scopedMembers, m.id);
                    if (ch.length > 0 && !rootMembers.some(r => r.id === m.id)) {
                        newCollapsed.add(m.id);
                    }
                });
                setCollapsedNodeIds(newCollapsed);
            }, [scopedMembers, rootMembers]);

            const expandAllNodes = useCallback(() => {
                setCollapsedNodeIds(new Set());
            }, []);

            // Filter Bar States
            const [bonusCondition, setBonusCondition] = useState('แผนที่ 1 (% จากยอดรวม)');
            const [selectedCategory, setSelectedCategory] = useState('📦 สินค้าทั้งหมด');
            const getDefaultMonthRange = () => {
                const now = new Date();
                const y = now.getFullYear();
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const lastDay = new Date(y, now.getMonth() + 1, 0).getDate();
                return { start: `${y}-${m}-01`, end: `${y}-${m}-${String(lastDay).padStart(2, '0')}` };
            };
            const defMonthRange = getDefaultMonthRange();
            const [startDate, setStartDate] = useState(defMonthRange.start);
            const [endDate, setEndDate] = useState(defMonthRange.end);

            const teamMap = useMemo(() => {
                return (window.OrgChartLogic?.buildTeamMap) ? window.OrgChartLogic.buildTeamMap(businessTeams) : {};
            }, [businessTeams]);

            const memberSalesMap = useMemo(() => {
                const salesMap = {};
                (scopedMembers || []).forEach(m => {
                    salesMap[m.id] = { personal: 0, group: 0 };
                });

                (sales || []).forEach(s => {
                    const sellerId = String(s.sellerId || s.seller_id || s.seller || s.memberId || '').trim().toUpperCase();
                    const qty = Number(s['ยอดรวมชิ้นทั้งหมด'] || s.qty || s.quantity || 1);
                    if (salesMap[sellerId]) {
                        salesMap[sellerId].personal += qty;
                    }
                });

                if (window.OrgChartLogic?.calculateGroupSales) {
                    return window.OrgChartLogic.calculateGroupSales(scopedMembers, salesMap);
                }
                return salesMap;
            }, [scopedMembers, sales]);
            return (
                <div className="space-y-6 animation-fade-in pb-10 w-full">

                    {/* 📌 Header Title Bar */}
                    <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-100 w-full">
                        <div>
                            <h1 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-3">
                                <span className="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center border border-blue-100">
                                    <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M22 11V3h-7v3H9V3H2v8h7V8h2v10h4v3h7v-8h-7v3h-2V8h2v3h7zM4 5h3v4H4V5zm15 0h3v4h-3V5zm0 10h3v4h-3v-4z"/></svg>
                                </span>
                                <span>โครงสร้างทีมขาย (Sales Team Hierarchy)</span>
                            </h1>
                            <p className="text-xs text-slate-500 font-bold mt-1">
                                แสดงสายงานความสัมพันธ์พนักงาน • รายงานยอดขาย และระบบคำนวณ % ค่าตอบแทนตามสายงาน
                            </p>
                        </div>

                        {/* Top Right Toggle Buttons */}
                        <div className="flex items-center gap-1.5 bg-slate-100 p-1 rounded-xl border border-slate-200 w-full sm:w-auto">
                            <button
                                onClick={() => setViewMode('tree')}
                                className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${viewMode === 'tree' ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}
                            >
                                <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M22 11V3h-7v3H9V3H2v8h7V8h2v10h4v3h7v-8h-7v3h-2V8h2v3h7zM4 5h3v4H4V5zm15 0h3v4h-3V5zm0 10h3v4h-3v-4z"/></svg>
                                <span>ผังสายงาน (Tree)</span>
                            </button>
                            <button
                                onClick={() => setViewMode('team')}
                                className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${viewMode === 'team' ? 'bg-blue-600 text-white shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}
                            >
                                <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M4 11h6a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1zm1-6h4v4H5V5zm10-2h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1zm-1 6h-4V5h4v4zm-9 4H4a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1zm-1 6H5v-4h4v4zm10-6h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-6a1 1 0 0 0-1-1zm-1 6h-4v-4h4v4z"/></svg>
                                <span>แยกตามทีม (Teams)</span>
                            </button>
                        </div>
                    </div>

                    {/* Filter Bar */}
                    <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 flex flex-wrap items-center gap-3 w-full">
                        <div className="relative flex-1 min-w-[220px]">
                            <input
                                type="text"
                                placeholder="ค้นหารหัส หรือชื่อพนักงาน..."
                                value={searchQuery}
                                onChange={e => setSearchQuery(e.target.value)}
                                className="w-full bg-slate-50 border border-slate-200 text-xs font-bold rounded-xl px-3.5 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all"
                            />
                        </div>

                        <div className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-700">
                            <span className="text-slate-400">เงื่อนไขโบนัส:</span>
                            <select
                                value={bonusCondition}
                                onChange={e => setBonusCondition(e.target.value)}
                                className="bg-transparent text-blue-600 font-bold outline-none cursor-pointer"
                            >
                                <option value="แผนที่ 1 (% จากยอดรวม)">แผนที่ 1 (% จากยอดรวม)</option>
                                <option value="แผนที่ 2 (แบ่งตามชั้นลูกทีม)">แผนที่ 2 (แบ่งตามชั้นลูกทีม)</option>
                            </select>
                        </div>

                        <div className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-700">
                            <span className="text-slate-400">หมวดสินค้า:</span>
                            <select
                                value={selectedCategory}
                                onChange={e => setSelectedCategory(e.target.value)}
                                className="bg-transparent text-amber-600 font-bold outline-none cursor-pointer"
                            >
                                <option value="📦 สินค้าทั้งหมด">สินค้าทั้งหมด</option>
                                <option value="หมวดทั่วไป">หมวดทั่วไป</option>
                            </select>
                        </div>

                        <div className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-700">
                            <span className="text-slate-400">ช่วงวันที่:</span>
                            <input
                                type="date"
                                value={startDate}
                                onChange={e => setStartDate(e.target.value)}
                                className="bg-transparent text-blue-600 outline-none font-bold cursor-pointer"
                            />
                            <span className="text-slate-400">-</span>
                            <input
                                type="date"
                                value={endDate}
                                onChange={e => setEndDate(e.target.value)}
                                className="bg-transparent text-blue-600 outline-none font-bold cursor-pointer"
                            />
                        </div>

                        <button
                            type="button"
                            onClick={() => {
                                try {
                                    localStorage.removeItem('stk_app_cache_data');
                                    localStorage.removeItem('stk_app_cache_time');
                                } catch(e) {}
                                window.location.reload();
                            }}
                            className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-1.5 rounded-xl text-xs transition-colors flex items-center gap-1.5 shadow-sm active:scale-95"
                        >
                            <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                            <span>รีเฟรช</span>
                        </button>
                    </div>

                    {/* 🌟 Org Tree Canvas Container */}
                    <div className="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden flex flex-col flex-1 min-h-[600px] mb-8">
                        {/* Secondary Interactive Toolbar for Tree Mode */}
                        {viewMode === 'tree' && (
                            <div className="px-5 py-3 border-b border-slate-100 bg-slate-50/70 flex flex-wrap items-center justify-between gap-3 text-xs">
                                {/* Left Side: สายงานผู้นำ Focus + Expand/Collapse Buttons */}
                                <div className="flex flex-wrap items-center gap-3">
                                    {isAdmin && (
                                        <div className="flex items-center gap-2 bg-white border border-slate-200 rounded-xl px-3 py-1.5 shadow-2xs">
                                            <span className="text-slate-500 font-bold flex items-center gap-1">
                                                <svg className="w-3.5 h-3.5 text-blue-500 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                                                สายงานผู้นำ:
                                            </span>
                                            <select
                                                value={focusedLeaderId}
                                                onChange={e => setFocusedLeaderId(e.target.value)}
                                                className="bg-transparent font-black text-blue-700 outline-none cursor-pointer max-w-[200px] sm:max-w-xs truncate"
                                            >
                                                <option value="ALL">🌐 ทุกสายงาน (ภาพรวมทั้งหมด {rootMembers.length} สาย)</option>
                                                {rootMembers.map(r => (
                                                    <option key={r.id} value={r.id}>
                                                        👑 {r.name || r.id} ({teamMap[String(r.team || '').trim().toUpperCase()] || r.team || 'สายงาน'})
                                                    </option>
                                                ))}
                                            </select>
                                        </div>
                                    )}

                                    {/* Quick Expand / Collapse Actions */}
                                    <div className="flex items-center gap-1 bg-white border border-slate-200 rounded-xl p-0.5 shadow-2xs">
                                        <button
                                            type="button"
                                            onClick={() => setCollapsedNodeIds(new Set())}
                                            className="px-2.5 py-1 rounded-lg text-slate-700 hover:bg-slate-100 font-bold transition-all flex items-center gap-1"
                                            title="ขยายทุกกิ่งสายงานในผัง"
                                        >
                                            <span className="text-blue-600 font-black">⊞</span>
                                            <span>ขยายทั้งหมด</span>
                                        </button>
                                        <div className="w-px h-4 bg-slate-200"></div>
                                        <button
                                            type="button"
                                            onClick={() => {
                                                const newCollapsed = new Set();
                                                scopedMembers.forEach(m => {
                                                    const isRoot = rootMembers.some(r => r.id === m.id);
                                                    if (!isRoot) newCollapsed.add(m.id);
                                                });
                                                setCollapsedNodeIds(newCollapsed);
                                            }}
                                            className="px-2.5 py-1 rounded-lg text-slate-700 hover:bg-slate-100 font-bold transition-all flex items-center gap-1"
                                            title="พับชั้นลูกทีมเพื่อดูเฉพาะระดับหัวหน้า"
                                        >
                                            <span className="text-amber-600 font-black">⊟</span>
                                            <span>พับชั้นลึก (เหลือ Gen 1)</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Right Side: Zoom Controls */}
                                <div className="flex items-center gap-2">
