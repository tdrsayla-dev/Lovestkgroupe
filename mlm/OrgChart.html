  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;
    // ðŸ›¡ï¸ GLOBAL ICONS DESTRUCTURING: à¸›à¸¥à¸­à¸”à¸ à¸±à¸¢à¸ˆà¸²à¸à¸•à¸±à¸§à¹à¸›à¸£à¸‹à¹‰à¸³à¸‹à¹‰à¸­à¸™ à¹à¸¥à¸°à¸”à¸¶à¸‡à¹‚à¸¡à¸”à¸¹à¸¥à¹à¸¥à¸°à¸„à¸­à¸¡à¹‚à¸žà¹€à¸™à¸™à¸•à¹Œà¸¡à¸²à¸„à¸£à¸šà¸–à¹‰à¸§à¸™
    const { LayoutDashboard, ShoppingCart, Users, Contact, Headset, BarChart3, Plus, Edit, Trash2, UserCircle, Menu, X, Save, Info, PackageIcon, Package, Target, Trophy, Activity, Eye, Tags, CheckCircle, GitBranch, Archive, ChevronDown, FileText, SettingsIcon, Coins, ShieldCheck, AlertTriangle, AlertCircle, LoginModal, Toast, Sidebar, Header, ConfirmModal, EditModal, DonutChart, AutoSuggestInput, SearchIcon, getUserPagePermission, resolvePageUrl, fallbackCustomerTypes, fallbackProductsList } = window;
    


    // Helper for Downline Lookup
    let _lastMembersRef = null;
    let _cachedChildrenMap = new Map();
    const getChildren = (membersList, parentId) => {
        if (membersList !== _lastMembersRef) {
            _lastMembersRef = membersList;
            _cachedChildrenMap = new Map();
            (membersList || []).forEach(m => {
                const ref = String(m.referrer || '').trim().toUpperCase();
                const mid = String(m.id || '').trim().toUpperCase();
                if (ref && ref !== mid) {
                    if (!_cachedChildrenMap.has(ref)) _cachedChildrenMap.set(ref, []);
                    _cachedChildrenMap.get(ref).push(m);
                }
            });
        }
        return _cachedChildrenMap.get(String(parentId).trim().toUpperCase()) || [];
    };

    // ✅ Helper: Get all downline member IDs (including self) for a given rootId
    const getAllDownlineIds = (membersList, rootId) => {
        const result = new Set();
        const rootUp = String(rootId || '').trim().toUpperCase();
        if (!rootUp) return result;
        const queue = [rootUp];
        while (queue.length > 0) {
            const current = queue.shift();
            if (result.has(current)) continue;
            result.add(current);
            const children = getChildren(membersList, current);
            children.forEach(c => queue.push(String(c.id || '').trim().toUpperCase()));
        }
        return result;
    };

    // 🏷️ Categorize products into 4 clean category names & rates
    const getProductCategoryAndRate = (prodName, dbProductsList) => {
        const cleanName = String(prodName || '').trim().toUpperCase();

        if (Array.isArray(dbProductsList)) {
            const found = dbProductsList.find(p => 
                String(p.name || p.product_name || p.id || '').trim().toUpperCase() === cleanName ||
                String(p.category || '').trim().toUpperCase() === cleanName
            );
            if (found) {
                const cat = String(found.category || '').trim();
                const selfFee = Number(found.self_fee ?? found.selfFee ?? 250000);
                const l1Fee = Number(found.level_1_fee ?? found.level1Fee ?? 200000);
                const margin = Number(found.full_margin_amount ?? found.fullMarginAmount ?? 0);
                return { categoryKey: cat, categoryName: `หมวด ${cat}`, rate: selfFee, l1Rate: l1Fee, full_margin_amount: margin };
            }
        }

        // Clean Category Names (Without Rate Text Suffixed)
        if (cleanName.includes('COFFEE') || cleanName.includes('ARABICA')) {
            return { categoryKey: 'Coffee', categoryName: 'หมวด Coffee', rate: 20000, l1Rate: 10000, full_margin_amount: 0 };
        }
        if (cleanName.includes('SERUM') || cleanName.includes('SUNCREAM') || cleanName.includes('TONER') || cleanName.includes('CREAM') || cleanName.includes('APPLE') || cleanName.includes('ZINC')) {
            return { categoryKey: 'Cosmetic', categoryName: 'หมวด Cosmetic', rate: 70000, l1Rate: 30000, full_margin_amount: 0 };
        }
        if (cleanName.includes('GLUTA') || cleanName.includes('COLLAGEN') || cleanName.includes('BALANCE') || cleanName.includes('KUT-SO') || cleanName.includes('LIPO') || cleanName.includes('LUTEIN') || cleanName.includes('ORYZA')) {
            return { categoryKey: 'Supplement02', categoryName: 'หมวด Supplement 02', rate: 150000, l1Rate: 50000, full_margin_amount: 0 };
        }
        return { categoryKey: 'Supplement', categoryName: 'หมวด Supplement', rate: 250000, l1Rate: 200000, full_margin_amount: 0 };
    };

    // 🟢 Detailed Modal Component (Match User Requirements)
    const MemberPerformanceDetailModal = ({ isOpen, onClose, member, sales, members, products, customerTypes, systemSettings, teamMap, startDate, endDate }) => {
        if (!isOpen || !member) return null;

        // Payout Records Tracking
        const paidRecords = useMemo(() => {
            try {
                const saved = localStorage.getItem('stk_payout_history');
                return saved ? JSON.parse(saved) : {};
            } catch(e) { return {}; }
        }, []);
        const getDefaultMonthRange = () => {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const lastDay = new Date(y, now.getMonth() + 1, 0).getDate();
            return { start: `${y}-${m}-01`, end: `${y}-${m}-${String(lastDay).padStart(2, '0')}` };
        };
        const defRange = getDefaultMonthRange();
        const [modalStartDate, setModalStartDate] = useState(startDate || defRange.start);
        const [modalEndDate, setModalEndDate] = useState(endDate || defRange.end);
        const mId = useMemo(() => String(member.id || '').trim().toUpperCase(), [member]);

        const filteredSales = useMemo(() => {
            return (sales || []).filter(s => {
                const sellerId = String(s.sellerId || s.seller_id || s.seller || s.memberId || s.marketing || '').trim().toUpperCase();
                if (!sellerId) return false;
                const sDate = s.date || s.sale_date || '';
                if (modalStartDate && sDate < modalStartDate) return false;
                if (modalEndDate && sDate > modalEndDate) return false;
                return true;
            });
        }, [sales, modalStartDate, modalEndDate]);

        const personalSalesList = useMemo(() => {
            return filteredSales.filter(s => {
                const sellerId = String(s.sellerId || s.seller_id || s.seller || s.memberId || s.marketing || '').trim().toUpperCase();
                return sellerId === mId;
            });
        }, [filteredSales, mId]);

        const getDownlinesWithLevels = useCallback((parentId, depth = 1, visited = new Set()) => {
            if (visited.has(parentId)) return [];
            visited.add(parentId);
            let res = [];
            const children = getChildren(members, parentId);
            (children || []).forEach(c => {
                res.push({ member: c, level: depth });
                res = res.concat(getDownlinesWithLevels(c.id, depth + 1, visited));
            });
            return res;
        }, [members]);

        const downlinesWithLevels = useMemo(() => getDownlinesWithLevels(mId), [mId, getDownlinesWithLevels]);
        const downlineIdsSet = useMemo(() => new Set(downlinesWithLevels.map(d => String(d.member.id).trim().toUpperCase())), [downlinesWithLevels]);
        
        const downlineSalesList = useMemo(() => {
            return filteredSales.filter(s => {
                const sellerId = String(s.sellerId || s.seller_id || s.seller || s.memberId || s.marketing || '').trim().toUpperCase();
                return downlineIdsSet.has(sellerId);
            });
        }, [filteredSales, downlineIdsSet]);

        const isLeaderWithTeam = downlinesWithLevels.length > 0;

        const calculatedPeriodPV = useMemo(() => {
            let totalPV = 0;
            (personalSalesList || []).forEach(s => {
                let itemsList = [];
                if (s.items_json) {
                    try { itemsList = typeof s.items_json === 'string' ? JSON.parse(s.items_json) : s.items_json; } catch(e){}
                }
                if (Array.isArray(itemsList) && itemsList.length > 0) {
                    itemsList.forEach(it => {
                        const typeStr = String(it.type || '').trim();
                        if (typeStr === 'ราคาเต็ม' || typeStr === 'ราคาสมาชิก') {
                            totalPV += Number(it.qty || it.quantity || 1);
                        }
                    });
                } else {
                    const f = Number(s['รวมชิ้นราคาเต็ม'] || 0);
                    const m = Number(s['รวมชิ้นราคาสมาชิก'] || 0);
                    totalPV += (f + m);
                }
            });
            return totalPV;
        }, [personalSalesList]);

        const memberAccumulatedPV = calculatedPeriodPV;
        
        // Count downlines by level
        const downlinesByLevelCount = useMemo(() => {
            const counts = {};
            downlinesWithLevels.forEach(d => {
                counts[d.level] = (counts[d.level] || 0) + 1;
            });
            return counts;
        }, [downlinesWithLevels]);

        const levelSummaryText = useMemo(() => {
            const parts = Object.entries(downlinesByLevelCount).map(([lvl, cnt]) => `ชั้น ${lvl}: ${cnt} คน`);
            return parts.length > 0 ? parts.join(', ') : 'ไม่มีลูกทีม';
        }, [downlinesByLevelCount]);



        const parseSalesIntoCategories = useCallback((salesList, isDownline = false) => {
            const catMap = {
                'Supplement': { key: 'Supplement', name: 'หมวด Supplement', rate: 250000, l1Rate: 200000, fullQty: 0, memberQty: 0, promoQty: 0, zeroQty: 0, totalQty: 0, totalLAK: 0, marginLAK: 0 },
                'Supplement02': { key: 'Supplement02', name: 'หมวด Supplement 02', rate: 150000, l1Rate: 50000, fullQty: 0, memberQty: 0, promoQty: 0, zeroQty: 0, totalQty: 0, totalLAK: 0, marginLAK: 0 },
                'Cosmetic': { key: 'Cosmetic', name: 'หมวด Cosmetic', rate: 70000, l1Rate: 30000, fullQty: 0, memberQty: 0, promoQty: 0, zeroQty: 0, totalQty: 0, totalLAK: 0, marginLAK: 0 },
                'Coffee': { key: 'Coffee', name: 'หมวด Coffee', rate: 20000, l1Rate: 10000, fullQty: 0, memberQty: 0, promoQty: 0, zeroQty: 0, totalQty: 0, totalLAK: 0, marginLAK: 0 }
            };

            salesList.forEach(s => {
                let itemsList = [];
                if (s.items_json) {
                    try { itemsList = typeof s.items_json === 'string' ? JSON.parse(s.items_json) : s.items_json; } catch(e){}
                }

                if (Array.isArray(itemsList) && itemsList.length > 0) {
                    itemsList.forEach(it => {
                        const pName = String(it.prod || it.productName || it.name || '').trim();
                        const q = Number(it.qty || it.quantity || 1);
                        const typeStr = String(it.type || '').trim();

                        const catInfo = getProductCategoryAndRate(pName, products);
                        let targetKey = 'Supplement';
                        if (catInfo.categoryKey === 'Supplement02' || catInfo.categoryName.includes('02')) targetKey = 'Supplement02';
                        else if (catInfo.categoryKey === 'Cosmetic' || catInfo.categoryName.includes('Cosmetic')) targetKey = 'Cosmetic';
                        else if (catInfo.categoryKey === 'Coffee' || catInfo.categoryName.includes('Coffee')) targetKey = 'Coffee';

                        // 4 Price Types Categorization
                        if (typeStr === 'ราคาเต็ม') {
                            catMap[targetKey].fullQty += q;
                            if (!isDownline) {
                                catMap[targetKey].marginLAK += q * Number(catInfo.full_margin_amount || 0);
                            }
                        }
                        else if (typeStr === 'ราคาสมาชิก') catMap[targetKey].memberQty += q;
                        else if (typeStr === 'ราคาโปร' || typeStr === 'โปรโมชั่น') catMap[targetKey].promoQty += q;
                        else if (typeStr === 'ราคาศูนย์' || typeStr === 'ราคาฟรี') catMap[targetKey].zeroQty += q;
                        else catMap[targetKey].promoQty += q; // default promo

                        if (typeStr === 'ราคาเต็ม' || typeStr === 'ราคาสมาชิก') {
                            catMap[targetKey].totalQty += q;
                            const applicableRate = isDownline ? catInfo.l1Rate : catInfo.rate;
                            catMap[targetKey].totalLAK += q * applicableRate;
                        }
                    });
                } else {
                    const q = Number(s['ยอดรวมชิ้นทั้งหมด'] || 1);
                    const f = Number(s['รวมชิ้นราคาเต็ม'] || 0);
                    const m = Number(s['รวมชิ้นราคาสมาชิก'] || 0);
                    const p = Number(s['รวมชิ้นราคาโปร'] || 0);
                    const z = Number(s['รวมชิ้นราคาศูนย์'] || 0);

                    catMap['Supplement'].fullQty += f;
                    catMap['Supplement'].memberQty += m;
                    catMap['Supplement'].promoQty += p;
                    catMap['Supplement'].zeroQty += z;
                    
                    let validQty = f + m;
                    if (f === 0 && m === 0 && p === 0 && z === 0) {
                        catMap['Supplement'].fullQty += q;
                        validQty = q;
                    }

                    catMap['Supplement'].totalQty += validQty;
                    const applicableRate = isDownline ? 200000 : 250000;
                    catMap['Supplement'].totalLAK += validQty * applicableRate;
                    if (!isDownline) {
                        const finalFullQty = (f === 0 && m === 0 && p === 0 && z === 0) ? q : f;
                        catMap['Supplement'].marginLAK += finalFullQty * 200000;
                    }
                }
            });

            return catMap;
        }, [products]);

        // Personal & Downline Category Summaries
        const personalCategorized = useMemo(() => parseSalesIntoCategories(personalSalesList, false), [personalSalesList, parseSalesIntoCategories]);
        const downlineCategorized = useMemo(() => parseSalesIntoCategories(downlineSalesList, true), [downlineSalesList, parseSalesIntoCategories]);

        // Combined Total Team Category Summary
        const totalTeamCategorized = useMemo(() => {
            const keys = ['Supplement', 'Supplement02', 'Cosmetic', 'Coffee'];
            const res = {};
            keys.forEach(k => {
                const p = personalCategorized[k];
                const d = downlineCategorized[k];
                res[k] = {
                    key: k,
                    name: p.name,
                    rate: p.rate,
                    l1Rate: p.l1Rate,
                    personalQty: p.totalQty,
                    personalLAK: p.totalLAK,
                    downlineQty: d.totalQty,
                    downlineLAK: d.totalLAK,
                    fullQty: p.fullQty + d.fullQty,
                    memberQty: p.memberQty + d.memberQty,
                    promoQty: p.promoQty + d.promoQty,
                    zeroQty: p.zeroQty + d.zeroQty,
                    totalQty: p.totalQty + d.totalQty,
                    totalLAK: p.totalLAK + d.totalLAK
                };
            });
            return res;
        }, [personalCategorized, downlineCategorized]);

        // Total Box & Dividend Calculations
        const personalTotalBoxes = useMemo(() => Object.values(personalCategorized).reduce((acc, c) => acc + c.totalQty, 0), [personalCategorized]);
        const downlineTotalBoxes = useMemo(() => Object.values(downlineCategorized).reduce((acc, c) => acc + c.totalQty, 0), [downlineCategorized]);
        const groupTotalBoxes = personalTotalBoxes + downlineTotalBoxes;



        // 4 Price Types Totals across whole team
        const totalFullBoxes = useMemo(() => Object.values(totalTeamCategorized).reduce((acc, c) => acc + c.fullQty, 0), [totalTeamCategorized]);
        const totalMemberBoxes = useMemo(() => Object.values(totalTeamCategorized).reduce((acc, c) => acc + c.memberQty, 0), [totalTeamCategorized]);
        const totalPromoBoxes = useMemo(() => Object.values(totalTeamCategorized).reduce((acc, c) => acc + c.promoQty, 0), [totalTeamCategorized]);
        const totalZeroBoxes = useMemo(() => Object.values(totalTeamCategorized).reduce((acc, c) => acc + c.zeroQty, 0), [totalTeamCategorized]);

        const personalTotalLAK = useMemo(() => Object.values(personalCategorized).reduce((acc, c) => acc + c.totalLAK, 0), [personalCategorized]);
        const personalTotalMarginTHB = useMemo(() => Object.values(personalCategorized).reduce((acc, c) => acc + (c.marginLAK || 0), 0), [personalCategorized]);
        const downlineTotalLAK = useMemo(() => Object.values(downlineCategorized).reduce((acc, c) => acc + c.totalLAK, 0), [downlineCategorized]);
        const overallTeamTotalLAK = personalTotalLAK + downlineTotalLAK;

        const marginConfig = useMemo(() => {
            try {
                const confStr = systemSettings.retail_margin_config;
                return confStr ? (typeof confStr === 'string' ? JSON.parse(confStr) : confStr) : null;
            } catch(e) { return null; }
        }, [systemSettings.retail_margin_config]);

        const marginMinBoxes = Number(marginConfig?.min_boxes ?? systemSettings.margin_min_boxes ?? 10);
        const totalFullBoxesPersonal = useMemo(() => Object.values(personalCategorized).reduce((acc, c) => acc + c.fullQty, 0), [personalCategorized]);

        const isEligibleForMargin = useMemo(() => {
            if (totalFullBoxesPersonal < marginMinBoxes) return false;
            if (!marginConfig) return true;

            const scope = marginConfig.target_scope || 'all';
            const memberIdUpper = mId.toUpperCase();
            const memberTeamUpper = String(member.team || '').trim().toUpperCase();

            let isScopeEligible = true;
            if (scope === 'specific_members') {
                isScopeEligible = (marginConfig.selected_members || []).map(id => id.toUpperCase()).includes(memberIdUpper);
            } else if (scope === 'specific_teams') {
                isScopeEligible = (marginConfig.selected_teams || []).map(t => t.toUpperCase()).includes(memberTeamUpper);
            }

            // Exclusions
            if (isScopeEligible) {
                if ((marginConfig.exclude_members || []).map(id => id.toUpperCase()).includes(memberIdUpper)) {
                    isScopeEligible = false;
                }
                if ((marginConfig.exclude_teams || []).map(t => t.toUpperCase()).includes(memberTeamUpper)) {
                    isScopeEligible = false;
                }
            }

            return isScopeEligible;
        }, [totalFullBoxesPersonal, marginMinBoxes, marginConfig, mId, member]);

        // Product Summary List for entire downline team
        const productSummaryMap = useMemo(() => {
            const map = {};
            const allTeamSales = isLeaderWithTeam ? [...personalSalesList, ...downlineSalesList] : personalSalesList;
            allTeamSales.forEach(s => {
                let itemsList = [];
                if (s.items_json) {
                    try { itemsList = typeof s.items_json === 'string' ? JSON.parse(s.items_json) : s.items_json; } catch(e){}
                }
                if (Array.isArray(itemsList) && itemsList.length > 0) {
                    itemsList.forEach(it => {
                        const pName = String(it.prod || it.productName || it.name || 'สินค้าอื่นๆ').trim();
                        const q = Number(it.qty || it.quantity || 1);
                        const catInfo = getProductCategoryAndRate(pName, products);
                        if (!map[pName]) map[pName] = { name: pName, qty: 0, totalLAK: 0, category: catInfo.categoryName };
                        map[pName].qty += q;
                        map[pName].totalLAK += q * catInfo.rate;
                    });
                }
            });
            return Object.values(map).sort((a,b) => b.qty - a.qty);
        }, [personalSalesList, downlineSalesList, products, isLeaderWithTeam]);

        return (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-slate-900/60 backdrop-blur-sm animation-fade-in overflow-y-auto">
                <div className="bg-white rounded-3xl shadow-2xl border border-slate-100 w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden my-auto">
                    
                    {/* 🟣 Modal Header (Gradient Header) */}

                                                </div>
                                                <span className="text-sm font-black text-amber-300 bg-slate-900 px-2 py-1 rounded-lg border border-slate-700 font-mono">
                                                    {isLeaderWithTeam ? cat.totalQty : cat.personalQty}
                                                </span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* 🎯 Section 4: Origin of Sales */}
                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-3">
                            <h3 className="text-xs font-black text-slate-700 flex items-center gap-2">
                                <span>🎯 3. ที่มาของยอดแต่ละส่วน:</span>
                            </h3>

                            <div className="bg-white p-3.5 rounded-xl border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                <div className="flex items-center gap-2.5">
                                    <span className="w-8 h-8 rounded-full bg-blue-100 text-blue-700 font-bold flex items-center justify-center text-xs">👤</span>
                                    <div>
                                        <span className="text-xs font-bold text-slate-800 block">ยอดขายพนักงานเอง</span>
                                        <span className="text-[10px] text-slate-400 font-bold">{member.name} ({member.id})</span>
                                    </div>
                                </div>
                                <div className="flex items-center gap-3 font-mono">
                                    <span className="text-xs font-black text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg">{personalTotalBoxes} กล่อง</span>
                                    <span className="text-xs font-black text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg">{personalTotalLAK.toLocaleString()} LAK</span>
                                </div>
                            </div>

                            {isLeaderWithTeam && (
                                <div className="bg-white p-3.5 rounded-xl border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                    <div className="flex items-center gap-2.5">
                                        <span className="w-8 h-8 rounded-full bg-pink-100 text-pink-700 font-bold flex items-center justify-center text-xs">👑</span>
                                        <div>
                                            <span className="text-xs font-bold text-slate-800 block">ปันผลยอดขายจากทีมงาน ({downlinesWithLevels.length} คน)</span>
                                            <span className="text-[10px] text-slate-400 font-bold">{levelSummaryText}</span>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3 font-mono">
                                        <span className="text-xs font-black text-pink-600 bg-pink-50 px-2.5 py-1 rounded-lg">{downlineTotalBoxes} กล่อง</span>
                                        <span className="text-xs font-black text-pink-700 bg-pink-50 px-2.5 py-1 rounded-lg">{downlineTotalLAK.toLocaleString()} LAK</span>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* 📦 Section 5: Category & Product Summary Grid */}
                        <div className="space-y-4">
                            <div className="border-b border-slate-200 pb-2">
                                <h3 className="text-xs font-black text-slate-800 flex items-center gap-2">
                                    <span>📦 ยอดขายจำแนกตามหมวดสินค้า & รายการสินค้า</span>
                                </h3>
                                <p className="text-[10px] font-bold text-slate-400 mt-0.5">
                                    {isLeaderWithTeam ? 'สรุปยอดรวมจำนวนกล่องและยอดเงินขายได้แยกตามรายการสินค้าของทั้งทีม' : 'สรุปยอดรวมจำนวนกล่องและยอดเงินขายได้แยกตามรายการสินค้าของพนักงาน'}
                                </p>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                {productSummaryMap.length === 0 ? (
                                    <p className="text-xs font-bold text-slate-400 text-center py-6 col-span-2">ยังไม่มีประวัติการขายสินค้า</p>
                                ) : (
                                    productSummaryMap.map((p, idx) => (
                                        <div key={p.name || idx} className="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex justify-between items-center hover:bg-slate-100/80 transition-colors">
                                            <div>
                                                <h4 className="text-xs font-black text-slate-800 uppercase tracking-tight">{p.name}</h4>
                                                <span className="text-[9px] text-slate-400 font-bold">{p.category}</span>
                                            </div>
                                            <div className="text-right font-mono">
                                                <span className="text-xs font-black text-blue-600 block">{p.qty} กล่อง</span>
                                                <span className="text-[10px] font-bold text-slate-500 block">{p.totalLAK.toLocaleString()} LAK</span>
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>

                    </div>

                    {/* 🔴 Modal Footer */}
                    <div className="p-4 bg-slate-50 border-t border-slate-200 flex justify-end shrink-0">
                        <button 
                            onClick={onClose} 
                            className="px-6 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-xs transition-colors"
                        >
                            ปิดหน้าต่าง
                        </button>
                    </div>

                </div>
            </div>
        );
    };

    // 🟢 Flexible Employee Card Component (Match Screenshot Layout with Level Badges)
    const EmployeeCardNode = ({ node, allMembers, onSelect, onOpenDetail, memberSales, teamMap, level = 0, currentUser, isAdmin }) => {
        const children = getChildren(allMembers, node.id);
        const hasChildren = children.length > 0;
        const isLeader = hasChildren || node.role === 'หัวหน้าสายงาน' || node.role === 'Leader';

        // ✅ ตรวจว่า card นี้คือตัว currentUser เองหรือเปล่า
        const currentUserId = String(currentUser?.id || '').trim().toUpperCase();
        const nodeId = String(node.id || '').trim().toUpperCase();
        const isSelf = !!currentUserId && currentUserId === nodeId;
        // อนุญาตกดดูรายละเอียด: admin กดได้ทุกคน, non-admin กดได้เฉพาะตัวเอง
        const canOpenDetail = isAdmin || isSelf;

        return (
            <div className="flex flex-col items-center">
                {/* Level Badge if level > 0 */}
                {level > 0 && (
                    <div className="mb-2 z-10">
                        <span className="bg-emerald-100 text-emerald-700 text-[10px] font-black px-3 py-0.5 rounded-full border border-emerald-200 shadow-xs">
                            ชั้นที่ {level}
                        </span>
                    </div>
                )}

                {/* Main Card Box */}
                <div 
                    onClick={() => onSelect(node)}
                    className="p-4 w-full max-w-[260px] sm:w-64 rounded-3xl border border-slate-200 bg-white hover:border-blue-300 hover:shadow-xl transition-all duration-300 relative z-10 cursor-pointer flex flex-col items-center shadow-md"
                >
                    {/* Top Role Badge */}
                    <div className="mb-2">
                        <span className={`text-[10px] font-black px-3 py-0.5 rounded-full shadow-xs ${
                            isLeader 
                            ? 'bg-amber-100 text-amber-700 border border-amber-200' 
                            : 'bg-slate-100 text-slate-600 border border-slate-200'
                        }`}>
                            {isLeader ? '👑 หัวหน้าสายงาน' : '👤 พนักงาน'}
                        </span>
                    </div>

                    {/* Profile Picture Avatar */}
                    <div className="w-16 h-16 rounded-full p-0.5 bg-gradient-to-r from-slate-200 to-slate-300 shadow-md flex items-center justify-center shrink-0 mb-2">
                        {node.profileUrl ? (
                            <img src={node.profileUrl} className="w-full h-full rounded-full object-cover border-2 border-white" />
                        ) : (
                            <div className="w-full h-full rounded-full bg-slate-100 text-slate-500 flex items-center justify-center font-black text-sm">
                                {node.name ? node.name.substring(0, 2) : node.id}
                            </div>
                        )}
                    </div>

                    {/* Details */}
                    <div className="text-center w-full space-y-1">
                        <h4 className="text-xs font-black text-slate-800 truncate px-1">{node.name}</h4>
                        
                        <div className="flex items-center justify-center gap-1.5">
                            <span className="text-[9px] font-mono font-black text-slate-500">{node.id}</span>
                            <span className="text-[9px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">
                                {teamMap?.[String(node.team).trim().toUpperCase()] || node.team || 'Marketing'}
                            </span>
                        </div>

                        {/* Downlines Count Pill */}
                        {hasChildren && (
                            <div className="pt-1">
                                <span className="bg-sky-50 text-sky-700 text-[9px] font-bold px-3 py-1 rounded-full border border-sky-100 block truncate">
                                    มีลูกทีมดูแล {children.length} คน
                                </span>
                            </div>
                        )}

                        {/* Action Button — ล็อคถ้าไม่ใช่ตัวเองและไม่ใช่ Admin */}
                        <div className="pt-2">
                            {canOpenDetail ? (
                                <button 
                                    type="button"
                                    onClick={(e) => { e.stopPropagation(); onSelect(node); if(onOpenDetail) onOpenDetail(node); }}
                                    className="w-full py-1.5 bg-blue-50 hover:bg-blue-600 hover:text-white text-blue-600 text-[10px] font-black rounded-xl transition-all border border-blue-200/60 shadow-xs flex items-center justify-center gap-1"
                                >
                                    📊 คลิกดูผลงานและสายงาน
                                </button>
                            ) : (
                                <div className="w-full py-1.5 bg-slate-50 text-slate-400 text-[10px] font-bold rounded-xl border border-slate-200 flex items-center justify-center gap-1 cursor-not-allowed">
                                    🔒 ไม่มีสิทธิ์ดูรายละเอียด
                                </div>
                            )}
                        </div>
                    </div>
                </div>

                {/* Recursive Children Level Breakdown with Hierarchy Lines */}
                {hasChildren && (
                    <div className="flex flex-col items-center w-full mt-1 relative">
                        {/* Vertical line from parent card down */}
                        <div className="w-0.5 h-6 bg-blue-300"></div>

                        {/* Children Container */}
                        <div className="relative flex flex-wrap justify-center items-start gap-6 sm:gap-8 pt-3 border-t-2 border-blue-200 rounded-t-xl px-4">
                            {children.map((child, cIdx) => (
                                <div key={child.id} className="relative flex flex-col items-center">
                                    {/* Vertical line connecting top horizontal bar to child card */}
                                    <div className="w-0.5 h-3 bg-blue-300 -mt-3 mb-1"></div>
                                    <EmployeeCardNode 
                                        node={child} 
                                        allMembers={allMembers}
                                        memberSales={memberSales}
                                        onSelect={onSelect}
                                        onOpenDetail={onOpenDetail}
                                        teamMap={teamMap}
                                        level={level + 1}
                                        currentUser={currentUser}
                                        isAdmin={isAdmin}
                                    />
                                </div>
                            ))}
                        </div>
                    </div>
                )}
            </div>
        );
    };

    // 🟢 Main View Component with Responsive Flexible Grid Layout
    const SalesTeamHierarchyView = ({ members, sales, businessTeams, products, customerTypes, systemSettings, currentUser, isAdmin, loading }) => {
        const [searchQuery, setSearchQuery] = useState('');
        const [viewMode, setViewMode] = useState('tree');
        const [selectedMember, setSelectedMember] = useState(null);
        const [detailModalOpen, setDetailModalOpen] = useState(false);

        // Filter Bar States
        const [bonusCondition, setBonusCondition] = useState('แผนที่ 1 (% จากยอดรวม)');
        const [selectedCategory, setSelectedCategory] = useState('📦 สินค้าทั้งหมด');
        const getDefaultMonthRange = () => {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const lastDay = new Date(y, now.getMonth() + 1, 0).getDate();
            return { start: `${y}-${m}-01`, end: `${y}-${m}-${String(lastDay).padStart(2, '0')}` };
        };
        const defMonthRange = getDefaultMonthRange();
        const [startDate, setStartDate] = useState(defMonthRange.start);
        const [endDate, setEndDate] = useState(defMonthRange.end);

        const teamMap = useMemo(() => {
            const map = {};
            (businessTeams || []).forEach(t => {
                const idKey = String(t.id || '').trim().toUpperCase();
                const nameStr = t.name || t.team_name || t.Team_Name || idKey;
                if (idKey) map[idKey] = nameStr;
            });
            return map;
        }, [businessTeams]);

        const memberSalesMap = useMemo(() => {
            const salesMap = {};
            (members || []).forEach(m => {
                salesMap[m.id] = { personal: 0, group: 0 };
            });

            (sales || []).forEach(s => {
                const sellerId = String(s.sellerId || s.seller_id || s.seller || s.memberId || '').trim().toUpperCase();
                const qty = Number(s['ยอดรวมชิ้นทั้งหมด'] || s.qty || s.quantity || 1);
                if (salesMap[sellerId]) {
                    salesMap[sellerId].personal += qty;
                }
            });

            const calculateGroup = (parentId) => {
                let total = salesMap[parentId]?.personal || 0;
                const children = getChildren(members, parentId);
                children.forEach(c => {
                    total += calculateGroup(c.id);
                });
                if (salesMap[parentId]) {
                    salesMap[parentId].group = total;
                }
                return total;
            };

            const rootNodes = (members || []).filter(m => !m.referrer || m.referrer === m.id || !(members || []).some(p => p.id === m.referrer));
            rootNodes.forEach(r => calculateGroup(r.id));

            return salesMap;
        }, [members, sales]);

        // ✅ สิทธิ์สายงาน: ถ้าไม่ใช่ Admin ให้กรองเฉพาะตัวเองและ downline
        const currentUserId = String(currentUser?.id || '').trim().toUpperCase();
        const isScopeOwn = !isAdmin && !!currentUserId;

        const scopedMembers = useMemo(() => {
            if (!isScopeOwn) return members || [];
            const allowedIds = getAllDownlineIds(members || [], currentUserId);
            return (members || []).filter(m => allowedIds.has(String(m.id || '').trim().toUpperCase()));
        }, [members, isScopeOwn, currentUserId]);

        const rootMembers = useMemo(() => {
            return (scopedMembers).filter(m => {
                const ref = String(m.referrer || '').trim().toUpperCase();
                const mid = String(m.id || '').trim().toUpperCase();
                // ถ้า scoped: root คือตัว currentUser เอง หรือคนที่ referrer ไม่มีใน scopedMembers
                return !ref || ref === mid || !(scopedMembers).some(p => String(p.id).trim().toUpperCase() === ref);
            });
        }, [scopedMembers]);

        // Filter root members by search query
        const filteredRootMembers = useMemo(() => {
            if (!searchQuery) return rootMembers;
            return scopedMembers.filter(m => 
                m.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                m.id.toLowerCase().includes(searchQuery.toLowerCase())
            );
        }, [rootMembers, scopedMembers, searchQuery]);

        return (
            <div className="space-y-6 animation-fade-in pb-10 w-full">
                
                {/* 📌 Header Title Bar */}
                <div className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-100 w-full">
                    <div>
                        <h1 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-3">
                            <span className="text-2xl">🔀</span>
                            <span>โครงสร้างทีมขาย (Sales Team Hierarchy)</span>
                        </h1>
                        <p className="text-xs text-slate-500 font-bold mt-1">
                            แสดงสายงานความสัมพันธ์พนักงาน • รายงานยอดขาย และระบบคำนวณ % ค่าตอบแทนตามสายงาน
                        </p>
                    </div>

                    {/* Top Right Toggle Buttons */}
                    <div className="flex items-center gap-2 bg-slate-100 p-1.5 rounded-2xl border border-slate-200 w-full sm:w-auto">
                        <button 
                            onClick={() => setViewMode('tree')}
                            className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${viewMode === 'tree' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-600 hover:text-slate-900'}`}
                        >
                            <span>🌲</span>
                            <span>สายงาน (ชั้น 1, 2)</span>
                        </button>
                        <button 
                            onClick={() => setViewMode('team')}
                            className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 ${viewMode === 'team' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:text-slate-900'}`}
                        >
                            <span>📊</span>
                            <span>แยกทีม (Marketing / Center)</span>
                        </button>
                    </div>
                </div>

                {/* 🔍 Filter Bar */}
                <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 flex flex-wrap items-center gap-3 w-full">
                    <div className="relative flex-1 min-w-[220px]">
                        <input 
                            type="text" 
                            placeholder="🔍 ค้นหารหัส หรือชื่อพนักงาน..." 
                            value={searchQuery}
                            onChange={e => setSearchQuery(e.target.value)}
                            className="w-full bg-slate-50 border border-slate-200 text-xs font-bold rounded-xl px-3.5 py-2.5 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all"
                        />
                    </div>

                    <div className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-700">
                        <span className="text-slate-400">⚙️ เงื่อนไขโบนัส:</span>
                        <select 
                            value={bonusCondition} 
                            onChange={e => setBonusCondition(e.target.value)}
                            className="bg-transparent text-blue-600 font-bold outline-none cursor-pointer"
                        >
                            <option value="แผนที่ 1 (% จากยอดรวม)">แผนที่ 1 (% จากยอดรวม)</option>
                            <option value="แผนที่ 2 (แบ่งตามชั้นลูกทีม)">แผนที่ 2 (แบ่งตามชั้นลูกทีม)</option>
                        </select>
                    </div>

                    <div className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-700">
                        <span className="text-slate-400">หมวดสินค้า:</span>
                        <select 
                            value={selectedCategory} 
                            onChange={e => setSelectedCategory(e.target.value)}
                            className="bg-transparent text-amber-600 font-bold outline-none cursor-pointer"
                        >
                            <option value="📦 สินค้าทั้งหมด">📦 สินค้าทั้งหมด</option>
                            <option value="หมวดทั่วไป">หมวดทั่วไป</option>
                        </select>
                    </div>

                    <div className="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 text-xs font-bold text-slate-700">
                        <span className="text-slate-400">📅 ปฏิทิน:</span>
                        <input 
                            type="date" 
                            value={startDate} 
                            onChange={e => setStartDate(e.target.value)} 
                            className="bg-transparent text-blue-600 outline-none font-bold cursor-pointer"
                        />
                        <span className="text-slate-400">-</span>
                        <input 
                            type="date" 
                            value={endDate} 
                            onChange={e => setEndDate(e.target.value)} 
                            className="bg-transparent text-blue-600 outline-none font-bold cursor-pointer"
                        />
                    </div>

                    <button 
                        onClick={() => { const r = getDefaultMonthRange(); setSearchQuery(''); setStartDate(r.start); setEndDate(r.end); }}
                        className="px-4 py-2 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded-xl text-xs font-bold transition-all shadow-xs flex items-center gap-1"
                    >
                        <span>🔄 รีเฟรช</span>
                    </button>
                </div>


                {/* 🌳 Responsive Tree / Team Layout Container */}
                <div className="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 sm:p-8 w-full overflow-x-auto flex flex-col items-center min-h-[500px]">
                    {loading ? (
                        <div className="flex flex-col items-center justify-center py-32 gap-3 animation-fade-in w-full h-full">
                            <div className="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                            <span className="text-sm font-bold text-slate-500">กำลังโหลดโครงสร้างสายงานในระบบ...</span>
                        </div>
                    ) : (
                        <React.Fragment>
                    {/* Top Root Header Card: STK Sales Management — แสดงเฉพาะ Admin */}
                    {isAdmin && viewMode === 'tree' && (
                        <>
                            <div className="bg-gradient-to-r from-blue-700 via-indigo-700 to-purple-800 text-white rounded-3xl p-5 w-full max-w-xs sm:w-72 text-center shadow-xl border-2 border-white/20 relative z-10 flex flex-col items-center mb-2">
                                <div className="w-14 h-14 rounded-full bg-white text-blue-700 flex items-center justify-center font-black text-xl mb-2 shadow-md">
                                    🏢
                                </div>
                                <h2 className="text-lg font-black tracking-tight">STK Sales Management</h2>
                                <p className="text-[11px] text-blue-200 font-bold mt-0.5">โครงสร้างสายงานในระบบ</p>
                            </div>
                            <div className="w-0.5 h-6 bg-blue-300 mb-4"></div>
                        </>
                    )}

                    {viewMode === 'tree' ? (
                        /* 🌲 Tree View: Flexible Connected Hierarchy */
                        <div className="flex flex-wrap justify-center items-start gap-8 sm:gap-12 w-full pt-2">
                            {filteredRootMembers.map(r => (
                                <EmployeeCardNode 
                                    key={r.id} 
                                    node={r} 
                                    allMembers={scopedMembers} 
                                    memberSales={memberSalesMap}
                                    onSelect={m => setSelectedMember(m)}
                                    onOpenDetail={m => { setSelectedMember(m); setDetailModalOpen(true); }}
                                    teamMap={teamMap}
                                    level={0}
                                    currentUser={currentUser}
                                    isAdmin={isAdmin}
                                />
                            ))}
                        </div>
                    ) : (
                        /* 📊 Team View: Grouped by Business Team (Marketing / Center / etc.) */
                        <div className="w-full space-y-8">
                            {(() => {
                                const groupedByTeam = {};
                                (scopedMembers || []).forEach(m => {
                                    const tCode = String(m.team || 'Marketing').trim().toUpperCase();
                                    const tName = teamMap[tCode] || m.team || 'ทีมการตลาด (Marketing)';
                                    if (!groupedByTeam[tName]) groupedByTeam[tName] = [];
                                    groupedByTeam[tName].push(m);
                                });

                                return Object.entries(groupedByTeam).map(([teamName, teamMembers], tIdx) => {
                                    const filteredTeamMembers = searchQuery 
                                        ? teamMembers.filter(m => m.name.toLowerCase().includes(searchQuery.toLowerCase()) || m.id.toLowerCase().includes(searchQuery.toLowerCase()))
                                        : teamMembers;

                                    if (filteredTeamMembers.length === 0) return null;

                                    return (
                                        <div key={tIdx} className="bg-slate-50/70 p-5 rounded-3xl border border-slate-200/80 space-y-4">
                                            <div className="flex items-center gap-3 border-b border-slate-200 pb-3">
                                                <span className="w-3 h-3 rounded-full bg-blue-600"></span>
                                                <h3 className="text-base font-black text-slate-800">{teamName}</h3>
                                                <span className="bg-blue-100 text-blue-700 text-xs font-black px-2.5 py-0.5 rounded-full">
                                                    {filteredTeamMembers.length} คน
                                                </span>
                                            </div>

                                            <div className="flex flex-wrap gap-4">
                                                {filteredTeamMembers.map(m => (
                                                    <div key={m.id} className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs hover:shadow-md transition-all w-64 flex items-center gap-3">
                                                        <div className="w-12 h-12 rounded-full bg-blue-50 text-blue-700 border border-blue-200 flex items-center justify-center font-black text-sm shrink-0 overflow-hidden">
                                                            {m.profileUrl ? <img src={m.profileUrl} className="w-full h-full object-cover rounded-full" /> : (m.name ? m.name.substring(0, 2) : m.id)}
                                                        </div>
                                                        <div className="flex-1 min-w-0">
                                                            <h4 className="text-xs font-black text-slate-800 truncate">{m.name}</h4>
                                                            <p className="text-[10px] font-mono text-slate-400 font-bold">{m.id}</p>
                                                            <button 
                                                                onClick={() => { setSelectedMember(m); setDetailModalOpen(true); }}
                                                                className="mt-2 text-[10px] font-black text-blue-600 hover:text-blue-800 underline block"
                                                            >
                                                                📊 ดูผลงานสายงาน
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                });
                            })()}
                        </div>
                    )}
                    </React.Fragment>
                    )}
                </div>

                {/* 🟢 Detail Modal Popup */}
                <MemberPerformanceDetailModal 
                    isOpen={detailModalOpen}
                    onClose={() => setDetailModalOpen(false)}
                    member={selectedMember}
                    sales={sales}
                    members={scopedMembers}
                    products={products}
                    customerTypes={customerTypes}
                    systemSettings={systemSettings}
                    teamMap={teamMap}
                    startDate={startDate}
                    endDate={endDate}
                />
            </div>
        );
    };

    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      
      const initialCache = (() => {
        try { const data = localStorage.getItem('stk_app_cache_data'); return data ? JSON.parse(data) : null; }
        catch(e) { return null; }
      })();

      const [products, setProducts] = useState(() => initialCache && Array.isArray(initialCache.products) ? initialCache.products : []);
      const [customerTypes, setCustomerTypes] = useState(() => initialCache && Array.isArray(initialCache.customerTypes) ? initialCache.customerTypes : fallbackCustomerTypes);
      const [members, setMembers] = useState(() => initialCache && Array.isArray(initialCache.members) ? initialCache.members.map(m => ({ ...m, id: m.id || m.user_id || m.member_id, name: m.name })) : []);
      const [customers, setCustomers] = useState(() => initialCache && Array.isArray(initialCache.customers) ? initialCache.customers : []);
      const [sales, setSales] = useState(() => initialCache && Array.isArray(initialCache.sales) ? initialCache.sales : []);
      const [businessTeams, setBusinessTeams] = useState(() => initialCache && Array.isArray(initialCache.businessTeams) ? initialCache.businessTeams.map(t => ({ ...t, id: t.id || t.team_id, name: t.name || t.team_name })) : []);
      const [systemUsers, setSystemUsers] = useState([]);
      const [systemSettings, setSystemSettings] = useState(() => initialCache && initialCache.systemSettings ? initialCache.systemSettings : {});
      const [isAppLoading, setIsAppLoading] = useState(() => !initialCache);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch(e) { return false; }
      });
      
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

      const isAdmin = currentUser && (
          String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || 
          String(currentUser.role).trim().toLowerCase() === 'admin'
      );
      const currentUserProfileUrl = currentUser?.profileUrl || '';

      useEffect(() => {
        const savedUserStr = localStorage.getItem('stk_current_user');
        if (savedUserStr) {
          try {
            const user = JSON.parse(savedUserStr);
            setCurrentUser(user);
            setIsLoggedIn(true);
          } catch(e) { localStorage.removeItem('stk_current_user'); }
        }

        const initialLoader = document.getElementById('initial-loader');
        if (initialLoader) initialLoader.style.display = 'none';

        Promise.all([
          supabaseSelect('stk_products').catch(() => supabaseSelect('products')),
          supabaseSelect('stk_customer_types').catch(() => supabaseSelect('customer_types')),
          supabaseSelect('stk_members').catch(() => supabaseSelect('members')),
          supabaseSelect('stk_customers', 'order=customer_id.desc&limit=2000').catch(() => supabaseSelect('customers')),
          supabaseSelect('stk_sales', 'order=order_id.desc&limit=1500').catch(() => supabaseSelect('sales')),
          supabaseSelect('stk_business_teams').catch(() => supabaseSelect('business_teams')),
          supabaseSelect('stk_system_settings').catch(() => supabaseSelect('system_settings'))
        ]).then(([pRes, typeRes, memRes, custRes, saleRes, teamRes, setRes]) => {
          const resObj = {
            products: pRes,
            customerTypes: typeRes,
            members: memRes,
            customers: custRes,
            sales: saleRes,
            businessTeams: teamRes,
            systemSettings: setRes
          };
          applyDataToStates(resObj);
          try {
              localStorage.setItem('stk_app_cache_data', JSON.stringify(resObj));
              localStorage.setItem('stk_app_cache_time', String(Date.now()));
          } catch(e){}
        }).catch(err => {
          console.error("Supabase load error:", err);
        }).finally(() => {
          setIsAppLoading(false);
        });
      }, []);

      const applyDataToStates = (response) => {
           let localSettings = {};
           if (Array.isArray(response.systemSettings) && response.systemSettings.length > 0) {
               response.systemSettings.forEach(s => {
                   if (s.key || s.setting_key) localSettings[s.key || s.setting_key] = s.value || s.setting_value;
               });
           }
           const localMarginsStr = localSettings.product_margins;
           const localMargins = localMarginsStr ? (typeof localMarginsStr === 'string' ? JSON.parse(localMarginsStr) : localMarginsStr) : {};

           if (Array.isArray(response.products)) {
               setProducts(response.products.map(p => {
                   const pId = String(p.product_id || p.id || '').trim();
                   const margin = localMargins[pId] || { amount: 0, currency: 'LAK' };
                   return {
                       ...p,
                       id: pId,
                       name: String(p.name || '').trim(),
                       category: String(p.category || '').trim(),
                       self_fee: Number(p.self_fee ?? p.selfFee ?? 0),
                       level_1_fee: Number(p.level_1_fee ?? p.level1Fee ?? 0),
                       price_full: Number(p.price_full ?? p.priceFull ?? 0),
                       price_member: Number(p.price_member ?? p.priceMember ?? 0),
                       full_margin_amount: Number(margin.amount ?? 0),
                       full_margin_currency: margin.currency || 'LAK'
                   };
               }));
           }
           if (Array.isArray(response.customerTypes)) setCustomerTypes(response.customerTypes);
           if (Array.isArray(response.systemSettings) && response.systemSettings.length > 0) {
               const settingsObj = {};
               response.systemSettings.forEach(s => {
                   if (s.key || s.setting_key) settingsObj[s.key || s.setting_key] = s.value || s.setting_value;
               });
               setSystemSettings(settingsObj);
           }
           if (Array.isArray(response.members)) {
               const formattedMembers = response.members.map(m => ({
                   id: String(m.id || m.user_id || m.User_ID || '').trim(),
                   name: String(m.name || m.Name || '').trim(),
                   referrer: String(m.referrer || m.sponsor_id || m.Sponsor_ID || '').trim(),
                   team: String(m.team || m.business_team || m.Business_Team || 'Marketing').trim(),
                   role: String(m.role || m.permission_role || m.Permission_Role || 'Staff').trim(),
                   status: String(m.status || m.Status || 'ทำงานอยู่').trim(),
                   profileUrl: m.profile_url || m.id_card_url || m.ID_Card_URL || '',
                   phone: m.phone || m.phone_number || m.Phone_Number || '',
                   email: m.email || m.Email || '',
                   lineId: m.line_id || m.LINE_ID || '',
                   accumulatedPV: Number(m.accumulated_pv || m.Accumulated_PV || 0)
               })).filter(m => m.id !== '');
               setMembers(formattedMembers);
           }
           if (Array.isArray(response.customers)) setCustomers(response.customers);
           if (Array.isArray(response.businessTeams)) setBusinessTeams(response.businessTeams.map(t => ({...t, id: String(t.id || t.team_id || t.Team_ID || "").trim(), name: String(t.name || t.team_name || t.Team_Name || t.TeamName || "").trim(), status: String(t.status || t.Status || "ใช้งาน").trim()})));
           
           if (Array.isArray(response.sales)) {
               const processedSales = response.sales.map(s => {
                   let sumF = 0, sumP = 0, sumZ = 0, sumM = 0;
                   let itemsList = [];
                   if (s.items_json) {
                       try { itemsList = typeof s.items_json === 'string' ? JSON.parse(s.items_json) : s.items_json; } catch(e){}
                   }
                   
                   if (Array.isArray(itemsList) && itemsList.length > 0) {
                       itemsList.forEach(it => {
                           const typeStr = String(it.type || '').trim();
                           const qtyNum = Number(it.qty || it.quantity || 1);
                           const pName = String(it.prod || it.productName || it.name || 'Unknown').trim();
                           s[`${pName}_${typeStr}`] = qtyNum;
                           
                           if (typeStr === 'ราคาเต็ม') sumF += qtyNum;
                           else if (typeStr === 'ราคาสมาชิก') sumM += qtyNum;
                           else if (typeStr === 'ราคาโปร' || typeStr === 'โปรโมชั่น') sumP += qtyNum;
                           else if (typeStr === 'ราคาศูนย์' || typeStr === 'ราคาฟรี') sumZ += qtyNum;
                           else sumM += qtyNum;
                       });
                   } else {
                       Object.keys(s).forEach(k => {
                           if (k !== 'รวมชิ้นราคาเต็ม' && k !== 'รวมชิ้นราคาโปร' && k !== 'รวมชิ้นราคาศูนย์' && k !== 'ยอดรวมชิ้นทั้งหมด') {
                               if (k.endsWith('_ราคาเต็ม')) sumF += (parseInt(s[k]) || 0);
                               else if (k.endsWith('_ราคาโปร')) sumP += (parseInt(s[k]) || 0);
                               else if (k.endsWith('_ราคาศูนย์')) sumZ += (parseInt(s[k]) || 0);
                               else if (k.endsWith('_ราคาสมาชิก')) sumM += (parseInt(s[k]) || 0);
                           }
                       });
                   }
                   s['รวมชิ้นราคาเต็ม'] = sumF; s['รวมชิ้นราคาโปร'] = sumP; s['รวมชิ้นราคาศูนย์'] = sumZ; s['รวมชิ้นราคาสมาชิก'] = sumM;
                   s['ยอดรวมชิ้นทั้งหมด'] = sumF + sumM + sumP + sumZ;
                   
                   const cleanSeller = String(s.seller_id || s.sellerId || s.seller || s.memberId || s.marketing_name || s.marketing || '').trim().toUpperCase();
                   s['memberId'] = cleanSeller;
                   s['sellerId'] = cleanSeller;
                   
                   return {
                       ...s,
                       id: s.id || s.sale_id,
                       date: s.date || s.sale_date,
                       marketing: cleanSeller,
                       seller: cleanSeller,
                       customerName: s.customer_name || s.customerName
                   };
               });
               setSales(processedSales);
           }
      };

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col lg:flex-row font-sans antialiased text-slate-800 w-full">
          <Toast toast={toast} setToast={setToast} />
          
          <Sidebar 
            activePage="org_chart" 
            isSidebarCollapsed={isSidebarCollapsed} 
            setIsSidebarCollapsed={setIsSidebarCollapsed} 
            isAdmin={isAdmin}
            currentUserProfileUrl={currentUserProfileUrl}
            currentUser={currentUser}
            isLoggedIn={isLoggedIn}
            onLogout={() => { 
              localStorage.removeItem('stk_current_user'); 
              setIsLoggedIn(false); 
              setCurrentUser(null); 
              const targetUrl = typeof resolvePageUrl === 'function' ? resolvePageUrl('?page=dashboard') : 'Mlm.html';
              if (typeof window !== 'undefined') window.location.href = targetUrl;
            }}
            showLoginModal={showLoginModal}
            setShowLoginModal={setShowLoginModal}
            setIsAppLoading={setIsAppLoading}
          />

          <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>

            <div className="p-3 sm:p-6 lg:p-8 flex-1 w-full">
              <div className="w-full">
                  <SalesTeamHierarchyView 
                    members={members}
                    sales={sales}
                    businessTeams={businessTeams}
                    products={products}
                    customerTypes={customerTypes}
                    systemSettings={systemSettings}
                    currentUser={currentUser}
                    isAdmin={isAdmin}
                    loading={isAppLoading}
                  />
              </div>
            </div>

          </main>

          <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={(u) => { setCurrentUser(u); setIsLoggedIn(true); setShowLoginModal(false); }} systemUsers={systemUsers} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
