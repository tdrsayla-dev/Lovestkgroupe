function useDebounce(value, delay) {
    const [debouncedValue, setDebouncedValue] = useState(value);
    useEffect(() => {
        const handler = setTimeout(() => { setDebouncedValue(value); }, delay);
        return () => { clearTimeout(handler); };
    }, [value, delay]);
    return debouncedValue;
}

const exportToCSV = (filename, rows) => {
    const processRow = function (row) {
        let finalVal = '';
        for (let j = 0; j < row.length; j++) {
            let innerValue = row[j] === null || row[j] === undefined ? '' : row[j].toString();
            let result = innerValue.replace(/"/g, '""');
            if (result.search(/("|,|\n)/g) >= 0) result = '"' + result + '"';
            if (j > 0) finalVal += ',';
            finalVal += result;
        }
        return finalVal + '\n';
    };
    let csvFile = '\uFEFF'; // รองรับภาษาไทยใน Excel
    for (let i = 0; i < rows.length; i++) { csvFile += processRow(rows[i]); }
    const blob = new Blob([csvFile], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    const url = URL.createObjectURL(blob);
    link.setAttribute("href", url);
    link.setAttribute("download", filename);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
};

const AutoSuggestInput = ({ value, onChange, onSelect, data, placeholder, required, disabled }) => {
  const [showList, setShowList] = useState(false);
  const [focused, setFocused] = useState(false);
  const wrapperRef = useRef(null);
  useEffect(() => {
    const handleClickOutside = (e) => { if (wrapperRef.current && !wrapperRef.current.contains(e.target)) setShowList(false); };
    document.addEventListener("mousedown", handleClickOutside);
    return () => document.removeEventListener("mousedown", handleClickOutside);
  }, []);

  const safeValue = String(value || ''); 
  const filteredData = (data || []).filter(item => {
      if (!item) return false;
      const itemLabel = typeof item === 'string' ? item : (item.label || '');
      const itemSearch = typeof item === 'string' ? item : (item.searchText || item.label || '');
      
      const searchTarget = String(itemSearch).toLowerCase().replace(/[\s-]/g, '');
      const searchKeyword = safeValue.toLowerCase().replace(/[\s-]/g, '');
      
      return searchTarget.includes(searchKeyword) || String(itemLabel).toLowerCase().includes(safeValue.toLowerCase());
  });

  return (
    <div className="relative w-full" ref={wrapperRef}>
      <input type="text" required={required} disabled={disabled} placeholder={placeholder} value={safeValue} 
         onChange={(e) => { onChange(e.target.value); if(e.target.value.length > 0) setShowList(true); else setShowList(false); }}
         onFocus={() => { setFocused(true); if(safeValue.length > 0) setShowList(true); }}
         className={inputClassHud}
      />
      {showList && filteredData.length > 0 && (
        <ul className="absolute z-50 w-full bg-white border border-slate-200 mt-1 rounded-2xl shadow-xl max-h-56 overflow-y-auto overflow-x-hidden">
          {filteredData.map((item, i) => {
             const label = typeof item === 'string' ? item : item.label;
             const val = typeof item === 'string' ? item : item.value;
             return (
               <li key={i} className="px-4 py-2.5 hover:bg-blue-50 hover:text-blue-700 cursor-pointer text-[13px] font-medium text-slate-700 border-b border-slate-50 last:border-0 transition-colors truncate"
                   onClick={() => { onSelect(val); setShowList(false); }}>{label}</li>
             )
          })}
        </ul>
      )}
    </div>
  );
};

const DonutChart = ({ value, target, colorClass, strokeColor, glowColor = "rgba(255,255,255,0)", size = "xl" }) => {
    const percent = Math.min((value / target) * 100, 100) || 0;
    const remaining = Math.max(target - value, 0); 
    const dashArray = `${percent} ${100 - percent}`;
    
    const dimensions = size === "xl" ? "w-64 h-64 sm:w-80 sm:h-80 md:w-96 md:h-96" : size === "md" ? "w-32 h-32 sm:w-44 sm:h-44 lg:w-48 lg:h-48" : "w-40 h-40 sm:w-56 sm:h-56";
    const numSize = size === "xl" ? "text-5xl sm:text-6xl md:text-7xl" : size === "md" ? "text-2xl sm:text-3xl" : "text-3xl sm:text-4xl";
    const labelSize = size === "xl" ? "text-base sm:text-lg lg:text-xl" : size === "md" ? "text-[10px] sm:text-[11px]" : "text-[12px] sm:text-sm";
    const strokeW = size === "xl" ? "2.5" : "3"; 

    return (
        <div className={`relative flex-shrink-0 mx-auto ${dimensions}`}>
           <svg viewBox="0 0 36 36" className="w-full h-full transform -rotate-90 relative z-10" style={{ filter: `drop-shadow(0px 0px 12px ${glowColor})` }}>
              <circle cx="18" cy="18" r="15.915" fill="transparent" stroke="rgba(255,255,255,0.05)" strokeWidth={strokeW} />
              <circle cx="18" cy="18" r="15.915" fill="transparent" stroke="rgba(255,255,255,0.1)" strokeWidth={strokeW} strokeDasharray="100 0" />
              <circle cx="18" cy="18" r="15.915" fill="transparent" stroke={strokeColor} strokeWidth={strokeW} strokeDasharray={dashArray} className="transition-all duration-1000 ease-out" strokeLinecap="round" />
              
              <g className="animate-orbit-cw">
                  <circle cx="18" cy="18" r="17.2" fill="transparent" stroke={strokeColor} strokeWidth="0.6" strokeDasharray="15 91.8" strokeLinecap="round" opacity="0.6" style={{ filter: `drop-shadow(0 0 4px ${strokeColor})` }} />
                  <circle cx="18" cy="18" r="17.2" fill="transparent" stroke="#ffffff" strokeWidth="0.2" strokeDasharray="15 91.8" strokeLinecap="round" opacity="0.9" />
              </g>

              <g className="animate-orbit-ccw">
                  <circle cx="18" cy="18" r="17.2" fill="transparent" stroke={strokeColor} strokeWidth="0.4" strokeDasharray="8 98.8" strokeLinecap="round" opacity="0.5" style={{ filter: `drop-shadow(0 0 3px ${strokeColor})` }} />
                  <circle cx="18" cy="18" r="17.2" fill="transparent" stroke="#ffffff" strokeWidth="0.1" strokeDasharray="8 98.8" strokeLinecap="round" opacity="0.8" />
              </g>

              <circle cx="18" cy="18" r="13.5" fill="transparent" stroke="rgba(255,255,255,0.15)" strokeWidth="0.2" strokeDasharray="0.5 1" />
           </svg>
           <div className="absolute inset-0 flex flex-col items-center justify-center z-20">
              <span className={`${labelSize} font-bold text-slate-400 mb-0.5 uppercase tracking-widest`}>เหลือเป้า</span>
              <span className={`${numSize} font-black leading-none drop-shadow-md ${colorClass}`}>{remaining.toLocaleString()}</span>
              <div className={`${labelSize} font-bold text-slate-400 mt-1 sm:mt-2 pt-1 sm:pt-2 border-t border-white/10 w-3/4 text-center flex flex-col items-center`}>
                 <span>ขายได้: <span className="text-white font-black">{value.toLocaleString()}</span> กล่อง</span>
                 <span className={`text-[11px] sm:text-[13px] font-black mt-1 ${colorClass} bg-black/30 px-2.5 py-0.5 rounded-lg border border-white/10 shadow-sm`}>คืบหน้า {percent.toFixed(1)}%</span>
              </div>
           </div>
        </div>
    )
};

const getUserPagePermission = (currentUser, pageId) => {
    if (!currentUser) return 'view';
    const role = currentUser.role || 'พนักงานทั่วไป';
    if (role === 'ผู้ดูแลระบบ' || String(role).toLowerCase() === 'admin') return 'full';
    
    let saved = {};
    try {
        const stored = localStorage.getItem('stk_role_permissions');
        if (stored) saved = JSON.parse(stored);
    } catch(e) {}

    if (saved[role] && saved[role][pageId] !== undefined) {
        return saved[role][pageId];
    }

    const defaultStaff = {
        dashboard: 'view', reports: 'none', orgchart: 'view', sales: 'edit', customers: 'view',
        team: 'none', business_teams: 'none', stock: 'none', customer_types: 'none', closers: 'none',
        exchange_rate: 'none', system_users: 'none'
    };
    return defaultStaff[pageId] !== undefined ? defaultStaff[pageId] : 'view';
};
window.getUserPagePermission = getUserPagePermission;

             <React.Fragment>

                    <img src={currentUserProfileUrl} alt="Profile" className={`rounded-full object-cover border-2 border-slate-700 shadow-sm shrink-0 ${isSidebarCollapsed ? 'w-10 h-10 mx-auto' : 'w-10 h-10'}`} />
                 ) : (
                    <UserCircle size={isSidebarCollapsed ? 32 : 36} className={`text-blue-400 bg-blue-900/30 rounded-full shrink-0 p-1 ${isSidebarCollapsed ? 'mx-auto' : ''}`} />
                )}
               {!isSidebarCollapsed && (
                 <div className="w-full flex flex-col items-start overflow-hidden">
                   <p className="text-[12px] font-bold text-white truncate w-full" title={currentUser.name}>{currentUser.name}</p>
                   <p className="text-[10px] font-bold text-slate-400 mb-1">{currentUser.role}</p>
                   <button onClick={onLogout} className="text-[11px] font-bold text-red-400 hover:text-red-300 bg-red-950/30 px-2 py-0.5 rounded border border-red-900/50 transition-colors w-full text-left">ออกจากระบบ</button>
                 </div>
               )}
             </React.Fragment>
           ) : (
             <div className="w-full flex flex-col items-center justify-center">
                {!isSidebarCollapsed && <p className="text-[11px] font-bold text-slate-400 mb-2">เข้าสู่ระบบเพื่อใช้งาน</p>}
                <button onClick={() => setShowLoginModal(true)} className={`bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg shadow-sm transition-colors w-full ${isSidebarCollapsed ? 'py-2 px-1 text-[10px]' : 'py-1.5 px-4 text-xs'}`}>
                   {isSidebarCollapsed ? 'Login' : 'ล็อกอินเข้าสู่ระบบ'}
                </button>
             </div>
           )}
        </div>
      </aside>

      {/* Mobile Menu Toggle Button */}
      <div className="lg:hidden bg-slate-900 border-b border-slate-800 sticky top-0 z-20 px-4 py-3 flex justify-between items-center shadow-sm h-[60px] no-print">
         <h1 className="text-lg font-black text-white tracking-tight">LOVE <span className="text-blue-500">STK GROUPE</span></h1>
         <button onClick={() => setIsMobileMenuOpen(true)} className="p-2 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition-colors">
            <Menu size={24} />
         </button>
      </div>

      {/* Mobile Menu Overlay */}
      {isMobileMenuOpen && (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 lg:hidden" onClick={() => setIsMobileMenuOpen(false)}></div>
      )}

      {/* Sidebar (Mobile) */}
      <aside className={`fixed inset-y-0 left-0 bg-slate-900 w-72 shadow-2xl z-50 transform transition-transform duration-300 lg:hidden flex flex-col border-r border-slate-800 ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
        <div className="p-4 border-b border-slate-800 flex justify-between items-center h-[72px]">
          <h1 className="text-xl font-black text-white tracking-tight">LOVE <span className="text-blue-500">STK GROUPE</span></h1>
          <button onClick={() => setIsMobileMenuOpen(false)} className="p-2 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg border border-transparent transition-colors"><X size={24}/></button>
        </div>
        
        <div className="flex-1 p-4 space-y-2 overflow-y-auto pb-28 hide-scroll">
          {canDashboard && <SidebarItem icon={LayoutDashboard} label="แดชบอร์ด (Dashboard)" id="dashboard" activeTab={activePage} href={SCRIPT_URL + '?page=dashboard'} onTabClick={handleTabClick} isSidebarCollapsed={false} />}
          
          {isLoggedIn && (
            <React.Fragment>
              <SidebarReportsGroup activeTab={activePage} isSidebarCollapsed={false} handleTabClick={handleTabClick} SCRIPT_URL={SCRIPT_URL} currentUser={currentUser} />
              {canOrgChart && <SidebarItem icon={GitBranch} label="ผังองค์กรสายงาน" id="org_chart" activeTab={activePage} href={SCRIPT_URL + '?page=org_chart'} onTabClick={handleTabClick} isSidebarCollapsed={false} />}

              {(canSales || canCustomers) && <div className="pt-3 pb-1.5"><p className="text-[10px] font-black text-slate-500 uppercase tracking-widest px-4">ธุรกรรมประจำวัน</p></div>}
              {canSales && <SidebarItem icon={ShoppingCart} label="ป้อนข้อมูลขาย (Sales)" id="sales" activeTab={activePage} href={SCRIPT_URL + '?page=sales'} onTabClick={handleTabClick} isSidebarCollapsed={false} />}
              {canCustomers && <SidebarItem icon={Contact} label="ข้อมูลลูกค้า (Customers)" id="customers" activeTab={activePage} href={SCRIPT_URL + '?page=customers'} onTabClick={handleTabClick} isSidebarCollapsed={false} />}
              
              <SidebarSettingsGroup activeTab={activePage} isSidebarCollapsed={false} isAdmin={isAdmin} handleTabClick={handleTabClick} SCRIPT_URL={SCRIPT_URL} currentUser={currentUser} />
            </React.Fragment>
          )}
        </div>
        
        <div className="p-4 border-t border-slate-800 bg-slate-950 flex items-center gap-3 absolute bottom-0 w-full h-24">
           {isLoggedIn ? (
             <React.Fragment>
               {currentUserProfileUrl ? (
                   <img src={currentUserProfileUrl} alt="Profile" className="w-10 h-10 rounded-full object-cover border-2 border-slate-700 shadow-sm shrink-0" />
                ) : (
                   <UserCircle size={36} className="text-blue-400 bg-blue-900/30 rounded-full shrink-0 p-1" />
               )}
               <div className="w-full flex flex-col items-start overflow-hidden">
                   <p className="text-[13px] font-bold text-white truncate w-full">{currentUser.name}</p>
                   <p className="text-[11px] font-bold text-slate-400 mb-1">{currentUser.role}</p>
                   <button onClick={onLogout} className="text-[11px] font-bold text-red-400 hover:text-red-300 bg-red-950/30 px-3 py-1 rounded border border-red-900/50 transition-colors">ออกจากระบบ</button>
               </div>
             </React.Fragment>
           ) : (
             <div className="w-full flex flex-col items-center justify-center px-4">
                <p className="text-[11px] font-bold text-slate-400 mb-2">โหมดผู้เยี่ยมชม (ดูยอดขายได้เท่านั้น)</p>
                <button onClick={() => setShowLoginModal(true)} className="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-xl shadow-sm text-sm w-full transition-colors">ล็อกอินเข้าสู่ระบบ</button>
             </div>
           )}
        </div>
      </aside>
    </React.Fragment>
  );
};

// ==========================================
// 📌 Login Modal Component
// ==========================================
const LoginModal = ({ isOpen, onClose, onLoginSuccess, systemUsers }) => {
    const [username, setUsername] = useState('');
    const [password, setPassword] = useState('');
    const [rememberMe, setRememberMe] = useState(false);
    const [error, setError] = useState('');
    const [isLoading, setIsLoading] = useState(false);

    useEffect(() => {
        if (isOpen) {
            try {
                const savedUser = localStorage.getItem('stk_saved_username');
                const savedPass = localStorage.getItem('stk_saved_password');
               if(savedUser && savedPass) {
                setUsername(savedUser);
                  setPassword(atob(savedPass)); 
                    setRememberMe(true);
                   }
            } catch (err) {
                console.warn("เบราว์เซอร์บล็อกการจดจำรหัสผ่าน");
            }
        }
    }, [isOpen]);

    if (!isOpen) return null;

    const handleLogin = (e) => {
        e.preventDefault();
        setError('');
        setIsLoading(true);

        const inputUser = String(username).trim();
        const inputPass = String(password).trim();

        const processSuccess = (user) => {
            try {
                if (rememberMe) {
                    localStorage.setItem('stk_saved_username', inputUser);
                    localStorage.setItem('stk_saved_password', btoa(inputPass));
                } else {
                    localStorage.removeItem('stk_saved_username');
                    localStorage.removeItem('stk_saved_password');
                }
            } catch (err) {
                console.warn("ไม่สามารถบันทึกการจดจำรหัสผ่านได้");
            }
            onLoginSuccess(user);
        };

        if (typeof google !== 'undefined' && google.script && google.script.run) {
            google.script.run
                .withSuccessHandler((serverResult) => {
                    setIsLoading(false);
                    if (serverResult) {
                        processSuccess({
                            id: serverResult.id || serverResult['รหัสสมาชิก'] || '',
                            username: serverResult.username || serverResult.Username || inputUser,
                            name: serverResult.name || serverResult['ชื่อผู้ใช้งาน'] || inputUser,
                            role: serverResult.role || serverResult['ระดับสิทธิ์'] || 'พนักงานทั่วไป',
                            status: serverResult.status || serverResult['สถานะ'] || 'ใช้งาน',
                            profileUrl: serverResult.profileUrl || ''
                        });
                    } else {
                        setError('Username หรือ Password ไม่ถูกต้อง');
                    }
                })
                .withFailureHandler(() => {
                    setIsLoading(false);
                    setError('ไม่สามารถเชื่อมต่อฐานข้อมูลได้');
                })
                .verifyLogin(inputUser, inputPass);
        } else {
            setTimeout(() => {
                setIsLoading(false);
                const foundLocal = (systemUsers || []).find(u => 
                    u && String(u.username).trim().toLowerCase() === inputUser.toLowerCase() && String(u.password).trim() === inputPass
                );
                
                if (foundLocal) {
                    processSuccess(foundLocal);
                } else if (inputUser.toLowerCase() === 'admin' && (inputPass === '1234' || inputPass === 'password' || inputPass === 'admin')) {
                    processSuccess({ id: 'U001', username: 'admin', name: 'Admin (ทดสอบ)', role: 'ผู้ดูแลระบบ', status: 'ใช้งาน' });
                } else {
                    setError('Username หรือ Password ไม่ถูกต้อง');
                }
            }, 500);
        }
    };

    return (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-[1000] flex items-center justify-center p-4 animation-fade-in">
            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-8 animation-pop border border-slate-100 relative overflow-hidden" onClick={e => e.stopPropagation()}>
                <div className="absolute -top-16 -right-16 w-32 h-32 bg-blue-500 rounded-full blur-3xl opacity-20"></div>
                <div className="absolute -bottom-16 -left-16 w-32 h-32 bg-fuchsia-500 rounded-full blur-3xl opacity-20"></div>
                
                <div className="text-center mb-8 relative z-10">
                   <div className="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-blue-100 shadow-sm"><UserCircle size={36}/></div>
                   <h3 className="text-2xl font-black text-slate-800">เข้าสู่ระบบ</h3>
                   <p className="text-slate-500 text-sm font-medium mt-1">STK Sales Management</p>
                </div>
                
                <form onSubmit={handleLogin} className="space-y-4 relative z-10">
                    {error && <div className="bg-red-50 text-red-500 text-sm font-bold p-3 rounded-xl border border-red-100 text-center">{error}</div>}
                    <div>
                        <label className={labelClassHud}>Username</label>
                        <input type="text" required className={inputClassHud} placeholder="กรอก Username" value={username} onChange={e => setUsername(e.target.value)} />
                    </div>
                    <div>
                        <label className={labelClassHud}>Password</label>
                        <input type="password" required className={inputClassHud} placeholder="กรอก Password" value={password} onChange={e => setPassword(e.target.value)} />
                    </div>
                    
                    <div className="flex items-center gap-2 mt-1 mb-2 pl-1">
                        <input type="checkbox" id="rememberMe" checked={rememberMe} onChange={e => setRememberMe(e.target.checked)} className="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer" />
                        <label htmlFor="rememberMe" className="text-[13px] font-bold text-slate-600 cursor-pointer select-none">จดจำรหัสผ่าน</label>
                    </div>

                    <button type="submit" disabled={isLoading} className={`${btnClassPrimary} w-full mt-2`}>
                        {isLoading ? 'กำลังตรวจสอบ...' : 'เข้าสู่ระบบ'}
                    </button>
                </form>
                <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700 bg-slate-50 p-1.5 rounded-lg border border-slate-200 transition-colors z-20"><X size={18}/></button>
            </div>
        </div>
    )
};

    // Icons
    const TrendingUpIcon = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>;
    const AwardIcon = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="7"></circle><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"></polyline></svg>;

    // ==========================================
    // 📌 TreeNode Visual Component (แนวตั้ง คลีนๆ)
    // ==========================================
    const TreeNode = ({ node, allMembers, onSelect, onOpenDetail, expandedNodes, toggleExpand, searchQuery, memberSales, displaySize = 'full', selectedId, teamMap }) => {
        const children = useMemo(() => {
            return allMembers.filter(m => 
                String(m.referrer || '').trim().toUpperCase() === String(node.id).trim().toUpperCase() &&
                String(m.id).trim().toUpperCase() !== String(node.id).trim().toUpperCase()
            );
        }, [node.id, allMembers]);

        const isExpanded = expandedNodes[node.id];
        const hasChildren = children.length > 0;
        
        const isMatched = searchQuery && (
            node.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
            node.id.toLowerCase().includes(searchQuery.toLowerCase())
        );

        const isSelected = selectedId && String(selectedId).trim().toUpperCase() === String(node.id).trim().toUpperCase();
        const salesData = memberSales?.[node.id] || { personal: 0, group: 0 };
        const teamColor = node.team === 'Marketing' ? 'from-blue-500 to-indigo-500' : 'from-emerald-500 to-teal-500';

        const handleNodeClick = (e) => {
            e.stopPropagation();
            onSelect(node);
        };

        // 🟢 โหมดแสดงผลแบบเต็ม (Full Cards) - ดีไซน์ใหม่ มินิมอล
        if (displaySize === 'full') {
            return (
                <div className="flex flex-col items-center relative">
                    
                    {/* กล่องการ์ดพนักงาน */}
                    <div 
                        onClick={handleNodeClick}
                        className={`mt-4 mb-2 p-3 w-44 rounded-[20px] border bg-white transition-all duration-300 relative z-10 cursor-pointer flex flex-col items-center ${
                            isSelected
                            ? 'border-blue-500 shadow-[0_0_15px_rgba(59,130,246,0.3)] scale-105'
                            : isMatched 
                            ? 'border-indigo-400 shadow-[0_0_15px_rgba(99,102,241,0.3)] scale-105' 
                            : 'border-slate-200 shadow-sm hover:border-blue-300 hover:shadow-md'
                        }`}
                    >
                        {/* รูปโปรไฟล์ */}
                        <div className={`w-12 h-12 rounded-full p-0.5 bg-gradient-to-r shadow-sm flex items-center justify-center shrink-0 mb-2 ${
                            isSelected || isMatched ? 'from-blue-500 to-indigo-600' : 'from-slate-300 to-slate-400'
                        }`}>
                            {node.profileUrl ? (
                                <img src={node.profileUrl} className="w-full h-full rounded-full object-cover border-2 border-white" />
                            ) : (
                                <div className="w-full h-full rounded-full bg-white text-slate-400 flex items-center justify-center font-bold">
                                    <UserCircle size={24} />
                                </div>
                            )}
                        </div>

                        {/* ข้อมูล */}
                        <div className="text-center w-full">
                            <span className={`text-[9px] font-black tracking-wider px-2 py-0.5 rounded-md ${
                                isSelected || isMatched ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-500'
                            }`}>
                                {node.id}
                            </span>
                            <h4 className="text-xs font-black text-slate-800 truncate mt-1.5 px-1">{node.name}</h4>
                            <p className="text-[9px] text-slate-400 font-bold mt-0.5 truncate">
                                {teamMap?.[String(node.team).trim().toUpperCase()] || node.team || 'ทั่วไป'}
                            </p>

                            <div className="border-t border-slate-100 my-2"></div>

                            {/* กล่องยอดขาย */}
                            <div className="grid grid-cols-2 gap-1 text-[9px] font-bold">
                                <div className="flex flex-col items-center">
                                    <span className="text-[8px] text-slate-400">ส่วนตัว</span>
                                    <span className="text-blue-600">{salesData.personal} ชิ้น</span>
                                </div>
                                <div className="flex flex-col items-center border-l border-slate-100">
                                    <span className="text-[8px] text-slate-400">ยอดทีม</span>
                                    <span className="text-indigo-600">{salesData.group} ชิ้น</span>
                                </div>
                            </div>

                            <button 
                                type="button"
                                onClick={(e) => { e.stopPropagation(); onSelect(node); if(onOpenDetail) onOpenDetail(node); }}
                                className="w-full mt-2 py-1 bg-slate-100 hover:bg-blue-600 hover:text-white text-slate-600 text-[8px] font-black rounded-lg transition-all"
                            >
                                🔍 เจาะลึกดีเทล
                            </button>
                        </div>
                        
                        {/* ปุ่มขยาย/ย่อ สายงาน */}
                        {hasChildren && (
                            <button 
                                onClick={(e) => { e.stopPropagation(); toggleExpand(node.id); }} 
                                className={`absolute -bottom-3 left-1/2 -translate-x-1/2 w-6 h-6 rounded-full border-2 flex items-center justify-center text-xs font-black transition-all shadow-sm z-20 ${
                                    isExpanded 
                                    ? 'bg-white text-slate-400 border-slate-200 hover:bg-slate-100 hover:text-slate-600' 
                                    : 'bg-blue-50 text-blue-600 border-blue-200 hover:bg-blue-100 hover:scale-110'
                                }`}
                                title={isExpanded ? "ย่อสายงาน" : "ขยายสายงาน"}
                            >
                                {isExpanded ? '−' : `+${children.length}`}
                            </button>
                        )}
                    </div>

                    {/* เส้นเชื่อมและโหนดลูก */}
                    {hasChildren && isExpanded && (
                        <div className="flex flex-col items-center w-full">
                            <div className="tree-line-vertical"></div>
                            <div className="flex relative justify-center">
                                {children.map((child, idx) => (
                                    <div key={child.id} className="relative flex flex-col items-center px-2">
                                        {/* เส้นแนวนอนเชื่อมระหว่างลูกๆ */}
                                        {children.length > 1 && (
                                            <div className="tree-line-horizontal" style={{
                                                left: idx === 0 ? '50%' : '0',
                                                right: idx === children.length - 1 ? '50%' : '0',
                                                width: idx === 0 || idx === children.length - 1 ? '50%' : '100%'
                                            }}></div>
                                        )}
                                        <div className="tree-line-vertical"></div>
                                        <TreeNode 
                                            node={child} 
                                            allMembers={allMembers} 
                                            onSelect={onSelect} 
                                            expandedNodes={expandedNodes}
                                            toggleExpand={toggleExpand}
                                            searchQuery={searchQuery}
                                            memberSales={memberSales}
                                            displaySize={displaySize}
                                            selectedId={selectedId}
                                            teamMap={teamMap}
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 🟢 โหมดแสดงผลแบบย่อ (Compact Mode)
        return (
            <div className="flex flex-col items-center relative py-2" title={`รหัส: ${node.id}\nชื่อ: ${node.name}\nยอดทีม: ${salesData.group}`}>
                <div className="flex flex-col items-center">
                    <div 
                        onClick={handleNodeClick}
                        className={`w-12 h-12 rounded-full p-0.5 bg-gradient-to-r shadow-sm flex items-center justify-center relative z-10 cursor-pointer transition-all duration-300 hover:scale-110 ${
                            isSelected 
                            ? 'from-blue-400 to-blue-600 ring-4 ring-blue-500/30' 
                            : isMatched 
                            ? 'from-indigo-400 to-indigo-600 ring-4 ring-indigo-500/30' 
                            : 'from-slate-200 to-slate-300'
                        }`}
                    >
                        {node.profileUrl ? (
                            <img src={node.profileUrl} className="w-full h-full rounded-full object-cover border-2 border-white" />
                        ) : (
                            <div className="w-full h-full rounded-full bg-white text-slate-400 flex items-center justify-center font-bold">
                                <span className="text-[10px] uppercase">{node.name ? node.name.substring(0,2) : node.id}</span>
                            </div>
                        )}
                        
                        {hasChildren && (
                            <button 
                                onClick={(e) => { e.stopPropagation(); toggleExpand(node.id); }} 
                                className={`absolute -bottom-1 left-1/2 -translate-x-1/2 w-4 h-4 rounded-full border flex items-center justify-center text-[8px] font-black transition-all shadow-sm z-20 ${
                                    isExpanded ? 'bg-white text-slate-400 border-slate-200' : 'bg-blue-50 text-blue-600 border-blue-200'
                                }`}
                            >
                                {isExpanded ? '−' : '+'}
                            </button>
                        )}
                    </div>
                    <div className="text-center mt-1 w-16">
                        <span className="text-[9px] font-bold text-slate-600 truncate block">{node.name}</span>
                    </div>
                </div>

                {hasChildren && isExpanded && (
                    <div className="flex flex-col items-center w-full mt-1">
                        <div className="w-0.5 h-4 bg-slate-300"></div>
                        <div className="flex relative justify-center">
                            {children.map((child, idx) => (
                                <div key={child.id} className="relative flex flex-col items-center px-1">
                                    {children.length > 1 && (
                                        <div className="tree-line-horizontal" style={{
                                            left: idx === 0 ? '50%' : '0',
                                            right: idx === children.length - 1 ? '50%' : '0',
                                            width: idx === 0 || idx === children.length - 1 ? '50%' : '100%'
                                        }}></div>
                                    )}
                                    <div className="w-0.5 h-4 bg-slate-300"></div>
                                    <TreeNode node={child} allMembers={allMembers} onSelect={onSelect} onOpenDetail={onOpenDetail} expandedNodes={expandedNodes} toggleExpand={toggleExpand} searchQuery={searchQuery} memberSales={memberSales} displaySize={displaySize} selectedId={selectedId} teamMap={teamMap} />
                                </div>
                            ))}
                        </div>
                    </div>
                )}
            </div>
        );
    };

    // ==========================================
    // 📌 Recursive Directory List Node Component
    // ==========================================
    const DirectoryNode = ({ node, allMembers, onSelect, onOpenDetail, expandedNodes, toggleExpand, searchQuery, memberSales, depth = 0, teamMap, selectedId }) => {
        const children = useMemo(() => {
            return allMembers.filter(m => 
                String(m.referrer || '').trim().toUpperCase() === String(node.id).trim().toUpperCase() &&
                String(m.id).trim().toUpperCase() !== String(node.id).trim().toUpperCase()
            );
        }, [node.id, allMembers]);

        const isExpanded = expandedNodes[node.id];
        const hasChildren = children.length > 0;
        
        const isMatched = searchQuery && (
            node.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
            node.id.toLowerCase().includes(searchQuery.toLowerCase())
        );

        const isSelected = selectedId && String(selectedId).trim().toUpperCase() === String(node.id).trim().toUpperCase();
        const salesData = memberSales?.[node.id] || { personal: 0, group: 0 };

        return (
            <div className="text-left w-full">
                <div 
                    onClick={() => onSelect(node)}
                    style={{ paddingLeft: `${depth * 24 + 12}px` }}
                    className={`flex items-center justify-between py-3 pr-4 border-b border-slate-100 hover:bg-blue-50/50 cursor-pointer transition-colors ${
                        isSelected ? 'bg-blue-50 border-l-4 border-l-blue-500' : isMatched ? 'bg-indigo-50/70 border-l-4 border-l-indigo-400' : 'border-l-4 border-l-transparent'
                    }`}
                >
                    <div className="flex items-center gap-3 overflow-hidden">
                        {hasChildren ? (
                            <button 
                                onClick={(e) => {
                                    e.stopPropagation();
                                    toggleExpand(node.id);
                                }}
                                className="w-6 h-6 rounded-md bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center font-bold text-[10px]"
                            >
                                {isExpanded ? '▼' : '▶'}
                            </button>
                        ) : (
                            <div className="w-6 h-6 flex items-center justify-center text-slate-300 text-xs">•</div>
                        )}
                        {node.profileUrl ? (
                            <img src={node.profileUrl} className="w-8 h-8 rounded-full object-cover border border-slate-200 shrink-0" />
                        ) : (
                            <div className="w-8 h-8 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center shrink-0"><UserCircle size={18} /></div>
                        )}
                        <div className="overflow-hidden">
                            <span className={`font-bold text-[13px] block truncate ${isSelected ? 'text-blue-700' : 'text-slate-800'}`}>{node.name}</span>
                            <div className="flex items-center gap-2 mt-0.5">
                                <span className="text-[9px] text-slate-500 font-bold uppercase">{node.id}</span>
                                <span className="text-[9px] text-blue-600 font-black">ส่วนตัว: {salesData.personal}</span>
                                <span className="text-[9px] text-indigo-600 font-black">ทีม: {salesData.group}</span>
                            </div>
                        </div>
                    </div>
                    <div className="flex items-center gap-2">
                        <span className="text-[9px] text-slate-500 font-bold px-1.5 py-0.5 rounded bg-slate-100">{teamMap?.[String(node.team).trim().toUpperCase()] || node.team || 'ทั่วไป'}</span>
                        <button 
                            type="button"
                            onClick={(e) => { e.stopPropagation(); onSelect(node); if(onOpenDetail) onOpenDetail(node); }}
                            className="px-2 py-1 bg-blue-50 hover:bg-blue-600 hover:text-white text-blue-600 font-black rounded-lg text-[9px] transition-all shrink-0"
                        >
                            🔍 เจาะลึก
                        </button>
                    </div>
                </div>

                {hasChildren && isExpanded && (
                    <div>
                        {children.map(child => (
                            <DirectoryNode 
                                key={child.id}
                                node={child}
                                allMembers={allMembers}
                                onSelect={onSelect}
                                onOpenDetail={onOpenDetail}
                                expandedNodes={expandedNodes}
                                toggleExpand={toggleExpand}
                                searchQuery={searchQuery}
                                memberSales={memberSales}
                                depth={depth + 1}
                                teamMap={teamMap}
                                selectedId={selectedId}
                            />
                        ))}
                    </div>
                )}
            </div>
        );
    };

    // ==========================================
    // 📌 Member Performance & Dividend Detail Modal (จับคู่ออกแบบตามภาพ 100%)
    // ==========================================
    const MemberPerformanceDetailModal = ({ isOpen, onClose, member, sales, members, products, productCategories, systemSettings, dateStart, setDateStart, dateEnd, setDateEnd, teamMap, currentUser, isAdmin }) => {
        if (!isOpen || !member) return null;

        const [referralCalcMode, setReferralCalcMode] = useState('fixed'); // 'fixed' | 'percent' | 'combo'
        const [currencyMode, setCurrencyMode] = useState('LAK'); // 'LAK' | 'THB'
        const exchangeRate = parseFloat(systemSettings?.exchange_rate) || 700;

        const mId = String(member.id || '').trim().toUpperCase();
        const cUserMemberId = currentUser?.id ? String(currentUser.id).trim().toUpperCase() : '';
        const cUsername = currentUser?.username ? String(currentUser.username).trim().toUpperCase() : '';
        const cName = currentUser?.name ? String(currentUser.name).trim().toUpperCase() : '';

        const isSelfView = Boolean(currentUser) && (
            (cUserMemberId && cUserMemberId === mId) ||
            (cUsername && cUsername === mId) ||
            (cName && cName === String(member.name || '').trim().toUpperCase())
        );

        const canViewMoney = Boolean(isAdmin) || isSelfView;

        const formatMoneyDisplay = (amountLAK) => {
            if (!canViewMoney) return '🔒 ข้อมูลส่วนบุคคล';
            const val = currencyMode === 'THB' ? (Number(amountLAK || 0) / exchangeRate) : Number(amountLAK || 0);
            const suffix = currencyMode === 'THB' ? 'THB' : 'LAK';
            return `${val.toLocaleString(undefined, { minimumFractionDigits: currencyMode === 'THB' ? 2 : 0, maximumFractionDigits: 2 })} ${suffix}`;
        };

        // 🟢 1. ดึงรายงานสายงานลูกทีมตามลำดับชั้น
        const getDownlinesWithLevels = (parentId, depth = 1, visited = new Set()) => {
            if (visited.has(parentId)) return [];
            visited.add(parentId);
            let res = [];
            const children = (members || []).filter(m => 
                String(m.referrer || '').trim().toUpperCase() === String(parentId).trim().toUpperCase() &&
                String(m.id).trim().toUpperCase() !== String(parentId).trim().toUpperCase()
            );
            children.forEach(c => {
                res.push({ member: c, level: depth });
                res = res.concat(getDownlinesWithLevels(c.id, depth + 1, visited));
            });
            return res;
        };

        const downlinesWithLevels = useMemo(() => getDownlinesWithLevels(mId), [mId, members]);
        const directChildrenCount = (members || []).filter(m => String(m.referrer || '').trim().toUpperCase() === mId).length;

        // 🟢 2. กรองยอดขายตามช่วงวันที่
        const filteredSales = useMemo(() => {
            return (sales || []).filter(s => {
                if (!s) return false;
                const sDate = s.date ? String(s.date).split('T')[0] : '';
                if (dateStart && sDate < dateStart) return false;
                if (dateEnd && sDate > dateEnd) return false;
                return true;
            });
        }, [sales, dateStart, dateEnd]);

        // 🟢 3. คำนวณสถิติยอดขายส่วนตัว & ปันผล/ค่าคอมมิชชั่นตรงตาม Reports.html 100%
        const stats = useMemo(() => {
            let selfFullBoxes = 0;
            let selfMemBoxes = 0;
            let selfPromoBoxes = 0;
            let selfEarnLAK = 0;

            let teamFullBoxes = 0;
            let teamMemBoxes = 0;
            let teamPromoBoxes = 0;
            let teamEarnLAK = 0;

            const maxCommLevels = Number(systemSettings?.commission_levels || 6);
            const maxDownlines = Math.max(1, maxCommLevels - 1);

            const categoryBreakdown = {};
            const productBreakdown = {};
            const levelBreakdown = { 0: { boxes: 0, amountLAK: 0, label: 'คอมขายเอง (Level 0)' } };
            
            for (let l = 1; l <= maxDownlines; l++) {
                levelBreakdown[l] = { boxes: 0, amountLAK: 0, label: `ค่าแนะนำ ชั้นที่ ${l}` };
            }

            const downlineMap = {};
            downlinesWithLevels.forEach(item => {
                if (item.level <= maxDownlines) {
                    downlineMap[String(item.member.id).trim().toUpperCase()] = item.level;
                }
            });

            const cleanProdName = (name) => String(name || '').replace(/\(.*?\)/g, '').trim().toUpperCase();

            // Payout resolver matching Reports.html exactly
            const computePayout = (levelIdx, prodConfig, qty, priceFull) => {
                let feePerBox = 0;
                let feePercent = 0;

                if (levelIdx === 0) {
                    feePerBox = Number(prodConfig.selfFee || prodConfig.directFee || prodConfig.self_fee || prodConfig.level0Fee || 0);
                    feePercent = Number(prodConfig.selfPercent || prodConfig.level0Percent || 0);
                } else if (levelIdx === 1) {
                    feePerBox = Number(prodConfig.level1Fee || prodConfig.uplineFee || prodConfig.level_1_fee || 0);
                    feePercent = Number(prodConfig.level1Percent || prodConfig.level_1_percent || 0);
                } else {
                    feePerBox = Number(prodConfig[`level${levelIdx}Fee`] || prodConfig[`level_${levelIdx}_fee`] || 0);
                    feePercent = Number(prodConfig[`level${levelIdx}Percent`] || prodConfig[`level_${levelIdx}_percent`] || 0);
                }

                const boxEarn = feePerBox * qty;
                const percentEarn = (priceFull * qty) * (feePercent / 100);

                if (referralCalcMode === 'percent') return percentEarn;
                if (referralCalcMode === 'combo') return boxEarn + percentEarn;
                return boxEarn;
            };

            filteredSales.forEach(s => {
                const sellerId = String(s.memberId || s.sellerId || s.seller || '').trim().toUpperCase();
                const isSelf = sellerId === mId;
                const downlevel = downlineMap[sellerId];
                const isTeam = isSelf || downlevel !== undefined;

                if (isTeam) {
                    (products || []).forEach(p => {
                        const pName = p.name;
                        const pCat = p.category || 'หมวดทั่วไป';
                        const fullQty = Number(s[`${pName}_ราคาเต็ม`] || 0);
                        const memQty = Number(s[`${pName}_ราคาสมาชิก`] || 0);
                        const promoQty = Number(s[`${pName}_ราคาโปร`] || 0);
                        const zeroQty = Number(s[`${pName}_ราคาศูนย์`] || 0);
                        const normalQty = fullQty + memQty;
                        const totalItemQty = normalQty + promoQty + zeroQty;

                        if (totalItemQty > 0) {
                            const target = cleanProdName(pName);
                            const prodConfig = (products || []).find(prod => {
                                if (!prod) return false;
                                const pNameClean = cleanProdName(prod.name);
                                const pIdClean = cleanProdName(prod.id);
                                return target === pNameClean || target === pIdClean || pNameClean.includes(target) || target.includes(pNameClean);
                            }) || p;

                            const priceFull = Number(prodConfig.priceFull || prodConfig.priceMember || 0);
                            const levelIdx = isSelf ? 0 : downlevel;
                            
                            // Payout calculated only for normalQty (ราคาเต็ม & ราคาสมาชิก) matching Reports.html
                            const payAmtLAK = normalQty > 0 ? computePayout(levelIdx, prodConfig, normalQty, priceFull) : 0;

                            // Group Categories
                            if (!categoryBreakdown[pCat]) categoryBreakdown[pCat] = { boxes: 0, amountLAK: 0 };
                            categoryBreakdown[pCat].boxes += totalItemQty;
                            categoryBreakdown[pCat].amountLAK += payAmtLAK;

                            // Group Products
                            if (!productBreakdown[pName]) productBreakdown[pName] = { boxes: 0, amountLAK: 0, category: pCat };
                            productBreakdown[pName].boxes += totalItemQty;
                            productBreakdown[pName].amountLAK += payAmtLAK;

                            if (isSelf) {
                                selfFullBoxes += fullQty;
                                selfMemBoxes += memQty;
                                selfPromoBoxes += promoQty;
                                selfEarnLAK += payAmtLAK;

                                levelBreakdown[0].boxes += normalQty;
                                levelBreakdown[0].amountLAK += payAmtLAK;
                            } else if (downlevel !== undefined) {
                                teamFullBoxes += fullQty;
                                teamMemBoxes += memQty;
                                teamPromoBoxes += promoQty;
                                teamEarnLAK += payAmtLAK;

                                if (levelBreakdown[downlevel]) {
                                    levelBreakdown[downlevel].boxes += normalQty;
                                    levelBreakdown[downlevel].amountLAK += payAmtLAK;
                                }
                            }
                        }
                    });
                }
            });

            const selfTotalBoxes = selfFullBoxes + selfMemBoxes + selfPromoBoxes;
            const teamTotalBoxes = teamFullBoxes + teamMemBoxes + teamPromoBoxes;
            const grandTotalBoxes = selfTotalBoxes + teamTotalBoxes;

            return {
                selfFullBoxes,
                selfMemBoxes,
                selfNormalBoxes: selfFullBoxes + selfMemBoxes,
                selfPromoBoxes,
                selfTotalBoxes,
                selfEarnLAK,
                teamTotalBoxes,
                teamEarnLAK,
                grandTotalEarnLAK: selfEarnLAK + teamEarnLAK,
                grandTotalBoxes,
                categoryBreakdown,
                productBreakdown,
                levelBreakdown
            };
        }, [filteredSales, mId, downlinesWithLevels, products, systemSettings, referralCalcMode]);

        return (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-md z-[99999] flex items-center justify-center p-2 sm:p-4 overflow-y-auto animation-fade-in">
                <div className="bg-slate-50 rounded-[32px] shadow-2xl max-w-4xl w-full max-h-[92vh] flex flex-col overflow-hidden border border-slate-200">
                    
                    {/* 🟢 Header Banner */}
                    <div className="bg-gradient-to-r from-blue-700 via-indigo-800 to-purple-900 p-5 sm:p-6 text-white relative shrink-0">
                        <button 
                            type="button" 
                            onClick={onClose}
                            className="absolute top-5 right-5 w-9 h-9 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center font-bold text-lg transition-all"
                        >
                            ✕
                        </button>

                        <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 pr-10">
                            <div className="flex items-center gap-4">
                                <div className="w-16 h-16 rounded-full overflow-hidden border-3 border-white/80 shadow-lg bg-white shrink-0">
                                    <img 
                                        src={member.profileUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(member.name || "")}&background=eff6ff&color=1d4ed8&rounded=true&bold=true`} 
                                        className="w-full h-full object-cover" 
                                    />
                                </div>
                                <div>
                                    <div className="flex items-center gap-2 flex-wrap">
                                        <h2 className="text-xl sm:text-2xl font-black text-white">{member.name}</h2>
                                        <span className="bg-white/20 backdrop-blur text-white text-[11px] font-black px-2.5 py-0.5 rounded-lg border border-white/30 uppercase tracking-wider">{member.id}</span>
                                    </div>
                                    <p className="text-xs text-indigo-100 font-bold mt-1">
                                        สังกัดทีม: <span className="text-white">{teamMap[String(member.team || "").trim().toUpperCase()] || member.team || "Marketing"}</span> • ผู้แนะนำ: <span className="text-white">{member.referrerName || "ไม่มี (บริษัทรับตรง)"}</span>
                                    </p>
                                </div>
                            </div>

                            {/* Date Filter */}
                            <div className="flex flex-wrap items-center gap-2 bg-white/10 backdrop-blur p-2 rounded-2xl border border-white/20 text-xs font-bold w-full md:w-auto">
                                <span className="text-indigo-200 pl-1">🗓️ ช่วงวันที่:</span>
                                <input 
                                    type="date" 
                                    value={dateStart} 
                                    onChange={e => setDateStart(e.target.value)} 
                                    className="bg-white/90 text-slate-800 px-2 py-1 rounded-xl text-xs outline-none font-bold" 
                                />
                                <span className="text-white">-</span>
                                <input 
                                    type="date" 
                                    value={dateEnd} 
                                    onChange={e => setDateEnd(e.target.value)} 
                                    className="bg-white/90 text-slate-800 px-2 py-1 rounded-xl text-xs outline-none font-bold" 
                                />
                                <button 
                                    type="button" 
                                    onClick={() => { setDateStart(''); setDateEnd(''); }} 
                                    className="bg-indigo-500 hover:bg-indigo-400 text-white px-3 py-1 rounded-xl font-bold text-xs transition-all shadow-sm flex items-center gap-1"
                                >
                                    🔄 รีเฟรช (แสดงทั้งหมด)
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* 🟢 Controls: Dividend Calculation Mode & Currency Switcher */}
                    <div className="bg-white px-5 py-3 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3 text-xs font-bold shrink-0 shadow-sm z-10">
                        <div className="flex items-center gap-2 flex-wrap">
                            <span className="text-slate-600 font-extrabold flex items-center gap-1">⚡ รูปแบบคำนวณปันผล:</span>
                            <button 
                                type="button" 
                                onClick={() => setReferralCalcMode('fixed')} 
                                className={`px-3 py-1.5 rounded-xl font-bold transition-all shadow-sm ${referralCalcMode === 'fixed' ? 'bg-blue-600 text-white shadow-blue-500/30' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                            >
                                📦 ข้างกล่องทั้งหมด (Fixed Fee)
                            </button>
                            <button 
                                type="button" 
                                onClick={() => setReferralCalcMode('percent')} 
                                className={`px-3 py-1.5 rounded-xl font-bold transition-all shadow-sm ${referralCalcMode === 'percent' ? 'bg-indigo-600 text-white shadow-indigo-500/30' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                            >
                                📊 เปอร์เซ็นต์ทั้งหมด (% Full Price)
                            </button>
                            <button 
                                type="button" 
                                onClick={() => setReferralCalcMode('combo')} 
                                className={`px-3 py-1.5 rounded-xl font-bold transition-all shadow-sm ${referralCalcMode === 'combo' ? 'bg-purple-600 text-white shadow-purple-500/30' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                            >
                                🔀 แบบผสม (ข้างกล่อง + %)
                            </button>
                        </div>

                        <div className="flex items-center gap-2">
                            <span className="text-slate-600 font-extrabold">💱 สกุลเงิน:</span>
                            <button 
                                type="button" 
                                onClick={() => setCurrencyMode('LAK')} 
                                className={`px-3 py-1.5 rounded-xl font-bold transition-all shadow-sm ${currencyMode === 'LAK' ? 'bg-emerald-600 text-white shadow-emerald-500/30' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                            >
                                🇱🇦 กีบ (LAK)
                            </button>
                            <button 
                                type="button" 
                                onClick={() => setCurrencyMode('THB')} 
                                className={`px-3 py-1.5 rounded-xl font-bold transition-all shadow-sm ${currencyMode === 'THB' ? 'bg-emerald-600 text-white shadow-emerald-500/30' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                            >
                                🇹🇭 บาท (THB)
                            </button>
                        </div>
                    </div>

                    {/* 🟢 Modal Scrollable Content */}
                    <div className="p-5 sm:p-6 overflow-y-auto space-y-6 flex-1">
                        
                        {/* Top 4 KPI Cards */}
                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                            <div className="bg-blue-50/80 p-4 rounded-2xl border border-blue-100 shadow-sm flex flex-col">
                                <span className="text-xs font-black text-blue-700">1. ยอดขายตัวเอง</span>
                                <span className="text-2xl sm:text-3xl font-black text-blue-700 mt-2">{stats.selfTotalBoxes.toLocaleString()}</span>
                                <span className="text-[11px] font-bold text-blue-500 mt-0.5">กล่อง ({formatMoneyDisplay(stats.selfEarnLAK)})</span>
                            </div>
                            <div className="bg-purple-50/80 p-4 rounded-2xl border border-purple-100 shadow-sm flex flex-col">
                                <span className="text-xs font-black text-purple-700">2. ยอดจากลูกทีม</span>
                                <span className="text-2xl sm:text-3xl font-black text-purple-700 mt-2">{stats.teamTotalBoxes.toLocaleString()}</span>
                                <span className="text-[11px] font-bold text-purple-500 mt-0.5">กล่อง ({formatMoneyDisplay(stats.teamEarnLAK)})</span>
                            </div>
                            <div className="bg-emerald-50/80 p-4 rounded-2xl border border-emerald-100 shadow-sm flex flex-col">
                                <span className="text-xs font-black text-emerald-700">3. ยอดรวมสายงาน (ทีม)</span>
                                <span className="text-2xl sm:text-3xl font-black text-emerald-700 mt-2">{stats.grandTotalBoxes.toLocaleString()}</span>
                                <span className="text-[11px] font-bold text-emerald-500 mt-0.5">กล่อง ({formatMoneyDisplay(stats.grandTotalEarnLAK)})</span>
                            </div>
                            <div className="bg-amber-50/80 p-4 rounded-2xl border border-amber-100 shadow-sm flex flex-col">
                                <span className="text-xs font-black text-amber-800">ทีมงานใต้ดูแล</span>
                                <span className="text-2xl sm:text-3xl font-black text-amber-800 mt-2">{downlinesWithLevels.length}</span>
                                <span className="text-[11px] font-bold text-amber-600 mt-0.5">คน (ชั้น 1: {directChildrenCount} คน)</span>
                            </div>
                        </div>

                        {/* Section 1: Dividend Summary Tables */}
                        <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-4">
                            <h3 className="text-sm sm:text-base font-black text-slate-800 flex items-center gap-2">
                                📋 ตารางสรุปการปันผลยอดขายแต่ละชั้น (Dividend Summary Tables):
                            </h3>

                            {/* Self Sales Table */}
                            <div className="border border-slate-200 rounded-2xl overflow-hidden">
                                <div className="bg-slate-100 px-4 py-2.5 font-black text-xs text-slate-700 border-b border-slate-200">
                                    ยอดขายตัวเอง & ค่าคอมปันผล
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-slate-50 text-slate-500 font-bold border-b border-slate-200">
                                            <tr>
                                                <th className="p-3 text-center">ลำดับ</th>
                                                <th className="p-3">หมวดสินค้า</th>
                                                <th className="p-3 text-center">จำนวนกล่อง</th>
                                                <th className="p-3 text-right">ค่าคอมเฉลี่ย/กล่อง</th>
                                                <th className="p-3 text-right">ยอดรวมปันผลสุทธิ</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 font-bold">
                                            {Object.keys(stats.categoryBreakdown).length > 0 ? (
                                                Object.keys(stats.categoryBreakdown).map((catName, idx) => {
                                                    const catInfo = stats.categoryBreakdown[catName];
                                                    const avgEarn = catInfo.boxes > 0 ? (catInfo.amountLAK / catInfo.boxes) : 0;
                                                    return (
                                                        <tr key={catName} className="hover:bg-slate-50/80">
                                                            <td className="p-3 text-center text-slate-400">{idx + 1}</td>
                                                            <td className="p-3 text-slate-800">{catName}</td>
                                                            <td className="p-3 text-center text-blue-600 font-black">{catInfo.boxes}</td>
                                                            <td className="p-3 text-right text-slate-600">{formatMoneyDisplay(avgEarn)}</td>
                                                            <td className="p-3 text-right text-emerald-600 font-black">{formatMoneyDisplay(catInfo.amountLAK)}</td>
                                                        </tr>
                                                    );
                                                })
                                            ) : (
                                                <tr>
                                                    <td colSpan="5" className="p-4 text-center text-slate-400 font-bold">ไม่พบบิลยอดขายในระบบช่วงเวลานี้</td>
                                                </tr>
                                            )}
                                        </tbody>

                            {/* Green & Purple Cards */}

                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center font-bold text-lg shadow-sm">🏷️</div>
                                        <div>
                                            <span className="text-xs font-black text-emerald-800 block">1. จำนวนกล่อง ราคาเต็ม (คำนวณปันผล)</span>

                                <div className="bg-purple-50 rounded-2xl p-4 border border-purple-200 flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-xl bg-purple-600 text-white flex items-center justify-center font-bold text-lg shadow-sm">🎁</div>
                                        <div>
                                            <span className="text-xs font-black text-purple-900 block">2. จำนวนกล่อง ราคาโปร (งดปันผล)</span>

                        {/* Section 2: Dividend Rate Box Breakdown */}
                        <div className="bg-slate-900 text-white rounded-3xl p-5 shadow-lg space-y-4">

                                </h3>

                                    รวม {stats.grandTotalBoxes} กล่อง
                                </span>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                {Object.keys(stats.productBreakdown).map(pName => {
                                    const pInfo = stats.productBreakdown[pName];
                                    return (
                                        <div key={pName} className="bg-slate-800/80 p-3.5 rounded-2xl border border-slate-700 flex justify-between items-center">
                                            <div>
                                                <span className="text-xs font-bold text-white block">{pName}</span>
                                                <span className="text-[10px] text-slate-400">หมวด: {pInfo.category}</span>
                                            </div>
                                            <div className="text-right">
                                                <span className="text-lg font-black text-amber-400 block">{pInfo.boxes} กล่อง</span>
                                                <span className="text-[10px] text-emerald-400 font-bold">{formatMoneyDisplay(pInfo.amountLAK)}</span>
                                            </div>

                            </div>
                        </div>

                        {/* Section 3: Level Breakdown & Product Breakdown */}
                        <div className="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-5">
                            <div>
                                <h3 className="text-sm sm:text-base font-black text-slate-800 flex items-center gap-2">
                                    🎯 3. ที่มาของยอดแต่ละส่วน
                                </h3>
                                <p className="text-xs font-bold text-slate-400 mt-0.5">แสดงรายละเอียดข้อมูลยอดขายทั้งหมดสะสมในระบบ</p>
                            </div>

                            {/* Level Breakdown */}
                            <div className="bg-blue-50/50 p-4 rounded-2xl border border-blue-100 space-y-3">
                                <span className="text-xs font-black text-blue-900 block">สรุปยอดขายแยกตามชั้นสายงาน (Level Breakdown — กล่อง & ยอดเงิน):</span>
                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                                    {Object.keys(stats.levelBreakdown).map(lvl => {
                                        const lvlInfo = stats.levelBreakdown[lvl];
                                        return (
                                            <div key={lvl} className="bg-white p-3.5 rounded-2xl border border-blue-200 shadow-sm flex justify-between items-center">
                                                <div>
                                                    <span className="text-xs font-bold text-slate-800 block">{lvlInfo.label}</span>

                                                    {lvlInfo.boxes} กล่อง
