                                    <div className="flex items-center bg-white border border-slate-200 rounded-xl p-0.5 shadow-2xs">
                                        <button
                                            type="button"
                                            onClick={() => setZoomScale(z => Math.max(40, z - 10))}
                                            className="w-7 h-7 flex items-center justify-center font-black text-slate-600 hover:bg-slate-100 rounded-lg transition-all text-sm"
                                            title="ย่อขนาด (Zoom Out)"
                                        >
                                            −
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setZoomScale(100)}
                                            className="px-2 h-7 flex items-center justify-center font-mono font-black text-[11px] text-blue-600 hover:bg-blue-50 rounded-lg transition-all"
                                            title="รีเซ็ตขนาด 100%"
                                        >
                                            {zoomScale}%
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => setZoomScale(z => Math.min(150, z + 10))}
                                            className="w-7 h-7 flex items-center justify-center font-black text-slate-600 hover:bg-slate-100 rounded-lg transition-all text-sm"
                                            title="ขยายขนาด (Zoom In)"
                                        >
                                            +
                                        </button>
                                    </div>
                                    <button
                                        type="button"
                                        onClick={() => setZoomScale(75)}
                                        className="px-2.5 h-8 bg-white hover:bg-slate-100 border border-slate-200 rounded-xl text-[10.5px] font-black text-slate-700 shadow-xs flex items-center gap-1 transition-all"
                                        title="ปรับขนาดผังให้พอดีจอ"
                                    >
                                        <svg className="w-3 h-3 text-slate-500 fill-current" viewBox="0 0 24 24"><path d="M15 3l2.3 2.3-2.89 2.87 1.42 1.42L18.7 6.7 21 9V3zM3 9l2.3-2.3 2.87 2.89 1.42-1.42L6.7 5.3 9 3H3zm6 12l-2.3-2.3 2.89-2.87-1.42-1.42L5.3 17.3 3 15v6zm12-6l-2.3 2.3-2.87-2.89-1.42 1.42 2.89 2.87L15 21h6z"/></svg>
                                        <span>พอดีจอ (75%)</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* 🎨 Canvas Interactive Viewport */}
                        <div 
                            className="w-full flex-1 overflow-auto p-6 sm:p-10 relative cursor-grab active:cursor-grabbing min-h-[500px]"
                            style={{
                                backgroundImage: 'radial-gradient(#cbd5e1 1.2px, transparent 1.2px)',
                                backgroundSize: '24px 24px',
                                backgroundColor: '#f8fafc'
                            }}
                        >
                            {loading ? (
                                <div className="flex flex-col items-center justify-center py-32 gap-3 animation-fade-in w-full h-full">
                                    <div className="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                                    <span className="text-sm font-bold text-slate-500">กำลังโหลดโครงสร้างสายงานในระบบ...</span>
                                </div>
                            ) : (
                                <div
                                    className="w-max min-w-full flex flex-col items-center justify-start pt-2 pb-12 transition-transform duration-200 origin-top"
                                    style={{ transform: `scale(${zoomScale / 100})` }}
                                >
                                    {/* Top Root Header Card: STK Sales Management — แสดงเฉพาะ Admin เมื่อดูภาพรวม */}
                                    {isAdmin && viewMode === 'tree' && focusedLeaderId === 'ALL' && (
                                        <>
                                            <div 
                                                className="rounded-2xl p-3.5 w-full max-w-xs sm:w-64 text-center shadow-md border relative z-10 flex flex-col items-center mb-1 select-none"
                                                style={{ backgroundColor: '#0f172a', borderColor: '#1e293b', color: '#ffffff' }}
                                            >
                                                <div className="w-9 h-9 rounded-xl bg-blue-600/20 text-blue-400 border border-blue-500/30 flex items-center justify-center mb-1.5 shadow-xs">
                                                    <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>
                                                </div>
                                                <h2 className="text-sm font-black tracking-tight text-white">STK Sales Management</h2>
                                                <p className="text-[10px] text-slate-400 font-bold">โครงสร้างสายงานในระบบ (ภาพรวม)</p>
                                            </div>
                                            <div className="w-px h-5 bg-slate-300 mb-2"></div>
                                        </>
                                    )}

                                    {viewMode === 'tree' ? (
                                        /* 🌲 Tree View: Flexible Connected Hierarchy */
                                        <div className="flex justify-center items-start gap-6 sm:gap-8 w-full pt-2">
                                            
{displayedRootMembers.map(r => (
                                                <EmployeeCardNode
                                                    key={r.id}
                                                    node={r}
                                                    allMembers={scopedMembers}
                                                    memberSales={memberSalesMap}
                                                    onSelect={m => setSelectedMember(m)}
                                                    onOpenDetail={m => { setSelectedMember(m); setDetailModalOpen(true); }}
                                                    teamMap={teamMap}
                                                    level={0}
                                                    currentUser={currentUser}
                                                    isAdmin={isAdmin}
                                                    collapsedNodeIds={collapsedNodeIds}
                                                    toggleCollapse={toggleCollapse}
                                                />
                                            ))}
                                        </div>
                                    ) : (
                                        /* 📊 Team View: Grouped by Business Team (Marketing / Center / etc.) */
                                        <div className="w-full space-y-8">
                                            {(() => {
                                                const groupedByTeam = {};
                                                (scopedMembers || []).forEach(m => {
                                                    const tCode = String(m.team || 'Marketing').trim().toUpperCase();
                                                    const tName = teamMap[tCode] || m.team || 'ทีมการตลาด (Marketing)';
                                                    if (!groupedByTeam[tName]) groupedByTeam[tName] = [];
                                                    groupedByTeam[tName].push(m);
                                                });

                                                return Object.entries(groupedByTeam).map(([teamName, teamMembers], tIdx) => {
                                                    const filteredTeamMembers = searchQuery
                                                        ? teamMembers.filter(m => m.name.toLowerCase().includes(searchQuery.toLowerCase()) || m.id.toLowerCase().includes(searchQuery.toLowerCase()))
                                                        : teamMembers;

                                                    if (filteredTeamMembers.length === 0) return null;

                                                    return (
                                                        <div key={tIdx} className="bg-slate-50/70 p-5 rounded-3xl border border-slate-200/80 space-y-4">
                                                            <div className="flex items-center gap-3 border-b border-slate-200 pb-3">
                                                                <span className="w-3 h-3 rounded-full bg-blue-600"></span>
                                                                <h3 className="text-base font-black text-slate-800">{teamName}</h3>
                                                                <span className="bg-blue-100 text-blue-700 text-xs font-black px-2.5 py-0.5 rounded-full">
                                                                    {filteredTeamMembers.length} คน
                                                                </span>
                                                            </div>

                                                            <div className="flex flex-wrap gap-4">
                                                                {filteredTeamMembers.map(m => (
                                                                    <div key={m.id} className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs hover:shadow-md transition-all w-64 flex items-center gap-3">
                                                                        <div className="w-12 h-12 rounded-full bg-blue-50 text-blue-700 border border-blue-200 flex items-center justify-center font-black text-sm shrink-0 overflow-hidden">
                                                                            {(m.profileUrl && m.profileUrl !== '-' && String(m.profileUrl).trim() !== '') ? <img src={m.profileUrl} onError={e => e.target.style.display = 'none'} className="w-full h-full object-cover rounded-full" /> : (m.name ? m.name.substring(0, 2) : m.id)}
                                                                        </div>
                                                                        <div className="flex-1 min-w-0">
                                                                            <h4 className="text-xs font-black text-slate-800 truncate">{m.name}</h4>
                                                                            <p className="text-[10px] font-mono text-slate-400 font-bold">{m.id}</p>
                                                                            {(() => {
                                                                                const currentUserId = String(currentUser?.id || '').trim().toUpperCase();
                                                                                const mId = String(m.id || '').trim().toUpperCase();
                                                                                const isSelf = !!currentUserId && currentUserId === mId;
                                                                                const canOpenDetail = isAdmin || isSelf;

                                                                                return canOpenDetail ? (
                                                                                    <button
                                                                                        onClick={() => { setSelectedMember(m); setDetailModalOpen(true); }}
                                                                                        className="mt-2 text-[10px] font-black text-blue-600 hover:text-blue-800 underline block"
                                                                                    >
                                                                                        📊 ดูผลงานสายงาน
                                                                                    </button>
                                                                                ) : (
                                                                                    <span className="mt-2 text-[10px] font-bold text-slate-400 block cursor-not-allowed opacity-60">
                                                                                        🚫 ไม่มีสิทธิ์เข้าถึง
                                                                                    </span>
                                                                                );
                                                                            })()}
                                                                        </div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    );
                                                });
                                            })()}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                    {/* 🟢 Detail Modal Popup */}
                    <MemberPerformanceDetailModal
                        isOpen={detailModalOpen}
                        onClose={() => setDetailModalOpen(false)}
                        member={selectedMember}
                        sales={sales}
                        members={scopedMembers}
                        products={products}
                        customerTypes={customerTypes}
                        systemSettings={systemSettings}
                        teamMap={teamMap}
                        startDate={startDate}
                        endDate={endDate}
                        isAdmin={isAdmin}
                    />
                </div>
            );
        };

        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [showLoginModal, setShowLoginModal] = useState(false);

            const initialCache = (() => {
                try {
                    const time = localStorage.getItem('stk_app_cache_time');
                    // ถ้าแคชมีอายุเกิน 30 วินาที ให้ดึงสด ป้องกันแคชรายชื่อบทบาทเก่าค้าง
                    if (time && Date.now() - Number(time) > 30000) {
                        return null;
                    }
                    const data = localStorage.getItem('stk_app_cache_data'); 
                    return data ? JSON.parse(data) : null; 
                }
                catch (e) { return null; }
            })();

            const [products, setProducts] = useState(() => initialCache && Array.isArray(initialCache.products) ? initialCache.products : []);
            const [customerTypes, setCustomerTypes] = useState(() => initialCache && Array.isArray(initialCache.customerTypes) ? initialCache.customerTypes : fallbackCustomerTypes);
            const [members, setMembers] = useState(() => {
                if (!initialCache || !Array.isArray(initialCache.members)) return [];
                return initialCache.members.map(m => ({
                    ...m,
                    id: String(m.id || m.user_id || m.member_id || m.User_ID || '').trim(),
                    name: String(m.name || m.Name || '').trim(),
                    referrer: String(m.referrer || m.sponsor_id || m.Sponsor_ID || '').trim(),
                    team: String(m.team || m.business_team || m.Business_Team || 'Marketing').trim(),
                    role: String(m.role || m.permission_role || m.Permission_Role || 'พนักงานทั่วไป').trim(),
                    status: String(m.status || m.Status || 'ทำงานอยู่').trim(),
                    profileUrl: m.profile_url || m.id_card_url || m.ID_Card_URL || '',
                    phone: m.phone || m.phone_number || m.Phone_Number || '',
                    email: m.email || m.Email || '',
                    lineId: m.line_id || m.LINE_ID || '',
                    accumulatedPV: Number(m.accumulated_pv || m.Accumulated_PV || 0)
                })).filter(m => m.id !== '');
            });
            const [customers, setCustomers] = useState(() => initialCache && Array.isArray(initialCache.customers) ? initialCache.customers : []);
            const [sales, setSales] = useState(() => initialCache && Array.isArray(initialCache.sales) ? initialCache.sales : []);
            const [businessTeams, setBusinessTeams] = useState(() => initialCache && Array.isArray(initialCache.businessTeams) ? initialCache.businessTeams.map(t => ({ ...t, id: t.id || t.team_id, name: t.name || t.team_name })) : []);
            const [systemUsers, setSystemUsers] = useState([]);
            const [systemSettings, setSystemSettings] = useState(() => {
                // Start with app cache (Supabase data) - handle both array and object formats
                let base = {};
                if (initialCache && initialCache.systemSettings) {
                    const raw = initialCache.systemSettings;
                    if (Array.isArray(raw)) {
                        // Supabase format: [{key, setting_key, value, setting_value}]
                        raw.forEach(s => { if (s.key || s.setting_key) base[s.key || s.setting_key] = s.value || s.setting_value; });
                    } else if (typeof raw === 'object') {
                        base = { ...raw };
                    }
                }
                // ALWAYS override commission_condition_config from stk_system_settings (set by Stock.html)
                try {
                    const localStr = localStorage.getItem('stk_system_settings');
                    if (localStr) {
                        const localObj = JSON.parse(localStr);
                        if (localObj && localObj.commission_condition_config !== undefined) {
                            base = { ...base, commission_condition_config: localObj.commission_condition_config };
                        }
                    }
                } catch(e) {}
                return base;
            });
            const [isAppLoading, setIsAppLoading] = useState(() => !initialCache);
            const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
                try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch (e) { return false; }
            });

            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

            // Listen for commission_condition_config changes from Stock.html in real-time
            useEffect(() => {
                const handleStorageChange = () => {
                    try {
                        const localStr = localStorage.getItem('stk_system_settings');
                        if (localStr) {
                            const localObj = JSON.parse(localStr);
                            if (localObj && localObj.commission_condition_config !== undefined) {
                                setSystemSettings(prev => ({
                                    ...prev,
                                    commission_condition_config: localObj.commission_condition_config
                                }));
                            }
                        }
                    } catch(e) {}
                };
                window.addEventListener('storage', handleStorageChange);
                return () => window.removeEventListener('storage', handleStorageChange);
            }, []);

            const pagePerm = window.getUserPagePermission ? window.getUserPagePermission(currentUser, 'orgchart') : 'none';
            const isAdmin = currentUser && (
                String(currentUser.role).trim() === 'ผู้ดูแลระบบ' ||
                String(currentUser.role).trim().toLowerCase().includes('admin') || String(currentUser.role).trim().includes('แอดมิน') ||
                pagePerm === 'full'
            );
            const currentUserProfileUrl = currentUser?.profileUrl || '';

            useEffect(() => {
                const savedUserStr = localStorage.getItem('stk_current_user');
                if (savedUserStr) {
                    try {
                        const user = JSON.parse(savedUserStr);
                        setCurrentUser(user);
                        setIsLoggedIn(true);
                    } catch (e) { localStorage.removeItem('stk_current_user'); }
                }

                const initialLoader = document.getElementById('initial-loader');
                if (initialLoader) { initialLoader.style.opacity = '0'; setTimeout(() => { if (initialLoader) initialLoader.style.display = 'none'; }, 400); }

                Promise.all([
                    supabaseSelect('stk_products', 'select=product_id,name,category,price_full,price_member,price_promo,give_pv,current_stock,status,image_url,self_fee,level_1_fee,level_2_fee,level_3_fee,level_4_fee,level_5_fee,self_percent_full,level_1_percent_full,self_percent_member,level_1_percent_member').catch(() => supabaseSelect('products')),
                    supabaseSelect('stk_customer_types').catch(() => supabaseSelect('customer_types')),
                    supabaseSelect('stk_members', 'select=user_id,name,sponsor_id,business_team,permission_role,status,accumulated_pv,phone_number,email,id_card_url&nocache=true').catch(() => supabaseSelect('members')),
                    supabaseSelect('stk_customers', 'order=customer_id.desc&limit=2000').catch(() => supabaseSelect('customers')),
                    supabaseSelect('stk_sales', 'order=order_id.desc&limit=3000').catch(() => supabaseSelect('sales')),
                    supabaseSelect('stk_business_teams').catch(() => supabaseSelect('business_teams')),
                    supabaseSelect('stk_system_settings').catch(() => supabaseSelect('system_settings'))
                ]).then(([pRes, typeRes, memRes, custRes, saleRes, teamRes, setRes]) => {
                    const resObj = {
                        products: pRes,
                        customerTypes: typeRes,
                        members: memRes,
                        customers: custRes,
                        sales: saleRes,
                        businessTeams: teamRes,
                        systemSettings: setRes
                    };
                    applyDataToStates(resObj);
                    try {
                        localStorage.setItem('stk_app_cache_data', JSON.stringify(resObj));
                        localStorage.setItem('stk_app_cache_time', String(Date.now()));
                    } catch (e) { }
                }).catch(err => {
                    console.error("Supabase load error:", err);
                }).finally(() => {
                    setIsAppLoading(false);
                });
            }, []);

            const applyDataToStates = (response) => {
                let localSettings = {};
                if (Array.isArray(response.systemSettings) && response.systemSettings.length > 0) {
                    response.systemSettings.forEach(s => {
                        if (s.key || s.setting_key) localSettings[s.key || s.setting_key] = s.value || s.setting_value;
                    });
                }
                const localMarginsStr = localSettings.product_margins;
                const localMargins = localMarginsStr ? (typeof localMarginsStr === 'string' ? JSON.parse(localMarginsStr) : localMarginsStr) : {};

                if (Array.isArray(response.products)) {
                    setProducts(response.products.map(p => {
                        const pId = String(p.product_id || p.id || '').trim();
                        const margin = localMargins[pId] || { amount: 0, currency: 'LAK' };
                        return {
                            ...p,
                            id: pId,
                            name: String(p.name || '').trim(),
                            category: String(p.category || '').trim(),
                            self_fee: Number(p.self_fee || p.selfFee || p.Self_Fee || p.SelfFee || 0),
                            level_1_fee: Number(p.level_1_fee || p.level1Fee || p.Level_1_Fee || p.Level1Fee || 0),
                            level_2_fee: Number(p.level_2_fee || p.level2Fee || p.Level_2_Fee || 0),
                            level_3_fee: Number(p.level_3_fee || p.level3Fee || p.Level_3_Fee || 0),
                            level_4_fee: Number(p.level_4_fee || p.level4Fee || p.Level_4_Fee || 0),
                            level_5_fee: Number(p.level_5_fee || p.level5Fee || p.Level_5_Fee || 0),
                            price_full: Number(p.price_full ?? p.priceFull ?? 0),
                            price_member: Number(p.price_member ?? p.priceMember ?? 0),
                            full_margin_amount: Number(margin.amount ?? 0),
                            full_margin_currency: margin.currency || 'LAK'
                        };
                    }));
                }
                if (Array.isArray(response.customerTypes)) setCustomerTypes(response.customerTypes);
                if (Array.isArray(response.systemSettings) && response.systemSettings.length > 0) {
                    const settingsObj = {};
                    response.systemSettings.forEach(s => {
                        if (s.key || s.setting_key) settingsObj[s.key || s.setting_key] = s.value || s.setting_value;
                    });
                    // Always use localStorage commission_condition_config to prevent Supabase stale data from overwriting
                    try {
                        const localCommStr = localStorage.getItem('stk_system_settings');
                        if (localCommStr) {
                            const localComm = JSON.parse(localCommStr);
                            if (localComm && localComm.commission_condition_config !== undefined) {
                                settingsObj.commission_condition_config = localComm.commission_condition_config;
                            }
                        }
                    } catch(eLocalComm) {}
                    setSystemSettings(settingsObj);
                }
                if (Array.isArray(response.members)) {
                    const formattedMembers = response.members.map(m => ({
                        id: String(m.id || m.user_id || m.User_ID || '').trim(),
                        name: String(m.name || m.Name || '').trim(),
                        referrer: String(m.referrer || m.sponsor_id || m.Sponsor_ID || '').trim(),
                        team: String(m.team || m.business_team || m.Business_Team || 'Marketing').trim(),
                        role: String(m.role || m.permission_role || m.Permission_Role || 'พนักงานทั่วไป').trim(),
                        status: String(m.status || m.Status || 'ทำงานอยู่').trim(),
                        profileUrl: m.profile_url || m.id_card_url || m.ID_Card_URL || '',
                        phone: m.phone || m.phone_number || m.Phone_Number || '',
                        email: m.email || m.Email || '',
                        lineId: m.line_id || m.LINE_ID || '',
                        accumulatedPV: Number(m.accumulated_pv || m.Accumulated_PV || 0)
                    })).filter(m => m.id !== '');
                    setMembers(formattedMembers);
                }
                if (Array.isArray(response.customers)) setCustomers(response.customers);
                if (Array.isArray(response.businessTeams)) setBusinessTeams(response.businessTeams.map(t => ({ ...t, id: String(t.id || t.team_id || t.Team_ID || "").trim(), name: String(t.name || t.team_name || t.Team_Name || t.TeamName || "").trim(), status: String(t.status || t.Status || "ใช้งาน").trim() })));

                if (Array.isArray(response.sales)) {
                    const processedSales = (window.OrgChartLogic?.processOrgChartSales)
                        ? window.OrgChartLogic.processOrgChartSales(response.sales)
                        : response.sales;
                    setSales(processedSales);
                }
            };
            return (
                <div className="min-h-screen bg-slate-100 flex flex-col lg:flex-row font-sans antialiased text-slate-800 w-full">
                    <Toast toast={toast} setToast={setToast} />

                    <Sidebar
                        activePage="org_chart"
                        isSidebarCollapsed={isSidebarCollapsed}
                        setIsSidebarCollapsed={setIsSidebarCollapsed}
                        isAdmin={isAdmin}
                        currentUserProfileUrl={currentUserProfileUrl}
                        currentUser={currentUser}
                        isLoggedIn={isLoggedIn}
                        onLogout={() => {
                            localStorage.removeItem('stk_current_user');
                            setIsLoggedIn(false);
                            setCurrentUser(null);
                            const targetUrl = typeof resolvePageUrl === 'function' ? resolvePageUrl('?page=dashboard') : 'Mlm.html';
                            if (typeof window !== 'undefined') window.location.href = targetUrl;
                        }}
                        showLoginModal={showLoginModal}
                        setShowLoginModal={setShowLoginModal}
                        setIsAppLoading={setIsAppLoading}
                    />

                    <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} min-w-0 max-w-full overflow-x-hidden`}>

                        <div className="p-3 sm:p-6 lg:p-8 flex-1 w-full">
                            <div className="w-full">
                                <SalesTeamHierarchyView
                                    members={members}
                                    sales={sales}
                                    businessTeams={businessTeams}
                                    products={products}
                                    customerTypes={customerTypes}
                                    systemSettings={systemSettings}
                                    currentUser={currentUser}
                                    isAdmin={isAdmin}
                                    loading={isAppLoading}
                                />
                            </div>
                        </div>

                    </main>

                    <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={(u) => { setCurrentUser(u); setIsLoggedIn(true); setShowLoginModal(false); }} systemUsers={systemUsers} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
