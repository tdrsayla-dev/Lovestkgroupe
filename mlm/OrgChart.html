                                </div>
                            </div>

                            {/* Category & Product Breakdown */}
                            <div className="space-y-4 pt-2">
                                <h4 className="text-xs font-black text-slate-800 flex items-center gap-2">
                                    📦 🪵 ยอดขายจำแนกตามหมวดสินค้า & รายการสินค้า (ทั้งทีมสายงาน)
                                </h4>

                                {/* Category Cards */}
                                <div className="space-y-2">
                                    <span className="text-[11px] font-bold text-slate-500">📁 ยอดขายรวมแยกตามหมวดสินค้า (Category Summary):</span>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        {Object.keys(stats.categoryBreakdown).map(cName => {
                                            const cInfo = stats.categoryBreakdown[cName];
                                            return (
                                                <div key={cName} className="bg-emerald-50/80 p-3.5 rounded-2xl border border-emerald-200 flex justify-between items-center">
                                                    <span className="text-xs font-bold text-emerald-900">📁 {cName}</span>
                                                    <div className="text-right">
                                                        <span className="text-sm font-black text-emerald-700 block">{cInfo.boxes} กล่อง</span>
                                                        <span className="text-[10px] font-bold text-emerald-600">💰 {formatMoneyDisplay(cInfo.amountLAK)}</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* Product Cards */}
                                <div className="space-y-2 pt-2">
                                    <span className="text-[11px] font-bold text-slate-500">🍇 ยอดขายรวมแยกตามรายการสินค้า (Product Summary):</span>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
                                        {Object.keys(stats.productBreakdown).map(pName => {
                                            const pInfo = stats.productBreakdown[pName];
                                            return (
                                                <div key={pName} className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                                                    <div>
                                                        <span className="text-xs font-black text-slate-800 block truncate">{pName}</span>
                                                        <span className="text-[9px] text-slate-400 font-bold block">หมวด: {pInfo.category}</span>
                                                    </div>
                                                    <div className="mt-3 pt-2 border-t border-slate-100 flex justify-between items-end">
                                                        <span className="text-[10px] font-bold text-slate-500">{formatMoneyDisplay(pInfo.amountLAK)}</span>
                                                        <span className="text-xs font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded-md">{pInfo.boxes} กล่อง</span>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                    {/* Footer */}
                    <div className="bg-slate-100 p-4 border-t border-slate-200 text-right shrink-0">
                        <button 
                            type="button" 
                            onClick={onClose}
                            className="px-6 py-2.5 bg-slate-300 hover:bg-slate-400 text-slate-800 font-black text-xs rounded-2xl transition-all shadow-sm"
                        >
                            ปิดหน้าต่าง
                        </button>
                    </div>

                </div>
            </div>
        );
    };

    // ==========================================
    // 📌 Organization Chart View Component
    // ==========================================
    const OrgChartView = ({ members, sales, showToast, currentUser, isAdmin, businessTeams, products, productCategories, systemSettings }) => {
        const [viewMode, setViewMode] = useState('tree'); // tree or list
        const [searchQuery, setSearchQuery] = useState('');
        const [expandedNodes, setExpandedNodes] = useState({});
        const [selectedMember, setSelectedMember] = useState(null);
        const [zoom, setZoom] = useState(1.0);
        const [isDragging, setIsDragging] = useState(false);
        const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
        const [scrollStart, setScrollStart] = useState({ left: 0, top: 0 });
        const [displaySize, setDisplaySize] = useState('full'); // compact or full

        // 🟢 Detail Modal States
        const [showDetailModal, setShowDetailModal] = useState(false);
        const [detailModalMember, setDetailModalMember] = useState(null);
        const [detailDateStart, setDetailDateStart] = useState('');
        const [detailDateEnd, setDetailDateEnd] = useState('');

        const canvasRef = useRef(null);

        // Map team name
        const teamMap = useMemo(() => {
            const map = {};
            (businessTeams || []).forEach(t => {
                if (t && t.id) map[String(t.id).trim().toUpperCase()] = t.name;
            });
            return map;
        }, [businessTeams]);

        const formatDateSimple = (dateStr) => {
            if (!dateStr) return '-';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr;
                return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
            } catch(e) {
                return dateStr;
            }
        };

        const getDownlinesWithLevels = useCallback((memberId, currentDepth = 1, visited = new Set()) => {
            if (visited.has(memberId)) return [];
            visited.add(memberId);
            
            let result = [];
            const children = (members || []).filter(m => 
                String(m.referrer || '').trim().toUpperCase() === String(memberId).trim().toUpperCase() &&
                String(m.id).trim().toUpperCase() !== String(memberId).trim().toUpperCase()
            );
            
            children.forEach(c => {
                result.push({ member: c, level: currentDepth });
                result = result.concat(getDownlinesWithLevels(c.id, currentDepth + 1, visited));
            });
            return result;
        }, [members]);

        const roots = useMemo(() => {
            if (!isAdmin && currentUser && currentUser.id) {
                const userMember = (members || []).find(m => String(m.id).trim().toUpperCase() === String(currentUser.id).trim().toUpperCase());
                if (userMember) return [userMember];
            }
            const memberIds = new Set((members || []).map(m => String(m.id).trim().toUpperCase()));
            return (members || []).filter(m => {
                const referrer = String(m.referrer || '').trim().toUpperCase();
                return !referrer || !memberIds.has(referrer) || referrer === String(m.id).trim().toUpperCase();
            });
        }, [members, currentUser, isAdmin]);

        const memberSales = useMemo(() => {
            const salesMap = {};
            (members || []).forEach(m => { salesMap[m.id] = { personal: 0, group: 0 }; });

            (sales || []).forEach(s => {
                const sellerId = String(s.memberId || '').trim();
                if (salesMap[sellerId]) {
                    const qty = parseInt(s['ยอดรวมชิ้นทั้งหมด'] || s['รวมชิ้นราคาเต็ม'] || s['ชิ้น'] || 0, 10);
                    salesMap[sellerId].personal += qty;
                }
            });

            const memoGroup = {};
            const getGroupSales = (memberId) => {
                if (memoGroup[memberId] !== undefined) return memoGroup[memberId];
                const pSales = salesMap[memberId]?.personal || 0;
                let gSales = 0;
                const children = (members || []).filter(m => 
                    String(m.referrer || '').trim().toUpperCase() === String(memberId).trim().toUpperCase() &&
                    String(m.id).trim().toUpperCase() !== String(memberId).trim().toUpperCase()
                );
                children.forEach(c => { gSales += getGroupSales(c.id); });
                const total = pSales + gSales;
                if (salesMap[memberId]) salesMap[memberId].group = total;
                memoGroup[memberId] = total;
                return total;
            };

            (members || []).forEach(m => { getGroupSales(m.id); });
            return salesMap;
        }, [members, sales]);

        useEffect(() => {
            if (roots.length > 0 && !selectedMember) {
                const root = roots[0];
                const referrerInfo = (members || []).find(m => m.id === root.referrer);
                const childrenCount = (members || []).filter(m => m.referrer === root.id).length;
                setSelectedMember({ ...root, referrerName: referrerInfo?.name || 'บริษัทรับตรง', childrenCount });
            }
        }, [roots, selectedMember, members]);

        // 🟢 คำนวณข้อมูลกราฟ 7 วันล่าสุดสำหรับพนักงานที่ถูกเลือก
                // 🟢 คำนวณคะแนน PV เรียลไทม์สดจากบิลยอดขายจริง (100% Dynamic & Accurate)
        const currentSalesPv = useMemo(() => {
            if (!selectedMember) return 0;
            const mId = String(selectedMember.id || '').trim().toUpperCase();
            let pv = 0;
            (sales || []).forEach(s => {
                const seller = String(s.sellerId || s.sellerName || s.seller || s.memberId || '').trim().toUpperCase();
                if (seller === mId) {
                    (products || []).forEach(p => {
                        const pName = p.name;
                        const fullQty = Number(s[`${pName}_ราคาเต็ม`] || 0);
                        const memQty = Number(s[`${pName}_ราคาสมาชิก`] || 0);
                        const givePv = Number(p.givePv || 0);
                        const pvRate = givePv > 0 ? givePv : 1;
                        pv += ((fullQty + memQty) * pvRate);
                    });
                }
            });
            return Math.max(pv, Number(selectedMember.accumulatedPV || 0));
        }, [selectedMember, sales, products]);

        const performanceChartData = useMemo(() => {
            if (!selectedMember) return [];
            const targetId = String(selectedMember.id).trim().toUpperCase();
            
            // หายอดขาย 7 วันล่าสุด
            const salesByDate = {};
            const last7Dates = [...Array(7)].map((_, i) => {
                const d = new Date();
                d.setDate(d.getDate() - (6 - i));
                return d.toISOString().split('T')[0];
            });

            last7Dates.forEach(d => salesByDate[d] = 0);

            (sales || []).forEach(s => {
                const sMemId = String(s.memberId || '').trim().toUpperCase();
                const sDate = s.date ? String(s.date).split('T')[0] : '';
                if (sMemId === targetId && salesByDate[sDate] !== undefined) {
                    const qty = parseInt(s['ยอดรวมชิ้นทั้งหมด'] || 0, 10);
                    salesByDate[sDate] += qty;
                }
            });

            return last7Dates.map(date => ({
                date: date.substring(5).replace('-', '/'),
                value: salesByDate[date]
            }));
        }, [selectedMember, sales]);

        const toggleExpand = useCallback((nodeId) => {
            setExpandedNodes(prev => ({ ...prev, [nodeId]: !prev[nodeId] }));
        }, []);

        const handleSelectMember = (member) => {
            const referrerInfo = (members || []).find(m => m.id === member.referrer);
            const childrenCount = (members || []).filter(m => m.referrer === member.id).length;
            setSelectedMember({ ...member, referrerName: referrerInfo?.name || 'บริษัทรับตรง', childrenCount });
        };

        const handleOpenMemberDetail = (member) => {
            const target = member || selectedMember;
            if (!target) return;
            const referrerInfo = (members || []).find(m => m.id === target.referrer);
            const childrenCount = (members || []).filter(m => m.referrer === target.id).length;
            setDetailModalMember({ ...target, referrerName: referrerInfo?.name || 'บริษัทรับตรง', childrenCount });
            setShowDetailModal(true);
        };

        const handleSearch = (e) => {
            const val = e.target.value;
            setSearchQuery(val);
            if (val.trim() !== '') {
                const matches = (members || []).filter(m => 
                    m.name.toLowerCase().includes(val.toLowerCase()) || 
                    m.id.toLowerCase().includes(val.toLowerCase())
                );
                
                const toExpand = {};
                matches.forEach(m => {
                    let parentId = m.referrer;
                    while (parentId) {
                        toExpand[parentId] = true;
                        const parent = (members || []).find(p => p.id === parentId);
                        parentId = parent ? parent.referrer : null;
                    }
                });

                setExpandedNodes(prev => ({ ...prev, ...toExpand }));
            }
        };

        const handleExpandAll = () => {
            const allExpanded = {};
            (members || []).forEach(m => { allExpanded[m.id] = true; });
            setExpandedNodes(allExpanded);
            showToast('ขยายผังองค์กรทั้งหมดแล้ว', 'success');
        };

        const handleCollapseAll = () => {
            setExpandedNodes({});
            showToast('ย่อผังองค์กรทั้งหมดแล้ว', 'info');
        };

        // Drag handlers
        const handleMouseDown = (e) => {
            if (viewMode !== 'tree') return;
            setIsDragging(true);
            setDragStart({ x: e.clientX, y: e.clientY });
            setScrollStart({ left: canvasRef.current.scrollLeft, top: canvasRef.current.scrollTop });
        };

        const handleMouseMove = (e) => {
            if (!isDragging || viewMode !== 'tree') return;
            const dx = e.clientX - dragStart.x;
            const dy = e.clientY - dragStart.y;
            canvasRef.current.scrollLeft = scrollStart.left - dx;
            canvasRef.current.scrollTop = scrollStart.top - dy;
        };

        const handleMouseUpOrLeave = () => { setIsDragging(false); };

        const currentSalesData = selectedMember ? memberSales[selectedMember.id] : { personal: 0, group: 0 };
        const maxChartValue = Math.max(...performanceChartData.map(d => d.value), 5); // ฐานขั้นต่ำที่ 5

        return (
            <div className="space-y-4 animation-fade-in pb-8">
                
                {/* Header */}
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                    <div>
                        <h2 className="text-xl sm:text-2xl font-black text-slate-800 flex items-center gap-2">
                            <GitBranch size={24} className="text-blue-600" /> ผังองค์กร (Org Chart)
                        </h2>
                        <p className="text-slate-500 text-[11px] sm:text-xs mt-1 font-medium">ดูโครงสร้างสายงาน และติดตามผลงาน (Performance) รายบุคคล</p>
                    </div>
                    
                    <div className="flex flex-wrap gap-2 items-center w-full sm:w-auto">
                        <div className="relative flex-1 sm:w-64">
                            <span className="absolute inset-y-0 left-3 flex items-center text-slate-400"><SearchIcon size={16} /></span>
                            <input 
                                type="text" 
                                className="w-full bg-slate-50 border border-slate-200 focus:border-blue-500 focus:bg-white rounded-xl pl-9 pr-3 py-2 text-xs font-bold text-slate-700 outline-none transition-all shadow-inner" 
                                placeholder="ค้นหาชื่อหรือรหัส..." 
                                value={searchQuery} 
                                onChange={handleSearch} 
                            />
                        </div>
                        <div className="bg-slate-100 p-1 rounded-xl flex gap-1 border border-slate-200 shrink-0">
                            <button onClick={() => setViewMode('tree')} className={`px-3 py-1.5 rounded-lg text-[10px] font-black transition-all ${viewMode === 'tree' ? 'bg-white text-blue-700 shadow-sm border border-slate-200' : 'text-slate-500 hover:text-slate-800'}`}>
                                🌳 ผังต้นไม้
                            </button>
                            <button onClick={() => setViewMode('list')} className={`px-3 py-1.5 rounded-lg text-[10px] font-black transition-all ${viewMode === 'list' ? 'bg-white text-blue-700 shadow-sm border border-slate-200' : 'text-slate-500 hover:text-slate-800'}`}>
                                📋 รายการ
                            </button>
                        </div>
                    </div>
                </div>

                {/* 🟢 Main Layout: ซ้าย (Dashboard) 1 ส่วน | ขวา (Org Tree) 2 ส่วน */}
                <div className="flex flex-col lg:flex-row gap-5 items-stretch h-[calc(100vh-140px)]">
                    
                    {/* 📌 Left Column: Performance Dashboard (Fixed Width) */}
                    <div className="w-full lg:w-[320px] flex flex-col gap-4 shrink-0 overflow-y-auto hide-scroll pb-6">
                        
                        {/* 1. Profile Summary Card */}
                        <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center text-center relative overflow-hidden">
                            <div className="absolute top-0 inset-x-0 h-16 bg-gradient-to-r from-blue-500 to-indigo-600"></div>
                            
                            {selectedMember ? (
                                <React.Fragment>
                                    <div className="relative mt-4 mb-2">
                                        <div className="w-20 h-20 rounded-full overflow-hidden border-4 border-white shadow-md bg-slate-100">
                                            <img 
                                                src={selectedMember.profileUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(selectedMember.name || "")}&background=eff6ff&color=1d4ed8&rounded=true&bold=true`} 
                                                className="w-full h-full object-cover" 
                                                onError={(e) => { e.target.onerror = null; e.target.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(selectedMember.name || "")}&background=eff6ff&color=1d4ed8&rounded=true&bold=true`; }}
                                            />
                                        </div>
                                        <span className={`absolute bottom-0 right-0 w-4 h-4 rounded-full border-2 border-white ${selectedMember.status === 'ทำงานอยู่' || selectedMember.status === 'ใช้งาน' ? 'bg-emerald-500' : 'bg-red-500'}`}></span>
                                    </div>
                                    <span className="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-0.5 rounded uppercase tracking-wider">{selectedMember.id}</span>
                                    <h3 className="text-[15px] font-black text-slate-800 mt-1 line-clamp-1">{selectedMember.name}</h3>
                                    <p className="text-[10px] text-slate-500 font-bold mt-0.5">ทีม: {teamMap[String(selectedMember.team || "").trim().toUpperCase()] || selectedMember.team || "ทั่วไป"}</p>
                                    
                                    <div className="w-full grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-slate-100 text-left">
                                        <div>
                                            <span className="text-[9px] text-slate-400 font-bold uppercase">ผู้แนะนำ</span>
                                            <div className="text-[10px] font-black text-slate-700 truncate" title={selectedMember.referrerName}>{selectedMember.referrerName}</div>
                                        </div>
                                        <div>
                                            <span className="text-[9px] text-slate-400 font-bold uppercase">เริ่มงาน</span>
                                            <div className="text-[10px] font-black text-slate-700">{formatDateSimple(selectedMember.startDate)}</div>
                                        </div>
                                    </div>
                                    <button 
                                        type="button"
                                        onClick={() => handleOpenMemberDetail(selectedMember)}
                                        className="w-full mt-3 py-2 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-black text-xs rounded-xl shadow-md transition-all flex items-center justify-center gap-1.5"
                                    >
                                        🔍 ดูรายละเอียดเจาะลึกปันผล & ยอดขาย
                                    </button>
                                </React.Fragment>
                            ) : (
                                <div className="py-12 flex flex-col items-center justify-center text-slate-400 gap-2">
                                    <UserCircle size={48} className="opacity-50" />
                                    <span className="text-xs font-bold">กรุณาเลือกสมาชิกในผังองค์กร</span>
                                </div>
                            )}
                        </div>

                        {/* 2. KPI Cards (Grid 2x2) */}
                        <div className="grid grid-cols-2 gap-3">
                            <div className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col">
                                <span className="text-[10px] font-bold text-slate-400 flex items-center gap-1"><ShoppingCart size={12}/> ยอดส่วนตัว</span>
                                <span className="text-xl font-black text-blue-600 mt-1">{currentSalesData.personal.toLocaleString()} <span className="text-[9px] text-blue-400">ชิ้น</span></span>
                            </div>
                            <div className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col">
                                <span className="text-[10px] font-bold text-slate-400 flex items-center gap-1"><Users size={12}/> ยอดรวมทีม</span>
                                <span className="text-xl font-black text-indigo-600 mt-1">{currentSalesData.group.toLocaleString()} <span className="text-[9px] text-indigo-400">ชิ้น</span></span>
                            </div>
                            <div className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col">
                                <span className="text-[10px] font-bold text-slate-400 flex items-center gap-1"><GitBranch size={12}/> ลูกทีม (ติดตัว)</span>
                                <span className="text-xl font-black text-emerald-600 mt-1">{selectedMember?.childrenCount || 0} <span className="text-[9px] text-emerald-400">คน</span></span>
                            </div>
                            <div className="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-col">
                                <span className="text-[10px] font-bold text-slate-400 flex items-center gap-1"><AwardIcon size={12}/> คะแนน PV</span>
                                <span className="text-xl font-black text-amber-500 mt-1">{currentSalesPv.toLocaleString()} <span className="text-[9px] text-amber-400">PV</span></span>
                            </div>
                        </div>

                        {/* 3. Performance Bar Chart (7 Days Trend) */}
                        <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex-1 flex flex-col min-h-[200px]">
                            <div className="flex justify-between items-center border-b border-slate-100 pb-2 mb-3">
                                <h4 className="text-[11px] font-black text-slate-700 flex items-center gap-1.5"><TrendingUpIcon size={14} className="text-blue-500"/> กราฟติดตามผลงาน</h4>
                                <span className="text-[9px] font-bold text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">7 วันล่าสุด</span>
                            </div>
                            
                            {selectedMember ? (
                                <div className="flex items-end justify-between flex-1 gap-2 pt-2">
                                    {performanceChartData.map((d, i) => {
                                        const heightPct = Math.max((d.value / maxChartValue) * 100, 4); // ต่ำสุดโชว์ 4% ให้เห็นแท่ง
                                        const isToday = i === performanceChartData.length - 1;
                                        return (
                                            <div key={i} className="flex flex-col items-center flex-1 gap-1.5 h-full justify-end group">
                                                <div className="text-[9px] font-black text-slate-500 opacity-0 group-hover:opacity-100 transition-opacity">{d.value > 0 ? d.value : ''}</div>
                                                <div className="w-full bg-slate-100 rounded-t-md relative flex items-end justify-center" style={{ height: '120px' }}>
                                                    <div 
                                                        className={`w-full rounded-t-md transition-all duration-500 ${isToday ? 'bg-gradient-to-t from-indigo-500 to-blue-400 shadow-[0_-2px_10px_rgba(59,130,246,0.3)]' : 'bg-gradient-to-t from-blue-300 to-blue-200 group-hover:from-blue-400 group-hover:to-blue-300'}`} 
                                                        style={{ height: `${heightPct}%` }}
                                                    ></div>
                                                </div>
                                                <div className={`text-[8px] font-bold ${isToday ? 'text-blue-600' : 'text-slate-400'}`}>{d.date}</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            ) : (
                                <div className="flex-1 flex flex-col items-center justify-center text-slate-300 gap-2">
                                    <BarChart3 size={32} className="stroke-1" />
                                    <span className="text-[10px] font-bold">เลือกสมาชิกเพื่อดูกราฟ</span>
                                </div>
                            )}
                        </div>

                    </div>

                    {/* 📌 Right Column: The Org Tree (w-auto/flex-1) */}
                    <div className="flex-1 bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden flex flex-col relative h-full">
                        
                        {/* 🟢 Tools overlay for Tree mode */}
                        {viewMode === 'tree' && (
                            <div className="absolute right-4 top-4 flex gap-1 bg-white/90 backdrop-blur border border-slate-200 rounded-xl shadow-sm p-1 z-20">
                                <button onClick={() => setZoom(prev => Math.max(prev - 0.1, 0.4))} className="w-7 h-7 rounded-lg flex items-center justify-center text-slate-600 hover:bg-slate-100 font-black text-sm" title="ย่อ">-</button>
                                <div className="w-10 flex items-center justify-center text-[10px] font-black text-blue-600 font-mono select-none">{Math.round(zoom * 100)}%</div>
                                <button onClick={() => setZoom(prev => Math.min(prev + 0.1, 1.5))} className="w-7 h-7 rounded-lg flex items-center justify-center text-slate-600 hover:bg-slate-100 font-black text-sm" title="ขยาย">+</button>
                            </div>
                        )}
                        
                        {viewMode === 'tree' && (
                            <div className="absolute left-4 top-4 bg-white/90 backdrop-blur border border-slate-200 rounded-xl shadow-sm p-1 z-20 flex gap-1">
                                <button onClick={handleExpandAll} className="px-2 py-1 rounded-lg text-[9px] font-bold text-slate-600 hover:bg-slate-100">ขยายทั้งหมด</button>
                                <button onClick={handleCollapseAll} className="px-2 py-1 rounded-lg text-[9px] font-bold text-slate-600 hover:bg-slate-100">ย่อทั้งหมด</button>
                            </div>
                        )}

                        {/* The Canvas Area */}
                        {viewMode === 'tree' ? (
                            <div 
                                ref={canvasRef}
                                onMouseDown={handleMouseDown}
                                onMouseMove={handleMouseMove}
                                onMouseUp={handleMouseUpOrLeave}
                                onMouseLeave={handleMouseUpOrLeave}
                                className={`tree-scroll-container flex-1 overflow-auto hide-scroll select-none`}
                            >
                                <div className="inline-block origin-top-left transition-transform duration-100 ease-out min-w-full" style={{ transform: `scale(${zoom})` }}>
                                    <div className="flex flex-row justify-center items-start gap-12 min-w-max mx-auto px-10">
                                        {roots.map(rootNode => (
                                            <TreeNode 
                                                key={rootNode.id} 
                                                node={rootNode} 
                                                allMembers={members} 
                                                onSelect={handleSelectMember}
                                                onOpenDetail={handleOpenMemberDetail}
                                                expandedNodes={expandedNodes}
                                                toggleExpand={toggleExpand}
                                                searchQuery={searchQuery}
                                                memberSales={memberSales}
                                                displaySize={displaySize}
                                                selectedId={selectedMember?.id}
                                                teamMap={teamMap}
                                            />
                                        ))}
                                    </div>
                                    {roots.length === 0 && (
                                        <div className="p-12 text-center text-slate-400 font-bold text-sm">ไม่มีข้อมูลผังองค์กร</div>
                                    )}
                                </div>
                            </div>
                        ) : (
                            <div className="flex-1 overflow-auto hide-scroll p-4">
                                <div className="max-w-3xl mx-auto space-y-2">
                                    {roots.map(rootNode => (
                                        <DirectoryNode
                                            key={rootNode.id}
                                            node={rootNode}
                                            allMembers={members}
                                            onSelect={handleSelectMember}
                                            onOpenDetail={handleOpenMemberDetail}
                                            expandedNodes={expandedNodes}
                                            toggleExpand={toggleExpand}
                                            searchQuery={searchQuery}
                                            memberSales={memberSales}
                                            selectedId={selectedMember?.id}
                                            teamMap={teamMap}
                                        />
                                    ))}
                                    {roots.length === 0 && (
                                        <div className="p-12 text-center text-slate-400 font-bold text-sm">ไม่มีข้อมูลผังองค์กร</div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                </div>

                {/* 🟢 Render Member Performance & Dividend Detail Modal */}
                <MemberPerformanceDetailModal 
                    isOpen={showDetailModal}
                    onClose={() => setShowDetailModal(false)}
                    member={detailModalMember}
                    sales={sales}
                    members={members}
                    products={products}
                    productCategories={productCategories}
                    systemSettings={systemSettings}
                    dateStart={detailDateStart}
                    setDateStart={setDetailDateStart}
                    dateEnd={detailDateEnd}
                    setDateEnd={setDetailDateEnd}
                    teamMap={teamMap}
                    currentUser={currentUser}
                    isAdmin={isAdmin}
                />
            </div>
        );
    };

    // ==========================================
    // 📌 React App (Main Component)
    // ==========================================
    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      
      const [products, setProducts] = useState([]);
      const [productCategories, setProductCategories] = useState([]);
      const [systemSettings, setSystemSettings] = useState({ commission_levels: 6 });
      const [customerTypes, setCustomerTypes] = useState(fallbackCustomerTypes);
      const [closers, setClosers] = useState([]);
      const [members, setMembers] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [sales, setSales] = useState([]);
      const [systemUsers, setSystemUsers] = useState([]);
      const [businessTeams, setBusinessTeams] = useState([]);
      const [isAppLoading, setIsAppLoading] = useState(true);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch (e) { return false; }
      });

      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const showToast = (message, type = 'success') => { setToast({ show: true, message, type }); };

      const SCRIPT_URL = (() => {
  try {
    if (window.top && window.top.location && window.top.location.href) {
      const base = window.top.location.href.split('?')[0];
      if (base && base.startsWith('http')) return base;
    }
  } catch(e) {}
  return "<?= getScriptUrl() ?>";
})();

      const isAdmin = currentUser && (
          String(currentUser.role).trim() === 'ผู้ดูแลระบบ' ||
          String(currentUser.role).trim().toLowerCase() === 'admin'
      );
      const currentUserProfileUrl = currentUser?.profileUrl || '';

      useEffect(() => {
        const savedUserStr = localStorage.getItem('stk_current_user');
        if (savedUserStr) {
          try {
            const user = JSON.parse(savedUserStr);
            setCurrentUser(user);
            setIsLoggedIn(true);
          } catch (e) { localStorage.removeItem('stk_current_user'); }
        } else {
          setShowLoginModal(true);
        }

        const initialLoader = document.getElementById('initial-loader');
        if (initialLoader) initialLoader.style.display = 'none';

        if (typeof google !== 'undefined' && google.script) {
           try {
               const cachedData = localStorage.getItem('stk_app_cache_data');
               if (cachedData) {
                   applyDataToStates(JSON.parse(cachedData));
                   setIsAppLoading(false);
               }
           } catch (e) { console.warn("Cache error", e); }

           google.script.run
             .withSuccessHandler((response) => {
                if (response) {
                    try { localStorage.setItem('stk_app_cache_data', JSON.stringify(response)); } catch (e) {}
                    applyDataToStates(response);
                }
                setIsAppLoading(false);
             })
             .withFailureHandler((error) => {
                setIsAppLoading(false);
                showToast('การเชื่อมต่อเซิร์ฟเวอร์ขัดข้อง: ' + (error ? (error.message || error) : ''), 'error');
             })
             .getInitialData();
        } else {
           setMembers([
               { id: 'M001', name: 'คุณศักดา (Founder)', referrer: '', team: 'Marketing', startDate: '2026-01-01', status: 'ใช้งาน' },
               { id: 'M002', name: 'คุณสมชาย', referrer: 'M001', team: 'Marketing', startDate: '2026-02-10', status: 'ใช้งาน' },
               { id: 'M003', name: 'คุณวันดี', referrer: 'M001', team: 'Center', startDate: '2026-03-01', status: 'ใช้งาน' },
               { id: 'M004', name: 'คุณสายชล', referrer: 'M002', team: 'Marketing', startDate: '2026-04-12', status: 'ใช้งาน' },
               { id: 'M005', name: 'คุณมานี', referrer: 'M002', team: 'Marketing', startDate: '2026-04-15', status: 'ใช้งาน' }
           ]);
           setIsAppLoading(false);
        }
      }, []);

      const applyDataToStates = (response) => {
           if (Array.isArray(response.products)) setProducts(response.products);
           if (Array.isArray(response.productCategories)) setProductCategories(response.productCategories);
           if (response.systemSettings) setSystemSettings(response.systemSettings);
           if (Array.isArray(response.customerTypes)) setCustomerTypes(response.customerTypes);
           if (Array.isArray(response.closers)) setClosers(response.closers);
           if (Array.isArray(response.members)) setMembers(response.members);
           if (Array.isArray(response.customers)) setCustomers(response.customers);
           if (Array.isArray(response.systemUsers)) setSystemUsers(response.systemUsers);
           if (Array.isArray(response.businessTeams)) setBusinessTeams(response.businessTeams);
           if (Array.isArray(response.sales)) {
               const processedSales = response.sales.map(s => {
                   let sumF = 0, sumP = 0, sumZ = 0;
                   Object.keys(s).forEach(k => {
                       if (k !== 'รวมชิ้นราคาเต็ม' && k !== 'รวมชิ้นราคาโปร' && k !== 'รวมชิ้นราคาศูนย์' && k !== 'ยอดรวมชิ้นทั้งหมด') {
                           if (k.endsWith('_ราคาเต็ม')) sumF += (parseInt(s[k]) || 0);
                           else if (k.endsWith('_ราคาโปร')) sumP += (parseInt(s[k]) || 0);
                           else if (k.endsWith('_ราคาศูนย์')) sumZ += (parseInt(s[k]) || 0);
                       }
                   });
                   s['รวมชิ้นราคาเต็ม'] = sumF; s['รวมชิ้นราคาโปร'] = sumP; s['รวมชิ้นราคาศูนย์'] = sumZ;
                   s['ยอดรวมชิ้นทั้งหมด'] = sumF + sumP + sumZ;
                   return s;
               });
               setSales(processedSales);
           }
      };

      const handleLoginSuccess = (user) => {
        localStorage.setItem('stk_current_user', JSON.stringify(user));
        setCurrentUser(user);
        setIsLoggedIn(true);
        setShowLoginModal(false);
        showToast('เข้าสู่ระบบสำเร็จ!', 'success');
      };

      const handleLogout = () => {
        localStorage.removeItem('stk_current_user');
        setCurrentUser(null);
        setIsLoggedIn(false);
        if (typeof window !== 'undefined') window.open(resolvePageUrl(SCRIPT_URL + '?page=dashboard'), '_top');
      };

      return (
        <div className="min-h-screen flex font-sans bg-slate-50">
          <Sidebar
            activePage="org_chart"
            isLoggedIn={isLoggedIn}
            currentUser={currentUser}
            currentUserProfileUrl={currentUserProfileUrl}
            isAdmin={isAdmin}
            onLogout={handleLogout}
            showLoginModal={showLoginModal}
            setShowLoginModal={setShowLoginModal}
            SCRIPT_URL={SCRIPT_URL}
            setIsAppLoading={setIsAppLoading}
            isSidebarCollapsed={isSidebarCollapsed}
            setIsSidebarCollapsed={setIsSidebarCollapsed}
          />

          <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>

            {toast.show && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4 animation-fade-in" style={{ animationDuration: '0.2s' }}>
                 <div className={`bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center animation-pop border-t-4 ${toast.type === 'error' ? 'border-red-500' : toast.type === 'info' ? 'border-blue-500' : 'border-emerald-500'}`}>
                    <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${toast.type === 'error' ? 'bg-red-100 text-red-500' : toast.type === 'info' ? 'bg-blue-100 text-blue-500' : 'bg-emerald-100 text-emerald-500'}`}>
                       {toast.type === 'error' ? <X size={32} /> : toast.type === 'info' ? <Trophy size={32} /> : <CheckCircle size={32} />}
                    </div>
                    <h3 className="text-xl font-bold text-slate-800 mb-2">{toast.type === 'error' ? 'เกิดข้อผิดพลาด' : toast.type === 'info' ? 'แจ้งเตือน' : 'สำเร็จ!'}</h3>
                    <p className="text-slate-600 font-medium text-sm mb-6">{toast.message}</p>
                    <button onClick={() => setToast({ ...toast, show: false })} className="w-full py-2.5 rounded-lg font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">ตกลง</button>
                 </div>
              </div>
            )}

            <div className="p-3 sm:p-6 flex-1 w-full relative z-0 h-screen overflow-hidden flex flex-col">
              <div className="w-full h-full flex flex-col relative z-10">
                {isAppLoading ? (
                  <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in h-full">
                    <div className="w-16 h-16 border-[4px] border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                    <h2 className="text-lg font-bold text-slate-700">กำลังซิงค์ข้อมูลกับฐานข้อมูล...</h2>
                    <p className="text-slate-500 text-sm">กรุณารอสักครู่ ระบบกำลังดึงข้อมูลล่าสุด</p>
                  </div>
                ) : isLoggedIn ? (
                  <OrgChartView 
                    members={members} 
                    sales={sales}
                    showToast={showToast}
                    currentUser={currentUser}
                    isAdmin={isAdmin}
                    businessTeams={businessTeams}
                    products={products}
                    productCategories={productCategories}
                    systemSettings={systemSettings}
                  />
                ) : (
                  <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in h-full">
                    <h2 className="text-xl font-black text-red-500">กรุณาเข้าสู่ระบบก่อนใช้งาน</h2>
                    <button onClick={() => setShowLoginModal(true)} className={btnClassPrimary}>เข้าสู่ระบบ</button>
                  </div>
                )}
              </div>
            </div>

          </main>

          <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={systemUsers} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
