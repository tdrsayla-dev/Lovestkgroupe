<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ผู้ปิดการขาย (Closers) - LOVE STK GROUPE</title>
  <!-- Standalone & GAS Libraries -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Sans+Lao:wght@400;500;600;700&display=swap');
    body { font-family: 'Sukhumvit Set', 'Noto Sans Thai', 'Sarabun', 'Noto Sans Lao', sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; padding: 0; width: 100%; max-width: 100vw; overflow-x: hidden; }
    @media (min-width: 1024px) {
      aside.lg\:flex { display: flex !important; position: fixed !important; top: 0; left: 0; height: 100vh; z-index: 30; }

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.SUPABASE_URL='https://mfpkeyrykqnrywyksyqp.supabase.co';window.SUPABASE_ANON_KEY='sb_publishable_807NIkuj6MAs1KZY-m4tug_Fm1Mk-AO';window.SUPABASE_REST_URL=window.SUPABASE_URL+'/rest/v1';window.SUPABASE_HEADERS={'Content-Type':'application/json','apikey':window.SUPABASE_ANON_KEY,'Authorization':'Bearer '+window.SUPABASE_ANON_KEY,'Prefer':'return=representation'};
    if(typeof supabase!=='undefined'){window.supabaseClient=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);console.log('%c✅ Supabase Connected!','color:green;font-weight:bold',window.SUPABASE_URL);}
    async function supabaseSelect(t,q){var r=await fetch(window.SUPABASE_REST_URL+'/'+t+(q?'?'+q:''),{method:'GET',headers:window.SUPABASE_HEADERS});if(!r.ok)throw new Error('SELECT '+t+':'+r.status);return r.json();}
    async function supabaseInsert(t,d){var r=await fetch(window.SUPABASE_REST_URL+'/'+t,{method:'POST',headers:window.SUPABASE_HEADERS,body:JSON.stringify(d)});if(!r.ok)throw new Error('INSERT '+t+':'+r.status);return r.json();}
    async function supabaseUpdate(t,id,d,pk='id'){var r=await fetch(window.SUPABASE_REST_URL+'/'+t+'?'+pk+'=eq.'+encodeURIComponent(id),{method:'PATCH',headers:window.SUPABASE_HEADERS,body:JSON.stringify(d)});if(!r.ok)throw new Error('UPDATE '+t+':'+r.status);return r.json();}
    async function supabaseDelete(t,id,pk='id'){var r=await fetch(window.SUPABASE_REST_URL+'/'+t+'?'+pk+'=eq.'+encodeURIComponent(id),{method:'DELETE',headers:Object.assign({},window.SUPABASE_HEADERS,{'Prefer':'return=minimal'})});if(!r.ok)throw new Error('DELETE '+t+':'+r.status);return true;}
  </script>
  <script src="CommonComponents.js"></script>

<body class="antialiased overflow-x-hidden selection:bg-blue-600 selection:text-white">

  <div id="initial-loader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999;">
    <div style="width: 60px; height: 60px; border: 4px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: initial-spin 1s linear infinite; margin-bottom: 24px;"></div>
    <style>@keyframes initial-spin { to { transform: rotate(360deg); } }</style>
    <h2 style="font-size: 1.75rem; font-weight: 800; color: #1e40af; margin: 0; letter-spacing: -0.025em;">LOVE <span style="color: #475569;">STK GROUPE</span></h2>
    <p style="font-size: 0.875rem; color: #64748b; font-weight: 500; margin-top: 8px;">กำลังโหลดข้อมูลผู้ปิดการขาย...</p>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;
    // 🛡️ GLOBAL ICONS DESTRUCTURING
    const { LayoutDashboard, ShoppingCart, Users, Contact, Headset, BarChart3, Plus, Edit, Trash2, UserCircle, Menu, X, Save, Info, PackageIcon, Package, Target, Trophy, Activity, Eye, Tags, CheckCircle, GitBranch, Archive, ChevronDown, FileText, SettingsIcon, Coins, ShieldCheck, AlertTriangle, AlertCircle, LoginModal, Toast, Sidebar, Header, ConfirmModal, EditModal, DonutChart, AutoSuggestInput, SearchIcon } = window;
    
    const ClosersManagementView = ({ closers, setClosers, businessTeams, isAdmin, showToast }) => {
        const [showForm, setShowForm] = useState(false);
        const [isEditing, setIsEditing] = useState(false);
        const [isSubmitting, setIsSubmitting] = useState(false);
        const [searchTerm, setSearchTerm] = useState(''); 
        const [confirmDelete, setConfirmDelete] = useState({ show: false, id: null, title: '' });
        
        const initialFormState = { id: '', name: '', team: 'Center', status: 'ใช้งาน' };
        const [formData, setFormData] = useState(initialFormState);

        const handleOpenAdd = () => {
          setIsEditing(false); let nextIdNum = 1;
          const pIds = (closers || []).map(p => { const match = p && p.id && p.id.match(/^C(\d+)$/i); return match ? parseInt(match[1], 10) : 0; });
          if (pIds.length > 0) nextIdNum = Math.max(0, ...pIds) + 1;
          setFormData({ ...initialFormState, id: "C" + nextIdNum.toString().padStart(3, '0') });
          setShowForm(true);
        };
        const handleOpenEdit = (closer) => { setIsEditing(true); setFormData({ team: 'Center', ...closer }); setShowForm(true); };

        const handleSave = async (e) => {
           e.preventDefault(); 
           if (!formData.id || !formData.name) return; 
           setIsSubmitting(true);
           
           const newRecord = { id: formData.id, name: formData.name, team: formData.team || 'Center', status: formData.status || 'ใช้งาน' };

           let savedSuccess = false;
           if (window.supabaseClient) {
               try {
                   const { error } = await window.supabaseClient
                       .from('stk_closers')
                       .upsert({ id: formData.id, name: formData.name, team: formData.team || 'Center', status: formData.status }, { onConflict: 'id' });
                   if (!error) savedSuccess = true;
               } catch(err) { console.warn("Supabase SDK upsert error:", err); }
           }

           if (!savedSuccess && window.SUPABASE_REST_URL) {
               try {
                   const supaDataPrimary = { id: formData.id, name: formData.name, team: formData.team || 'Center', status: formData.status };
                   if (isEditing) {
                       await supabaseUpdate('stk_closers', formData.id, supaDataPrimary, 'id').catch(() => supabaseUpdate('stk_closers', formData.id, { id: formData.id, name: formData.name, team: formData.team, status: formData.status }, 'id'));
                   } else {
                       await supabaseInsert('stk_closers', supaDataPrimary).catch(() => supabaseInsert('stk_closers', { id: formData.id, name: formData.name, team: formData.team, status: formData.status }));
                   }
                   savedSuccess = true;
               } catch(err) {
                   console.warn("Supabase REST save fallback", err);
               }
           }

           // Update local state and cache regardless to guarantee smooth UX
           if (isEditing) {
               setClosers((closers || []).map(p => p && String(p.id || '').toUpperCase() === String(formData.id || '').toUpperCase() ? newRecord : p));
           } else {
               setClosers([...(closers || []), newRecord]);
           }

           setShowForm(false); 
           setIsSubmitting(false); 
           showToast(isEditing ? 'แก้ไขผู้ปิดการขายสำเร็จ!' : 'บันทึกผู้ปิดการขายสำเร็จ!', 'success');
        };

        const handleSyncMarketing = async () => {
             setIsSubmitting(true);
             try {
                 // ดึงพนักงานทั้งหมดจาก stk_members
                 let allUsers = [];
                 if (window.supabaseClient) {
                     const { data, error } = await window.supabaseClient.from('stk_members').select('*');
                     if (!error && data) allUsers = data;
                 }
                 if (allUsers.length === 0 && typeof supabaseSelect === 'function') {
                     allUsers = await supabaseSelect('stk_members').catch(() => supabaseSelect('members')).catch(() => []) || [];
                 }

                 // สร้าง map: team_id -> team_name จาก stk_business_teams
                 // ตัวอย่าง: { 'T01': 'Team Lee', 'T02': 'Team Thailand', ... }
                 const teamIdToName = {};
                 (businessTeams || []).forEach(t => {
                     const tId = String(t.team_id || '').trim().toUpperCase();
                     const tName = String(t.team_name || t.name || t.team_id || '').trim();
                     if (tId) teamIdToName[tId] = tName;
                 });

                 // กรองเฉพาะพนักงานที่มีสังกัดทีม
                 const validUsers = allUsers.filter(u => {
                     const bTeam = String(u.business_team || u.businessTeam || '').trim();
                     return bTeam !== '' && bTeam.toUpperCase() !== 'NULL' && bTeam.toUpperCase() !== 'UNDEFINED' && bTeam.toUpperCase() !== 'NONE';
                 });

                 if (validUsers.length === 0) {
                     showToast('ไม่พบข้อมูลพนักงานที่มีสังกัดทีม', 'error');
                     setIsSubmitting(false);
                     return;
                 }

                 let addedCount = 0;
                 let updatedCount = 0;
                 let newClosersState = [...(closers || [])];

                 for (const u of validUsers) {
                     const uId = String(u.id || u.user_id || u.username || '').trim();
                     if (!uId) continue;

                     // แปลง business_team (team_id) -> team_name
                     const bTeamRaw = String(u.business_team || u.businessTeam || '').trim();
                     const bTeamUpper = bTeamRaw.toUpperCase();
                     // ลองหาชื่อทีมจาก map ก่อน ถ้าไม่เจอให้ใช้ค่าดิบ
                     const teamNameStr = teamIdToName[bTeamUpper] || teamIdToName[bTeamRaw] || bTeamRaw;

                     const existsIdx = newClosersState.findIndex(c => String(c.id || '').toUpperCase() === uId.toUpperCase());

                     const payload = {
                         closer_id: uId,
                         name: u.name || uId,
                         team: teamNameStr,
                         status: 'ใช้งาน'
                     };

                     // Upsert ไปยัง stk_closers (insert ถ้าไม่มี, update ถ้ามีอยู่แล้ว)
                     if (window.supabaseClient) {
                         try {
                             await window.supabaseClient.from('stk_closers').upsert(payload, { onConflict: 'id' });
                         } catch(err) { console.warn('upsert error:', err); }
                     }

                     if (existsIdx === -1) {
                         newClosersState.push({ id: uId, name: u.name || uId, team: teamNameStr, status: 'ใช้งาน' });
                         addedCount++;
                     } else {
                         // อัพเดทชื่อทีมในกรณีที่ย้ายทีม
                         newClosersState[existsIdx] = { ...newClosersState[existsIdx], team: teamNameStr, name: u.name || uId };
                         updatedCount++;
                     }
                 }

                 setClosers([...newClosersState]);
                 const msg = addedCount > 0
                     ? `ซิงค์สำเร็จ! เพิ่มใหม่ ${addedCount} คน${updatedCount > 0 ? `, อัพเดทสังกัด ${updatedCount} คน` : ''}`
                     : updatedCount > 0
                     ? `อัพเดทสังกัดทีม ${updatedCount} คนสำเร็จ`
                     : 'ทุกคนอยู่ในระบบแล้ว ไม่มีรายการใหม่';
                 showToast(msg, 'success');
             } catch(err) {
                 showToast('เกิดข้อผิดพลาด: ' + err.message, 'error');
             } finally {
                 setIsSubmitting(false);
             }
         };

        const executeDelete = () => { 
            const id = confirmDelete.id; 
            if (!id) return;
            supabaseDelete('stk_closers', id, 'id')
              .catch(() => supabaseDelete('closers', id, 'id'))
              .then(() => {
                 setClosers((closers || []).filter(p => p && p.id !== id)); 
                 setConfirmDelete({ show: false, id: null, title: '' });
                 showToast('ลบผู้ปิดการขายสำเร็จ', 'success');
              }).catch(err => {
                 setConfirmDelete({ show: false, id: null, title: '' });
                 showToast('ลบล้มเหลว: ' + err.message, 'error');
              });
        };

        const [selectedTeamFilter, setSelectedTeamFilter] = useState('ALL');

        const teamCategoryCounts = useMemo(() => {
            const counts = {
                ALL: (closers || []).length,
                DOCTOR: 0,
                CLOSER: 0,
                MARKETING: 0,
                CENTRAL: 0
            };
            (closers || []).forEach(c => {
                const t = String(c?.team || '').toUpperCase();
                if (t.includes('แพทย์') || t.includes('คลินิก') || t.includes('หมอ') || t.includes('DOCTOR')) counts.DOCTOR++;
                else if (t.includes('ผู้เชี่ยวชาญ') || t.includes('CLOSER') || t.includes('TEAM B') || t.includes('CENTER')) counts.CLOSER++;
                else if (t.includes('การตลาด') || t.includes('MARKETING') || t.includes('TEAM A')) counts.MARKETING++;
                else counts.CENTRAL++;
            });
            return counts;
        }, [closers]);

        const filteredClosers = (closers || []).filter(p => {
            if (!p) return false;
            const search = searchTerm.trim().toLowerCase();
            const matchesSearch = search === '' || 
                (p.id && String(p.id).toLowerCase().includes(search)) || 
                (p.name && String(p.name).toLowerCase().includes(search)) || 
                (p.team && String(p.team).toLowerCase().includes(search));

            if (!matchesSearch) return false;

            if (selectedTeamFilter === 'ALL') return true;
            return String(p.team || 'ไม่ระบุทีม').trim() === selectedTeamFilter;
        });

        return (
          <div className="space-y-6 animation-fade-in relative w-full">
            <ConfirmModal isOpen={confirmDelete.show} onClose={() => setConfirmDelete({show: false, id: null, title: ''})} onConfirm={executeDelete} title="ยืนยันการลบผู้ปิดการขาย" message={`คุณต้องการลบ "${confirmDelete.title}" ใช่หรือไม่?`} />
            
            <EditModal isOpen={showForm} onClose={() => setShowForm(false)} title={isEditing ? 'แก้ไขผู้ปิดการขาย' : 'เพิ่มผู้ปิดการขายใหม่'} icon={Headset}>
                <form onSubmit={handleSave} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div><label className={labelClassHud}>รหัสผู้ปิดการขาย</label><input type="text" disabled={isEditing} className={inputClassHud} value={formData.id} onChange={e=>setFormData({...formData,id:e.target.value})}/></div>
                  <div><label className={labelClassHud}>ชื่อ - นามสกุล (หมอ / เซลส์ผู้ปิดการขาย)</label><input type="text" required className={inputClassHud} value={formData.name} onChange={e=>setFormData({...formData,name:e.target.value})}/></div>
                  <div>
                    <label className={labelClassHud}>สังกัด / ทีมการทำงาน</label>
                    <select className={inputClassHud} value={formData.team} onChange={e=>setFormData({...formData,team:e.target.value})}>
                      <optgroup label="📌 ทีมหลัก">
                        <option value="Center">🎧 Center — ผู้เชี่ยวชาญปิดการขาย</option>
                        <option value="Marketing">📢 Marketing — ฝ่ายการตลาด (รวม)</option>
                      </optgroup>
                      {(businessTeams || []).length > 0 && (
                        <optgroup label="🏢 ทีมสังกัดย่อย (Marketing)">
                          {(businessTeams || []).map(t => {
                              const tName = t.team_name || t.name || t.team_id;
                              return <option key={t.team_id} value={tName}>{tName}</option>;
                          })}
                        </optgroup>
                      )}
                    </select>
                  </div>
                  <div><label className={labelClassHud}>สถานะ</label><select className={inputClassHud} value={formData.status} onChange={e=>setFormData({...formData,status:e.target.value})}><option value="ใช้งาน">ใช้งาน</option><option value="ไม่ใช้งาน">ไม่ใช้งาน</option></select></div>
                  <div className="md:col-span-2 text-right pt-4 border-t border-slate-100 mt-2 flex justify-end gap-3"><button type="button" onClick={()=>setShowForm(false)} className={btnClassSecondary}>ยกเลิก</button><button type="submit" disabled={isSubmitting} className={btnClassPrimary}>{isSubmitting ? 'กำลังบันทึก...' : 'บันทึกข้อมูล'}</button></div>
                </form>
            </EditModal>

            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
               <h2 className="text-2xl font-bold text-slate-800">จัดการข้อมูลผู้ปิดการขาย (Closers)</h2>
               <div className="flex flex-wrap w-full sm:w-auto items-center gap-2.5">
                 <div className="flex items-center bg-slate-50/30 focus-within:bg-white border border-slate-200 rounded-xl px-3 shadow-sm focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-100 transition-all duration-300 flex-1 sm:w-72 h-[38px] sm:h-[40px]">
                    <SearchIcon size={18} className="text-slate-400 shrink-0" />
                    <input type="text" placeholder="ค้นหารหัส, ชื่อ, สังกัด..." className="w-full bg-transparent border-none outline-none text-[13px] font-medium text-slate-800 placeholder-slate-400 pl-2 h-full" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                 </div>
                  <button onClick={handleSyncMarketing} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-[12px] py-1.5 px-3 rounded-xl flex items-center gap-1.5 transition-colors shadow-sm shrink-0" type="button"><Plus size={18}/> ดึงพนักงานเข้าสังกัด</button>
                  <button onClick={handleOpenAdd} className={`${btnClassPrimary} shrink-0`}><Plus size={18}/> เพิ่มผู้ปิดการขาย</button>
               </div>
            </div>

            {/* 📌 Dynamic Filter Cards - Responsive Grid ไม่แตกเมื่อย่อจอ */}
            {(() => {
                const teamCountMap = {};
                (closers || []).forEach(c => {
                    const tName = String(c?.team || 'ไม่ระบุทีม').trim();
                    if (tName) teamCountMap[tName] = (teamCountMap[tName] || 0) + 1;
                });

                // รวมทีมทั้งหมดจาก stk_business_teams + stk_closers เพื่อให้แสดงครบทุกทีมเสมอ
                const allTeamNamesSet = new Set();
                (businessTeams || []).forEach(t => {
                    const name = String(t.team_name || t.name || t.team_id || '').trim();
                    if (name) allTeamNamesSet.add(name);
                });
                Object.keys(teamCountMap).forEach(tName => allTeamNamesSet.add(tName));

                const distinctTeamsList = Array.from(allTeamNamesSet).sort((a, b) => a.localeCompare(b, 'th'));

                // Palette สีตามทีม
                const colorPalettes = [
                    { bg: 'bg-blue-600', border: 'border-blue-600', ring: 'ring-blue-200', badge: 'bg-blue-50 text-blue-700', selBadge: 'bg-white/20 text-white' },
                    { bg: 'bg-violet-600', border: 'border-violet-600', ring: 'ring-violet-200', badge: 'bg-violet-50 text-violet-700', selBadge: 'bg-white/20 text-white' },
                    { bg: 'bg-emerald-600', border: 'border-emerald-600', ring: 'ring-emerald-200', badge: 'bg-emerald-50 text-emerald-700', selBadge: 'bg-white/20 text-white' },
                    { bg: 'bg-rose-600', border: 'border-rose-600', ring: 'ring-rose-200', badge: 'bg-rose-50 text-rose-700', selBadge: 'bg-white/20 text-white' },
                    { bg: 'bg-amber-600', border: 'border-amber-600', ring: 'ring-amber-200', badge: 'bg-amber-50 text-amber-700', selBadge: 'bg-white/20 text-white' },
                    { bg: 'bg-cyan-600', border: 'border-cyan-600', ring: 'ring-cyan-200', badge: 'bg-cyan-50 text-cyan-700', selBadge: 'bg-white/20 text-white' },
                    { bg: 'bg-pink-600', border: 'border-pink-600', ring: 'ring-pink-200', badge: 'bg-pink-50 text-pink-700', selBadge: 'bg-white/20 text-white' },
                    { bg: 'bg-teal-600', border: 'border-teal-600', ring: 'ring-teal-200', badge: 'bg-teal-50 text-teal-700', selBadge: 'bg-white/20 text-white' },
                ];

                return (
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-9 gap-3">
                        {/* การ์ด 'ทีมทั้งหมด' */}
                        <button 
                            type="button"
                            onClick={() => setSelectedTeamFilter('ALL')}
                            className={`p-3.5 rounded-2xl border text-left transition-all flex flex-col justify-between shadow-xs relative overflow-hidden ${
                                selectedTeamFilter === 'ALL' 
                                ? 'bg-slate-900 text-white border-slate-900 shadow-md ring-2 ring-slate-400' 
                                : 'bg-white text-slate-700 border-slate-200 hover:border-slate-400 hover:bg-slate-50'
                            }`}
                        >
                            <div className="flex items-center justify-between gap-1 w-full mb-2">
                                <span className="text-[11px] font-bold tracking-wide truncate">
                                    👥 ทีมทั้งหมด
                                </span>
                                <span className={`text-[9px] font-black px-1.5 py-0.5 rounded-md shrink-0 uppercase ${
                                    selectedTeamFilter === 'ALL' ? 'bg-white/20 text-white' : 'bg-slate-100 text-slate-700'
                                }`}>
                                    รวม
                                </span>
                            </div>
                            <div className="flex items-baseline justify-between w-full mt-auto">
                                <span className="text-xl font-black tracking-tight">
                                    {(closers || []).length}
                                </span>
                                <span className={`text-xs font-semibold ${selectedTeamFilter === 'ALL' ? 'text-white/80' : 'text-slate-400'}`}>
                                    คน
                                </span>
                            </div>
                        </button>

                        {/* การ์ดแต่ละสังกัดทีม */}
                        {distinctTeamsList.map((tName, idx) => {
                            const isSelected = selectedTeamFilter === tName;
                            const palette = colorPalettes[idx % colorPalettes.length];
                            const count = teamCountMap[tName] || 0;
                            return (
                                <button 
                                    key={tName}
                                    type="button" 
                                    onClick={() => setSelectedTeamFilter(isSelected ? 'ALL' : tName)}
                                    className={`p-3.5 rounded-2xl border text-left transition-all flex flex-col justify-between shadow-xs relative overflow-hidden group ${
                                        isSelected 
                                        ? `${palette.bg} text-white ${palette.border} shadow-md ring-2 ${palette.ring}` 
                                        : 'bg-white text-slate-700 border-slate-200 hover:border-blue-300 hover:bg-blue-50/30'
                                    }`}
                                >
                                    <div className="flex items-center justify-between gap-1 w-full mb-2">
                                        <span className="text-[11px] font-bold tracking-wide truncate" title={tName}>
                                            🏢 {tName}
                                        </span>
                                        <span className={`text-[9px] font-black px-1.5 py-0.5 rounded-md shrink-0 uppercase ${
                                            isSelected ? palette.selBadge : palette.badge
                                        }`}>
                                            {isSelected ? 'เลือก' : 'ทีม'}
                                        </span>
                                    </div>
                                    <div className="flex items-baseline justify-between w-full mt-auto">
                                        <span className="text-xl font-black tracking-tight">
                                            {count}
                                        </span>
                                        <span className={`text-xs font-semibold ${isSelected ? 'text-white/80' : 'text-slate-400'}`}>
                                            คน
                                        </span>
                                    </div>
                                </button>
                            );
                        })}
                    </div>
                );
            })()}

            {selectedTeamFilter !== 'ALL' && (
              <div className="flex items-center justify-between bg-blue-50/60 border border-blue-200 px-4 py-2 rounded-xl text-xs font-bold text-blue-800">
                <span>กำลังกรองแสดงผลเฉพาะสังกัดทีม: <span className="text-blue-600 font-extrabold">{selectedTeamFilter}</span></span>
                <button onClick={() => setSelectedTeamFilter('ALL')} className="text-blue-600 hover:text-blue-800 underline ml-2">แสดงผู้ปิดการขายทั้งหมด ({(closers || []).length} คน)</button>
              </div>
            )}


            <div className={`${boxWrapper} p-0 overflow-hidden`}>
              <div className="overflow-x-auto">
                <table className="w-full text-left">
                  <thead>
                    <tr>
                      <th className={tableHeaderClass}>รหัส</th>
                      <th className={tableHeaderClass}>ชื่อ - นามสกุล</th>
                      <th className={tableHeaderClass}>สังกัด / ทีมการทำงาน</th>
                      <th className={tableHeaderClass}>สถานะ</th>
                      <th className={`${tableHeaderClass} text-center`}>จัดการ</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredClosers.map((p, index)=>(
                      <tr key={p?.id || `closer-${index}`} className="hover:bg-blue-50/50 transition-colors">
                        <td className={tableCellClass}>{p?.id}</td>
                        <td className={`${tableCellClass} text-blue-700 font-bold`}>{p?.name}</td>
                        <td className={tableCellClass}>
                          <span className="text-xs font-bold px-3 py-1 bg-purple-50 border border-purple-200 text-purple-700 rounded-lg inline-flex items-center gap-1.5">
                            🏢 {p?.team || 'ทีมแพทย์/คลินิก'}
                          </span>
                        </td>
                        <td className={tableCellClass}><span className="text-[11px] font-bold px-3 py-1.5 bg-slate-100 border border-slate-200 text-slate-600 rounded-lg">{p?.status}</span></td>
                        <td className={`${tableCellClass} text-center`}>
                          <button onClick={()=>handleOpenEdit(p)} className="text-blue-500 hover:text-blue-700 mx-2 transition-colors bg-white p-1.5 rounded-lg border border-slate-200 shadow-sm"><Edit size={16}/></button>
                          {isAdmin && <button onClick={()=>setConfirmDelete({show: true, id: p.id, title: p.name})} className="text-red-500 hover:text-red-700 transition-colors bg-white p-1.5 rounded-lg border border-slate-200 shadow-sm"><Trash2 size={16}/></button>}
                        </td>
                      </tr>
                    ))}
                    {filteredClosers.length === 0 && <tr><td colSpan="5" className="p-10 text-center text-slate-500 font-bold bg-slate-50/50">ไม่พบข้อมูลผู้ปิดการขาย</td></tr>}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
    };

    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      
      const [closers, setClosers] = useState([]);
      const [businessTeams, setBusinessTeams] = useState([]);
      const [isAppLoading, setIsAppLoading] = useState(true);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch(e) { return false; }
      });
      
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const showToast = (message, type = 'success') => { setToast({ show: true, message, type }); };

      const pagePerm = window.getUserPagePermission ? window.getUserPagePermission(currentUser, 'closers') : 'none';
      const isAdmin = currentUser && (
          String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || 
          String(currentUser.role).trim().toLowerCase() === 'admin' ||
          pagePerm === 'full'
      );
      const currentUserProfileUrl = currentUser?.profileUrl || '';

      useEffect(() => {
        const savedUserStr = localStorage.getItem('stk_current_user');
        if (savedUserStr) {
          try {
            const user = JSON.parse(savedUserStr);
            setCurrentUser(user);
            setIsLoggedIn(true);
          } catch(e) { localStorage.removeItem('stk_current_user'); }
        } else {
          setShowLoginModal(true);
        }

        const initialLoader = document.getElementById('initial-loader');
        if (initialLoader) initialLoader.style.display = 'none';

        Promise.all([
          supabaseSelect('stk_closers').catch(() => supabaseSelect('closers')).catch(() => []),
          supabaseSelect('stk_business_teams').catch(() => supabaseSelect('business_teams')).catch(() => [])
        ]).then(([cloRes, teamRes]) => {
             let formattedClosers = [];
             if (Array.isArray(cloRes)) {
               formattedClosers = cloRes.map(c => ({
                 id: c.closer_id || c.id,
                 name: c.name,
                 team: c.team || 'ทีมแพทย์/คลินิก',
                 status: c.status || 'ใช้งาน'
               }));
             }
             let teamsData = Array.isArray(teamRes) ? teamRes : [];
             setBusinessTeams(teamsData);
             setClosers([...formattedClosers]);
             setIsAppLoading(false);
             setTimeout(() => { autoSyncAllMembers(formattedClosers, teamsData); }, 1200);
          }).catch(err => {
             console.error("Load error:", err);
             setIsAppLoading(false);
          });

        async function autoSyncAllMembers(existingClosers, teamsData) {
          try {
            const membersRes = await supabaseSelect('stk_members').catch(() => supabaseSelect('members')).catch(() => []);
            if (!Array.isArray(membersRes) || membersRes.length === 0) return;
            
            const teamIdToName = {};
            teamsData.forEach(t => {
              const tId = String(t.team_id || '').trim().toUpperCase();
              const tName = String(t.team_name || t.name || t.team_id || '').trim();
              if (tId) teamIdToName[tId] = tName;
            });
            
            const validMembers = membersRes.filter(u => {
              const bTeam = String(u.business_team || u.businessTeam || '').trim();
              return bTeam && !['NULL','UNDEFINED','NONE'].includes(bTeam.toUpperCase());
            });
            if (validMembers.length === 0) return;
            
            const closerMap = {};
            existingClosers.forEach(c => {
              const cId = String(c.id || c.closer_id || '').toUpperCase();
              if (cId) closerMap[cId] = { team: c.team, name: c.name };
            });
            
            const toInsert = [];
            const toUpdate = [];

            for (const u of validMembers) {
              const uId = String(u.id || u.user_id || u.username || '').trim();
              if (!uId) continue;
              
              const bTeamRaw = String(u.business_team || u.businessTeam || '').trim();
              const teamNameStr = teamIdToName[bTeamRaw.toUpperCase()] || teamIdToName[bTeamRaw] || bTeamRaw;
              const existing = closerMap[uId.toUpperCase()];

              if (!existing) {
                toInsert.push({ id: uId, name: u.name || uId, team: teamNameStr, status: 'ใช้งาน' });
              } else if (existing.team !== teamNameStr) {
                toUpdate.push({ id: uId, name: u.name || existing.name, team: teamNameStr });
              }
            }

            // Bulk POST in 1 single HTTP call
            if (toInsert.length > 0) {
              try {
                await fetch(window.SUPABASE_REST_URL + '/stk_closers', {
                  method: 'POST',
                  headers: { ...window.SUPABASE_HEADERS, 'Prefer': 'resolution=ignore-duplicates,return=minimal' },
                  body: JSON.stringify(toInsert)
                });
              } catch(e) {}
            }

            // Update team for members who switched teams
            for (const upd of toUpdate) {
              try {
                await fetch(window.SUPABASE_REST_URL + '/stk_closers?id=eq.' + encodeURIComponent(upd.id), {
                  method: 'PATCH',
                  headers: { ...window.SUPABASE_HEADERS, 'Prefer': 'return=minimal' },
                  body: JSON.stringify({ team: upd.team, name: upd.name })
                });
              } catch(e) {}
            }

            if (toInsert.length > 0 || toUpdate.length > 0) {
              setClosers(prev => {
                let updated = [...(prev || [])];
                const idSet = new Set(updated.map(c => String(c.id || c.closer_id || '').toUpperCase()));
                toInsert.forEach(e => {
                  if (!idSet.has(String(e.id || '').toUpperCase())) {
                    updated.push(e);
                    idSet.add(String(e.id || '').toUpperCase());
                  }
                });
                toUpdate.forEach(upd => {
                  const idx = updated.findIndex(c => String(c.id || c.closer_id || '').toUpperCase() === String(upd.id || '').toUpperCase());
                  if (idx !== -1) updated[idx] = { ...updated[idx], team: upd.team, name: upd.name };
                });
                if (toInsert.length > 0) console.log('Added ' + toInsert.length + ' new closers');
                if (toUpdate.length > 0) console.log('Updated ' + toUpdate.length + ' closers team');
                return updated;
              });
            }
          } catch(err) {
            console.warn('Auto-sync skipped:', err.message);
          }
        }
      }, []);
      const handleLoginSuccess = (user) => {
        localStorage.setItem('stk_current_user', JSON.stringify(user));
        setCurrentUser(user);
        setIsLoggedIn(true);
        setShowLoginModal(false);
        showToast('เข้าสู่ระบบสำเร็จ!', 'success');
      };

      const handleLogout = () => {
        localStorage.removeItem('stk_current_user');
        setCurrentUser(null);
        setIsLoggedIn(false);
        const targetUrl = typeof resolvePageUrl === 'function' ? resolvePageUrl('?page=dashboard') : 'Mlm.html';
        if (typeof window !== 'undefined') window.location.href = targetUrl;
      };

      return (
        <div className="min-h-screen flex flex-col lg:flex-row font-sans bg-slate-50">
          <Sidebar 
            activePage="closers" 
            isLoggedIn={isLoggedIn} 
            currentUser={currentUser} 
            currentUserProfileUrl={currentUserProfileUrl} 
            isAdmin={isAdmin} 
            onLogout={handleLogout} 
            showLoginModal={showLoginModal} 
            setShowLoginModal={setShowLoginModal} 
            SCRIPT_URL=""
            setIsAppLoading={setIsAppLoading}
            isSidebarCollapsed={isSidebarCollapsed}
            setIsSidebarCollapsed={setIsSidebarCollapsed}
          />
          
          <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>
            
            {toast.show && ReactDOM.createPortal(
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[999999] flex items-center justify-center p-4 animation-fade-in" style={{ animationDuration: '0.2s' }}>
                 <div className={`bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center animation-pop border-t-4 ${toast.type === 'error' ? 'border-red-500' : toast.type === 'info' ? 'border-blue-500' : 'border-emerald-500'}`}>
                    <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${toast.type === 'error' ? 'bg-red-100 text-red-500' : toast.type === 'info' ? 'bg-blue-100 text-blue-500' : 'bg-emerald-100 text-emerald-500'}`}>
                       {toast.type === 'error' ? <X size={32} /> : toast.type === 'info' ? <Trophy size={32} /> : <CheckCircle size={32} />}
                    </div>
                    <h3 className="text-xl font-bold text-slate-800 mb-2">{toast.type === 'error' ? 'เกิดข้อผิดพลาด' : toast.type === 'info' ? 'แจ้งเตือน' : 'สำเร็จ!'}</h3>
                    <p className="text-slate-600 font-medium text-sm mb-6">{toast.message}</p>
                    <button onClick={() => setToast({ ...toast, show: false })} className="w-full py-2.5 rounded-lg font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">ตกลง</button>
                 </div>
              </div>
            , document.body)}

            <div className="p-3 sm:p-6 flex-1 w-full relative z-0">
              <div className="w-full relative z-10">
                {isAppLoading ? (
                  <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                    <div className="w-16 h-16 border-[4px] border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                    <h2 className="text-lg font-bold text-slate-700">กำลังซิงค์ข้อมูลกับฐานข้อมูล...</h2>
                    <p className="text-slate-500 text-sm">กรุณารอสักครู่ ระบบกำลังดึงข้อมูลล่าสุด</p>
                  </div>
                ) : isLoggedIn ? (
                  <ClosersManagementView 
                    closers={closers} 
                    setClosers={setClosers}
                    businessTeams={businessTeams} 
                    isAdmin={isAdmin} 
                    showToast={showToast} 
                  />
                ) : (
                  <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                    <h2 className="text-xl font-black text-red-500">กรุณาเข้าสู่ระบบก่อนใช้งาน</h2>
                    <button onClick={() => setShowLoginModal(true)} className={btnClassPrimary}>เข้าสู่ระบบ</button>
                  </div>
                )}
              </div>
            </div>

            <footer className="w-full text-center py-6 mt-auto border-t border-slate-200/50 no-print shrink-0">
               <p className="text-[11px] font-bold text-slate-400 opacity-60 hover:opacity-100 transition-opacity">
                  &copy; {new Date().getFullYear()} STK Sales Management System.
               </p>
            </footer>

          </main>

          <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={[]} />

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
