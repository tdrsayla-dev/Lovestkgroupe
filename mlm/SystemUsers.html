  <script>
    window.SUPABASE_URL='https://mfpkeyrykqnrywyksyqp.supabase.co';window.SUPABASE_ANON_KEY='sb_publishable_807NIkuj6MAs1KZY-m4tug_Fm1Mk-AO';window.SUPABASE_REST_URL=window.SUPABASE_URL+'/rest/v1';window.SUPABASE_HEADERS={'Content-Type':'application/json','apikey':window.SUPABASE_ANON_KEY,'Authorization':'Bearer '+window.SUPABASE_ANON_KEY,'Prefer':'return=representation'};
    if(typeof supabase!=='undefined'){window.supabaseClient=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);console.log('%c Supabase Connected!','color:green;font-weight:bold',window.SUPABASE_URL);}
    async function supabaseSelect(t,q){var r=await fetch(window.SUPABASE_REST_URL+'/'+t+(q?'?'+q:''),{method:'GET',headers:window.SUPABASE_HEADERS});if(!r.ok)throw new Error('SELECT '+t+':'+r.status);return r.json();}
    async function supabaseInsert(t,d){var r=await fetch(window.SUPABASE_REST_URL+'/'+t,{method:'POST',headers:window.SUPABASE_HEADERS,body:JSON.stringify(d)});if(!r.ok)throw new Error('INSERT '+t+':'+r.status);return r.json();}
    async function supabaseUpdate(t,id,d){var r=await fetch(window.SUPABASE_REST_URL+'/'+t+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:window.SUPABASE_HEADERS,body:JSON.stringify(d)});if(!r.ok)throw new Error('UPDATE '+t+':'+r.status);return r.json();}
    async function supabaseDelete(t,id){var r=await fetch(window.SUPABASE_REST_URL+'/'+t+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:Object.assign({},window.SUPABASE_HEADERS,{'Prefer':'return=minimal'})});if(!r.ok)throw new Error('DELETE '+t+':'+r.status);return true;}
    async function supabaseUpsert(t,d){var r=await fetch(window.SUPABASE_REST_URL+'/'+t,{method:'POST',headers:Object.assign({},window.SUPABASE_HEADERS,{'Prefer':'resolution=merge-duplicates,return=representation'}),body:JSON.stringify(d)});if(!r.ok)throw new Error('UPSERT '+t+':'+r.status);return r.json();}
  </script>

<body class="antialiased overflow-x-hidden selection:bg-blue-600 selection:text-white">

  <div id="initial-loader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999;">
    <div style="width: 60px; height: 60px; border: 4px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: initial-spin 1s linear infinite; margin-bottom: 24px;"></div>
    <style>@keyframes initial-spin { to { transform: rotate(360deg); } }</style>
    <h2 style="font-size: 1.75rem; font-weight: 800; color: #1e40af; margin: 0; letter-spacing: -0.025em;">STK<span style="color: #475569;">System</span></h2>
    <p style="font-size: 0.875rem; color: #64748b; font-weight: 500; margin-top: 8px;">กำลังโหลดระบบจัดการข้อมูล...</p>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;

    const fallbackCustomerTypes = window.fallbackCustomerTypes || [
       { id: 'T001', name: 'ลูกค้าใหม่', status: 'เข้าใช้งาน' },
       { id: 'T002', name: 'ลูกค้าเก่ากลับมาต่อยา', status: 'เข้าใช้งาน' }
    ];
    const fallbackProductsList = window.fallbackProductsList || ['SESAMIN', 'APPLE', 'KING_GOLD'];

    /* <?!= include('CommonComponents'); ?> */

    // ==========================================
    // 📌 System Users Management View Component
    // ==========================================
    const SystemUsersManagementView = ({ systemUsers, setSystemUsers, members, isAdmin, showToast }) => {
        const [showForm, setShowForm] = useState(false);
        const [isEditing, setIsEditing] = useState(false);
        const [isSubmitting, setIsSubmitting] = useState(false);
        const [searchTerm, setSearchTerm] = useState(''); 
        const [confirmDelete, setConfirmDelete] = useState({ show: false, id: null, title: '' });
        
        // Role & Permissions Matrix States
        const [showRolePermissionsModal, setShowRolePermissionsModal] = useState(false);
        const [selectedRoleForPerm, setSelectedRoleForPerm] = useState('พนักงานทั่วไป');

        const defaultRolePermissions = {
            'ผู้ดูแลระบบ': {
                dashboard: 'full', reports: 'full', orgchart: 'full', sales: 'full', customers: 'full',
                team: 'full', business_teams: 'full', stock: 'full', customer_types: 'full', closers: 'full',
                exchange_rate: 'full', system_users: 'full'
            },
            'พนักงานการตลาด': {
                dashboard: 'view', reports: 'none', orgchart: 'view', sales: 'none', customers: 'none',
                team: 'edit', business_teams: 'none', stock: 'none', customer_types: 'none', closers: 'none',
                exchange_rate: 'none', system_users: 'none'
            },
            'พนักงานทั่วไป': {
                dashboard: 'view', reports: 'none', orgchart: 'view', sales: 'edit', customers: 'view',
                team: 'none', business_teams: 'none', stock: 'none', customer_types: 'none', closers: 'none',
                exchange_rate: 'none', system_users: 'none'
            }
        };

        const [rolePermissions, setRolePermissions] = useState(() => {
            try {
                const saved = localStorage.getItem('stk_role_permissions');
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return defaultRolePermissions;
        });

        const systemPagesList = [
            { id: 'dashboard', label: 'แดชบอร์ด (Dashboard)' },
            { id: 'reports', label: 'รายงานสรุปผลงาน (Reports)' },
            { id: 'orgchart', label: 'ผังองค์กรสายงาน (OrgChart)' },
            { id: 'sales', label: 'ข้อมูลการขาย (Sales)' },
            { id: 'orders', label: 'จัดการบิล (Orders)' },
            { id: 'customers', label: 'ข้อมูลลูกค้า (Customers)' },
            { id: 'team', label: 'ข้อมูลพนักงาน (Team)' },
            { id: 'business_teams', label: 'ข้อมูลทีมสังกัด (Business Teams)' },
            { id: 'stock', label: 'คลังสินค้า & สต๊อก (Stock)' },
            { id: 'customer_types', label: 'จัดการประเภทลูกค้า (Customer Types)' },
            { id: 'closers', label: 'จัดการผู้ปิดการขาย (Closers)' },
            { id: 'exchange_rate', label: 'ตั้งค่าอัตราแลกเปลี่ยน (Exchange Rate)' },
            { id: 'system_users', label: 'สิทธิ์การเข้าใช้งานระบบ (System Users)' }
        ];

        const handleUpdatePagePerm = (role, pageId, permVal) => {
            setRolePermissions(prev => {
                const currentRolePerms = prev[role] || { ...defaultRolePermissions['พนักงานทั่วไป'] };
                const updated = {
                    ...prev,
                    [role]: {
                        ...currentRolePerms,
                        [pageId]: permVal
                    }
                };
                try { localStorage.setItem('stk_role_permissions', JSON.stringify(updated)); } catch(e){}
                return updated;
            });
        };

        const handleSaveRolePermissions = () => {
            try { localStorage.setItem('stk_role_permissions', JSON.stringify(rolePermissions)); } catch(e){}
            setShowRolePermissionsModal(false);
            showToast('บันทึกการตั้งค่าสิทธิ์เรียบร้อยแล้ว', 'success');
        };

        const initialFormState = { id: '', username: '', password: '', name: '', role: 'พนักงานทั่วไป', status: 'เข้าใช้งาน' };
        const [formData, setFormData] = useState(initialFormState);
        
        const handleOpenAdd = () => {
          setIsEditing(false); let nextIdNum = 1;
          const uIds = (systemUsers || []).map(p => { const match = p && p.id && p.id.match(/^U(\d+)$/i); return match ? parseInt(match[1], 10) : 0; });
          if (uIds.length > 0) nextIdNum = Math.max(0, ...uIds) + 1;
          setFormData({ ...initialFormState, id: "U" + nextIdNum.toString().padStart(3, '0') });
          setShowForm(true);
        };
        const handleOpenEdit = (user) => { setIsEditing(true); setFormData({ ...user }); setShowForm(true); };

        const handleSaveUser = (e) => {
           e.preventDefault(); if (!formData.id || !formData.username || !formData.name) return; setIsSubmitting(true);
           
           const payloadForSheet = {
               id: formData.id,
               username: formData.username,
               password: formData.password,
               name: formData.name,
               role: formData.role,
               status: formData.status,
               'Username': formData.username,
               'Password': formData.password,
               'รหัสสมาชิก': formData.id,
               'ชื่อผู้ใช้งาน': formData.name,
               'ระดับสิทธิ์': formData.role,
               'สถานะ': formData.status
           };

           const sbPayload = {
               user_id: formData.id,
               username: formData.username,
               password_hash: formData.password,
               name: formData.name,
               permission_role: formData.role,
               status: formData.status
           };
           
           if (isEditing) {
               fetch(window.SUPABASE_REST_URL + '/stk_members?user_id=eq.' + encodeURIComponent(formData.id), {
                   method: 'PATCH',
                   headers: window.SUPABASE_HEADERS,
                   body: JSON.stringify(sbPayload)
               })
               .then(async r => {
                   if (!r.ok) throw new Error('UPDATE stk_members:' + r.status + ' ' + (await r.text()));
                   return r.json();
               })
                .then(() => {
                    const updatedPayload = { ...sbPayload, role: formData.role, Permission_Role: formData.role };
                    let list = (systemUsers && systemUsers.length > 0) ? systemUsers : members;
                    setSystemUsers(list.map(p => p && safeUpper(p.id || p.user_id || p.User_ID) === safeUpper(formData.id) ? { ...p, ...updatedPayload } : p));
                    
                    try {
                        const savedUserStr = localStorage.getItem('stk_current_user');
                        if (savedUserStr) {
                            const savedUser = JSON.parse(savedUserStr);
                            if (safeUpper(savedUser.id || savedUser.username) === safeUpper(formData.id)) {
                                savedUser.role = formData.role;
                                savedUser.name = formData.name;
                                savedUser.status = formData.status;
                                localStorage.setItem('stk_current_user', JSON.stringify(savedUser));
                            }
                        }
                    } catch (e) {}

                    setShowForm(false);
                    setIsSubmitting(false);
                    showToast('แก้ไขข้อมูลผู้ใช้งานในระบบสำเร็จ', 'success');
                })
               .catch(err => {
                   setIsSubmitting(false);
                   showToast('แก้ไขล้มเหลว: ' + err.message, 'error');
               });
           } else {
               window.supabaseInsert('stk_members', sbPayload)
                   .then(() => {
                       let list = (systemUsers && systemUsers.length > 0) ? systemUsers : members;
                       setSystemUsers([...list, { ...sbPayload, role: formData.role, Permission_Role: formData.role }]);
                       setShowForm(false);
                       setIsSubmitting(false);
                       showToast('เพิ่มผู้ใช้งานใหม่ในระบบสำเร็จ', 'success');
                   })
                   .catch(err => {
                       setIsSubmitting(false);
                       showToast('เพิ่มข้อมูลล้มเหลว: ' + err.message, 'error');
                   });
           }
        };

        const executeDelete = () => { 
            const id = confirmDelete.id;
            fetch(window.SUPABASE_REST_URL + '/stk_members?user_id=eq.' + encodeURIComponent(id), {
                method: 'DELETE',
                headers: Object.assign({}, window.SUPABASE_HEADERS, {'Prefer': 'return=minimal'})
            })
            .then(async r => {
                if (!r.ok) throw new Error('DELETE stk_members:' + r.status + ' ' + (await r.text()));
                let list = (systemUsers && systemUsers.length > 0) ? systemUsers : members;
                setSystemUsers(list.filter(p => p && safeUpper(p.id || p.user_id || p.User_ID) !== safeUpper(id)));
                setConfirmDelete({ show: false, id: null, title: '' });
                showToast('ลบผู้ใช้งานออกจากระบบสำเร็จ', 'success');
            })
            .catch(err => {
                showToast('ลบล้มเหลว: ' + err.message, 'error');
            });
        };

        const effectiveUsers = useMemo(() => {
            let rawList = (systemUsers && systemUsers.length > 0) ? systemUsers : (members || []);
            if (!Array.isArray(rawList)) return [];
            return rawList.map(u => ({
                id: String(u.id || u.user_id || u.User_ID || u.member_id || '').trim(),
                name: String(u.name || u.Name || u.username || '').trim(),
                username: String(u.username || u.Username || u.user_id || u.id || '').trim(),
                password: String(u.password || u.Password || u.password_hash || '123456').trim(),
                role: String(u.role || u.permission_role || u.Permission_Role || 'พนักงานทั่วไป').trim(),
                status: String(u.status || u.Status || 'เข้าใช้งาน').trim()
            })).filter(u => u.id !== '');
        }, [systemUsers, members]);

        const filteredUsers = effectiveUsers.filter(p => (p.id && p.id.toLowerCase().includes(searchTerm.toLowerCase())) || (p.name && p.name.toLowerCase().includes(searchTerm.toLowerCase())) || (p.username && p.username.toLowerCase().includes(searchTerm.toLowerCase())));

        const activeRolePerms = rolePermissions[selectedRoleForPerm] || defaultRolePermissions['พนักงานทั่วไป'];

        return (
          <div className="space-y-6 animation-fade-in relative w-full">
            <ConfirmModal isOpen={confirmDelete.show} onClose={() => setConfirmDelete({show: false, id: null, title: ''})} onConfirm={executeDelete} title="ยืนยันการลบผู้ใช้งาน" message={`คุณต้องการลบผู้ใช้งาน "${confirmDelete.title}" ออกจากระบบใช่หรือไม่?`} />

            {/* Modal ตั้งค่าสิทธิ์รายหน้า (Role Permissions Matrix) */}
            <EditModal isOpen={showRolePermissionsModal} onClose={() => setShowRolePermissionsModal(false)} title="ตั้งค่าบทบาทและสิทธิ์การเข้าใช้งานรายหน้า" icon={ShieldCheck}>
                <div className="space-y-4">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-slate-900 text-white p-3.5 rounded-2xl border border-slate-800">
                        <div>
                            <span className="text-xs text-slate-400 font-bold block">เลือกลำดับบทบาทที่ต้องการตั้งค่า:</span>
                            <span className="text-sm font-black text-blue-400">กำหนดสิทธิ์ของแต่ละหน้าในระบบ</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <select 
                                className="bg-slate-800 border border-slate-700 text-white font-bold text-xs rounded-xl px-3 py-2 outline-none focus:border-blue-400"
                                value={selectedRoleForPerm} 
                                onChange={e => setSelectedRoleForPerm(e.target.value)}
                            >
                                {Object.keys(rolePermissions).map(roleName => (
                                    <option key={roleName} value={roleName}>{roleName}</option>
                                ))}
                            </select>
                            <button 
                                type="button" 
                                onClick={() => {
                                    const newRoleName = prompt('ระบุชื่อบทบาทสิทธิ์ใหม่ที่ต้องการเพิ่ม (เช่น พนักงานบัญชี, หัวหน้าทีมการตลาด):');
                                    if (newRoleName && newRoleName.trim()) {
                                        const trimmed = newRoleName.trim();
                                        setRolePermissions(prev => ({
                                            ...prev,
                                            [trimmed]: { ...defaultRolePermissions['พนักงานทั่วไป'] }
                                        }));
                                        setSelectedRoleForPerm(trimmed);
                                    }
                                }} 
                                className="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow transition-all shrink-0"
                            >
                                + เพิ่มบทบาทใหม่
                            </button>
                        </div>
                    </div>

                    <div className="max-h-[60vh] overflow-y-auto space-y-2 pr-1">
                        {systemPagesList.map(page => {
                            const currentPerm = activeRolePerms[page.id] || 'view';
                            return (
                                <div key={page.id} className="flex items-center justify-between p-3 bg-white rounded-xl border border-slate-200 shadow-sm hover:border-blue-300 transition-colors">
                                    <span className="font-bold text-xs text-slate-800">{page.label}</span>
                                    <select 
                                        className={`text-xs font-black px-3 py-1.5 rounded-lg border outline-none transition-colors ${
                                            currentPerm === 'none' ? 'bg-red-50 text-red-700 border-red-200' :
                                            currentPerm === 'view' ? 'bg-amber-50 text-amber-700 border-amber-200' :
                                            currentPerm === 'edit' ? 'bg-blue-50 text-blue-700 border-blue-200' :
                                            'bg-emerald-50 text-emerald-700 border-emerald-200'
                                        }`}
                                        value={currentPerm}
                                        onChange={e => handleUpdatePagePerm(selectedRoleForPerm, page.id, e.target.value)}
                                        disabled={selectedRoleForPerm === 'ผู้ดูแลระบบ'}
                                    >
                                        <option value="none">❌ ไม่ให้เห็น / ซ่อนเมนู</option>
                                        <option value="view">👁️ ดูได้อย่างเดียว (View Only)</option>
                                        <option value="edit">✏️ ดูและแก้ไขได้ (View & Edit)</option>
                                        <option value="full">⚡ สิทธิ์สมบูรณ์ (Full Access)</option>
                                    </select>
                                </div>
                            );
                        })}
                    </div>

                    <div className="pt-4 border-t border-slate-100 flex justify-between items-center">
                        <span className="text-[11px] font-bold text-slate-400">* ระบบจะบันทึกและปรับสิทธิ์โดยทันที</span>
                        <div className="flex gap-2">
                            <button type="button" onClick={() => setShowRolePermissionsModal(false)} className={btnClassSecondary}>ปิด</button>
                            <button type="button" onClick={handleSaveRolePermissions} className={btnClassPrimary}>บันทึกสิทธิ์การเข้าใช้งาน</button>
                        </div>
                    </div>
                </div>
            </EditModal>
            
            <EditModal isOpen={showForm} onClose={() => setShowForm(false)} title={isEditing ? 'แก้ไขผู้ใช้งาน' : 'เพิ่มผู้ใช้งานใหม่'} icon={UserCircle}>
                <form onSubmit={handleSaveUser} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div><label className={labelClassHud}>รหัสผู้ใช้</label><input type="text" disabled={isEditing} className={inputClassHud} value={formData.id} onChange={e=>setFormData({...formData,id:e.target.value})}/></div>
                  <div><label className={labelClassHud}>ชื่อ - นามสกุล</label><input type="text" className={inputClassHud} required value={formData.name} onChange={e=>setFormData({...formData,name:e.target.value})}/></div>
                  <div><label className={labelClassHud}>Username (สำหรับการเข้าสู่ระบบ)</label><input type="text" className={inputClassHud} required value={formData.username} disabled={isEditing} onChange={e=>setFormData({...formData,username:e.target.value})}/></div>
                  <div><label className={labelClassHud}>Password</label><input type="text" className={inputClassHud} required value={formData.password} onChange={e=>setFormData({...formData,password:e.target.value})}/></div>
                  <div><label className={labelClassHud}>สิทธิ์การเข้าใช้งาน (Role)</label><select className={inputClassHud} value={formData.role} onChange={e=>setFormData({...formData,role:e.target.value})}>{Object.keys(rolePermissions).map(r => <option key={r} value={r}>{r}</option>)}</select></div>
                  <div><label className={labelClassHud}>สถานะ</label><select className={inputClassHud} value={formData.status} onChange={e=>setFormData({...formData,status:e.target.value})}><option value="เข้าใช้งาน">เข้าใช้งาน</option><option value="ระงับการเข้าใช้งาน">ระงับการเข้าใช้งาน</option></select></div>
                  <div className="md:col-span-2 text-right pt-4 border-t border-slate-100 mt-2 flex justify-end gap-3"><button type="button" onClick={()=>setShowForm(false)} className={btnClassSecondary}>ยกเลิก</button><button type="submit" disabled={isSubmitting} className={btnClassPrimary}>{isSubmitting ? 'กำลังบันทึก...' : 'บันทึกข้อมูล'}</button></div>
                </form>
            </EditModal>

            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
              <h2 className="text-2xl font-bold text-slate-800">สิทธิ์การเข้าใช้งานระบบ (System Users)</h2>
              <div className="flex flex-wrap w-full sm:w-auto items-center gap-3">
                 <div className="flex items-center bg-slate-50/30 focus-within:bg-white border border-slate-200 rounded-xl px-3 shadow-sm focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-100 transition-all duration-300 flex-1 sm:w-64 h-[38px] sm:h-[40px]">
                    <SearchIcon size={18} className="text-slate-400 shrink-0" />
                    <input type="text" placeholder="ค้นหารหัส, ชื่อ, username..." className="w-full bg-transparent border-none outline-none text-[13px] font-medium text-slate-800 placeholder-slate-400 pl-2 h-full" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                 </div>
                 {isAdmin && (
                    <button onClick={() => setShowRolePermissionsModal(true)} className="px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-blue-400 font-black rounded-xl text-xs flex items-center gap-2 shadow-sm transition-all border border-slate-700">
                        <ShieldCheck size={16} /> กำหนดสิทธิ์บทบาท
                    </button>
                 )}
                 <button onClick={handleOpenAdd} className={`${btnClassPrimary} shrink-0`}><Plus size={18}/> เพิ่มผู้ใช้</button>
              </div>
            </div>
            
            <div className={`${boxWrapper} p-0 overflow-hidden`}>
              <div className="overflow-x-auto">
                <table className="w-full text-left">
                  <thead>
                    <tr>
                      <th className={tableHeaderClass}>รหัส</th>
                      <th className={tableHeaderClass}>ชื่อ-นามสกุล</th>
                      <th className={tableHeaderClass}>Username</th>
                      <th className={tableHeaderClass}>สิทธิ์ (Role)</th>
                      <th className={tableHeaderClass}>สถานะ</th>
                      <th className={`${tableHeaderClass} text-center`}>จัดการ</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredUsers.map(p=>(
                      <tr key={p?.id || Math.random()} className="hover:bg-blue-50/50 transition-colors">
                        <td className={tableCellClass}>{p?.id}</td>
                        <td className={`${tableCellClass} font-bold text-slate-800`}>{p?.name}</td>
                        <td className={`${tableCellClass} text-blue-600 font-bold`}>{p?.username}</td>
                        <td className={tableCellClass}><span className={`text-[11px] font-bold px-3 py-1.5 rounded-lg border ${p?.role === 'ผู้ดูแลระบบ' ? 'bg-fuchsia-50 text-fuchsia-700 border-fuchsia-200' : 'bg-blue-50 text-blue-700 border-blue-200'}`}>{p?.role}</span></td>
                        <td className={tableCellClass}><span className={`text-[11px] font-bold px-3 py-1.5 rounded-lg border ${p?.status === 'เข้าใช้งาน' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-red-50 text-red-700 border-red-200'}`}>{p?.status}</span></td>
                        <td className={`${tableCellClass} text-center`}>
                          <button onClick={()=>handleOpenEdit(p)} className="text-blue-500 hover:text-blue-700 mx-2 transition-colors bg-white p-1.5 rounded-lg border border-slate-200 shadow-sm"><Edit size={16}/></button>
                          {p?.username !== 'admin' && <button onClick={()=>setConfirmDelete({show: true, id: p.id, title: p.name})} className="text-red-500 hover:text-red-700 transition-colors bg-white p-1.5 rounded-lg border border-slate-200 shadow-sm"><Trash2 size={16}/></button>}
                        </td>
                      </tr>
                    ))}
                    {filteredUsers.length === 0 && <tr><td colSpan="6" className="p-10 text-center text-slate-500 font-bold bg-slate-50/50">ไม่พบข้อมูลที่ค้นหา</td></tr>}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
    };

    // ==========================================
    // 📌 React App (Main Component)
    // ==========================================
    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      
      const [products, setProducts] = useState([]);
      const [customerTypes, setCustomerTypes] = useState(fallbackCustomerTypes);
      const [closers, setClosers] = useState([]);
      const [members, setMembers] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [sales, setSales] = useState([]);
      const [systemUsers, setSystemUsers] = useState([]);
      const [isAppLoading, setIsAppLoading] = useState(false);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try {
          return localStorage.getItem('stk_sidebar_collapsed') === 'true';
        } catch(e) {
          return false;
        }
      });
      
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
      };

      const SCRIPT_URL = "<?= getScriptUrl() ?>";

      const isAdmin = currentUser && (
          String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || 
          String(currentUser.role).trim().toLowerCase() === 'admin'
      );
      const currentUserProfileUrl = currentUser?.profileUrl || '';

      useEffect(() => {
        const savedUserStr = localStorage.getItem('stk_current_user');
        if (savedUserStr) {
          const user = JSON.parse(savedUserStr);
          setCurrentUser(user);
          setIsLoggedIn(true);
        } else {
          setShowLoginModal(true);
        }

        const initialLoader = document.getElementById('initial-loader');
        if (initialLoader) {
            initialLoader.style.display = 'none';
        }

        Promise.all([
          supabaseSelect('stk_members').catch(() => []),
          supabaseSelect('stk_closers').catch(() => [])
        ]).then(([memRes, cloRes]) => {
          if (Array.isArray(memRes)) {
              setMembers(memRes);
              setSystemUsers(memRes);
          }
          if (Array.isArray(cloRes)) setClosers(cloRes);
        }).catch(err => {
          console.error("Supabase load error:", err);
        }).finally(() => {
          setIsAppLoading(false);
        });
      }, []);

      const applyDataToStates = (response) => {
           if (Array.isArray(response.products)) setProducts(response.products);
           if (Array.isArray(response.customerTypes)) setCustomerTypes(response.customerTypes);
           if (Array.isArray(response.closers)) setClosers(response.closers);
           if (Array.isArray(response.members)) {
               const formattedMembers = response.members.map(m => ({
                   id: String(m.id || m.user_id || m.User_ID || '').trim(),
                   name: String(m.name || m.Name || '').trim(),
                   username: String(m.username || m.Username || m.user_id || m.id || '').trim(),
                   referrer: String(m.referrer || m.sponsor_id || m.Sponsor_ID || '').trim(),
                   team: String(m.team || m.business_team || m.Business_Team || 'Marketing').trim(),
                   role: String(m.role || m.permission_role || m.Permission_Role || 'พนักงานทั่วไป').trim(),
                   status: String(m.status || m.Status || 'เข้าใช้งาน').trim(),
                   profileUrl: m.profile_url || m.id_card_url || m.ID_Card_URL || '',
                   phone: m.phone || m.phone_number || m.Phone_Number || '',
                   email: m.email || m.Email || ''
               })).filter(m => m.id !== '');
               setMembers(formattedMembers);
           }
           if (Array.isArray(response.customers)) setCustomers(response.customers);
           if (Array.isArray(response.systemUsers)) setSystemUsers(response.systemUsers);
           
           if (Array.isArray(response.sales)) {
               const processedSales = response.sales.map(s => {
                   let sumF = 0, sumP = 0, sumZ = 0;
                   Object.keys(s).forEach(k => {
                       if (k !== 'รวมชิ้นราคาเต็ม' && k !== 'รวมชิ้นราคาโปร' && k !== 'รวมชิ้นราคาศูนย์' && k !== 'ยอดรวมชิ้นทั้งหมด') {
                           if (k.endsWith('_ราคาเต็ม')) sumF += (parseInt(s[k]) || 0);
                           else if (k.endsWith('_ราคาโปร')) sumP += (parseInt(s[k]) || 0);
                           else if (k.endsWith('_ราคาศูนย์')) sumZ += (parseInt(s[k]) || 0);
                       }
                   });
                   s['รวมชิ้นราคาเต็ม'] = sumF; s['รวมชิ้นราคาโปร'] = sumP; s['รวมชิ้นราคาศูนย์'] = sumZ;
                   s['ยอดรวมชิ้นทั้งหมด'] = sumF + sumP + sumZ;
                   return s;
               });
               setSales(processedSales);
           }
      };

      const handleLoginSuccess = (user) => {
        localStorage.setItem('stk_current_user', JSON.stringify(user));
        setCurrentUser(user);
        setIsLoggedIn(true);
        setShowLoginModal(false);
        showToast('เข้าสู่ระบบสำเร็จ!', 'success');
      };

      const handleLogout = () => {
        localStorage.removeItem('stk_current_user');
        setCurrentUser(null);
        setIsLoggedIn(false);
        const targetUrl = typeof resolvePageUrl === 'function' ? resolvePageUrl('?page=dashboard') : 'Mlm.html';
        if (typeof window !== 'undefined') window.location.href = targetUrl;
      };

      return (
        <div className="min-h-screen flex flex-col lg:flex-row font-sans bg-slate-50">
          <Sidebar 
            activePage="system_users" 
            isLoggedIn={isLoggedIn} 
            currentUser={currentUser} 
            currentUserProfileUrl={currentUserProfileUrl} 
            isAdmin={isAdmin} 
            onLogout={handleLogout} 
            showLoginModal={showLoginModal} 
            setShowLoginModal={setShowLoginModal} 
            SCRIPT_URL={SCRIPT_URL}
            setIsAppLoading={setIsAppLoading}
            isSidebarCollapsed={isSidebarCollapsed}
            setIsSidebarCollapsed={setIsSidebarCollapsed}
          />
          
          <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>
            
            {toast.show && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4 animation-fade-in" style={{ animationDuration: '0.2s' }}>
                 <div className={`bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center animation-pop border-t-4 ${toast.type === 'error' ? 'border-red-500' : toast.type === 'info' ? 'border-blue-500' : 'border-emerald-500'}`}>
                    <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${toast.type === 'error' ? 'bg-red-100 text-red-500' : toast.type === 'info' ? 'bg-blue-100 text-blue-500' : 'bg-emerald-100 text-emerald-500'}`}>
                       {toast.type === 'error' ? <X size={32} /> : toast.type === 'info' ? <Trophy size={32} /> : <CheckCircle size={32} />}
                    </div>
                    <h3 className="text-xl font-bold text-slate-800 mb-2">{toast.type === 'error' ? 'เกิดข้อผิดพลาด' : toast.type === 'info' ? 'แจ้งเตือน' : 'สำเร็จ!'}</h3>
                    <p className="text-slate-600 font-medium text-sm mb-6">{toast.message}</p>
                    <button onClick={() => setToast({ ...toast, show: false })} className="w-full py-2.5 rounded-lg font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">ตกลง</button>
                 </div>
              </div>
            )}

            <div className="p-3 sm:p-6 flex-1 w-full relative z-0">
              <div className="w-full relative z-10">
                {isAppLoading ? (
                  <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                    <div className="w-16 h-16 border-[4px] border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                    <h2 className="text-lg font-bold text-slate-700">กำลังโหลดข้อมูล...</h2>
                    <p className="text-slate-500 text-sm">กรุณารอสักครู่ ระบบกำลังดึงข้อมูลล่าสุด</p>
                  </div>
                ) : isLoggedIn ? (
                  isAdmin ? (
                    <SystemUsersManagementView 
                      systemUsers={systemUsers} 
                      setSystemUsers={setSystemUsers} 
                      members={members}
                      isAdmin={isAdmin} 
                      showToast={showToast} 
                    />
                  ) : (
                    <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                      <h2 className="text-xl font-black text-red-500">คุณไม่มีสิทธิ์เข้าถึงหน้านี้</h2>
                      <p className="text-slate-500 text-sm">เฉพาะผู้ดูแลระบบ (Admin) เท่านั้นที่สามารถจัดการผู้ใช้งานได้</p>
                    </div>
                  )
                ) : (
                  <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                    <h2 className="text-xl font-black text-red-500">กรุณาเข้าสู่ระบบก่อนเข้าใช้งาน</h2>
                    <button onClick={() => setShowLoginModal(true)} className={btnClassPrimary}>เข้าสู่ระบบ</button>
                  </div>
                )}
              </div>
            </div>

            <footer className="w-full text-center py-6 mt-auto border-t border-slate-200/50 no-print shrink-0">
               <p className="text-[11px] font-bold text-slate-400 opacity-60 hover:opacity-100 transition-opacity">
                  &copy; {new Date().getFullYear()} STK Sales Management System. Developed by Sackda Southammavong.
               </p>
            </footer>

          </main>

          <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={systemUsers} />

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
