      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="8" r="7" />

      </svg>
    );
    const CampHourglassIcon = ({ size = 36, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" className={className}>

      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>

    const CampSparklesIcon = ({ size = 32, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" />
        <path d="M5 3v4" />
        <path d="M19 17v4" />
        <path d="M3 5h4" />
        <path d="M17 19h4" />
      </svg>
    );

    // ==========================================
    // 📌 Dashboard View Component
    // ==========================================
    const DashboardView = ({ sales, members, customers, isAdmin, activeCustomerTypes, businessTeams, initialTargetHistory, fetchSalesForPeriod, fetchFreshData, isSyncing }) => {
        const todayStr = getLocalISODate();
        const firstDayOfMonthStr = `${todayStr.substring(0, 7)}-01`;
        const defaultRange = window.MlmLogic ? window.MlmLogic.getDefaultMonthRange() : { start: `${new Date().getFullYear()}-01-01`, end: `${new Date().getFullYear()}-12-31` };
        const [dashStartDate, setDashStartDate] = useState(defaultRange.start);
        const [dashEndDate, setDashEndDate] = useState(defaultRange.end);
        
        // Ensure sales are fetched when dates change
        const [lastFetchedRange, setLastFetchedRange] = useState({ start: defaultRange.start, end: defaultRange.end });
        useEffect(() => {
            if (dashStartDate !== lastFetchedRange.start || dashEndDate !== lastFetchedRange.end) {
                if (fetchSalesForPeriod) {
                    fetchSalesForPeriod(dashStartDate, dashEndDate);
                    setLastFetchedRange({ start: dashStartDate, end: dashEndDate });
                }
            }
        }, [dashStartDate, dashEndDate, fetchSalesForPeriod, lastFetchedRange]);
        const [dashboardTarget, setDashboardTarget] = useState(() => { try { const saved = localStorage.getItem('stk_dashboard_target'); return saved ? Number(saved) : 4000; } catch(e){ return 4000; } });
        const [topSalesTarget, setTopSalesTarget] = useState(() => { try { const saved = localStorage.getItem('stk_top_sales_target'); return saved ? Number(saved) : 4000; } catch(e){ return 4000; } });
        const [topCheckupTarget, setTopCheckupTarget] = useState(() => { try { const saved = localStorage.getItem('stk_top_checkup_target'); return saved ? Number(saved) : 200; } catch(e){ return 200; } });
        const [competitionPage, setCompetitionPage] = useState(0);
        const [showGoalCompetition, setShowGoalCompetition] = useState(false);

        // 🏆 Campaign System State
        const [activeCampaigns, setActiveCampaigns] = useState([]);
        const [campaignCollapsedMap, setCampaignCollapsedMap] = useState({});

        const loadCampaigns = useCallback(async () => {
            if (typeof window.CampaignEngine !== 'undefined' && typeof window.CampaignEngine.fetchActiveCampaigns === 'function') {
                try {
                    const camps = await window.CampaignEngine.fetchActiveCampaigns();
                    setActiveCampaigns(Array.isArray(camps) ? camps : []);
                } catch(e) {
                    console.warn("loadCampaigns error:", e);
                }
            }
        }, []);

        useEffect(() => {
            loadCampaigns();
        }, [loadCampaigns]);

        const campaignSections = useMemo(() => {
            if (!window.CampaignEngine || !Array.isArray(activeCampaigns) || activeCampaigns.length === 0) return [];
            return activeCampaigns.map(camp => {
                const results = window.CampaignEngine.calcCampaignResults(camp, sales, members, customers, businessTeams);
                const passed = results.filter(r => r.passed);
                const notPassed = results.filter(r => !r.passed);
                return { campaign: camp, results, passed, notPassed };
            });
        }, [activeCampaigns, sales, members, customers, businessTeams]);

        const [targetHistory, setTargetHistory] = useState(initialTargetHistory || []);
        const [showTargetHistoryModal, setShowTargetHistoryModal] = useState(false);
        const [targetHistorySearch, setTargetHistorySearch] = useState('');
        const [targetHistoryFilterStart, setTargetHistoryFilterStart] = useState('');
        const [targetHistoryFilterEnd, setTargetHistoryFilterEnd] = useState('');
        const globalTargetDebounceRef = useRef(null);
        const memberTargetDebounceRef = useRef({});

        useEffect(() => {
            if (Array.isArray(initialTargetHistory) && initialTargetHistory.length > 0) {
                setTargetHistory(initialTargetHistory);
                
                const sorted = [...initialTargetHistory].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                
                const latestDash = sorted.find(t => t.targetType === 'เป้ายอดขายรวม');
                if (latestDash && latestDash.targetValue > 0) setDashboardTarget(latestDash.targetValue);
                
                const latestSales = sorted.find(t => t.targetType === 'เป้ายอดขายสูงสุด');
                if (latestSales && latestSales.targetValue > 0) setTopSalesTarget(latestSales.targetValue);
                
                const latestCheckup = sorted.find(t => t.targetType === 'เป้าคนมาตรวจรวม');
                if (latestCheckup && latestCheckup.targetValue > 0) setTopCheckupTarget(latestCheckup.targetValue);
                
                const latestGlobalInd = sorted.find(t => t.targetType === 'เป้าหมายรวมทุกคน');
                if (latestGlobalInd && latestGlobalInd.targetValue > 0) setGlobalIndividualTarget(latestGlobalInd.targetValue);
            }
        }, [initialTargetHistory]);

        const recordTargetHistory = (targetVal, type = 'เป้าหมายรวมทุกคน', memberId = 'ALL', notes = '') => {
            const num = Number(targetVal) || 0;
            if (num <= 0) return;

            const nowDate = getLocalISODate();
            const nowTime = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            const newLogObj = {
                id: 'TGT-' + Date.now(),
                date: nowDate + ' ' + nowTime,
                period: nowDate.substring(0, 7),
                targetValue: num,
                targetType: type,
                memberId: memberId,
                setBy: 'ผู้ดูแลระบบ (Admin)',
                notes: notes || (type === 'เป้าหมายรวมทุกคน' ? 'ตั้งเป้าหมายรวมทุกคน' : `ตั้งเป้าหมายรายบุคคล: ${memberId}`)
            };

            setTargetHistory(prev => [newLogObj, ...(prev || [])]);

            if (typeof window.supabaseInsert === 'function') {
                const sbPayload = {
                    period: newLogObj.period,
                    target_value: newLogObj.targetValue,
                    target_type: newLogObj.targetType,
                    member_id: newLogObj.memberId,
                    set_by: newLogObj.setBy,
                    notes: newLogObj.notes
                };
                window.supabaseInsert('stk_target_history', sbPayload)
                    .catch(err => console.error("Error saving target history to Supabase:", err));
            }
        };

        const [globalIndividualTarget, setGlobalIndividualTarget] = useState(() => {
            try {
                const saved = localStorage.getItem('stk_global_individual_target');
                if (saved && !isNaN(saved)) return Number(saved);
            } catch(e) {}
            return 200;
        });

        const [customMemberTargets, setCustomMemberTargets] = useState(() => {
            try {
                const saved = localStorage.getItem('stk_custom_member_targets');
                if (saved) return JSON.parse(saved);
            } catch(e) {}
            return {};
        });

        const handleGlobalIndividualTargetChange = (val) => {
            setGlobalIndividualTarget(val);
            const num = Number(val);
            if (val !== '' && !isNaN(num) && num > 0) {
                try { localStorage.setItem('stk_global_individual_target', num); } catch(e) {}
                setCustomMemberTargets({});
                try { localStorage.removeItem('stk_custom_member_targets'); } catch(e) {}
                // Debounce: บันทึกประวัติเฉพาะตอนหยุดพิมพ์ 800ms
                if (globalTargetDebounceRef.current) clearTimeout(globalTargetDebounceRef.current);
                globalTargetDebounceRef.current = setTimeout(() => {
                    recordTargetHistory(num, 'เป้าหมายรวมทุกคน', 'ALL', 'ปรับเป้าหมายทุกคนในครั้งเดียว');
                }, 800);
            }
        };

        const handleDashboardTargetChange = (val) => {
            const v = val.replace(/,/g, '');
            if (!isNaN(v) && v !== '') {
                const num = Number(v);
                setDashboardTarget(num);
                try { localStorage.setItem('stk_dashboard_target', num); } catch(err){}
                if (window._dashDebounce) clearTimeout(window._dashDebounce);
                window._dashDebounce = setTimeout(() => {
                    recordTargetHistory(num, 'เป้ายอดขายรวม', 'ALL', 'ปรับเป้าหมายยอดขายรวม');
                }, 800);
            } else if (v === '') {
                setDashboardTarget('');
                try { localStorage.removeItem('stk_dashboard_target'); } catch(err){}
            }
        };

        const handleTopSalesTargetChange = (val) => {
            const v = val.replace(/,/g, '');
            if (!isNaN(v) && v !== '') {
                const num = Number(v);
                setTopSalesTarget(num);
                try { localStorage.setItem('stk_top_sales_target', num); } catch(err){}
                if (window._salesDebounce) clearTimeout(window._salesDebounce);
                window._salesDebounce = setTimeout(() => {
                    recordTargetHistory(num, 'เป้ายอดขายสูงสุด', 'ALL', 'ปรับเป้าหมายยอดขายสูงสุด');
                }, 800);
            } else if (v === '') {
                setTopSalesTarget('');
                try { localStorage.removeItem('stk_top_sales_target'); } catch(err){}
            }
        };

        const handleTopCheckupTargetChange = (val) => {
            const v = val.replace(/,/g, '');
            if (!isNaN(v) && v !== '') {
                const num = Number(v);
                setTopCheckupTarget(num);
                try { localStorage.setItem('stk_top_checkup_target', num); } catch(err){}
                if (window._checkupDebounce) clearTimeout(window._checkupDebounce);
                window._checkupDebounce = setTimeout(() => {
                    recordTargetHistory(num, 'เป้าคนมาตรวจรวม', 'ALL', 'ปรับเป้าหมายคนมาตรวจรวม');
                }, 800);
            } else if (v === '') {
                setTopCheckupTarget('');
                try { localStorage.removeItem('stk_top_checkup_target'); } catch(err){}
            }
        };

        const handleUpdateMemberTarget = (memberId, targetVal) => {
            const num = Math.max(1, Number(targetVal) || 1);
            setCustomMemberTargets(prev => {
                const updated = { ...prev, [memberId]: num };
                try { localStorage.setItem('stk_custom_member_targets', JSON.stringify(updated)); } catch(e) {}
                return updated;
            });
            // Debounce per member: บันทึกเฉพาะตอนหยุดพิมพ์ 800ms
            if (memberTargetDebounceRef.current[memberId]) clearTimeout(memberTargetDebounceRef.current[memberId]);
            memberTargetDebounceRef.current[memberId] = setTimeout(() => {
                recordTargetHistory(num, 'เป้าหมายรายบุคคล', memberId, `ตั้งเป้าหมายรายบุคคล (${memberId})`);
            }, 800);
        };

        // แก้ไขให้เริ่มต้นเป็น firstDayOfMonthStr จะได้เห็นข้อมูลตอนเทสต์ง่ายขึ้น
        const [dailyTopSalesStartDate, setDailyTopSalesStartDate] = useState(firstDayOfMonthStr);
        const [dailyTopSalesEndDate, setDailyTopSalesEndDate] = useState(todayStr);

        const activeBusinessTeams = useMemo(() => {
            return window.MlmLogic ? window.MlmLogic.filterActiveBusinessTeams(businessTeams) : [];
        }, [businessTeams]);

        const activeTeamMembers = useMemo(() => {
            return window.MlmLogic ? window.MlmLogic.filterActiveTeamMembers(members, businessTeams) : (members || []);
        }, [members, businessTeams]);

        const teamStats = useMemo(() => {
            if (!window.MlmLogic) return { teamsList: [], memberTargetData: [] };
            return window.MlmLogic.calcTeamStats({
                sales, members, activeBusinessTeams, activeTeamMembers,
                dashStartDate, dashEndDate, customMemberTargets, globalIndividualTarget
            });
        }, [sales, members, activeBusinessTeams, activeTeamMembers, dashStartDate, dashEndDate, customMemberTargets, globalIndividualTarget]);

        const teamTopStats = useMemo(() => {
            if (!window.MlmLogic) return [];
            return window.MlmLogic.calcTeamTopStats({
                sales, members, activeBusinessTeams, customers, dashStartDate, dashEndDate
            });
        }, [sales, members, activeBusinessTeams, dashStartDate, dashEndDate, customers]);

        const topPerformanceData = useMemo(() => {
            if (!window.MlmLogic) return [];
            return window.MlmLogic.calcTopPerformanceData({
                sales, customers, members, dashStartDate, dashEndDate
            });
        }, [sales, customers, members, dashStartDate, dashEndDate]);

        const podiumData = useMemo(() => {
            return window.MlmLogic ? window.MlmLogic.calcPodiumData(topPerformanceData) : [];
        }, [topPerformanceData]);

        const topCheckupPerformanceData = useMemo(() => {
            if (!window.MlmLogic) return [];
            return window.MlmLogic.calcTopCheckupPerformanceData({
                sales, customers, members, dashStartDate, dashEndDate
            });
        }, [sales, customers, members, dashStartDate, dashEndDate]);

        const checkupPodiumData = useMemo(() => {
            return window.MlmLogic ? window.MlmLogic.calcCheckupPodiumData(topCheckupPerformanceData) : [];
        }, [topCheckupPerformanceData]);

        const rank4to10Data = useMemo(() => topPerformanceData.slice(3, 10), [topPerformanceData]);

        const maxPerfStats = useMemo(() => {
            return window.MlmLogic ? window.MlmLogic.calcMaxPerfStats(topPerformanceData) : { maxFull: 1, maxOld: 1, maxNew: 1 };
        }, [topPerformanceData]);

        const dailyTopSales = useMemo(() => {
            if (!window.MlmLogic) return [];
            return window.MlmLogic.calcDailyTopSales({
                sales, members, dailyTopSalesStartDate, dailyTopSalesEndDate
            });
        }, [sales, members, dailyTopSalesStartDate, dailyTopSalesEndDate]);

        const [zeroSalesStartDate, setZeroSalesStartDate] = useState(firstDayOfMonthStr);
        const [zeroSalesEndDate, setZeroSalesEndDate] = useState(todayStr);

        const zeroSalesData = useMemo(() => {
            if (!window.MlmLogic) return [];
            return window.MlmLogic.calcZeroSalesData({
                members, sales, activeBusinessTeams, activeTeamMembers, zeroSalesStartDate, zeroSalesEndDate
            });
        }, [members, sales, activeBusinessTeams, activeTeamMembers, zeroSalesStartDate, zeroSalesEndDate]);

        const [custTypeStartDate, setCustTypeStartDate] = useState(firstDayOfMonthStr);

                                                                    </div>
                                                                </div>
                                                            )}

                                                    </div>

                                            })}
                                        </div>
                                    )}
                                </div>
                            </div>

                    </div>

            {/* 🟢 การแข่งขันความคืบหน้าเป้าหมาย (จำกัด 6 ทีม/หน้า ถ้ามีไม่ถึง 6 ทีมจะอยู่หน้าเดียว ถ้าเกิน 6 ทีมจะมีปุ่มเลื่อนหน้า) */}

                                    >
                                        <ChevronLeftIcon size={18} />
                                    </button>

                                        <span className="text-xs font-black text-rose-400">หน้า {safeCompetitionPage + 1}</span>

                                        type="button"

                                                     <div className="relative mb-2 flex flex-col items-center shrink-0">
                                                         <img src={avatarUrl} className="w-12 h-12 sm:w-14 sm:h-14 rounded-full object-cover shadow-2xl bg-slate-700 border-2 border-slate-500 transition-all" />

                                    {rest.length > 0 && (

                                                      <span className="w-5 h-5 flex items-center justify-center bg-slate-800 text-slate-300 rounded-full text-[9px] font-black shrink-0 border border-slate-600 shadow-inner">{idx + 6}</span>
                                                      <img src={avatarUrl} className="w-6 h-6 rounded-full object-cover border border-slate-500 shrink-0" />
                                                      <span className="text-[10px] sm:text-[11px] font-bold text-slate-200 flex-1 truncate" title={m.name}>{m.name}</span>
                                                      <span className="text-[9px] font-black text-slate-400 bg-black/40 px-1.5 py-0.5 rounded shadow-sm border border-white/10 shrink-0">0 กล่อง</span>
                                                  </div>
                                               );
                                           })}
                                       </div>
                                    )}
                                 </div>
                              )}
                          </div>
                       );
                   })}
                </div>
             </div>

             <div className="w-full mb-5 rounded-2xl flex flex-col bg-gradient-to-b from-slate-900 via-slate-800 to-slate-900 shadow-2xl relative overflow-hidden py-4 sm:py-6 px-3 sm:px-6 min-h-0">
                <div className="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none opacity-[0.03] z-0">
                    <div className="absolute top-1/2 left-1/4 w-96 h-96 bg-blue-500 rounded-full blur-[120px]"></div>
                </div>

                <div className="mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-700/50 pb-4 shrink-0 relative z-10">
                  <div>
                     <h3 className="text-xl sm:text-2xl font-black text-white flex items-center gap-3"><Activity size={24} className="text-blue-500"/> ความคืบหน้าเป้าหมายรายบุคคล</h3>
                     <p className="text-[11px] sm:text-[12px] text-slate-400 mt-1 font-medium">เปรียบเทียบยอดขายกับเป้าหมาย <span className="text-rose-400 font-bold">(นับเฉพาะราคาเต็ม)</span></p>
                  </div>
                  <div className="flex flex-wrap items-center gap-3">
                     <div className="flex items-center gap-2 bg-slate-950 px-3.5 py-2 rounded-xl border border-slate-800 text-slate-300 shadow-inner">
                        <span className="text-[11px] sm:text-[12px] font-bold text-slate-300">ตั้งเป้าหมายทุกคน:</span>
                        <input type="number" min="1" className="w-16 bg-slate-900 border border-slate-700 text-blue-400 font-black text-[12px] sm:text-[13px] rounded-lg px-2 py-1 outline-none focus:border-blue-400 text-center" value={globalIndividualTarget} onChange={e => handleGlobalIndividualTargetChange(e.target.value)} title="เปลี่ยนเป้าหมายของพนักงานทุกคนพร้อมกันในครั้งเดียว" />
                        <span className="text-[11px] sm:text-[12px] font-bold text-slate-400">กล่อง</span>
                     </div>
                     <button
                        type="button"
                        onClick={() => setShowTargetHistoryModal(true)}
                        className="bg-slate-950 hover:bg-slate-900 text-amber-400 font-bold text-[11px] sm:text-[12px] px-3.5 py-2 rounded-xl border border-slate-800 shadow-sm flex items-center gap-1.5 transition-all hover:border-amber-400/50 cursor-pointer"
                        title="คลิกเพื่อดูประวัติการตั้งเป้าหมายย้อนหลัง"
                     >
                        <Archive size={15} className="text-amber-400" />

                     </button>
                     <div className="flex gap-3 text-[11px] sm:text-[12px] font-bold bg-slate-950 px-3.5 py-2 rounded-xl border border-slate-800 text-slate-300 shadow-inner">
                        <div className="flex items-center gap-2"><div className="w-3 h-3 border border-slate-600 bg-slate-800 rounded-sm"></div> เป้าหมาย</div>
                        <div className="flex items-center gap-2"><div className="w-3 h-3 bg-blue-500 rounded-sm"></div> ยอดที่ทำได้</div>
                     </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-1.5 sm:gap-2 relative z-10 pt-1 pb-3">
                  {paginatedProgressData.map((d, idx) => {
                     const globalIndex = (progressPage - 1) * ITEMS_PER_PAGE + idx;
                     const percent = Math.min((d.actual / d.target) * 100, 100);
                     const remaining = Math.max(d.target - d.actual, 0);
                     const memInfo = (members || []).find(m => m.id === d.id);
                     const avatarUrl = cleanAvatarUrl(memInfo?.profileUrl, d.name);
                     return (
                        <div key={d.id} className="flex items-center gap-2 sm:gap-2.5 bg-slate-800/40 p-1.5 sm:p-2 rounded-xl border border-slate-700/50 hover:bg-slate-800/80 hover:border-slate-600 transition-colors group shadow-sm">
                           <div className="relative shrink-0">
                              <img src={avatarUrl} className="w-8 h-8 sm:w-9 sm:h-9 rounded-full object-cover border border-slate-500 shadow-md bg-slate-700 group-hover:border-blue-400 transition-colors" />
                              <div className={`absolute -top-1 -left-1 w-3.5 h-3.5 sm:w-4 sm:h-4 flex items-center justify-center text-[7px] sm:text-[8px] font-black rounded-full border border-slate-800 shadow-sm ${globalIndex === 0 ? 'bg-yellow-400 text-yellow-900 scale-110' : globalIndex === 1 ? 'bg-slate-300 text-slate-800' : globalIndex === 2 ? 'bg-orange-500 text-white' : 'bg-slate-600 text-slate-200'}`}>
                                 {globalIndex + 1}
                              </div>
                           </div>
                           <div className="flex-1 flex flex-col min-w-0 justify-center">
                              <div className="flex justify-between items-center mb-1">
                                 <span className="text-[9px] sm:text-[10px] font-bold text-slate-200 truncate group-hover:text-white transition-colors">{d.name}</span>
                              </div>
                              <div className="w-full h-1 sm:h-1.5 bg-slate-950/80 rounded-full overflow-hidden border border-slate-800/50 shadow-inner relative mb-1">
                                 <div className="h-full bg-gradient-to-r from-blue-700 via-blue-500 to-sky-400 rounded-full transition-all duration-1000 ease-out relative shadow-[0_0_8px_rgba(56,189,248,0.6)]" style={{ width: `${percent}%` }}></div>
                              </div>
                              
                              <div className="flex justify-between items-center w-full">
                                 <span className="text-[7px] sm:text-[8px] font-medium text-rose-400/90">เหลือ {Number(remaining).toLocaleString()}</span>
                                 <span className="text-[8px] sm:text-[9px] font-bold text-slate-400 shrink-0 flex items-baseline gap-0.5">
                                    ยอด: <span className="text-white drop-shadow-[0_0_6px_rgba(56,189,248,0.8)] text-[12px] sm:text-[14px] font-black">{Number(d.actual).toLocaleString()}</span> <span className="opacity-50 text-[7px] sm:text-[8px]">/</span> <input type="number" min="1" className="w-12 bg-slate-950/80 border border-slate-700/80 text-blue-300 font-bold text-[9px] sm:text-[10px] rounded px-1 text-center outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400" value={d.target} onChange={e => handleUpdateMemberTarget(d.id, e.target.value)} title="คลิกเพื่อแก้ไขเป้าหมายของคนนี้" />
                                 </span>
                              </div>
                           </div>
                        </div>
                    )})}
                  {paginatedProgressData.length === 0 && <div className="w-full text-center text-slate-500 font-bold py-10 xl:col-span-4 lg:col-span-3">ไม่มีข้อมูลสมาชิกในระบบ</div>}
               </div>

               {totalProgressPages > 1 && (
                  <div className="flex justify-center items-center gap-4 mt-4 pt-3 border-t border-slate-700/50 relative z-10">
                     <button onClick={() => setProgressPage(p => Math.max(1, p - 1))} disabled={progressPage === 1} className="px-4 py-1.5 bg-slate-800 text-slate-300 text-[11px] sm:text-xs font-bold rounded-lg border border-slate-700 disabled:opacity-50 hover:bg-slate-700 hover:text-white transition-colors shadow-sm">ย้อนกลับ</button>
                     <span className="text-[10px] sm:text-[11px] font-bold text-slate-400 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 shadow-inner">หน้าที่ {progressPage} / {totalProgressPages}</span>
                     <button onClick={() => setProgressPage(p => Math.min(totalProgressPages, p + 1))} disabled={progressPage === totalProgressPages} className="px-4 py-1.5 bg-slate-800 text-slate-300 text-[11px] sm:text-xs font-bold rounded-lg border border-slate-700 disabled:opacity-50 hover:bg-slate-700 hover:text-white transition-colors shadow-sm">ถัดไป</button>
                  </div>
               )}
            </div>

            <EditModal 
                isOpen={showTargetHistoryModal} 
                onClose={() => setShowTargetHistoryModal(false)} 
                title="&#x1F4DC; ประวัติการตั้งเป้าหมายย้อนหลัง (Target Audit Log)" 
                icon={Archive}
            >
                <div className="space-y-3 text-slate-800">
                    <div className="bg-slate-900 text-white p-3 rounded-2xl border border-slate-800">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2.5">
                            <div>
                                <span className="text-xs text-amber-400 font-bold block">บันทึกประวัติเป้าหมายย้อนหลังทั้งหมด</span>
                                <span className="text-sm font-black text-slate-200">ตรวจสอบเป้าหมายตามวัน เวลา และผู้ตั้งค่า</span>
                            </div>
                            <div className="flex items-center bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs">
                                <SearchIcon size={14} className="text-slate-400 mr-2 shrink-0" />
                                <input 
                                    type="text" 
                                    placeholder="ค้นหาตามวัน, ผู้ตั้ง, ประเภท..." 
                                    className="bg-transparent text-white outline-none w-40" 
                                    value={targetHistorySearch} 
                                    onChange={e => setTargetHistorySearch(e.target.value)} 
                                />
                            </div>
                        </div>
                        <div className="flex flex-wrap items-center gap-2 mt-2.5 border-t border-slate-800 pt-2.5">
                            <span className="text-[11px] text-slate-400 font-bold shrink-0">&#x1F4C5; ช่วงวันที่:</span>
                            <div className="flex items-center gap-1.5">
                                <input 
                                    type="date" 
                                    className="bg-slate-800 border border-slate-700 text-slate-200 text-[11px] font-bold rounded-lg px-2 py-1 outline-none focus:border-amber-400 transition-colors" 
                                    value={targetHistoryFilterStart} 
                                    onChange={e => setTargetHistoryFilterStart(e.target.value)} 
                                />
                                <span className="text-slate-500 font-bold text-xs">ถึง</span>
                                <input 
                                    type="date" 
                                    className="bg-slate-800 border border-slate-700 text-slate-200 text-[11px] font-bold rounded-lg px-2 py-1 outline-none focus:border-amber-400 transition-colors" 
                                    value={targetHistoryFilterEnd} 
                                    onChange={e => setTargetHistoryFilterEnd(e.target.value)} 
                                />
                            </div>
                            {(targetHistoryFilterStart || targetHistoryFilterEnd || targetHistorySearch) && (
                                <button 
                                    onClick={() => { setTargetHistoryFilterStart(''); setTargetHistoryFilterEnd(''); setTargetHistorySearch(''); }}
                                    className="text-[11px] font-bold text-rose-400 hover:text-rose-300 bg-rose-400/10 hover:bg-rose-400/20 px-2 py-1 rounded-lg transition-colors border border-rose-400/20"
                                >
                                    &#x2715; ล้างตัวกรอง
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="max-h-[380px] overflow-y-auto overflow-x-auto border border-slate-200 rounded-2xl">
                        <table className="w-full text-left border-collapse text-xs">
                            <thead className="bg-slate-100 sticky top-0 border-b border-slate-200 z-10">
                                <tr>
                                    <th className="p-3 font-bold text-slate-700 whitespace-nowrap">วัน - เวลา</th>
                                    <th className="p-3 font-bold text-slate-700 text-center whitespace-nowrap">ประเภท</th>
                                    <th className="p-3 font-bold text-slate-700 text-center whitespace-nowrap">เป้าหมาย</th>
                                    <th className="p-3 font-bold text-slate-700 whitespace-nowrap">ผู้ตั้งค่า</th>
                                    <th className="p-3 font-bold text-slate-700">หมายเหตุ</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {(() => {
                                    const filtered = window.MlmLogic ? window.MlmLogic.filterTargetHistory({
                                        targetHistory,
                                        filterStart: targetHistoryFilterStart,
                                        filterEnd: targetHistoryFilterEnd,
                                        search: targetHistorySearch
                                    }) : (targetHistory || []);
                                    if (filtered.length === 0) return (
                                        <tr><td colSpan="5" className="p-8 text-center text-slate-400 font-bold">
                                            {(targetHistory || []).length === 0 ? 'ยังไม่มีประวัติการบันทึกเป้าหมายในระบบ' : 'ไม่พบข้อมูลตามเงื่อนไขที่กรอง'}
                                        </td></tr>
                                    );
                                    return filtered.map((item, idx) => (
                                        <tr key={item.id || idx} className={`transition-colors ${idx % 2 === 0 ? 'bg-white hover:bg-blue-50' : 'bg-slate-50 hover:bg-blue-50'}`}>
                                            <td className="p-3 font-mono font-medium text-slate-600 whitespace-nowrap text-[11px]">{item.date}</td>
                                            <td className="p-3 text-center whitespace-nowrap">
                                                <span className={`px-2.5 py-1 rounded-full font-bold text-[10px] border ${item.targetType === 'เป้าหมายรวมทุกคน' ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-purple-50 text-purple-700 border-purple-200'}`}>
                                                    {item.targetType === 'เป้าหมายรวมทุกคน' ? '&#x1F465; รวมทุกคน' : '&#x1F464; รายบุคคล'}
                                                </span>
                                            </td>
                                            <td className="p-3 text-center font-black text-blue-600 text-sm whitespace-nowrap">
                                                {Number(item.targetValue).toLocaleString()} <span className="text-slate-400 font-normal text-[10px]">กล่อง</span>
                                            </td>
                                            <td className="p-3 font-bold text-slate-700 whitespace-nowrap">{item.setBy || 'Admin'}</td>
                                            <td className="p-3 text-slate-500 text-[11px]">{item.notes || '-'}</td>
                                        </tr>
                                    ));
                                })()}
                            </tbody>
                        </table>
                    </div>
                </div>
            </EditModal>

          </div>
        );
    };

    // ==========================================
    // 📌 React App (Main Component)
    // ==========================================
    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      
      const [products, setProducts] = useState([]);
      const [customerTypes, setCustomerTypes] = useState(fallbackCustomerTypes);
      const [closers, setClosers] = useState([]);
      const [members, setMembers] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [sales, setSales] = useState([]);
      const [businessTeams, setBusinessTeams] = useState([]);
      const [systemUsers, setSystemUsers] = useState([]);
      const [targetHistory, setTargetHistory] = useState([]);
      const [isAppLoading, setIsAppLoading] = useState(() => {
        try {
          return !localStorage.getItem('stk_app_cache_data');
        } catch(e) {
          return true;
        }
      });
      const [isSyncing, setIsSyncing] = useState(false);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try {
          return localStorage.getItem('stk_sidebar_collapsed') === 'true';
        } catch(e) {
          return false;
        }
      });
      
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const [saleNotify, setSaleNotify] = useState({ show: false, sellerName: '', profileUrl: '', bottles: 0, points: 0 });
      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
      };

      const [activePage, setActivePage] = useState('dashboard');
      const [iframeSrc, setIframeSrc] = useState('');
      const [iframeOpacity, setIframeOpacity] = useState(1);

      // Parse initial URL query page parameter
      useEffect(() => {
        const handleUrlChange = () => {
          const currentUrl = window.location.href;
          const urlObj = new URL(currentUrl, window.location.origin);
          const pageParam = urlObj.searchParams.get('page') || 'dashboard';
          setActivePage(pageParam);
          if (pageParam !== 'dashboard') {
            setIframeSrc(mapPageToHtml(currentUrl));
          }
        };

        handleUrlChange();

        // Listen for history popstate events (e.g. back button)
        window.addEventListener('popstate', handleUrlChange);
        return () => window.removeEventListener('popstate', handleUrlChange);
      }, []);

      // Intercept anchor clicks to load pages inside the iframe
      useEffect(() => {
        const handleInterceptClick = (e) => {
          const anchor = e.target.closest('a');
          if (anchor && anchor.href) {
            const url = new URL(anchor.href);
            const pageParam = url.searchParams.get('page');
            if (pageParam) {
              e.preventDefault();
              e.stopPropagation();
              
              setIframeOpacity(0.3);
              
              const targetPage = pageParam;
              setActivePage(targetPage);
              if (targetPage !== 'dashboard') {
                const resolvedFile = mapPageToHtml(anchor.href);
                setIframeSrc(resolvedFile);
              }
              
              window.history.pushState(null, '', anchor.search || '?page=dashboard');
              setTimeout(() => setIframeOpacity(1), 150);
            }
          }
        };

        document.addEventListener('click', handleInterceptClick, true);
        return () => document.removeEventListener('click', handleInterceptClick, true);
      }, []);


      if (typeof window.stkLastRefreshTime === 'undefined') window.stkLastRefreshTime = Date.now();
            // Listen to postMessage, BroadcastChannel, and localStorage polling (for file:// protocol) to trigger notifications
      useEffect(() => {
        const handleMessage = (e) => {
          const data = e.data;
          if (!data) return;

          if (data === 'sync_auth') {
            const userStr = localStorage.getItem('stk_current_user');
            if (userStr) {
              try {
                const parsed = JSON.parse(userStr);
                setCurrentUser(parsed);
                setIsLoggedIn(true);
              } catch(err) {}
            } else {
              setCurrentUser(null);
              setIsLoggedIn(false);
            }
          } else if (data === 'refresh_data') {
            if (typeof window.clearDbCache === 'function') window.clearDbCache();
            if (typeof window.refreshAppDashboardData === 'function') {
                window.refreshAppDashboardData();
            }
          } else if (data.type === 'new_sale_toast') {
             if (typeof window.refreshAppDashboardData === 'function') {
                 window.refreshAppDashboardData();
             }
             if (activePage === 'dashboard') {
                 setSaleNotify({
                     show: true,
                     sellerName: data.sellerName,
                     profileUrl: data.profileUrl,
                     bottles: data.bottles,
                     points: data.points
                 });
                 setTimeout(() => {
                     setSaleNotify(prev => ({ ...prev, show: false }));
                 }, 6000);
             }
          }
        };

        window.addEventListener('message', handleMessage);

        let bc;
        if (typeof BroadcastChannel !== 'undefined') {
            bc = new BroadcastChannel('stk_mlm_channel');
            bc.onmessage = (e) => {
                if (e.data === 'refresh_data') {
                    if (typeof window.clearDbCache === 'function') window.clearDbCache();
                    if (typeof window.refreshAppDashboardData === 'function') {
                        window.refreshAppDashboardData();
                    }
                } else {
                    handleMessage({ data: e.data });
                }
            };
        }

        let lastProcessedTimestamp = 0;
        try {
            const initialTrigger = localStorage.getItem('stk_new_sale_trigger');
            if (initialTrigger) {
                const parsed = JSON.parse(initialTrigger);
                if (parsed && parsed.timestamp) {
                    lastProcessedTimestamp = parsed.timestamp;
                }
            }
        } catch (e) {}

        const pollInterval = setInterval(() => {
            try {
                const rawTrigger = localStorage.getItem('stk_new_sale_trigger');
                if (rawTrigger) {
                    const parsed = JSON.parse(rawTrigger);
                    if (parsed && parsed.timestamp && parsed.timestamp > lastProcessedTimestamp) {
                        lastProcessedTimestamp = parsed.timestamp;
                        handleMessage({ data: { type: 'new_sale_toast', ...parsed } });
                    }
                }
                
                const rawRefresh = localStorage.getItem('stk_refresh_trigger');
                if (rawRefresh) {
                    const refreshTime = Number(rawRefresh);
                    if (!isNaN(refreshTime) && refreshTime > window.stkLastRefreshTime) {
                        window.stkLastRefreshTime = refreshTime;
                        if (typeof window.refreshAppDashboardData === 'function') {
                            window.refreshAppDashboardData();
                        }
                    }
                }
            } catch (err) {}
        }, 1000);

        return () => {
            window.removeEventListener('message', handleMessage);
            if (bc) bc.close();
            clearInterval(pollInterval);
        };
      }, [activePage]);

      const SCRIPT_URL = "<?= getScriptUrl() ?>";

      const pagePerm = window.getUserPagePermission ? window.getUserPagePermission(currentUser, 'dashboard') : 'none';
      const isAdmin = currentUser && (
          String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || 
          String(currentUser.role).trim().toLowerCase().includes('admin') || String(currentUser.role).trim().includes('แอดมิน') ||
          pagePerm === 'full'
      );
      const currentUserProfileUrl = currentUser?.profileUrl || '';

      const activeCustomerTypes = useMemo(() => {
          if (!customerTypes || customerTypes.length === 0) return fallbackCustomerTypes;
          const filtered = (customerTypes || []).filter(p => p && p.name && String(p.status || '').trim() !== 'ปิดใช้งาน');
          return filtered.length > 0 ? filtered : fallbackCustomerTypes;
      }, [customerTypes]);

            const fetchFreshData = (isBackground = false) => {
        if (!localStorage.getItem('stk_current_user')) return; // 🛡️ GUARD: หยุดดึงเมื่อออกจากระบบ
        if (!isBackground) setIsAppLoading(true);
        if (isBackground) setIsSyncing(true);
        Promise.all([
          supabaseSelect('stk_products', 'select=product_id,name,category,price_full,price_member,price_promo,give_pv,current_stock,status,image_url,self_fee,level_1_fee,level_2_fee,level_3_fee,level_4_fee,level_5_fee').catch(() => []),
          supabaseSelect('stk_customer_types').catch(() => []),
          supabaseSelect('stk_closers').catch(() => []),
          supabaseSelect('stk_members', 'select=user_id,name,business_team,permission_role,status,sponsor_id,accumulated_pv,phone_number,email,line_id,line_uid,bank_name,bank_account_no,bank_account_name,id_card_url').catch(() => []),
          supabaseSelect('stk_customers', 'select=customer_id,name,customer_type,owner_member_id&order=created_at.desc&limit=3000').catch(() => supabaseSelect('stk_customers', 'limit=3000').catch(() => [])),
          (async () => {
              const now = new Date();
              const y = now.getFullYear();
              const m = String(now.getMonth() + 1).padStart(2, '0');
              const lastDay = new Date(y, now.getMonth() + 1, 0).getDate();
              const s = `${y}-${m}-01`;
              const e = `${y}-${m}-${String(lastDay).padStart(2, '0')}`;
              if (window.supabaseRpc) {
                  try { return await window.supabaseRpc('get_stk_sales_by_date', { p_start_date: s, p_end_date: e }); } catch(err) {}
              }
              return supabaseSelect('stk_sales', `date=gte.${s}&date=lte.${e}&limit=3500`).catch(() => []);
          })(),
          supabaseSelect('stk_business_teams').catch(() => []),
          supabaseSelect('stk_target_history').catch(() => [])
        ]).then(([pRes, typeRes, cloRes, memRes, custRes, saleRes, teamRes, tgtRes]) => {
          const resObj = {
            products: pRes,
            customerTypes: typeRes,
            closers: cloRes,
            members: memRes,
            customers: custRes,
            sales: saleRes,
            businessTeams: teamRes,
            targetHistory: tgtRes
          };
          applyDataToStates(resObj);
          try {
              localStorage.setItem('stk_app_cache_data', JSON.stringify(resObj));
              localStorage.setItem('stk_app_cache_time', String(Date.now()));
          } catch(e){}
        }).catch(err => {
          console.error("Supabase load error:", err);
        }).finally(() => {
          if (!isBackground) setIsAppLoading(false);
          setIsSyncing(false);
        });
      };

      const processSalesRows = (rawSales, currentProducts) => {
          if (window.MlmLogic && typeof window.MlmLogic.processSalesRows === 'function') {
              return window.MlmLogic.processSalesRows(rawSales, currentProducts);
          }
          return rawSales || [];
      };

      const fetchSalesForPeriod = async (start, end) => {
          setIsAppLoading(true);
          try {
              let salesData = [];
              if (window.supabaseRpc) {
                  try { salesData = await window.supabaseRpc('get_stk_sales_by_date', { p_start_date: start, p_end_date: end }); }
                  catch(e) { salesData = await supabaseSelect('stk_sales', `date=gte.${start}&date=lte.${end}&limit=3500`).catch(()=>[]); }
              } else {
                  salesData = await supabaseSelect('stk_sales', `date=gte.${start}&date=lte.${end}&limit=3500`).catch(()=>[]);
              }
              const processed = processSalesRows(salesData || [], products); // 👈 ส่ง products เข้าไปคำนวณด้วย
              setSales(processed);
              const currentCache = (() => { try { return JSON.parse(localStorage.getItem('stk_app_cache_data')) || {}; } catch(e) { return {}; } })();
              currentCache.sales = processed;
              try { localStorage.setItem('stk_app_cache_data', JSON.stringify(currentCache)); } catch(e){}
          } catch(e) {
              console.error(e);
          } finally {
              setIsAppLoading(false);
          }
      };

      window.refreshAppDashboardData = () => fetchFreshData(false);

      useEffect(() => {
        const savedUserStr = localStorage.getItem('stk_current_user');
        if (savedUserStr) {
          try {
            const user = JSON.parse(savedUserStr);
            setCurrentUser(user);
            setIsLoggedIn(true);
          } catch(e) {
            setShowLoginModal(true);
          }
        } else {
          const params = new URLSearchParams(window.location.search);
          if (params.get('login') === '1' || !savedUserStr) {
            setShowLoginModal(true);
          }
        }

        const initialLoader = document.getElementById('initial-loader');
        if (initialLoader) {
            if (initialLoader) { initialLoader.style.opacity = '0'; setTimeout(() => { if (initialLoader) initialLoader.style.display = 'none'; }, 400); }
        }

        let hasCache = false;
        try {
            const cachedData = localStorage.getItem('stk_app_cache_data');
            if (cachedData) {
                const parsedData = JSON.parse(cachedData);
                applyDataToStates(parsedData);
                setIsAppLoading(false);
                hasCache = true;
            }
        } catch (e) { console.warn("Cache error", e); }

        fetchFreshData(hasCache);
      }, []);

      const applyDataToStates = (response) => {
           if (Array.isArray(response.products)) setProducts(response.products);
           if (Array.isArray(response.customerTypes)) {
               setCustomerTypes(window.MlmLogic ? window.MlmLogic.formatCustomerTypes(response.customerTypes, fallbackCustomerTypes) : response.customerTypes);
           }
           if (Array.isArray(response.closers)) setClosers(response.closers);
           if (Array.isArray(response.members)) {
               setMembers(window.MlmLogic ? window.MlmLogic.formatMembers(response.members) : response.members);
           }
           if (Array.isArray(response.customers)) {
               setCustomers(window.MlmLogic ? window.MlmLogic.formatCustomers(response.customers) : response.customers);
           }
           if (Array.isArray(response.businessTeams)) {
               setBusinessTeams(window.MlmLogic ? window.MlmLogic.formatBusinessTeams(response.businessTeams) : response.businessTeams);
           }
           if (Array.isArray(response.systemUsers)) setSystemUsers(response.systemUsers);
           if (Array.isArray(response.targetHistory)) setTargetHistory(response.targetHistory);
           
           if (Array.isArray(response.sales)) {
               setSales(processSalesRows(response.sales, response.products)); // 👈 ส่ง response.products เข้าไปคำนวณด้วย
           }
      };

      const handleLoginSuccess = (user) => {
        localStorage.setItem('stk_current_user', JSON.stringify(user));
        setCurrentUser(user);
        setIsLoggedIn(true);
        setShowLoginModal(false);
        showToast('เข้าสู่ระบบสำเร็จ!', 'success');
      };

      const handleLogout = () => {
        try {
          localStorage.removeItem('stk_current_user');
          localStorage.removeItem('stk_app_cache_data');
          localStorage.removeItem('stk_last_activity');
          sessionStorage.clear();
          localStorage.setItem('stk_broadcast_session_event', JSON.stringify({ action: 'logout', reason: 'manual_logout', time: Date.now() }));
        } catch(e) {}
        setCurrentUser(null);
        setIsLoggedIn(false);
        setActivePage('dashboard');
        setIframeSrc('');
        setShowLoginModal(true);
        window.history.pushState(null, '', '?page=dashboard&login=1');
        showToast('ออกจากระบบสำเร็จ', 'success');
      };

      return (
        <div className="min-h-screen flex flex-col lg:flex-row font-sans bg-slate-50">
          <Sidebar 
            activePage={activePage} 
            isLoggedIn={isLoggedIn} 
            currentUser={currentUser} 
            currentUserProfileUrl={currentUserProfileUrl} 
            isAdmin={isAdmin} 
            onLogout={handleLogout} 
            showLoginModal={showLoginModal} 
            setShowLoginModal={setShowLoginModal} 
            SCRIPT_URL={SCRIPT_URL}
            setIsAppLoading={setIsAppLoading}
            isSidebarCollapsed={isSidebarCollapsed}
            setIsSidebarCollapsed={setIsSidebarCollapsed}
          />
          
          <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>
            
            {toast.show && ReactDOM.createPortal(
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[999999] flex items-center justify-center p-4 animation-fade-in" style={{ animationDuration: '0.2s' }}>
                 <div className={`bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center animation-pop border-t-4 ${toast.type === 'error' ? 'border-red-500' : toast.type === 'info' ? 'border-blue-500' : 'border-emerald-500'}`}>
                    <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${toast.type === 'error' ? 'bg-red-100 text-red-500' : toast.type === 'info' ? 'bg-blue-100 text-blue-500' : 'bg-emerald-100 text-emerald-500'}`}>
                       {toast.type === 'error' ? <X size={32} /> : toast.type === 'info' ? <Trophy size={32} /> : <CheckCircle size={32} />}
                    </div>
                    <h3 className="text-xl font-bold text-slate-800 mb-2">{toast.type === 'error' ? 'เกิดข้อผิดพลาด' : toast.type === 'info' ? 'แจ้งเตือน' : 'สำเร็จ!'}</h3>
                    <p className="text-slate-600 font-medium text-sm mb-6">{toast.message}</p>
                    <button onClick={() => setToast({ ...toast, show: false })} className="w-full py-2.5 rounded-lg font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">ตกลง</button>
                 </div>
              </div>
            , document.body)}

            {saleNotify.show && ReactDOM.createPortal(
              <div className="fixed inset-0 bg-slate-950/70 backdrop-blur-md z-[999999] flex items-center justify-center p-4 animation-fade-in" style={{ animationDuration: '0.25s' }}>
                <style>{`
                  @keyframes scaleUp {
                    from { transform: scale(0.9); opacity: 0; }
                    to { transform: scale(1); opacity: 1; }
                  }
                  .animate-scale-up {
                    animation: scaleUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
                  }
                `}</style>
                <div className="bg-gradient-to-br from-amber-300 via-yellow-500 to-amber-600 rounded-3xl shadow-[0_30px_70px_rgba(245,158,11,0.45)] border-2 border-amber-200/40 p-8 max-w-sm w-full text-center relative overflow-hidden animate-scale-up">
                  
                  {/* Decorative background glow */}
                  <div className="absolute -top-12 -left-12 w-32 h-32 bg-white/20 rounded-full blur-2xl"></div>
                  <div className="absolute -bottom-12 -right-12 w-32 h-32 bg-amber-200/30 rounded-full blur-2xl"></div>
                  
                  <button 
                    onClick={() => setSaleNotify(prev => ({ ...prev, show: false }))} 
                    className="absolute top-4 right-4 text-amber-950 hover:bg-white/20 p-1.5 rounded-full transition-colors"
                  >
                    <X size={20} />
                  </button>

                  <div className="relative inline-block mx-auto mb-5">
                    <img 
                      src={saleNotify.profileUrl && saleNotify.profileUrl !== '-' ? saleNotify.profileUrl : `https://ui-avatars.com/api/?name=${encodeURIComponent(saleNotify.sellerName)}&background=1e293b&color=94a3b8&rounded=true&bold=true`} 
                      className="w-24 h-24 rounded-full object-cover border-4 border-white shadow-2xl bg-slate-900" 
                    />
                    <span className="absolute -bottom-1 right-1 bg-amber-950 text-yellow-400 rounded-full p-1.5 flex items-center justify-center border-2 border-white shadow-lg">
                      <Trophy size={16} />
                    </span>
                  </div>

                  <h3 className="text-xs font-black text-amber-950 uppercase tracking-widest mb-1">เปิดบิลขายใหม่สำเร็จ!</h3>
                  <div className="text-xl font-black text-amber-950 truncate mb-4">{saleNotify.sellerName}</div>
                  
                  <div className="bg-amber-950/10 backdrop-blur-xs py-4 px-6 rounded-2xl border border-amber-900/10 inline-block w-full">
                    <div className="text-[10px] font-bold text-amber-900 uppercase tracking-wider mb-1">ยอดขายสะสมกล่องในบิล</div>
                    <div className="text-3xl font-black text-amber-950 leading-none">
                      {saleNotify.bottles} <span className="text-lg font-bold">กล่อง</span>
                    </div>
                  </div>

                </div>
              </div>
            , document.body)}

            {activePage === 'dashboard' ? (
              <React.Fragment>
                <div className="p-3 sm:p-6 flex-1 w-full relative z-0">
                  <div className="w-full relative z-10">

                      <DashboardView 
                        sales={sales} 
                        fetchFreshData={fetchFreshData}
                        fetchSalesForPeriod={fetchSalesForPeriod}
                        members={members} 
                        customers={customers} 
                        isAdmin={isAdmin}
                        activeCustomerTypes={activeCustomerTypes}
                        businessTeams={businessTeams}
                        initialTargetHistory={targetHistory}
                        isSyncing={isSyncing}
                      />

                  </div>
                </div>

                <footer className="w-full text-center py-6 mt-auto border-t border-slate-200/50 no-print shrink-0">
                   <p className="text-[11px] font-bold text-slate-400 opacity-60 hover:opacity-100 transition-opacity">
                      &copy; {new Date().getFullYear()} STK Sales Management System. Developed by Sackda Southammavong.
                   </p>
                </footer>
              </React.Fragment>
            ) : (
              <iframe 
                src={iframeSrc}
                style={{ opacity: iframeOpacity }}
                className="w-full h-full flex-1 border-none bg-slate-50 transition-opacity duration-150"
              />
            )}

          </main>

          <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={systemUsers} />

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
