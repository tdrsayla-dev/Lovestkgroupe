  <script>
    // =====================================================================
    // STK GROUPE - Supabase Config (MLM / Sales System Phase 2.3)
    // =====================================================================
    window.SUPABASE_URL      = 'https://mfpkeyrykqnrywyksyqp.supabase.co';
    window.SUPABASE_ANON_KEY = 'sb_publishable_807NIkuj6MAs1KZY-m4tug_Fm1Mk-AO';
    window.SUPABASE_REST_URL = window.SUPABASE_URL + '/rest/v1';
    window.SUPABASE_HEADERS  = {
      'Content-Type' : 'application/json',
      'apikey'       : window.SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + window.SUPABASE_ANON_KEY,
      'Prefer'       : 'return=representation'
    };
    // Initialize Supabase client (available globally as window.supabaseClient)
    if (typeof supabase !== 'undefined') {
      window.supabaseClient = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
      console.log('%c✅ Supabase Connected!', 'color:green;font-weight:bold', window.SUPABASE_URL);
    }
    // ---- REST Helper Functions ----
    async function supabaseSelect(table, query) {
      var url = window.SUPABASE_REST_URL + '/' + table + (query ? '?' + query : '');
      var res = await fetch(url, { method: 'GET', headers: window.SUPABASE_HEADERS });
      if (!res.ok) { var t = await res.text(); throw new Error('SELECT ' + table + ': ' + res.status + ' ' + t); }
      return res.json();
    }
    async function supabaseInsert(table, data) {
      var res = await fetch(window.SUPABASE_REST_URL + '/' + table, { method: 'POST', headers: window.SUPABASE_HEADERS, body: JSON.stringify(data) });
      if (!res.ok) { var t = await res.text(); throw new Error('INSERT ' + table + ': ' + res.status + ' ' + t); }
      return res.json();
    }
    async function supabaseUpdate(table, id, data) {
      var res = await fetch(window.SUPABASE_REST_URL + '/' + table + '?id=eq.' + encodeURIComponent(id), { method: 'PATCH', headers: window.SUPABASE_HEADERS, body: JSON.stringify(data) });
      if (!res.ok) { var t = await res.text(); throw new Error('UPDATE ' + table + ': ' + res.status + ' ' + t); }
      return res.json();
    }
    async function supabaseDelete(table, id) {
      var h = Object.assign({}, window.SUPABASE_HEADERS, { 'Prefer': 'return=minimal' });
      var res = await fetch(window.SUPABASE_REST_URL + '/' + table + '?id=eq.' + encodeURIComponent(id), { method: 'DELETE', headers: h });
      if (!res.ok) { var t = await res.text(); throw new Error('DELETE ' + table + ': ' + res.status + ' ' + t); }
      return true;
    }
    async function supabaseUpsert(table, data) {
      var h = Object.assign({}, window.SUPABASE_HEADERS, { 'Prefer': 'resolution=merge-duplicates,return=representation' });
      var res = await fetch(window.SUPABASE_REST_URL + '/' + table, { method: 'POST', headers: h, body: JSON.stringify(data) });
      if (!res.ok) { var t = await res.text(); throw new Error('UPSERT ' + table + ': ' + res.status + ' ' + t); }
      return res.json();
    }
  </script>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;

    const fallbackCustomerTypes = window.fallbackCustomerTypes || [
       { id: 'T001', name: 'ลูกค้าใหม่', status: 'ใช้งาน' },
       { id: 'T002', name: 'ลูกค้าเก่ากลับมาต่อยา', status: 'ใช้งาน' }
    ];
    const fallbackProductsList = window.fallbackProductsList || ['SESAMIN', 'APPLE', 'KING_GOLD'];

    /* <?!= include('CommonComponents'); ?> */


    const ChevronLeftIcon = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
    const ChevronRightIcon = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;

    // ==========================================
    // 📌 Dashboard View Component
    // ==========================================
    const DashboardView = ({ sales, members, customers, isAdmin, activeCustomerTypes, businessTeams, initialTargetHistory }) => {
        const todayStr = getLocalISODate();
        const firstDayOfMonthStr = `${todayStr.substring(0, 7)}-01`;
        const [dashStartDate, setDashStartDate] = useState(firstDayOfMonthStr);
        const [dashEndDate, setDashEndDate] = useState(todayStr);
        const [dashboardTarget, setDashboardTarget] = useState(4000);
        const [competitionPage, setCompetitionPage] = useState(0);

        const [targetHistory, setTargetHistory] = useState(initialTargetHistory || []);
        const [showTargetHistoryModal, setShowTargetHistoryModal] = useState(false);
        const [targetHistorySearch, setTargetHistorySearch] = useState('');
        const [targetHistoryFilterStart, setTargetHistoryFilterStart] = useState('');
        const [targetHistoryFilterEnd, setTargetHistoryFilterEnd] = useState('');
        const globalTargetDebounceRef = useRef(null);
        const memberTargetDebounceRef = useRef({});

        useEffect(() => {
            if (Array.isArray(initialTargetHistory) && initialTargetHistory.length > 0) {
                setTargetHistory(initialTargetHistory);
            }
        }, [initialTargetHistory]);

        const recordTargetHistory = (targetVal, type = 'เป้าหมายรวมทุกคน', memberId = 'ALL', notes = '') => {
            const num = Number(targetVal) || 0;
            if (num <= 0) return;

            const nowDate = getLocalISODate();
            const nowTime = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            const newLogObj = {
                id: 'TGT-' + Date.now(),
                date: nowDate + ' ' + nowTime,
                period: nowDate.substring(0, 7),
                targetValue: num,
                targetType: type,
                memberId: memberId,
                setBy: 'ผู้ดูแลระบบ (Admin)',
                notes: notes || (type === 'เป้าหมายรวมทุกคน' ? 'ตั้งเป้าหมายรวมทุกคน' : `ตั้งเป้าหมายรายบุคคล: ${memberId}`)
            };

            setTargetHistory(prev => [newLogObj, ...(prev || [])]);

            if (typeof window.supabaseInsert === 'function') {
                const sbPayload = {
                    period: newLogObj.period,
                    target_value: newLogObj.targetValue,
                    target_type: newLogObj.targetType,
                    member_id: newLogObj.memberId,
                    set_by: newLogObj.setBy,
                    notes: newLogObj.notes
                };
                window.supabaseInsert('stk_target_history', sbPayload)
                    .catch(err => console.error("Error saving target history to Supabase:", err));
            }
        };

        const [globalIndividualTarget, setGlobalIndividualTarget] = useState(() => {
            try {
                const saved = localStorage.getItem('stk_global_individual_target');
                if (saved && !isNaN(saved)) return Number(saved);
            } catch(e) {}
            return 200;
        });

        const [customMemberTargets, setCustomMemberTargets] = useState(() => {
            try {
                const saved = localStorage.getItem('stk_custom_member_targets');
                if (saved) return JSON.parse(saved);
            } catch(e) {}
            return {};
        });

        const handleGlobalIndividualTargetChange = (val) => {
            setGlobalIndividualTarget(val);
            const num = Number(val);
            if (val !== '' && !isNaN(num) && num > 0) {
                try { localStorage.setItem('stk_global_individual_target', num); } catch(e) {}
                setCustomMemberTargets({});
                try { localStorage.removeItem('stk_custom_member_targets'); } catch(e) {}
                // Debounce: บันทึกประวัติเฉพาะตอนหยุดพิมพ์ 800ms
                if (globalTargetDebounceRef.current) clearTimeout(globalTargetDebounceRef.current);
                globalTargetDebounceRef.current = setTimeout(() => {
                    recordTargetHistory(num, 'เป้าหมายรวมทุกคน', 'ALL', 'ปรับเป้าหมายทุกคนในครั้งเดียว');
                }, 800);
            }
        };

        const handleUpdateMemberTarget = (memberId, targetVal) => {
            const num = Math.max(1, Number(targetVal) || 1);
            setCustomMemberTargets(prev => {
                const updated = { ...prev, [memberId]: num };
                try { localStorage.setItem('stk_custom_member_targets', JSON.stringify(updated)); } catch(e) {}
                return updated;
            });
            // Debounce per member: บันทึกเฉพาะตอนหยุดพิมพ์ 800ms
            if (memberTargetDebounceRef.current[memberId]) clearTimeout(memberTargetDebounceRef.current[memberId]);
            memberTargetDebounceRef.current[memberId] = setTimeout(() => {
                recordTargetHistory(num, 'เป้าหมายรายบุคคล', memberId, `ตั้งเป้าหมายรายบุคคล (${memberId})`);
            }, 800);
        };

        // แก้ไขให้เริ่มต้นเป็น firstDayOfMonthStr จะได้เห็นข้อมูลตอนเทสต์ง่ายขึ้น
        const [dailyTopSalesStartDate, setDailyTopSalesStartDate] = useState(firstDayOfMonthStr);
        const [dailyTopSalesEndDate, setDailyTopSalesEndDate] = useState(todayStr);

        const activeBusinessTeams = useMemo(() => {
            if (Array.isArray(businessTeams) && businessTeams.length > 0) {
                return businessTeams.filter(t => t && t.status !== 'ปิดใช้งาน' && t.status !== 'Disabled');
            }
            return [
                { id: 'T001', name: 'Marketing', status: 'ใช้งาน' },
                { id: 'T002', name: 'Center', status: 'ใช้งาน' }
            ];
        }, [businessTeams]);

        const activeTeamMembers = useMemo(() => {
            const disabledTeamKeys = new Set(
                (businessTeams || [])
                    .filter(t => t && (t.status === 'ปิดใช้งาน' || t.status === 'Disabled'))
                    .map(t => [t.id, t.name, String(t.id || '').toUpperCase(), String(t.name || '').toUpperCase()])
                    .flat()
            );

            return (members || []).filter(m => {
                if (!m) return false;
                const memTeam = String(m.team || '').trim().toUpperCase();
                if (memTeam && disabledTeamKeys.has(memTeam)) return false;
                return true;
            });
        }, [members, businessTeams]);

        const teamStats = useMemo(() => {
          const teamSalesMap = {};
          activeBusinessTeams.forEach(t => {
              teamSalesMap[t.id] = 0;
              teamSalesMap[t.name] = 0;
          });

          let mTargetData = {};
          activeTeamMembers.forEach(m => { 
              if (m && m.id) { 
                  const targetVal = customMemberTargets[m.id] !== undefined ? customMemberTargets[m.id] : (Number(globalIndividualTarget) || 200);
                  mTargetData[m.id] = { id: m.id, name: m.name, team: m.team || '', actual: 0, target: targetVal }; 
              } 
          });

          const filteredSales = (sales || []).filter(s => s && (s.date || '') >= dashStartDate && (s.date || '') <= dashEndDate);
          filteredSales.forEach(s => {
             const fullBoxes = parseInt(s['ยอดรวมชิ้นทั้งหมด'] || 0, 10);
             if (fullBoxes === 0) return;
             const mem = (members || []).find(m => m && (m.id === s.memberId || m.id === s.sellerId));
             if (mem) {
                 const memTeam = String(mem.team || '').trim();
                 const memTeamLower = memTeam.toLowerCase();
                 (activeBusinessTeams || []).forEach(bt => {
                     if (!bt) return;
                     const btName = String(bt.name || '').toLowerCase();
                     const btId = String(bt.id || '');
                     if (
                         (btId && memTeam === btId) || 
                         (btName && memTeamLower === btName) ||
                         (btName && btName.includes('marketing') && (memTeam === 'Team A' || memTeam === 'Marketing' || memTeam === 'T01')) ||
                         (btName && btName.includes('center') && (memTeam === 'Team B' || memTeam === 'Center' || memTeam === 'T02'))
                     ) {
                         if (bt.id) teamSalesMap[bt.id] = (teamSalesMap[bt.id] || 0) + fullBoxes;
                     }
                 });
                 if (mTargetData[mem.id]) mTargetData[mem.id].actual += fullBoxes;
             }
          });

          const palette = [
              { text: "text-blue-400", stroke: "#3b82f6", glow: "rgba(59,130,246,0.6)", bg: "bg-blue-600/20", border: "border-blue-500/40", hoverBg: "group-hover:bg-blue-600" },
              { text: "text-rose-500", stroke: "#f43f5e", glow: "rgba(244,63,94,0.6)", bg: "bg-rose-600/20", border: "border-rose-500/40", hoverBg: "group-hover:bg-rose-600" },
              { text: "text-amber-400", stroke: "#f59e0b", glow: "rgba(245,158,11,0.6)", bg: "bg-amber-600/20", border: "border-amber-500/40", hoverBg: "group-hover:bg-amber-600" },
              { text: "text-emerald-400", stroke: "#10b981", glow: "rgba(16,185,129,0.6)", bg: "bg-emerald-600/20", border: "border-emerald-500/40", hoverBg: "group-hover:bg-emerald-600" },
              { text: "text-purple-400", stroke: "#8b5cf6", glow: "rgba(139,92,246,0.6)", bg: "bg-purple-600/20", border: "border-purple-500/40", hoverBg: "group-hover:bg-purple-600" },
              { text: "text-cyan-400", stroke: "#06b6d4", glow: "rgba(6,182,212,0.6)", bg: "bg-cyan-600/20", border: "border-cyan-500/40", hoverBg: "group-hover:bg-cyan-600" }
          ];

          const teamsList = activeBusinessTeams.map((bt, index) => ({
              id: bt.id,
              name: bt.name,
              totalSales: teamSalesMap[bt.id] || teamSalesMap[bt.name] || 0,
              style: palette[index % palette.length]
          }));

          return { teamsList, memberTargetData: Object.values(mTargetData).sort((a, b) => b.actual - a.actual) };
        }, [sales, members, activeBusinessTeams, dashStartDate, dashEndDate, customMemberTargets, globalIndividualTarget]);

        const topPerformanceData = useMemo(() => {
            let mStats = {};
            (members || []).forEach(m => {
                if (m && m.id) {
                    mStats[m.id] = { id: m.id, name: m.name, newCustSet: new Set(), totalFullBoxes: 0, oldFullBoxes: 0 };
                }
            });
            const filteredSales = (sales || []).filter(s => s && (s.date || '') >= dashStartDate && (s.date || '') <= dashEndDate);
            filteredSales.forEach(s => {
                const memberId = s.memberId; if (!memberId) return;
                if (!mStats[memberId]) {
                    const mem = (members || []).find(m => m && m.id === memberId);
                    mStats[memberId] = { id: memberId, name: mem ? mem.name : memberId, newCustSet: new Set(), totalFullBoxes: 0, oldFullBoxes: 0 };
                }
                const fullBoxes = parseInt(s['ยอดรวมชิ้นทั้งหมด'] || 0, 10);
                const cust = (customers || []).find(c => c && c.id === s.customerId);
                const cType = cust ? String(cust.type || '').trim() : '';
                if (cType.includes('ใหม่') || cType.includes('ปรึกษา')) { if (s.customerId) mStats[memberId].newCustSet.add(s.customerId); }
                mStats[memberId].totalFullBoxes += fullBoxes;
                if (cType.includes('เก่า') || cType.includes('ปรึกษา') || cType.includes('โทร')) { mStats[memberId].oldFullBoxes += fullBoxes; }
            });
            return Object.values(mStats).map(m => ({ ...m, newCustCount: m.newCustSet.size })).sort((a, b) => b.totalFullBoxes - a.totalFullBoxes).slice(0, 10);
        }, [sales, customers, members, dashStartDate, dashEndDate]);

        const podiumData = useMemo(() => {
            const podium = [];
            if(topPerformanceData.length > 0) podium.push({ ...topPerformanceData[0], rank: 1 });
            if(topPerformanceData.length > 1) podium.push({ ...topPerformanceData[1], rank: 2 });
            if(topPerformanceData.length > 2) podium.push({ ...topPerformanceData[2], rank: 3 });
            return podium;
        }, [topPerformanceData]);

        const rank4to10Data = useMemo(() => topPerformanceData.slice(3, 10), [topPerformanceData]);

        const maxPerfStats = useMemo(() => {
            let maxFull = 1, maxOld = 1, maxNew = 1;
            topPerformanceData.forEach(d => {
                if (d.totalFullBoxes > maxFull) maxFull = d.totalFullBoxes;
                if (d.oldFullBoxes > maxOld) maxOld = d.oldFullBoxes;
                if (d.newCustCount > maxNew) maxNew = d.newCustCount;
            });
            return { maxFull, maxOld, maxNew };
        }, [topPerformanceData]);

        const dailyTopSales = useMemo(() => {
            const periodSales = (sales || []).filter(s => s && (s.date || '') >= dailyTopSalesStartDate && (s.date || '') <= dailyTopSalesEndDate);
            const aggregated = {};
            periodSales.forEach(s => {
                const mId = s.memberId;
                if (!mId) return;
                if (!aggregated[mId]) { aggregated[mId] = { memberId: mId, memberName: s.memberName, totalFullBoxes: 0 }; }
                aggregated[mId].totalFullBoxes += (parseInt(s['ยอดรวมชิ้นทั้งหมด']) || 0);
            });
            return Object.values(aggregated).filter(m => m.totalFullBoxes > 0).sort((a, b) => b.totalFullBoxes - a.totalFullBoxes).slice(0, 10);
        }, [sales, dailyTopSalesStartDate, dailyTopSalesEndDate]);

        const [zeroSalesStartDate, setZeroSalesStartDate] = useState(firstDayOfMonthStr);
        const [zeroSalesEndDate, setZeroSalesEndDate] = useState(todayStr);

        const zeroSalesData = useMemo(() => {
            let mStats = {};
            activeTeamMembers.forEach(m => {
                if (m && m.id && (m.status === 'ทำงานอยู่' || m.status === 'ใช้งาน' || m.status === 'Active')) {
                    mStats[m.id] = { id: m.id, name: m.name, team: String(m.team || '').trim(), totalFullBoxes: 0, profileUrl: m.profileUrl };
                }
            });

            const filteredSales = (sales || []).filter(s => s && (s.date || '') >= zeroSalesStartDate && (s.date || '') <= zeroSalesEndDate);
            filteredSales.forEach(s => {
                const memberId = s.memberId;
                if (mStats[memberId]) {
                    mStats[memberId].totalFullBoxes += (parseInt(s['ยอดรวมชิ้นทั้งหมด'] || 0, 10));
                }
            });

            const paletteColors = [
                { dotColor: 'bg-blue-500', shadow: 'shadow-[0_0_8px_rgba(59,130,246,0.8)]' },
                { dotColor: 'bg-rose-500', shadow: 'shadow-[0_0_8px_rgba(244,63,94,0.8)]' },
                { dotColor: 'bg-amber-500', shadow: 'shadow-[0_0_8px_rgba(245,158,11,0.8)]' },
                { dotColor: 'bg-emerald-500', shadow: 'shadow-[0_0_8px_rgba(16,185,129,0.8)]' },
                { dotColor: 'bg-purple-500', shadow: 'shadow-[0_0_8px_rgba(139,92,246,0.8)]' },
                { dotColor: 'bg-cyan-500', shadow: 'shadow-[0_0_8px_rgba(6,182,212,0.8)]' }
            ];

            const teamMap = {};
            activeBusinessTeams.forEach((bt, idx) => {
                const color = paletteColors[idx % paletteColors.length];
                teamMap[bt.id] = { teamId: bt.id, teamName: bt.name, data: [], dotColor: color.dotColor, shadow: color.shadow };
            });

            Object.values(mStats).forEach(m => {
                if (m.totalFullBoxes === 0) {
                    const memTeam = m.team;
                    let matchedTeam = activeBusinessTeams.find(bt => {
                        if (!bt) return false;
                        const btName = String(bt.name || '').toLowerCase();
                        const btId = String(bt.id || '');

                        <span className="text-[11px] sm:text-[12px] font-bold text-slate-400">กล่อง</span>
                     </div>
                     <button
                        type="button"
                        onClick={() => setShowTargetHistoryModal(true)}
                        className="bg-slate-950 hover:bg-slate-900 text-amber-400 font-bold text-[11px] sm:text-[12px] px-3.5 py-2 rounded-xl border border-slate-800 shadow-sm flex items-center gap-1.5 transition-all hover:border-amber-400/50 cursor-pointer"
                        title="คลิกเพื่อดูประวัติการตั้งเป้าหมายย้อนหลัง"
                     >
                        <Archive size={15} className="text-amber-400" />
                        <span>&#x1F4DC; ประวัติเป้าหมาย</span>
                     </button>
                     <div className="flex gap-3 text-[11px] sm:text-[12px] font-bold bg-slate-950 px-3.5 py-2 rounded-xl border border-slate-800 text-slate-300 shadow-inner">
                        <div className="flex items-center gap-2"><div className="w-3 h-3 border border-slate-600 bg-slate-800 rounded-sm"></div> เป้าหมาย</div>
                        <div className="flex items-center gap-2"><div className="w-3 h-3 bg-blue-500 rounded-sm"></div> ยอดที่ทำได้</div>
                     </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-1.5 sm:gap-2 relative z-10 pt-1 pb-3">
                  {paginatedProgressData.map((d, idx) => {
                     const globalIndex = (progressPage - 1) * ITEMS_PER_PAGE + idx;
                     const percent = Math.min((d.actual / d.target) * 100, 100);
                     const remaining = Math.max(d.target - d.actual, 0);
                     const memInfo = (members || []).find(m => m.id === d.id);
                     const avatarUrl = memInfo?.profileUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(d.name)}&background=334155&color=cbd5e1&rounded=true&bold=true`;
                     return (
                        <div key={d.id} className="flex items-center gap-2 sm:gap-2.5 bg-slate-800/40 p-1.5 sm:p-2 rounded-xl border border-slate-700/50 hover:bg-slate-800/80 hover:border-slate-600 transition-colors group shadow-sm">
                           <div className="relative shrink-0">
                              <img src={avatarUrl} className="w-8 h-8 sm:w-9 sm:h-9 rounded-full object-cover border border-slate-500 shadow-md bg-slate-700 group-hover:border-blue-400 transition-colors" />
                              <div className={`absolute -top-1 -left-1 w-3.5 h-3.5 sm:w-4 sm:h-4 flex items-center justify-center text-[7px] sm:text-[8px] font-black rounded-full border border-slate-800 shadow-sm ${globalIndex === 0 ? 'bg-yellow-400 text-yellow-900 scale-110' : globalIndex === 1 ? 'bg-slate-300 text-slate-800' : globalIndex === 2 ? 'bg-orange-500 text-white' : 'bg-slate-600 text-slate-200'}`}>
                                 {globalIndex + 1}
                              </div>
                           </div>
                           <div className="flex-1 flex flex-col min-w-0 justify-center">
                              <div className="flex justify-between items-center mb-1">
                                 <span className="text-[9px] sm:text-[10px] font-bold text-slate-200 truncate group-hover:text-white transition-colors">{d.name}</span>
                              </div>
                              <div className="w-full h-1 sm:h-1.5 bg-slate-950/80 rounded-full overflow-hidden border border-slate-800/50 shadow-inner relative mb-1">
                                 <div className="h-full bg-gradient-to-r from-blue-700 via-blue-500 to-sky-400 rounded-full transition-all duration-1000 ease-out relative shadow-[0_0_8px_rgba(56,189,248,0.6)]" style={{ width: `${percent}%` }}></div>
                              </div>
                              
                              <div className="flex justify-between items-center w-full">
                                 <span className="text-[7px] sm:text-[8px] font-medium text-rose-400/90">เหลือ {Number(remaining).toLocaleString()}</span>
                                 <span className="text-[8px] sm:text-[9px] font-bold text-slate-400 shrink-0 flex items-baseline gap-0.5">
                                    ยอด: <span className="text-white drop-shadow-[0_0_6px_rgba(56,189,248,0.8)] text-[12px] sm:text-[14px] font-black">{Number(d.actual).toLocaleString()}</span> <span className="opacity-50 text-[7px] sm:text-[8px]">/</span> <input type="number" min="1" className="w-12 bg-slate-950/80 border border-slate-700/80 text-blue-300 font-bold text-[9px] sm:text-[10px] rounded px-1 text-center outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400" value={d.target} onChange={e => handleUpdateMemberTarget(d.id, e.target.value)} title="คลิกเพื่อแก้ไขเป้าหมายของคนนี้" />
                                 </span>
                              </div>
                           </div>
                        </div>
                    )})}
                  {paginatedProgressData.length === 0 && <div className="w-full text-center text-slate-500 font-bold py-10 xl:col-span-4 lg:col-span-3">ไม่มีข้อมูลสมาชิกในระบบ</div>}
               </div>

               {totalProgressPages > 1 && (
                  <div className="flex justify-center items-center gap-4 mt-4 pt-3 border-t border-slate-700/50 relative z-10">
                     <button onClick={() => setProgressPage(p => Math.max(1, p - 1))} disabled={progressPage === 1} className="px-4 py-1.5 bg-slate-800 text-slate-300 text-[11px] sm:text-xs font-bold rounded-lg border border-slate-700 disabled:opacity-50 hover:bg-slate-700 hover:text-white transition-colors shadow-sm">ย้อนกลับ</button>
                     <span className="text-[10px] sm:text-[11px] font-bold text-slate-400 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 shadow-inner">หน้าที่ {progressPage} / {totalProgressPages}</span>
                     <button onClick={() => setProgressPage(p => Math.min(totalProgressPages, p + 1))} disabled={progressPage === totalProgressPages} className="px-4 py-1.5 bg-slate-800 text-slate-300 text-[11px] sm:text-xs font-bold rounded-lg border border-slate-700 disabled:opacity-50 hover:bg-slate-700 hover:text-white transition-colors shadow-sm">ถัดไป</button>
                  </div>
               )}
            </div>

            <EditModal 
                isOpen={showTargetHistoryModal} 
                onClose={() => setShowTargetHistoryModal(false)} 
                title="&#x1F4DC; ประวัติการตั้งเป้าหมายย้อนหลัง (Target Audit Log)" 
                icon={Archive}
            >
                <div className="space-y-3 text-slate-800">
                    <div className="bg-slate-900 text-white p-3 rounded-2xl border border-slate-800">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2.5">
                            <div>
                                <span className="text-xs text-amber-400 font-bold block">บันทึกประวัติเป้าหมายย้อนหลังทั้งหมด</span>
                                <span className="text-sm font-black text-slate-200">ตรวจสอบเป้าหมายตามวัน เวลา และผู้ตั้งค่า</span>
                            </div>
                            <div className="flex items-center bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs">
                                <SearchIcon size={14} className="text-slate-400 mr-2 shrink-0" />
                                <input 
                                    type="text" 
                                    placeholder="ค้นหาตามวัน, ผู้ตั้ง, ประเภท..." 
                                    className="bg-transparent text-white outline-none w-40" 
                                    value={targetHistorySearch} 
                                    onChange={e => setTargetHistorySearch(e.target.value)} 
                                />
                            </div>
                        </div>
                        <div className="flex flex-wrap items-center gap-2 mt-2.5 border-t border-slate-800 pt-2.5">
                            <span className="text-[11px] text-slate-400 font-bold shrink-0">&#x1F4C5; ช่วงวันที่:</span>
                            <div className="flex items-center gap-1.5">
                                <input 
                                    type="date" 
                                    className="bg-slate-800 border border-slate-700 text-slate-200 text-[11px] font-bold rounded-lg px-2 py-1 outline-none focus:border-amber-400 transition-colors" 
                                    value={targetHistoryFilterStart} 
                                    onChange={e => setTargetHistoryFilterStart(e.target.value)} 
                                />
                                <span className="text-slate-500 font-bold text-xs">ถึง</span>
                                <input 
                                    type="date" 
                                    className="bg-slate-800 border border-slate-700 text-slate-200 text-[11px] font-bold rounded-lg px-2 py-1 outline-none focus:border-amber-400 transition-colors" 
                                    value={targetHistoryFilterEnd} 
                                    onChange={e => setTargetHistoryFilterEnd(e.target.value)} 
                                />
                            </div>
                            {(targetHistoryFilterStart || targetHistoryFilterEnd || targetHistorySearch) && (
                                <button 
                                    onClick={() => { setTargetHistoryFilterStart(''); setTargetHistoryFilterEnd(''); setTargetHistorySearch(''); }}
                                    className="text-[11px] font-bold text-rose-400 hover:text-rose-300 bg-rose-400/10 hover:bg-rose-400/20 px-2 py-1 rounded-lg transition-colors border border-rose-400/20"
                                >
                                    &#x2715; ล้างตัวกรอง
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="max-h-[380px] overflow-y-auto overflow-x-auto border border-slate-200 rounded-2xl">
                        <table className="w-full text-left border-collapse text-xs">
                            <thead className="bg-slate-100 sticky top-0 border-b border-slate-200 z-10">
                                <tr>
                                    <th className="p-3 font-bold text-slate-700 whitespace-nowrap">วัน - เวลา</th>
                                    <th className="p-3 font-bold text-slate-700 text-center whitespace-nowrap">ประเภท</th>
                                    <th className="p-3 font-bold text-slate-700 text-center whitespace-nowrap">เป้าหมาย</th>
                                    <th className="p-3 font-bold text-slate-700 whitespace-nowrap">ผู้ตั้งค่า</th>
                                    <th className="p-3 font-bold text-slate-700">หมายเหตุ</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {(() => {
                                    const sorted = [...(targetHistory || [])].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                                    const filtered = sorted.filter(item => {
                                        const dateStr = (item.date || '').substring(0, 10);
                                        const afterStart = !targetHistoryFilterStart || dateStr >= targetHistoryFilterStart;
                                        const beforeEnd = !targetHistoryFilterEnd || dateStr <= targetHistoryFilterEnd;
                                        const matchSearch = !targetHistorySearch ||
                                            (item.date || '').toLowerCase().includes(targetHistorySearch.toLowerCase()) ||
                                            (item.setBy || '').toLowerCase().includes(targetHistorySearch.toLowerCase()) ||
                                            (item.targetType || '').toLowerCase().includes(targetHistorySearch.toLowerCase()) ||
                                            String(item.targetValue).includes(targetHistorySearch);
                                        return afterStart && beforeEnd && matchSearch;
                                    });
                                    if (filtered.length === 0) return (
                                        <tr><td colSpan="5" className="p-8 text-center text-slate-400 font-bold">
                                            {(targetHistory || []).length === 0 ? 'ยังไม่มีประวัติการบันทึกเป้าหมายในระบบ' : 'ไม่พบข้อมูลตามเงื่อนไขที่กรอง'}
                                        </td></tr>
                                    );
                                    return filtered.map((item, idx) => (
                                        <tr key={item.id || idx} className={`transition-colors ${idx % 2 === 0 ? 'bg-white hover:bg-blue-50' : 'bg-slate-50 hover:bg-blue-50'}`}>
                                            <td className="p-3 font-mono font-medium text-slate-600 whitespace-nowrap text-[11px]">{item.date}</td>
                                            <td className="p-3 text-center whitespace-nowrap">
                                                <span className={`px-2.5 py-1 rounded-full font-bold text-[10px] border ${item.targetType === 'เป้าหมายรวมทุกคน' ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-purple-50 text-purple-700 border-purple-200'}`}>
                                                    {item.targetType === 'เป้าหมายรวมทุกคน' ? '&#x1F465; รวมทุกคน' : '&#x1F464; รายบุคคล'}
                                                </span>
                                            </td>
                                            <td className="p-3 text-center font-black text-blue-600 text-sm whitespace-nowrap">
                                                {Number(item.targetValue).toLocaleString()} <span className="text-slate-400 font-normal text-[10px]">กล่อง</span>
                                            </td>
                                            <td className="p-3 font-bold text-slate-700 whitespace-nowrap">{item.setBy || 'Admin'}</td>
                                            <td className="p-3 text-slate-500 text-[11px]">{item.notes || '-'}</td>
                                        </tr>
                                    ));
                                })()}
                            </tbody>
                        </table>
                    </div>
                </div>
            </EditModal>

          </div>
        );
    };

    // ==========================================
    // 📌 React App (Main Component)
    // ==========================================
    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      
      const [products, setProducts] = useState([]);
      const [customerTypes, setCustomerTypes] = useState(fallbackCustomerTypes);
      const [closers, setClosers] = useState([]);
      const [members, setMembers] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [sales, setSales] = useState([]);
      const [businessTeams, setBusinessTeams] = useState([]);
      const [systemUsers, setSystemUsers] = useState([]);
      const [targetHistory, setTargetHistory] = useState([]);
      const [isAppLoading, setIsAppLoading] = useState(true);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try {
          return localStorage.getItem('stk_sidebar_collapsed') === 'true';
        } catch(e) {
          return false;
        }
      });
      
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
      };

      const SCRIPT_URL = "<?= getScriptUrl() ?>";

      const isAdmin = currentUser && (
          String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || 
          String(currentUser.role).trim().toLowerCase() === 'admin'
      );
      const currentUserProfileUrl = currentUser?.profileUrl || '';

      const activeCustomerTypes = useMemo(() => {
          if (!customerTypes || customerTypes.length === 0) return fallbackCustomerTypes;
          return (customerTypes || []).filter(p => p && p.status === 'ใช้งาน');
      }, [customerTypes]);

      useEffect(() => {
        const savedUserStr = localStorage.getItem('stk_current_user');
        if (savedUserStr) {
          const user = JSON.parse(savedUserStr);
          setCurrentUser(user);
          setIsLoggedIn(true);
        }

        const initialLoader = document.getElementById('initial-loader');
        if (initialLoader) {
            initialLoader.style.display = 'none';
        }

        Promise.all([
          supabaseSelect('stk_products').catch(() => []),
          supabaseSelect('stk_customer_types').catch(() => []),
          supabaseSelect('stk_closers').catch(() => []),
          supabaseSelect('stk_members').catch(() => []),
          supabaseSelect('stk_customers').catch(() => []),
          supabaseSelect('stk_sales').catch(() => []),
          supabaseSelect('stk_business_teams').catch(() => []),
          supabaseSelect('stk_target_history').catch(() => [])
        ]).then(([pRes, typeRes, cloRes, memRes, custRes, saleRes, teamRes, tgtRes]) => {
          const resObj = {
            products: pRes,
            customerTypes: typeRes,
            closers: cloRes,
            members: memRes,
            customers: custRes,
            sales: saleRes,
            businessTeams: teamRes,
            targetHistory: tgtRes
          };
          applyDataToStates(resObj);
        }).catch(err => {
          console.error("Supabase load error:", err);
        }).finally(() => {
          setIsAppLoading(false);
        });
      }, []);

      const applyDataToStates = (response) => {
           if (Array.isArray(response.products)) setProducts(response.products);
           if (Array.isArray(response.customerTypes)) setCustomerTypes(response.customerTypes);
           if (Array.isArray(response.closers)) setClosers(response.closers);
           if (Array.isArray(response.members)) {
               const formattedMembers = response.members.map(m => ({
                   id: String(m.id || m.user_id || m.User_ID || '').trim(),
                   name: String(m.name || m.Name || '').trim(),
                   referrer: String(m.referrer || m.sponsor_id || m.Sponsor_ID || '').trim(),
                   team: String(m.team || m.business_team || m.Business_Team || 'Marketing').trim(),
                   role: String(m.role || m.permission_role || m.Permission_Role || 'Staff').trim(),
                   status: String(m.status || m.Status || 'ทำงานอยู่').trim(),
                   profileUrl: m.profile_url || m.id_card_url || m.ID_Card_URL || '',
                   phone: m.phone || m.phone_number || m.Phone_Number || '',
                   email: m.email || m.Email || '',
                   lineId: m.line_id || m.LINE_ID || '',
                   bankName: m.bank_name || m.Bank_Name || '',
                   bankAccountNo: m.bank_account_no || m.Bank_Account_No || '',
                   bankAccountName: m.bank_account_name || m.Bank_Account_Name || '',
                   accumulatedPV: Number(m.accumulated_pv || m.Accumulated_PV || 0)
               })).filter(m => m.id !== '');
               setMembers(formattedMembers);
           }
           if (Array.isArray(response.customers)) setCustomers(response.customers);
           if (Array.isArray(response.businessTeams)) setBusinessTeams(response.businessTeams.map(t => ({...t, id: String(t.id || t.team_id || t.Team_ID || "").trim(), name: String(t.name || t.team_name || t.Team_Name || t.TeamName || "").trim(), status: String(t.status || t.Status || "ใช้งาน").trim()})));
           if (Array.isArray(response.systemUsers)) setSystemUsers(response.systemUsers);
           if (Array.isArray(response.targetHistory)) setTargetHistory(response.targetHistory);
           
           if (Array.isArray(response.sales)) {
               const processedSales = response.sales.map(s => {
                   let sumF = 0, sumP = 0, sumZ = 0, sumM = 0;
                   let itemsList = [];
                   if (s.items_json) {
                       try { itemsList = typeof s.items_json === 'string' ? JSON.parse(s.items_json) : s.items_json; } catch(e){}
                   }
                   
                   if (Array.isArray(itemsList) && itemsList.length > 0) {
                       itemsList.forEach(it => {
                           const typeStr = String(it.type || '').trim();
                           const qtyNum = Number(it.qty || it.quantity || 1);
                           const pName = String(it.prod || it.productName || it.name || 'Unknown').trim();
                           s[`${pName}_${typeStr}`] = qtyNum;
                           if (typeStr === 'ราคาเต็ม') sumF += qtyNum;
                           else if (typeStr === 'ราคาสมาชิก') sumM += qtyNum;
                           else if (typeStr === 'ราคาโปร' || typeStr === 'โปรโมชั่น') sumP += qtyNum;
                           else if (typeStr === 'ราคาศูนย์') sumZ += qtyNum;
                           else sumM += qtyNum;
                       });
                   } else {
                       Object.keys(s).forEach(k => {
                           if (k !== 'รวมชิ้นราคาเต็ม' && k !== 'รวมชิ้นราคาโปร' && k !== 'รวมชิ้นราคาศูนย์' && k !== 'ยอดรวมชิ้นทั้งหมด') {
                               if (k.endsWith('_ราคาเต็ม')) sumF += (parseInt(s[k]) || 0);
                               else if (k.endsWith('_ราคาโปร')) sumP += (parseInt(s[k]) || 0);
                               else if (k.endsWith('_ราคาศูนย์')) sumZ += (parseInt(s[k]) || 0);
                               else if (k.endsWith('_ราคาสมาชิก')) sumM += (parseInt(s[k]) || 0);
                           }
                       });
                   }
                   s['รวมชิ้นราคาเต็ม'] = sumF; s['รวมชิ้นราคาโปร'] = sumP; s['รวมชิ้นราคาศูนย์'] = sumZ; s['รวมชิ้นราคาสมาชิก'] = sumM;
                   s['ยอดรวมชิ้นทั้งหมด'] = sumF + sumM + sumP + sumZ;
                   s['memberId'] = s.memberId || s.sellerId || s.seller_id || s.seller || s.marketing_name || s.marketing;
                   s['sellerId'] = s.sellerId || s.seller_id || s.seller || s.memberId || s.marketing_name || s.marketing;
                   return {
                       ...s,
                       id: s.id || s.sale_id,
                       date: s.date || s.sale_date,
                       marketing: s.marketing_name || s.marketing || s.seller_id,
                       seller: s.seller_id || s.marketing_name || s.marketing || s.seller || s.memberId,
                       customerName: s.customer_name || s.customerName
                   };
               });
               setSales(processedSales);
           }
      };

      const handleLoginSuccess = (user) => {
        localStorage.setItem('stk_current_user', JSON.stringify(user));
        setCurrentUser(user);
        setIsLoggedIn(true);
        setShowLoginModal(false);
        showToast('เข้าสู่ระบบสำเร็จ!', 'success');
      };

      const handleLogout = () => {
        localStorage.removeItem('stk_current_user');
        setCurrentUser(null);
        setIsLoggedIn(false);
        const targetUrl = typeof resolvePageUrl === 'function' ? resolvePageUrl('?page=dashboard') : 'Mlm.html';
        if (typeof window !== 'undefined') window.location.href = targetUrl;
      };

      return (
        <div className="min-h-screen flex flex-col lg:flex-row font-sans bg-slate-50">
          <Sidebar 
            activePage="dashboard" 
            isLoggedIn={isLoggedIn} 
            currentUser={currentUser} 
            currentUserProfileUrl={currentUserProfileUrl} 
            isAdmin={isAdmin} 
            onLogout={handleLogout} 
            showLoginModal={showLoginModal} 
            setShowLoginModal={setShowLoginModal} 
            SCRIPT_URL={SCRIPT_URL}
            setIsAppLoading={setIsAppLoading}
            isSidebarCollapsed={isSidebarCollapsed}
            setIsSidebarCollapsed={setIsSidebarCollapsed}
          />
          
          <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>
            
            {toast.show && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4 animation-fade-in" style={{ animationDuration: '0.2s' }}>
                 <div className={`bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center animation-pop border-t-4 ${toast.type === 'error' ? 'border-red-500' : toast.type === 'info' ? 'border-blue-500' : 'border-emerald-500'}`}>
                    <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${toast.type === 'error' ? 'bg-red-100 text-red-500' : toast.type === 'info' ? 'bg-blue-100 text-blue-500' : 'bg-emerald-100 text-emerald-500'}`}>
                       {toast.type === 'error' ? <X size={32} /> : toast.type === 'info' ? <Trophy size={32} /> : <CheckCircle size={32} />}
                    </div>
                    <h3 className="text-xl font-bold text-slate-800 mb-2">{toast.type === 'error' ? 'เกิดข้อผิดพลาด' : toast.type === 'info' ? 'แจ้งเตือน' : 'สำเร็จ!'}</h3>
                    <p className="text-slate-600 font-medium text-sm mb-6">{toast.message}</p>
                    <button onClick={() => setToast({ ...toast, show: false })} className="w-full py-2.5 rounded-lg font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">ตกลง</button>
                 </div>
              </div>
            )}

            <div className="p-3 sm:p-6 flex-1 w-full relative z-0">
              <div className="w-full relative z-10">
                {isAppLoading ? (
                  <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                    <div className="w-16 h-16 border-[4px] border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                    <h2 className="text-lg font-bold text-slate-700">กำลังซิงค์ข้อมูลกับฐานข้อมูล...</h2>
                    <p className="text-slate-500 text-sm">กรุณารอสักครู่ ระบบกำลังดึงข้อมูลล่าสุด</p>
                  </div>
                ) : (
                  <DashboardView 
                    sales={sales} 
                    members={members} 
                    customers={customers} 
                    isAdmin={isAdmin}
                    activeCustomerTypes={activeCustomerTypes}
                    businessTeams={businessTeams}
                    initialTargetHistory={targetHistory}
                  />
                )}
              </div>
            </div>

            <footer className="w-full text-center py-6 mt-auto border-t border-slate-200/50 no-print shrink-0">
               <p className="text-[11px] font-bold text-slate-400 opacity-60 hover:opacity-100 transition-opacity">
                  &copy; {new Date().getFullYear()} STK Sales Management System. Developed by Sackda Southammavong.
               </p>
            </footer>

          </main>

          <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={systemUsers} />

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
