<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Noto+Sans+Lao:wght@400;500;600;700&display=swap');
  
  :root {
    --bg-main: #f8fafc;
    --card-bg: #ffffff;
    --border-color: #e2e8f0;
  }

  body { 
    font-family: 'Sukhumvit Set', 'Sarabun', 'Noto Sans Lao', -apple-system, BlinkMacSystemFont, sans-serif; 
    background-color: var(--bg-main); 
    color: #0f172a; 
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .animation-fade-in { animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  
  .animation-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  
  .animation-pop { animation: pop 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .hide-scroll::-webkit-scrollbar { display: none; }
  .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }

  /* Responsive & Multi-Platform Compatibility Protection */
  html, body {
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    margin: 0;
    padding: 0;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  /* Table & Container responsive auto-wrapper */
  .table-responsive, .tree-responsive {
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Responsive input & modal fixes */
  input, select, textarea, button {
    font-size: 16px; /* Prevent iOS zoom-in on focus */
  }
  @media (min-width: 640px) {
    input, select, textarea, button {
      font-size: 14px;
    }
  }

  /* CSS for Print */
  @media print {
      body { background-color: white !important; }
      aside, header, .no-print, .print-hide { display: none !important; }
      main { margin-left: 0 !important; width: 100% !important; padding: 0 !important; }
      .shadow-sm, .shadow-md, .shadow-lg, .shadow-xl, .shadow-2xl, .shadow-inner { box-shadow: none !important; }
      table { border-collapse: collapse !important; }
      th, td { border: 1px solid #cbd5e1 !important; }
      .fixed.inset-0 { position: absolute !important; background: white !important; inset: 0 !important; }
  }
</style>

<script>
  window.SUPABASE_URL      = 'https://mfpkeyrykqnrywyksyqp.supabase.co';
  window.SUPABASE_ANON_KEY = 'sb_publishable_807NIkuj6MAs1KZY-m4tug_Fm1Mk-AO';
  window.SUPABASE_REST_URL = window.SUPABASE_URL + '/rest/v1';
  window.SUPABASE_HEADERS  = {
    'Content-Type' : 'application/json',
    'apikey'       : window.SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + window.SUPABASE_ANON_KEY,
    'Prefer'       : 'return=representation'
  };
  if (typeof supabase !== 'undefined') {
    window.supabaseClient = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
    console.log('%c Supabase Connected!', 'color:green;font-weight:bold', window.SUPABASE_URL);
  }
  async function supabaseSelect(table, query) {
    var url = window.SUPABASE_REST_URL + '/' + table + (query ? '?' + query : '');
    var res = await fetch(url, { method: 'GET', headers: window.SUPABASE_HEADERS });
    if (!res.ok) { var t = await res.text(); throw new Error('SELECT ' + table + ': ' + res.status + ' ' + t); }
    return res.json();
  }
  async function supabaseInsert(table, data) {
    var res = await fetch(window.SUPABASE_REST_URL + '/' + table, { method: 'POST', headers: window.SUPABASE_HEADERS, body: JSON.stringify(data) });
    if (!res.ok) { var t = await res.text(); throw new Error('INSERT ' + table + ': ' + res.status + ' ' + t); }
    return res.json();
  }
  async function supabaseUpdate(table, id, data, pk='id') {
    var url = window.SUPABASE_REST_URL + '/' + table + '?' + pk + '=eq.' + encodeURIComponent(id);
    var res = await fetch(url, { method: 'PATCH', headers: window.SUPABASE_HEADERS, body: JSON.stringify(data) });
    if (!res.ok) { var t = await res.text(); throw new Error('UPDATE ' + table + ': ' + res.status + ' ' + t); }
    return res.json();
  }
  async function supabaseDelete(table, id, pk='id') {
    var h = Object.assign({}, window.SUPABASE_HEADERS, { 'Prefer': 'return=minimal' });
    var url = window.SUPABASE_REST_URL + '/' + table + '?' + pk + '=eq.' + encodeURIComponent(id);
    var res = await fetch(url, { method: 'DELETE', headers: h });
    if (!res.ok) { var t = await res.text(); throw new Error('DELETE ' + table + ': ' + res.status + ' ' + t); }
    return true;
  }
  async function supabaseUpsert(table, data) {
    var h = Object.assign({}, window.SUPABASE_HEADERS, { 'Prefer': 'resolution=merge-duplicates,return=representation' });
    var res = await fetch(window.SUPABASE_REST_URL + '/' + table, { method: 'POST', headers: h, body: JSON.stringify(data) });
    if (!res.ok) { var t = await res.text(); throw new Error('UPSERT ' + table + ': ' + res.status + ' ' + t); }
    return res.json();
  }
</script>
