        document.documentElement.style.backgroundColor = '#0f172a';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.classList.remove('dark');
        document.documentElement.style.backgroundColor = '#f8fafc';

  })();

<body class="antialiased overflow-x-hidden selection:bg-blue-600 selection:text-white">

  <div id="initial-loader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999;">
    <div style="width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: initial-spin 1s linear infinite; margin-bottom: 20px;"></div>
    <style>@keyframes initial-spin { to { transform: rotate(360deg); } }</style>
    <h2 style="font-size: 1.5rem; font-weight: 800; color: #1e40af; margin: 0;">STK<span style="color: #475569;">System</span></h2>
    <p style="font-size: 0.875rem; color: #64748b; margin-top: 8px;">กำลังโหลดรายงานค่าแนะนำและปันผล...</p>
  </div>
  <script>
    try {
      if (localStorage.getItem('stk_reports_cache_data') || localStorage.getItem('stk_app_cache_data')) {
        var loader = document.getElementById('initial-loader');
        if (loader) loader.style.display = 'none';
      }
    } catch (e) {}
  </script>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback, useReducer } = React;
    const { 
        Sidebar, LoginModal, Toast, EditModal, 
        Gift, Coins, Activity, FileText, Archive, Eye, Info, SearchIcon, CheckCircle 
    } = window;

    const safeUpper = (str) => String(str || '').trim().toUpperCase();
    const getLocalISODate = () => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    function useDebounce(value, delay) {
        const [debouncedValue, setDebouncedValue] = useState(value);
        useEffect(() => {
            const handler = setTimeout(() => setDebouncedValue(value), delay);
            return () => clearTimeout(handler);
        }, [value, delay]);
        return debouncedValue;
    }

    const SubTabButton = ({ id, label, activeTab, setSubTab, isSpecial }) => {
        const isActive = activeTab === id;
        let baseClass = "px-4 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap flex-shrink-0 shadow-sm border ";
        if (isActive) {
            baseClass += isSpecial 
                ? "bg-indigo-600 text-white border-indigo-600 shadow-indigo-200 dark:shadow-none"
                : "bg-blue-600 text-white border-blue-600 shadow-blue-200 dark:shadow-none";
        } else {
            baseClass += "bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 hover:text-blue-600 dark:hover:text-white";
        }
        return (
            <button type="button" onClick={() => setSubTab(id)} className={baseClass}>
                {label}
            </button>
        );
    };

    // สมองกลการคำนวณค่าแนะนำและปันผล (Decoupled Calculation Engine)
    const {
        resolveTeamName,
        unfoldSales,
        extractCommissionConfig,
        calculateReferralReportData,
        calculateReferralDailyPayoutData,
        calculateReferralMonthlySelfData,
        calculateReferralMonthlyTeamData,
        calculateEarnerDetailItems,
        calculateReferralTotals,
        calculateActiveLevelTotals
    } = window.ReportReferralEngine || {};

    function App() {
        const [currentUser, setCurrentUser] = useState(() => {
            try {
                const saved = localStorage.getItem('stk_current_user');
                return saved ? JSON.parse(saved) : null;
            } catch(e) { return null; }
        });
        const [isLoggedIn, setIsLoggedIn] = useState(() => {
            try { return !!localStorage.getItem('stk_current_user'); } catch(e) { return false; }
        });
        const [showLoginModal, setShowLoginModal] = useState(false);

        // ⚡ INSTANT MOUNT CACHE INJECTION: เปิดหน้าปุ๊บ แสดงข้อมูลจาก Cache ทันที สลับหน้าลื่นไหล 0ms
        const initialCache = (() => {
            try { 
                const data = localStorage.getItem('stk_reports_cache_data') || localStorage.getItem('stk_app_cache_data'); 
                return data ? JSON.parse(data) : null; 
            } catch(e) { return null; }
        })();

        const [isAppLoading, setIsAppLoading] = useState(() => !initialCache);
        const [systemUsers, setSystemUsers] = useState(() => (initialCache && Array.isArray(initialCache.members)) ? initialCache.members : []);
        const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
            try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch (e) { return false; }
        });

        // Theme sync
        const [, forceThemeUpdate] = useReducer(x => x + 1, 0);
        useEffect(() => {
            const onThemeChange = () => forceThemeUpdate();
            window.addEventListener('stk_theme_change', onThemeChange);
            return () => window.removeEventListener('stk_theme_change', onThemeChange);
        }, []);

        // Master Data States
        const [sales, setSales] = useState(() => (initialCache && Array.isArray(initialCache.sales)) ? initialCache.sales : []);
        const [members, setMembers] = useState(() => (initialCache && Array.isArray(initialCache.members)) ? initialCache.members : []);
        const [products, setProducts] = useState(() => (initialCache && Array.isArray(initialCache.products)) ? initialCache.products : []);
        const [customers, setCustomers] = useState(() => (initialCache && Array.isArray(initialCache.customers)) ? initialCache.customers : []);
        const [businessTeams, setBusinessTeams] = useState(() => (initialCache && Array.isArray(initialCache.businessTeams)) ? initialCache.businessTeams : []);
        const [systemSettings, setSystemSettings] = useState(() => {
            try {
                const saved = localStorage.getItem('stk_system_settings');
                return saved ? JSON.parse(saved) : (initialCache?.systemSettings || { exchange_rate: 700, commission_levels: 6 });
            } catch(e) {
                return { exchange_rate: 700, commission_levels: 6 };
            }
        });
        const [payoutLogs, setPayoutLogs] = useState(() => (initialCache && Array.isArray(initialCache.payoutLogs)) ? initialCache.payoutLogs : []);

        // Filter States
        const todayStr = getLocalISODate();
        const [subTab, setSubTabState] = useState(() => {
            try {
                const params = new URLSearchParams(window.location.search);
                const tabParam = params.get('tab');
                if (tabParam && ['referral_fee', 'referral_payout', 'monthly_self', 'monthly_team'].includes(tabParam)) {
                    return tabParam;
                }
                const hash = (window.location.hash || '').replace('#', '').trim();
                if (hash && ['referral_fee', 'referral_payout', 'monthly_self', 'monthly_team'].includes(hash)) {
                    return hash;
                }
                const savedTab = sessionStorage.getItem('stk_report_referral_subtab');
                if (savedTab && ['referral_fee', 'referral_payout', 'monthly_self', 'monthly_team'].includes(savedTab)) {
                    return savedTab;
                }
            } catch(e) {}
            return 'referral_fee';
        });

        const setSubTab = (tab) => {
            setSubTabState(tab);
            try {
                sessionStorage.setItem('stk_report_referral_subtab', tab);
                const url = new URL(window.location.href);
                url.searchParams.set('tab', tab);
                window.history.replaceState(null, '', url.pathname + url.search + window.location.hash);
                if (window.top && window.top !== window && window.top.location) {
                    const topUrl = new URL(window.top.location.href);
                    topUrl.searchParams.set('tab', tab);
                    window.top.history.replaceState(null, '', topUrl.pathname + topUrl.search + topUrl.hash);
                }
            } catch(e) {}
        };
        const [summaryStartDate, setSummaryStartDate] = useState(() => {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`;
        });
        const [summaryEndDate, setSummaryEndDate] = useState(todayStr);

        const [dailyStartDate, setDailyStartDate] = useState(todayStr);
        const [dailyEndDate, setDailyEndDate] = useState(todayStr);

        const [monthlySelfPeriod, setMonthlySelfPeriod] = useState(() => {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        });
        const [monthlyTeamPeriod, setMonthlyTeamPeriod] = useState(() => {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        });

        const getMonthRange = (ym) => {
            const parts = (ym || `${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}`).split('-');
            const y = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10);
            const lastD = new Date(y, m, 0).getDate();
            return {
                start: `${y}-${String(m).padStart(2, '0')}-01`,
                end: `${y}-${String(m).padStart(2, '0')}-${String(lastD).padStart(2, '0')}`
            };
        };

        const currentSelfMonth = getMonthRange(monthlySelfPeriod);
        const currentTeamMonth = getMonthRange(monthlyTeamPeriod);

        const startDate = subTab === 'referral_payout' ? dailyStartDate : (subTab === 'monthly_self' ? currentSelfMonth.start : (subTab === 'monthly_team' ? currentTeamMonth.start : summaryStartDate));
        const endDate = subTab === 'referral_payout' ? dailyEndDate : (subTab === 'monthly_self' ? currentSelfMonth.end : (subTab === 'monthly_team' ? currentTeamMonth.end : summaryEndDate));
        const setStartDate = (val) => {
            if (subTab === 'referral_payout') setDailyStartDate(val);
            else setSummaryStartDate(val);
        };
        const setEndDate = (val) => {
            if (subTab === 'referral_payout') setDailyEndDate(val);
            else setSummaryEndDate(val);
        };

        const handleSubTabChange = (id) => {
            if (id === 'referral_payout') {
                setDailyStartDate(todayStr);
                setDailyEndDate(todayStr);
            }
            setSelectedPayoutKeys(new Set());
            setSubTab(id);
        };
        const [searchQuery, setSearchQuery] = useState('');
        const debouncedSearchQuery = useDebounce(searchQuery, 300);

        const [selectedTeamFilter, setSelectedTeamFilter] = useState('');
        const [selectedSponsorFilter, setSelectedSponsorFilter] = useState('');
        const [referralCalcMode, setReferralCalcMode] = useState('box'); // 'box' | 'percent' | 'combo'
        const [currencyMode, setCurrencyMode] = useState('LAK'); // 'LAK' | 'THB'
        const exchangeRate = Number(systemSettings?.exchange_rate || 700);

        // Payout & Detail States
        const [paidRecords, setPaidRecords] = useState(() => {
            try {
                const saved = localStorage.getItem('stk_payout_history');
                return saved ? JSON.parse(saved) : {};
            } catch(e) {
                return {};
            }
        });
        const [selectedPayoutKeys, setSelectedPayoutKeys] = useState(new Set());
        const [payoutStatusFilter, setPayoutStatusFilter] = useState('ALL'); // 'ALL' | 'PENDING' | 'PAID'
        const [showPayoutModal, setShowPayoutModal] = useState(false);
        const [payoutMethod, setPayoutMethod] = useState('เงินโอน');
        const [payoutNote, setPayoutNote] = useState('');
        const [isProcessingPayout, setIsProcessingPayout] = useState(false);
        const [detailModalEarner, setDetailModalEarner] = useState(null);

        const pagePerm = window.getUserPagePermission ? window.getUserPagePermission(currentUser, 'reports') : 'none';
        const isAdmin = currentUser && (
            String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || 
            String(currentUser.role).trim().toLowerCase().includes('admin') || String(currentUser.role).trim().includes('แอดมิน') ||
            pagePerm === 'full'
        );

        const handleLoginSuccess = (user) => {
            localStorage.setItem('stk_current_user', JSON.stringify(user));
            setCurrentUser(user);
            setIsLoggedIn(true);
            setShowLoginModal(false);
        };

        const handleLogout = () => {
            try {
                localStorage.removeItem('stk_current_user');
                localStorage.removeItem('stk_app_cache_data');
                localStorage.removeItem('stk_last_activity');
                sessionStorage.clear();
                localStorage.setItem('stk_broadcast_session_event', JSON.stringify({ action: 'logout', reason: 'manual_logout', time: Date.now() }));
            } catch(e) {}
            setCurrentUser(null);
            setIsLoggedIn(false);
            setSales([]);
            setMembers([]);
            setShowLoginModal(true);

            const targetUrl = (typeof window.resolvePageUrl === 'function')
                ? window.resolvePageUrl('?page=dashboard&login=1')
                : 'Mlm.html?login=1';
            try {
                if (window.top && window.top !== window && window.top.location) {
                    window.top.location.href = targetUrl;
                    return;
                }
            } catch(e) {}
            window.location.href = targetUrl;
        };

        const permittedMemberSet = useMemo(() => {
            if (!currentUser || isAdmin) return null;
            const userId = safeUpper(currentUser.id || currentUser.username);
            let downlines = new Set([userId]);
            let queue = [userId];

            while (queue.length > 0) {
                let parentId = queue.shift();
                (members || []).forEach(m => {
                    if (m && m.id) {
                        const sponsor = safeUpper(m.referrer || m.sponsorId);
                        if (sponsor === parentId) {
                            let mId = safeUpper(m.id);
                            if (!downlines.has(mId)) {
                                downlines.add(mId);
                                queue.push(mId);
                            }
                        }
                    }
                });
            }
            return downlines;
        }, [currentUser, isAdmin, members]);

        // Load master data
        const fetchReferralData = useCallback(async () => {
            try {
                const [pRes, memRes, custRes, saleRes, teamRes, settingsRes, payRes] = await Promise.all([
                    window.supabaseSelect('stk_products', 'select=product_id,name,category,price_full,price_member,price_promo,give_pv,current_stock,status,self_fee,level_1_fee,level_2_fee,level_3_fee,level_4_fee,level_5_fee,self_percent_full,level_1_percent_full,self_percent_member,level_1_percent_member').catch(() => []),
                    window.supabaseSelect('stk_members', 'select=user_id,name,sponsor_id,business_team,permission_role,status,bank_name,bank_account_no,bank_account_name').catch(() => window.supabaseSelect('stk_members', 'select=user_id,name,sponsor_id,business_team,permission_role,status')).catch(() => []),
                    window.supabaseSelect('stk_customers', 'select=customer_id,name,customer_type').catch(() => []),
                    window.supabaseSelect('stk_sales', 'order=order_id.desc&limit=2500').catch(() => []),
                    window.supabaseSelect('stk_business_teams').catch(() => []),
                    window.supabaseSelect('stk_system_settings').catch(() => []),
                    window.supabaseSelect('stk_payout_logs', 'order=payout_id.desc&limit=5000').catch(() => [])
                ]);

                let formattedMembers = members;
                if (Array.isArray(memRes)) {
                    setSystemUsers(memRes);
                    formattedMembers = memRes.map(m => ({
                        id: String(m.user_id || m.id || '').trim(),
                        name: String(m.name || '').trim(),
                        referrer: String(m.sponsor_id || m.referrer || '').trim(),
                        team: String(m.business_team || m.team || 'Marketing').trim(),
                        bankName: String(m.bank_name || m.bankName || '').trim(),
                        bankAccountNo: String(m.bank_account_no || m.bankAccountNo || '').trim(),
                        bankAccountName: String(m.bank_account_name || m.bankAccountName || '').trim()
                    }));
                    setMembers(formattedMembers);
                }

                let formattedProducts = products;
                if (Array.isArray(pRes)) {
                    formattedProducts = pRes.map(p => ({
                        ...p,
                        id: String(p.id || p.product_id || p.Product_ID || p.code || '').trim(),
                        name: String(p.name || p.product_name || p.Product_Name || p.id || '').trim()
                    }));
                    setProducts(formattedProducts);
                }

                if (Array.isArray(custRes)) setCustomers(custRes);
                let formattedTeams = businessTeams;
                if (Array.isArray(teamRes)) {
                    formattedTeams = teamRes.map(t => {
                        const tId = String(t.id || t.team_id || t.Team_ID || '').trim();
                        const tName = String(t.name || t.team_name || t.Team_Name || t.TeamName || tId).trim();
                        return {
                            ...t,
                            id: tId,
                            team_id: tId,
                            name: tName,
                            team_name: tName,
                            status: String(t.status || t.Status || 'ใช้งาน').trim()
                        };
                    });
                    setBusinessTeams(formattedTeams);
                }
                if (Array.isArray(payRes)) setPayoutLogs(payRes);

                // Settings
                let loadedSettings = { exchange_rate: 700, commission_levels: 6 };
                try {
                    const localSaved = localStorage.getItem('stk_system_settings');
                    if (localSaved) {
                        const parsed = JSON.parse(localSaved);
                        if (parsed && typeof parsed === 'object') loadedSettings = { ...loadedSettings, ...parsed };
                    }
                } catch(e) {}

                if (Array.isArray(settingsRes) && settingsRes.length > 0) {
                    const settingsObj = {};
                    settingsRes.forEach(s => {
                        if (s && (s.key || s.setting_key)) {
                            const k = s.key || s.setting_key;
                            const v = s.value !== undefined ? s.value : s.setting_value;
                            settingsObj[k] = typeof v === 'string' ? v : JSON.stringify(v);
                        }
                    });
                    if (settingsObj.MAIN) {
                        try {
                            const parsedMain = typeof settingsObj.MAIN === 'string' ? JSON.parse(settingsObj.MAIN) : settingsObj.MAIN;
                            if (parsedMain.commission_levels != null) settingsObj.commission_levels = Number(parsedMain.commission_levels);
                        } catch(e){}
                    }
                    loadedSettings = { ...loadedSettings, ...settingsObj };
                }
                setSystemSettings(loadedSettings);

                // Sales
                let formattedSales = sales;
                if (Array.isArray(saleRes)) {
                    formattedSales = saleRes.map(s => {
                        let parsedItems = [];
                        if (s.items_json) {
                            try { parsedItems = typeof s.items_json === 'string' ? JSON.parse(s.items_json) : s.items_json; } catch(e){}
                        }
                        return {
                            ...s,
                            id: s.order_id || s.id,
                            date: s.sale_date || s.date,
                            memberId: s.seller_id || s.member_id || s.memberId,
                            customerId: s.customer_id || s.customerId,
                            _items: parsedItems
                        };
                    });
                    setSales(formattedSales);
                }

                // ⚡ บันทึกข้อมูลลงใน Cache เพื่อให้เปิดหน้านี้ครั้งถัดไปและสลับหน้ารวดเร็ว 0ms ไม่กระตุก
                try {
                    const cachePayload = {
                        products: formattedProducts,
                        members: formattedMembers,
                        customers: (Array.isArray(custRes) ? custRes : customers).slice(0, 1000).map(c => ({ id: c.id || c.customer_id, name: c.name, type: c.type || c.customer_type })),
                        businessTeams: formattedTeams,
                        sales: formattedSales.slice(0, 1000),
                        payoutLogs: Array.isArray(payRes) ? payRes : payoutLogs,
                        systemSettings: loadedSettings
                    };
                    localStorage.setItem('stk_reports_cache_data', JSON.stringify(cachePayload));
                    localStorage.setItem('stk_app_cache_data', JSON.stringify(cachePayload));
                } catch(e){}
            } catch (err) {
                console.error("Referral fetch error:", err);
            } finally {
                setIsAppLoading(false);
            }
        }, []);

        // Initial Auth & Fetch
        useEffect(() => {
            const savedUser = localStorage.getItem('stk_current_user');
            if (savedUser) {
                try {
                    const parsed = JSON.parse(savedUser);
                    setCurrentUser(parsed);
                    setIsLoggedIn(true);
                } catch (e) {}
            }
            fetchReferralData();

            const loader = document.getElementById('initial-loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.transition = 'opacity 0.3s ease';
                setTimeout(() => loader.remove(), 300);
            }
        }, [fetchReferralData]);

        // Load and sync payout history records (Database is Single Source of Truth)
        useEffect(() => {
            let currentRecords = {};

            // ⚡ หากเชื่อมต่อ Supabase สำเร็จ ให้ใช้ข้อมูลจากฐานข้อมูลเป็นหลักเท่านั้น (Single Source of Truth)
            // ถ้าในฐานข้อมูลถูกลบไปแล้ว ในหน้าเว็บต้องกลับมาเป็น "รอปันผล" ทันที ไม่ดึงของเก่าที่ถูกลบไปแล้วกลับมา
            if (Array.isArray(payoutLogs)) {
                payoutLogs.forEach(log => {
                    if (!log) return;
                    const key = log.payout_id || `${log.member_id}_${log.payout_date}`;
                    if (key) {
                        currentRecords[key] = {
                            key: key,
                            payout_id: key,
                            status: log.status || 'PAID',
                            paidAt: log.paid_at || log.created_at,
                            paidBy: log.paid_by || log.member_name || 'แอดมิน',
                            amount: Number(log.amount) || 0,
                            memberId: log.member_id,
                            memberName: log.member_name || '',
                            team: log.team_name || '',
                            date: log.payout_date,
                            startDate: log.start_date || log.payout_date,
                            endDate: log.end_date || log.payout_date,
                            payoutType: log.payout_type || log.type,
                            type: log.payout_type || log.type
                        };
                    }
                });

                // ซิงค์ localStorage ให้ตรงกับฐานข้อมูลเป๊ะๆ เพื่อล้างประวัติของรายการที่ถูกลบออกจาก DB ทิ้ง
                try {
                    localStorage.setItem('stk_payout_history', JSON.stringify(currentRecords));
                    localStorage.removeItem('stk_payout_logs');
                    localStorage.removeItem('stk_referral_payout_history');
                } catch(e) {}
            } else {

                            </div>
                        )}

                        {/* Modal: Earner Breakdown Detail */}
                        {detailModalEarner && (
                            <EditModal isOpen={true} onClose={() => setDetailModalEarner(null)} title={(detailModalEarner.mode === 'monthly_self' || subTab === 'monthly_self') ? `รายละเอียดปันผลขายเอง: ${detailModalEarner.name || detailModalEarner.memberName}` : (detailModalEarner.mode === 'monthly_team' || subTab === 'monthly_team') ? `รายละเอียดปันผลสายงาน: ${detailModalEarner.name || detailModalEarner.memberName}` : `บัญชีแยกประเภทค่าแนะนำ & ค่าคอมมิชชัน: ${detailModalEarner.name || detailModalEarner.memberName}`} icon={SearchIcon} maxWidthClass="max-w-6xl">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 border-b border-slate-200 dark:border-slate-700 pb-4 gap-4 no-print">
                                    <div>
                                        <p className="text-sm font-bold text-slate-500 dark:text-slate-400 mb-1">รหัสพนักงาน: <span className="text-blue-600 dark:text-blue-400">{detailModalEarner.id}</span> &nbsp;|&nbsp; สังกัดทีม: <span className="text-slate-700 dark:text-slate-200">{detailModalEarner.team}</span></p>
                                        <p className="text-xs text-slate-400 dark:text-slate-500">{(detailModalEarner.mode === 'monthly_self' || subTab === 'monthly_self') ? 'ประวัติยอดขายตัวเอง' : (detailModalEarner.mode === 'monthly_team' || subTab === 'monthly_team') ? 'ประวัติรายได้จากสายงานลูกทีม' : 'ประวัติการรับเงินปันผล/ค่าคอมมิชชัน'}ช่วงวันที่ <span className="font-bold text-slate-600 dark:text-slate-300">{effectiveStartDate}</span> ถึง <span className="font-bold text-slate-600 dark:text-slate-300">{effectiveEndDate}</span></p>
                                    </div>
                                    <div className="flex items-center gap-2 shrink-0">
                                        <button onClick={handleExportEarnerDetailExcel} className="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition-all shadow-sm flex items-center gap-1.5 h-[36px]">
                                            <Archive size={14}/> ส่งออก Excel
                                        </button>
                                        <button onClick={() => handlePrintEarnerDetail(detailModalEarner, selectedEarnerDetails)} className="bg-slate-800 hover:bg-slate-900 dark:bg-slate-700 dark:hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-xs font-bold transition-all shadow-sm flex items-center gap-1.5 h-[36px]">
                                            <svg width="14" height="14" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg> 
                                            สั่งปริ้นท์ / PDF
                                        </button>
                                    </div>
                                </div>
                                <div className="border border-indigo-200 dark:border-indigo-900/60 rounded-xl overflow-hidden shadow-sm">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse min-w-[900px]">
                                            <thead>
                                                <tr className="bg-indigo-50 dark:bg-indigo-950/70 border-b-2 border-indigo-200 dark:border-indigo-900">
                                                    <th className={`${thBase} bg-transparent text-indigo-900 dark:text-indigo-200`}>วันที่</th>
                                                    <th className={`${thBase} bg-transparent text-indigo-900 dark:text-indigo-200`}>เลขที่บิล</th>
                                                    <th className={`${thBase} bg-transparent text-indigo-900 dark:text-indigo-200 text-center`}>ประเภทได้รับ</th>
                                                    <th className={`${thBase} bg-transparent text-indigo-900 dark:text-indigo-200`}>ผู้ขายบิลนี้</th>
                                                    <th className={`${thBase} bg-transparent text-indigo-900 dark:text-indigo-200`}>สินค้าที่ขายได้</th>
                                                    <th className={`${thBase} bg-transparent text-indigo-900 dark:text-indigo-200 text-right`}>เรทคำนวณ</th>
                                                    <th className={`${thBase} bg-transparent text-indigo-900 dark:text-indigo-200 text-right font-black`}>เงินที่ได้ ({getCurrencySuffix()})</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {selectedEarnerDetails.map((d, index) => (
                                                    <tr key={index} className="border-b border-slate-100 dark:border-slate-800/70 hover:bg-indigo-50/50 dark:hover:bg-indigo-950/30 transition-colors">
                                                        <td className="p-3 text-xs font-bold text-slate-600 dark:text-slate-300 whitespace-nowrap">{d.date}</td>
                                                        <td className="p-3 text-xs font-bold text-blue-600 dark:text-blue-400 whitespace-nowrap">{d.billId}</td>
                                                        <td className="p-3 text-center">
                                                            <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold border whitespace-nowrap ${d.level.includes('ขายเอง') ? 'bg-blue-50 dark:bg-blue-950/50 text-blue-700 dark:text-blue-300 border-blue-200 dark:border-blue-800' : 'bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800'}`}>
                                                                {d.level}
                                                            </span>
                                                        </td>
                                                        <td className="p-3">
                                                            <div className="font-bold text-slate-700 dark:text-slate-200 text-xs truncate max-w-[200px]">{d.sellerName}</div>
                                                            <div className="text-[10px] text-slate-400 dark:text-slate-500">{d.sellerId}</div>
                                                        </td>
                                                        <td className="p-3">
                                                            <span className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 font-bold px-2 py-1 rounded border border-slate-200 dark:border-slate-700 text-xs whitespace-nowrap">
                                                                {d.product} <span className="text-blue-600 dark:text-blue-400 ml-1">x{d.qty}</span>
                                                            </span>
                                                        </td>
                                                        <td className="p-3 text-xs text-right font-medium text-slate-500 dark:text-slate-400 whitespace-nowrap">{d.feeRateStr}</td>
                                                        <td className="p-3 text-sm text-right font-black text-indigo-700 dark:text-indigo-300 whitespace-nowrap">{formatValDisplay(d.totalEarned)}</td>
                                                    </tr>
                                                ))}
                                                {selectedEarnerDetails.length === 0 && (
                                                    <tr><td colSpan="7" className="p-8 text-center text-slate-400 dark:text-slate-500 font-bold">ไม่พบประวัติการรับค่าแนะนำในช่วงเวลานี้</td></tr>
                                                )}
                                            </tbody>
                                            <tfoot className="bg-indigo-950 dark:bg-slate-950 text-white sticky bottom-0">
                                                <tr>
                                                    <td colSpan="6" className="p-3 text-right align-middle font-bold text-indigo-200 text-sm">ยอดรวมเจาะลึกเฉพาะบัญชีนี้:</td>
                                                    <td className="p-3 text-right align-middle whitespace-nowrap">
                                                        <span className="text-xl font-black text-white drop-shadow-md">
                                                            {formatValDisplay(selectedEarnerDetails.reduce((sum, d) => sum + d.totalEarned, 0))}
                                                        </span>
                                                        <span className="text-[10px] text-indigo-300 font-bold ml-1">{getCurrencySuffix()}</span>
                                                    </td>
                                                </tr>
                                            </tfoot>
                                        </table>
                                    </div>
                                </div>
                            </EditModal>
                        )}

                        {/* Modal: Confirm Payout */}
                        <EditModal isOpen={showPayoutModal} onClose={() => setShowPayoutModal(false)} title="ยืนยันการสั่งจ่ายเงินปันผล" icon={CheckCircle} maxWidthClass="max-w-3xl">
                            <div className="space-y-4">
                                <div className="bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/60 p-4 rounded-xl">
                                    <h3 className="text-amber-800 dark:text-amber-300 font-bold mb-2">รายการที่เลือกจ่าย ({Array.from(selectedPayoutKeys).length} รายการ)</h3>
                                    <div className="max-h-48 overflow-y-auto pr-2">
                                        <ul className="space-y-2">
                                            {Array.from(selectedPayoutKeys).map(key => {
                                                const r = subTab === 'monthly_self' 
                                                    ? referralMonthlySelfData.find(x => x.key === key)
                                                    : subTab === 'monthly_team'
                                                    ? referralMonthlyTeamData.find(x => x.key === key)
                                                    : referralDailyPayoutData.find(x => x.key === key);
                                                const amt = subTab === 'monthly_self' 
                                                    ? (r?.remainingSelf || 0)
                                                    : subTab === 'monthly_team'
                                                    ? (r?.remainingTeam || 0)
                                                    : (r?.totalEarn || 0);
                                                return (
                                                    <li key={key} className="flex justify-between items-center bg-white dark:bg-slate-800 p-2.5 rounded-lg border border-amber-100 dark:border-slate-700 text-sm">
                                                        <span className="font-bold text-slate-700 dark:text-slate-200">{r?.memberName || r?.name || key} <span className="text-[10px] text-slate-400 dark:text-slate-500 ml-1">({r?.memberId || r?.id})</span></span>
                                                        <span className="font-black text-rose-600 dark:text-rose-400">{formatValDisplay(amt)} {getCurrencySuffix()}</span>
                                                    </li>
                                                );
                                            })}
                                        </ul>
                                    </div>
                                    <div className="mt-3 pt-3 border-t border-amber-200 dark:border-amber-800 flex justify-between items-center">
                                        <span className="font-bold text-amber-900 dark:text-amber-200">ยอดจ่ายรวมทั้งหมด:</span>
                                        <span className="text-xl font-black text-amber-600 dark:text-amber-400">
                                            {formatValDisplay(Array.from(selectedPayoutKeys).reduce((sum, key) => {
                                                const r = subTab === 'monthly_self' 
                                                    ? referralMonthlySelfData.find(x => x.key === key)
                                                    : subTab === 'monthly_team'
                                                    ? referralMonthlyTeamData.find(x => x.key === key)
                                                    : referralDailyPayoutData.find(x => x.key === key);
                                                const amt = subTab === 'monthly_self' 
                                                    ? (r?.remainingSelf || 0)
                                                    : subTab === 'monthly_team'
                                                    ? (r?.remainingTeam || 0)
                                                    : (r?.totalEarn || 0);
                                                return sum + amt;
                                            }, 0))} {getCurrencySuffix()}
                                        </span>
                                    </div>
                                </div>
                                
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label className={labelClassHud}>ช่องทางการจ่าย</label>
                                        <select className={inputClassHud} value={payoutMethod} onChange={e => setPayoutMethod(e.target.value)}>
                                            <option value="เงินโอน">โอนเข้าบัญชีธนาคาร</option>
                                            <option value="เงินสด">เงินสด</option>
                                            <option value="อื่นๆ">อื่นๆ</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className={labelClassHud}>หมายเหตุ (อ้างอิงการโอน)</label>
                                        <input type="text" className={inputClassHud} placeholder="เลขที่อ้างอิง, รายละเอียด..." value={payoutNote} onChange={e => setPayoutNote(e.target.value)} />
                                    </div>
                                </div>

                                <div className="flex justify-end gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                                    <button type="button" onClick={() => setShowPayoutModal(false)} className={btnClassSecondary}>ยกเลิก</button>
                                    <button type="button" onClick={() => handleSavePayouts(selectedPayoutKeys)} disabled={isProcessingPayout} className={btnClassPrimary}>
                                        {isProcessingPayout ? 'กำลังบันทึก...' : 'ยืนยันการจ่ายเงิน'}
                                    </button>
                                </div>
                            </div>
                        </EditModal>

                    </div>
                </main>
                <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={systemUsers} />
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
