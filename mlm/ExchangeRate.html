<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งค่าอัตราแลกเปลี่ยน - LOVE STK GROUPE</title>
  <!-- Standalone & GAS Libraries -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&display=swap');
    body { font-family: 'Inter', 'IBM Plex Sans Thai', 'Noto Sans Lao', sans-serif; background-color: #f8fafc; color: #0f172a; }
  </style>
  <script>(function(){var w=console.warn;console.warn=function(){var m=arguments[0]?String(arguments[0]):'';if(m.includes('cdn.tailwindcss.com')||m.includes('in-browser Babel transformer'))return;w.apply(console,arguments);};})();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    window.SUPABASE_URL='https://qqyotianqcgpdzrfgjif.supabase.co';window.SUPABASE_ANON_KEY='sb_publishable_807NIkuj6MAs1KZY-m4tug_Fm1Mk-AO';window.SUPABASE_REST_URL=window.SUPABASE_URL+'/rest/v1';window.SUPABASE_HEADERS={'Content-Type':'application/json','apikey':window.SUPABASE_ANON_KEY,'Authorization':'Bearer '+window.SUPABASE_ANON_KEY,'Prefer':'return=representation'};
    if(typeof supabase!=='undefined'){window.supabaseClient=supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);console.log('%c✅ Supabase Connected!','color:green;font-weight:bold',window.SUPABASE_URL);}
    async function supabaseSelect(t,q){var r=await fetch(window.SUPABASE_REST_URL+'/'+t+(q?'?'+q:''),{method:'GET',headers:window.SUPABASE_HEADERS});if(!r.ok)throw new Error('SELECT '+t+':'+r.status);return r.json();}
    async function supabaseInsert(t,d){var r=await fetch(window.SUPABASE_REST_URL+'/'+t,{method:'POST',headers:window.SUPABASE_HEADERS,body:JSON.stringify(d)});if(!r.ok)throw new Error('INSERT '+t+':'+r.status);return r.json();}
    async function supabaseUpdate(t,id,d){var r=await fetch(window.SUPABASE_REST_URL+'/'+t+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:window.SUPABASE_HEADERS,body:JSON.stringify(d)});if(!r.ok)throw new Error('UPDATE '+t+':'+r.status);return r.json();}
    async function supabaseDelete(t,id){var r=await fetch(window.SUPABASE_REST_URL+'/'+t+'?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:Object.assign({},window.SUPABASE_HEADERS,{'Prefer':'return=minimal'})});if(!r.ok)throw new Error('DELETE '+t+':'+r.status);return true;}
    async function supabaseUpsert(t,d){var r=await fetch(window.SUPABASE_REST_URL+'/'+t,{method:'POST',headers:Object.assign({},window.SUPABASE_HEADERS,{'Prefer':'resolution=merge-duplicates,return=representation'}),body:JSON.stringify(d)});if(!r.ok)throw new Error('UPSERT '+t+':'+r.status);return r.json();}
  </script>
  <script src="CommonComponents.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() { var l=document.getElementById('initial-loader'); if(l)l.style.display='none'; }, 600);
    });
  </script>
  <?!= include('Includes'); ?>
</head>
<body class="antialiased overflow-x-hidden selection:bg-blue-600 selection:text-white">

  <div id="initial-loader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999;">
    <div style="width: 60px; height: 60px; border: 4px solid #e2e8f0; border-top-color: #2563eb; border-radius: 50%; animation: initial-spin 1s linear infinite; margin-bottom: 24px;"></div>
    <style>@keyframes initial-spin { to { transform: rotate(360deg); } }</style>
    <h2 style="font-size: 1.75rem; font-weight: 800; color: #1e40af; margin: 0; letter-spacing: -0.025em;">STK<span style="color: #475569;">System</span></h2>
    <p style="font-size: 0.875rem; color: #64748b; font-weight: 500; margin-top: 8px;">กำลังโหลดระบบจัดการข้อมูล...</p>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;

    const fallbackCustomerTypes = window.fallbackCustomerTypes || [
       { id: 'T001', name: 'ลูกค้าใหม่', status: 'ใช้งาน' },
       { id: 'T002', name: 'ลูกค้าเก่ากลับมาต่อยา', status: 'ใช้งาน' }
    ];
    const fallbackProductsList = window.fallbackProductsList || ['SESAMIN', 'APPLE', 'KING_GOLD'];

    /* <?!= include('CommonComponents'); ?> */


    // ==========================================
    // 📌 Exchange Rate Configuration Component
    // ==========================================
    const ExchangeRateConfigView = ({ systemSettings, setSystemSettings, exchangeRateHistory, setExchangeRateHistory, showToast, currentUser, isAdmin }) => {
        const [rateInput, setRateInput] = useState(systemSettings?.exchange_rate || 700);
        const [isSaving, setIsSaving] = useState(false);
        const [searchTerm, setSearchTerm] = useState('');

        useEffect(() => {
            if (systemSettings?.exchange_rate !== undefined) {
                setRateInput(systemSettings.exchange_rate);
            }
        }, [systemSettings]);

        const handleSave = (e) => {
            e.preventDefault();
            const val = Number(rateInput) || 0;
            if (val <= 0) {
                showToast('อัตราแลกเปลี่ยนต้องมากกว่า 0', 'error');
                return;
            }
            
            setIsSaving(true);
            const updaterName = currentUser ? (currentUser.name || currentUser.username) : 'Admin';
            
            if (typeof google !== 'undefined' && google.script) {
                google.script.run
                    .withSuccessHandler((res) => {
                        setIsSaving(false);
                        if (res === 'success') {
                            showToast(`อัปเดตอัตราแลกเปลี่ยนเป็น ${val} กีบ/บาท สำเร็จ`, 'success');
                            setSystemSettings(prev => ({ ...prev, exchange_rate: val }));
                            
                            // Prepend new history record locally
                            const nowStr = getLocalISODateTimeStr();
                            setExchangeRateHistory(prev => [
                                { timestamp: nowStr, rate: val, updatedBy: updaterName },
                                ...prev
                            ]);
                        } else {
                            showToast('บันทึกล้มเหลว: ' + res, 'error');
                        }
                    })
                    .withFailureHandler((err) => {
                        setIsSaving(false);
                        showToast('เกิดข้อผิดพลาดในการบันทึก: ' + err, 'error');
                    })
                    .saveExchangeRateWithHistory(val, updaterName);
            } else {
                setTimeout(() => {
                    setIsSaving(false);
                    setSystemSettings(prev => ({ ...prev, exchange_rate: val }));
                    
                    const nowStr = getLocalISODateTimeStr();
                    setExchangeRateHistory(prev => [
                        { timestamp: nowStr, rate: val, updatedBy: updaterName },
                        ...prev
                    ]);
                    showToast(`จำลองอัปเดตอัตราแลกเปลี่ยนสำเร็จ: 1 ฿ = ${val} ₭`, 'success');
                }, 800);
            }
        };

        const getLocalISODateTimeStr = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            const seconds = String(d.getSeconds()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
        };

        const filteredHistory = useMemo(() => {
            return (exchangeRateHistory || []).filter(item => {
                const term = searchTerm.toLowerCase().trim();
                if (!term) return true;
                return (
                    item.timestamp.toLowerCase().includes(term) ||
                    String(item.rate).includes(term) ||
                    item.updatedBy.toLowerCase().includes(term)
                );
            });
        }, [exchangeRateHistory, searchTerm]);

        return (
          <div className="space-y-6 animation-fade-in relative w-full">
            <div>
              <h2 className="text-2xl font-bold text-slate-800">ตั้งค่าอัตราแลกเปลี่ยนเงินกีบ (Exchange Rate Settings)</h2>
              <p className="text-sm text-slate-500 mt-1">จัดการอัตราการแลกเปลี่ยนสกุลเงินกีบลาว (LAK) ต่อบาทไทย (THB) และตรวจสอบประวัติการเปลี่ยนแปลงทั้งหมด</p>
            </div>

            {/* Current Config Form */}
            <div className="bg-gradient-to-br from-amber-500 to-orange-600 rounded-3xl p-6 text-white shadow-xl shadow-amber-500/10 border border-amber-400/20">
              <form onSubmit={handleSave} className="flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                <div className="space-y-2">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">🇱🇦</span>
                    <h3 className="text-lg font-extrabold uppercase tracking-wider">กำหนดมูลค่าอัตราแลกเปลี่ยน</h3>
                  </div>
                  <p className="text-xs text-amber-100/90 font-medium max-w-xl">
                    กรุณากรอกจำนวนกีบลาวที่เท่ากับ 1 บาทไทย (THB) อัตราแลกเปลี่ยนนี้จะมีผลต่อหน้าขาย POS ทันที
                  </p>
                  <div className="mt-4 flex items-center gap-3">
                    <span className="text-2xl font-black">1 ฿ (THB) =</span>
                    <input
                      type="number"
                      min="1"
                      step="1"
                      disabled={!isAdmin || isSaving}
                      className="border-2 border-white/40 bg-white/10 focus:bg-white text-amber-900 focus:text-slate-800 px-4 py-3 rounded-2xl outline-none text-2xl font-black focus:border-white focus:ring-4 focus:ring-amber-300/30 transition-all max-w-[180px] disabled:opacity-60"
                      value={rateInput}
                      onChange={e => setRateInput(e.target.value)}
                    />
                    <span className="text-2xl font-black">₭ (LAK)</span>
                  </div>
                </div>

                <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-4 w-full md:w-auto shrink-0">
                  <div className="bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl px-5 py-3.5 text-center">
                    <div className="text-[10px] font-bold text-amber-100 uppercase tracking-widest">เรทที่ใช้งานปัจจุบัน</div>
                    <div className="font-black text-2xl text-white mt-1">1 ฿ = {(systemSettings?.exchange_rate || 700).toLocaleString()} ₭</div>
                  </div>
                  
                  {isAdmin && (
                    <button
                      type="submit"
                      disabled={isSaving}
                      className="bg-white hover:bg-amber-550 text-amber-700 hover:text-amber-800 font-extrabold py-4 px-6 rounded-2xl shadow-lg transition-all text-sm disabled:opacity-60 whitespace-nowrap active:scale-95"
                    >
                      {isSaving ? '⏳ กำลังบันทึก...' : '💾 บันทึกอัตราแลกเปลี่ยน'}
                    </button>
                  )}
                </div>
              </form>
            </div>

            {/* History List */}
            <div className={`${boxWrapper} flex-1 flex flex-col min-h-[400px] relative`}>
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-5 border-b border-slate-100 pb-5">
                 <h3 className={titleClass}><Activity size={24} className="text-amber-500"/> ประวัติการเปลี่ยนแปลง (Update History)</h3>
                 
                 <div className="flex items-center bg-slate-50/30 focus-within:bg-white border border-slate-200 rounded-xl px-3 shadow-sm focus-within:border-blue-500 focus-within:ring-4 focus-within:ring-blue-100 transition-all duration-300 w-full sm:w-72 h-[38px] sm:h-[40px]">
                    <SearchIcon size={18} className="text-slate-400 shrink-0" />
                    <input 
                      type="text" 
                      placeholder="ค้นหาวันที่, อัตรา หรือชื่อ..." 
                      className="w-full bg-transparent border-none outline-none text-[13px] font-medium text-slate-800 placeholder-slate-400 pl-2 h-full" 
                      value={searchTerm} 
                      onChange={e => setSearchTerm(e.target.value)} 
                    />
                 </div>
              </div>

              <div className="w-full overflow-y-auto rounded-2xl border border-slate-200 hide-scroll flex-1 bg-white shadow-sm mb-2">
                <table className="w-full text-left border-collapse relative">
                   <thead className="sticky top-0 z-20 bg-slate-50 shadow-sm border-b border-slate-200">
                     <tr>
                       <th className={`${tableHeaderClass} w-[80px] text-center`}>รอบที่ (No.)</th>
                       <th className={`${tableHeaderClass} text-center w-[25%]`}>วันเวลาที่อัปเดต</th>
                       <th className={`${tableHeaderClass} text-center w-[30%]`}>อัตราแลกเปลี่ยนที่เปลี่ยน (LAK)</th>
                       <th className={`${tableHeaderClass} text-center`}>ผู้ดำเนินการ</th>
                     </tr>
                   </thead>
                   <tbody>
                     {filteredHistory.map((item, idx) => {
                        const roundNum = filteredHistory.length - idx;
                        return (
                          <tr key={`${item.timestamp}-${idx}`} className="hover:bg-slate-50/70 border-b border-slate-100/80 transition-colors">
                            <td className={`${tableCellClass} font-bold text-slate-500 text-center`}>{roundNum}</td>
                            <td className={`${tableCellClass} font-semibold text-slate-600 text-center`}>{item.timestamp}</td>
                            <td className={`${tableCellClass} text-center`}>
                              <span className="inline-flex items-center px-3 py-1 bg-amber-50 text-amber-800 border border-amber-200 rounded-lg text-xs font-black">
                                1 ฿ = {item.rate.toLocaleString()} ₭
                              </span>
                            </td>
                            <td className={`${tableCellClass} font-extrabold text-slate-700 text-center`}>
                              <div className="flex items-center justify-center gap-1.5">
                                <span className="w-2 h-2 rounded-full bg-blue-500"></span>
                                {item.updatedBy || 'ไม่ระบุ'}
                              </div>
                            </td>
                          </tr>
                        );
                     })}

                     {filteredHistory.length === 0 && (
                        <tr>
                          <td colSpan="4" className="py-16 text-center text-slate-400">
                            <div className="flex flex-col items-center gap-2">
                              <Info size={32} className="text-slate-300" />
                              <span className="text-xs font-bold">ไม่มีประวัติการอัปเดตอัตราแลกเปลี่ยน</span>
                            </div>
                          </td>
                        </tr>
                     )}
                   </tbody>
                </table>
              </div>
            </div>
          </div>
        );
    };


    // ==========================================
    // 📌 Main App Wrapper Component
    // ==========================================
    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      
      const [systemSettings, setSystemSettings] = useState(null);
      const [exchangeRateHistory, setExchangeRateHistory] = useState([]);
      const [systemUsers, setSystemUsers] = useState([]);
      const [isAppLoading, setIsAppLoading] = useState(true);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try {
          return localStorage.getItem('stk_sidebar_collapsed') === 'true';
        } catch(e) {
          return false;
        }
      });
      
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const showToast = useCallback((msg, type = 'success') => {
        setToast({ show: true, message: msg, type });
        if (type === 'success') {
          setTimeout(() => setToast(prev => ({ ...prev, show: false })), 2500);
        }
      }, []);

      const SCRIPT_URL = '<?= getScriptUrl() ?>';
      const currentUserProfileUrl = 'https://ui-avatars.com/api/?name=Admin&background=3b82f6&color=ffffff&rounded=true&bold=true';
      const isAdmin = currentUser && (
        String(currentUser.role).trim() === 'ผู้ดูแลระบบ' ||
        String(currentUser.role).trim().toLowerCase() === 'admin'
      );

      useEffect(() => {
        // Restore session
        try {
          const savedUser = localStorage.getItem('stk_current_user');
          if (savedUser) {
            const u = JSON.parse(savedUser);
            setCurrentUser(u);
            setIsLoggedIn(true);
          } else {
            setShowLoginModal(true);
          }
        } catch(e) {}

        const initialLoader = document.getElementById('initial-loader');
        if (initialLoader) {
            initialLoader.style.display = 'none';
        }

        // Fetch initial data
        if (typeof google !== 'undefined' && google.script) {
           google.script.run
             .withSuccessHandler((response) => {
                if (response) {
                    try { localStorage.setItem('stk_app_cache_data', JSON.stringify(response)); } catch(e){}
                    applyDataToStates(response);
                }
                setIsAppLoading(false); 
             })
             .withFailureHandler((error) => {
                setIsAppLoading(false);
                showToast('การเชื่อมต่อเซิร์ฟเวอร์ขัดข้อง: ' + (error ? (error.message || error) : ''), 'error');
             })
             .getInitialData(); 
        } else {
           // Mock Data for local testing
           setSystemSettings({ min_dividend_pv: 100, exchange_rate: 700 });
           setExchangeRateHistory([
             { timestamp: '2026-07-14 12:00:00', rate: 700, updatedBy: 'Sackda' },
             { timestamp: '2026-07-10 09:30:15', rate: 680, updatedBy: 'Admin' }
           ]);
           setIsAppLoading(false);
        }
      }, []);

      const applyDataToStates = (response) => {
           if (response.systemSettings) {
               setSystemSettings(response.systemSettings);
           }
           if (Array.isArray(response.exchangeRateHistory)) {
               setExchangeRateHistory(response.exchangeRateHistory);
           }
           if (Array.isArray(response.systemUsers)) {
               setSystemUsers(response.systemUsers);
           }
      };

      const handleLoginSuccess = (user) => {
        localStorage.setItem('stk_current_user', JSON.stringify(user));
        setCurrentUser(user);
        setIsLoggedIn(true);
        setShowLoginModal(false);
        showToast('เข้าสู่ระบบสำเร็จ!', 'success');
      };

      const handleLogout = () => {
        localStorage.removeItem('stk_current_user');
        setCurrentUser(null);
        setIsLoggedIn(false);
        if (typeof window !== 'undefined') {
          window.open(resolvePageUrl(SCRIPT_URL + '?page=dashboard'), '_top');
        }
      };

      return (
        <div className="min-h-screen flex font-sans bg-slate-50">
          <Sidebar 
            activePage="exchange_rate" 
            isLoggedIn={isLoggedIn} 
            currentUser={currentUser} 
            currentUserProfileUrl={currentUserProfileUrl} 
            isAdmin={isAdmin} 
            onLogout={handleLogout} 
            showLoginModal={showLoginModal} 
            setShowLoginModal={setShowLoginModal} 
            SCRIPT_URL={SCRIPT_URL}
            setIsAppLoading={setIsAppLoading}
            isSidebarCollapsed={isSidebarCollapsed}
            setIsSidebarCollapsed={setIsSidebarCollapsed}
          />
          
          <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>
            
            {toast.show && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4 animation-fade-in" style={{ animationDuration: '0.2s' }}>
                 <div className={`bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center animation-pop border-t-4 ${toast.type === 'error' ? 'border-red-500' : toast.type === 'info' ? 'border-blue-500' : 'border-emerald-500'}`}>
                    <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${toast.type === 'error' ? 'bg-red-100 text-red-500' : toast.type === 'info' ? 'bg-blue-100 text-blue-500' : 'bg-emerald-100 text-emerald-500'}`}>
                       {toast.type === 'error' ? <X size={32} /> : toast.type === 'info' ? <Trophy size={32} /> : <CheckCircle size={32} />}
                    </div>
                    <h3 className="text-xl font-bold text-slate-800 mb-2">{toast.type === 'error' ? 'เกิดข้อผิดพลาด' : toast.type === 'info' ? 'แจ้งเตือน' : 'สำเร็จ!'}</h3>
                    <p className="text-slate-600 font-medium text-sm mb-6">{toast.message}</p>
                    <button onClick={() => setToast({ ...toast, show: false })} className="w-full py-2.5 rounded-lg font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">ตกลง</button>
                 </div>
              </div>
            )}

            <div className="p-3 sm:p-6 flex-1 w-full relative z-0">
              <div className="w-full relative z-10">
                {isAppLoading ? (
                  <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                    <div className="w-16 h-16 border-[4px] border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                    <h2 className="text-lg font-bold text-slate-700">กำลังซิงค์ข้อมูลกับฐานข้อมูล...</h2>
                    <p className="text-slate-500 text-sm">กรุณารอสักครู่ ระบบกำลังดึงข้อมูลล่าสุด</p>
                  </div>
                ) : isLoggedIn ? (
                  <ExchangeRateConfigView 
                    systemSettings={systemSettings} 
                    setSystemSettings={setSystemSettings}
                    exchangeRateHistory={exchangeRateHistory}
                    setExchangeRateHistory={setExchangeRateHistory}
                    showToast={showToast} 
                    currentUser={currentUser}
                    isAdmin={isAdmin}
                  />
                ) : (
                  <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                    <h2 className="text-xl font-black text-red-500">กรุณาเข้าสู่ระบบก่อนใช้งาน</h2>
                    <button onClick={() => setShowLoginModal(true)} className={btnClassPrimary}>เข้าสู่ระบบ</button>
                  </div>
                )}
              </div>
            </div>

            <footer className="w-full text-center py-6 mt-auto border-t border-slate-200/50 no-print shrink-0">
               <p className="text-[11px] font-bold text-slate-400 opacity-60 hover:opacity-100 transition-opacity">
                  &copy; {new Date().getFullYear()} STK Sales Management System. Developed by Sackda Southammavong.
               </p>
            </footer>

          </main>

          <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={systemUsers} />

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
