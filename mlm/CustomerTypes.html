<!DOCTYPE html>
<html lang="th">
<head>
<script>
  (function() {
    try {
      var theme = localStorage.getItem('stk_theme');
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.backgroundColor = '#0f172a';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.style.backgroundColor = '#f8fafc';
      }
    } catch (e) {}
  })();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ประเภทลูกค้า (Customer Types) - LOVE STK GROUPE</title>
  <!-- Standalone & GAS Libraries -->
  <link rel="stylesheet" href="mainstyle.css?v=6">
  <script>(function(){var w=console.warn;console.warn=function(){var m=arguments[0]?String(arguments[0]):'';if(m.includes('cdn.tailwindcss.com')||m.includes('in-browser Babel transformer'))return;w.apply(console,arguments);};})();</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="dictionary.js"></script>
  <script src="CommonComponents.js?v=3"></script>
</head>
<body class="antialiased overflow-x-hidden selection:bg-blue-600 selection:text-white">

  

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;
    const { 
      LayoutDashboard, ShoppingCart, Users, Contact, Headset, BarChart3, Plus, Edit, Trash2, 
      UserCircle, Menu, X, Save, Info, PackageIcon, Target, Trophy, Activity, Eye, Tags, 
      CheckCircle, GitBranch, Archive, ChevronDown, FileText, SettingsIcon, Coins, ShieldCheck, 
      LoginModal, Toast, Sidebar, Header, ConfirmModal, EditModal, DonutChart, AutoSuggestInput, 
      SearchIcon 
    } = window;

    const Search = SearchIcon || (({ size = 18, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    ));

    const Tag = Tags || (({ size = 20, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>
    ));

    const AlertTriangle = window.AlertTriangle || (({ size = 24, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    ));

    const fallbackCustomerTypes = [
      { id: 'T001', name: 'ลูกค้าใหม่มาตรวจ', status: 'ใช้งาน' },
      { id: 'T002', name: 'ลูกค้าเก่ากลับมาต่อยา', status: 'ใช้งาน' },
      { id: 'T003', name: 'ลูกค้าใหม่นำผลตรวจมาปรึกษา', status: 'ใช้งาน' },
      { id: 'T004', name: 'โทรปิดการขายลูกค้าใหม่', status: 'ใช้งาน' },
      { id: 'T005', name: 'ลูกค้านำผลตรวจมาปรึกษา', status: 'ใช้งาน' },
      { id: 'T006', name: 'โทรปิดการขายลูกค้าเก่า', status: 'ใช้งาน' },
      { id: 'T007', name: 'ส่วนกลางใหม่', status: 'ใช้งาน' }
    ];

    const boxWrapper = "bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5";
    const btnClassPrimary = "inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-sm transition-all text-sm";
    const tableHeaderClass = "py-3.5 px-4 text-xs font-bold text-slate-500 uppercase tracking-wider bg-slate-50 border-b border-slate-200";
    const tableCellClass = "py-3.5 px-4 text-sm font-medium text-slate-700 border-b border-slate-100";

    const CustomerTypesManagementView = ({ customerTypes, setCustomerTypes, isAdmin, showToast }) => {
        const [searchTerm, setSearchTerm] = useState('');
        const [showModal, setShowModal] = useState(false);
        const [editingItem, setEditingItem] = useState(null);
        const [formData, setFormData] = useState({ id: '', name: '', status: 'ใช้งาน' });
        const [confirmDelete, setConfirmDelete] = useState({ show: false, id: null, title: '' });

        const filteredTypes = useMemo(() => {
          if (!customerTypes) return [];
          return customerTypes.filter(t => 
            (t.id && t.id.toLowerCase().includes(searchTerm.toLowerCase())) ||
            (t.name && t.name.toLowerCase().includes(searchTerm.toLowerCase()))
          );
        }, [customerTypes, searchTerm]);

        const handleOpenAdd = () => {
          const usedNums = new Set((customerTypes || []).map(t => {
            const m = String(t.id || '').match(/\d+/);
            return m ? parseInt(m[0], 10) : 0;
          }));
          let nextNum = 1;
          while (usedNums.has(nextNum)) nextNum++;
          const nextIdStr = 'T' + nextNum.toString().padStart(3, '0');
          setFormData({ id: nextIdStr, name: '', status: 'ใช้งาน' });
          setEditingItem(null);
          setShowModal(true);
        };

        const handleOpenEdit = (item) => {
          setFormData({ id: item.id, name: item.name, status: item.status || 'ใช้งาน' });
          setEditingItem(item);
          setShowModal(true);
        };

        const handleSave = async (e) => {
          e.preventDefault();
          if (!formData.name.trim()) {
            showToast('กรุณากรอกชื่อประเภทลูกค้า', 'error');
            return;
          }

          try {
            if (editingItem) {
              await supabaseUpdate('stk_customer_types', formData.id, {
                name: formData.name,
                status: formData.status
              }, 'type_id').catch(() => {
                return supabaseUpdate('customer_types', formData.id, {
                  name: formData.name,
                  status: formData.status
                }, 'id');
              });

              setCustomerTypes(prev => prev.map(t => t.id === formData.id ? { ...formData } : t));
              showToast('อัปเดตข้อมูลสำเร็จ', 'success');
            } else {
              await supabaseInsert('stk_customer_types', {
                type_id: formData.id,
                name: formData.name,
                status: formData.status
              }).catch(() => {
                return supabaseInsert('customer_types', {
                  id: formData.id,
                  name: formData.name,
                  status: formData.status
                });
              });

              setCustomerTypes(prev => [...prev, { ...formData }]);
              showToast('เพิ่มประเภทลูกค้าสำเร็จ', 'success');
            }
            setShowModal(false);
          } catch (err) {
            console.error(err);
            showToast('บันทึกข้อมูลไม่สำเร็จ: ' + err.message, 'error');
          }
        };

        const executeDelete = async (id) => {
          try {
            await supabaseDelete('stk_customer_types', id, 'type_id').catch(() => {
              return supabaseDelete('customer_types', id, 'id');
            });
            setCustomerTypes(prev => prev.filter(t => t.id !== id));
            showToast('ลบข้อมูลสำเร็จ', 'success');
            setConfirmDelete({ show: false, id: null, title: '' });
          } catch (err) {
            console.error(err);
            showToast('ลบข้อมูลไม่สำเร็จ: ' + err.message, 'error');
          }
        };

        return (
          <div className="space-y-6">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
               <div>
                  <h1 className="text-2xl font-black text-slate-800 tracking-tight flex items-center gap-2">
                     <Tag className="text-blue-600" size={28}/> ประเภทลูกค้า (Customer Types)
                  </h1>
                  <p className="text-slate-500 text-sm mt-1">จัดการประเภทลูกค้าเพื่อกำหนดกลุ่มและรายงานสถิติ</p>
               </div>
               <div className="flex items-center gap-3 w-full sm:w-auto">
                 <div className="relative flex-1 sm:w-64 bg-white border border-slate-200 rounded-xl px-3 py-2 flex items-center shadow-sm">
                    <Search size={18} className="text-slate-400 shrink-0"/>
                    <input type="text" placeholder="ค้นหารหัส หรือ ชื่อประเภท..." className="w-full bg-transparent border-none outline-none text-[13px] font-medium text-slate-800 placeholder-slate-400 pl-2 h-full" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                 </div>
                 <button onClick={handleOpenAdd} className={`${btnClassPrimary} shrink-0`}><Plus size={18}/> เพิ่มประเภทลูกค้า</button>
               </div>
            </div>

            <div className="bg-blue-50 p-4 rounded-2xl shadow-sm border border-blue-100 flex items-center gap-3"><Info size={24} className="text-blue-500 shrink-0"/><p className="text-sm text-blue-800 font-medium">จัดการหมวดหมู่และประเภทลูกค้าที่จะแสดงเป็นตัวเลือกในการป้อนข้อมูลการขาย</p></div>
            
            <div className={`${boxWrapper} p-0 overflow-hidden`}>
              <div className="overflow-x-auto">
                <table className="w-full text-left">
                  <thead>
                    <tr>
                      <th className={tableHeaderClass}>รหัสประเภท</th>
                      <th className={tableHeaderClass}>ชื่อประเภทลูกค้า</th>
                      <th className={tableHeaderClass}>สถานะ</th>
                      <th className={`${tableHeaderClass} text-center`}>จัดการ</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredTypes.map((p, index)=>(
                      <tr key={p?.id || `type-${index}`} className="hover:bg-blue-50/50 transition-colors">
                        <td className={tableCellClass}>{p?.id}</td>
                        <td className={`${tableCellClass} text-blue-700 font-bold`}>{p?.name}</td>
                        <td className={tableCellClass}><span className="text-[11px] font-bold px-3 py-1.5 bg-slate-100 border border-slate-200 text-slate-600 rounded-lg">{p?.status}</span></td>
                        <td className={`${tableCellClass} text-center`}>
                          <button onClick={()=>handleOpenEdit(p)} className="text-blue-500 hover:text-blue-700 mx-2 transition-colors bg-white p-1.5 rounded-lg border border-slate-200 shadow-sm"><Edit size={16}/></button>
                          {isAdmin && <button onClick={()=>setConfirmDelete({show: true, id: p.id, title: p.name})} className="text-red-500 hover:text-red-700 transition-colors bg-white p-1.5 rounded-lg border border-slate-200 shadow-sm"><Trash2 size={16}/></button>}
                        </td>
                      </tr>
                    ))}
                    {filteredTypes.length === 0 && <tr><td colSpan="4" className="p-10 text-center text-slate-500 font-bold bg-slate-50/50">ไม่พบข้อมูลประเภทลูกค้า</td></tr>}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Modal Edit/Add */}
            {showModal && (
              <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl shadow-xl max-w-md w-full p-6 space-y-4">
                  <div className="flex justify-between items-center border-b pb-3">
                    <h3 className="font-bold text-lg text-slate-800">{editingItem ? 'แก้ไขประเภทลูกค้า' : 'เพิ่มประเภทลูกค้าใหม่'}</h3>
                    <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-600"><X size={20}/></button>
                  </div>
                  <form onSubmit={handleSave} className="space-y-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">รหัสประเภท</label>
                      <input type="text" disabled value={formData.id} className="w-full bg-slate-100 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-500 font-bold" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">ชื่อประเภทลูกค้า *</label>
                      <input type="text" required value={formData.name} onChange={e => setFormData({ ...formData, name: e.target.value })} placeholder="เช่น ลูกค้าใหม่มาตรวจ, สมาชิกVIP" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-600 mb-1">สถานะ</label>
                      <select value={formData.status} onChange={e => setFormData({ ...formData, status: e.target.value })} className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-sm outline-none">
                        <option value="ใช้งาน">ใช้งาน</option>
                        <option value="ระงับ">ระงับ</option>
                      </select>
                    </div>
                    <div className="flex justify-end gap-3 pt-3">
                      <button type="button" onClick={() => setShowModal(false)} className="px-4 py-2 text-sm font-bold text-slate-600 hover:bg-slate-100 rounded-xl">ยกเลิก</button>
                      <button type="submit" className={btnClassPrimary}>บันทึก</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* Confirm Delete */}
            {confirmDelete.show && (
              <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl shadow-xl max-w-sm w-full p-6 text-center space-y-4">
                  <div className="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto"><AlertTriangle size={24}/></div>
                  <h3 className="font-bold text-lg text-slate-800">ยืนยันการลบ?</h3>
                  <p className="text-sm text-slate-600">คุณต้องการลบประเภทลูกค้า <span className="font-bold text-red-600">"{confirmDelete.title}"</span> ใช่หรือไม่?</p>
                  <div className="flex justify-center gap-3 pt-2">
                    <button onClick={() => setConfirmDelete({ show: false, id: null, title: '' })} className="px-4 py-2 text-sm font-bold text-slate-600 hover:bg-slate-100 rounded-xl">ยกเลิก</button>
                    <button onClick={() => executeDelete(confirmDelete.id)} className="px-4 py-2 text-sm font-bold bg-red-600 hover:bg-red-700 text-white rounded-xl">ลบข้อมูล</button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
    };

    // ==========================================
    // 📌 React App (Main Component)
    // ==========================================
    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      
      const [customerTypes, setCustomerTypes] = useState(fallbackCustomerTypes);
      const [isAppLoading, setIsAppLoading] = useState(true);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try {
          return localStorage.getItem('stk_sidebar_collapsed') === 'true';
        } catch(e) {
          return false;
        }
      });
      
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
      };

      const pagePerm = window.getUserPagePermission ? window.getUserPagePermission(currentUser, 'customer_types') : 'none';
      const isAdmin = currentUser && (
          String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || 
          String(currentUser.role).trim().toLowerCase().includes('admin') || String(currentUser.role).trim().includes('แอดมิน') ||
          pagePerm === 'full'
      );
      const currentUserProfileUrl = currentUser?.profileUrl || '';

      useEffect(() => {
        const savedUserStr = localStorage.getItem('stk_current_user');
        if (savedUserStr) {
          try {
            const user = JSON.parse(savedUserStr);
            setCurrentUser(user);
            setIsLoggedIn(true);
          } catch(e) { localStorage.removeItem('stk_current_user'); }
        } else {
          setShowLoginModal(true);
        }

        const initialLoader = document.getElementById('initial-loader');
        if (initialLoader) {
            if (initialLoader) { initialLoader.style.opacity = '0'; setTimeout(() => { if (initialLoader) initialLoader.style.display = 'none'; }, 400); }
        }

        supabaseSelect('stk_customer_types').catch(() => supabaseSelect('customer_types'))
          .then(typeRes => {
             if (Array.isArray(typeRes)) {
               const formatted = typeRes.map(t => ({
                 id: t.type_id || t.id,
                 name: t.name,
                 status: t.status || 'ใช้งาน'
               }));
               setCustomerTypes(formatted);
             }
          }).catch(err => {
             console.error("Supabase load error:", err);
          }).finally(() => {
             setIsAppLoading(false);
          });
      }, []);

      const handleLoginSuccess = (user) => {
        localStorage.setItem('stk_current_user', JSON.stringify(user));
        setCurrentUser(user);
        setIsLoggedIn(true);
        setShowLoginModal(false);
        showToast('เข้าสู่ระบบสำเร็จ!', 'success');
      };

      const handleLogout = () => {
        localStorage.removeItem('stk_current_user');
        setCurrentUser(null);
        setIsLoggedIn(false);
        const targetUrl = typeof resolvePageUrl === 'function' ? resolvePageUrl('?page=dashboard') : 'Mlm.html';
        if (typeof window !== 'undefined') window.location.href = targetUrl;
      };

      return (
        <div className="min-h-screen flex flex-col lg:flex-row font-sans bg-slate-50">
          <Sidebar 
            activePage="customer_types" 
            isLoggedIn={isLoggedIn} 
            currentUser={currentUser} 
            currentUserProfileUrl={currentUserProfileUrl} 
            isAdmin={isAdmin} 
            onLogout={handleLogout} 
            showLoginModal={showLoginModal} 
            setShowLoginModal={setShowLoginModal} 
            SCRIPT_URL=""
            setIsAppLoading={setIsAppLoading}
            isSidebarCollapsed={isSidebarCollapsed}
            setIsSidebarCollapsed={setIsSidebarCollapsed}
          />
          
          <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>
            
            {toast.show && ReactDOM.createPortal(
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[999999] flex items-center justify-center p-4 animation-fade-in" style={{ animationDuration: '0.2s' }}>
                 <div className={`bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center animation-pop border-t-4 ${toast.type === 'error' ? 'border-red-500' : toast.type === 'info' ? 'border-blue-500' : 'border-emerald-500'}`}>
                    <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${toast.type === 'error' ? 'bg-red-100 text-red-500' : toast.type === 'info' ? 'bg-blue-100 text-blue-500' : 'bg-emerald-100 text-emerald-500'}`}>
                       {toast.type === 'error' ? <X size={32} /> : toast.type === 'info' ? <Trophy size={32} /> : <CheckCircle size={32} />}
                    </div>
                    <h3 className="text-xl font-bold text-slate-800 mb-2">{toast.type === 'error' ? 'เกิดข้อผิดพลาด' : toast.type === 'info' ? 'แจ้งเตือน' : 'สำเร็จ!'}</h3>
                    <p className="text-slate-600 font-medium text-sm mb-6">{toast.message}</p>
                    <button onClick={() => setToast({ ...toast, show: false })} className="w-full py-2.5 rounded-lg font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">ตกลง</button>
                 </div>
              </div>
            , document.body)}

            <div className="p-3 sm:p-6 flex-1 w-full relative z-0">
              <div className="w-full relative z-10">
                {isAppLoading ? (
                  <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                    <div className="w-16 h-16 border-[4px] border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                    <h2 className="text-lg font-bold text-slate-700">กำลังซิงค์ข้อมูลกับฐานข้อมูล...</h2>
                    <p className="text-slate-500 text-sm">กรุณารอสักครู่ ระบบกำลังดึงข้อมูลล่าสุด</p>
                  </div>
                ) : isLoggedIn ? (
                  <CustomerTypesManagementView 
                    customerTypes={customerTypes} 
                    setCustomerTypes={setCustomerTypes} 
                    isAdmin={isAdmin} 
                    showToast={showToast} 
                  />
                ) : (
                  <div className="flex flex-col items-center justify-center py-32 gap-5 animation-fade-in">
                    <h2 className="text-xl font-black text-red-500">กรุณาเข้าสู่ระบบก่อนใช้งาน</h2>
                    <button onClick={() => setShowLoginModal(true)} className={btnClassPrimary}>เข้าสู่ระบบ</button>
                  </div>
                )}
              </div>
            </div>

            <footer className="w-full text-center py-6 mt-auto border-t border-slate-200/50 no-print shrink-0">
               <p className="text-[11px] font-bold text-slate-400 opacity-60 hover:opacity-100 transition-opacity">
                  &copy; {new Date().getFullYear()} STK Sales Management System. Developed by Sackda Southammavong.
               </p>
            </footer>

          </main>

          <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={[]} />

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
