<body class="antialiased overflow-x-hidden selection:bg-blue-600 selection:text-white">

  <div id="initial-loader" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999;">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback, useReducer } = React;
    const { 
        Sidebar, LoginModal, Toast, EditModal, 
        PackageIcon, Activity, FileText, Archive, Eye, Info, SearchIcon 
    } = window;

    const safeUpper = (str) => String(str || '').trim().toUpperCase();
    const getLocalISODate = () => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    function useDebounce(value, delay) {
        const [debouncedValue, setDebouncedValue] = React.useState(value);
        React.useEffect(() => {
            const handler = setTimeout(() => { setDebouncedValue(value); }, delay);
            return () => { clearTimeout(handler); };
        }, [value, delay]);
        return debouncedValue;
    }

    const SubTabButton = ({ id, label, activeTab, setSubTab, isSpecial, isData }) => {
        const isActive = activeTab === id;
        let baseClass = "px-4 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap flex-shrink-0 shadow-sm border ";
        if (isActive) {
            if (isSpecial) baseClass += "bg-indigo-600 text-white border-indigo-600 shadow-indigo-200";
            else if (isData) baseClass += "bg-emerald-600 text-white border-emerald-600 shadow-emerald-200";
            else baseClass += "bg-blue-600 text-white border-blue-600 shadow-blue-200";
        } else {
            baseClass += "bg-white text-slate-600 border-slate-200 hover:bg-slate-50 hover:text-blue-600";
        }
        return (
            <button type="button" onClick={() => setSubTab(id)} className={baseClass}>
                {label}
            </button>
        );
    };

    const { 
        resolveTeamName, 
        processStockSales, 
        unfoldStockSales, 
        calculateStockSalesReport, 
        filterZeroPromoBills 
    } = window.ReportStockEngine || {};

    // 📊 ฟังก์ชันโหลด XLSX อัตโนมัติพร้อม CDN Fallback (มาตรฐานเดียวกับ ReportFinance)
    const ensureXlsxLoaded = () => {
        return new Promise((resolve) => {
            if (window.XLSX) return resolve(true);
            const cdns = [
                'https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js',
                'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
                'https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'
            ];
            let idx = 0;
            const tryLoad = () => {
                if (window.XLSX) return resolve(true);
                if (idx >= cdns.length) return resolve(false);
                const s = document.createElement('script');
                s.src = cdns[idx++];
                s.onload = () => resolve(true);
                s.onerror = () => tryLoad();
                document.head.appendChild(s);
            };
            tryLoad();
        });
    };

    const exportStockExcel = async (rows, filename, sheetName = "StockReport") => {
        await ensureXlsxLoaded();
        if (typeof window.XLSX !== 'undefined') {
            try {
                const ws = window.XLSX.utils.aoa_to_sheet(rows);
                if (rows && rows.length > 0) {
                    const colWidths = rows[0].map((_, colIdx) => {
                        let maxLen = 12;
                        rows.forEach(r => {
                            const val = r[colIdx] !== null && r[colIdx] !== undefined ? String(r[colIdx]) : '';
                            if (val.length > maxLen) maxLen = Math.min(val.length, 50);
                        });
                        return { wch: maxLen + 3 };
                    });
                    ws['!cols'] = colWidths;
                }
                const wb = window.XLSX.utils.book_new();
                window.XLSX.utils.book_append_sheet(wb, ws, sheetName);
                const finalFilename = filename.toLowerCase().endsWith('.xlsx') ? filename : `${filename}.xlsx`;
                window.XLSX.writeFile(wb, finalFilename, { compression: true });
                return;
            } catch (err) {
                console.error('XLSX export error, falling back to CSV:', err);
            }
        }

        // Fallback: ส่งออกเป็น CSV พร้อม UTF-8 BOM
        try {
            const csvFilename = filename.replace(/\.xlsx$/i, '') + '.csv';
            const csvContent = '\uFEFF' + (rows || []).map(row => 
                (row || []).map(cell => {
                    let text = (cell === null || cell === undefined) ? '' : String(cell);
                    if (text.includes('"') || text.includes(',') || text.includes('\n') || text.includes('\r')) {
                        text = '"' + text.replace(/"/g, '""') + '"';
                    }
                    return text;
                }).join(',')
            ).join('\r\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = csvFilename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } catch(e) {
            alert('ไม่สามารถดาวน์โหลดไฟล์ได้: ' + (e.message || ''));
        }
    };


    function App() {
        const [isAppLoading, setIsAppLoading] = useState(true);
        const [isLoggedIn, setIsLoggedIn] = useState(false);
        const [currentUser, setCurrentUser] = useState(null);
        const [showLoginModal, setShowLoginModal] = useState(false);
        const [systemUsers, setSystemUsers] = useState([]);
        const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
            try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch (e) { return false; }
        });

        // Theme sync listener
        const [, forceThemeUpdate] = useReducer(x => x + 1, 0);
        useEffect(() => {
            const onThemeChange = () => forceThemeUpdate();
            window.addEventListener('stk_theme_change', onThemeChange);
            return () => window.removeEventListener('stk_theme_change', onThemeChange);
        }, []);

        // Master Data
        const [sales, setSales] = useState([]);
        const [products, setProducts] = useState([]);
        const [stockMovements, setStockMovements] = useState([]);
        const [members, setMembers] = useState([]);
        const [businessTeams, setBusinessTeams] = useState([]);
        const [customers, setCustomers] = useState([]);
        const [systemSettings, setSystemSettings] = useState({});

        // Filter states
        const todayStr = getLocalISODate();
        const [startDate, setStartDate] = useState(todayStr);
        const [endDate, setEndDate] = useState(todayStr);
        const [subTab, setSubTabState] = useState(() => {
            try {
                const params = new URLSearchParams(window.location.search);
                const tabParam = params.get('tab');
                if (tabParam && ['stock_sales_by_product', 'stock_zero_promo', 'stock_balance'].includes(tabParam)) {
                    return tabParam;
                }
                const hash = (window.location.hash || '').replace('#', '').trim();
                if (hash && ['stock_sales_by_product', 'stock_zero_promo', 'stock_balance'].includes(hash)) {
                    return hash;
                }
                const savedTab = sessionStorage.getItem('stk_report_stock_subtab');
                if (savedTab && ['stock_sales_by_product', 'stock_zero_promo', 'stock_balance'].includes(savedTab)) {
                    return savedTab;
                }
            } catch(e) {}
            return 'stock_sales_by_product';
        });

        const setSubTab = (tab) => {
            setSubTabState(tab);
            try {
                sessionStorage.setItem('stk_report_stock_subtab', tab);
                const url = new URL(window.location.href);
                url.searchParams.set('tab', tab);
                window.history.replaceState(null, '', url.pathname + url.search + window.location.hash);
                if (window.top && window.top !== window && window.top.location) {
                    const topUrl = new URL(window.top.location.href);
                    topUrl.searchParams.set('tab', tab);
                    window.top.history.replaceState(null, '', topUrl.pathname + topUrl.search + topUrl.hash);
                }
            } catch(e) {}
        };

        const [searchQuery, setSearchQuery] = useState('');
        const debouncedSearchQuery = useDebounce(searchQuery, 300);

        const [stockModalItem, setStockModalItem] = useState(null);

        const pagePerm = window.getUserPagePermission ? window.getUserPagePermission(currentUser, 'reports') : 'none';
        const isAdmin = currentUser && (
            String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || 
            String(currentUser.role).trim().toLowerCase().includes('admin') || String(currentUser.role).trim().includes('แอดมิน') ||
            pagePerm === 'full'
        );

        const handleLoginSuccess = (user) => {
            localStorage.setItem('stk_current_user', JSON.stringify(user));
            setCurrentUser(user);
            setIsLoggedIn(true);
            setShowLoginModal(false);
            if (typeof loadAllData === 'function') loadAllData();
        };

        const handleLogout = () => {
            try {
                localStorage.removeItem('stk_current_user');
                localStorage.removeItem('stk_app_cache_data');
                localStorage.removeItem('stk_last_activity');
                sessionStorage.clear();
                localStorage.setItem('stk_broadcast_session_event', JSON.stringify({ action: 'logout', reason: 'manual_logout', time: Date.now() }));
            } catch(e) {}
            setCurrentUser(null);
            setIsLoggedIn(false);
            setSales([]);
            setMembers([]);
            setShowLoginModal(true);

            const targetUrl = (typeof window.resolvePageUrl === 'function')
                ? window.resolvePageUrl('?page=dashboard&login=1')
                : 'Mlm.html?login=1';
            try {
                if (window.top && window.top !== window && window.top.location) {
                    window.top.location.href = targetUrl;
                    return;
                }
            } catch(e) {}
            window.location.href = targetUrl;
        };

        const permittedMemberSet = useMemo(() => {
            if (!currentUser || isAdmin) return null;
            const userId = safeUpper(currentUser.id || currentUser.username);
            let downlines = new Set([userId]);
            let queue = [userId];

            while (queue.length > 0) {
                let parentId = queue.shift();
                (members || []).forEach(m => {
                    if (m && m.id) {
                        const sponsor = safeUpper(m.referrer || m.sponsorId);
                        if (sponsor === parentId) {
                            let mId = safeUpper(m.id);
                            if (!downlines.has(mId)) {
                                downlines.add(mId);
                                queue.push(mId);
                            }
                        }
                    }
                });
            }
            return downlines;
        }, [currentUser, isAdmin, members]);

        // โหลดข้อมูลจาก Supabase โดยใช้ window.supabaseSelect ที่ถูกต้อง
        const loadAllData = useCallback(async () => {
            try {
                const [saleRes, prodRes, moveRes, memRes, teamRes, custRes, setRes] = await Promise.all([
                    window.supabaseSelect('stk_sales', 'order=order_id.desc&limit=3000').catch(() => []),
                    window.supabaseSelect('stk_products', 'select=product_id,name,category,price_full,price_member,price_promo,give_pv,current_stock,status').catch(() => []),
                    window.supabaseSelect('stk_stock_movements', 'order=created_at.desc&limit=3000').catch(() => []),
                    window.supabaseSelect('stk_members', 'select=user_id,name,sponsor_id,business_team,permission_role,status').catch(() => []),
                    window.supabaseSelect('stk_business_teams').catch(() => []),
                    window.supabaseSelect('stk_customers', 'select=customer_id,name&limit=3000').catch(() => []),
                    window.supabaseSelect('stk_system_settings').catch(() => [])
                ]);

                if (Array.isArray(memRes)) setSystemUsers(memRes);
                if (Array.isArray(prodRes)) setProducts(prodRes);
                if (Array.isArray(moveRes)) setStockMovements(moveRes);
                if (Array.isArray(teamRes)) setBusinessTeams(teamRes);
                if (Array.isArray(custRes)) setCustomers(custRes);

                if (Array.isArray(setRes) && setRes.length > 0) {
                    const settingsObj = {};
                    setRes.forEach(s => {
                        if (s && (s.key || s.setting_key)) {
                            const k = s.key || s.setting_key;
                            const v = s.value !== undefined ? s.value : s.setting_value;
                            settingsObj[k] = typeof v === 'string' ? v : JSON.stringify(v);
                        }
                    });
                    setSystemSettings(settingsObj);
                }

                if (Array.isArray(memRes)) {
                    setMembers(memRes.map(m => ({
                        id: String(m.user_id || m.id || '').trim(),
                        name: String(m.name || '').trim(),
                        referrer: String(m.sponsor_id || m.referrer || '').trim(),
                        team: String(m.business_team || m.team || 'Marketing').trim()
                    })));
                }

                if (Array.isArray(saleRes)) {
                    setSales(processStockSales ? processStockSales(saleRes, custRes) : saleRes);
                } else {
                    setSales([]);
                }
            } catch (err) {
                console.error("Stock fetch error:", err);
            } finally {
                setIsAppLoading(false);
            }
        }, []);

        useEffect(() => {
            const savedUserStr = localStorage.getItem('stk_current_user');
            if (savedUserStr) {
                try {
                    setCurrentUser(JSON.parse(savedUserStr));
                    setIsLoggedIn(true);
                } catch(e) {
                    setShowLoginModal(true);
                }
            } else setShowLoginModal(true);

            const initialLoader = document.getElementById('initial-loader');
            if (initialLoader) { 
                initialLoader.style.opacity = '0'; 
                setTimeout(() => { if (initialLoader) initialLoader.style.display = 'none'; }, 400); 
            }

            loadAllData();
        }, [loadAllData]);

        // Unfolded Sales สำหรับสินค้าแถม/ตัดศูนย์
        const unfoldedSales = useMemo(() => {
            if (unfoldStockSales) {
                return unfoldStockSales(sales, startDate, endDate, permittedMemberSet, members, customers, businessTeams);
            }
            return [];
        }, [sales, startDate, endDate, permittedMemberSet, members, customers, businessTeams]);

        // 1. คำนวณความเคลื่อนไหวและสต๊อกคงเหลือ (Forward Calculation แบบแม่นยำ)
        const isZeroPromoView = subTab === 'stock_zero_promo';
        const isBalanceView = subTab === 'stock_balance';

        const stockSalesReport = useMemo(() => {
            if (calculateStockSalesReport) {
                return calculateStockSalesReport(products, stockMovements, sales, startDate, endDate, isZeroPromoView, debouncedSearchQuery || searchQuery, permittedMemberSet, isBalanceView);
            }
            return [];
        }, [products, stockMovements, sales, startDate, endDate, isZeroPromoView, debouncedSearchQuery, searchQuery, permittedMemberSet, isBalanceView]);

        // 2. รายงานบิลสินค้าแถมและสินค้าตัดศูนย์แบบเจาะลึกตามบิล (Zero & Promo Items Bills Log)
        const zeroPromoBills = useMemo(() => {
            if (filterZeroPromoBills) {
                return filterZeroPromoBills(unfoldedSales, isZeroPromoView, debouncedSearchQuery || searchQuery);
            }
            return [];
        }, [unfoldedSales, isZeroPromoView, debouncedSearchQuery, searchQuery]);

        // ═════════════════════════════════════════════════════════════════════
        // 📊 EXPORT STOCK EXCEL (REAL .XLSX WITH UTF-8 BOM CSV FALLBACK)
        // ═════════════════════════════════════════════════════════════════════
        const handleExportStockExcel = async () => {
            let rows = [];
            let filename = '';
            let sheetName = '';

            if (isZeroPromoView) {
                filename = `STK_Zero_Promo_Report_${startDate}_to_${endDate}.xlsx`;
                sheetName = "ZeroPromoBills";
                rows = [
                    ['รายงานสินค้าตัดศูนย์และสินค้าแถมโปรโมชั่น - LOVE STK GROUPE'],
                    [`ช่วงเวลา: ${startDate} ถึง ${endDate}`, '', '', `พิมพ์เมื่อ: ${new Date().toLocaleDateString('th-TH')}`],
                    [],
                    ['ลำดับ', 'เลขที่บิล', 'วันที่', 'ผู้ขาย (สมาชิก)', 'รหัสสมาชิก', 'สังกัดทีม', 'ประเภทลูกค้า', 'สินค้าที่แถม/ตัดศูนย์', 'ประเภทแถม/ศูนย์', 'จำนวนที่แถม (กล่อง)']
                ];
                zeroPromoBills.forEach((b, idx) => {
                    rows.push([
                        idx + 1,
                        b.billId,
                        b.date,
                        b.memberName,
                        b.memberId,
                        b.team || '-',
                        b.custType || 'ทั่วไป',
                        b.product,
                        b.priceType === 'ราคาศูนย์' ? 'ตัดศูนย์ราคา' : 'แถมโปรโมชั่น',
                        Number(b.qty || 0)
                    ]);
                });
                const totalBoxes = zeroPromoBills.reduce((acc, curr) => acc + (Number(curr.qty) || 0), 0);
                rows.push([]);
                rows.push(['', '', '', '', '', '', '', 'ยอดรวมทั้งหมด (Grand Total)', `${zeroPromoBills.length} รายการ`, totalBoxes]);
            } else if (isBalanceView) {
                filename = `STK_Stock_Balance_Report_${startDate}_to_${endDate}.xlsx`;
                sheetName = "StockBalance";
                rows = [
                    ['รายงานสต๊อกสินค้าคงเหลือ - LOVE STK GROUPE'],
                    [`ช่วงเวลา: ${startDate} ถึง ${endDate}`, '', '', `พิมพ์เมื่อ: ${new Date().toLocaleDateString('th-TH')}`],
                    [],
                    ['ลำดับ', 'รหัสสินค้า', 'ชื่อสินค้า', 'ยอดยกมา', 'รับเข้าสะสม', 'เบิก/ขายออกในช่วงเวลา', 'ยอดสต๊อกคงเหลือ']
                ];
                stockSalesReport.forEach((i, idx) => {
                    rows.push([
                        idx + 1,
                        i.id,
                        i.name,
                        Number(i.openingBalance || 0),
                        Number(i.currentIn || 0),
                        Number(i.totalOut || 0),
                        Number(i.currentStock || 0)
                    ]);
                });
                rows.push([
                    '',
                    '',
                    'ยอดรวม (Grand Total)',
                    stockSalesReport.reduce((a,b)=>a + (Number(b.openingBalance)||0), 0),
                    stockSalesReport.reduce((a,b)=>a + (Number(b.currentIn)||0), 0),
                    stockSalesReport.reduce((a,b)=>a + (Number(b.totalOut)||0), 0),
                    stockSalesReport.reduce((a,b)=>a + (Number(b.currentStock)||0), 0)
                ]);
            } else {
                filename = `STK_Sales_By_Product_Report_${startDate}_to_${endDate}.xlsx`;
                sheetName = "SalesByProduct";
                rows = [
                    ['รายงานสรุปยอดขายแยกตามสินค้า - LOVE STK GROUPE'],
                    [`ช่วงเวลา: ${startDate} ถึง ${endDate}`, '', '', `พิมพ์เมื่อ: ${new Date().toLocaleDateString('th-TH')}`],
                    [],
                    ['ลำดับ', 'รหัสสินค้า', 'ชื่อสินค้า', 'ขายราคาเต็ม', 'ขายราคาสมาชิก', 'ขายราคาโปร', 'ตัดศูนย์ราคา', 'รวมเบิกขายทั้งหมด']
                ];
                stockSalesReport.forEach((i, idx) => {
                    rows.push([
                        idx + 1,
                        i.id,
                        i.name,
                        Number(i.fullQty || 0),
                        Number(i.memberQty || 0),
                        Number(i.promoQty || 0),
                        Number(i.zeroQty || 0),
                        Number(i.totalOut || 0)
                    ]);
                });
                rows.push([
                    '',
                    '',
                    'ยอดรวม (Grand Total)',
                    stockSalesReport.reduce((a,b)=>a + (Number(b.fullQty)||0), 0),
                    stockSalesReport.reduce((a,b)=>a + (Number(b.memberQty)||0), 0),
                    stockSalesReport.reduce((a,b)=>a + (Number(b.promoQty)||0), 0),
                    stockSalesReport.reduce((a,b)=>a + (Number(b.zeroQty)||0), 0),
                    stockSalesReport.reduce((a,b)=>a + (Number(b.totalOut)||0), 0)
                ]);
            }
            await exportStockExcel(rows, filename, sheetName);
        };

        // ═════════════════════════════════════════════════════════════════════
        // 🖨️ OFFICIAL PRINT & PDF REPORT GENERATOR (FOR STOCK)
        // ═════════════════════════════════════════════════════════════════════
        const handlePrintStockReport = (isPdf = false) => {
            const printWin = window.open('', '_blank');
            if (!printWin) {
                alert('เบราว์เซอร์บล็อกหน้าต่าง Popup กรุณาอนุญาต (Allow Pop-ups) ก่อนพิมพ์เอกสารรายงาน');
                return;
            }

            let compSettings = {
                name: 'LOVE STK GROUPE',
                branch: 'สำนักงานใหญ่',

                                                        <td className="p-3 text-center font-black text-blue-700 bg-blue-50/20">{totalQty} กล่อง</td>
                                                    </tr>
                                                );
                                            });
                                        })()}
                                    </tbody>
                                </table>
                            </div>
                            <div className="flex justify-end pt-4">
                                <button onClick={() => setStockModalItem(null)} className="px-5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl border border-slate-200 transition-colors">
                                    ปิดหน้าต่าง
                                </button>
                            </div>
                        </EditModal>
                    </div>
                </main>
                <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={systemUsers} />
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
