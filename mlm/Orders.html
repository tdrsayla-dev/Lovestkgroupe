    };

    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      // ⚡ INSTANT MOUNT CACHE INJECTION
      const initialCache = (() => {
        try { const data = localStorage.getItem('stk_app_cache_data'); return data ? JSON.parse(data) : null; }
        catch(e) { return null; }
      })();

      const [sales, setSales] = useState(() => {
          if (initialCache && Array.isArray(initialCache.sales)) {
             return initialCache.sales.filter(s => s && s.status !== 'รอดำเนินการ' && s.status !== 'ร่างใบสั่งซื้อ (จากคลินิก)').map(s => ({ ...s, id: s.id || s.sale_id || s.receipt_id || s.order_id, customerId: s.customerId || s.customer_id, memberId: s.memberId || s.sellerId || s.seller_id, totalAmount: s.totalAmount || s.total_amount, saleType: s.saleType || s.sale_type, date: s.date || s.created_at, recordedBy: s.recordedBy || s.recorded_by, paymentNote: s.paymentNote || s.payment_note }));
          }
          return [];
      });
      const [members, setMembers] = useState(() => initialCache && Array.isArray(initialCache.members) ? initialCache.members.map(m => ({ ...m, id: m.id || m.user_id || m.member_id, name: m.name })) : []);
      const [customers, setCustomers] = useState(() => initialCache && Array.isArray(initialCache.customers) ? initialCache.customers.map(x => ({ ...x, id: x.id || x.customer_id, closer: x.closer || x.closer_id || '' })) : []);
      const [products, setProducts] = useState(() => initialCache && Array.isArray(initialCache.products) ? initialCache.products.map(p => ({ ...p, id: p.id || p.product_id, name: p.name || p.product_name, priceFull: p.priceFull || p.price_full || 0, pricePromo: p.pricePromo || p.price_promo || 0, priceMember: p.priceMember || p.price_member || 0 })) : []);
      const [systemSettings, setSystemSettings] = useState(() => initialCache && initialCache.systemSettings ? initialCache.systemSettings : { exchange_rate: 700 });
      const [systemUsers, setSystemUsers] = useState([]);
      const [closers, setClosers] = useState(() => initialCache && Array.isArray(initialCache.closers) ? initialCache.closers.map(x => ({ ...x, id: x.id || x.closer_id })) : []);
      const [isAppLoading, setIsAppLoading] = useState(() => !initialCache);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => localStorage.getItem('stk_sidebar_collapsed') === 'true');
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

      const showToast = (message, type = 'success') => setToast({ show: true, message, type });

      const SCRIPT_URL = (() => {
        try { if (window.top && window.top.location && window.top.location.href.startsWith('http')) return window.top.location.href.split('?')[0]; } catch(e){}
        return "<?= getScriptUrl() ?>";
      })();

      const isAdmin = currentUser && (String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || String(currentUser.role).trim().toLowerCase() === 'admin');
      const currentUserProfileUrl = currentUser?.profileUrl || '';

      useEffect(() => {
        const savedUserStr = localStorage.getItem('stk_current_user');
        if (savedUserStr) {
          setCurrentUser(JSON.parse(savedUserStr));
          setIsLoggedIn(true);
        } else {
          setShowLoginModal(true);
        }

        const initialLoader = document.getElementById('initial-loader');
        if (initialLoader) initialLoader.style.display = 'none';

        // 💡 SMART CACHING & PAGE TRANSITION SPEED FIX:
        // ตรวจสอบ cache ใน localStorage ถ้าข้อมูลยังใหม่ (ไม่เกิน 20 วินาที)
        // จะใช้งานข้อมูลเดิมทันทีโดยไม่ต้องดึงฐานข้อมูลใหม่เพื่อความเร็วในการเปลี่ยนหน้า
        let isCacheFresh = false;
        const applyDataToStates = (data) => {
          if (Array.isArray(data.members)) setMembers(data.members.map(m => ({ ...m, id: m.id || m.user_id || m.member_id, name: m.name })));
          if (Array.isArray(data.customers)) setCustomers(data.customers.map(x => ({ ...x, id: x.id || x.customer_id, closer: x.closer || x.closer_id || '' })));
          if (Array.isArray(data.closers)) setClosers(data.closers.map(x => ({ ...x, id: x.id || x.closer_id })));
          if (Array.isArray(data.products)) setProducts(data.products.map(p => ({
             ...p,
             id: p.id || p.product_id,
             name: p.name || p.product_name,
             priceFull: p.priceFull || p.price_full || 0,
             pricePromo: p.pricePromo || p.price_promo || 0,
             priceMember: p.priceMember || p.price_member || 0
          })));
          if (Array.isArray(data.sales)) {
             let combinedSales = data.sales.filter(s => s && s.status !== 'รอดำเนินการ' && s.status !== 'ร่างใบสั่งซื้อ (จากคลินิก)');
             setSales(combinedSales.map(s => ({
                ...s,
                id: s.id || s.sale_id || s.receipt_id || s.order_id,
                customerId: s.customerId || s.customer_id,
                memberId: s.memberId || s.sellerId || s.seller_id,
                totalAmount: s.totalAmount || s.total_amount,
                saleType: s.saleType || s.sale_type,
                date: s.date || s.created_at,
                recordedBy: s.recordedBy || s.recorded_by,
                paymentNote: s.paymentNote || s.payment_note
             })));
          }
          if (data.systemSettings) setSystemSettings(data.systemSettings);
        };

        try {
            const cachedData = localStorage.getItem('stk_app_cache_data');
            const cacheTime = localStorage.getItem('stk_app_cache_time');
            if (cachedData && cacheTime) {
                const parsedData = JSON.parse(cachedData);
                applyDataToStates(parsedData);
                // ✨ แสดงหน้าจอทันที ไม่รอ API
                setIsAppLoading(false);
                window.__ordersCacheAge = Date.now() - Number(cacheTime);
            }
        } catch (e) { console.warn("Cache error", e); }

        // ⚡ REAL-TIME SYNC & QUICK MOUNT:
        // ดึง sales ใหม่และข้อมูลอื่นๆ ล่าสุดจาก Supabase เสมอเมื่อเปิดหน้า เพื่อแก้ปัญหาหมุนค้างและให้ข้อมูลเรียลไทม์
        const doSalesRefresh = () => {
            supabaseSelect('stk_sales', 'order=order_id.desc&limit=300').then(saleRes => {
                if (!Array.isArray(saleRes)) return;
                let combinedSales = saleRes.filter(s => s && s.status !== 'รอดำเนินการ' && s.status !== 'ร่างใบสั่งซื้อ (จากคลินิก)');
                setSales(combinedSales.map(s => ({
                    ...s,
                    id: s.id || s.sale_id || s.receipt_id || s.order_id,
                    customerId: s.customerId || s.customer_id,
                    memberId: s.memberId || s.sellerId || s.seller_id,
                    totalAmount: s.totalAmount || s.total_amount,
                    saleType: s.saleType || s.sale_type,
                    date: s.date || s.created_at,
                    recordedBy: s.recordedBy || s.recorded_by,
                    paymentNote: s.paymentNote || s.payment_note
                })));
            }).catch(() => {});
        };

        // ตั้ง EVENT LISTENERS ดึงข้อมูลเมื่อผู้ใช้สลับกลับมาที่แท็บนี้ (Focus) หรือเปิดกลับมาหน้าบิล เพื่อความเรียลไทม์สูงสุด
        window.addEventListener('focus', doSalesRefresh);
        window.addEventListener('pageshow', doSalesRefresh);

        Promise.all([
          supabaseSelect('stk_members').catch(() => supabaseSelect('members')),
          supabaseSelect('stk_customers', 'order=customer_id.desc&limit=2000').catch(() => supabaseSelect('customers')),
          // ⚡ SPEED FIX 2: ดึงรายการบิลล่าสุดแค่ 300 รายการ ไม่โหลดทั้งหมดของระบบเพื่อความเร็ว
          supabaseSelect('stk_sales', 'order=order_id.desc&limit=300').catch(() => supabaseSelect('sales')),
          supabaseSelect('stk_products').catch(() => supabaseSelect('products')),
          supabaseSelect('stk_system_settings').catch(() => supabaseSelect('system_settings')).catch(() => []),
          supabaseSelect('stk_closers').catch(() => supabaseSelect('closers')).catch(() => [])
        ]).then(([memRes, custRes, saleRes, prodRes, setRes, closerRes]) => {
           const settingsObj = { exchange_rate: 700 };
           if (Array.isArray(setRes)) setRes.forEach(s => settingsObj[s.key || s.setting_key] = s.value || s.setting_value);

           const resObj = {
             members: memRes,
             customers: custRes,
             sales: saleRes,
             products: prodRes,
             systemSettings: settingsObj,
             closers: closerRes
           };

           applyDataToStates(resObj);
           
           try {
               localStorage.setItem('stk_app_cache_data', JSON.stringify(resObj));
               localStorage.setItem('stk_app_cache_time', String(Date.now()));
           } catch(e){}
        }).catch(err => console.error(err))
          .finally(() => setIsAppLoading(false));

        // ⚡ AUTO-REFRESH: รีเฟรชรายการบิลทุก 60 วินาที เพื่อดึงบิลใหม่ที่พนักงานคนอื่นบันทึกโดยไม่ต้อง reload
        const refreshInterval = setInterval(() => {
            supabaseSelect('stk_sales', 'order=order_id.desc&limit=300').then(saleRes => {
                if (!Array.isArray(saleRes)) return;
                let combinedSales = saleRes.filter(s => s && s.status !== 'รอดำเนินการ' && s.status !== 'ร่างใบสั่งซื้อ (จากคลินิก)');
                setSales(combinedSales.map(s => ({
                    ...s,
                    id: s.id || s.sale_id || s.receipt_id || s.order_id,
                    customerId: s.customerId || s.customer_id,
                    memberId: s.memberId || s.sellerId || s.seller_id,
                    totalAmount: s.totalAmount || s.total_amount,
                    saleType: s.saleType || s.sale_type,
                    date: s.date || s.created_at,
                    recordedBy: s.recordedBy || s.recorded_by,
                    paymentNote: s.paymentNote || s.payment_note
                })));
            }).catch(() => {});
        }, 60000);

        return () => {
            clearInterval(refreshInterval);
            window.removeEventListener('focus', doSalesRefresh);
            window.removeEventListener('pageshow', doSalesRefresh);
        };
      }, []);

      const handleLoginSuccess = (user) => {
        localStorage.setItem('stk_current_user', JSON.stringify(user));
        setCurrentUser(user);
        setIsLoggedIn(true);
        setShowLoginModal(false);
        showToast('เข้าสู่ระบบสำเร็จ!', 'success');
      };

      const handleLogout = () => {
        localStorage.removeItem('stk_current_user');
        setCurrentUser(null);
        setIsLoggedIn(false);
        window.location.href = resolvePageUrl('?page=dashboard');
      };

      return (
        <div className="min-h-screen flex flex-col lg:flex-row font-sans bg-slate-50">
          <Sidebar 
            activePage="orders" 
            isLoggedIn={isLoggedIn} 
            currentUser={currentUser} 
            currentUserProfileUrl={currentUserProfileUrl} 
            isAdmin={isAdmin} 
            onLogout={handleLogout} 
            showLoginModal={showLoginModal} 
            setShowLoginModal={setShowLoginModal} 
            SCRIPT_URL={SCRIPT_URL}
            setIsAppLoading={setIsAppLoading}
            isSidebarCollapsed={isSidebarCollapsed}
            setIsSidebarCollapsed={setIsSidebarCollapsed}
          />
          
          <main className={'flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ' + (isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64') + ' w-full overflow-x-hidden p-4 lg:p-8'}>
             {toast.show && ReactDOM.createPortal(
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-[999999] flex items-center justify-center p-4">
                 <div className={'bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center border-t-4 ' + (toast.type === 'error' ? 'border-red-500' : 'border-emerald-500')}>
                    <h3 className="text-xl font-bold text-slate-800 mb-2">{toast.type === 'error' ? 'เกิดข้อผิดพลาด' : 'สำเร็จ!'}</h3>
                    <p className="text-slate-600 font-medium text-sm mb-6">{toast.message}</p>
                    <button onClick={() => setToast({ ...toast, show: false })} className="w-full py-2.5 rounded-xl font-bold bg-slate-100 text-slate-700 hover:bg-slate-200">ตกลง</button>
                 </div>
              </div>
             , document.body)}

             <OrdersView 
               sales={sales} 
               setSales={setSales} 
               members={members} 
               customers={customers} 
               products={products}
               systemSettings={systemSettings}
               isAdmin={isAdmin} 
               showToast={showToast} 
               currentUser={currentUser} 
               closers={closers}
               loading={isAppLoading}
             />
          </main>

          <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={systemUsers} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
