  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    const IconProps = { fill: "none", stroke: "currentColor", strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" };
    const SearchIcon = ({ size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>;
    const Eye = ({ size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>;
    const PrinterIcon = ({ size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>;
    const Edit = ({ size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>;
    const Trash2 = ({ size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>;
    const CheckCircle = ({ size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
    const X = ({ size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
    const FileText = ({ size = 20 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" {...IconProps}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>;

    const SALES_PER_PAGE = 15;

    const formatDbDateForFilter = (raw) => {
        if (!raw) return '';
        try {
            if (raw.includes('T')) return raw.split('T')[0];
            if (raw.includes(' ')) return raw.split(' ')[0];
            return raw;
        } catch(e) { return raw; }
    };

    const OrdersView = ({ sales, setSales, members, customers, products = [], systemSettings = { exchange_rate: 700 }, isAdmin, showToast, currentUser }) => {
        const todayStr = typeof getLocalISODate === 'function' ? getLocalISODate() : new Date().toISOString().split('T')[0];
        const [salesSearchTerm, setSalesSearchTerm] = useState('');
        const [historyStartDate, setHistoryStartDate] = useState(todayStr);
        const [historyEndDate, setHistoryEndDate] = useState(todayStr);
        const [salesPage, setSalesPage] = useState(1);
        const [viewBillDetail, setViewBillDetail] = useState(null);
        const [confirmDelete, setConfirmDelete] = useState({ show: false, id: null, title: '' });

        const filteredSalesHistory = useMemo(() => {
           let result = (sales || []);
           result = result.sort((a, b) => String(b.id || '').localeCompare(String(a.id || '')));

           if (historyStartDate) result = result.filter(s => formatDbDateForFilter(s.date) >= historyStartDate);
           if (historyEndDate) result = result.filter(s => formatDbDateForFilter(s.date) <= historyEndDate);

           if (salesSearchTerm.trim() !== '') {
               const st = salesSearchTerm.toLowerCase();
               result = result.filter(s => {
                  const sCustId = s.customerId ? s.customerId.toLowerCase() : '';
                  const sMemId = s.memberId ? s.memberId.toLowerCase() : '';
                  const sMemName = s.memberName ? s.memberName.toLowerCase() : '';
                  const sIdStr = s.id ? s.id.toString() : '';
                  return sCustId.includes(st) || sMemId.includes(st) || sMemName.includes(st) || sIdStr.includes(st);
               });
           }
           return result;
        }, [sales, historyStartDate, historyEndDate, salesSearchTerm]);

        const totalSalesPages = Math.max(1, Math.ceil(filteredSalesHistory.length / SALES_PER_PAGE));
        const paginatedSalesHistory = useMemo(() => {
            return filteredSalesHistory.slice((salesPage - 1) * SALES_PER_PAGE, salesPage * SALES_PER_PAGE);
        }, [filteredSalesHistory, salesPage]);

        useEffect(() => { setSalesPage(1); }, [historyStartDate, historyEndDate, salesSearchTerm]);

        const tableTotals = useMemo(() => {
            let totalFull = 0, totalMember = 0, totalPro = 0, totalZero = 0, grandTotal = 0, totalAmountTHB = 0;
            filteredSalesHistory.forEach(s => {
               let rowF = 0, rowM = 0, rowP = 0, rowZ = 0;

               let itemsList = [];
               if (s.items_json) {
                   try { itemsList = typeof s.items_json === 'string' ? JSON.parse(s.items_json) : s.items_json; } catch(e){}
               }

               if (Array.isArray(itemsList) && itemsList.length > 0) {
                   itemsList.forEach(it => {
                       const qty = parseInt(it.qty) || 0;
                       if (qty > 0) {
                           const type = it.type || it.priceType || 'ราคาเต็ม';
                           if (type === 'ราคาเต็ม') rowF += qty;
                           else if (type === 'ราคาสมาชิก') rowM += qty;
                           else if (type === 'ราคาโปร') rowP += qty;
                           else if (type === 'ราคาศูนย์') rowZ += qty;
                           else rowF += qty;
                       }
                   });
               } else {
                   Object.keys(s).forEach(key => {
                       const qty = parseInt(s[key]) || 0;
                       if (qty > 0) {
                           if (key.endsWith('_ราคาเต็ม') && key !== 'รวมชิ้นราคาเต็ม') rowF += qty;
                           else if (key.endsWith('_ราคาสมาชิก') && key !== 'รวมชิ้นราคาสมาชิก') rowM += qty;
                           else if (key.endsWith('_ราคาโปร') && key !== 'รวมชิ้นราคาโปร') rowP += qty;
                           else if (key.endsWith('_ราคาศูนย์') && key !== 'รวมชิ้นราคาศูนย์') rowZ += qty;
                       }
                   });
               }

               const recordedBottles = parseInt(s.total_bottles || s.totalBottles) || 0;
               const rowTotalQty = (rowF + rowM + rowP + rowZ) > 0 ? (rowF + rowM + rowP + rowZ) : recordedBottles;

               totalFull += rowF; totalMember += rowM; totalPro += rowP; totalZero += rowZ;
               grandTotal += rowTotalQty;
               totalAmountTHB += parseFloat(s.totalAmount || s.total_amount || 0);
            });
            return { totalFull, totalMember, totalPro, totalZero, grandTotal, totalAmountTHB, count: filteredSalesHistory.length };
        }, [filteredSalesHistory]);

        const handlePrintReceiptPopup = (saleRecord) => {
            if (!saleRecord) return;
            const printWindow = window.open('', '_blank');
            if (!printWindow) {
                showToast('เบราว์เซอร์บล็อกหน้าต่าง Popup กรุณาอนุญาต (Allow Pop-ups) ก่อนพิมพ์ใบเสร็จ', 'error');
                return;
            }

            const mName = (members || []).find(m => m && m.id === saleRecord.memberId)?.name || saleRecord.memberName || saleRecord.memberId || '-';
            const custObj = (customers || []).find(c => c && c.id === saleRecord.customerId) || {};
            const custName = custObj.name || saleRecord.customerName || '';

            const saleTypeStr = saleRecord.saleType || 'เงินสด';
            let cTHB = 0; let cLAK = 0;
            let tThaiTHB = 0; let bThaiTHB = '';
            let tLaosTHB = 0; let bLaosTHB = '';
            let tLaosLAK = 0; let bLaosLAK = '';
            let rate = parseFloat(systemSettings?.exchange_rate) || 700;

            if (saleTypeStr.includes(':') || saleTypeStr.includes('โอน') || saleTypeStr.includes('|')) {
                const parts = saleTypeStr.split('|').map(p => p.trim());
                parts.forEach(p => {
                    if (p.startsWith('สด:')) cTHB = parseFloat(p.replace('สด:', '').trim()) || 0;
                    else if (p.startsWith('สดกีบ:')) cLAK = parseFloat(p.replace('สดกีบ:', '').trim()) || 0;
                    else if (p.match(/^โอนไทย\(([^)]+)\):(.*)$/)) {
                        const m = p.match(/^โอนไทย\(([^)]+)\):(.*)$/);
                        bThaiTHB = m[1].trim(); tThaiTHB = parseFloat(m[2].trim()) || 0;
                    }
                    else if (p.match(/^โอนลาวบาท\(([^)]+)\):(.*)$/)) {
                        const m = p.match(/^โอนลาวบาท\(([^)]+)\):(.*)$/);
                        bLaosTHB = m[1].trim(); tLaosTHB = parseFloat(m[2].trim()) || 0;
                    }
                    else if (p.match(/^โอนลาวกีบ\(([^)]+)\):(.*)$/)) {
                        const m = p.match(/^โอนลาวกีบ\(([^)]+)\):(.*)$/);
                        bLaosLAK = m[1].trim(); tLaosLAK = parseFloat(m[2].trim()) || 0;
                    }
                    else if (p.match(/^โอน\(([^)]+)\):(.*)$/)) {
                        const m = p.match(/^โอน\(([^)]+)\):(.*)$/);
                        bThaiTHB = m[1].trim(); tThaiTHB = parseFloat(m[2].trim()) || 0;
                    }
                    else if (p.match(/^โอนกีบ\(([^)]+)\):(.*)$/)) {
                        const m = p.match(/^โอนกีบ\(([^)]+)\):(.*)$/);
                        bLaosLAK = m[1].trim(); tLaosLAK = parseFloat(m[2].trim()) || 0;
                    }
                    else if (p.startsWith('เรท:')) rate = parseFloat(p.replace('เรท:', '').trim()) || 700;
                });
            } else {
                const amt = parseFloat(saleRecord.totalAmount || saleRecord.total_amount || 0);
                if (saleTypeStr.includes('โอน')) {
                    tThaiTHB = amt;
                    const matchBank = saleTypeStr.match(/ธ\.(.+)\)/);
                    if (matchBank) bThaiTHB = matchBank[1]; else bThaiTHB = 'ไม่ระบุ';
                } else {
                    cTHB = amt;
                }
            }

            const items = [];
            let totalBaseAmount = 0; 
            let totalDiscountAmount = 0; 
            let totalItemQuantity = 0;

            let itemsList = [];
            if (saleRecord.items_json) {
                try { itemsList = typeof saleRecord.items_json === 'string' ? JSON.parse(saleRecord.items_json) : saleRecord.items_json; } catch(e){}
            }

            if (Array.isArray(itemsList) && itemsList.length > 0) {
                itemsList.forEach(it => {
                    const qty = parseInt(it.qty || it.quantity || 1);
                    if (qty > 0) {
                        const productName = it.prod || it.productName || it.name || 'สินค้า';
                        const priceType = it.type || it.priceType || 'ราคาเต็ม';
                        const prodObj = (products || []).find(p => p.name === productName) || {};
                        let fullPrice = parseFloat(prodObj.priceFull || 0);

                        let unitPrice = 0;
                        if (it.unitPrice !== undefined && it.unitPrice !== null) {
                            unitPrice = parseFloat(it.unitPrice);
                        } else if (priceType === 'ราคาเต็ม') unitPrice = fullPrice;
                        else if (priceType === 'ราคาโปร') unitPrice = parseFloat(prodObj.pricePromo || 0);
                        else if (priceType === 'ราคาสมาชิก') unitPrice = parseFloat(prodObj.priceMember || 0);
                        else if (priceType === 'ราคาศูนย์') unitPrice = 0;
                        
                        if (fullPrice < unitPrice) fullPrice = unitPrice;
                        if (fullPrice === 0) fullPrice = unitPrice;

                        const itemTotal = unitPrice * qty;
                        const itemBaseTotal = fullPrice * qty;
                        const itemDiscount = itemBaseTotal - itemTotal;

                        totalBaseAmount += itemBaseTotal;
                        totalDiscountAmount += itemDiscount;
                        totalItemQuantity += qty;

                        items.push({ 
                            name: productName, priceType, qty, unitPrice, fullPrice, total: itemTotal, discount: itemDiscount
                        });
                    }
                });
            }

            if (items.length === 0) {
                Object.keys(saleRecord).forEach(key => {
                    const qty = parseInt(saleRecord[key]) || 0;
                    if (qty > 0) {
                        let productName = ''; let priceType = ''; let unitPrice = 0;
                        
                        if (key.endsWith('_ราคาเต็ม') && key !== 'รวมชิ้นราคาเต็ม') { productName = key.replace('_ราคาเต็ม', ''); priceType = 'ราคาเต็ม'; } 
                        else if (key.endsWith('_ราคาโปร') && key !== 'รวมชิ้นราคาโปร') { productName = key.replace('_ราคาโปร', ''); priceType = 'ราคาโปร'; } 
                        else if (key.endsWith('_ราคาสมาชิก') && key !== 'รวมชิ้นราคาสมาชิก') { productName = key.replace('_ราคาสมาชิก', ''); priceType = 'ราคาสมาชิก'; } 
                        else if (key.endsWith('_ราคาศูนย์') && key !== 'รวมชิ้นราคาศูนย์') { productName = key.replace('_ราคาศูนย์', ''); priceType = 'ราคาศูนย์'; }
                        
                        if (productName) {
                            const prodObj = (products || []).find(p => p.name === productName) || {};
                            let fullPrice = parseFloat(prodObj.priceFull || 0);

                            if (priceType === 'ราคาเต็ม') unitPrice = fullPrice;
                            else if (priceType === 'ราคาโปร') unitPrice = parseFloat(prodObj.pricePromo || 0);
                            else if (priceType === 'ราคาสมาชิก') unitPrice = parseFloat(prodObj.priceMember || 0);
                            else if (priceType === 'ราคาศูนย์') unitPrice = 0;
                            
                            if (fullPrice < unitPrice) fullPrice = unitPrice;
                            if (fullPrice === 0) fullPrice = unitPrice;

                            const itemTotal = unitPrice * qty;
                            const itemBaseTotal = fullPrice * qty;
                            const itemDiscount = itemBaseTotal - itemTotal;

                            totalBaseAmount += itemBaseTotal;
                            totalDiscountAmount += itemDiscount;
                            totalItemQuantity += qty;

                            items.push({ 
                                name: productName, priceType, qty, unitPrice, fullPrice, total: itemTotal, discount: itemDiscount
                            });
                        }
                    }
                });
            }

            const typeOrder = { 'ราคาเต็ม': 1, 'ราคาสมาชิก': 2, 'ราคาโปร': 3, 'ราคาศูนย์': 4 };
            items.sort((a, b) => (typeOrder[a.priceType] || 99) - (typeOrder[b.priceType] || 99));

            const breakdownParts = [];
            const totalPaidTHB = cTHB + (cLAK/rate) + tThaiTHB + tLaosTHB + (tLaosLAK/rate);
            
            let payMethodLabel = 'เงินสด';
            if ((cTHB > 0 || cLAK > 0) && (tThaiTHB > 0 || tLaosTHB > 0 || tLaosLAK > 0)) {
                payMethodLabel = 'เงินสด + เงินโอน';
            } else if (tThaiTHB > 0 || tLaosTHB > 0 || tLaosLAK > 0) {
                payMethodLabel = 'เงินโอน';
            }

            breakdownParts.push(`<tr><td colspan="2" style="padding: 4px 0; font-weight: bold; color: #1e3a8a;">ชำระโดย: ${payMethodLabel}</td></tr>`);

            if (cTHB > 0) breakdownParts.push(`<tr><td style="padding: 2px 0; padding-left: 8px;">- เงินสด (THB):</td><td style="padding: 2px 0; text-align: right;">฿${cTHB.toLocaleString(undefined, {minimumFractionDigits: 2})}</td></tr>`);
            if (cLAK > 0) breakdownParts.push(`<tr><td style="padding: 2px 0; padding-left: 8px;">- เงินสด (LAK):</td><td style="padding: 2px 0; text-align: right;">${cLAK.toLocaleString()} ₭</td></tr>`);
            if (tThaiTHB > 0) breakdownParts.push(`<tr><td style="padding: 2px 0; padding-left: 8px;">- โอนไทย (${bThaiTHB}):</td><td style="padding: 2px 0; text-align: right;">฿${tThaiTHB.toLocaleString(undefined, {minimumFractionDigits: 2})}</td></tr>`);
            if (tLaosTHB > 0) breakdownParts.push(`<tr><td style="padding: 2px 0; padding-left: 8px;">- โอนลาว (${bLaosTHB}):</td><td style="padding: 2px 0; text-align: right;">฿${tLaosTHB.toLocaleString(undefined, {minimumFractionDigits: 2})}</td></tr>`);
            if (tLaosLAK > 0) breakdownParts.push(`<tr><td style="padding: 2px 0; padding-left: 8px;">- โอนลาว (${bLaosLAK}):</td><td style="padding: 2px 0; text-align: right;">${tLaosLAK.toLocaleString()} ₭</td></tr>`);
            
            const totalRecordAmt = parseFloat(saleRecord.totalAmount || saleRecord.total_amount || 0);
            if (totalBaseAmount === 0) totalBaseAmount = totalRecordAmt;

            breakdownParts.push(`<tr><td style="padding: 4px 0; border-top: 1px dashed #cbd5e1; font-weight: bold;">รับเงินรวม (THB):</td><td style="padding: 4px 0; border-top: 1px dashed #cbd5e1; text-align: right; font-weight: bold;">฿${(Math.round((totalPaidTHB || totalRecordAmt) * 100) / 100).toLocaleString(undefined, {minimumFractionDigits: 2})}</td></tr>`);
            
            const diff = totalRecordAmt - totalPaidTHB;
            let changeTHB = diff < -0.05 ? Math.abs(diff) : 0;
            
            breakdownParts.push(`<tr><td colspan="2"><div class="divider" style="margin: 2mm 0;"></div></td></tr>`);
            breakdownParts.push(`<tr><td style="padding: 2px 0; font-weight: bold; font-size: 12px; color: #1e3a8a;">เงินทอน (THB):</td><td style="padding: 2px 0; text-align: right; font-weight: bold; font-size: 12px; color: #1e3a8a;">฿${changeTHB.toLocaleString(undefined, {minimumFractionDigits: 2})}</td></tr>`);
            if (changeTHB > 0) {

                    <tr class="total-row bold"><td style="padding-top: 4px; font-size: 13px;">ยอดรวมสุทธิ (THB):</td><td class="text-right" style="padding-top: 4px; font-size: 15px; color: #1e3a8a; font-family: monospace;">฿${totalRecordAmt.toLocaleString(undefined, {minimumFractionDigits: 2})}</td></tr>
                    <tr class="total-row"><td>คิดเป็นเงินกีบ (LAK):</td><td class="text-right" style="font-weight: 700;">${(totalRecordAmt * rate).toLocaleString()} ₭</td></tr>

        const executeDeleteSale = async () => {
            if (!confirmDelete.id) return;
            try {
                await supabaseDelete('stk_sales', confirmDelete.id, 'order_id');
                setSales(prev => prev.filter(s => s.id !== confirmDelete.id));
                showToast('ลบบิลเรียบร้อยแล้ว', 'success');
            } catch(e) {
                showToast('เกิดข้อผิดพลาดในการลบ: ' + e.message, 'error');
            } finally {
                setConfirmDelete({ show: false, id: null, title: '' });
            }
        };

        const renderRecordCells = (record) => {
            let fullItems = []; let memberItems = []; let proItems = []; let zeroItems = [];
            
            // 1. Try parsing items_json first
            let itemsList = [];
            if (record.items_json) {
                try {
                    itemsList = typeof record.items_json === 'string' ? JSON.parse(record.items_json) : record.items_json;
                } catch(e) {}
            }

            if (Array.isArray(itemsList) && itemsList.length > 0) {
                itemsList.forEach(it => {
                    const qty = parseInt(it.qty) || 0;
                    if (qty > 0) {
                        const name = it.prod || it.productName || 'สินค้า';
                        const type = it.type || it.priceType || 'ราคาเต็ม';
                        if (type === 'ราคาเต็ม') fullItems.push({name, qty});
                        else if (type === 'ราคาสมาชิก') memberItems.push({name, qty});
                        else if (type === 'ราคาโปร') proItems.push({name, qty});
                        else if (type === 'ราคาศูนย์') zeroItems.push({name, qty});
                        else fullItems.push({name, qty});
                    }
                });
            } else {
                // 2. Fallback to legacy column properties
                Object.keys(record).forEach(key => {
                    const qty = parseInt(record[key]) || 0;
                    if (qty > 0) {
                        const cleanProdName = (raw) => raw.replace(/\(.*?\)/g, '').trim();
                        if (key.endsWith('_ราคาเต็ม') && key !== 'รวมชิ้นราคาเต็ม') fullItems.push({name: cleanProdName(key.replace('_ราคาเต็ม', '')), qty});
                        else if (key.endsWith('_ราคาสมาชิก') && key !== 'รวมชิ้นราคาสมาชิก') memberItems.push({name: cleanProdName(key.replace('_ราคาสมาชิก', '')), qty});
                        else if (key.endsWith('_ราคาโปร') && key !== 'รวมชิ้นราคาโปร') proItems.push({name: cleanProdName(key.replace('_ราคาโปร', '')), qty});
                        else if (key.endsWith('_ราคาศูนย์') && key !== 'รวมชิ้นราคาศูนย์') zeroItems.push({name: cleanProdName(key.replace('_ราคาศูนย์', '')), qty});
                    }
                });
            }

            const recordedBottles = parseInt(record.total_bottles || record.totalBottles) || 0;
            const calculatedQty = [...fullItems, ...memberItems, ...proItems, ...zeroItems].reduce((sum, item) => sum + item.qty, 0);
            const totalQtyInRow = calculatedQty > 0 ? calculatedQty : recordedBottles;

            const renderList = (items, textClass) => {
                if(items.length === 0) return <span className="text-slate-300 text-xs text-center block">-</span>;
                return (
                    <div className="flex flex-col gap-1 w-full">
                        {items.map((it, i) => (
                            <div key={i} className="flex justify-between items-center text-[11px] bg-white px-2.5 py-1 rounded-xl shadow-xs border border-slate-100">
                                <span className="font-bold text-slate-700 truncate mr-2" title={it.name}>{it.name}</span>
                                <span className={`font-black ${textClass}`}>x{it.qty}</span>
                            </div>
                        ))}
                    </div>
                )
            }

            return (
              <React.Fragment>
                  <td className="p-3 bg-green-50/20 border-l border-slate-100 align-top">{renderList(fullItems, 'text-green-600')}</td>
                  <td className="p-3 bg-purple-50/20 border-l border-slate-100 align-top">{renderList(memberItems, 'text-purple-600')}</td>
                  <td className="p-3 bg-orange-50/20 border-l border-slate-100 align-top">{renderList(proItems, 'text-orange-600')}</td>
                  <td className="p-3 bg-slate-50/40 border-l border-slate-100 align-top">{renderList(zeroItems, 'text-slate-600')}</td>
                  <td className="p-4 align-middle text-center border-l border-blue-200 bg-blue-50/40 w-[180px]">
                    <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">รวมทั้งหมด</div>
                    <div className="font-black text-3xl text-blue-700 drop-shadow-xs leading-none">
                        {totalQtyInRow} <span className="text-[13px] font-bold text-blue-500">ชิ้น</span>
                    </div>
                    <div className="text-[12px] font-black text-emerald-700 mt-2 bg-white py-1.5 px-2 rounded-xl border border-emerald-200 shadow-xs">
                        มูลค่า: ฿{parseFloat(record.totalAmount || record.total_amount || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}
                    </div>
                  </td>
              </React.Fragment>
            );

        return (

             {/* Modal รายละเอียดบิล */}
             <EditModal isOpen={viewBillDetail !== null} onClose={() => setViewBillDetail(null)} title={'รายละเอียดบิล ' + (viewBillDetail?.id || '')} icon={FileText} maxWidthClass="max-w-2xl">
                {viewBillDetail && (
                    <div className="flex flex-col gap-5 p-2">
                        <div className="flex justify-between items-center bg-blue-50 p-4 rounded-2xl border border-blue-100">
                            <div>
                                <span className="text-xs text-blue-600 font-bold">เลขที่บิล:</span>
                                <h3 className="text-lg font-black text-slate-800">{viewBillDetail.id}</h3>
                            </div>
                            <div className="text-right">
                                <span className="text-xs text-slate-500 font-bold">วันที่ทำรายการ:</span>
                                <p className="text-sm font-bold text-slate-700">{formatDbDateForFilter(viewBillDetail.date)}</p>
                            </div>
                        </div>

                        <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200/80 space-y-2 text-xs font-semibold">
                           <div className="flex justify-between"><span className="text-slate-500">ลูกค้า:</span> <span className="font-bold text-slate-800">{viewBillDetail.customerName || viewBillDetail.customerId}</span></div>
                           <div className="flex justify-between"><span className="text-slate-500">ผู้คีย์รายการ:</span> <span className="font-bold text-indigo-600">{viewBillDetail.recordedBy || 'Admin'}</span></div>
                           <div className="flex justify-between"><span className="text-slate-500">ช่องทางชำระเงิน:</span> <span className="font-bold text-emerald-600">{viewBillDetail.saleType}</span></div>
                           <div className="flex justify-between border-t border-slate-200/60 pt-2"><span className="text-slate-500">ยอดรวมสุทธิ:</span> <span className="font-black text-blue-700 text-sm">฿{parseFloat(viewBillDetail.totalAmount || viewBillDetail.total_amount || 0).toLocaleString(undefined,{minimumFractionDigits:2})}</span></div>
                           {viewBillDetail.paymentNote && <div className="text-amber-700 bg-amber-50 p-2 rounded-xl border border-amber-200 mt-2 whitespace-pre-line">📝 {viewBillDetail.paymentNote}</div>}
                        </div>

                        {/* รายการสินค้าในบิล */}
                        <div className="bg-white rounded-2xl border border-slate-200 p-3 space-y-2">
                           <span className="text-xs font-black text-slate-700 block mb-1">🛒 รายการสินค้าในบิล:</span>
                           {(() => {
                              let items = [];
                              if (viewBillDetail.items_json) {
                                 try { items = typeof viewBillDetail.items_json === 'string' ? JSON.parse(viewBillDetail.items_json) : viewBillDetail.items_json; } catch(e){}
                              }
                              if (!Array.isArray(items) || items.length === 0) {
                                 Object.keys(viewBillDetail).forEach(key => {
                                    const qty = parseInt(viewBillDetail[key]) || 0;
                                    if (qty > 0) {
                                       if (key.endsWith('_ราคาเต็ม') && key !== 'รวมชิ้นราคาเต็ม') items.push({prod: key.replace('_ราคาเต็ม',''), type: 'ราคาเต็ม', qty});
                                       else if (key.endsWith('_ราคาสมาชิก') && key !== 'รวมชิ้นราคาสมาชิก') items.push({prod: key.replace('_ราคาสมาชิก',''), type: 'ราคาสมาชิก', qty});
                                       else if (key.endsWith('_ราคาโปร') && key !== 'รวมชิ้นราคาโปร') items.push({prod: key.replace('_ราคาโปร',''), type: 'ราคาโปร', qty});
                                       else if (key.endsWith('_ราคาศูนย์') && key !== 'รวมชิ้นราคาศูนย์') items.push({prod: key.replace('_ราคาศูนย์',''), type: 'ราคาศูนย์', qty});
                                    }
                                 });
                              }
                              if (items.length === 0) return <div className="text-xs text-slate-400 font-bold p-2 text-center">ไม่มีข้อมูลรายการสินค้าช่อย่อย (บันทึก {viewBillDetail.total_bottles || 0} ชิ้น)</div>;
                              return items.map((it, idx) => (
                                 <div key={idx} className="flex justify-between items-center bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-100 text-xs font-bold">
                                    <span className="text-slate-800">{it.prod || it.productName} <span className="text-[10px] text-blue-600 font-normal">({it.type || it.priceType})</span></span>
                                    <span className="text-blue-700 font-black">x{it.qty}</span>
                                 </div>
                              ));
                           })()}
                        </div>

                        <div className="flex justify-end gap-3 pt-2">
                            <button onClick={() => setViewBillDetail(null)} className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl border border-slate-200 transition-colors">ปิดหน้าต่าง</button>
                            <button onClick={() => { handlePrintReceiptPopup(viewBillDetail); setViewBillDetail(null); }} className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-sm transition-colors flex items-center gap-2"><PrinterIcon size={18}/> พิมพ์บิลนี้</button>
                        </div>
                    </div>
                )}
             </EditModal>

             {/* Header */}
             <div className="bg-white p-6 rounded-3xl shadow-xs border border-slate-200/80 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                   <h2 className="text-2xl font-black text-slate-900 tracking-tight flex items-center gap-3">
                     <FileText size={28} className="text-blue-600"/> ระบบจัดการบิล (Order Management)
                   </h2>
                   <p className="text-xs font-bold text-slate-400 mt-1">ค้นหา ตรวจสอบ พิมพ์ใบเสร็จย้อนหลัง หรือจัดการบิลการสั่งซื้อทั้งหมดในระบบ</p>
                </div>
                <button onClick={() => window.location.href = 'Sales.html'} className="px-5 py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black text-sm rounded-2xl shadow-md transition-all flex items-center gap-2">
                   ➕ คีย์ขายบิลใหม่ (New Sale)
                </button>
             </div>

             {/* Main Card */}
             <div className="bg-white p-6 sm:p-7 rounded-3xl shadow-xs border border-slate-200/80 w-full">
                <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 mb-6 border-b border-slate-100 pb-4">
                   <div className="flex items-center gap-2">
                      <span className="bg-blue-50 text-blue-700 font-black px-3 py-1 rounded-xl text-xs border border-blue-200">
                         ทั้งหมด {tableTotals.count} รายการ
                      </span>
                   </div>

                   <div className="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full xl:w-auto">
                      <div className="flex items-center gap-2 bg-slate-50 p-2 rounded-2xl border border-slate-200/80 shadow-xs w-full sm:w-auto overflow-x-auto">
                          <span className="text-[12px] font-bold text-slate-500 pl-1 shrink-0">ช่วงวันที่:</span>
                          <input type="date" className="bg-white border border-slate-200 focus:border-blue-500 rounded-xl px-3 py-1.5 text-[12px] font-bold text-blue-600 outline-none shadow-xs" value={historyStartDate} onChange={e => setHistoryStartDate(e.target.value)} />
                         <span className="text-[12px] font-bold text-slate-400">-</span>
                         <input type="date" className="bg-white border border-slate-200 focus:border-blue-500 rounded-xl px-3 py-1.5 text-[12px] font-bold text-blue-600 outline-none shadow-xs" value={historyEndDate} onChange={e => setHistoryEndDate(e.target.value)} />
                      </div>
                      <div className="flex items-center bg-slate-50 border border-slate-200/80 rounded-2xl px-3 shadow-xs focus-within:border-blue-500 focus-within:bg-white transition-all flex-1 sm:w-64 h-[40px]">
                         <SearchIcon size={18} className="text-slate-400 shrink-0" />
                         <input type="text" placeholder="ค้นหาเลขบิล, ชื่อลูกค้า, พนักงาน..." className="w-full bg-transparent border-none outline-none text-[13px] font-medium text-slate-800 placeholder-slate-400 pl-2 h-full" value={salesSearchTerm} onChange={e => setSalesSearchTerm(e.target.value)} />
                      </div>
                   </div>
                </div>

                <div className="w-full overflow-x-auto rounded-2xl border border-slate-200/80 bg-white shadow-xs mb-4">
                  <table className="w-full text-left min-w-[1000px] border-collapse relative">
                     <thead className="bg-slate-50/90 border-b border-slate-200">
                       <tr>
                         <th className="p-3.5 text-xs font-black text-slate-700 uppercase tracking-wider">ข้อมูลบิล / ลูกค้า</th>
                         <th className="p-3 text-xs font-black text-center text-green-700 uppercase tracking-wider border-l border-slate-200 w-[12%]">ชิ้น (ราคาเต็ม)</th>
                         <th className="p-3 text-xs font-black text-center text-purple-700 uppercase tracking-wider border-l border-slate-200 w-[12%]">ชิ้น (ราคาสมาชิก)</th>
                         <th className="p-3 text-xs font-black text-center text-orange-700 uppercase tracking-wider border-l border-slate-200 w-[12%]">ชิ้น (ราคาโปร)</th>
                         <th className="p-3 text-xs font-black text-center text-slate-500 uppercase tracking-wider border-l border-slate-200 w-[12%]">ชิ้น (ราคาศูนย์)</th>
                         <th className="p-3 text-xs font-black text-center text-blue-900 uppercase tracking-wider border-l border-slate-200 bg-blue-50/80 w-[180px]">ยอดรวม</th>
                         {isAdmin && <th className="p-3 text-xs font-black text-center uppercase tracking-wider border-l border-slate-200 w-[110px]">จัดการบิล</th>}
                       </tr>
                     </thead>
                     <tbody className="divide-y divide-slate-100">
                       {paginatedSalesHistory.map((rs, index) => {
                          const mName = (members || []).find(m => m && m.id === rs.memberId)?.name || rs.memberName || rs.memberId;
                          const cName = (customers || []).find(c => c && c.id === rs.customerId)?.name || rs.customerName || '';
                          return (
                           <tr key={index} className="hover:bg-slate-50/80 transition-colors">
                              <td className="py-3 px-3.5 align-top border-r border-slate-100 overflow-hidden">
                                 <div className="font-bold text-blue-700 text-sm leading-tight mb-1 truncate flex justify-between items-center" title={rs.customerId}>
                                    <span className="truncate mr-1">👤 {rs.customerId || ''} <span className="text-[11px] font-bold text-slate-700">({cName || 'ลูกค้าใหม่'})</span></span>
                                    <span className="text-[10px] bg-blue-50 text-blue-700 px-2 py-0.5 rounded-md border border-blue-200 font-bold shadow-xs text-center">บิล: <span className="font-black">{rs.id}</span></span>
                                 </div>
                                 <div className="text-[10px] font-bold text-slate-400 mb-0.5 truncate">ผู้ขาย: <span className="text-slate-700 font-semibold">{mName} ({rs.memberId})</span></div>
                                
                                 <div className="flex items-center gap-2 mt-1.5 flex-wrap">
                                   <div className="text-[10px] font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md border border-slate-200">{formatDbDateForFilter(rs.date)}</div>
                                   <div className="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md border border-indigo-100">ผู้คีย์: {rs.recordedBy || 'Admin'}</div>
                                 </div>

                                 {rs.paymentNote && (
                                     <div className="text-[10px] text-amber-700 bg-amber-50/80 border border-amber-200 rounded-lg p-1.5 mt-2 font-medium whitespace-pre-line">
                                         📝 {rs.paymentNote}
                                     </div>
                                 )}

                                 <div className="mt-2.5 border-t border-slate-100 pt-2 flex gap-2">
                                   <button 
                                      type="button"
                                      onClick={() => setViewBillDetail(rs)} 
                                      className="flex-1 flex items-center justify-center bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 px-2 py-1.5 rounded-xl transition-colors shadow-xs gap-1 text-[11px] font-bold" 
                                   >
                                      <Eye size={13} className="text-blue-600"/> ดูรายละเอียด
                                   </button>
                                   <button 
                                      type="button"
                                      onClick={() => handlePrintReceiptPopup(rs)} 
                                      className="flex-1 flex items-center justify-center bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 px-2 py-1.5 rounded-xl transition-colors shadow-xs gap-1 text-[11px] font-bold" 
                                   >
                                      <PrinterIcon size={13} /> พิมพ์บิล
                                   </button>
                                 </div>
                              </td>
                              {renderRecordCells(rs)}
                              {isAdmin && (
                                <td className="p-2.5 align-middle text-center border-l border-slate-100 bg-slate-50/30">
                                  <div className="flex flex-col items-center justify-center gap-2">
                                      <button onClick={() => window.location.href = 'Sales.html?editId=' + rs.id} className="flex items-center justify-center gap-1 w-full text-[11px] font-bold text-blue-600 hover:bg-blue-50 transition-colors bg-white py-1.5 rounded-xl border border-slate-200 shadow-xs" title="แก้ไข"><Edit size={12}/> แก้ไขบิล</button>
                                      <button onClick={() => setConfirmDelete({show: true, id: rs.id, customerId: rs.customerId, title: 'บิล ' + rs.id + ' ลูกค้า ' + rs.customerId})} className="flex items-center justify-center gap-1 w-full text-[11px] font-bold text-red-500 hover:bg-red-50 transition-colors bg-white py-1.5 rounded-xl border border-slate-200 shadow-xs" title="ลบ"><Trash2 size={12}/> ลบบิล</button>
                                  </div>
                                </td>
                              )}
                           </tr>
                         )
                       })}
                       {paginatedSalesHistory.length === 0 && <tr><td colSpan={isAdmin?7:6} className="p-12 text-center text-slate-400 font-bold text-sm bg-slate-50/30">ไม่พบประวัติการขายในช่วงเวลาที่ค้นหา</td></tr>}
                     </tbody>
                     <tfoot className="bg-slate-50 border-t-2 border-slate-200">
                        <tr>
                           <td className="py-3 px-3.5 align-middle text-right border-r border-slate-200">
                              <div className="font-black text-slate-800 text-xs">รวมทั้งหมด ({tableTotals.count} บิล)</div>
                           </td>
                           <td className="p-2 align-middle text-center border-l border-slate-200 bg-green-50/50">
                              <div className="font-black text-base text-green-700">{tableTotals.totalFull}</div>
                              <div className="text-[9px] font-bold text-green-600 uppercase">ชิ้นราคาเต็ม</div>
                           </td>
                           <td className="p-2 align-middle text-center border-l border-slate-200 bg-purple-50/50">
                              <div className="font-black text-base text-purple-700">{tableTotals.totalMember}</div>
                              <div className="text-[9px] font-bold text-purple-600 uppercase">ชิ้นราคาสมาชิก</div>
                           </td>
                           <td className="p-2 align-middle text-center border-l border-slate-200 bg-orange-50/50">
                              <div className="font-black text-base text-orange-700">{tableTotals.totalPro}</div>
                              <div className="text-[9px] font-bold text-orange-600 uppercase">ชิ้นราคาโปร</div>
                           </td>
                           <td className="p-2 align-middle text-center border-l border-slate-200 bg-slate-100/50">
                              <div className="font-black text-base text-slate-600">{tableTotals.totalZero}</div>
                              <div className="text-[9px] font-bold text-slate-500 uppercase">ชิ้นราคาศูนย์</div>
                           </td>
                           <td className="p-2.5 align-middle text-center border-l border-slate-200 bg-blue-50/60">
                              <div className="font-black text-xl text-blue-900 leading-none">{tableTotals.grandTotal} ชิ้น</div>
                              <div className="text-[11px] font-black text-emerald-700 bg-white py-1 px-2 rounded-lg border border-emerald-200 mt-1 shadow-xs inline-block">฿{tableTotals.totalAmountTHB.toLocaleString(undefined, {minimumFractionDigits: 2})}</div>
                           </td>
                           {isAdmin && <td className="bg-slate-50 border-l border-slate-200"></td>}
                        </tr>
                     </tfoot>
                   </table>
                 </div>

                 {totalSalesPages > 1 && (
                   <div className="flex flex-col sm:flex-row justify-between items-center bg-white p-3 rounded-2xl border border-slate-200/80 shadow-xs gap-2">
                      <span className="text-xs font-semibold text-slate-500">
                          แสดง {((salesPage - 1) * SALES_PER_PAGE) + 1} ถึง {Math.min(salesPage * SALES_PER_PAGE, filteredSalesHistory.length)} จากทั้งหมด {filteredSalesHistory.length} รายการ
                      </span>
                      <div className="flex items-center gap-2">
                          <button onClick={() => setSalesPage(p => Math.max(1, p - 1))} disabled={salesPage === 1} className="px-3 py-1.5 bg-white text-slate-700 text-xs font-semibold rounded-xl border border-slate-200 disabled:opacity-50 hover:bg-slate-50 transition-colors shadow-xs">ก่อนหน้า</button>
                          <span className="text-xs font-bold text-blue-700 bg-blue-50 px-3 py-1.5 rounded-xl border border-blue-200 shadow-xs">หน้า {salesPage} / {totalSalesPages}</span>
                          <button onClick={() => setSalesPage(p => Math.min(totalSalesPages, p + 1))} disabled={salesPage === totalSalesPages} className="px-3 py-1.5 bg-white text-slate-700 text-xs font-semibold rounded-xl border border-slate-200 disabled:opacity-50 hover:bg-slate-50 transition-colors shadow-xs">ถัดไป</button>
                      </div>
                   </div>
                 )}
             </div>
          </div>
        );
    };

    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [sales, setSales] = useState([]);
      const [members, setMembers] = useState([]);
      const [customers, setCustomers] = useState([]);
      const [products, setProducts] = useState([]);
      const [systemSettings, setSystemSettings] = useState({ exchange_rate: 700 });
      const [systemUsers, setSystemUsers] = useState([]);
      const [isAppLoading, setIsAppLoading] = useState(true);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => localStorage.getItem('stk_sidebar_collapsed') === 'true');
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

      const showToast = (message, type = 'success') => setToast({ show: true, message, type });

      const SCRIPT_URL = (() => {
        try { if (window.top && window.top.location && window.top.location.href.startsWith('http')) return window.top.location.href.split('?')[0]; } catch(e){}
        return "<?= getScriptUrl() ?>";
      })();

      const isAdmin = currentUser && (String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || String(currentUser.role).trim().toLowerCase() === 'admin');
      const currentUserProfileUrl = currentUser?.profileUrl || '';

      useEffect(() => {
        const savedUserStr = localStorage.getItem('stk_current_user');
        if (savedUserStr) {
          setCurrentUser(JSON.parse(savedUserStr));
          setIsLoggedIn(true);
        } else {
          setShowLoginModal(true);
        }

        const initialLoader = document.getElementById('initial-loader');
        if (initialLoader) initialLoader.style.display = 'none';

        Promise.all([
          supabaseSelect('stk_members').catch(() => supabaseSelect('members')),
          supabaseSelect('stk_customers').catch(() => supabaseSelect('customers')),
          supabaseSelect('stk_sales').catch(() => supabaseSelect('sales')),
          supabaseSelect('stk_products').catch(() => supabaseSelect('products')),
          supabaseSelect('stk_system_settings').catch(() => supabaseSelect('system_settings')).catch(() => [])
        ]).then(([memRes, custRes, saleRes, prodRes, setRes]) => {
          if (Array.isArray(memRes)) setMembers(memRes.map(m => ({ ...m, id: m.id || m.user_id || m.member_id, name: m.name })));
          if (Array.isArray(custRes)) setCustomers(custRes.map(x => ({ ...x, id: x.id || x.customer_id })));
          let combinedSales = Array.isArray(saleRes) ? [...saleRes] : [];
          // แสดงเฉพาะบิลที่ผ่านการบันทึกชำระเงินเรียบร้อยแล้วเท่านั้น
          combinedSales = combinedSales.filter(s => s && s.status !== 'รอดำเนินการ' && s.status !== 'ร่างใบสั่งซื้อ (จากคลินิก)');
          setSales(combinedSales.map(s => ({
             ...s,
             id: s.id || s.sale_id || s.receipt_id || s.order_id,
             customerId: s.customerId || s.customer_id,
             memberId: s.memberId || s.sellerId || s.seller_id,
             totalAmount: s.totalAmount || s.total_amount,
             saleType: s.saleType || s.sale_type,
             date: s.date || s.created_at,
             recordedBy: s.recordedBy || s.recorded_by,
             paymentNote: s.paymentNote || s.payment_note
          })));
          if (Array.isArray(prodRes)) setProducts(prodRes.map(p => ({
             ...p,
             id: p.id || p.product_id,
             name: p.name || p.product_name,
             priceFull: p.priceFull || p.price_full || 0,
             pricePromo: p.pricePromo || p.price_promo || 0,
             priceMember: p.priceMember || p.price_member || 0
          })));
          if (setRes) {
             const settingsObj = { exchange_rate: 700 };
             if (Array.isArray(setRes)) setRes.forEach(s => settingsObj[s.key || s.setting_key] = s.value || s.setting_value);
             setSystemSettings(settingsObj);
          }
        }).finally(() => setIsAppLoading(false));
      }, []);

      const handleLoginSuccess = (user) => {
        localStorage.setItem('stk_current_user', JSON.stringify(user));
        setCurrentUser(user);
        setIsLoggedIn(true);
        setShowLoginModal(false);
        showToast('เข้าสู่ระบบสำเร็จ!', 'success');
      };

      const handleLogout = () => {
        localStorage.removeItem('stk_current_user');
        setCurrentUser(null);
        setIsLoggedIn(false);
        window.location.href = resolvePageUrl('?page=dashboard');
      };

      return (
        <div className="min-h-screen flex flex-col lg:flex-row font-sans bg-slate-50">
          <Sidebar 
            activePage="orders" 
            isLoggedIn={isLoggedIn} 
            currentUser={currentUser} 
            currentUserProfileUrl={currentUserProfileUrl} 
            isAdmin={isAdmin} 
            onLogout={handleLogout} 
            showLoginModal={showLoginModal} 
            setShowLoginModal={setShowLoginModal} 
            SCRIPT_URL={SCRIPT_URL}
            setIsAppLoading={setIsAppLoading}
            isSidebarCollapsed={isSidebarCollapsed}
            setIsSidebarCollapsed={setIsSidebarCollapsed}
          />
          
          <main className={'flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 relative ' + (isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64') + ' w-full overflow-x-hidden p-4 lg:p-8'}>
             {toast.show && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-[9999] flex items-center justify-center p-4">
                 <div className={'bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center border-t-4 ' + (toast.type === 'error' ? 'border-red-500' : 'border-emerald-500')}>
                    <h3 className="text-xl font-bold text-slate-800 mb-2">{toast.type === 'error' ? 'เกิดข้อผิดพลาด' : 'สำเร็จ!'}</h3>
                    <p className="text-slate-600 font-medium text-sm mb-6">{toast.message}</p>
                    <button onClick={() => setToast({ ...toast, show: false })} className="w-full py-2.5 rounded-xl font-bold bg-slate-100 text-slate-700 hover:bg-slate-200">ตกลง</button>
                 </div>
              </div>
             )}

             {isAppLoading ? (
               <div className="flex flex-col items-center justify-center py-32 gap-4 flex-1">
                 <div className="w-12 h-12 border-4 border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                 <p className="text-slate-500 text-sm font-bold">กำลังโหลดรายการบิล...</p>
               </div>
             ) : (
               <OrdersView 
                 sales={sales} 
                 setSales={setSales} 
                 members={members} 
                 customers={customers} 
                 products={products}
                 systemSettings={systemSettings}
                 isAdmin={isAdmin} 
                 showToast={showToast} 
                 currentUser={currentUser} 
               />
             )}
          </main>

          <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={systemUsers} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
