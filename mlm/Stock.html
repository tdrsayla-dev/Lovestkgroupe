           const promises = validItems.map(item => {
              return supabaseInsert('stk_stock_movements', {
                 movement_id: 'MOV-' + Date.now() + '-' + Math.floor(Math.random()*1000),
                 date: date,
                 product_id: item.productId,
                 type: 'IN',
                 sub_type: 'รับสินค้า',
                 quantity: Number(item.quantity),
                 lot_id: mockLot,
                 notes: notes,
                 created_by: data.createdBy
              });
           });

           Promise.all(promises).then(() => {
              setIsSubmitting(false);
              showToast(`รับสินค้านำเข้าสำเร็จ ${validItems.length} รายการ`, 'success');
              
              setProducts(prev => (prev || []).map(p => {
                 const match = validItems.find(it => it.productId.toUpperCase() === p.id.toUpperCase());
                 if (match) {
                    const addQty = Number(match.quantity);
                    supabaseUpdate('stk_products', p.id, { current_stock: (p.stock || 0) + addQty }, 'product_id').catch(e=>{});
                    return { ...p, stock: (p.stock || 0) + addQty };
                 }
                 return p;
              }));

              setItems([{ productId: '', quantity: '' }]);
              setNotes('');
           }).catch(err => {
              setIsSubmitting(false);
              showToast('ข้อผิดพลาด Supabase: ' + err.message, 'error');
           });
        } else {
          setTimeout(() => {
            setIsSubmitting(false);
            const mockLot = 'LOT-DEMO-' + Date.now();
            showToast(`[จำลอง] รับสินค้านำเข้าสำเร็จ ${validItems.length} รายการ`, 'success');
            
            const newMovs = validItems.map((item, idx) => ({
              movementId: 'MOV-DEMO-' + Date.now() + '-' + idx,
              date,
              productId: item.productId,
              type: 'IN',
              subType: 'รับสินค้า',
              quantity: Number(item.quantity),
              lotId: mockLot,
              notes,
              createdBy: data.createdBy
            }));
            
            setStockMovements(prev => [...newMovs, ...(prev || [])]);
            setProducts(prev => {
              const map = {};
              validItems.forEach(item => {
                map[item.productId.toUpperCase()] = Number(item.quantity);
              });
              return (prev || []).map(p => {
                const addQty = map[p.id.toUpperCase()] || 0;
                return addQty > 0 ? { ...p, stock: (p.stock || 0) + addQty } : p;
              });
            });

            setItems([{ productId: '', quantity: '' }]);
            setNotes('');
          }, 600);
        }
      };

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <h3 className="text-base font-black text-slate-800 mb-5 flex items-center gap-2">
              <div className="w-7 h-7 bg-emerald-100 rounded-lg flex items-center justify-center"><Plus size={16} className="text-emerald-600"/></div>
              บันทึกรับสินค้านำเข้าคลัง (แบบระบุหลายรายการ)
            </h3>
            
            <form onSubmit={handleSubmit}>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200/60">
                <div>
                  <label className={labelClassHud}>วันที่รับสินค้า</label>
                  <input type="date" className={inputClassHud} value={date} onChange={e => setDate(e.target.value)}/>
                </div>
                <div>
                  <label className={labelClassHud}>หมายเหตุ (เลข Invoice / แหล่งที่มา)</label>
                  <input type="text" placeholder="เช่น INV-2025-001 รับจากซัพพลายเออร์" className={inputClassHud} value={notes} onChange={e => setNotes(e.target.value)}/>
                </div>
              </div>

              <div className="hidden sm:grid grid-cols-12 gap-3 text-xs font-black text-slate-400 uppercase tracking-wider px-2 mb-2">
                <div className="col-span-8">สินค้า *</div>
                <div className="col-span-3">จำนวนที่นำเข้า (ชิ้น) *</div>
                <div className="col-span-1 text-center">ลบ</div>
              </div>

              <div className="space-y-3 mb-6">
                {items.map((item, idx) => (
                  <div key={idx} className="grid grid-cols-1 sm:grid-cols-12 gap-3 items-center bg-slate-50 sm:bg-transparent p-3 sm:p-0 rounded-xl border border-slate-100 sm:border-none">
                    <div className="col-span-8">
                      <label className="block sm:hidden text-[10px] font-bold text-slate-400 mb-1">สินค้า *</label>
                      <select required className={inputClassHud} value={item.productId} onChange={e => handleRowChange(idx, 'productId', e.target.value)}>
                        <option value="">-- เลือกสินค้า --</option>
                        {(products || []).map(p => (
                          <option key={p.id} value={p.id}>{p.id} - {p.name} (คงเหลือ: {p.stock || 0})</option>
                        ))}
                      </select>
                    </div>
                    <div className="col-span-3">
                      <label className="block sm:hidden text-[10px] font-bold text-slate-400 mb-1">จำนวน *</label>
                      <input type="number" min="1" required placeholder="เช่น 50" className={inputClassHud} value={item.quantity} onChange={e => handleRowChange(idx, 'quantity', e.target.value)}/>
                    </div>
                    <div className="col-span-1 text-center">
                      <button type="button" onClick={() => handleRemoveRow(idx)} className="p-2 text-red-500 hover:bg-red-50 rounded-lg transition-colors">
                        <Trash2 size={16}/>
                      </button>
                    </div>
                  </div>
                ))}
              </div>

              <div className="flex justify-between items-center border-t border-slate-100 pt-4">
                <button type="button" onClick={handleAddRow} className={btnClassSecondary + " !py-2 !px-4 text-xs flex items-center gap-1.5"}>
                  <Plus size={14}/> เพิ่มรายการสินค้า
                </button>
                <button type="submit" disabled={isSubmitting} className={btnClassPrimary + " bg-emerald-600 border-emerald-600 hover:bg-emerald-700"}>
                  {isSubmitting ? 'กำลังบันทึก...' : <><CheckCircle size={16}/> บันทึกรับสินค้านำเข้าทั้งหมด</>}
                </button>
              </div>
            </form>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="px-5 py-3.5 border-b border-slate-100 flex items-center gap-2">
              <Clock size={15} className="text-slate-400"/>
              <h4 className="text-sm font-black text-slate-700">ประวัติรับสินค้านำเข้าล่าสุด</h4>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-xs">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-100">
                    <th className="text-left py-2.5 px-4 font-black text-slate-400 uppercase tracking-wide">Lot ID</th>
                    <th className="text-left py-2.5 px-4 font-black text-slate-400 uppercase tracking-wide">สินค้า</th>
                    <th className="text-right py-2.5 px-4 font-black text-slate-400 uppercase tracking-wide">จำนวน</th>
                    <th className="text-left py-2.5 px-4 font-black text-slate-400 uppercase tracking-wide">วันที่</th>
                    <th className="text-left py-2.5 px-4 font-black text-slate-400 uppercase tracking-wide">หมายเหตุ</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-50">
                  {recentIn.length === 0 && <tr><td colSpan={5} className="py-8 text-center text-slate-400">ยังไม่มีประวัติการรับสินค้า</td></tr>}
                  {recentIn.map(m => (
                    <tr key={m.movementId} className="hover:bg-emerald-50/30 transition-colors">
                      <td className="py-2.5 px-4 font-bold text-emerald-700">{m.lotId || m.movementId}</td>
                      <td className="py-2.5 px-4 font-semibold text-slate-700">{m.productId}</td>
                      <td className="py-2.5 px-4 text-right font-black text-emerald-700">+{m.quantity}</td>
                      <td className="py-2.5 px-4 text-slate-500">{m.date ? String(m.date).substring(0,10) : '-'}</td>
                      <td className="py-2.5 px-4 text-slate-500 truncate max-w-[200px]">{m.notes || '-'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    const StockOutTab = ({ products, stockMovements, setStockMovements, setProducts, currentUser, showToast }) => {
      const [items, setItems] = useState([{ productId: '', quantity: '' }]);
      const [subTypeMode, setSubTypeMode] = useState('เบิกขาย');
      const [customSubType, setCustomSubType] = useState('');
      const [date, setDate] = useState(getLocalISODate());
      const [notes, setNotes] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);

      const recentOut = useMemo(() =>
        (stockMovements || []).filter(m => m.type === 'OUT').slice(0, 30),
        [stockMovements]
      );

      const handleAddRow = () => {
        setItems([...items, { productId: '', quantity: '' }]);
      };

      const handleRemoveRow = (index) => {
        if (items.length === 1) {
          showToast('ต้องมีอย่างน้อย 1 รายการ', 'info');
          return;
        }
        setItems(items.filter((_, i) => i !== index));
      };

      const handleRowChange = (index, field, value) => {
        const newItems = [...items];
        newItems[index][field] = value;
        setItems(newItems);
      };

      const subTypeOptions = [
        { value: 'เบิกขาย', label: '🛒 เบิกขาย (ปกติ)', color: 'text-blue-600' },
        { value: 'เบิกชำรุด', label: '⚠️ เบิกชำรุด / สูญหาย', color: 'text-red-600' },
        { value: 'เบิกภายใน', label: '🏢 เบิกใช้ภายใน (โปรโมท/ทดสอบ)', color: 'text-purple-600' },
        { value: 'อื่นๆ', label: '📝 อื่นๆ (ระบุเอง)', color: 'text-slate-600' },
      ];

      const handleSubmit = (e) => {
        e.preventDefault();
        
        const finalSubType = subTypeMode === 'อื่นๆ' ? customSubType.trim() : subTypeMode;
        if (!finalSubType) {
          showToast('กรุณาระบุประเภทการเบิกอื่นๆ', 'error');
          return;
        }

        const validItems = items.filter(item => item.productId && Number(item.quantity) > 0);
        if (validItems.length === 0) {
          showToast('กรุณากรอกข้อมูลสินค้าและจำนวนอย่างน้อย 1 รายการ', 'error');
          return;
        }

        const productQtyMap = {};
        for (let item of validItems) {
          const key = item.productId.toUpperCase();
          productQtyMap[key] = (productQtyMap[key] || 0) + Number(item.quantity);
        }

        for (let pid of Object.keys(productQtyMap)) {
          const product = (products || []).find(p => p.id.toUpperCase() === pid);
          if (!product) {
            showToast(`ไม่พบรหัสสินค้า ${pid}`, 'error');
            return;
          }
          const availableStock = product.stock || 0;
          const requestedQty = productQtyMap[pid];
          if (requestedQty > availableStock) {
            showToast(`สินค้า ${product.name} (${pid}) มีสต๊อกไม่เพียงพอ (ต้องการ ${requestedQty} ชิ้น, มีอยู่ ${availableStock} ชิ้น)`, 'error');
            return;
          }
        }

        setIsSubmitting(true);
        const data = {
          items: validItems.map(item => ({
            productId: item.productId,
            quantity: Number(item.quantity)
          })),
          subType: finalSubType,
          notes,
          date,
          createdBy: currentUser ? currentUser.id : 'SYSTEM'
        };

        if (typeof window.supabaseInsert === 'function') {
           const promises = validItems.map(item => {
              return supabaseInsert('stk_stock_movements', {
                 movement_id: 'MOV-' + Date.now() + '-' + Math.floor(Math.random()*1000),
                 date: date,
                 product_id: item.productId,
                 type: 'OUT',
                 sub_type: finalSubType,
                 quantity: Number(item.quantity),
                 notes: notes,
                 created_by: data.createdBy
              });
           });

           Promise.all(promises).then(() => {
              setIsSubmitting(false);
              showToast(`เบิกสินค้าสำเร็จ ${validItems.length} รายการ`, 'success');
              
              setProducts(prev => (prev || []).map(p => {
                 const reduceQty = productQtyMap[p.id.toUpperCase()] || 0;
                 if (reduceQty > 0) {
                    const newStock = Math.max(0, (p.stock || 0) - reduceQty);
                    supabaseUpdate('stk_products', p.id, { current_stock: newStock }, 'product_id').catch(e=>{});
                    return { ...p, stock: newStock };
                 }
                 return p;
              }));

              setItems([{ productId: '', quantity: '' }]);
              setNotes('');
              setCustomSubType('');
           }).catch(err => {
              setIsSubmitting(false);
              showToast('ข้อผิดพลาด Supabase: ' + err.message, 'error');
           });
        } else {
          setTimeout(() => {
            setIsSubmitting(false);
            showToast(`[จำลอง] เบิกสินค้าสำเร็จ ${validItems.length} รายการ`, 'success');
            
            const newMovs = validItems.map((item, idx) => ({
              movementId: 'MOV-DEMO-' + Date.now() + '-' + idx,
              date,
              productId: item.productId,
              type: 'OUT',
              subType: finalSubType,
              quantity: Number(item.quantity),
              lotId: '',
              notes,
              createdBy: data.createdBy
            }));

            setStockMovements(prev => [...newMovs, ...(prev || [])]);
            setProducts(prev => (prev || []).map(p => {
              const reduceQty = productQtyMap[p.id.toUpperCase()] || 0;
              return reduceQty > 0 ? { ...p, stock: (p.stock || 0) - reduceQty } : p;
            }));

            setItems([{ productId: '', quantity: '' }]);
            setNotes('');
            setCustomSubType('');
          }, 600);
        }
      };

      const subTypeColor = {
        'เบิกขาย': 'border-blue-200 bg-blue-50',
        'เบิกชำรุด': 'border-red-200 bg-red-50',
        'เบิกภายใน': 'border-purple-200 bg-purple-50',
        'อื่นๆ': 'border-slate-300 bg-slate-50'
      };

      return (
        <div className="space-y-6">
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
            <h3 className="text-base font-black text-slate-800 mb-5 flex items-center gap-2">
              <div className="w-7 h-7 bg-red-100 rounded-lg flex items-center justify-center"><Minus size={16} className="text-red-600"/></div>
              บันทึกการเบิกสินค้าออก (แบบระบุหลายรายการ)
            </h3>

            <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">
              {subTypeOptions.map(opt => (
                <button key={opt.value} type="button"
                  onClick={() => setSubTypeMode(opt.value)}
                  className={`p-3 rounded-xl border-2 text-left transition-all font-bold text-xs ${subTypeMode === opt.value ? subTypeColor[opt.value] : 'border-slate-200 bg-white hover:border-slate-300'}`}>
                  <span className={subTypeMode === opt.value ? opt.color : 'text-slate-700'}>{opt.label}</span>
                </button>
              ))}
            </div>

            <form onSubmit={handleSubmit}>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200/60">
                <div>
                  <label className={labelClassHud}>วันที่เบิก</label>
                  <input type="date" className={inputClassHud} value={date} onChange={e => setDate(e.target.value)}/>
                </div>
                
                {subTypeMode === 'อื่นๆ' ? (
                  <div>
                    <label className={labelClassHud}>ระบุประเภทการเบิกอื่นๆ *</label>
                    <input type="text" required placeholder="เช่น เบิกไปงานออกบูธ" className={inputClassHud} value={customSubType} onChange={e => setCustomSubType(e.target.value)}/>
                  </div>
                ) : (
                  <div>
                    <label className={labelClassHud}>ประเภทที่เลือก</label>
                    <input type="text" disabled className={inputClassHud + " opacity-70 bg-slate-100"} value={subTypeMode}/>
                  </div>
                )}

                <div>
                  <label className={labelClassHud}>เหตุผล / หมายเหตุ {subTypeMode === 'เบิกชำรุด' ? '*' : ''}</label>
                  <input type="text"
                    required={subTypeMode === 'เบิกชำรุด'}
                    placeholder={subTypeMode === 'เบิกชำรุด' ? 'ต้องระบุสาเหตุชำรุด/สูญหาย' : 'หมายเหตุเพิ่มเติม (ถ้ามี)'}
                    className={inputClassHud}
                    value={notes}
                    onChange={e => setNotes(e.target.value)}/>
                </div>
              </div>

              <div className="hidden sm:grid grid-cols-12 gap-3 text-xs font-black text-slate-400 uppercase tracking-wider px-2 mb-2">
                <div className="col-span-8">สินค้า *</div>
                <div className="col-span-3">จำนวนที่เบิก (ชิ้น) *</div>
                <div className="col-span-1 text-center">ลบ</div>
              </div>

              <div className="space-y-3 mb-6">
                {items.map((item, idx) => {
                  const selectedProduct = (products || []).find(p => p.id.toUpperCase() === item.productId.toUpperCase());
                  return (
                    <div key={idx} className="grid grid-cols-1 sm:grid-cols-12 gap-3 items-center bg-slate-50 sm:bg-transparent p-3 sm:p-0 rounded-xl border border-slate-100 sm:border-none">
                      <div className="col-span-8">
                        <label className="block sm:hidden text-[10px] font-bold text-slate-400 mb-1">สินค้า *</label>
                        <select required className={inputClassHud} value={item.productId} onChange={e => handleRowChange(idx, 'productId', e.target.value)}>
                          <option value="">-- เลือกสินค้า --</option>
                          {(products || []).map(p => (
                            <option key={p.id} value={p.id} disabled={!p.stock || p.stock <= 0}>
                              {p.id} - {p.name} (คงเหลือ: {p.stock || 0}{(!p.stock || p.stock <= 0) ? ' - หมดสต๊อก' : ''})
                            </option>
                          ))}
                        </select>
                      </div>
                      <div className="col-span-3">
                        <label className="block sm:hidden text-[10px] font-bold text-slate-400 mb-1">จำนวน *</label>
                        <input type="number" min="1"
                          max={selectedProduct ? selectedProduct.stock || 0 : undefined}
                          required placeholder="ระบุจำนวน"
                          className={inputClassHud}
                          value={item.quantity}
                          onChange={e => handleRowChange(idx, 'quantity', e.target.value)}/>
                        {selectedProduct && (
                          <p className="text-[10px] text-slate-400 mt-1 pl-1">คงเหลือ: <span className={`font-bold ${(selectedProduct.stock || 0) <= 10 ? 'text-red-600' : 'text-emerald-600'}`}>{selectedProduct.stock || 0} ชิ้น</span></p>
                        )}
                      </div>
                      <div className="col-span-1 text-center">
                        <button type="button" onClick={() => handleRemoveRow(idx)} className="p-2 text-red-500 hover:bg-red-50 rounded-lg transition-colors">
                          <Trash2 size={16}/>
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="flex justify-between items-center border-t border-slate-100 pt-4">
                <button type="button" onClick={handleAddRow} className={btnClassSecondary + " !py-2 !px-4 text-xs flex items-center gap-1.5"}>
                  <Plus size={14}/> เพิ่มรายการสินค้าที่จะเบิก
                </button>
                <button type="submit" disabled={isSubmitting} className={btnClassPrimary + " bg-red-600 border-red-600 hover:bg-red-700"}>
                  {isSubmitting ? 'กำลังบันทึก...' : `บันทึกการเบิกสินค้าทั้งหมด`}
                </button>
              </div>
            </form>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="px-5 py-3.5 border-b border-slate-100 flex items-center gap-2">
              <Clock size={15} className="text-slate-400"/>
              <h4 className="text-sm font-black text-slate-700">ประวัติการเบิกสินค้าล่าสุด</h4>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-xs">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-100">
                    <th className="text-left py-2.5 px-4 font-black text-slate-400 uppercase">เลขที่</th>
                    <th className="text-left py-2.5 px-4 font-black text-slate-400 uppercase">สินค้า</th>
                    <th className="text-left py-2.5 px-4 font-black text-slate-400 uppercase">ประเภท</th>
                    <th className="text-right py-2.5 px-4 font-black text-slate-400 uppercase">จำนวน</th>
                    <th className="text-left py-2.5 px-4 font-black text-slate-400 uppercase">วันที่</th>
                    <th className="text-left py-2.5 px-4 font-black text-slate-400 uppercase">หมายเหตุ</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-50">
                  {recentOut.length === 0 && <tr><td colSpan={6} className="py-8 text-center text-slate-400">ยังไม่มีประวัติการเบิกสินค้า</td></tr>}
                  {recentOut.map(m => (
                    <tr key={m.movementId} className="hover:bg-red-50/30 transition-colors">
                      <td className="py-2.5 px-4 font-bold text-red-700 text-[10px]">{m.movementId}</td>
                      <td className="py-2.5 px-4 font-semibold text-slate-700">{m.productId}</td>
                      <td className="py-2.5 px-4">
                        <span className={`px-2 py-0.5 rounded-full text-[9px] font-black ${m.subType === 'เบิกชำรุด' ? 'bg-red-100 text-red-700' : m.subType === 'เบิกภายใน' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>
                          {m.subType}
                        </span>
                      </td>
                      <td className="py-2.5 px-4 text-right font-black text-red-700">-{m.quantity}</td>
                      <td className="py-2.5 px-4 text-slate-500">{m.date ? String(m.date).substring(0,10) : '-'}</td>
                      <td className="py-2.5 px-4 text-slate-500 truncate max-w-[180px]">{m.notes || '-'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    const MovementLogTab = ({ products, stockMovements, setStockMovements, showToast }) => {
      const [filterType, setFilterType] = useState('ALL');
      const [filterProduct, setFilterProduct] = useState('');
      
      // Default to current local date
      const getLocalDateString = () => {
        const d = new Date();
        const offset = d.getTimezoneOffset();
        const local = new Date(d.getTime() - (offset * 60 * 1000));
        return local.toISOString().split('T')[0];
      };
      
      const [dateFrom, setDateFrom] = useState(getLocalDateString());
      const [dateTo, setDateTo] = useState(getLocalDateString());
      const [isLoading, setIsLoading] = useState(false);

      const filtered = useMemo(() => {
        return (stockMovements || []).filter(m => {
          if (filterType !== 'ALL' && m.type !== filterType) return false;
          if (filterProduct && m.productId.toUpperCase() !== filterProduct.toUpperCase()) return false;
          if (dateFrom && String(m.date).substring(0,10) < dateFrom) return false;
          if (dateTo && String(m.date).substring(0,10) > dateTo) return false;
          return true;
        });
      }, [stockMovements, filterType, filterProduct, dateFrom, dateTo]);

      const handleExportCSV = () => {
        if (filtered.length === 0) { showToast('ไม่มีข้อมูลสำหรับ Export', 'error'); return; }
        const headers = ['เลขที่','วันที่','รหัสสินค้า','ประเภท','ประเภทย่อย','จำนวน','Lot ID','หมายเหตุ','ผู้ดำเนินการ'];
        const rows = filtered.map(m => [
          m.movementId, m.date, m.productId, m.type, m.subType,
          m.quantity, m.lotId, m.notes, m.createdBy
        ]);
        const csvContent = [headers, ...rows].map(r => r.map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(',')).join('\n');
        const bom = '\uFEFF';
        const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `stock_movements_${new Date().toISOString().slice(0,10)}.csv`;
        a.click(); URL.revokeObjectURL(url);
        showToast('Export CSV สำเร็จ', 'success');
      };

      const handleRefresh = () => {
        setIsLoading(true);
        supabaseSelect('stk_stock_movements')
          .then(res => {
            setIsLoading(false);
            if (Array.isArray(res)) {
              const formatted = res.map(m => ({
                ...m,
                movementId: m.movement_id || m.movementId || '',
                productId: m.product_id || m.productId || '',
                type: m.type || '',
                subType: m.sub_type || m.subType || '',
                quantity: Number(m.quantity || 0),
                lotId: m.lot_id || m.lotId || '',
                notes: m.notes || '',
                createdBy: m.created_by || m.createdBy || '',
                date: m.date || m.created_at || ''
              }));
              setStockMovements(formatted);
            } else {
              setStockMovements([]);
            }
            showToast('โหลดข้อมูลใหม่แล้ว', 'success');
          })
          .catch(() => { setIsLoading(false); showToast('โหลดข้อมูลล้มเหลว', 'error'); });
      };

      const filterBtnClass = (active) =>
        `px-4 py-1.5 rounded-xl text-xs font-bold border transition-all ${active ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}`;

      return (
        <div className="space-y-5">
          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 flex flex-col lg:flex-row gap-3 items-start lg:items-end">
            <div className="flex-1 grid grid-cols-2 sm:grid-cols-4 gap-3">
              <div>
                <label className={labelClassHud}>ประเภท</label>
                <div className="flex gap-1.5 flex-wrap">
                  {[['ALL','ทั้งหมด'],['IN','รับเข้า'],['OUT','เบิกออก']].map(([v,l]) => (
                    <button key={v} onClick={() => setFilterType(v)} className={filterBtnClass(filterType === v)}>{l}</button>
                  ))}
                </div>
              </div>
              <div>
                <label className={labelClassHud}>สินค้า</label>
                <select className={inputClassHud + " !py-1.5 text-xs"} value={filterProduct} onChange={e => setFilterProduct(e.target.value)}>
                  <option value="">-ทุกสินค้า-</option>
                  {(products || []).map(p => <option key={p.id} value={p.id}>{p.id} - {p.name}</option>)}
                </select>
              </div>
              <div>
                <label className={labelClassHud}>จากวันที่</label>
                <input type="date" className={inputClassHud + " !py-1.5 text-xs"} value={dateFrom} onChange={e => setDateFrom(e.target.value)}/>
              </div>
              <div>
                <label className={labelClassHud}>ถึงวันที่</label>
                <input type="date" className={inputClassHud + " !py-1.5 text-xs"} value={dateTo} onChange={e => setDateTo(e.target.value)}/>
              </div>
            </div>
            <div className="flex gap-2 shrink-0">
              <button onClick={handleRefresh} disabled={isLoading} className={btnClassSecondary + " flex items-center gap-1.5 !py-2 !px-3 text-xs"}>
                <RefreshCw size={14} className={isLoading ? 'animate-spin' : ''}/> รีเฟรช
              </button>
              <button onClick={handleExportCSV} className={btnClassPrimary + " flex items-center gap-1.5 !py-2 !px-3 text-xs bg-emerald-600 border-emerald-600 hover:bg-emerald-700"}>
                <FileDown size={14}/> Export CSV
              </button>
            </div>
          </div>

          <div className="flex gap-4 text-xs font-bold text-slate-500">
            <span>ทั้งหมด: <span className="text-slate-800">{filtered.length}</span> รายการ</span>
            <span>รับเข้านำเข้าสะสมรวม: <span className="text-emerald-600">+{filtered.filter(m=>m.type==='IN').reduce((a,m)=>a+m.quantity,0)}</span></span>
            <span>เบิกออกรวม: <span className="text-red-600">-{filtered.filter(m=>m.type==='OUT').reduce((a,m)=>a+m.quantity,0)}</span></span>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-xs">
                <thead>
                  <tr className="bg-slate-800 text-white">
                    <th className="text-left py-3 px-4 font-black uppercase tracking-wide">เลขที่</th>
                    <th className="text-left py-3 px-4 font-black uppercase tracking-wide">วันที่</th>
                    <th className="text-left py-3 px-4 font-black uppercase tracking-wide">สินค้า</th>
                    <th className="text-center py-3 px-4 font-black uppercase tracking-wide">ประเภท</th>
                    <th className="text-center py-3 px-4 font-black uppercase tracking-wide">ประเภทย่อย</th>
                    <th className="text-right py-3 px-4 font-black uppercase tracking-wide">จำนวน</th>
                    <th className="text-left py-3 px-4 font-black uppercase tracking-wide">Lot/Ref</th>
                    <th className="text-left py-3 px-4 font-black uppercase tracking-wide">หมายเหตุ</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {filtered.length === 0 && (
                    <tr><td colSpan={9} className="py-12 text-center text-slate-400 font-bold">ไม่พบรายการที่ตรงกับเงื่อนไข</td></tr>
                  )}
                  {filtered.map(m => (
                    <tr key={m.movementId} className={`hover:bg-slate-50 transition-colors ${m.type === 'IN' ? 'border-l-2 border-l-emerald-400' : 'border-l-2 border-l-red-400'}`}>
                      <td className="py-2.5 px-4 font-mono text-[10px] text-slate-500">{m.movementId}</td>
                      <td className="py-2.5 px-4 text-slate-600">{m.date ? String(m.date).substring(0,10) : '-'}</td>
                      <td className="py-2.5 px-4 font-bold text-slate-700">{m.productId}</td>
                      <td className="py-2.5 px-4 text-center">
                        <span className={`px-2.5 py-0.5 rounded-full font-black ${m.type === 'IN' ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>
                          {m.type === 'IN' ? '📥 IN' : '📤 OUT'}
                        </span>
                      </td>
                      <td className="py-2.5 px-4 text-center">
                        <span className={`px-2 py-0.5 rounded-full text-[9px] font-black ${m.subType === 'รับสินค้า' ? 'bg-emerald-100 text-emerald-700' : m.subType === 'เบิกชำรุด' ? 'bg-red-100 text-red-700' : m.subType === 'เบิกภายใน' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>
                          {m.subType}
                        </span>
                      </td>
                      <td className={`py-2.5 px-4 text-right font-black ${m.type === 'IN' ? 'text-emerald-700' : 'text-red-700'}`}>
                        {m.type === 'IN' ? '+' : '-'}{m.quantity}
                      </td>
                      <td className="py-2.5 px-4 font-mono text-[10px] text-slate-400">{m.lotId || '-'}</td>
                      <td className="py-2.5 px-4 text-slate-500 max-w-[150px] truncate">{m.notes || '-'}</td>
                      <td className="py-2.5 px-4 text-slate-400 text-[10px]">{m.createdBy || '-'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    const Package = ({size=20, className=''}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>;
    const AlertTriangle = ({size=20, className=''}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>;
    const AlertCircle = ({size=20, className=''}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12.01" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;
    const Minus = ({size=20, className=''}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/></svg>;
    const Clock = ({size=20, className=''}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>;
    const RefreshCw = ({size=20, className=''}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>;
    const FileDown = ({size=20, className=''}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></svg>;

    const ProductsManagementView = ({ products, setProducts, isAdmin, showToast, systemSettings, setSystemSettings, productCategories, setProductCategories }) => {
        const [showForm, setShowForm] = useState(false);
        const [isEditing, setIsEditing] = useState(false);
        const [isSubmitting, setIsSubmitting] = useState(false);
        const [searchTerm, setSearchTerm] = useState(''); 
        const [confirmDelete, setConfirmDelete] = useState({ show: false, id: null, title: '' });
        
        const maxLevels = Number(systemSettings?.commission_levels || 6);

        const getInitialFormState = () => {
          const init = { id: '', name: '', barcode: '', status: 'เข้าใช้งาน', category: '', description: '', imageUrl: '', stock: 0, priceFull: 0, priceMember: 0, pricePromo: 0, givePv: 0, minPvComm: 0, fullMarginAmount: 0, fullMarginCurrency: 'LAK' ,
            isBundle: false, 
            baseProduct: '', 
            bundleQty: 1
          };
          init.selfFee = 0;
          for (let i = 1; i < maxLevels; i++) {
            init[`level${i}Fee`] = 0;
          }
          init.selfPercentFull = 0;
          init.selfPercentMember = 0;
          for (let i = 1; i < maxLevels; i++) {
            init[`level${i}PercentFull`] = 0;
            init[`level${i}PercentMember`] = 0;
          }
          return init;
        };

        const [formData, setFormData] = useState(getInitialFormState);
        const [isAddingNewCategory, setIsAddingNewCategory] = useState(false);
        const [newCategoryVal, setNewCategoryVal] = useState('');
        const [newCategoryMode, setNewCategoryMode] = useState('จ่ายตามกล่อง');

        const defaultImg = "https://ui-avatars.com/api/?name=" + encodeURIComponent("Product") + "&background=3b82f6&color=ffffff&rounded=true&bold=true";

        const handleOpenAdd = () => {
          setIsEditing(false); 
          let nextIdNum = 1;
          setIsAddingNewCategory(false); 
          setNewCategoryVal('');
          setNewCategoryMode('จ่ายตามกล่อง');
          
          const pIds = (products || []).map(p => { 
            const match = p && p.id && p.id.match(/^P(\d+)$/i); 
            return match ? parseInt(match[1], 10) : 0; 
          });
          if (pIds.length > 0) nextIdNum = Math.max(0, ...pIds) + 1;
          
          const init = getInitialFormState();
          init.id = "P" + nextIdNum.toString().padStart(3, '0');
          setFormData(init);
          setShowForm(true);
        };

        const handleOpenEdit = (product) => { 
            setIsEditing(true); 
            setIsAddingNewCategory(false); 
            setNewCategoryVal('');
            
            const data = { 
                ...product, 
                minPvComm: product.minPvComm || 0,
                givePv: product.givePv || 0,
                fullMarginAmount: product.fullMarginAmount || 0,
                fullMarginCurrency: product.fullMarginCurrency || 'LAK',
                isBundle: product.isBundle || false,
                baseProduct: product.baseProduct || '',
                bundleQty: product.bundleQty || 1
            };
            data.selfFee = product.selfFee || 0;
            for (let i = 1; i < maxLevels; i++) {
              data[`level${i}Fee`] = product[`level${i}Fee`] !== undefined ? product[`level${i}Fee`] : (i === 1 ? product.directFee : (i === 2 ? product.uplineFee : 0));
            }
            data.selfPercentFull = product.selfPercentFull || 0;
            data.selfPercentMember = product.selfPercentMember || 0;
            for (let i = 1; i < maxLevels; i++) {
              data[`level${i}PercentFull`] = product[`level${i}PercentFull`] || 0;
              data[`level${i}PercentMember`] = product[`level${i}PercentMember`] || 0;
            }
            setFormData(data);
            setShowForm(true);
        };

        const handleSaveProduct = (e) => {
            e.preventDefault();
            if (formData.name.trim() === '') { showToast('กรุณาระบุชื่อสินค้า', 'error'); return; }
            setIsSubmitting(true);

            const saveProductCore = (catName) => {
                const dataToSave = {
                   ...formData,
                   category: catName,
                   stock: Number(formData.stock || 0),
                   barcode: String(formData.barcode || '').trim(),
                   priceFull: Number(formData.priceFull || 0),
                   priceMember: Number(formData.priceMember || 0),
                   pricePromo: Number(formData.pricePromo || 0),
                   givePv: Number(formData.givePv || 0),
                   minPvComm: Number(formData.minPvComm || 0),
                   selfFee: Number(formData.selfFee || 0),
                   isBundle: Boolean(formData.isBundle),
                   baseProduct: formData.baseProduct || '',
                   bundleQty: Number(formData.bundleQty || 1)
                };
                for (let i = 1; i < maxLevels; i++) {
                  dataToSave[`level${i}Fee`] = Number(formData[`level${i}Fee`] || 0);
                }
                dataToSave.selfPercentFull = Number(formData.selfPercentFull || 0);
                dataToSave.selfPercentMember = Number(formData.selfPercentMember || 0);
                for (let i = 1; i < maxLevels; i++) {
                  dataToSave[`level${i}PercentFull`] = Number(formData[`level${i}PercentFull`] || 0);
                  dataToSave[`level${i}PercentMember`] = Number(formData[`level${i}PercentMember`] || 0);
                }

                dataToSave.directFee = dataToSave.level1Fee;
                dataToSave.uplineFee = dataToSave.level2Fee;

                if (window.SUPABASE_REST_URL) {
                   const supaData = {
                       product_id: dataToSave.id,
                       name: dataToSave.name,
                       category: dataToSave.category,
                       status: dataToSave.status,
                       barcode: dataToSave.barcode,
                       price_full: dataToSave.priceFull,
                       price_member: dataToSave.priceMember,
                       price_promo: dataToSave.pricePromo,
                       current_stock: dataToSave.stock,
                       give_pv: dataToSave.givePv,
                       min_pv_comm: dataToSave.minPvComm,
                       self_fee: dataToSave.selfFee,
                       self_percent_full: dataToSave.selfPercentFull,
                       self_percent_member: dataToSave.selfPercentMember,
                       image_url: dataToSave.imageUrl || '',
                       is_bundle: dataToSave.isBundle,
                       base_product: dataToSave.baseProduct,
                       bundle_qty: dataToSave.bundleQty,
                       full_margin_amount: dataToSave.fullMarginAmount,
                       full_margin_currency: dataToSave.fullMarginCurrency
                   };
                   for (let i = 1; i < maxLevels; i++) {
                       supaData[`level_${i}_fee`] = dataToSave[`level${i}Fee`];
                       supaData[`level_${i}_percent_full`] = dataToSave[`level${i}PercentFull`];
                       supaData[`level_${i}_percent_member`] = dataToSave[`level${i}PercentMember`];
                   }
                   
                    const req = isEditing 
                        ? supabaseUpdate('stk_products', dataToSave.id, supaData, 'product_id')
                       : supabaseInsert('stk_products', supaData);
                       
                   req.then(async () => {
                        if (isEditing) {
                            setProducts((products || []).map(p => p && safeUpper(p.id) === safeUpper(dataToSave.id) ? dataToSave : p));
                        } else {
                            setProducts([...(products || []), dataToSave]);
                        }
                        try { localStorage.removeItem('stk_app_cache_data'); localStorage.removeItem('stk_app_cache_time'); } catch(e){}
                        setShowForm(false); setIsSubmitting(false); showToast(isEditing ? 'แก้ไขสินค้าสำเร็จ' : 'เพิ่มสินค้าสำเร็จ', 'success');
                    }).catch(err => {
                         setIsSubmitting(false); showToast('ข้อผิดพลาด Supabase: ' + err.message, 'error');
                    });
                }
            };

            if (isAddingNewCategory && newCategoryVal.trim() !== '') {
                const catName = newCategoryVal.trim();
                const newCatId = 'CAT' + Math.floor(Math.random()*10000);
                const mockCat = { id: newCatId, name: catName, status: 'เข้าใช้งาน', commissionMode: newCategoryMode };
                const supaCat = { category_id: newCatId, name: catName, status: 'เข้าใช้งาน', commission_mode: newCategoryMode };
                supabaseInsert('stk_product_categories', supaCat).then(() => {
                    setProductCategories(prev => [...prev, mockCat]);
                    saveProductCore(catName);
                }).catch(err => {
                    setIsSubmitting(false); showToast('ข้อผิดพลาด Supabase: ' + err.message, 'error');
                });
            } else {
                saveProductCore(formData.category);
            }
         };
         
         const executeDelete = () => { 
             const id = confirmDelete.id;
             supabaseDelete('stk_products', id, 'product_id').then(() => {
                setProducts((products || []).filter(p => p && p.id !== id)); 
                try { localStorage.removeItem('stk_app_cache_data'); localStorage.removeItem('stk_app_cache_time'); } catch(e){}
                showToast('ลบสำเร็จ', 'success');
             }).catch(err => {
                showToast('ข้อผิดพลาด Supabase: ' + err.message, 'error');
             });
         };
 
         const filteredProducts = (products || [])
             .filter(p => !p.isBundle) 
             .filter(p => (p.id && p.id.toLowerCase().includes(searchTerm.toLowerCase())) || (p.name && p.name.toLowerCase().includes(searchTerm.toLowerCase())));
         
         const renderNumberInput = (label, valueKey, colorKey) => {
             const isPercent = valueKey.toLowerCase().includes("percent");
             return (
                 <div key={valueKey} className={`bg-${colorKey}-50 p-3 rounded-xl border border-${colorKey}-100`}>
                     <label className={`${labelClassHud} text-${colorKey}-800`}>{label}</label>
                     <input 
                         type="text" 
                         className={`${inputClassHud} border-${colorKey}-200 focus:border-${colorKey}-500 font-bold text-${colorKey}-700`} 
                         value={formData[valueKey] !== undefined && formData[valueKey] !== null ? (isPercent ? formData[valueKey] : Number(formData[valueKey]).toLocaleString()) : ''} 
                         onChange={e => {
                             if (isPercent) {
                                 const rawValue = e.target.value.replace(/[^0-9.]/g, '');
                                 const dots = rawValue.split('.').length - 1;
                                 if (dots <= 1) {
                                     setFormData({...formData, [valueKey]: rawValue});
                                 }
                             } else {
                                 const rawValue = e.target.value.replace(/,/g, '').replace(/[^0-9]/g, '');
                                 setFormData({...formData, [valueKey]: rawValue ? Number(rawValue) : 0});
                             }
                         }}
                         placeholder="0"
                     />
                 </div>
             );
         };
 
         return (
           <div className="space-y-6 animation-fade-in relative w-full">
             <ConfirmModal isOpen={confirmDelete.show} onClose={() => setConfirmDelete({show: false, id: null, title: ''})} onConfirm={executeDelete} title="ยืนยันการลบสินค้า" message={`คุณต้องการลบสินค้า "${confirmDelete.title}" ใช่หรือไม่?`} />

                    <div className="pt-4 border-t border-slate-100 bg-amber-50/60 p-4 rounded-2xl border border-amber-200">

    const BundlesManagementView = ({ products, setProducts, isAdmin, showToast, systemSettings, setSystemSettings, productCategories }) => {
        const [showForm, setShowForm] = useState(false);
        const [isEditing, setIsEditing] = useState(false);
        const [isSubmitting, setIsSubmitting] = useState(false);
        const [searchTerm, setSearchTerm] = useState(''); 
        const [confirmDelete, setConfirmDelete] = useState({ show: false, id: null, title: '' });
        
        const maxLevels = Number(systemSettings?.commission_levels || 6);

        const getInitialFormState = () => {
          const init = { id: '', name: '', status: 'เข้าใช้งาน', category: 'Promotion', description: '', imageUrl: '', stock: 99999, priceFull: 0, priceMember: 0, pricePromo: 0, givePv: 0, minPvComm: 0, fullMarginAmount: 0, fullMarginCurrency: 'LAK', isBundle: true, baseProduct: '', bundleQty: 1 };
          init.selfFee = 0;
          for (let i = 1; i < maxLevels; i++) init[`level${i}Fee`] = 0;
          init.selfPercentFull = 0; init.selfPercentMember = 0;
          for (let i = 1; i < maxLevels; i++) { init[`level${i}PercentFull`] = 0; init[`level${i}PercentMember`] = 0; }
          return init;
        };

        const [formData, setFormData] = useState(getInitialFormState);

        const handleOpenAdd = () => {
          setIsEditing(false); 
          let nextIdNum = 1;
          const pIds = (products || []).map(p => { 
            const match = p && p.id && p.id.match(/^PRO(\d+)$/i); 
            return match ? parseInt(match[1], 10) : 0; 
          });
          if (pIds.length > 0) nextIdNum = Math.max(0, ...pIds) + 1;
          
          const init = getInitialFormState();
          init.id = "PRO" + nextIdNum.toString().padStart(3, '0');
          setFormData(init);
          setShowForm(true);
        };

        const handleOpenEdit = (product) => { 
            setIsEditing(true); 
            const data = { 
                ...product, 
                minPvComm: product.minPvComm || 0, 
                givePv: product.givePv || 0, 
                fullMarginAmount: product.fullMarginAmount || 0, 
                fullMarginCurrency: product.fullMarginCurrency || 'LAK', 
                isBundle: true, 
                baseProduct: product.baseProduct || '', 
                bundleQty: product.bundleQty || 1, 
                stock: 99999
            };
            data.selfFee = product.selfFee || 0;

        const handleSaveProduct = (e) => {

            const dataToSave = {
               ...formData, stock: 99999, barcode: '', category: formData.category || 'Promotion',
               priceFull: Number(formData.priceFull || 0), priceMember: Number(formData.priceMember || 0), pricePromo: Number(formData.pricePromo || 0), givePv: Number(formData.givePv || 0), minPvComm: Number(formData.minPvComm || 0), selfFee: Number(formData.selfFee || 0), isBundle: true, baseProduct: formData.baseProduct, bundleQty: Number(formData.bundleQty || 1)
            };
            for (let i = 1; i < maxLevels; i++) dataToSave[`level${i}Fee`] = Number(formData[`level${i}Fee`] || 0);
            dataToSave.selfPercentFull = Number(formData.selfPercentFull || 0); dataToSave.selfPercentMember = Number(formData.selfPercentMember || 0);
            for (let i = 1; i < maxLevels; i++) { dataToSave[`level${i}PercentFull`] = Number(formData[`level${i}PercentFull`] || 0); dataToSave[`level${i}PercentMember`] = Number(formData[`level${i}PercentMember`] || 0); }
            dataToSave.directFee = dataToSave.level1Fee; dataToSave.uplineFee = dataToSave.level2Fee;

            if (window.SUPABASE_REST_URL) {
               const supaData = {
                   product_id: dataToSave.id, name: dataToSave.name, category: dataToSave.category, status: dataToSave.status, barcode: '', price_full: dataToSave.priceFull, price_member: dataToSave.priceMember, price_promo: dataToSave.pricePromo, current_stock: dataToSave.stock, give_pv: dataToSave.givePv, min_pv_comm: dataToSave.minPvComm, self_fee: dataToSave.selfFee, self_percent_full: dataToSave.selfPercentFull, self_percent_member: dataToSave.selfPercentMember, image_url: dataToSave.imageUrl || '', is_bundle: true, base_product: dataToSave.baseProduct, bundle_qty: dataToSave.bundleQty,
                   full_margin_amount: dataToSave.fullMarginAmount,
                   full_margin_currency: dataToSave.fullMarginCurrency
               };
               for (let i = 1; i < maxLevels; i++) { supaData[`level_${i}_fee`] = dataToSave[`level${i}Fee`]; supaData[`level_${i}_percent_full`] = dataToSave[`level${i}PercentFull`]; supaData[`level_${i}_percent_member`] = dataToSave[`level${i}PercentMember`]; }
               
               const req = isEditing ? supabaseUpdate('stk_products', dataToSave.id, supaData, 'product_id') : supabaseInsert('stk_products', supaData);
                   
               req.then(async () => {
                    if (isEditing) setProducts((products || []).map(p => p && safeUpper(p.id) === safeUpper(dataToSave.id) ? dataToSave : p));
                    else setProducts([...(products || []), dataToSave]);

                }).catch(err => { setIsSubmitting(false); showToast('ข้อผิดพลาด: ' + err.message, 'error'); });
            }
        };
        const executeDelete = () => { 
             supabaseDelete('stk_products', confirmDelete.id, 'product_id').then(() => { 
                 setProducts((products || []).filter(p => p && p.id !== confirmDelete.id)); 
                 try { localStorage.removeItem('stk_app_cache_data'); localStorage.removeItem('stk_app_cache_time'); } catch(e){}
                 showToast('ลบสำเร็จ', 'success'); 
             }).catch(err => { showToast('ข้อผิดพลาด Supabase: ' + err.message, 'error'); });
         };
         const filteredBundles = (products || []).filter(p => p.isBundle).filter(p => (p.id && p.id.toLowerCase().includes(searchTerm.toLowerCase())) || (p.name && p.name.toLowerCase().includes(searchTerm.toLowerCase())));
         const renderNumberInput = (label, valueKey, colorKey) => {
             const isPercent = valueKey.toLowerCase().includes("percent");
             return (
                 <div key={valueKey} className={`bg-${colorKey}-50 p-3 rounded-xl border border-${colorKey}-100`}>
                     <label className={`${labelClassHud} text-${colorKey}-800`}>{label}</label>
                     <input type="text" className={`${inputClassHud} border-${colorKey}-200 focus:border-${colorKey}-500 font-bold text-${colorKey}-700`} value={formData[valueKey] !== undefined && formData[valueKey] !== null ? (isPercent ? formData[valueKey] : Number(formData[valueKey]).toLocaleString()) : ''} onChange={e => {
                             if (isPercent) { const raw = e.target.value.replace(/[^0-9.]/g, ''); if (raw.split('.').length - 1 <= 1) setFormData({...formData, [valueKey]: raw}); } 
                             else { const raw = e.target.value.replace(/,/g, '').replace(/[^0-9]/g, ''); setFormData({...formData, [valueKey]: raw ? Number(raw) : 0}); }
                         }} placeholder="0" />

         };
         return (

             <ConfirmModal isOpen={confirmDelete.show} onClose={() => setConfirmDelete({show: false, id: null, title: ''})} onConfirm={executeDelete} title="ยืนยันการลบโปรโมชั่น" message={`คุณต้องการลบเซ็ตโปรโมชั่น "${confirmDelete.title}" ใช่หรือไม่?`} />
              <EditModal isOpen={showForm} onClose={() => setShowForm(false)} title={isEditing ? 'แก้ไขเซ็ตโปรโมชั่น' : 'เพิ่มเซ็ตโปรโมชั่นใหม่'} icon={PackageIcon} maxWidthClass="max-w-4xl">
                  <form onSubmit={handleSaveProduct} className="space-y-6">
                    <div className="bg-indigo-50 p-4 rounded-xl border border-indigo-200 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label className={`${labelClassHud} text-indigo-700`}>รหัสเซ็ตโปรโมชั่น</label>
                            <input type="text" disabled className={`${inputClassHud} border-indigo-200 text-indigo-700 bg-white`} value={formData.id} />
                        </div>
                        <div>
                            <label className={`${labelClassHud} text-indigo-700`}>ชื่อเซ็ตโปรโมชั่น *</label>
                            <input type="text" required className={`${inputClassHud} border-indigo-200 focus:border-indigo-500`} value={formData.name} onChange={e=>setFormData({...formData,name:e.target.value})} placeholder="เช่น โปร SESAMIN 3 กล่อง" />
                        </div>
                        <div>
                            <label className={`${labelClassHud} text-indigo-700`}>ตัดสต๊อกจากสินค้าหลักใด? *</label>

                                <option value="">-- เลือกสินค้าหลักที่จะนำมาตัดสต๊อก --</option>

                                    <option key={p.id} value={p.name}>{p.name}</option>
