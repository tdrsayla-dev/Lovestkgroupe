             <div className={`${boxWrapper} p-0 overflow-hidden`}>
                 <div className="overflow-x-auto">
                     <table className="w-full text-left min-w-[1300px]">
                         <thead>
                             <tr>
                                 <th className={tableHeaderClass}>รหัส</th>
                                 <th className={tableHeaderClass}>รูปภาพ</th>
                                 <th className={tableHeaderClass}>ชื่อสินค้า</th>
                                 <th className={tableHeaderClass}>รายละเอียด</th>
                                 <th className={tableHeaderClass}>หมวดหมู่</th>
                                 <th className={`${tableHeaderClass} text-right`}>ราคาเต็ม</th>
                                 <th className={`${tableHeaderClass} text-right`}>ราคาสมาชิก</th>
                                 <th className={`${tableHeaderClass} text-right`}>ราคาโปร</th>
                                 <th className={`${tableHeaderClass} text-right`}>PV</th>
                                 <th className={`${tableHeaderClass} text-indigo-700`}>ค่าแนะนำสินค้า (Commission Rates)</th>
                                 <th className={tableHeaderClass}>สถานะ</th>
                                 <th className={`${tableHeaderClass} text-center`}>จัดการ</th>
                             </tr>
                         </thead>
                         <tbody>
                         {filteredProducts.map(p=>(
                             <tr key={p?.id || Math.random()} className="hover:bg-blue-50/50 transition-colors">
                                 <td className={tableCellClass}>{p?.id}</td>
                                 <td className={tableCellClass}>
                                     <img src={p?.imageUrl || defaultImg} className="w-10 h-10 object-cover rounded-xl border border-slate-200 shadow-sm bg-slate-50" onError={e=>e.target.src=defaultImg} />
                                 </td>
                                 <td className={`${tableCellClass} text-blue-700 font-bold`}>{p?.name}</td>
                                 <td className={tableCellClass}>
                                     <div className="max-w-[200px] text-xs text-slate-500 font-medium line-clamp-2" title={p?.description || ''}>
                                         {p?.description || '-'}
                                     </div>
                                 </td>
                                 <td className={tableCellClass}>{p?.category || '-'}</td>
                                 <td className={`${tableCellClass} text-right font-bold text-slate-700`}>{Number(p?.priceFull || 0).toLocaleString()}</td>
                                 <td className={`${tableCellClass} text-right font-bold text-slate-700`}>{Number(p?.priceMember || 0).toLocaleString()}</td>
                                 <td className={`${tableCellClass} text-right font-bold text-slate-700`}>{Number(p?.pricePromo || 0).toLocaleString()}</td>
                                 <td className={`${tableCellClass} text-right font-bold text-amber-700`}>{Number(p?.givePv || 0).toLocaleString()}</td>
                                 <td className={tableCellClass}>
                                     {(() => {
                                          const catObj = productCategories.find(c => c && c.name && c.name.trim().toLowerCase() === String(p?.category || '').trim().toLowerCase());
                                         const isPct = catObj?.commissionMode === 'เปอร์เซ็นต์';
                                         
                                         if (isPct) {
                                           return (
                                             <div className="text-[11px] space-y-0.5">
                                               <div className="font-semibold text-indigo-600">ราคาเต็ม: {p?.selfPercentFull || 0}% &rarr; {p?.level1PercentFull || 0}% &rarr; {p?.level2PercentFull || 0}% ...</div>
                                               <div className="font-medium text-fuchsia-600">สมาชิก: {p?.selfPercentMember || 0}% &rarr; {p?.level1PercentMember || 0}% &rarr; {p?.level2PercentMember || 0}% ...</div>
                                             </div>
                                           );
                                         } else {
                                           return (
                                             <div className="text-[11px] font-bold text-emerald-600">
                                               กล่อง: {Number(p?.selfFee || 0).toLocaleString()} &rarr; {Number(p?.level1Fee || p?.directFee || 0).toLocaleString()} &rarr; {Number(p?.level2Fee || p?.uplineFee || 0).toLocaleString()} ...
                                             </div>
                                           );
                                         }
                                     })()}
                                 </td>
                                 <td className={tableCellClass}><span className="text-[11px] font-bold px-3 py-1.5 bg-slate-100 border border-slate-200 text-slate-600 rounded-lg">{p?.status}</span></td>
                                 <td className={`${tableCellClass} text-center whitespace-nowrap`}><button onClick={()=>handleOpenEdit(p)} className="text-blue-500 hover:text-blue-700 mx-1 transition-colors bg-white p-1.5 rounded-lg border border-slate-200 shadow-sm"><Edit size={16}/></button>{isAdmin && <button onClick={()=>setConfirmDelete({show: true, id: p.id, title: p.name})} className="text-red-500 hover:text-red-700 transition-colors bg-white p-1.5 rounded-lg border border-slate-200 shadow-sm"><Trash2 size={16}/></button>}</td>
                             </tr>
                         ))}
                         {filteredProducts.length === 0 && <tr><td colSpan="12" className="p-10 text-center text-slate-500 font-bold bg-slate-50/50">ไม่พบข้อมูลที่ค้นหา</td></tr>}
                         </tbody>
                     </table>
                 </div>
             </div>
           </div>
         );
    };

    // ── Main View ──
    // ==========================================
    // 📌 Categories Management View Component (📁 Manage Categories Tab)
    // ==========================================
    const CategoriesManagementView = ({ productCategories, setProductCategories, showToast }) => {
      const [editingId, setEditingId] = useState(null);
      const [editName, setEditName] = useState('');
      const [editMode, setEditMode] = useState('ข้างกล่อง');
      
      const [newName, setNewName] = useState('');
      const [newMode, setNewMode] = useState('ข้างกล่อง');
      const [confirmDelete, setConfirmDelete] = useState({ show: false, id: null, name: '' });
      const [isSubmitting, setIsSubmitting] = useState(false);

      const handleStartEdit = (cat) => {
        setEditingId(cat.id);
        setEditName(cat.name);
        setEditMode(cat.commissionMode || 'ข้างกล่อง');
      };

      const handleSave = (catId) => {
        if (!editName.trim()) { showToast('กรุณาระบุชื่อหมวดหมู่', 'error'); return; }
        setIsSubmitting(true);
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler(() => {
              setProductCategories(prev => prev.map(c => c.id === catId ? { ...c, name: editName.trim(), commissionMode: editMode } : c));
              setEditingId(null);
              setIsSubmitting(false);
              showToast('แก้ไขหมวดหมู่สำเร็จ', 'success');
            })
            .withFailureHandler(err => {
              setIsSubmitting(false);
              showToast('แก้ไขล้มเหลว: ' + err, 'error');
            })
            .updateProductCategory(catId, editName.trim(), editMode);
        } else {
          setProductCategories(prev => prev.map(c => c.id === catId ? { ...c, name: editName.trim(), commissionMode: editMode } : c));
          setEditingId(null);
          setIsSubmitting(false);
          showToast('จำลองแก้ไขหมวดหมู่สำเร็จ', 'success');
        }
      };

      const handleAddCategory = (e) => {
        e.preventDefault();
        if (!newName.trim()) { showToast('กรุณาระบุชื่อหมวดหมู่', 'error'); return; }
        setIsSubmitting(true);
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler((resJson) => {
              if (resJson && !resJson.startsWith("error")) {
                try {
                  const newCat = JSON.parse(resJson);
                  setProductCategories(prev => [...prev, newCat]);
                  setNewName('');
                  setNewMode('ข้างกล่อง');
                  showToast('เพิ่มหมวดหมู่สำเร็จ', 'success');
                } catch(err) {
                  showToast('เกิดข้อผิดพลาดในการรับข้อมูลหมวดหมู่', 'error');
                }
              } else {
                showToast('เพิ่มล้มเหลว: ' + resJson, 'error');
              }
              setIsSubmitting(false);
            })
            .withFailureHandler(err => {
              setIsSubmitting(false);
              showToast('เพิ่มล้มเหลว: ' + err, 'error');
            })
            .saveProductCategory(newName.trim(), newMode);
        } else {
          const mockId = 'CAT' + Math.floor(Math.random() * 1000);
          const newCat = { id: mockId, name: newName.trim(), status: 'ใช้งาน', commissionMode: newMode };
          setProductCategories(prev => [...prev, newCat]);
          setNewName('');
          setNewMode('ข้างกล่อง');
          setIsSubmitting(false);
          showToast('จำลองเพิ่มหมวดหมู่สำเร็จ', 'success');
        }
      };

      const handleDeleteCategory = (catId) => {
        setIsSubmitting(true);
        if (typeof google !== 'undefined' && google.script) {
          google.script.run
            .withSuccessHandler(() => {
              setProductCategories(prev => prev.filter(c => c.id !== catId));
              setConfirmDelete({ show: false, id: null, name: '' });
              setIsSubmitting(false);
              showToast('ลบหมวดหมู่สำเร็จ', 'success');
            })
            .withFailureHandler(err => {
              setIsSubmitting(false);
              showToast('ลบล้มเหลว: ' + err, 'error');
            })
            .deleteProductCategory(catId);
        } else {
          setProductCategories(prev => prev.filter(c => c.id !== catId));
          setConfirmDelete({ show: false, id: null, name: '' });
          setIsSubmitting(false);
          showToast('จำลองลบหมวดหมู่สำเร็จ', 'success');
        }
      };

      return (
        <div className="space-y-6 animation-fade-in">
          <ConfirmModal 
            isOpen={confirmDelete.show} 
            onClose={() => setConfirmDelete({ show: false, id: null, name: '' })} 
            onConfirm={() => handleDeleteCategory(confirmDelete.id)} 
            title="ยืนยันการลบหมวดหมู่สินค้า" 
            message={`คุณต้องการลบหมวดหมู่สินค้า "${confirmDelete.name}" ใช่หรือไม่? (สินค้าที่ใช้หมวดหมู่นี้จะไม่ถูกลบ แต่อัตราคอมมิชชันอาจใช้ค่าเริ่มต้นข้างกล่อง)`} 
          />

          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-2xl font-bold text-slate-800 font-sans">จัดการหมวดหมู่สินค้า (Product Categories)</h2>
              <p className="text-sm text-slate-500 mt-1">กำหนดประเภทการคิดคอมมิชชัน (ข้างกล่อง / เปอร์เซ็นต์) ของแต่ละหมวดหมู่</p>
            </div>
          </div>

          {/* Form to Add New Category */}
          <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200/80 space-y-4">
            <h3 className="text-md font-bold text-slate-800 flex items-center gap-2">➕ เพิ่มหมวดหมู่สินค้าใหม่</h3>
            <form onSubmit={handleAddCategory} className="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
              <div>
                <label className="text-[11px] font-bold text-slate-600 block mb-1.5">ชื่อหมวดหมู่สินค้า</label>
                <input 
                  type="text" 
                  className={inputClassHud} 
                  value={newName} 
                  onChange={e => setNewName(e.target.value)} 
                  placeholder="เช่น สมุนไพร, เครื่องสำอาง..." 
                />
              </div>
              <div>
                <label className="text-[11px] font-bold text-slate-600 block mb-1.5">รูปแบบการคิดคอมมิชชันค่าแนะนำ</label>
                <select 
                  className={inputClassHud} 
                  value={newMode} 
                  onChange={e => setNewMode(e.target.value)}
                >
                  <option value="ข้างกล่อง">จ่ายข้างกล่อง (Fixed Box)</option>
                  <option value="เปอร์เซ็นต์">จ่ายเปอร์เซ็นต์ (% of Price)</option>
                </select>
              </div>
              <button 
                type="submit" 
                disabled={isSubmitting} 
                className={`${btnClassPrimary} h-[40px] justify-center`}
              >
                {isSubmitting ? 'กำลังบันทึก...' : 'เพิ่มหมวดหมู่ใหม่'}
              </button>
            </form>
          </div>

          <div className={`${boxWrapper} p-0 overflow-hidden`}>
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-slate-800 text-white">
                    <th className="py-3 px-4 font-black uppercase text-[12px] tracking-wide w-28">รหัส</th>
                    <th className="py-3 px-4 font-black uppercase text-[12px] tracking-wide">ชื่อหมวดหมู่</th>
                    <th className="py-3 px-4 font-black uppercase text-[12px] tracking-wide w-64">ประเภทคอมมิชชัน</th>
                    <th className="py-3 px-4 font-black uppercase text-[12px] tracking-wide text-center w-40">จัดการ</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {productCategories.map(cat => (
                    <tr key={cat.id} className="hover:bg-slate-50 transition-colors">
                      <td className="py-3 px-4 text-xs font-bold text-slate-500">{cat.id}</td>
                      <td className="py-3 px-4 text-sm font-bold text-slate-700">
                        {editingId === cat.id ? (
                          <input type="text" className={`${inputClassHud} !py-1 text-xs`} value={editName} onChange={e => setEditName(e.target.value)} />
                        ) : (
                          cat.name
                        )}
                      </td>
                      <td className="py-3 px-4 text-sm">
                        {editingId === cat.id ? (
                          <select className={`${inputClassHud} !py-1 text-xs`} value={editMode} onChange={e => setEditMode(e.target.value)}>
                            <option value="ข้างกล่อง">จ่ายข้างกล่อง (Fixed Box)</option>
                            <option value="เปอร์เซ็นต์">จ่ายเปอร์เซ็นต์ (% of Price)</option>
                          </select>
                        ) : (
                          <span className={`px-2.5 py-1 rounded-lg text-xs font-bold ${cat.commissionMode === 'เปอร์เซ็นต์' ? 'bg-indigo-50 border border-indigo-200 text-indigo-700' : 'bg-emerald-50 border border-emerald-200 text-emerald-700'}`}>
                            {cat.commissionMode === 'เปอร์เซ็นต์' ? 'เปอร์เซ็นต์ (%)' : 'จ่ายข้างกล่อง'}
                          </span>
                        )}
                      </td>
                      <td className="py-3 px-4 text-center">
                        {editingId === cat.id ? (
                          <div className="flex gap-1.5 justify-center">
                            <button onClick={() => handleSave(cat.id)} disabled={isSubmitting} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-[11px] rounded-lg transition-colors shadow-sm">
                              {isSubmitting ? '...' : 'บันทึก'}
                            </button>
                            <button onClick={() => setEditingId(null)} className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-[11px] rounded-lg transition-colors border border-slate-200">
                              ยกเลิก
                            </button>
                          </div>
                        ) : (
                          <div className="flex gap-1.5 justify-center">
                            <button onClick={() => handleStartEdit(cat)} className="text-blue-500 hover:text-blue-700 bg-white p-1.5 rounded-lg border border-slate-200 shadow-sm transition-colors">
                              <Edit size={14} />
                            </button>
                            <button onClick={() => setConfirmDelete({ show: true, id: cat.id, name: cat.name })} className="text-red-500 hover:text-red-700 bg-white p-1.5 rounded-lg border border-slate-200 shadow-sm transition-colors">
                              <Trash2 size={14} />
                            </button>
                          </div>
                        )}
                      </td>
                    </tr>
                  ))}
                  {productCategories.length === 0 && (
                    <tr><td colSpan="4" className="p-8 text-center text-slate-400 font-bold">ไม่มีข้อมูลหมวดหมู่สินค้า</td></tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

        // ==========================================
    // 💰 Commission & System Settings Tab Component (Dedicated Top Tab)
    // ==========================================
    const CommissionSettingsTab = ({ products, setProducts, systemSettings, setSystemSettings, productCategories, setProductCategories, showToast }) => {
        const [editableProducts, setEditableProducts] = useState([]);
        const [levelsInput, setLevelsInput] = useState(Number(systemSettings?.commission_levels || 6));
        const [minDivPvInput, setMinDivPvInput] = useState(Number(systemSettings?.min_dividend_pv || 100));
        const [isSaving, setIsSaving] = useState(false);

        // ⚡ Fast Batch Configurator State
        const [selectedProdIds, setSelectedProdIds] = useState([]);
        const [batchSearchTerm, setBatchSearchTerm] = useState('');
        const [batchCatFilter, setBatchCatFilter] = useState('ALL');
        const [tableSearchTerm, setTableSearchTerm] = useState('');
        const [tableCatFilter, setTableCatFilter] = useState('ALL');
        
        // ➕ Custom Level Input State
        const [customLevelVal, setCustomLevelVal] = useState('');
        const [customLevelsList, setCustomLevelsList] = useState([]);

        // Batch Form Values
        const [batchRates, setBatchRates] = useState({});

        const handleAddCustomLevel = () => {
            const num = parseInt(customLevelVal, 10);
            if (isNaN(num) || num < 2) {
                showToast('กรุณาระบุจำนวนระดับชั้นเป็นตัวเลขตั้งแต่ 2 ขึ้นไป', 'error');
                return;
            }
            if (!customLevelsList.includes(num)) {
                setCustomLevelsList(prev => [...prev, num].sort((a, b) => a - b));
            }
            setLevelsInput(num);
            setCustomLevelVal('');
            showToast(`ปรับใช้จำนวนระดับชั้นเป็น ${num} ชั้น (ตัวเอง + แนะนำ ${num - 1} ชั้น) สำเร็จ!`, 'success');
        };

        useEffect(() => {
            if (products) setEditableProducts(JSON.parse(JSON.stringify(products)));
            if (systemSettings) {
                setLevelsInput(Number(systemSettings.commission_levels || 6));
                setMinDivPvInput(Number(systemSettings.min_dividend_pv || 100));
            }
        }, [products, systemSettings]);

        const handleBatchRateChange = (field, val) => {
            setBatchRates(prev => ({ ...prev, [field]: Number(val) || 0 }));
        };

        const filteredProdsForBatch = editableProducts.filter(p => {
            if (!p) return false;
            const matchSearch = batchSearchTerm === '' || (p.name || '').toUpperCase().includes(batchSearchTerm.toUpperCase()) || (p.id || '').toUpperCase().includes(batchSearchTerm.toUpperCase());
            const matchCat = batchCatFilter === 'ALL' || String(p.category || '').trim().toLowerCase() === String(batchCatFilter).trim().toLowerCase();
            return matchSearch && matchCat;
        });

        const toggleSelectAllBatch = () => {
            const visibleIds = filteredProdsForBatch.map(p => p.id);
            const allSelected = visibleIds.every(id => selectedProdIds.includes(id));
            if (allSelected) {
                setSelectedProdIds(prev => prev.filter(id => !visibleIds.includes(id)));
            } else {
                setSelectedProdIds(prev => Array.from(new Set([...prev, ...visibleIds])));
            }
        };

        const handleApplyBatchRates = () => {
            if (selectedProdIds.length === 0) {
                showToast('กรุณาเลือกสินค้าอย่างน้อย 1 รายการก่อนปรับใช้', 'error');
                return;
            }

            const updated = editableProducts.map(p => {
                if (selectedProdIds.includes(p.id)) {
                    const copy = { ...p };
                    Object.keys(batchRates).forEach(field => {
                        copy[field] = Number(batchRates[field]) || 0;
                    });
                    return copy;
                }
                return p;
            });

            setEditableProducts(updated);
            showToast(`ปรับใช้อัตราคอมมิชชันกับสินค้า ${selectedProdIds.length} รายการสำเร็จ! (อย่าลืมกดบันทึกทั้งหมด)`, 'success');
        };

        const handleInputChange = (index, field, value) => {
            const updated = [...editableProducts];
            updated[index][field] = Number(value) || 0;
            setEditableProducts(updated);
        };

        const handleSaveAll = (e) => {
            e.preventDefault();
            setIsSaving(true);
            const numLevels = Number(levelsInput) || 6;
            const numMinPv = Number(minDivPvInput) || 100;

            setSystemSettings(prev => ({
                ...prev,
                commission_levels: numLevels,
                min_dividend_pv: numMinPv
            }));

            if (typeof google !== 'undefined' && google.script) {
                google.script.run
                    .withSuccessHandler(() => {
                        google.script.run
                            .withSuccessHandler(() => {
                                google.script.run
                                    .withSuccessHandler((res) => {
                                        setIsSaving(false);
                                        setProducts(editableProducts);
                                        showToast(res.message || 'บันทึกอัตราปันผลและระบบสำเร็จ!', 'success');
                                    })
                                    .withFailureHandler(err => {
                                        setIsSaving(false);
                                        showToast('เกิดข้อผิดพลาดในการบันทึกอัตราสินค้า: ' + err, 'error');
                                    })
                                    .updateProductCommissionSettings(editableProducts);
                            })
                            .withFailureHandler(err => {
                                setIsSaving(false);
                                showToast('บันทึกคะแนนปันผลขั้นต่ำล้มเหลว: ' + err, 'error');
                            })
                            .saveSystemSetting('min_dividend_pv', numMinPv);
                    })
                    .withFailureHandler(err => {
                        setIsSaving(false);
                        showToast('บันทึกจำนวนระดับชั้นล้มเหลว: ' + err, 'error');
                    })
                    .saveSystemSetting('commission_levels', numLevels);
            } else {
                setProducts(editableProducts);
                setIsSaving(false);
                showToast('บันทึกการตั้งค่าระบบและปันผลสำเร็จ (จำลอง)', 'success');
            }
        };

        return (
            <div className="space-y-6 animation-fade-in">
                {/* System Settings Header Card */}
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                    <h3 className="text-lg font-black text-slate-800 flex items-center gap-2">⚙️ ตั้งค่าระดับชั้นคอมมิชชันและเงื่อนไขปันผล</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                        <div className="md:col-span-1">
                            <label className="text-xs font-bold text-slate-600 block mb-1.5">เลือกจำนวนระดับชั้นจ่ายคอมมิชชัน</label>
                            <select className={inputClassHud} value={levelsInput} onChange={e => setLevelsInput(Number(e.target.value))}>
                                {Array.from(new Set([...Array.from({ length: 19 }, (_, i) => i + 2), ...customLevelsList, levelsInput])).sort((a, b) => a - b).map(val => (
                                    <option key={val} value={val}>{val} ชั้น (ตัวเอง + แนะนำ {val - 1} ชั้น)</option>
                                ))}
                            </select>
                        </div>
                        <div className="md:col-span-1">
                            <label className="text-xs font-bold text-slate-600 block mb-1.5">➕ เพิ่ม/ระบุจำนวนระดับชั้นเอง (Custom Level)</label>
                            <div className="flex gap-2">
                                <input 
                                    type="number" 
                                    min="2"
                                    max="100"
                                    className={inputClassHud + " font-bold"} 
                                    placeholder="ระบุ เช่น 25, 30, 50..."
                                    value={customLevelVal}
                                    onChange={e => setCustomLevelVal(e.target.value)}
                                    onKeyDown={e => { if (e.key === 'Enter') handleAddCustomLevel(); }}
                                />
                                <button 
                                    type="button" 
                                    onClick={handleAddCustomLevel}
                                    className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs whitespace-nowrap transition-all shadow-sm shrink-0 flex items-center gap-1"
                                >
                                    ➕ เพิ่มชั้น
                                </button>
                            </div>
                        </div>
                        <div className="md:col-span-1">
                            <label className="text-xs font-bold text-slate-600 block mb-1.5">คะแนนสะสม PV ขั้นต่ำในการจ่ายปันผล (min_dividend_pv)</label>
                            <input type="number" className={inputClassHud} value={minDivPvInput} onChange={e => setMinDivPvInput(Number(e.target.value))} placeholder="100" />
                        </div>
                    </div>
                </div>

                {/* ⚡ Fast Batch Commission Configurator Card */}
                <div className="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 rounded-3xl p-6 text-white shadow-xl space-y-5 border border-indigo-500/30">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div>
                            <h3 className="text-lg font-black text-white flex items-center gap-2">⚡ เครื่องมือตั้งค่าคอมมิชชันแบบกลุ่ม (Batch Configurator)</h3>
                            <p className="text-xs text-indigo-200 font-medium mt-1">ค้นหา เลือกหลายสินค้าพร้อมกัน แล้วกรอกอัตราคอมมิชชันเพื่อปรับใช้ในครั้งเดียว (สะดวกรวดเร็วเมื่อมีสินค้าจำนวนมาก)</p>
                        </div>
                        <div className="flex items-center gap-2">
                            <span className="text-xs font-bold bg-indigo-500/30 text-indigo-200 px-3 py-1.5 rounded-xl border border-indigo-400/30">
                                เลือกอยู่ {selectedProdIds.length} รายการ
                            </span>
                        </div>
                    </div>

                    {/* Step 1: Select Products */}
                    <div className="bg-white/10 backdrop-blur-md rounded-2xl p-4 border border-white/10 space-y-3">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                            <span className="text-xs font-bold text-indigo-200 uppercase tracking-wider">ขั้นตอนที่ 1: เลือกสินค้าที่ต้องการปรับค่า</span>
                            <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
                                <input 
                                    type="text" 
                                    className="px-3 py-1.5 bg-slate-800/80 border border-slate-700 text-white rounded-xl text-xs outline-none focus:border-indigo-400 w-full sm:w-48 placeholder-slate-400"
                                    placeholder="🔍 ค้นหาสินค้า..."
                                    value={batchSearchTerm}
                                    onChange={e => setBatchSearchTerm(e.target.value)}
                                />
                                <select 
                                    className="px-3 py-1.5 bg-slate-800/80 border border-slate-700 text-white rounded-xl text-xs outline-none focus:border-indigo-400"
                                    value={batchCatFilter}
                                    onChange={e => setBatchCatFilter(e.target.value)}
                                >
                                    <option value="ALL">ทุกหมวดหมู่</option>
                                    {(productCategories || []).map(c => <option key={c.id} value={c.name}>{c.name}</option>)}
                                </select>
                                <button 
                                    type="button" 
                                    onClick={toggleSelectAllBatch}
                                    className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs transition-all shadow-sm"
                                >
                                    {filteredProdsForBatch.every(p => selectedProdIds.includes(p.id)) && filteredProdsForBatch.length > 0 ? '❌ ยกเลิกเลือกทั้งหมด' : '☑️ เลือกทั้งหมดในกลุ่มนี้'}
                                </button>
                            </div>
                        </div>

                        {/* Selected Product Badges Grid */}
                        <div className="flex flex-wrap gap-1.5 max-h-36 overflow-y-auto p-2 bg-slate-950/40 rounded-xl border border-white/5">
                            {filteredProdsForBatch.map(p => {
                                const isSelected = selectedProdIds.includes(p.id);
                                return (
                                    <button 
                                        key={p.id}
                                        type="button"
                                        onClick={() => {
                                            if (isSelected) setSelectedProdIds(prev => prev.filter(id => id !== p.id));
                                            else setSelectedProdIds(prev => [...prev, p.id]);
                                        }}
                                        className={`px-3 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 border ${
                                            isSelected ? 'bg-emerald-500 text-white border-emerald-400 shadow-md' : 'bg-slate-800/60 text-slate-300 border-slate-700 hover:bg-slate-700'
                                        }`}
                                    >
                                        <span>{isSelected ? '✓' : '+'}</span>
                                        <span>{p.name}</span>
                                    </button>
                                );
                            })}
                            {filteredProdsForBatch.length === 0 && (
                                <span className="text-xs text-slate-400 p-2">ไม่พบสินค้าตามเงื่อนไขที่ค้นหา</span>
                            )}
                        </div>
                    </div>

                    {/* Step 2: Set Batch Commission Rates (Money Fees & Percentages) */}
                    <div className="bg-white/10 backdrop-blur-md rounded-2xl p-4 border border-white/10 space-y-4">
                        <span className="text-xs font-bold text-indigo-200 uppercase tracking-wider block">ขั้นตอนที่ 2: ระบุอัตราคอมมิชชันที่จะนำไปใช้กับสินค้าที่เลือก (ระบุข้างกล่อง หรือ เปอร์เซ็นต์ %)</span>
                        
                        {/* Group 1: Money Fees */}
                        <div>
                            <span className="text-xs font-black text-emerald-300 block mb-2">💵 กลุ่มที่ 1: จ่ายคอมมิชชันข้างกล่อง (จำนวนเงิน บาท/กีบ)</span>
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                                <div>
                                    <label className="text-[11px] font-bold text-emerald-300/80 block mb-1">ขายเอง (บาท/กีบ)</label>
                                    <input 
                                        type="number" 
                                        className="w-full p-2 bg-slate-900 border border-emerald-500/50 rounded-xl text-center text-xs font-bold text-emerald-300 outline-none focus:ring-2 focus:ring-emerald-400"
                                        placeholder="0"
                                        value={batchRates.selfFee || ''}
                                        onChange={e => handleBatchRateChange('selfFee', e.target.value)}
                                    />
                                </div>
                                {Array.from({ length: Math.max(1, (Number(levelsInput) || 6) - 1) }).map((_, idx) => (
                                    <div key={`fee_${idx}`}>
                                        <label className="text-[11px] font-bold text-emerald-300/80 block mb-1">แนะนำ ชั้น {idx + 1} (บาท/กีบ)</label>
                                        <input 
                                            type="number" 
                                            className="w-full p-2 bg-slate-900 border border-emerald-500/50 rounded-xl text-center text-xs font-bold text-emerald-300 outline-none focus:ring-2 focus:ring-emerald-400"
                                            placeholder="0"
                                            value={batchRates[`level${idx + 1}Fee`] || ''}
                                            onChange={e => handleBatchRateChange(`level${idx + 1}Fee`, e.target.value)}
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Group 2: Percentage Fees (%) */}
                        <div className="pt-3 border-t border-white/10">
                            <span className="text-xs font-black text-indigo-300 block mb-2">📊 กลุ่มที่ 2: จ่ายคอมมิชชันเปอร์เซ็นต์ (%)</span>
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                                <div>
                                    <label className="text-[11px] font-bold text-indigo-300/80 block mb-1">ขายเอง (%)</label>
                                    <input 
                                        type="number" 
                                        step="0.5"
                                        className="w-full p-2 bg-slate-900 border border-indigo-500/50 rounded-xl text-center text-xs font-bold text-indigo-300 outline-none focus:ring-2 focus:ring-indigo-400"
                                        placeholder="0%"
                                        value={batchRates.selfPercent || ''}
                                        onChange={e => handleBatchRateChange('selfPercent', e.target.value)}
                                    />
                                </div>
                                {Array.from({ length: Math.max(1, (Number(levelsInput) || 6) - 1) }).map((_, idx) => (
                                    <div key={`pct_${idx}`}>
                                        <label className="text-[11px] font-bold text-indigo-300/80 block mb-1">แนะนำ ชั้น {idx + 1} (%)</label>
                                        <input 
                                            type="number" 
                                            step="0.5"
                                            className="w-full p-2 bg-slate-900 border border-indigo-500/50 rounded-xl text-center text-xs font-bold text-indigo-300 outline-none focus:ring-2 focus:ring-indigo-400"
                                            placeholder="0%"
                                            value={batchRates[`level${idx + 1}Percent`] || ''}
                                            onChange={e => handleBatchRateChange(`level${idx + 1}Percent`, e.target.value)}
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="pt-3 border-t border-white/10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <span className="text-xs text-indigo-200 font-medium">กดปุ่มด้านขวาเพื่อคัดลอกทั้งจำนวนเงินและเปอร์เซ็นต์ไปยังสินค้า {selectedProdIds.length} รายการที่เลือกทันที</span>
                            <button 
                                type="button" 
                                onClick={handleApplyBatchRates}
                                className="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-xs transition-all shadow-lg flex items-center gap-2 shrink-0"
                            >
                                ⚡ ปรับใช้อัตรานี้กับ {selectedProdIds.length} สินค้าที่เลือก
                            </button>
                        </div>
                    </div>
                </div>

                {/* Per-Product & Per-Category Commission Table */}
                <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 space-y-4">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h3 className="text-lg font-black text-slate-800 flex items-center gap-2">💰 ตารางตั้งค่าคอมมิชชันสินค้าแยกตามหมวดหมู่</h3>
                            <p className="text-xs font-bold text-slate-400 mt-1">แบ่งกลุ่มจ่ายข้างกล่อง (จำนวนเงิน บาท/กีบ) และ เปอร์เซ็นต์ (%) ชัดเจน</p>
                        </div>
                        <div className="flex items-center gap-3">
                            <input 
                                type="text" 
                                className="px-3 py-2 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500 placeholder-slate-400 font-bold"
                                placeholder="🔍 ค้นหาสินค้าในตาราง..."
                                value={tableSearchTerm}
                                onChange={e => setTableSearchTerm(e.target.value)}
                            />
                            <button type="button" onClick={handleSaveAll} disabled={isSaving} className={btnClassPrimary + " shadow-md flex items-center gap-2 shrink-0"}>
                                {isSaving ? <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : '💾 บันทึกการตั้งค่าปันผลทั้งหมด'}
                            </button>
                        </div>
                    </div>

                    <div className="border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                        <div className="overflow-x-auto max-h-[65vh]">
                            <table className="w-full text-left border-collapse min-w-[1200px]">
                                <thead className="sticky top-0 bg-slate-900 text-white z-10 text-center">
                                    {/* 2-Tier Dynamic Header based on levelsInput */}
                                    {(() => {
                                        const numLevels = Math.max(1, Number(levelsInput) || 6);
                                        const numDownlines = Math.max(1, numLevels - 1);

                                        return (
                                            <React.Fragment>
                                                <tr className="border-b border-slate-800">
                                                    <th rowSpan="2" className="p-3 text-xs font-bold text-left bg-slate-900 min-w-[140px] border-r border-slate-800">สินค้า / หมวดหมู่</th>
                                                    <th colSpan={numLevels} className="p-2 text-xs font-black bg-emerald-950/90 text-emerald-300 border-r-2 border-emerald-500 uppercase tracking-wider">
                                                        💵 กลุ่มที่ 1: จ่ายคอมมิชชันข้างกล่อง (จำนวนเงิน บาท/กีบ) ({numLevels} ชั้น)
                                                    </th>
                                                    <th colSpan={numLevels} className="p-2 text-xs font-black bg-indigo-950/90 text-indigo-300 uppercase tracking-wider">
                                                        📊 กลุ่มที่ 2: จ่ายคอมมิชชันเปอร์เซ็นต์ (%) ({numLevels} ชั้น)
                                                    </th>
                                                </tr>
                                                <tr className="border-b border-slate-800 text-[11px]">
                                                    {/* Money Fees Columns */}
                                                    <th className="p-2 font-bold bg-emerald-900/60 text-emerald-200">ขายเอง</th>
                                                    {Array.from({ length: numDownlines }).map((_, idx) => (
                                                        <th key={idx} className={`p-2 font-bold bg-emerald-900/60 text-emerald-200 ${idx === numDownlines - 1 ? 'border-r-2 border-emerald-500' : ''}`}>
                                                            ชั้น {idx + 1}
                                                        </th>
                                                    ))}
                                                    {/* Percentage Columns */}
                                                    <th className="p-2 font-bold bg-indigo-900/60 text-indigo-200">ขายเอง (%)</th>
                                                    {Array.from({ length: numDownlines }).map((_, idx) => (
                                                        <th key={idx} className="p-2 font-bold bg-indigo-900/60 text-indigo-200">
                                                            ชั้น {idx + 1} (%)
                                                        </th>
                                                    ))}
                                                </tr>
                                            </React.Fragment>
                                        );
                                    })()}
                                </thead>
                                <tbody>
                                    {editableProducts.filter(p => {
                                        if (!p) return false;
                                        return tableSearchTerm === '' || (p.name || '').toUpperCase().includes(tableSearchTerm.toUpperCase()) || (p.id || '').toUpperCase().includes(tableSearchTerm.toUpperCase());
                                    }).map((p, index) => {
                                        const numLevels = Math.max(1, Number(levelsInput) || 6);
                                        const numDownlines = Math.max(1, numLevels - 1);

                                        const renderFeeInput = (field) => {
                                            const numVal = Number(p[field] || 0);
                                            const displayVal = numVal > 0 ? numVal.toLocaleString('en-US') : '0';
                                            return (
                                                <input 
                                                    type="text" 
                                                    className="w-24 p-1.5 text-center text-xs font-black border border-emerald-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-emerald-50/30 text-emerald-800" 
                                                    value={displayVal} 
                                                    onChange={e => {
                                                        const raw = e.target.value.replace(/,/g, '').replace(/[^0-9]/g, '');
                                                        handleInputChange(index, field, raw ? Number(raw) : 0);
                                                    }} 
                                                />
                                            );
                                        };

                                        const renderPercentInput = (field) => (
                                            <input 
                                                type="number" 
                                                min="0" 
                                                step="0.5" 
                                                className="w-16 p-1.5 text-center text-xs font-black border border-indigo-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-indigo-50/30 text-indigo-800" 
                                                value={p[field] || 0} 
                                                onChange={e => handleInputChange(index, field, e.target.value)} 
                                            />
                                        );

                                        return (
                                            <tr key={p.id || index} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                <td className="p-3 border-r border-slate-200">
                                                    <div className="font-bold text-slate-800 text-xs">{p.name}</div>
                                                    <div className="text-[10px] text-slate-400 font-mono">{p.id} ({p.category || 'ไม่ระบุ'})</div>
                                                </td>
                                                {/* Group 1: Money Fees */}
                                                <td className="p-2 text-center bg-emerald-50/10">{renderFeeInput('selfFee')}</td>
                                                {Array.from({ length: numDownlines }).map((_, idx) => (
                                                    <td key={idx} className={`p-2 text-center bg-emerald-50/10 ${idx === numDownlines - 1 ? 'border-r-2 border-emerald-500' : ''}`}>
                                                        {renderFeeInput(`level${idx + 1}Fee`)}
                                                    </td>
                                                ))}
                                                {/* Group 2: Percentages % */}
                                                <td className="p-2 text-center bg-indigo-50/10">{renderPercentInput('selfPercent')}</td>
                                                {Array.from({ length: numDownlines }).map((_, idx) => (
                                                    <td key={idx} className="p-2 text-center bg-indigo-50/10">
                                                        {renderPercentInput(`level${idx + 1}Percent`)}
                                                    </td>
                                                ))}
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    const StockManagementView = ({ products, setProducts, stockMovements, setStockMovements, isAdmin, currentUser, showToast, systemSettings, setSystemSettings, productCategories, setProductCategories }) => {
      const [activeTab, setActiveTab] = useState(() => {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const pageParam = urlParams.get('page') || 'stock';
          if (pageParam === 'products') return 'products';
        } catch(e) {}
        return 'dashboard';
      });
      const tabs = [
        { id: 'dashboard', label: '📊 ภาพรวมสต๊อก', icon: null },
        { id: 'stock_in',  label: '➕ นำเข้าสต๊อก', icon: null },
        { id: 'stock_out', label: '➖ เบิกสินค้า', icon: null },
        { id: 'movement_log', label: '📋 ประวัติการเคลื่อนไหว', icon: null },
        ...(isAdmin ? [
          { id: 'products', label: '⚙️ ตั้งค่าสินค้า', icon: null },
          { id: 'categories', label: '📁 ตั้งค่าหมวดหมู่', icon: null },
          { id: 'commission_settings', label: '💰 ตั้งค่าคอมมิชชันสินค้า & ระบบ', icon: null }
        ] : [])
      ];

      return (
        <div className="space-y-5 animation-fade-in">
          <div>
            <h2 className="text-2xl font-bold text-slate-800">คลังสินค้าและสต๊อก (Inventory)</h2>
            <p className="text-sm text-slate-500 mt-1">จัดการสินค้าคงคลัง รับเข้า เบิกออก และดูประวัติการเคลื่อนไหว</p>
          </div>

          {/* Tab Nav */}
          <div className="flex gap-1 bg-slate-100 p-1.5 rounded-xl border border-slate-200 overflow-x-auto hide-scroll w-full">
            {tabs.map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition-all flex-shrink-0 ${activeTab === tab.id ? 'bg-white text-blue-700 shadow-sm border border-slate-200' : 'text-slate-600 hover:text-slate-800'}`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {/* Tab Content */}
          {activeTab === 'dashboard' && (
            <StockDashboardTab products={products} stockMovements={stockMovements}/>
          )}
          {activeTab === 'stock_in' && (
            <StockInTab products={products} stockMovements={stockMovements} setStockMovements={setStockMovements} setProducts={setProducts} currentUser={currentUser} showToast={showToast}/>
          )}
          {activeTab === 'stock_out' && (
            <StockOutTab products={products} stockMovements={stockMovements} setStockMovements={setStockMovements} setProducts={setProducts} currentUser={currentUser} showToast={showToast}/>
          )}
          {activeTab === 'movement_log' && (
            <MovementLogTab products={products} stockMovements={stockMovements} setStockMovements={setStockMovements} showToast={showToast}/>
          )}
          {activeTab === 'products' && isAdmin && (
            <ProductsManagementView 
              products={products} 
              setProducts={setProducts} 
              isAdmin={isAdmin} 
              showToast={showToast} 
              systemSettings={systemSettings} 
              setSystemSettings={setSystemSettings}
              productCategories={productCategories}
              setProductCategories={setProductCategories}
            />
          )}
          {activeTab === 'categories' && isAdmin && (
            <CategoriesManagementView 
              productCategories={productCategories}
              setProductCategories={setProductCategories}
              showToast={showToast}
            />
          )}
          {activeTab === 'commission_settings' && isAdmin && (
            <CommissionSettingsTab 
              products={products} 
              setProducts={setProducts} 
              systemSettings={systemSettings} 
              setSystemSettings={setSystemSettings}
              productCategories={productCategories}
              setProductCategories={setProductCategories}
              showToast={showToast}
            />
          )}
        </div>
      );
    };

    // ==========================================
    // 📌 React App (Main Component)
    // ==========================================
    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);



      const [products, setProducts] = useState([]);
      const [systemSettings, setSystemSettings] = useState({ min_dividend_pv: 100 });
      const [productCategories, setProductCategories] = useState([]);
      const [customerTypes, setCustomerTypes] = useState(fallbackCustomerTypes);
      const [closers, setClosers] = useState([]);
      const [members, setMembers] = useState([]);
      const [stockMovements, setStockMovements] = useState([]);
      const [businessTeams, setBusinessTeams] = useState([]);
      const [isAppLoading, setIsAppLoading] = useState(true);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch(e) { return false; }
      });
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const showToast = (message, type = 'success') => { setToast({ show: true, message, type }); };

      const SCRIPT_URL = (() => {
  try {
    if (window.top && window.top.location && window.top.location.href) {
      const base = window.top.location.href.split('?')[0];
      if (base && base.startsWith('http')) return base;
    }
  } catch(e) {}
  return "<?= getScriptUrl() ?>";
})();
      const isAdmin = currentUser && (
        String(currentUser.role).trim() === 'ผู้ดูแลระบบ' ||
        String(currentUser.role).trim().toLowerCase() === 'admin'
      );
      const currentUserProfileUrl = currentUser?.profileUrl || '';

      useEffect(() => {
        const savedUserStr = localStorage.getItem('stk_current_user');
        if (savedUserStr) {
          try { const user = JSON.parse(savedUserStr); setCurrentUser(user); setIsLoggedIn(true); }
          catch(e) { localStorage.removeItem('stk_current_user'); }
        } else {
          setShowLoginModal(true);
        }
        const loader = document.getElementById('initial-loader');
        if (loader) loader.style.display = 'none';

        if (typeof google !== 'undefined' && google.script) {
          try {
            const cached = localStorage.getItem('stk_app_cache_data');
            if (cached) { applyData(JSON.parse(cached)); setIsAppLoading(false); }
          } catch(e) {}
          google.script.run
            .withSuccessHandler(res => {
              if (res) { try { localStorage.setItem('stk_app_cache_data', JSON.stringify(res)); } catch(e) {} applyData(res); }
              setIsAppLoading(false);
            })
            .withFailureHandler(err => {
              setIsAppLoading(false);
              showToast('การเชื่อมต่อขัดข้อง: ' + (err ? (err.message || err) : ''), 'error');
            })
            .getInitialData();
        } else {
          // Load real data directly from Supabase
          Promise.all([
            supabaseSelect('stk_products').catch(() => supabaseSelect('products')),
            supabaseSelect('stk_product_categories').catch(() => supabaseSelect('product_categories')),
            supabaseSelect('stk_stock_movements').catch(() => supabaseSelect('stock_movements')),
            supabaseSelect('stk_members').catch(() => supabaseSelect('members')),
            supabaseSelect('stk_closers').catch(() => supabaseSelect('closers')),
            supabaseSelect('stk_customer_types').catch(() => supabaseSelect('customer_types'))
          ]).then(([pRes, catRes, movRes, memRes, cloRes, typeRes]) => {
            if (Array.isArray(pRes)) {
              const formatted = pRes.map(p => ({
                id: p.product_id || p.id,
                name: p.name,
                category: p.category,
                status: p.status || 'ใช้งาน',
                stock: parseInt(p.current_stock || p.stock || 0),
                priceFull: parseFloat(p.price_full || 0),
                priceMember: parseFloat(p.price_member || 0),
                pricePromo: parseFloat(p.price_promo || 0),
                givePv: parseFloat(p.give_pv || p.b2n_give_pv || 0),
                directFee: parseFloat(p.self_fee || 0)
              }));
              setProducts(formatted);
            }
            if (Array.isArray(catRes)) setProductCategories(catRes);
            if (Array.isArray(movRes)) setStockMovements(movRes);
            if (Array.isArray(memRes)) setMembers(memRes);
            if (Array.isArray(cloRes)) setClosers(cloRes);
            if (Array.isArray(typeRes)) setCustomerTypes(typeRes);
          }).catch(err => {
            console.error("Supabase load error:", err);
          }).finally(() => {
            setIsAppLoading(false);
          });
        }
      }, []);

      const applyData = (res) => {
        if (Array.isArray(res.products)) setProducts(res.products);
        if (Array.isArray(res.customerTypes)) setCustomerTypes(res.customerTypes);
        if (Array.isArray(res.closers)) setClosers(res.closers);
        if (Array.isArray(res.members)) setMembers(res.members);
        if (Array.isArray(res.businessTeams)) setBusinessTeams(res.businessTeams);
        if (Array.isArray(res.stockMovements)) setStockMovements(res.stockMovements);
        if (res && res.systemSettings) setSystemSettings(res.systemSettings);
        if (res && Array.isArray(res.productCategories)) setProductCategories(res.productCategories);
      };

      const handleLoginSuccess = (user) => {
        localStorage.setItem('stk_current_user', JSON.stringify(user));
        setCurrentUser(user); setIsLoggedIn(true); setShowLoginModal(false);
        showToast('เข้าสู่ระบบสำเร็จ!', 'success');
      };
      const handleLogout = () => {
        localStorage.removeItem('stk_current_user');
        setCurrentUser(null); setIsLoggedIn(false);
        if (typeof window !== 'undefined') window.open(resolvePageUrl(SCRIPT_URL + '?page=dashboard'), '_top');
      };

      return (
        <div className="min-h-screen flex flex-col lg:flex-row font-sans bg-slate-50">
          <Sidebar
            activePage="stock"
            isLoggedIn={isLoggedIn}
            currentUser={currentUser}
            currentUserProfileUrl={currentUserProfileUrl}
            isAdmin={isAdmin}
            onLogout={handleLogout}
            showLoginModal={showLoginModal}
            setShowLoginModal={setShowLoginModal}
            SCRIPT_URL={SCRIPT_URL}
            setIsAppLoading={setIsAppLoading}
            isSidebarCollapsed={isSidebarCollapsed}
            setIsSidebarCollapsed={setIsSidebarCollapsed}
          />

          <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>

            {toast.show && (
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[9999] flex items-center justify-center p-4 animation-fade-in" style={{animationDuration:'0.2s'}}>
                <div className={`bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center animation-pop border-t-4 ${toast.type==='error'?'border-red-500':toast.type==='info'?'border-blue-500':'border-emerald-500'}`}>
                  <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${toast.type==='error'?'bg-red-100 text-red-500':toast.type==='info'?'bg-blue-100 text-blue-500':'bg-emerald-100 text-emerald-500'}`}>
                    {toast.type==='error'?<X size={32}/>:toast.type==='info'?<Trophy size={32}/>:<CheckCircle size={32}/>}
                  </div>
                  <h3 className="text-xl font-bold text-slate-800 mb-2">{toast.type==='error'?'เกิดข้อผิดพลาด':toast.type==='info'?'แจ้งเตือน':'สำเร็จ!'}</h3>
                  <p className="text-slate-600 font-medium text-sm mb-6">{toast.message}</p>
                  <button onClick={() => setToast({...toast, show:false})} className="w-full py-2.5 rounded-lg font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">ตกลง</button>
                </div>
              </div>
            )}

            <div className="p-3 sm:p-6 flex-1 w-full">
              {isAppLoading ? (
                <div className="flex flex-col items-center justify-center py-32 gap-5">
                  <div className="w-16 h-16 border-[4px] border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                  <h2 className="text-lg font-bold text-slate-700">กำลังโหลดข้อมูลคลังสินค้า...</h2>
                </div>
              ) : isLoggedIn ? (
                <StockManagementView
                  products={products}
                  setProducts={setProducts}
                  stockMovements={stockMovements}
                  setStockMovements={setStockMovements}
                  isAdmin={isAdmin}
                  currentUser={currentUser}
                  showToast={showToast}
                  systemSettings={systemSettings}
                  setSystemSettings={setSystemSettings}
                  productCategories={productCategories}
                  setProductCategories={setProductCategories}
                />
              ) : (
                <div className="flex flex-col items-center justify-center py-32 gap-5">
                  <h2 className="text-xl font-black text-red-500">กรุณาเข้าสู่ระบบก่อนใช้งาน</h2>
                  <button onClick={() => setShowLoginModal(true)} className={btnClassPrimary}>เข้าสู่ระบบ</button>
                </div>
              )}
            </div>

            <footer className="w-full text-center py-6 mt-auto border-t border-slate-200/50 no-print">
              <p className="text-[11px] font-bold text-slate-400 opacity-60">&copy; {new Date().getFullYear()} STK Sales Management System.</p>
            </footer>
          </main>

          <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={[]}/>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
