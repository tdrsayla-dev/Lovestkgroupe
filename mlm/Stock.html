                                        placeholder="0%"
                                        value={batchRates.selfPercent || ''}
                                        onChange={e => handleBatchRateChange('selfPercent', e.target.value)}
                                    />
                                </div>
                                {Array.from({ length: Math.max(0, (Number(levelsInput) || 2) - 1) }).map((_, idx) => (
                                    <div key={`pct_${idx}`}>
                                        <label className="text-[11px] font-bold text-slate-600 block mb-1">แนะนำ ชั้นที่ {idx + 1} (%)</label>
                                        <input 
                                            type="number" 
                                            step="0.5"
                                            className="w-full p-2 bg-white border border-indigo-300 rounded-xl text-center text-xs font-bold text-indigo-800 outline-none focus:ring-2 focus:ring-indigo-400 font-mono shadow-xs"
                                            placeholder="0%"
                                            value={batchRates[`level${idx + 1}Percent`] || ''}
                                            onChange={e => handleBatchRateChange(`level${idx + 1}Percent`, e.target.value)}
                                        />
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="pt-3 border-t border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <span className="text-xs text-slate-500 font-medium">กดปุ่มเพื่อคัดลอกทั้งจำนวนเงินและเปอร์เซ็นต์ไปยังสินค้า {selectedProdIds.length} รายการที่เลือกทันที</span>
                            <button 
                                type="button" 
                                onClick={handleApplyBatchRates}
                                className="px-6 py-2.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black rounded-xl text-xs transition-all shadow-md flex items-center gap-2 shrink-0 transform active:scale-95 cursor-pointer"
                            >
                                ⚡ ปรับเปลี่ยนอัตรานี้กับ {selectedProdIds.length} สินค้าที่เลือก
                            </button>
                        </div>
                    </div>
                </div>

                <div className="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 space-y-4">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h3 className="text-lg font-black text-slate-800 flex items-center gap-2">📋 ตารางตั้งค่าคอมมิชชั่นสินค้าแยกตามหมวดหมู่</h3>
                            <p className="text-xs font-bold text-slate-400 mt-1">แบ่งกลุ่มจ่ายตามกล่อง (จำนวนเงิน บาท/กีบ) และ เปอร์เซ็นต์ (%) ชั้นต่างๆ</p>
                        </div>
                        <div className="flex items-center gap-3">
                            <input 
                                type="text" 
                                className="px-3 py-2 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-blue-500 placeholder-slate-400 font-bold"
                                placeholder="🔍 ค้นหาสินค้าในตาราง..."
                                value={tableSearchTerm}
                                onChange={e => setTableSearchTerm(e.target.value)}
                            />
                            <button type="button" onClick={handleSaveAll} disabled={isSaving} className={btnClassPrimary + " shadow-md flex items-center gap-2 shrink-0"}>
                                {isSaving ? <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : '💾 บันทึกการตั้งค่าปันผลทั้งหมด'}
                            </button>
                        </div>
                    </div>

                    <div className="border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                        <div className="overflow-x-auto max-h-[65vh]">
                            <table className="w-full text-left border-collapse min-w-[1200px]">
                                <thead className="sticky top-0 bg-slate-900 text-white z-10 text-center">
                                    {(() => {
                                        const numLevels = Math.max(1, Number(levelsInput) || 2);
                                        const numDownlines = Math.max(0, numLevels - 1);

                                        return (
                                            <React.Fragment>
                                                <tr className="border-b border-slate-800">
                                                    <th rowSpan="2" className="p-3 text-xs font-bold text-left bg-slate-900 min-w-[140px] border-r border-slate-800">สินค้า / หมวดหมู่</th>
                                                    <th colSpan={numLevels} className="p-2 text-xs font-black bg-emerald-950/90 text-emerald-300 border-r-2 border-emerald-500 uppercase tracking-wider">
                                                        💵 กลุ่มที่ 1: จ่ายคอมมิชชั่นจ่ายตามกล่อง (จำนวนเงิน บาท/กีบ) ({numLevels} ชั้น)
                                                    </th>
                                                    <th colSpan={numLevels} className="p-2 text-xs font-black bg-indigo-950/90 text-indigo-300 uppercase tracking-wider">
                                                        % กลุ่มที่ 2: จ่ายคอมมิชชั่นเปอร์เซ็นต์ (%) ({numLevels} ชั้น)
                                                    </th>
                                                </tr>
                                                <tr className="border-b border-slate-800 text-[11px]">
                                                    <th className="p-2 font-bold bg-emerald-900/60 text-emerald-200">ขายเอง</th>
                                                    {Array.from({ length: numDownlines }).map((_, idx) => (
                                                        <th key={idx} className={`p-2 font-bold bg-emerald-900/60 text-emerald-200 ${idx === numDownlines - 1 ? 'border-r-2 border-emerald-500' : ''}`}>
                                                            ชั้นที่ {idx + 1}
                                                        </th>
                                                    ))}
                                                    <th className="p-2 font-bold bg-indigo-900/60 text-indigo-200">ขายเอง (%)</th>
                                                    {Array.from({ length: numDownlines }).map((_, idx) => (
                                                        <th key={idx} className="p-2 font-bold bg-indigo-900/60 text-indigo-200">
                                                            ชั้นที่ {idx + 1} (%)
                                                        </th>
                                                    ))}
                                                </tr>
                                            </React.Fragment>
                                        );
                                    })()}
                                </thead>
                                <tbody>
                                    {editableProducts.filter(p => {
                                        if (!p) return false;
                                        return tableSearchTerm === '' || (p.name || '').toUpperCase().includes(tableSearchTerm.toUpperCase()) || (p.id || '').toUpperCase().includes(tableSearchTerm.toUpperCase());
                                    }).map((p, index) => {
                                        const numLevels = Math.max(1, Number(levelsInput) || 2);
                                        const numDownlines = Math.max(0, numLevels - 1);

                                        const renderFeeInput = (field) => {
                                            const numVal = Number(p[field] || 0);
                                            const displayVal = numVal > 0 ? numVal.toLocaleString('en-US') : '0';
                                            return (
                                                <input 
                                                    type="text" 
                                                    className="w-24 p-1.5 text-center text-xs font-black border border-emerald-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-emerald-50/30 text-emerald-800" 
                                                    value={displayVal} 
                                                    onChange={e => {
                                                        const raw = e.target.value.replace(/,/g, '').replace(/[^0-9]/g, '');
                                                        handleInputChange(index, field, raw ? Number(raw) : 0);
                                                    }} 
                                                />
                                            );
                                        };

                                        const renderPercentInput = (field) => (
                                            <input 
                                                type="number" 
                                                min="0" 
                                                step="0.5" 
                                                className="w-16 p-1.5 text-center text-xs font-black border border-indigo-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-indigo-50/30 text-indigo-800" 
                                                value={p[field] || 0} 
                                                onChange={e => handleInputChange(index, field, e.target.value)} 
                                            />
                                        );

                                        return (
                                            <tr key={p.id || index} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                <td className="p-3 border-r border-slate-200">
                                                    <div className="font-bold text-slate-800 text-xs">{p.name}</div>
                                                    <div className="text-[10px] text-slate-400 font-mono">{p.id} ({p.category || 'ไม่ระบุ'})</div>
                                                </td>
                                                <td className="p-2 text-center bg-emerald-50/10">{renderFeeInput('selfFee')}</td>
                                                {Array.from({ length: numDownlines }).map((_, idx) => (
                                                    <td key={idx} className={`p-2 text-center bg-emerald-50/10 ${idx === numDownlines - 1 ? 'border-r-2 border-emerald-500' : ''}`}>
                                                        {renderFeeInput(`level${idx + 1}Fee`)}
                                                    </td>
                                                ))}
                                                <td className="p-2 text-center bg-indigo-50/10">{renderPercentInput('selfPercent')}</td>
                                                {Array.from({ length: numDownlines }).map((_, idx) => (
                                                    <td key={idx} className="p-2 text-center bg-indigo-50/10">
                                                        {renderPercentInput(`level${idx + 1}Percent`)}
                                                    </td>
                                                ))}
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    {/* History Log Section */}
                    <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                        <h3 className="text-lg font-black text-slate-800 flex items-center gap-2">📜 ประวัติการตั้งค่าเงื่อนไขคอมมิชชั่น (Audit Log)</h3>
                        <div className="overflow-x-auto rounded-2xl border border-slate-200">
                            <table className="w-full text-xs text-left">
                                <thead className="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                                    <tr>
                                        <th className="p-3 text-center">ลำดับ</th>
                                        <th className="p-3">วันเวลาที่แก้ไข</th>
                                        <th className="p-3">ผู้แก้ไข</th>
                                        <th className="p-3 text-center">สถานะ</th>
                                        <th className="p-3 text-center">ขั้นต่ำ (กล่อง)</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 font-bold text-slate-700">
                                    {history.map((h, idx) => (
                                        <tr key={h.id || idx} className="hover:bg-slate-50/50">
                                            <td className="p-3 text-center text-slate-400">{idx + 1}</td>
                                            <td className="p-3 text-slate-600">{h.date}</td>
                                            <td className="p-3 text-blue-700">{h.user}</td>
                                            <td className="p-3 text-center">
                                                {h.is_enabled ? <span className="text-emerald-600 bg-emerald-50 px-2 py-1 rounded-lg">เปิดใช้งาน</span> : <span className="text-slate-400 bg-slate-100 px-2 py-1 rounded-lg">ปิด</span>}
                                            </td>
                                            <td className="p-3 text-center text-slate-800 font-black">{h.min_boxes}</td>
                                        </tr>
                                    ))}
                                    {history.length === 0 && (
                                        <tr><td colSpan="5" className="p-4 text-center text-slate-400 font-bold">ยังไม่มีประวัติการตั้งค่า</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    const StockManagementView = ({ products, setProducts, stockMovements, setStockMovements, isAdmin, currentUser, showToast, systemSettings, setSystemSettings, productCategories, setProductCategories, members, businessTeams }) => {
      const [activeTab, setActiveTab] = useState(() => {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const pageParam = urlParams.get('page') || 'stock';
          if (pageParam === 'products') return 'products';
        } catch(e) {}
        return 'dashboard';
      });
      const tabs = [
        { id: 'dashboard', label: '📊 ภาพรวมสต๊อก', icon: null },
        { id: 'stock_in',  label: '📥 นำเข้าสต๊อก', icon: null },
        { id: 'stock_out', label: '📤 เบิกสินค้า', icon: null },
        { id: 'movement_log', label: '📜 ประวัติการเคลื่อนไหว', icon: null },
        ...(isAdmin ? [
          { id: 'products', label: '📦 จัดการสินค้า', icon: null },
          { id: 'bundles', label: '🎁 จัดการเซ็ตโปรโมชั่น', icon: null },
          { id: 'categories', label: '🏷️ จัดการหมวดหมู่', icon: null },
          { id: 'commission_settings', label: '💵 ตั้งค่าคอมมิชชั่นสินค้า & ระบบ', icon: null },
          { id: 'margin_settings', label: '💰 ตั้งค่าจ่ายส่วนต่าง', icon: null }
        ] : [])
      ];

      return (
        <div className="space-y-5 animation-fade-in">
          <div>
            <h2 className="text-2xl font-bold text-slate-800">คลังสินค้าและสต๊อก (Inventory)</h2>
            <p className="text-sm text-slate-500 mt-1">จัดการสินค้าในคลัง รับเข้า เบิกออก และดูประวัติการเคลื่อนไหว</p>
          </div>

          <div className="flex gap-1 bg-slate-100 p-1.5 rounded-xl border border-slate-200 overflow-x-auto hide-scroll w-full">
            {tabs.map(tab => (
              <button
                key={tab.id}
                onClick={() => setActiveTab(tab.id)}
                className={`px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap transition-all flex-shrink-0 ${activeTab === tab.id ? 'bg-white text-blue-700 shadow-sm border border-slate-200' : 'text-slate-600 hover:text-slate-800'}`}
              >
                {tab.label}
              </button>
            ))}
          </div>

          {activeTab === 'dashboard' && (
            <StockDashboardTab products={products} stockMovements={stockMovements}/>
          )}
          {activeTab === 'stock_in' && (
            <StockInTab products={products} stockMovements={stockMovements} setStockMovements={setStockMovements} setProducts={setProducts} currentUser={currentUser} showToast={showToast}/>
          )}
          {activeTab === 'stock_out' && (
            <StockOutTab products={products} stockMovements={stockMovements} setStockMovements={setStockMovements} setProducts={setProducts} currentUser={currentUser} showToast={showToast}/>
          )}
          {activeTab === 'movement_log' && (
            <MovementLogTab products={products} stockMovements={stockMovements} setStockMovements={setStockMovements} showToast={showToast}/>
          )}
          {activeTab === 'products' && isAdmin && (
            <ProductsManagementView 
              products={products} 
              setProducts={setProducts} 
              isAdmin={isAdmin} 
              showToast={showToast} 
              systemSettings={systemSettings} 
              setSystemSettings={setSystemSettings}
              productCategories={productCategories}
              setProductCategories={setProductCategories}
            />
          )}
          {/* เพิ่มชุดนี้ต่อท้าย ProductsManagementView ทันทีครับ */}
          {activeTab === 'bundles' && isAdmin && (
            <BundlesManagementView 
              products={products} 
              setProducts={setProducts} 
              isAdmin={isAdmin} 
              showToast={showToast} 
              systemSettings={systemSettings} 
              setSystemSettings={setSystemSettings}
              productCategories={productCategories}
            />
          )}
          {activeTab === 'categories' && isAdmin && (
            <CategoriesManagementView 
              productCategories={productCategories}
              setProductCategories={setProductCategories}
              showToast={showToast}
            />
          )}
          {activeTab === 'commission_settings' && isAdmin && (
            <CommissionSettingsTab 
              products={products} 
              setProducts={setProducts} 
              systemSettings={systemSettings} 
              setSystemSettings={setSystemSettings}
              productCategories={productCategories}
              setProductCategories={setProductCategories}
              showToast={showToast}
              currentUser={currentUser}
              members={members}
              businessTeams={businessTeams}
            />
          )}
          {activeTab === 'margin_settings' && isAdmin && (
            <MarginSettingsTab 
              members={members}
              businessTeams={businessTeams}
              systemSettings={systemSettings}
              setSystemSettings={setSystemSettings}
              showToast={showToast}
              currentUser={currentUser}
            />
          )}
        </div>
      );
    };

    const App = () => {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [showLoginModal, setShowLoginModal] = useState(false);

      const [products, setProducts] = useState([]);
      const [systemSettings, setSystemSettings] = useState(() => {
        try {
          const saved = localStorage.getItem('stk_system_settings');
          return saved ? JSON.parse(saved) : { min_dividend_pv: 100, commission_levels: 6 };
        } catch(e) {
          return { min_dividend_pv: 100, commission_levels: 6 };
        }
      });
      const [productCategories, setProductCategories] = useState([]);
      const [customerTypes, setCustomerTypes] = useState(fallbackCustomerTypes);
      const [closers, setClosers] = useState([]);
      const [members, setMembers] = useState([]);
      const [stockMovements, setStockMovements] = useState([]);
      const [businessTeams, setBusinessTeams] = useState([]);
      const [isAppLoading, setIsAppLoading] = useState(false);
      const [isSidebarCollapsed, setIsSidebarCollapsed] = useState(() => {
        try { return localStorage.getItem('stk_sidebar_collapsed') === 'true'; } catch(e) { return false; }
      });
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
      const showToast = (message, type = 'success') => { setToast({ show: true, message, type }); };

      const SCRIPT_URL = "";
      const pagePerm = window.getUserPagePermission ? window.getUserPagePermission(currentUser, 'stock') : 'none';
      const isAdmin = currentUser && (
          String(currentUser.role).trim() === 'ผู้ดูแลระบบ' || 
          String(currentUser.role).trim().toLowerCase().includes('admin') || String(currentUser.role).trim().includes('แอดมิน') ||
          pagePerm === 'full'
      );
      const currentUserProfileUrl = currentUser?.profileUrl || '';

      useEffect(() => {
        const savedUserStr = localStorage.getItem('stk_current_user');
        if (savedUserStr) {
          try { const user = JSON.parse(savedUserStr); setCurrentUser(user); setIsLoggedIn(true); }
          catch(e) { localStorage.removeItem('stk_current_user'); }
        } else {
          setShowLoginModal(true);
        }
        const loader = document.getElementById('initial-loader');
        if (loader) loader.style.display = 'none';

        // 💡 SMART CACHING & PAGE TRANSITION SPEED FIX:
        // ตรวจสอบ cache ใน localStorage ถ้าข้อมูลยังใหม่ (ไม่เกิน 20 วินาที)
        // จะใช้งานข้อมูลเดิมทันทีโดยไม่ต้องดึงฐานข้อมูลใหม่เพื่อความเร็วในการเปลี่ยนหน้า
        let isCacheFresh = false;
        const applyStockDataToStates = (data) => {
          if (data.systemSettings) {
             setSystemSettings(prev => ({ ...prev, ...data.systemSettings }));
          }
          if (Array.isArray(data.products)) {
             const formatted = data.products.map(p => {
               const pId = p.product_id || p.id;
               const mapped = {
                 ...p,
                 id: pId,
                 name: p.name,
                 barcode: p.barcode || '',
                 category: p.category,
                 status: p.status || 'เข้าใช้งาน',
                 stock: parseInt(p.current_stock || p.stock || 0),
                 priceFull: Number(p.price_full ?? p.priceFull ?? 0) || 0,
                 priceMember: Number(p.price_member ?? p.priceMember ?? 0) || 0,
                 pricePromo: Number(p.price_promo ?? p.pricePromo ?? 0) || 0,
                 givePv: Number(p.give_pv ?? p.b2n_give_pv ?? p.givePv ?? 0) || 0,
                 minPvComm: Number(p.min_pv_comm ?? p.minPvComm ?? 0) || 0,
                 imageUrl: p.image_url || p.imageUrl || '',
                 fullMarginAmount: Number(p.full_margin_amount ?? p.fullMarginAmount ?? 0) || 0,
                 fullMarginCurrency: p.full_margin_currency ?? p.fullMarginCurrency ?? 'LAK',
                 selfFee: Number(p.self_fee ?? p.selfFee ?? 0) || 0,
                 selfPercentFull: Number(p.self_percent_full ?? p.selfPercentFull ?? 0) || 0,
                 selfPercentMember: Number(p.self_percent_member ?? p.selfPercentMember ?? 0) || 0,
                 isBundle: p.is_bundle || p.isBundle || false,
                 baseProduct: p.base_product || p.baseProduct || '',
                 bundleQty: Number(p.bundle_qty || p.bundleQty || 1)
               };
               for (let i = 1; i <= 6; i++) {
                 mapped[`level${i}Fee`] = Number(p[`level_${i}_fee`] !== undefined && p[`level_${i}_fee`] !== null ? p[`level_${i}_fee`] : (p[`level${i}Fee`] || 0)) || 0;
                 mapped[`level${i}PercentFull`] = Number(p[`level_${i}_percent_full`] !== undefined && p[`level_${i}_percent_full`] !== null ? p[`level_${i}_percent_full`] : (p[`level${i}PercentFull`] || 0)) || 0;
                 mapped[`level${i}PercentMember`] = Number(p[`level_${i}_percent_member`] !== undefined && p[`level_${i}_percent_member`] !== null ? p[`level_${i}_percent_member`] : (p[`level${i}PercentMember`] || 0)) || 0;
               }
               mapped.directFee = mapped.level1Fee;
               return mapped;
             }).sort((a, b) => (a.id || '').localeCompare(b.id || '', undefined, { numeric: true, sensitivity: 'base' }));
             setProducts(formatted);
          }
          if (Array.isArray(data.productCategories)) setProductCategories(data.productCategories);
          if (Array.isArray(data.stockMovements)) {
             const formattedMov = data.stockMovements.map(m => ({
               ...m,
               movementId: m.movement_id || m.movementId || '',
               productId: m.product_id || m.productId || '',
               type: m.type || '',
               subType: m.sub_type || m.subType || '',
               quantity: Number(m.quantity || 0),
               lotId: m.lot_id || m.lotId || '',
               notes: m.notes || '',
               createdBy: m.created_by || m.createdBy || '',
               date: m.date || m.created_at || ''
             }));
             setStockMovements(formattedMov);
          }
          if (Array.isArray(data.members)) setMembers(data.members);
          if (Array.isArray(data.closers)) setClosers(data.closers);
          if (Array.isArray(data.customerTypes)) setCustomerTypes(data.customerTypes);
          if (Array.isArray(data.businessTeams)) setBusinessTeams(data.businessTeams);
        };

        try {
            const cachedData = localStorage.getItem('stk_app_cache_data');
            const cacheTime = localStorage.getItem('stk_app_cache_time');
            if (cachedData && cacheTime) {
                const parsedData = JSON.parse(cachedData);
                // ค้นหา settings ใน cache
                let savedSettings = null;
                try {
                  const localSettingsStr = localStorage.getItem('stk_system_settings');
                  if (localSettingsStr) savedSettings = JSON.parse(localSettingsStr);
                } catch(e){}
                
                applyStockDataToStates({
                   products: parsedData.products,
                   productCategories: JSON.parse(localStorage.getItem('stk_app_cache_categories') || '[]'),
                   stockMovements: JSON.parse(localStorage.getItem('stk_app_cache_movements') || '[]'),
                   members: parsedData.members,
                   closers: parsedData.closers,
                   customerTypes: parsedData.customerTypes,
                   systemSettings: savedSettings
                });
                
                const age = Date.now() - Number(cacheTime);
                if (age < 20000) { // 20 วินาที
                    isCacheFresh = true;
                    setIsAppLoading(false);
                }
            }
        } catch (e) { console.warn("Cache error", e); }

        if (isCacheFresh) {
            return;
        }

        Promise.all([
          supabaseSelect('stk_products').catch(() => supabaseSelect('products')),
          supabaseSelect('stk_product_categories').catch(() => supabaseSelect('product_categories')),
          // ⚡ SPEED FIX: จำกัดการโหลดประวัติการรับจ่ายสินค้าเอาไว้แค่ 400 ล็อกล่าสุด ป้องกันค้าง
          supabaseSelect('stk_stock_movements', 'order=created_at.desc&limit=400').catch(() => supabaseSelect('stock_movements')),
          supabaseSelect('stk_members').catch(() => supabaseSelect('members')),
          supabaseSelect('stk_closers').catch(() => supabaseSelect('closers')),
          supabaseSelect('stk_customer_types').catch(() => supabaseSelect('customer_types')),
          supabaseSelect('stk_system_settings').catch(() => supabaseSelect('system_settings')).catch(() => []),
          supabaseSelect('stk_business_teams').catch(() => [])
        ]).then(([pRes, catRes, movRes, memRes, cloRes, typeRes, settingsRes, teamRes]) => {
          let loadedSettings = {};
          try {
            const localSaved = localStorage.getItem('stk_system_settings');
            if (localSaved) loadedSettings = JSON.parse(localSaved) || {};
          } catch(e){}
          if (Array.isArray(settingsRes) && settingsRes.length > 0) {
            settingsRes.forEach(s => {
              if (s && (s.key || s.setting_key)) {
                const k = s.key || s.setting_key;
                const v = s.value !== undefined ? s.value : s.setting_value;
                loadedSettings[k] = typeof v === 'string' ? v : JSON.stringify(v);
              }
            });
            const mainRow = settingsRes.find(s => s && (s.key === 'MAIN' || s.setting_key === 'MAIN' || s.setting_id === 'MAIN' || s.id === 'MAIN'));
            if (mainRow) {
              try {
                const rawVal = mainRow.value || mainRow.setting_value || '';
                const parsedVal = typeof rawVal === 'string' && rawVal.trim() !== '' ? JSON.parse(rawVal) : rawVal;
                if (parsedVal.commission_levels != null) loadedSettings.commission_levels = Number(parsedVal.commission_levels);
                if (parsedVal.min_dividend_pv != null) loadedSettings.min_dividend_pv = Number(parsedVal.min_dividend_pv);
              } catch(e){}
            }
          }
          if (Object.keys(loadedSettings).length > 0) {
            try { localStorage.setItem('stk_system_settings', JSON.stringify(loadedSettings)); } catch(e){}
          }

          const freshData = {
             products: pRes,
             productCategories: catRes,
             stockMovements: movRes,
             members: memRes,
             closers: cloRes,
             customerTypes: typeRes,
             systemSettings: loadedSettings,
             businessTeams: teamRes
          };

          applyStockDataToStates(freshData);

          try {
              // ซิงค์ผลิตภัณฑ์หลัก
              const resObj = JSON.parse(localStorage.getItem('stk_app_cache_data') || '{}');
              resObj.products = pRes;
              resObj.members = memRes;
              resObj.closers = cloRes;
              resObj.customerTypes = typeRes;
              localStorage.setItem('stk_app_cache_data', JSON.stringify(resObj));
              localStorage.setItem('stk_app_cache_categories', JSON.stringify(catRes));
              localStorage.setItem('stk_app_cache_movements', JSON.stringify(movRes));
              localStorage.setItem('stk_app_cache_time', String(Date.now()));
          } catch(e){}
        }).catch(err => {
          console.error("Supabase load error:", err);
        }).finally(() => {
          setIsAppLoading(false);
        });
      }, []);

      const handleLoginSuccess = (user) => {
        localStorage.setItem('stk_current_user', JSON.stringify(user));
        setCurrentUser(user); setIsLoggedIn(true); setShowLoginModal(false);
        showToast('เข้าสู่ระบบสำเร็จ!', 'success');
      };
      const handleLogout = () => {
        localStorage.removeItem('stk_current_user');
        setCurrentUser(null);
        setIsLoggedIn(false);
        const targetUrl = typeof resolvePageUrl === 'function' ? resolvePageUrl('?page=dashboard') : 'Mlm.html';
        if (typeof window !== 'undefined') window.location.href = targetUrl;
      };

      return (
        <div className="min-h-screen flex flex-col lg:flex-row font-sans bg-slate-50">
          <Sidebar
            activePage="stock"
            isLoggedIn={isLoggedIn}
            currentUser={currentUser}
            currentUserProfileUrl={currentUserProfileUrl}
            isAdmin={isAdmin}
            onLogout={handleLogout}
            showLoginModal={showLoginModal}
            setShowLoginModal={setShowLoginModal}
            SCRIPT_URL={SCRIPT_URL}
            setIsAppLoading={setIsAppLoading}
            isSidebarCollapsed={isSidebarCollapsed}
            setIsSidebarCollapsed={setIsSidebarCollapsed}
          />

          <main className={`flex-1 flex flex-col min-h-screen bg-slate-50 transition-all duration-300 ${isSidebarCollapsed ? 'lg:ml-20' : 'lg:ml-64'} w-full overflow-x-hidden`}>

            {toast.show && ReactDOM.createPortal(
              <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[999999] flex items-center justify-center p-4 animation-fade-in" style={{animationDuration:'0.2s'}}>
                <div className={`bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center animation-pop border-t-4 ${toast.type==='error'?'border-red-500':toast.type==='info'?'border-blue-500':'border-emerald-500'}`}>
                  <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${toast.type==='error'?'bg-red-100 text-red-500':toast.type==='info'?'bg-blue-100 text-blue-500':'bg-emerald-100 text-emerald-500'}`}>
                    {toast.type==='error'?<X size={32}/>:toast.type==='info'?<Trophy size={32}/>:<CheckCircle size={32}/>}
                  </div>
                  <h3 className="text-xl font-bold text-slate-800 mb-2">{toast.type==='error'?'เกิดข้อผิดพลาด':toast.type==='info'?'แจ้งเตือน':'สำเร็จ!'}</h3>
                  <p className="text-slate-600 font-medium text-sm mb-6">{toast.message}</p>
                  <button onClick={() => setToast({...toast, show:false})} className="w-full py-2.5 rounded-lg font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">ตกลง</button>
                </div>
              </div>
            , document.body)}

            <div className="p-3 sm:p-6 flex-1 w-full">
              {isAppLoading ? (
                <div className="flex flex-col items-center justify-center py-32 gap-5">
                  <div className="w-16 h-16 border-[4px] border-slate-200 border-t-blue-600 rounded-full animate-spin"></div>
                  <h2 className="text-lg font-bold text-slate-700">กำลังโหลดข้อมูลคลังสินค้า...</h2>
                </div>
              ) : isLoggedIn ? (
                <StockManagementView
                  products={products}
                  setProducts={setProducts}
                  stockMovements={stockMovements}
                  setStockMovements={setStockMovements}
                  isAdmin={isAdmin}
                  currentUser={currentUser}
                  showToast={showToast}
                  systemSettings={systemSettings}
                  setSystemSettings={setSystemSettings}
                  productCategories={productCategories}
                  setProductCategories={setProductCategories}
                  members={members}
                  businessTeams={businessTeams}
                />
              ) : (
                <div className="flex flex-col items-center justify-center py-32 gap-5">
                  <h2 className="text-xl font-black text-red-500">กรุณาเข้าสู่ระบบก่อนเข้าใช้งาน</h2>
                  <button onClick={() => setShowLoginModal(true)} className={btnClassPrimary}>เข้าสู่ระบบ</button>
                </div>
              )}
            </div>

            <footer className="w-full text-center py-6 mt-auto border-t border-slate-200/50 no-print">
              <p className="text-[11px] font-bold text-slate-400 opacity-60">&copy; {new Date().getFullYear()} STK Sales Management System.</p>
            </footer>
          </main>

          <LoginModal isOpen={showLoginModal} onClose={() => setShowLoginModal(false)} onLoginSuccess={handleLoginSuccess} systemUsers={[]}/>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
