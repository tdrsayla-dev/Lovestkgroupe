                            </select>
                        </div>
                        <div>
                            <label className={`${labelClassHud} text-indigo-700`}>จำนวนที่ต้องตัดต่อ 1 เซ็ต *</label>
                            <input type="number" min="1" required className={`${inputClassHud} border-indigo-200 focus:border-indigo-500`} value={formData.bundleQty} onChange={e=>setFormData({...formData,bundleQty:parseInt(e.target.value)||1})} />
                        </div>
                        <div className="md:col-span-2">
                             <label className={labelClassHud}>หมวดหมู่การคิดคอมมิชชั่น (ใช้แบบ % หรือ แบบกล่อง)</label>
                             <select className={inputClassHud} value={formData.category} onChange={e => setFormData({ ...formData, category: e.target.value })}>
                                 {(productCategories || []).map(cat => <option key={cat.id || cat.name} value={cat.name}>{cat.name}</option>)}
                             </select>
                        </div>
                    </div>
                   <div className="pt-4 border-t border-slate-100">
                       <h4 className="font-bold text-slate-700 mb-3 flex items-center gap-2"><Coins size={18} className="text-blue-500"/> ตั้งค่าราคาและแต้มของเซ็ตนี้</h4>
                       <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3">
                           {renderNumberInput("ราคาเต็ม (บาท)", "priceFull", "slate")}
                           {renderNumberInput("ราคาสมาชิก (บาท)", "priceMember", "slate")}
                           {renderNumberInput("ราคาโปร (บาท)", "pricePromo", "slate")}
                           {renderNumberInput("คะแนน PV (ต่อ 1 เซ็ต)", "givePv", "amber")}
                           {renderNumberInput("คะแนนปันผลขั้นต่ำ", "minPvComm", "amber")}
                       </div>
                   </div>
                   {(() => {
                      const selectedCat = productCategories.find(c => c && c.name && c.name.trim().toLowerCase() === String(formData.category || '').trim().toLowerCase());
                     const commMode = selectedCat?.commissionMode || 'จ่ายตามกล่อง';
                     if (commMode === 'เปอร์เซ็นต์') {
                       return (
                         <div className="pt-4 border-t border-slate-100 space-y-4">
                           <div>
                             <h4 className="font-bold text-indigo-700 mb-1 flex items-center gap-2">
                               <Trophy size={18} className="text-indigo-600"/> ตั้งค่าคอมมิชชั่นเปอร์เซ็นต์ (%) สำหรับ ราคาเต็ม
                             </h4>
                             <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                               {renderNumberInput("ตัวเอง (%)", "selfPercentFull", "indigo")}
                               {Array.from({ length: maxLevels - 1 }).map((_, idx) => renderNumberInput(`แนะนำชั้นที่ ${idx + 1} (%)`, `level${idx + 1}PercentFull`, "indigo"))}
                             </div>
                           </div>
                         </div>
                       );
                     } else {
                       return (
                         <div className="pt-4 border-t border-slate-100">
                           <h4 className="font-bold text-emerald-700 mb-1 flex items-center gap-2">
                             <Trophy size={18} className="text-emerald-600"/> ตั้งค่าคอมมิชชั่นคงที่ต่อ 1 เซ็ต (หน่วย: กีบ)
                           </h4>
                           <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                             {renderNumberInput("ตัวเอง", "selfFee", "emerald")}
                             {Array.from({ length: maxLevels - 1 }).map((_, idx) => renderNumberInput(`แนะนำชั้นที่ ${idx + 1}`, `level${idx + 1}Fee`, "emerald"))}
                           </div>
                         </div>
                       );
                     }
                   })()}
                   
                   <div className="pt-4 border-t border-slate-100 bg-amber-50/60 p-4 rounded-2xl border border-amber-200">
                        <h4 className="font-bold text-amber-900 mb-1 flex items-center gap-2 text-xs sm:text-sm">
                            <Trophy size={18} className="text-amber-600"/> 🎁 ตั้งค่าส่วนต่างการขายเฉพาะราคาเต็ม (Retail Margin Bonus)
                        </h4>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div className="bg-white p-3 rounded-xl border border-amber-200">
                              <label className={labelClassHud + " text-amber-900 font-bold"}>จำนวนเงินส่วนต่าง</label>
                              <input 
                                  type="text" 
                                  className={inputClassHud + " border-amber-300 focus:border-amber-500 font-bold text-amber-900 text-sm"} 
                                  value={formData.fullMarginAmount !== undefined && formData.fullMarginAmount !== null ? Number(formData.fullMarginAmount).toLocaleString() : ''} 
                                  onChange={e => {
                                      const rawValue = e.target.value.replace(/,/g, '').replace(/[^0-9]/g, '');
                                      setFormData({...formData, fullMarginAmount: rawValue ? Number(rawValue) : 0});
                                  }}
                                  placeholder="0"
                              />
                            </div>
                            <div className="bg-white p-3 rounded-xl border border-amber-200">
                              <label className={labelClassHud + " text-amber-900 font-bold"}>สกุลเงินที่จ่ายส่วนต่าง</label>
                              <select 
                                  className={inputClassHud + " border-amber-300 focus:border-amber-500 font-bold text-amber-900 text-sm"} 
                                  value={formData.fullMarginCurrency || 'LAK'} 
                                  onChange={e => setFormData({...formData, fullMarginCurrency: e.target.value})}
                              >
                                  <option value="LAK">₭ เงินกีบ (LAK)</option>
                                  <option value="THB">฿ เงินบาท (THB)</option>
                              </select>
                            </div>
                        </div>
                    </div>

                   <div className="text-right pt-4 border-t border-slate-100 mt-2 flex justify-end gap-3">
                       <button type="button" onClick={()=>setShowForm(false)} className={btnClassSecondary}>ยกเลิก</button>
                       <button type="submit" disabled={isSubmitting} className={btnClassPrimary}>{isSubmitting ? 'กำลังบันทึก...' : 'บันทึกโปรโมชั่น'}</button>
                   </div>
                 </form>
             </EditModal>
             <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
               <h2 className="text-2xl font-bold text-slate-800">จัดการเซ็ตโปรโมชั่น (Combo & Bundles)</h2>
               <div className="flex w-full sm:w-auto items-center gap-3">
                  <div className="flex items-center bg-slate-50/30 focus-within:bg-white border border-slate-200 rounded-xl px-3 shadow-sm focus-within:border-blue-500 transition-all duration-300 flex-1 sm:w-72 h-[38px] sm:h-[40px]">
                     <SearchIcon size={18} className="text-slate-400 shrink-0" />
                     <input type="text" placeholder="ค้นหารหัส หรือ ชื่อโปรโมชั่น..." className="w-full bg-transparent border-none outline-none text-[13px] font-medium text-slate-800 placeholder-slate-400 pl-2 h-full" value={searchTerm} onChange={e => setSearchTerm(e.target.value)} />
                  </div>
                  <button onClick={handleOpenAdd} className={`${btnClassPrimary} shrink-0 bg-indigo-600 hover:bg-indigo-700 border-indigo-600`}><Plus size={18}/> สร้างเซ็ตโปรโมชั่น</button>
               </div>
             </div>
             <div className={`${boxWrapper} p-0 overflow-hidden`}>
                 <div className="overflow-x-auto">
                     <table className="w-full text-left min-w-[1000px]">
                         <thead>
                             <tr className="bg-indigo-50">
                                 <th className={tableHeaderClass + " text-indigo-800"}>รหัสโปร</th>
                                 <th className={tableHeaderClass + " text-indigo-800"}>ชื่อเซ็ตโปรโมชั่น</th>
                                 <th className={tableHeaderClass + " text-indigo-800"}>ตัดสต๊อกสินค้าหลัก</th>
                                 <th className={`${tableHeaderClass} text-right text-indigo-800`}>ราคาเต็ม</th>
                                 <th className={`${tableHeaderClass} text-right text-indigo-800`}>ราคาโปร</th>
                                 <th className={`${tableHeaderClass} text-right text-indigo-800`}>แต้ม (PV)</th>
                                 <th className={`${tableHeaderClass} text-indigo-800`}>ค่าแนะนำ (Commissions)</th>
                                 <th className={`${tableHeaderClass} text-center text-indigo-800`}>จัดการ</th>
                             </tr>
                         </thead>
                         <tbody>
                         {filteredBundles.map(p=>(
                             <tr key={p?.id} className="hover:bg-indigo-50/30 transition-colors">
                                 <td className={tableCellClass + " font-bold text-slate-500"}>{p?.id}</td>
                                 <td className={`${tableCellClass} text-indigo-700 font-bold`}>{p?.name}</td>
                                 <td className={tableCellClass}>
                                    <span className="text-[11px] bg-slate-100 px-2 py-1 rounded border border-slate-200 text-slate-600 font-bold flex items-center gap-1.5 w-fit">
                                        📦 ตัด "{p?.baseProduct}" จำนวน {p?.bundleQty} กล่อง
                                    </span>
                                 </td>
                                 <td className={`${tableCellClass} text-right font-bold text-slate-700`}>{Number(p?.priceFull || 0).toLocaleString()}</td>
                                 <td className={`${tableCellClass} text-right font-bold text-slate-700`}>{Number(p?.pricePromo || 0).toLocaleString()}</td>
                                 <td className={`${tableCellClass} text-right font-black text-amber-600`}>{Number(p?.givePv || 0).toLocaleString()}</td>
                                 <td className={tableCellClass}>
                                     {(() => {
                                          const catObj = productCategories.find(c => c && c.name && c.name.trim().toLowerCase() === String(p?.category || '').trim().toLowerCase());
                                         const isPct = catObj?.commissionMode === 'เปอร์เซ็นต์';
                                         if (isPct) return (<div className="text-[11px] font-semibold text-indigo-600">ราคาเต็ม: {p?.selfPercentFull || 0}% &rarr; {p?.level1PercentFull || 0}% ...</div>);
                                         return (<div className="text-[11px] font-bold text-emerald-600">กล่อง: {Number(p?.selfFee || 0).toLocaleString()} &rarr; {Number(p?.level1Fee || p?.directFee || 0).toLocaleString()} ...</div>);
                                     })()}
                                 </td>
                                 <td className={`${tableCellClass} text-center whitespace-nowrap`}><button onClick={()=>handleOpenEdit(p)} className="text-blue-500 hover:text-blue-700 mx-1 transition-colors bg-white p-1.5 rounded-lg border border-slate-200 shadow-sm"><Edit size={16}/></button>{isAdmin && <button onClick={()=>setConfirmDelete({show: true, id: p.id, title: p.name})} className="text-red-500 hover:text-red-700 transition-colors bg-white p-1.5 rounded-lg border border-slate-200 shadow-sm"><Trash2 size={16}/></button>}</td>
                             </tr>
                         ))}
                         {filteredBundles.length === 0 && <tr><td colSpan="8" className="p-10 text-center text-slate-500 font-bold bg-slate-50/50">ยังไม่มีข้อมูลเซ็ตโปรโมชั่น</td></tr>}
                         </tbody>
                     </table>
                 </div>
             </div>
           </div>
         );
    };
    const CategoriesManagementView = ({ productCategories, setProductCategories, showToast }) => {
      const [editingId, setEditingId] = useState(null);
      const [editName, setEditName] = useState('');
      const [editMode, setEditMode] = useState('จ่ายตามกล่อง');
      
      const [newName, setNewName] = useState('');
      const [newMode, setNewMode] = useState('จ่ายตามกล่อง');
      const [confirmDelete, setConfirmDelete] = useState({ show: false, id: null, name: '' });
      const [isSubmitting, setIsSubmitting] = useState(false);

      const handleStartEdit = (cat) => {
        setEditingId(cat.id);
        setEditName(cat.name);
        setEditMode(cat.commissionMode || 'จ่ายตามกล่อง');
      };

      const handleSave = (catId) => {
        if (!editName.trim()) { showToast('กรุณาระบุชื่อหมวดหมู่', 'error'); return; }
        setIsSubmitting(true);
        if (window.SUPABASE_REST_URL) {
           supabaseUpdate('stk_product_categories', catId, { name: editName.trim(), commission_mode: editMode }, 'category_id').then(() => {
              setProductCategories(prev => prev.map(c => c.id === catId ? { ...c, name: editName.trim(), commissionMode: editMode } : c));
              setEditingId(null);
              setIsSubmitting(false);
              showToast('แก้ไขหมวดหมู่สำเร็จ', 'success');
           }).catch(err => {
              setIsSubmitting(false); showToast('ข้อผิดพลาด Supabase: ' + err.message, 'error');
           });
        }
      };

      const handleAddCategory = (e) => {
        e.preventDefault();
        if (!newName.trim()) { showToast('กรุณาระบุชื่อหมวดหมู่', 'error'); return; }
        setIsSubmitting(true);
        if (window.SUPABASE_REST_URL) {
          const newCatId = 'CAT' + Math.floor(Math.random() * 1000);
          const newCat = { category_id: newCatId, name: newName.trim(), status: 'เข้าใช้งาน', commission_mode: newMode };
          supabaseInsert('stk_product_categories', newCat).then(() => {
            setProductCategories(prev => [...prev, { id: newCatId, name: newName.trim(), status: 'เข้าใช้งาน', commissionMode: newMode }]);
            setNewName('');
            setNewMode('จ่ายตามกล่อง');
            setIsSubmitting(false);
            showToast('เพิ่มหมวดหมู่สำเร็จ', 'success');
          }).catch(err => {
             setIsSubmitting(false); showToast('ข้อผิดพลาด Supabase: ' + err.message, 'error');
          });
        }
      };

      const handleDeleteCategory = (catId) => {
        setIsSubmitting(true);
        supabaseDelete('stk_product_categories', catId, 'category_id').then(() => {
          setProductCategories(prev => prev.filter(c => c.id !== catId));
          setConfirmDelete({ show: false, id: null, name: '' });
          setIsSubmitting(false);
          showToast('ลบหมวดหมู่สำเร็จ', 'success');
        }).catch(err => {
          setIsSubmitting(false); showToast('ข้อผิดพลาด Supabase: ' + err.message, 'error');
        });
      };

      return (
        <div className="space-y-6 animation-fade-in">
          <ConfirmModal 
            isOpen={confirmDelete.show} 
            onClose={() => setConfirmDelete({ show: false, id: null, name: '' })} 
            onConfirm={() => handleDeleteCategory(confirmDelete.id)} 
            title="ยันยันการลบหมวดหมู่" 
            message={`คุณต้องการลบหมวดหมู่สินค้า "${confirmDelete.name}" ใช่หรือไม่?`} 
          />

          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-2xl font-bold text-slate-800 font-sans">จัดการหมวดหมู่สินค้า (Product Categories)</h2>
              <p className="text-sm text-slate-500 mt-1">กำหนดประเภทการคิดคอมมิชชั่น (จ่ายตามกล่อง / เปอร์เซ็นต์) ของแต่ละหมวดหมู่</p>
            </div>
          </div>

          <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-200/80 space-y-4">
            <h3 className="text-md font-bold text-slate-800 flex items-center gap-2">➕ เพิ่มหมวดหมู่สินค้าใหม่</h3>
            <form onSubmit={handleAddCategory} className="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
              <div>
                <label className="text-[11px] font-bold text-slate-600 block mb-1.5">ชื่อหมวดหมู่สินค้า</label>
                <input 
                  type="text" 
                  className={inputClassHud} 
                  value={newName} 
                  onChange={e => setNewName(e.target.value)} 
                  placeholder="เช่น สมุนไพร, เครื่องสำอาง..." 
                />
              </div>
              <div>
                <label className="text-[11px] font-bold text-slate-600 block mb-1.5">รูปแบบการคิดคอมมิชชั่นค่าแนะนำ</label>
                <select 
                  className={inputClassHud} 
                  value={newMode} 
                  onChange={e => setNewMode(e.target.value)}
                >
                  <option value="จ่ายตามกล่อง">จ่ายตามกล่อง (Fixed Box)</option>
                  <option value="เปอร์เซ็นต์">จ่ายเปอร์เซ็นต์ (% of Price)</option>
                </select>
              </div>
              <button 
                type="submit" 
                disabled={isSubmitting} 
                className={`${btnClassPrimary} h-[40px] justify-center`}
              >
                {isSubmitting ? 'กำลังบันทึก...' : 'เพิ่มหมวดหมู่ใหม่'}
              </button>
            </form>
          </div>

          <div className={`${boxWrapper} p-0 overflow-hidden`}>
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-slate-800 text-white">
                    <th className="py-3 px-4 font-black uppercase text-[12px] tracking-wide w-28">รหัส</th>
                    <th className="py-3 px-4 font-black uppercase text-[12px] tracking-wide">ชื่อหมวดหมู่</th>
                    <th className="py-3 px-4 font-black uppercase text-[12px] tracking-wide w-64">ประเภทคอมมิชชั่น</th>
                    <th className="py-3 px-4 font-black uppercase text-[12px] tracking-wide text-center w-40">จัดการ</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {productCategories.map(cat => (
                    <tr key={cat.id} className="hover:bg-slate-50 transition-colors">
                      <td className="py-3 px-4 text-xs font-bold text-slate-500">{cat.id}</td>
                      <td className="py-3 px-4 text-sm font-bold text-slate-700">
                        {editingId === cat.id ? (
                          <input type="text" className={`${inputClassHud} !py-1 text-xs`} value={editName} onChange={e => setEditName(e.target.value)} />
                        ) : (
                          cat.name
                        )}
                      </td>
                      <td className="py-3 px-4 text-sm">
                        {editingId === cat.id ? (
                          <select className={`${inputClassHud} !py-1 text-xs`} value={editMode} onChange={e => setEditMode(e.target.value)}>
                            <option value="จ่ายตามกล่อง">จ่ายตามกล่อง (Fixed Box)</option>
                            <option value="เปอร์เซ็นต์">จ่ายเปอร์เซ็นต์ (% of Price)</option>
                          </select>
                        ) : (
                          <span className={`px-2.5 py-1 rounded-lg text-xs font-bold ${cat.commissionMode === 'เปอร์เซ็นต์' ? 'bg-indigo-50 border border-indigo-200 text-indigo-700' : 'bg-emerald-50 border border-emerald-200 text-emerald-700'}`}>
                            {cat.commissionMode === 'เปอร์เซ็นต์' ? 'เปอร์เซ็นต์ (%)' : 'จ่ายตามกล่อง'}
                          </span>
                        )}
                      </td>
                      <td className="py-3 px-4 text-center">
                        {editingId === cat.id ? (
                          <div className="flex gap-1.5 justify-center">
                            <button onClick={() => handleSave(cat.id)} disabled={isSubmitting} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-[11px] rounded-lg transition-colors shadow-sm">
                              {isSubmitting ? '...' : 'บันทึก'}
                            </button>
                            <button onClick={() => setEditingId(null)} className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-[11px] rounded-lg transition-colors border border-slate-200">
                              ยกเลิก
                            </button>
                          </div>
                        ) : (
                          <div className="flex gap-1.5 justify-center">
                            <button onClick={() => handleStartEdit(cat)} className="text-blue-500 hover:text-blue-700 bg-white p-1.5 rounded-lg border border-slate-200 shadow-sm transition-colors">
                              <Edit size={14} />
                            </button>
                            <button onClick={() => setConfirmDelete({ show: true, id: cat.id, name: cat.name })} className="text-red-500 hover:text-red-700 bg-white p-1.5 rounded-lg border border-slate-200 shadow-sm transition-colors">
                              <Trash2 size={14} />
                            </button>
                          </div>
                        )}
                      </td>
                    </tr>
                  ))}
                  {productCategories.length === 0 && (
                    <tr><td colSpan="4" className="p-8 text-center text-slate-400 font-bold">ไม่มีข้อมูลหมวดหมู่สินค้า</td></tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    const CommissionSettingsTab = ({ products, setProducts, systemSettings, setSystemSettings, productCategories, setProductCategories, showToast, currentUser, members, businessTeams }) => {
        const [editableProducts, setEditableProducts] = useState([]);
        const [levelsInput, setLevelsInput] = useState(Number(systemSettings?.commission_levels || 6));
        const [minDivPvInput, setMinDivPvInput] = useState(Number(systemSettings?.min_dividend_pv || 100));
        const history = useMemo(() => {
            try {
                return systemSettings.commission_condition_history ? (typeof systemSettings.commission_condition_history === 'string' ? JSON.parse(systemSettings.commission_condition_history) : systemSettings.commission_condition_history) : [];
            } catch(e) {
                return [];
            }
        }, [systemSettings.commission_condition_history]);
        const [commConditionConfig, setCommConditionConfig] = useState(() => {
            if (systemSettings?.commission_condition_config) {
                try {
                    const parsed = typeof systemSettings.commission_condition_config === 'string' ? JSON.parse(systemSettings.commission_condition_config) : systemSettings.commission_condition_config;
                    if (parsed && typeof parsed === 'object') {
                        return {
                            is_enabled: parsed.is_enabled === true || parsed.is_enabled === 'true',
                            min_boxes: (!isNaN(Number(parsed.min_boxes)) && parsed.min_boxes !== null) ? Number(parsed.min_boxes) : 0,
                            target_scope: parsed.target_scope || 'all',
                            selected_teams: Array.isArray(parsed.selected_teams) ? parsed.selected_teams : [],
                            selected_members: Array.isArray(parsed.selected_members) ? parsed.selected_members : [],
                            exclude_teams: Array.isArray(parsed.exclude_teams) ? parsed.exclude_teams : [],
                            exclude_members: Array.isArray(parsed.exclude_members) ? parsed.exclude_members : []
                        };
                    }
                } catch(e) {}
            }
            return {
                is_enabled: false,
                min_boxes: 0,
                target_scope: 'all',
                selected_teams: [],
                selected_members: [],
                exclude_teams: [],
                exclude_members: []
            };
        });

        useEffect(() => {
            if (systemSettings?.commission_condition_config) {
                try {
                    const parsed = typeof systemSettings.commission_condition_config === 'string' ? JSON.parse(systemSettings.commission_condition_config) : systemSettings.commission_condition_config;
                    if (parsed && typeof parsed === 'object') {
                        setCommConditionConfig(prev => ({
                            ...prev,
                            is_enabled: parsed.is_enabled === true || parsed.is_enabled === 'true',
                            min_boxes: (!isNaN(Number(parsed.min_boxes)) && parsed.min_boxes !== null) ? Number(parsed.min_boxes) : 0,
                            target_scope: parsed.target_scope || 'all',
                            selected_teams: Array.isArray(parsed.selected_teams) ? parsed.selected_teams : [],
                            selected_members: Array.isArray(parsed.selected_members) ? parsed.selected_members : [],
                            exclude_teams: Array.isArray(parsed.exclude_teams) ? parsed.exclude_teams : [],
                            exclude_members: Array.isArray(parsed.exclude_members) ? parsed.exclude_members : []
                        }));
                    }
                } catch(e) {}
            }
        }, [systemSettings.commission_condition_config]);

        const [memberSearchQuery, setMemberSearchQuery] = useState('');

        const formattedMembersList = useMemo(() => {
            return (members || []).map(m => {
                const id = String(m.id || m.member_id || m.user_id || m.code || m.memberId || m.sellerId || '').trim();
                const name = String(m.name || m.member_name || m.full_name || m.memberName || id).trim();
                const team = String(m.team || m.team_name || '').trim();
                return { id, name, team };
            }).filter(m => m.id !== '' && m.id !== 'undefined');
        }, [members]);

        const filteredMembers = useMemo(() => {
            if (!memberSearchQuery.trim()) return [];
            const q = memberSearchQuery.trim().toLowerCase();
            return formattedMembersList.filter(m => 
                m.id.toLowerCase().includes(q) || 
                m.name.toLowerCase().includes(q) ||
                m.team.toLowerCase().includes(q)
            ).slice(0, 10);
        }, [formattedMembersList, memberSearchQuery]);

        const availableTeamsList = useMemo(() => {
            let list = [];
            if (Array.isArray(businessTeams) && businessTeams.length > 0) {
                businessTeams.forEach(bt => {
                    const name = typeof bt === 'string' ? bt : (bt.name || bt.team_name || bt.team || bt.id);
                    if (name && typeof name === 'string' && name.trim() !== '') {
                        list.push(name.trim());
                    }
                });
            }
            if (Array.isArray(members) && members.length > 0) {
                members.forEach(m => {
                    const t = String(m.team || m.team_name || '').trim();
                    if (t && t !== 'undefined' && t !== 'null' && t !== '' && !list.includes(t)) {
                        list.push(t);
                    }
                });
            }
            if (list.length === 0) {
                list = ['TEAM LEE', 'Marketing', 'TEAM THAILAND', 'Center'];
            }
            return [...new Set(list)];
        }, [businessTeams, members]);

        const saveCommConditionDirectly = (configToSave) => {
            const newHistoryEntry = {
                id: Date.now().toString(),
                date: new Date().toLocaleString('th-TH'),
                user: currentUser?.name || 'Administrator',
                is_enabled: configToSave.is_enabled,
                min_boxes: configToSave.min_boxes,
                target_scope: configToSave.target_scope || 'all',
                exclude_teams_count: (configToSave.exclude_teams || []).length,
                exclude_members_count: (configToSave.exclude_members || []).length
            };
            const updatedHistory = [newHistoryEntry, ...(Array.isArray(history) ? history : [])].slice(0, 50);

            const updatedSettings = {
                ...systemSettings,
                commission_condition_config: JSON.stringify(configToSave),
                commission_condition_history: JSON.stringify(updatedHistory)
            };
            setSystemSettings(updatedSettings);
            try {
                localStorage.setItem('stk_system_settings', JSON.stringify(updatedSettings));
                window.dispatchEvent(new Event('storage'));
            } catch(e){}
            if (typeof window.saveSystemSettingToSupabase === 'function') {
                window.saveSystemSettingToSupabase('commission_condition_config', configToSave);
                window.saveSystemSettingToSupabase('commission_condition_history', updatedHistory);
            } else if (typeof supabaseUpsert === 'function') {
                supabaseUpsert('stk_system_settings', {
                    key: 'commission_condition_config',
                    value: JSON.stringify(configToSave)
                }).catch(() => {});
                supabaseUpsert('stk_system_settings', {
                    key: 'commission_condition_history',
                    value: JSON.stringify(updatedHistory)
                }).catch(() => {});
            }
            if (typeof showToast === 'function') {
                showToast('บันทึกตั้งค่าเงื่อนไขยอดขายส่วนตัวเรียบร้อยแล้ว', 'success');
            }
        };

        const [isSaving, setIsSaving] = useState(false);

        const [selectedProdIds, setSelectedProdIds] = useState([]);
        const [batchSearchTerm, setBatchSearchTerm] = useState('');
        const [batchCatFilter, setBatchCatFilter] = useState('ALL');
        const [tableSearchTerm, setTableSearchTerm] = useState('');
        
        const [customLevelVal, setCustomLevelVal] = useState('');
        const [customLevelsList, setCustomLevelsList] = useState([]);

        const [batchRates, setBatchRates] = useState({});

        const handleAddCustomLevel = () => {
            const num = parseInt(customLevelVal, 10);
            if (isNaN(num) || num < 2) {
                showToast('กรุณาระบุจำนวนระดับชั้นเป็นตัวเลขตั้งแต่ 2 ขึ้นไป', 'error');
                return;
            }
            if (!customLevelsList.includes(num)) {
                setCustomLevelsList(prev => [...prev, num].sort((a, b) => a - b));
            }
            setLevelsInput(num);
            setCustomLevelVal('');
            showToast(`ปรับเปลี่ยนจำนวนระดับชั้นเป็น ${num} ชั้น เรียบร้อย!`, 'success');
        };

        useEffect(() => {
            if (products) setEditableProducts(JSON.parse(JSON.stringify(products)));
        }, [products]);

        useEffect(() => {
            if (systemSettings) {
                const lvl = Number(systemSettings.commission_levels);
                if (lvl >= 2) setLevelsInput(lvl);
                const mpv = Number(systemSettings.min_dividend_pv);
                if (mpv > 0) setMinDivPvInput(mpv);
            }
        }, [systemSettings]);

        const handleBatchRateChange = (field, val) => {
            setBatchRates(prev => ({ ...prev, [field]: Number(val) || 0 }));
        };

        const filteredProdsForBatch = editableProducts.filter(p => {
            if (!p) return false;
            const matchSearch = batchSearchTerm === '' || (p.name || '').toUpperCase().includes(batchSearchTerm.toUpperCase()) || (p.id || '').toUpperCase().includes(batchSearchTerm.toUpperCase());
            const matchCat = batchCatFilter === 'ALL' || String(p.category || '').trim().toLowerCase() === String(batchCatFilter).trim().toLowerCase();
            return matchSearch && matchCat;
        });

        const toggleSelectAllBatch = () => {
            const visibleIds = filteredProdsForBatch.map(p => p.id);
            const allSelected = visibleIds.every(id => selectedProdIds.includes(id));
            if (allSelected) {
                setSelectedProdIds(prev => prev.filter(id => !visibleIds.includes(id)));
            } else {
                setSelectedProdIds(prev => Array.from(new Set([...prev, ...visibleIds])));
            }
        };

        const handleApplyBatchRates = () => {
            if (selectedProdIds.length === 0) {
                showToast('กรุณาเลือกสินค้าอย่างน้อย 1 รายการก่อนปรับเปลี่ยน', 'error');
                return;
            }

            const updated = editableProducts.map(p => {
                if (selectedProdIds.includes(p.id)) {
                    const copy = { ...p };
                    Object.keys(batchRates).forEach(field => {
                        copy[field] = Number(batchRates[field]) || 0;
                    });
                    return copy;
                }
                return p;
            });

            setEditableProducts(updated);
            showToast(`ปรับเปลี่ยนอัตราคอมมิชชั่นกับสินค้า ${selectedProdIds.length} รายการสำเร็จ!`, 'success');
        };

        const handleInputChange = (index, field, value) => {
            const updated = [...editableProducts];
            updated[index][field] = Number(value) || 0;
            setEditableProducts(updated);
        };

        const handleSaveAll = async (e) => {
            e.preventDefault();
            setIsSaving(true);
            const numLevels = Number(levelsInput) >= 2 ? Number(levelsInput) : 6;
            const numMinPv = Number(minDivPvInput) > 0 ? Number(minDivPvInput) : 100;

            const newHistoryEntry = {
                id: Date.now().toString(),
                date: new Date().toLocaleString('th-TH'),
                user: currentUser?.name || 'Administrator',
                is_enabled: commConditionConfig.is_enabled,
                min_boxes: commConditionConfig.min_boxes
            };
            const updatedHistory = [newHistoryEntry, ...history].slice(0, 50);
            const updatedSettings = {
                ...systemSettings,
                commission_levels: numLevels,
                min_dividend_pv: numMinPv,
                commission_condition_config: JSON.stringify(commConditionConfig),
                commission_condition_history: JSON.stringify(updatedHistory)
            };

            setSystemSettings(updatedSettings);
            try {
                localStorage.setItem('stk_system_settings', JSON.stringify(updatedSettings));
            } catch(e){}

            // Try to save system settings to Supabase safely using Key-Value format
            if (typeof window.saveSystemSettingToSupabase === 'function') {
                window.saveSystemSettingToSupabase('MAIN', { commission_levels: numLevels, min_dividend_pv: numMinPv });
                window.saveSystemSettingToSupabase('commission_condition_config', commConditionConfig);
                window.saveSystemSettingToSupabase('commission_condition_history', updatedHistory);
            } else if (typeof supabaseUpsert === 'function') {
                supabaseUpsert('stk_system_settings', {
                    key: 'MAIN',
                    value: JSON.stringify({
                        commission_levels: numLevels,
                        min_dividend_pv: numMinPv
                    })
                }).catch(() => {});
                supabaseUpsert('stk_system_settings', {
                    key: 'commission_condition_config',
                    value: JSON.stringify(commConditionConfig)
                }).catch(() => {});
                supabaseUpsert('stk_system_settings', {
                    key: 'commission_condition_history',
                    value: JSON.stringify(updatedHistory)
                }).catch(() => {});
            }

            // Save all products commission data state locally and update Supabase safely
            if (Array.isArray(editableProducts) && typeof window.supabaseUpdate === 'function') {
                const updatePromises = editableProducts.map(p => {
                    const supaData = {
                        self_fee: Number(p.selfFee || 0)
                    };
                    if (p.selfPercentFull !== undefined) supaData.self_percent_full = Number(p.selfPercentFull || 0);
                    if (p.selfPercentMember !== undefined) supaData.self_percent_member = Number(p.selfPercentMember || 0);
                    
                    for (let i = 1; i <= Math.min(numLevels, 6); i++) {
                        supaData[`level_${i}_fee`] = Number(p[`level${i}Fee`] || 0);
                        if (p[`level${i}PercentFull`] !== undefined) supaData[`level_${i}_percent_full`] = Number(p[`level${i}PercentFull`] || 0);
                        if (p[`level${i}PercentMember`] !== undefined) supaData[`level_${i}_percent_member`] = Number(p[`level${i}PercentMember`] || 0);
                    }
                    return supabaseUpdate('stk_products', p.id, supaData, 'product_id').catch(err => {
                        console.warn('Supabase product update fallback:', err);
                    });
                });
                await Promise.all(updatePromises);
            }

            setProducts(editableProducts);
            setIsSaving(false);
            if (typeof window.clearDbCache === 'function') {
                window.clearDbCache();
            } else {
                try { sessionStorage.removeItem('stkDbCache'); } catch(e){}
            }
            showToast('บันทึกการตั้งค่าระดับชั้น คอมมิชชั่น และปันผลเรียบร้อย!', 'success');
        };

        return (
            <div className="space-y-6 animation-fade-in">
                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                    <h3 className="text-lg font-black text-slate-800 flex items-center gap-2">⚙️ ตั้งค่าระดับชั้นคอมมิชชั่นและเงื่อนไขปันผล</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                        <div className="md:col-span-1">
                            <label className="text-xs font-bold text-slate-600 block mb-1.5">เลือกจำนวนระดับชั้นจ่ายคอมมิชชั่น</label>
                            <select className={inputClassHud} value={levelsInput} onChange={e => setLevelsInput(Number(e.target.value))}>
                                {Array.from(new Set([...Array.from({ length: 19 }, (_, i) => i + 2), ...customLevelsList, levelsInput])).sort((a, b) => a - b).map(val => (
                                    <option key={val} value={val}>{val} ชั้น (ตัวเอง + แนะนำ {val - 1} ชั้น)</option>
                                ))}
                            </select>
                        </div>
                        <div className="md:col-span-1">
                            <label className="text-xs font-bold text-slate-600 block mb-1.5">➕ เพิ่ม/ระบุจำนวนระดับชั้นเอง (Custom Level)</label>
                            <div className="flex gap-2">
                                <input 
                                    type="number" 
                                    min="2"
                                    max="100"
                                    className={inputClassHud + " font-bold"} 
                                    placeholder="ระบุ เช่น 25, 30, 50..."
                                    value={customLevelVal}
                                    onChange={e => setCustomLevelVal(e.target.value)}
                                    onKeyDown={e => { if (e.key === 'Enter') handleAddCustomLevel(); }}
                                />
                                <button 
                                    type="button" 
                                    onClick={handleAddCustomLevel}
                                    className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs whitespace-nowrap transition-all shadow-sm shrink-0 flex items-center gap-1"
                                >
                                    + เพิ่มชั้น
                                </button>
                            </div>
                        </div>
                        <div className="md:col-span-1">
                            <label className="text-xs font-bold text-slate-600 block mb-1.5">คะแนนสะสม PV ขั้นต่ำในการจ่ายปันผล (min_dividend_pv)</label>
                            <input type="number" className={inputClassHud} value={minDivPvInput} onChange={e => setMinDivPvInput(Number(e.target.value))} placeholder="100" />
                        </div>
                    </div>
                </div>
                    <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 mt-4 space-y-4">
                        <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 border-b border-slate-200/80 pb-4">
                            <div>
                                <h4 className="text-sm font-black text-slate-800 flex items-center gap-2">
                                    <span>🎯</span> ตั้งค่าเงื่อนไขยอดขายส่วนตัวขั้นต่ำ (ต่อเดือน)
                                </h4>
                                <p className="text-xs text-slate-500 font-medium mt-1">
                                    ปรับเปลี่ยนและตั้งค่าเงื่อนไขยอดขายขั้นต่ำ จากนั้นกดปุ่ม <span className="font-bold text-indigo-600">"บันทึกตั้งค่าเงื่อนไข"</span> เพื่อยืนยันใช้งาน (นับเฉพาะราคาเต็มและราคาสมาชิก)
                                </p>
                            </div>
                            
                            <div className="flex items-center gap-3 shrink-0">
                                <div className="flex items-center gap-3 bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm">
                                    <label className="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" className="sr-only peer" checked={commConditionConfig.is_enabled} onChange={e => setCommConditionConfig(prev => ({ ...prev, is_enabled: e.target.checked }))} />
                                        <div className="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-600"></div>

                                        return (
                                            <button

                                                    const cur = commConditionConfig.exclude_teams || [];
                                                    const updated = isExcluded ? cur.filter(x => x !== tName) : [...cur, tName];

                                    </label>
                                    <span className="text-[11px] font-bold text-slate-400">

                                                            type="button"

                                                                setMemberSearchQuery('');

                                                            className={`px-3 py-1 rounded-lg text-xs font-bold transition-all ${isAdded ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-amber-500 hover:bg-amber-600 text-white shadow-sm'}`}

                            </div>
                        </div>
                    </div>

                                                {/* 🚀 เครื่องมือตั้งค่าคอมมิชชั่นแบบกลุ่ม (Batch Configurator) - Ultra Clean Light Theme UI */}

                            <div>
                                <span className="text-xs font-black text-indigo-700 uppercase tracking-wider block">ขั้นตอนที่ 1: ค้นหาและเลือกสินค้าที่ต้องการปรับค่า</span>
                                <span className="text-[11px] text-slate-500 font-medium">พิมพ์ค้นหา หรือเลือกหมวดหมู่ เพื่อเลือกสินค้าเข้ากลุ่ม</span>
                            </div>
                            <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">

                                    <input 
                                        type="text" 
                                        className="w-full pl-8 pr-7 py-2 bg-white border border-slate-300 text-slate-800 rounded-xl text-xs outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 placeholder-slate-400 transition-all font-medium shadow-xs"
                                        placeholder="🔍 พิมพ์ชื่อสินค้าเพื่อค้นหา..."
                                        value={batchSearchTerm}

                                            type="button"
                                            onClick={() => setBatchSearchTerm('')}

                                            ✕
                                        </button>
                                    )}

                                <select 
                                    className="px-3 py-2 bg-white border border-slate-300 text-slate-700 rounded-xl text-xs outline-none focus:border-indigo-500 transition-all font-bold shadow-xs"

                                    onChange={e => setBatchCatFilter(e.target.value)}
                                >
                                    <option value="ALL">หมวดหมู่ทั้งหมด</option>

                                    type="button" 
                                    onClick={toggleSelectAllBatch}

                                >
                                    {filteredProdsForBatch.every(p => selectedProdIds.includes(p.id)) && filteredProdsForBatch.length > 0 ? '❌ ยกเลิกทั้งกลุ่มนี้' : '☑️ เลือกทั้งหมดในกลุ่มนี้'}
                                </button>
                                {selectedProdIds.length > 0 && (
                                    <button 
                                        type="button" 
                                        onClick={() => setSelectedProdIds([])}
                                        className="px-3 py-2 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl text-xs transition-all shadow-sm flex items-center gap-1 shrink-0 cursor-pointer"

                                        🗑️ ล้างทั้งหมด
                                    </button>

                                </span>
                            </div>

                                        return (
                                            <span 
                                                key={id} 
                                                className="inline-flex items-center gap-1.5 px-3 py-1 bg-white text-emerald-800 border border-emerald-300/80 rounded-xl text-xs font-bold shadow-xs transition-all hover:border-emerald-400"

                                                <span>{prod.name}</span>

                                                    type="button"
                                                    onClick={() => setSelectedProdIds(prev => prev.filter(pId => pId !== id))}

                                                        ? 'bg-emerald-50 border-emerald-300 text-emerald-900 shadow-xs' 
                                                        : 'bg-white border-slate-200 text-slate-700 hover:border-indigo-400 hover:bg-indigo-50/30'

                                                <div className="truncate mr-2">
                                                    <span className="block truncate font-bold">{p.name}</span>

                                                <button 
                                                    type="button"

                                                        isSelected ? 'bg-emerald-600 text-white' : 'bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-600 hover:text-white'
                                                    }`}
                                                >
                                                    {isSelected ? '✓ เลือกแล้ว' : '+ เพิ่ม'}
                                                </button>
                                            </div>
                                        );

                                        <div className="col-span-full text-center py-4 text-xs text-slate-400">

                                <button
                                    type="button"
                                    onClick={() => setBatchSearchTerm(' ')}
                                    className="px-3 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-[11px] font-bold rounded-lg border border-indigo-200 transition-all cursor-pointer"

                                    👁️ แสดงรายการสินค้าทั้งหมด ({editableProducts.length} รายการ)

                            </div>

                        <div className="bg-emerald-50/40 p-4 rounded-xl border border-emerald-200/80 space-y-2">
                            <span className="text-xs font-black text-emerald-800 block">💵 กลุ่มที่ 1: จ่ายคอมมิชชั่นจ่ายตามกล่อง (จำนวนเงิน บาท/กีบ)</span>

                                        type="text"

                                        }}

                                        <div key={`fee_${idx}`}>

                                                className="w-full p-2 bg-white border border-emerald-300 rounded-xl text-center text-xs font-bold text-emerald-800 outline-none focus:ring-2 focus:ring-emerald-400 font-mono shadow-xs"
