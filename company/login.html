<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>เข้าสู่ระบบจัดการเว็บไซต์ — LOVE STK GROUPE</title>
    <link rel="icon" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Lao:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070e1c;
            --card-bg: rgba(14, 27, 53, 0.75);
            --border-glass: rgba(255, 255, 255, 0.12);
            --primary-blue: #175bd2;
            --primary-hover: #124ab0;
            --gold-accent: #E0B840;
            --text-main: #f0f4fa;
            --text-muted: #8fa0bd;
            --error-bg: rgba(239, 68, 68, 0.15);
            --error-border: rgba(239, 68, 68, 0.35);
            --error-text: #fca5a5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Manrope', 'Noto Sans Thai', 'Noto Sans Lao', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated glowing background aura */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(23, 91, 210, 0.28) 0%, rgba(7, 14, 28, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 10s ease-in-out infinite alternate;
        }

        .bg-glow-gold {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(224, 184, 64, 0.12) 0%, rgba(7, 14, 28, 0) 70%);
            top: 20%;
            right: 15%;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 42px 36px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.05);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            margin-bottom: 14px;
        }

        .brand-mark {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #175bd2 0%, #0d3886 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 6px 20px rgba(23, 91, 210, 0.4);
        }

        .brand-mark span {
            color: var(--gold-accent);
        }

        .brand-text {
            text-align: left;
            line-height: 1.1;
        }

        .brand-text .title {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .brand-text .subtitle {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.24em;
            margin-top: 2px;
            display: block;
        }

        .login-card h1 {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .login-card .subtitle-desc {
            font-size: 13.5px;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #c9d5e8;
            letter-spacing: 0.02em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            height: 48px;
            background: rgba(7, 16, 34, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            padding: 0 16px;
            font-size: 15px;
            color: #fff;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(23, 91, 210, 0.28);
            background: rgba(7, 16, 34, 0.85);
        }

        .input-wrapper input::placeholder {
            color: #4f6385;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #fff;
        }

        .btn-submit {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, var(--primary-blue) 0%, #104ab0 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.25s ease;
            box-shadow: 0 10px 25px rgba(23, 91, 210, 0.35);
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(23, 91, 210, 0.5);
            background: linear-gradient(135deg, #1b66eb 0%, #1253c7 100%);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13.5px;
            margin-bottom: 20px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-nav {
            margin-top: 26px;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 13px;
        }

        .footer-nav a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .footer-nav a:hover {
            color: var(--gold-accent);
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="bg-glow-gold"></div>

    <div class="login-card">
        <div class="brand-header">
            <a href="index.html" class="brand-logo" title="กลับสู่หน้าหลัก">
                <div class="brand-text">
                    <div class="title">LOVE STK</div>
                    <span class="subtitle">G R O U P E</span>
                </div>
            </a>
            <h1>เข้าสู่ระบบจัดการเว็บไซต์</h1>
            <p class="subtitle-desc">ระบบจัดการเนื้อหา (CMS) — LOVE STK GROUPE</p>
        </div>

        <div id="login-error" class="error-message" role="alert"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="admin-email">อีเมลผู้ดูแลระบบ (Admin Email)</label>
                <div class="input-wrapper">
                    <input type="email" id="admin-email" placeholder="admin@stkgroupe.com" required autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label for="admin-password">รหัสผ่าน (Password)</label>
                <div class="input-wrapper">
                    <input type="password" id="admin-password" placeholder="••••••••••••" required autocomplete="current-password">
                    <button type="button" id="toggle-pwd-btn" class="toggle-password" aria-label="แสดงรหัสผ่าน">👁️</button>
                </div>
            </div>

            <button type="submit" id="btn-login" class="btn-submit">
                <span class="spinner" id="login-spinner"></span>
                <span id="btn-text">เข้าสู่ระบบ (Sign In)</span>
            </button>
        </form>

        <div class="footer-nav">
            <a href="index.html">← กลับหน้าเว็บไซต์ (Back to Home)</a>
        </div>
    </div>

    <!-- เชื่อมโยงโมดูลคอนฟิกและดาต้าเซอร์วิสของ Company -->
    <script src="config.js"></script>
    <script src="data-service.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const emailInput = document.getElementById('admin-email');
            const pwdInput = document.getElementById('admin-password');
            const togglePwdBtn = document.getElementById('toggle-pwd-btn');
            const errorBox = document.getElementById('login-error');
            const btnLogin = document.getElementById('btn-login');
            const btnText = document.getElementById('btn-text');
            const spinner = document.getElementById('login-spinner');

            // ตรวจสอบว่ามี Session อยู่แล้วหรือไม่ และยังไม่หมดอายุ
            const existingSession = window.CompanyDataService?.getSession();
            const now = Math.floor(Date.now() / 1000);
            const urlParams = new URLSearchParams(window.location.search);
            const isExpiredParam = urlParams.get('expired');

            if (isExpiredParam) {
                window.CompanyDataService?.signOut();
                errorBox.textContent = 'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่อีกครั้ง';
                errorBox.style.display = 'block';
            } else if (existingSession?.access_token) {
                if (!existingSession.expires_at || existingSession.expires_at > now) {
                    location.href = 'admin.html';
                    return;
                } else {
                    window.CompanyDataService?.signOut();
                }
            }

            // ปุ่มเปิด/ปิดการแสดงรหัสผ่าน
            togglePwdBtn.addEventListener('click', () => {
                const isPassword = pwdInput.type === 'password';
                pwdInput.type = isPassword ? 'text' : 'password';
                togglePwdBtn.textContent = isPassword ? '🙈' : '👁️';
            });

            // การส่งฟอร์มเข้าสู่ระบบ
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorBox.style.display = 'none';
                errorBox.textContent = '';

                const email = emailInput.value.trim();
                const password = pwdInput.value;

                if (!email || !password) return;

                // สถานะกำลังโหลด
                btnLogin.disabled = true;
                spinner.style.display = 'inline-block';
                btnText.textContent = 'กำลังตรวจสอบข้อมูล…';

                try {
                    if (!window.CompanyDataService) {
                        throw new Error('ไม่พบระบบเชื่อมต่อฐานข้อมูล (กรุณาตรวจสอบ data-service.js)');
                    }

                    // ล็อกอินผ่าน Supabase Auth
                    await window.CompanyDataService.signIn(email, password);

                    btnText.textContent = 'เข้าสู่ระบบสำเร็จ!';
                    setTimeout(() => {
                        const urlParams = new URLSearchParams(window.location.search);
                        const returnTo = urlParams.get('return_to') || 'admin.html';
                        window.location.href = returnTo;
                    }, 500);

                } catch (err) {
                    console.error('Login failed:', err);
                    errorBox.textContent = err.message || 'อีเมลหรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง';
                    errorBox.style.display = 'block';
                    btnLogin.disabled = false;
                    spinner.style.display = 'none';
                    btnText.textContent = 'เข้าสู่ระบบ (Sign In)';
                }
            });
        });
    </script>
</body>
</html>
