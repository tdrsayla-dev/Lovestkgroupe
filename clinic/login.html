<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Clinic System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;600;700;800&family=Kanit:wght@400;500;600&family=Sarabun:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- เรียกใช้งาน style.css -->
    <link rel="stylesheet" href="style.css">
    <!-- Login Specific Stylesheet -->
    <link rel="stylesheet" href="login.css?v=1.0">

    <!-- Config & i18n Engine -->
    <script src="config.js"></script>
    <script src="i18n.js"></script>
</head>

<body class="login-page">

    <div class="login-card position-relative">
        <!-- ตัวเลือกสลับภาษาหน้า Login -->
        <div class="position-absolute top-0 end-0 m-3">
            <select class="form-select form-select-sm clinic-lang-select shadow-xs border"
                style="font-size:0.78rem;border-radius:8px;cursor:pointer;width:140px;"
                onchange="setClinicLanguage(this.value)">
                <option value="la">LA ພາສາລາວ</option>
                <option value="th">TH ภาษาไทย</option>
                <option value="en">EN English</option>
            </select>
        </div>

        <div class="text-center mb-4 pt-2">
            <div class="login-icon">
                <i class="ph ph-hospital"></i>
            </div>
            <h3 class="fw-bold text-dark" data-i18n="app_title">ຄລີນິກ ເລີຟ ເອັສທີເຄ</h3>
            <p class="text-muted small" data-i18n="login_subtitle">ลงชื่อเข้าใช้ด้วยอีเมลและรหัสผ่านพนักงาน</p>
        </div>

        <!-- Lockout Banner (Rate Limiting) -->
        <div id="lockoutBanner" class="lockout-banner text-center fw-semibold">
            <i class="ph ph-warning-circle me-1"></i> <span id="lockoutText" data-i18n="lockout_title">ระงับการเข้าสู่ระบบชั่วคราว</span>
        </div>

        <form id="loginForm">
            <!-- 🛡️ CSRF Token (Security Feature) -->
            <input type="hidden" id="csrfToken" name="csrfToken">

            <div class="mb-3">
                <label class="form-label fw-bold text-dark small" data-i18n="staff_email">อีเมลพนักงาน</label>
                <div class="input-group">
                    <span class="input-group-text border-end-0"><i class="ph ph-envelope"></i></span>
                    <input type="email" id="loginEmail" class="form-control custom-input border-start-0 ps-0"
                        placeholder="example@clinic.com" data-i18n-placeholder="login_email_placeholder" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold text-dark small" data-i18n="staff_password">รหัสผ่าน</label>
                <div class="input-group">
                    <span class="input-group-text border-end-0"><i class="ph ph-lock"></i></span>
                    <input type="password" id="loginPassword" class="form-control custom-input border-start-0 ps-0"
                        placeholder="••••••••" data-i18n-placeholder="login_password_placeholder" required>
                </div>
            </div>

            <!-- Checkbox: Remember Me -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox" id="rememberMe" style="cursor: pointer;">
                    <label class="form-check-label text-dark small fw-semibold" for="rememberMe"
                        style="cursor: pointer; user-select: none;" data-i18n="remember_me">
                        จดจำฉันไว้ (Remember Me)
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold" id="loginBtn" data-i18n="login_button"
                style="border-radius: 12px;">
                <i class="ph ph-sign-in me-1"></i> เข้าสู่ระบบ
            </button>
        </form>
    </div>

    <!-- 📱 Custom OTP Verification Modal (100% Match with Reference) -->
    <div id="otpModalOverlay" class="otp-modal-overlay">
        <div class="otp-modal-box">
            <div class="otp-modal-title">
                ກະລຸນາປ້ອນລະຫັດຢືນຢັນ OTP<br>ເພື່ອເຂົ້າລະບົບຢ່າງປອດໄພ
            </div>

            <div class="otp-display-card">
                <span id="otpGeneratedDisplay" class="otp-number-text">837130</span>
            </div>

            <div class="otp-input-wrapper">
                <input type="text" id="otpCodeInput" class="otp-code-input" maxlength="6" inputmode="numeric"
                    pattern="[0-9]*" placeholder="ປ້ອນລະຫັດ 6 ຫຼັກບ່ອນນີ້" autocomplete="one-time-code">
                <div id="otpErrorText" class="otp-error-text" style="display: none;">ລະຫັດ OTP ບໍ່ຖືກຕ້ອງ ກະລຸນາລອງໃໝ່
                </div>
            </div>

            <div class="otp-btn-group">
                <button type="button" id="otpConfirmBtn" class="otp-btn-confirm">ຢືນຢັນ</button>
                <button type="button" id="otpCancelBtn" class="otp-btn-cancel">ຍົກເລີກ</button>
            </div>
        </div>
    </div>

    <!-- ❌ Custom Login Error Alert Modal (100% Match with Reference) -->
    <div id="loginErrorModalOverlay" class="login-error-modal-overlay">
        <div class="login-error-modal-box">
            <div class="login-error-icon-circle">
                <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2.6" stroke-linecap="round"
                    stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>

            <h3 id="loginErrorTitle" class="login-error-title">ເຂົ້າລະບົບບໍ່ສຳເລັດ</h3>
            <p id="loginErrorSubtitle" class="login-error-subtitle">ກະລຸນາກວດສອບ ອີເມວ ແລະ ລະຫັດຜ່ານໃຫ້ຖືກຕ້ອງ</p>
            <p id="loginErrorWarning" class="login-error-warning">“ທ່ານສາມາດລອງໄດ້ອີກສອງຄັ້ງ ”</p>

            <div class="login-error-btn-container">
                <button type="button" id="loginErrorOkBtn" class="login-error-btn-ok">OK</button>
            </div>
        </div>
    </div>

    <!-- Login Specific Logic -->
    <script src="login.js?v=1.0"></script>
</body>

</html>
