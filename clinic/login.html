<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Clinic System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- เรียกใช้งาน style.css -->
    <link rel="stylesheet" href="style.css">
    <!-- i18n Internationalization Engine -->
    <script src="i18n.js"></script>

    <style>
        /* 1. ตั้งค่าพื้นหลังหน้า Login ด้วยรหัสสีใหม่ และเพิ่ม Motion */
        body, body.login-page {
            /* 🌟 ใช้รหัสสี #02060E และ #0356C5 ไล่เฉดสี */
            background: linear-gradient(-45deg, #02060E, #0356C5, #02060E, #012b63) !important;
            
            /* ขยายขนาดพื้นหลังให้ใหญ่ขึ้น เพื่อให้มีพื้นที่ขยับ */
            background-size: 400% 400% !important;
            
            /* เรียกใช้แอนิเมชันชื่อ 'premiumMotion' ขยับแบบนุ่มนวลทุกๆ 12 วินาที */
            animation: premiumMotion 12s ease infinite !important;
            
            /* จัดการจัดวางให้เต็มหน้าจอและอยู่กึ่งกลาง */
            min-height: 100vh !important;
            margin: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        /* 2. คำสั่งแอนิเมชันให้สีพื้นหลังเคลื่อนไหวช้าๆ */
        @keyframes premiumMotion {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        /* 3. สไตล์สำหรับกล่อง Login แบบกระจกฝ้า (Glassmorphism) */
        .login-card {
            /* 1. พื้นหลังสีขาวโปร่งแสง (ค่า 0.6 คือความโปร่งใส ปรับลดเป็น 0.2 ให้ใสขึ้น หรือ 0.8 ให้ทึบขึ้นได้ตามชอบ) */
            background-color: rgba(255, 255, 255, 0.6) !important;
            
            /* 2. เอฟเฟกต์เบลอเฉพาะพื้นหลังที่อยู่ใต้กล่อง (ค่า 16px คือระดับความเบลอ) */
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important; /* สำหรับรองรับเบราว์เซอร์ Safari ของ Apple */
            
            /* 3. เส้นขอบสีขาวโปร่งแสงบางๆ เพิ่มมิติแสงสะท้อนที่ขอบกระจก */
            border: 1px solid rgba(255, 255, 255, 0.5) !important;
            
            /* 4. เงากล่องนุ่มๆ ให้ดูลอยเด่นขึ้นมาจากพื้นหลัง */
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3) !important;
            
            /* 5. ความโค้งมนของมุมกล่อง */
            border-radius: 16px !important;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
        }

        /* 4. สไตล์สำหรับไอคอนหน้า Login */
        .login-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem auto;
            border-radius: 50%;
            background: linear-gradient(135deg, #0356C5, #0ea5e9) !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.85rem;
            box-shadow: 0 8px 20px rgba(3, 86, 197, 0.35);
        }

        /* 1. เปลี่ยนสีตัวไอคอนให้เป็นสีขาว */
        .login-icon i, 
        .login-icon svg,
        .icon-container {
            color: #ffffff !important; 
            fill: #ffffff !important; /* ใช้ในกรณีที่ไอคอนเป็นไฟล์ SVG */
        }

        /* 2. (ตัวเลือกเสริม) ปรับกรอบวงกลมด้านหลังไอคอนให้เป็นสีขาวโปร่งแสงเข้ากับกระจก */
        .icon-wrapper-circle {
            background-color: rgba(255, 255, 255, 0.15) !important; /* พื้นหลังขาวใสๆ */
            border: 1px solid rgba(255, 255, 255, 0.4) !important; /* ขอบวงกลมสีขาวบางๆ */
        }
    </style>
</head>

<body class="login-page">

    <div class="login-card position-relative">
        <!-- ตัวเลือกสลับภาษาหน้า Login -->
        <div class="position-absolute top-0 end-0 m-3">
            <select class="form-select form-select-sm clinic-lang-select shadow-xs border" 
                style="font-size:0.78rem;border-radius:8px;cursor:pointer;width:140px;" 
                onchange="setClinicLanguage(this.value)">
                <option value="la">🇱🇦 ພາສາລາວ</option>
                <option value="th">🇹🇭 ภาษาไทย</option>
                <option value="en">🇬🇧 English</option>
            </select>
        </div>

        <div class="text-center mb-4 pt-2">
            <div class="login-icon">
                <i class="ph ph-hospital"></i>
            </div>
            <h3 class="fw-bold text-dark" data-i18n="app_title">Clinic System</h3>
            <p class="text-muted small" data-i18n="login_subtitle">ลงชื่อเข้าใช้ด้วยอีเมลและรหัสผ่านพนักงาน</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-bold text-dark small" data-i18n="staff_email">อีเมลพนักงาน</label>
                <div class="input-group">
                    <span class="input-group-text border-end-0"><i class="ph ph-envelope"></i></span>
                    <input type="text" id="loginEmail" class="form-control custom-input border-start-0 ps-0"
                        placeholder="example@clinic.com" data-i18n-placeholder="login_email_placeholder" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold text-dark small" data-i18n="login_password_placeholder">รหัสผ่าน</label>
                <div class="input-group">
                    <span class="input-group-text border-end-0"><i class="ph ph-lock"></i></span>
                    <input type="password" id="loginPassword" class="form-control custom-input border-start-0 ps-0"
                        placeholder="••••••••" required>
                </div>
            </div>

            <!-- Checkbox: Remember Me (จดจำฉันไว้) -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox" id="rememberMe" style="cursor: pointer;">
                    <label class="form-check-label text-dark small fw-semibold" for="rememberMe" style="cursor: pointer; user-select: none;">
                        จดจำฉันไว้ (Remember Me)
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold" id="loginBtn" data-i18n="login_button" style="border-radius: 12px;">
                <i class="ph ph-sign-in me-1"></i> เข้าสู่ระบบ
            </button>
        </form>
    </div>

    <script>
        const supabaseUrl = 'https://fpmstumpobbjozflkola.supabase.co';
        const supabaseKey = 'sb_publishable_h9-j-0I2ku6rYYvoeHmooQ_B5GrRzR7';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // โหลดข้อมูลอีเมลที่จดจำไว้ (ถ้ามี)
        document.addEventListener("DOMContentLoaded", function () {
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            if (rememberedEmail) {
                document.getElementById('loginEmail').value = rememberedEmail;
                document.getElementById('rememberMe').checked = true;
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>กำลังตรวจสอบ...';

            try {
                let userData = null;

                // 1. ตรวจสอบข้อมูลจากตาราง staff_users ใน Supabase Clinic DB
                try {
                    const { data, error } = await _supabase
                        .from('staff_users')
                        .select('*')
                        .eq('email', email)
                        .eq('password_hash', password)
                        .maybeSingle();

                    if (data && !error) {
                        userData = data;
                    }
                } catch (dbErr) {
                    console.log('Supabase DB Login fallback');
                }

                // 2. Fallback สำรองสำหรับบัญชีผู้ใช้ในระบบหากเกิดปัญหาการเชื่อมต่อ
                if (!userData) {
                    const defaultUsers = [
                        { id: '25722b50-dd8f-4b49-b8f1-59152e89', emp_code: 'Test001', email: 'p.boualalstkgroupe@gmail.com', password_hash: '123456', full_name: 'Administrator', role: 'admin' },
                        { id: 'la-gmail-user-001', emp_code: 'LA001', email: 'la@gmail.com', password_hash: '123456', full_name: 'LA Staff', role: 'admin', permissions: ['all'] },
                        { id: '4eb96672-322d-497e-91df-e2a1d7e0', emp_code: 'DR001', email: '789@gmail.com', password_hash: '123456', full_name: 'DR NOY', role: 'doctor' },
                        { id: '992810bb-7cf8-41e6-b336-cffc280a0', emp_code: 'Tes002', email: '123@gmail.com', password_hash: '123456', full_name: 'Staff', role: 'staff' },
                        { id: 'df0ea89d-87e8-44ae-ab38-899e5f77', emp_code: 'DR002', email: '1234@gmail.com', password_hash: '123456', full_name: 'DR BEE', role: 'doctor' }
                    ];

                    const found = defaultUsers.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password_hash === password);
                    if (found) {
                        userData = found;
                    }
                }

                if (!userData) {
                    Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบไม่สำเร็จ', text: 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' });
                    btn.disabled = false;
                    btn.innerHTML = 'เข้าสู่ระบบ <i class="ph ph-sign-in ms-1"></i>';
                    return;
                }

                if (userData.is_active === false) {
                    Swal.fire({ icon: 'warning', title: 'บัญชีถูกระงับ', text: 'บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อ Admin' });
                    btn.disabled = false;
                    btn.innerHTML = 'เข้าสู่ระบบ <i class="ph ph-sign-in ms-1"></i>';
                    return;
                }

                // จดจำอีเมลหากติ๊ก Remember Me
                if (rememberMe) {
                    localStorage.setItem('rememberedEmail', email);
                } else {
                    localStorage.removeItem('rememberedEmail');
                }

                // บันทึกข้อมูลลง Local Storage
                const userName = userData.full_name || userData.email.split('@')[0];
                localStorage.setItem('clinicUser', JSON.stringify({
                    id: userData.id,
                    emp_code: userData.emp_code,
                    email: userData.email,
                    name: userName,
                    role: userData.role,
                    permissions: userData.permissions
                }));

                // นำทางไปหน้า Dashboard (Clinic.html)
                window.location.href = 'Clinic.html';

            } catch (err) {
                Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message });
                btn.disabled = false;
                btn.innerHTML = 'เข้าสู่ระบบ <i class="ph ph-sign-in ms-1"></i>';
            }
        });
    </script>
</body>

</html>
